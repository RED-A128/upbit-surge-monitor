name: Upbit OHLCV History Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Backfill mode"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - all

      market:
        description: "Market for single mode (example: KRW-BTC)"
        required: false
        default: "KRW-BTC"
        type: string

      confirm_all:
        description: "For ALL mode only: type RUN-ALL"
        required: false
        default: ""
        type: string


permissions:
  contents: read


concurrency:
  group: upbit-history-backfill
  cancel-in-progress: false


jobs:

  backfill:

    name: OHLCV History Backfill

    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:


      # ============================================================
      # 1. SHOW REQUEST
      # ============================================================

      - name: Show backfill request
        run: |
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR - OHLCV HISTORY BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project:"
          Write-Host "Upbit Surge Monitor - Clean V001"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "${{ github.repository }}"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "${{ runner.name }}"
          Write-Host ""

          Write-Host "Runner OS:"
          Write-Host "${{ runner.os }}"
          Write-Host ""

          Write-Host "Requested mode:"
          Write-Host "${{ inputs.mode }}"
          Write-Host ""

          Write-Host "Requested market:"
          Write-Host "${{ inputs.market }}"
          Write-Host ""

          Write-Host "Local project:"
          Write-Host "$env:PROJECT_DIR"
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 2. VALIDATE USER INPUT
      # ============================================================

      - name: Validate backfill request
        run: |
          $mode = "${{ inputs.mode }}"
          $market = "${{ inputs.market }}"
          $confirmAll = "${{ inputs.confirm_all }}"

          Write-Host "============================================================"
          Write-Host "BACKFILL REQUEST VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          if ($mode -eq "single") {

              if ([string]::IsNullOrWhiteSpace($market)) {
                  Write-Host "[FAIL] Market is required in single mode."
                  exit 1
              }

              $market = $market.Trim().ToUpper()

              if ($market -notmatch '^KRW-[A-Z0-9]+$') {
                  Write-Host "[FAIL] Invalid market format."
                  Write-Host ""
                  Write-Host "Received:"
                  Write-Host $market
                  Write-Host ""
                  Write-Host "Expected example:"
                  Write-Host "KRW-BTC"
                  exit 1
              }

              Write-Host "[PASS] SINGLE mode request accepted."
              Write-Host "Market: $market"
          }
          elseif ($mode -eq "all") {

              if ($confirmAll -ne "RUN-ALL") {
                  Write-Host "[FAIL] ALL mode requires explicit confirmation."
                  Write-Host ""
                  Write-Host "To run all KRW markets:"
                  Write-Host "confirm_all must be exactly:"
                  Write-Host ""
                  Write-Host "RUN-ALL"
                  exit 1
              }

              Write-Host "[PASS] ALL mode confirmation accepted."
              Write-Host ""
              Write-Host "WARNING:"
              Write-Host "All current Upbit KRW markets will be processed."
          }
          else {
              Write-Host "[FAIL] Unsupported mode: $mode"
              exit 1
          }

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 3. VERIFY LOCAL PROJECT
      # ============================================================

      - name: Verify local project repository
        run: |
          $project = $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "LOCAL PROJECT CHECK"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[FAIL] Local project directory not found."
              Write-Host $project
              exit 1
          }

          if (-not (Test-Path "$project\.git")) {
              Write-Host "[FAIL] .git directory not found."
              Write-Host ""
              Write-Host "Expected:"
              Write-Host "$project\.git"
              exit 1
          }

          Set-Location $project

          $branch = git branch --show-current

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine Git branch."
              exit 1
          }

          Write-Host "Current branch:"
          Write-Host $branch
          Write-Host ""

          if ($branch -ne "main") {
              Write-Host "[FAIL] Local repository must be on main."
              exit 1
          }

          Write-Host "[PASS] Local repository found."
          Write-Host "[PASS] Current branch is main."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 4. FETCH ORIGIN FIRST
      # ============================================================
      #
      # IMPORTANT:
      #
      # Fetch does NOT modify the local working tree.
      # Fetch does NOT delete local OHLCV data.
      #
      # We fetch first so that the latest origin/main and its
      # .gitignore rules can be inspected before synchronization.
      #
      # ============================================================

      - name: Fetch origin safely
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SAFE ORIGIN FETCH"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Fetching origin..."
          git fetch origin

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] git fetch origin failed."
              exit 1
          }

          $local = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read local HEAD."
              exit 1
          }

          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read origin/main."
              exit 1
          }

          Write-Host ""
          Write-Host "Local HEAD:"
          Write-Host $local
          Write-Host ""

          Write-Host "Origin/main:"
          Write-Host $remote
          Write-Host ""

          Write-Host "[PASS] Origin fetched without modifying local files."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 5. VERIFY REMOTE DATA PROTECTION RULES
      # ============================================================

      - name: Verify origin main data protection rules
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "ORIGIN MAIN DATA PROTECTION CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $remoteGitignore = git show origin/main:.gitignore

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read .gitignore from origin/main."
              exit 1
          }

          $requiredRules = @(
              "data/ohlcv/",
              "data/collector_status.csv",
              "data/features/",
              "data/latest_features.csv",
              "data/datasets/",
              "data/training/",
              "data/backtest/",
              "data/cache/",
              "models/",
              "reports/",
              "output/",
              "outputs/"
          )

          $failed = $false

          foreach ($rule in $requiredRules) {

              $found = $false

              foreach ($line in $remoteGitignore) {
                  if ($line.Trim() -eq $rule) {
                      $found = $true
                      break
                  }
              }

              if ($found) {
                  Write-Host "[FOUND] $rule"
              }
              else {
                  Write-Host "[MISSING] $rule"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] origin/main does not contain all required data protection rules."
              Write-Host ""
              Write-Host "Synchronization stopped."
              Write-Host "No local data was deleted."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] origin/main protects local runtime data."
          Write-Host "[PASS] data/ohlcv/ is ignored by the remote repository rules."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 6. VERIFY NO TRACKED LOCAL SOURCE CHANGES
      # ============================================================
      #
      # We intentionally check TRACKED changes only here.
      #
      # Untracked runtime data such as data/ohlcv may still appear
      # before the latest .gitignore is merged locally.
      #
      # Tracked source changes must never be overwritten.
      #
      # ============================================================

      - name: Protect tracked local source changes
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "TRACKED LOCAL SOURCE SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $unstaged = @(git diff --name-only)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect unstaged tracked changes."
              exit 1
          }

          $staged = @(git diff --cached --name-only)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect staged tracked changes."
              exit 1
          }

          $trackedChanges = @(
              $unstaged
              $staged
          ) |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              Sort-Object -Unique

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Tracked local changes were detected."
              Write-Host ""
              Write-Host "Files:"

              foreach ($file in $trackedChanges) {
                  Write-Host "  $file"
              }

              Write-Host ""
              Write-Host "Backfill stopped before synchronization."
              Write-Host ""
              Write-Host "No reset was performed."
              Write-Host "No checkout overwrite was performed."
              Write-Host "No local source change was deleted."
              exit 1
          }

          Write-Host "[PASS] No tracked local source changes detected."
          Write-Host ""

          Write-Host "Current Git status:"
          git status --short

          Write-Host ""
          Write-Host "NOTE:"
          Write-Host "Untracked runtime data is not deleted by this workflow."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 7. VERIFY FAST-FORWARD IS POSSIBLE
      # ============================================================

      - name: Verify fast forward synchronization
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FAST-FORWARD SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $local = git rev-parse HEAD
          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine repository revisions."
              exit 1
          }

          Write-Host "Local:"
          Write-Host $local
          Write-Host ""

          Write-Host "Remote:"
          Write-Host $remote
          Write-Host ""

          if ($local -eq $remote) {
              Write-Host "[PASS] Local main already matches origin/main."
              Write-Host ""
              Write-Host "============================================================"
              exit 0
          }

          git merge-base --is-ancestor HEAD origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Local main cannot be safely fast-forwarded."
              Write-Host ""
              Write-Host "Possible reason:"
              Write-Host "Local and remote history have diverged."
              Write-Host ""
              Write-Host "No reset or forced synchronization will be used."
              exit 1
          }

          Write-Host "[PASS] Fast-forward synchronization is safe."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 8. SYNCHRONIZE LOCAL REPOSITORY
      # ============================================================

      - name: Synchronize local repository
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "LOCAL REPOSITORY SYNCHRONIZATION"
          Write-Host "============================================================"
          Write-Host ""

          $localBefore = git rev-parse HEAD
          $remote = git rev-parse origin/main

          Write-Host "Local before:"
          Write-Host $localBefore
          Write-Host ""

          Write-Host "Origin/main:"
          Write-Host $remote
          Write-Host ""

          if ($localBefore -eq $remote) {

              Write-Host "[INFO] Local main is already synchronized."

          }
          else {

              Write-Host "Fast-forwarding local main..."
              Write-Host ""

              git merge --ff-only origin/main

              if ($LASTEXITCODE -ne 0) {
                  Write-Host ""
                  Write-Host "[FAIL] Fast-forward synchronization failed."
                  Write-Host ""
                  Write-Host "No reset was attempted."
                  Write-Host "No forced checkout was attempted."
                  Write-Host "No local OHLCV data was deleted."
                  exit 1
              }
          }

          $localAfter = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read synchronized local commit."
              exit 1
          }

          Write-Host ""
          Write-Host "Local after:"
          Write-Host $localAfter
          Write-Host ""

          if ($localAfter -ne $remote) {
              Write-Host "[FAIL] Local main does not match origin/main."
              exit 1
          }

          Write-Host "[PASS] Local repository synchronized with origin/main."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 9. VERIFY WORKING TREE AFTER SYNCHRONIZATION
      # ============================================================

      - name: Verify synchronized working tree
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "POST-SYNCHRONIZATION WORKING TREE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $status = @(git status --porcelain)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect Git working tree."
              exit 1
          }

          if ($status.Count -gt 0) {

              Write-Host "[FAIL] Git working tree still contains unexpected changes."
              Write-Host ""
              Write-Host "Current status:"
              git status --short
              Write-Host ""
              Write-Host "Backfill stopped."
              Write-Host ""
              Write-Host "No reset or cleanup will be performed automatically."
              exit 1
          }

          Write-Host "[PASS] Working tree is clean after synchronization."
          Write-Host "[PASS] Ignored OHLCV runtime data is preserved."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 10. VERIFY OHLCV DATA STILL EXISTS
      # ============================================================

      - name: Verify preserved OHLCV data
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "OHLCV PRESERVATION CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          $failed = $false

          foreach ($directory in $directories) {

              if (Test-Path $directory) {

                  $count = @(
                      Get-ChildItem $directory -Filter "KRW-*.csv" -File
                  ).Count

                  Write-Host "[FOUND] $directory"
                  Write-Host "        KRW CSV files: $count"

                  if ($count -eq 0) {
                      Write-Host "        [FAIL] No KRW CSV files found."
                      $failed = $true
                  }
              }
              else {
                  Write-Host "[MISSING] $directory"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] Local OHLCV history is missing or incomplete."
              Write-Host "Backfill will not start."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Existing local OHLCV history is preserved."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 11. VERIFY REQUIRED FILES
      # ============================================================

      - name: Verify required project files
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "REQUIRED PROJECT FILE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "backfill_history.py",
              "collector.py",
              "validate_collector.py",
              "data_history_audit.py",
              "requirements.txt"
          )

          $failed = $false

          foreach ($file in $files) {
              if (Test-Path $file) {
                  Write-Host "[FOUND] $file"
              }
              else {
                  Write-Host "[MISSING] $file"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] Required project files are missing."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] All required project files are present."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 12. VERIFY PYTHON
      # ============================================================

      - name: Verify Python
        run: |
          Write-Host "============================================================"
          Write-Host "PYTHON CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Windows Python launcher 'py' is unavailable."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python is available."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 13. INSTALL REQUIREMENTS
      # ============================================================

      - name: Install requirements
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "REQUIREMENTS CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py -m pip install --disable-pip-version-check -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Requirement installation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Requirements are available."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 14. VERIFY OHLCV DIRECTORIES
      # ============================================================

      - name: Verify OHLCV directories
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "OHLCV DIRECTORY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          $failed = $false

          foreach ($directory in $directories) {
              if (Test-Path $directory) {
                  Write-Host "[FOUND] $directory"
              }
              else {
                  Write-Host "[MISSING] $directory"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] Required OHLCV directories are missing."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] H1/H4/D1 directories are present."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 15. VERIFY SINGLE-MARKET SOURCE DATA
      # ============================================================

      - name: Verify single-market source data
        if: ${{ inputs.mode == 'single' }}
        run: |
          $project = $env:PROJECT_DIR
          $market = "${{ inputs.market }}".Trim().ToUpper()

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SINGLE MARKET SOURCE DATA CHECK"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Market:"
          Write-Host $market
          Write-Host ""

          $files = @(
              "data\ohlcv\h1\$market.csv",
              "data\ohlcv\h4\$market.csv",
              "data\ohlcv\d1\$market.csv"
          )

          $failed = $false

          foreach ($file in $files) {
              if (Test-Path $file) {
                  $item = Get-Item $file

                  Write-Host "[FOUND] $file"
                  Write-Host "        Size: $($item.Length) bytes"
              }
              else {
                  Write-Host "[MISSING] $file"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] Existing H1/H4/D1 source data is required."
              Write-Host "Backfill will not be started."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Existing source files confirmed."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 16. VERIFY ALL-MARKET SOURCE DATA
      # ============================================================

      - name: Verify all-market source data
        if: ${{ inputs.mode == 'all' }}
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "ALL MARKET SOURCE DATA CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $h1 = @(Get-ChildItem "data\ohlcv\h1" -Filter "KRW-*.csv" -File)
          $h4 = @(Get-ChildItem "data\ohlcv\h4" -Filter "KRW-*.csv" -File)
          $d1 = @(Get-ChildItem "data\ohlcv\d1" -Filter "KRW-*.csv" -File)

          Write-Host "H1 files: $($h1.Count)"
          Write-Host "H4 files: $($h4.Count)"
          Write-Host "D1 files: $($d1.Count)"
          Write-Host ""

          if (
              $h1.Count -eq 0 -or
              $h4.Count -eq 0 -or
              $d1.Count -eq 0
          ) {
              Write-Host "[FAIL] One or more OHLCV timeframes contain no KRW CSV files."
              exit 1
          }

          $h1Markets = @($h1.BaseName | Sort-Object -Unique)
          $h4Markets = @($h4.BaseName | Sort-Object -Unique)
          $d1Markets = @($d1.BaseName | Sort-Object -Unique)

          $h1Text = $h1Markets -join "`n"
          $h4Text = $h4Markets -join "`n"
          $d1Text = $d1Markets -join "`n"

          if (($h1Text -ne $h4Text) -or ($h1Text -ne $d1Text)) {
              Write-Host "[FAIL] H1/H4/D1 stored market sets are different."
              Write-Host ""
              Write-Host "Run collector validation before ALL backfill."
              exit 1
          }

          Write-Host "[PASS] Stored H1/H4/D1 market sets match."
          Write-Host "[PASS] Stored market count: $($h1Markets.Count)"
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 17. PRE-BACKFILL VALIDATION
      # ============================================================

      - name: Run pre-backfill collector validation
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "PRE-BACKFILL COLLECTOR VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          py validate_collector.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Existing OHLCV data did not pass validation."
              Write-Host "Backfill will not start."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] Pre-backfill validation passed."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 18. RUN SINGLE MARKET BACKFILL
      # ============================================================

      - name: Run single-market history backfill
        if: ${{ inputs.mode == 'single' }}
        run: |
          $project = $env:PROJECT_DIR
          $market = "${{ inputs.market }}".Trim().ToUpper()

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SINGLE MARKET HISTORY BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Market:"
          Write-Host $market
          Write-Host ""

          Write-Host "Command:"
          Write-Host "py backfill_history.py --market $market"
          Write-Host ""

          py backfill_history.py --market $market

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Backfill exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Single-market backfill failed."
              Write-Host ""
              Write-Host "Previously saved batch checkpoints are preserved."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] Single-market backfill completed."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 19. RUN ALL MARKET BACKFILL
      # ============================================================

      - name: Run all-market history backfill
        if: ${{ inputs.mode == 'all' }}
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "ALL MARKET HISTORY BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "WARNING:"
          Write-Host "This execution processes all current Upbit KRW markets."
          Write-Host ""

          Write-Host "Command:"
          Write-Host "py backfill_history.py"
          Write-Host ""

          py backfill_history.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Backfill exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] All-market backfill did not complete normally."
              Write-Host ""
              Write-Host "IMPORTANT:"
              Write-Host "Existing OHLCV data is not deleted."
              Write-Host "Previously completed batch checkpoints remain saved."
              Write-Host "The next execution can resume according to backfill_history.py."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] All-market backfill completed."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 20. VERIFY BACKFILL STATUS FILE
      # ============================================================

      - name: Verify backfill status
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "BACKFILL STATUS CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $statusFile = "data\backfill_status.csv"

          if (-not (Test-Path $statusFile)) {
              Write-Host "[FAIL] Backfill status file not found."
              Write-Host ""
              Write-Host "Expected:"
              Write-Host $statusFile
              exit 1
          }

          $item = Get-Item $statusFile

          Write-Host "[FOUND] $statusFile"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host ""

          if ($item.Length -le 0) {
              Write-Host "[FAIL] Backfill status file is empty."
              exit 1
          }

          Write-Host "[PASS] Backfill status file exists."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 21. POST-BACKFILL COLLECTOR VALIDATION
      # ============================================================

      - name: Run post-backfill collector validation
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "POST-BACKFILL COLLECTOR VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          py validate_collector.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Post-backfill collector validation failed."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] Post-backfill collector validation passed."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 22. POST-BACKFILL DATA HISTORY AUDIT
      # ============================================================

      - name: Run post-backfill data history audit
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "POST-BACKFILL DATA HISTORY AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          py data_history_audit.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Audit exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Data history audit failed."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] Data history audit completed."
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 23. FINAL LOCAL STATUS
      # ============================================================

      - name: Show final local repository status
        if: always()
        run: |
          $project = $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FINAL LOCAL PROJECT STATUS"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[INFO] Local project path unavailable."
              exit 0
          }

          Set-Location $project

          Write-Host "Current commit:"
          git rev-parse HEAD
          Write-Host ""

          Write-Host "Git status:"
          git status --short
          Write-Host ""

          Write-Host "IMPORTANT:"
          Write-Host "Backfilled OHLCV data remains on the local PC."
          Write-Host "This workflow does NOT automatically commit data."
          Write-Host "This workflow does NOT automatically push data."
          Write-Host "This workflow does NOT delete existing OHLCV history."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 24. COMPLETED
      # ============================================================

      - name: Backfill completed
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT OHLCV HISTORY BACKFILL COMPLETED"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Mode:"
          Write-Host "${{ inputs.mode }}"
          Write-Host ""

          if ("${{ inputs.mode }}" -eq "single") {
              Write-Host "Market:"
              Write-Host "${{ inputs.market }}".ToUpper()
              Write-Host ""
          }

          Write-Host "[PASS] Repository synchronization completed safely."
          Write-Host "[PASS] Existing OHLCV data was preserved."
          Write-Host "[PASS] Existing OHLCV data passed pre-validation."
          Write-Host "[PASS] Historical backfill completed."
          Write-Host "[PASS] Existing OHLCV data passed post-validation."
          Write-Host "[PASS] Data history audit completed."
          Write-Host ""

          Write-Host "Local OHLCV:"
          Write-Host "$env:PROJECT_DIR\data\ohlcv"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "Existing data deletion : DISABLED"
          Write-Host "Git reset --hard       : DISABLED"
          Write-Host "Git clean              : DISABLED"
          Write-Host "Forced Git sync        : DISABLED"
          Write-Host "Automatic Git commit   : DISABLED"
          Write-Host "Automatic Git push     : DISABLED"
          Write-Host "Trading                : DISABLED"
          Write-Host ""

          Write-Host "============================================================"
