name: evaluate_pattern_256_matched_comparison.yml

on:
  workflow_dispatch:
    inputs:
      period:
        description: Calendar matching period
        required: true
        default: month
        type: choice
        options:
          - month
          - quarter

permissions:
  contents: read

concurrency:
  group: pattern-256-matched-comparison
  cancel-in-progress: false

jobs:
  matched-comparison:
    name: matched-comparison
    runs-on: [self-hosted, Windows]
    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:
      SOURCE_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      SOURCE_RELATIVE: 'data/reports/pattern_256_accumulation_candidate_independent_backtest/backtest_trades.csv'
      OUTPUT_RELATIVE: 'data/reports/pattern_256_matched_comparison'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Validate analysis script
        run: |
          $ErrorActionPreference = "Stop"

          $script = "audit_pattern_256_matched_comparison.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

      - name: Validate source CSV
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:SOURCE_ROOT $env:SOURCE_RELATIVE

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Source CSV missing: $source"
          }

          $item = Get-Item -LiteralPath $source

          if ($item.Length -le 0) {
            throw "Source CSV empty"
          }

          Write-Host "Source: $source"
          Write-Host "Bytes: $($item.Length)"

      - name: Run matched comparison
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:SOURCE_ROOT $env:SOURCE_RELATIVE

          $period = "${{ inputs.period }}"

          py audit_pattern_256_matched_comparison.py `
            --root "." `
            --source "$source" `
            --output "$env:OUTPUT_RELATIVE" `
            --period "$period"

          if ($LASTEXITCODE -ne 0) {
            throw "Matched comparison failed"
          }

      - name: Validate reports and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $dir = $env:OUTPUT_RELATIVE

          $resultPath = Join-Path $dir "matched_comparison_result.json"
          $manifestPath = Join-Path $dir "matched_comparison_manifest.json"
          $comparisonPath = Join-Path $dir "matched_comparison.csv"

          foreach ($path in @(
            $resultPath,
            $manifestPath,
            $comparisonPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing report: $path"
            }
          }

          $result = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Unexpected result version"
          }

          if ($manifest.version -ne "Clean V001") {
            throw "Unexpected manifest version"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Execution status is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unsafe trading approval"
          }

          if ($result.invalid_rows -ne 0) {
            throw "Invalid source rows detected"
          }

          if ($result.conflicting_duplicates -ne 0) {
            throw "Conflicting duplicate events"
          }

          if ($result.comparison_rows -le 0) {
            throw "No comparison rows"
          }

          $source = Join-Path $env:SOURCE_ROOT $env:SOURCE_RELATIVE

          $sourceHash = (
            Get-FileHash -LiteralPath $source -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($sourceHash -ne $manifest.source_sha256) {
            throw "Source SHA256 mismatch"
          }

          foreach ($name in @(
            "matched_comparison_result.json",
            "matched_comparison.csv"
          )) {
            $path = Join-Path $dir $name

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $manifest.output_sha256.$name

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $name"
            }
          }

          Write-Host "========================================"
          Write-Host "MATCHED COMPARISON VERIFIED"
          Write-Host "========================================"
          Write-Host "Source rows: $($result.source_rows)"
          Write-Host "Eligible rows: $($result.eligible_rows)"
          Write-Host "Unique events: $($result.unique_events)"
          Write-Host "Matched market-periods: $($result.matched_market_periods)"
          Write-Host "Comparison rows: $($result.comparison_rows)"
          Write-Host "Research decision: HOLD"
          Write-Host "========================================"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path $env:OUTPUT_RELATIVE "matched_comparison_result.json"

          $result = Get-Content -LiteralPath $path -Raw |
            ConvertFrom-Json

          @"
          # Pattern 256 Matched Comparison

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Matching period | $($result.period_mode) |
          | Source rows | $($result.source_rows) |
          | Eligible rows | $($result.eligible_rows) |
          | Unique events | $($result.unique_events) |
          | Matched market-periods | $($result.matched_market_periods) |
          | Comparison rows | $($result.comparison_rows) |
          | Research decision | $($result.research_decision) |
          | Statistical independence proven | $($result.statistical_independence_proven) |
          | Live trading approved | $($result.approved_for_live_trading) |

          Full results are available in the artifact.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload matched comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-matched-comparison-v001
          path: |
            data/reports/pattern_256_matched_comparison/matched_comparison.csv
            data/reports/pattern_256_matched_comparison/matched_comparison_result.json
            data/reports/pattern_256_matched_comparison/matched_comparison_manifest.json
          if-no-files-found: warn
          retention-days: 30
