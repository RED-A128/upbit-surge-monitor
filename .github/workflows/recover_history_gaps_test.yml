# ============================================================
# Upbit Surge Monitor
# recover_history_gaps_test.yml
# Clean V003
#
# Target:
#   recover_history_gaps.py - Clean V003
#
# Purpose:
#   Historical Gap 실제 복구 전에 PREVIEW 모드로
#   전체 입력 / Gap / Resume / 출력 / OHLCV 무결성을 검증한다.
#
# IMPORTANT:
#   이 Workflow에서는 --repair를 절대 사용하지 않는다.
#
# Therefore:
#   OHLCV write    : DISABLED
#   OHLCV delete   : DISABLED
#   Actual repair  : DISABLED
#
# Expected full source:
#   Markets        : 290
#   Timeframes     : 3
#   OHLCV jobs     : 870
#
# Runner:
#   Self-hosted Windows
#
# PowerShell:
#   Windows PowerShell 5.1 compatible
#
# Safety:
#   - NO --repair
#   - NO checkpoint reset
#   - NO OHLCV modification
#   - NO Feature rebuild
#   - NO 256 Detector
#   - NO Future labels
#   - NO Prediction
#   - NO Trading
#   - NO git reset
#   - NO git clean
#   - NO git commit
#   - NO git push
# ============================================================


name: recover_history_gaps_test.yml


# ============================================================
# TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOB
# ============================================================

jobs:

  recover-history-gaps-test:

    name: recover_history_gaps_test.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180


    defaults:
      run:
        shell: powershell


    steps:


      # ======================================================
      # STEP 1
      # Synchronize repository
      #
      # Persistent runtime/checkpoint files must survive.
      #
      # DO NOT USE:
      #   git reset --hard
      #   git clean
      # ======================================================

      - name: Synchronize local repository

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE LOCAL REPOSITORY"
          Write-Host "============================================================"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Current branch:"

          git branch --show-current

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to determine current Git branch."
          }

          Write-Host ""
          Write-Host "Fetching origin/main..."

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {
              throw "git fetch origin main failed."
          }

          Write-Host ""
          Write-Host "Fast-forwarding local repository..."

          git merge --ff-only origin/main

          if ($LASTEXITCODE -ne 0) {
              throw "git merge --ff-only origin/main failed."
          }

          Write-Host ""
          Write-Host "[PASS] Repository synchronized."

          Write-Host ""
          Write-Host "[SAFETY] git reset was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."


      # ======================================================
      # STEP 2
      # Verify Python
      # ======================================================

      - name: Verify Python

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Python launcher verified."


      # ======================================================
      # STEP 3
      # Verify required Python packages
      # ======================================================

      - name: Verify Python packages

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON PACKAGES"
          Write-Host "============================================================"

          py -c "import pandas; import requests; print('pandas:', pandas.__version__); print('requests:', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "Required Python package validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] pandas verified."
          Write-Host "[PASS] requests verified."


      # ======================================================
      # STEP 4
      # Verify recover_history_gaps.py exists
      # ======================================================

      - name: Verify recovery script

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RECOVERY SCRIPT"
          Write-Host "============================================================"

          $script = "recover_history_gaps.py"

          if (-not (Test-Path $script -PathType Leaf)) {
              throw "Missing required file: $script"
          }

          $item = Get-Item $script

          Write-Host ""
          Write-Host "File:"
          Write-Host $item.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($item.Length) bytes"

          Write-Host ""
          Write-Host "[PASS] recover_history_gaps.py found."


      # ======================================================
      # STEP 5
      # Verify Clean V003 identity
      #
      # We intentionally verify the saved source before running
      # anything.
      # ======================================================

      - name: Verify Clean V003 identity

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY CLEAN V003 IDENTITY"
          Write-Host "============================================================"

          $pythonCode = @'
          from pathlib import Path

          path = Path("recover_history_gaps.py")

          text = path.read_text(
              encoding="utf-8"
          )

          required = [
              "Historical Gap Recovery Clean V003",
              "--repair",
              "--reset-repair-checkpoint",
          ]

          for token in required:

              if token not in text:
                  raise RuntimeError(
                      f"Required Clean V003 token missing: {token}"
                  )

          print("Version token                : VERIFIED")
          print("--repair option              : VERIFIED")
          print("--reset-repair-checkpoint    : VERIFIED")
          '@

          $tempPython = Join-Path `
              $env:RUNNER_TEMP `
              "verify_recover_v003_identity.py"

          $pythonCode |
              Set-Content `
                  -Path $tempPython `
                  -Encoding UTF8

          py $tempPython

          if ($LASTEXITCODE -ne 0) {
              throw "Clean V003 identity validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] recover_history_gaps.py Clean V003 verified."


      # ======================================================
      # STEP 6
      # Verify repair cannot run implicitly
      #
      # We inspect argparse source.
      #
      # This Workflow NEVER passes --repair.
      # ======================================================

      - name: Verify explicit repair safety gate

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY EXPLICIT REPAIR SAFETY GATE"
          Write-Host "============================================================"

          $pythonCode = @'
          from pathlib import Path

          text = Path(
              "recover_history_gaps.py"
          ).read_text(
              encoding="utf-8"
          )

          checks = {
              "--repair exists":
                  '"--repair"' in text
                  or "'--repair'" in text,

              "store_true exists":
                  "store_true" in text,

              "repair_enabled exists":
                  "repair_enabled" in text,
          }

          for name, result in checks.items():

              print(
                  f"{name:<30}: "
                  f"{'VERIFIED' if result else 'FAILED'}"
              )

              if not result:
                  raise RuntimeError(
                      f"Repair safety check failed: {name}"
                  )

          print()
          print(
              "Actual repair requires explicit --repair."
          )
          '@

          $tempPython = Join-Path `
              $env:RUNNER_TEMP `
              "verify_repair_safety_gate.py"

          $pythonCode |
              Set-Content `
                  -Path $tempPython `
                  -Encoding UTF8

          py $tempPython

          if ($LASTEXITCODE -ne 0) {
              throw "Repair safety gate validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Explicit --repair safety gate verified."


      # ======================================================
      # STEP 7
      # Verify OHLCV directories
      # ======================================================

      - name: Verify OHLCV directories

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($directory in $directories) {

              if (-not (
                  Test-Path `
                      $directory `
                      -PathType Container
              )) {

                  throw (
                      "Required OHLCV directory missing: " +
                      $directory
                  )
              }

              Write-Host "[PASS] $directory"
          }

          Write-Host ""
          Write-Host "[PASS] OHLCV directories verified."


      # ======================================================
      # STEP 8
      # Verify 290 markets / 870 OHLCV files
      # ======================================================

      - name: Verify full 290 market OHLCV set

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY FULL 290 MARKET OHLCV SET"
          Write-Host "============================================================"

          $expectedMarkets = 290
          $expectedTotal = 870

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $marketSets = @{}
          $total = 0

          foreach ($timeframe in $timeframes) {

              $directory = "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -Path $directory `
                      -Filter "KRW-*.csv" `
                      -File
              )

              $count = $files.Count

              Write-Host ""
              Write-Host "$timeframe files : $count"

              if ($count -ne $expectedMarkets) {

                  throw (
                      "OHLCV file count mismatch for " +
                      "$timeframe. expected=" +
                      "$expectedMarkets found=$count"
                  )
              }

              $markets = @(
                  $files |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              if ($markets.Count -ne $expectedMarkets) {

                  throw (
                      "Unique market count mismatch for " +
                      "$timeframe. expected=" +
                      "$expectedMarkets found=" +
                      "$($markets.Count)"
                  )
              }

              $marketSets[$timeframe] = $markets

              $total += $count
          }

          if ($total -ne $expectedTotal) {

              throw (
                  "Total OHLCV count mismatch. " +
                  "expected=$expectedTotal found=$total"
              )
          }

          $baseMarkets = $marketSets["h1"]

          foreach ($timeframe in @("h4", "d1")) {

              $difference = @(
                  Compare-Object `
                      -ReferenceObject $baseMarkets `
                      -DifferenceObject $marketSets[$timeframe]
              )

              if ($difference.Count -gt 0) {

                  Write-Host ""
                  Write-Host (
                      "Market-set difference detected: " +
                      $timeframe
                  )

                  $difference |
                      Format-Table -AutoSize

                  throw (
                      "Market universe differs between " +
                      "timeframes."
                  )
              }
          }

          Write-Host ""
          Write-Host "Markets    : $expectedMarkets"
          Write-Host "Timeframes : 3"
          Write-Host "OHLCV jobs : $total"

          Write-Host ""
          Write-Host "[PASS] Full 290-market universe verified."
          Write-Host "[PASS] Full 870 OHLCV files verified."
          Write-Host "[PASS] Market sets match across h1/h4/d1."


      # ======================================================
      # STEP 9
      # Verify Review recovery targets
      #
      # Review stage should have generated:
      #
      # data/recovery/history_gap_recovery_targets.csv
      # data/recovery/history_gap_recovery_plan.json
      #
      # We do NOT require a fixed number of targets.
      # ======================================================

      - name: Verify reviewed recovery targets

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY REVIEWED RECOVERY TARGETS"
          Write-Host "============================================================"

          $targets = `
              "data\recovery\history_gap_recovery_targets.csv"

          $plan = `
              "data\recovery\history_gap_recovery_plan.json"

          if (-not (
              Test-Path `
                  $targets `
                  -PathType Leaf
          )) {

              throw (
                  "Reviewed recovery target file missing: " +
                  $targets
              )
          }

          if (-not (
              Test-Path `
                  $plan `
                  -PathType Leaf
          )) {

              throw (
                  "Reviewed recovery plan missing: " +
                  $plan
              )
          }

          $targetItem = Get-Item $targets
          $planItem = Get-Item $plan

          Write-Host ""
          Write-Host "Recovery targets:"
          Write-Host "$targets"
          Write-Host "Size: $($targetItem.Length) bytes"

          Write-Host ""
          Write-Host "Recovery plan:"
          Write-Host "$plan"
          Write-Host "Size: $($planItem.Length) bytes"

          Write-Host ""
          Write-Host "[PASS] Reviewed recovery inputs found."


      # ======================================================
      # STEP 10
      # Record complete OHLCV SHA256 BEFORE PREVIEW
      #
      # Windows PowerShell 5.1 compatible.
      #
      # No System.IO.Path.GetRelativePath().
      # ======================================================

      - name: Record OHLCV SHA256 before preview

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE PREVIEW"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "recover_v003_ohlcv_before.sha256"

          $workspacePath = (
              Resolve-Path $env:GITHUB_WORKSPACE
          ).Path.TrimEnd('\')

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw (
                  "Expected 870 OHLCV files before preview. " +
                  "Found: $($files.Count)"
              )
          }

          $rows = @()

          foreach ($file in $files) {

              $fullPath = $file.FullName

              if (-not $fullPath.StartsWith(
                  $workspacePath,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {

                  throw (
                      "OHLCV file outside workspace: " +
                      $fullPath
                  )
              }

              $relative = $fullPath.Substring(
                  $workspacePath.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"
          }

          $rows |
              Set-Content `
                  -Path $manifest `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Manifest:"
          Write-Host $manifest

          Write-Host ""
          Write-Host "Files hashed : $($files.Count)"

          Write-Host ""
          Write-Host "[PASS] OHLCV BEFORE manifest created."


      # ======================================================
      # STEP 11
      # Record recovery input SHA256 BEFORE PREVIEW
      # ======================================================

      - name: Record recovery input SHA256 before preview

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECORD RECOVERY INPUT SHA256 BEFORE PREVIEW"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "recover_v003_inputs_before.sha256"

          $files = @(
              "data\recovery\history_gap_recovery_targets.csv",
              "data\recovery\history_gap_recovery_plan.json"
          )

          $rows = @()

          foreach ($file in $files) {

              if (-not (
                  Test-Path `
                      $file `
                      -PathType Leaf
              )) {

                  throw "Recovery input missing: $file"
              }

              $hash = (
                  Get-FileHash `
                      -Path $file `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$file"

              Write-Host "[INPUT] $file"
          }

          $rows |
              Set-Content `
                  -Path $manifest `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "[PASS] Recovery input hashes recorded."


      # ======================================================
      # STEP 12
      # Inspect V003 checkpoint state
      #
      # IMPORTANT:
      # This step NEVER deletes the checkpoint.
      # ======================================================

      - name: Inspect V003 checkpoint state

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "INSPECT V003 CHECKPOINT STATE"
          Write-Host "============================================================"

          $checkpoint = `
              "data\recovery\checkpoint\recover_history_gaps_repair_checkpoint_v003.json"

          if (Test-Path $checkpoint -PathType Leaf) {

              $item = Get-Item $checkpoint

              Write-Host ""
              Write-Host "[INFO] Existing V003 checkpoint found."
              Write-Host "Path       : $checkpoint"
              Write-Host "Size       : $($item.Length) bytes"
              Write-Host "Last write : $($item.LastWriteTime)"
          }
          else {

              Write-Host ""
              Write-Host "[INFO] No V003 repair checkpoint exists."
              Write-Host (
                  "[INFO] This is normal before actual " +
                  "--repair execution."
              )
          }

          Write-Host ""
          Write-Host "[PASS] Checkpoint inspection completed."


      # ======================================================
      # STEP 13
      # PREVIEW EXECUTION
      #
      # CRITICAL:
      #
      # DO NOT ADD:
      #
      #   --repair
      #
      # DO NOT ADD:
      #
      #   --reset-repair-checkpoint
      #
      # Running with no arguments = PREVIEW.
      # ======================================================

      - name: Run recover_history_gaps.py PREVIEW

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RUN recover_history_gaps.py CLEAN V003 PREVIEW"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Command:"
          Write-Host "py recover_history_gaps.py"

          Write-Host ""
          Write-Host "Repair flag : NOT PROVIDED"
          Write-Host "OHLCV write : DISABLED"

          Write-Host ""

          py recover_history_gaps.py

          if ($LASTEXITCODE -ne 0) {

              throw (
                  "recover_history_gaps.py PREVIEW failed " +
                  "with exit code $LASTEXITCODE."
              )
          }

          Write-Host ""
          Write-Host "[PASS] Clean V003 PREVIEW completed."


      # ======================================================
      # STEP 14
      # Verify OHLCV count AFTER PREVIEW
      # ======================================================

      - name: Verify OHLCV count after preview

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV COUNT AFTER PREVIEW"
          Write-Host "============================================================"

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse
          )

          if ($files.Count -ne 870) {

              throw (
                  "OHLCV file count changed during preview. " +
                  "Expected 870, found $($files.Count)."
              )
          }

          Write-Host ""
          Write-Host "OHLCV files : $($files.Count)"

          Write-Host ""
          Write-Host "[PASS] OHLCV file count remained 870."


      # ======================================================
      # STEP 15
      # Verify OHLCV SHA256 AFTER PREVIEW
      #
      # This is the strongest PREVIEW safety check:
      #
      # Every one of the 870 source files must have exactly
      # the same SHA256 hash.
      # ======================================================

      - name: Verify OHLCV remained unchanged

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeManifest = Join-Path `
              $env:RUNNER_TEMP `
              "recover_v003_ohlcv_before.sha256"

          if (-not (
              Test-Path `
                  $beforeManifest `
                  -PathType Leaf
          )) {

              throw "OHLCV BEFORE manifest is missing."
          }

          $afterManifest = Join-Path `
              $env:RUNNER_TEMP `
              "recover_v003_ohlcv_after.sha256"

          $workspacePath = (
              Resolve-Path $env:GITHUB_WORKSPACE
          ).Path.TrimEnd('\')

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw (
                  "Expected 870 OHLCV files after preview. " +
                  "Found: $($files.Count)"
              )
          }

          $rows = @()

          foreach ($file in $files) {

              $fullPath = $file.FullName

              if (-not $fullPath.StartsWith(
                  $workspacePath,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {

                  throw (
                      "OHLCV file outside workspace: " +
                      $fullPath
                  )
              }

              $relative = $fullPath.Substring(
                  $workspacePath.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"
          }

          $rows |
              Set-Content `
                  -Path $afterManifest `
                  -Encoding UTF8

          $before = @(
              Get-Content $beforeManifest
          )

          $after = @(
              Get-Content $afterManifest
          )

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV differences detected:"
              Write-Host ""

              $difference |
                  Format-Table -AutoSize

              throw (
                  "PREVIEW modified OHLCV data. " +
                  "Safety validation FAILED."
              )
          }

          Write-Host ""
          Write-Host "[PASS] All 870 OHLCV SHA256 hashes unchanged."
          Write-Host "[PASS] PREVIEW did not modify OHLCV."


      # ======================================================
      # STEP 16
      # Verify reviewed recovery inputs remained unchanged
      # ======================================================

      - name: Verify recovery inputs remained unchanged

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RECOVERY INPUTS REMAINED UNCHANGED"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "recover_v003_inputs_before.sha256"

          if (-not (
              Test-Path `
                  $manifest `
                  -PathType Leaf
          )) {

              throw "Recovery input manifest is missing."
          }

          $rows = @(
              Get-Content $manifest
          )

          $checked = 0

          foreach ($row in $rows) {

              if ([string]::IsNullOrWhiteSpace($row)) {
                  continue
              }

              $parts = $row -split "`t", 2

              if ($parts.Count -ne 2) {
                  throw "Invalid input manifest row: $row"
              }

              $expectedHash = $parts[0].Trim()
              $file = $parts[1].Trim()

              if (-not (
                  Test-Path `
                      $file `
                      -PathType Leaf
              )) {

                  throw (
                      "Recovery input disappeared: " +
                      $file
                  )
              }

              $actualHash = (
                  Get-FileHash `
                      -Path $file `
                      -Algorithm SHA256
              ).Hash

              if ($actualHash -ne $expectedHash) {

                  throw (
                      "Recovery input changed during PREVIEW: " +
                      $file
                  )
              }

              $checked += 1

              Write-Host "[UNCHANGED] $file"
          }

          if ($checked -ne 2) {

              throw (
                  "Expected 2 recovery input files to be " +
                  "verified. Found: $checked"
              )
          }

          Write-Host ""
          Write-Host "[PASS] Recovery target CSV unchanged."
          Write-Host "[PASS] Recovery plan JSON unchanged."


      # ======================================================
      # STEP 17
      # Verify no V003 repair checkpoint was created/modified
      # by PREVIEW
      #
      # PREVIEW should not use actual repair checkpoint state.
      # ======================================================

      - name: Verify repair checkpoint safety

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY REPAIR CHECKPOINT SAFETY"
          Write-Host "============================================================"

          $checkpoint = `
              "data\recovery\checkpoint\recover_history_gaps_repair_checkpoint_v003.json"

          if (Test-Path $checkpoint -PathType Leaf) {

              Write-Host ""
              Write-Host "[INFO] V003 repair checkpoint exists."
              Write-Host (
                  "[INFO] It may be a persistent checkpoint " +
                  "from an earlier repair execution."
              )
              Write-Host (
                  "[INFO] PREVIEW did not request reset or repair."
              )
          }
          else {

              Write-Host ""
              Write-Host (
                  "[PASS] No V003 repair checkpoint exists."
              )
          }

          Write-Host ""
          Write-Host "[SAFETY] --repair was NOT supplied."
          Write-Host (
              "[SAFETY] --reset-repair-checkpoint was NOT supplied."
          )


      # ======================================================
      # STEP 18
      # Verify V001 checkpoint preservation
      #
      # Clean V003 must not delete the old V001 DRY-RUN
      # checkpoint.
      # ======================================================

      - name: Verify V001 checkpoint preservation

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY V001 CHECKPOINT PRESERVATION"
          Write-Host "============================================================"

          $checkpoint = `
              "data\recovery\checkpoint\recover_history_gaps_checkpoint.json"

          if (Test-Path $checkpoint -PathType Leaf) {

              $item = Get-Item $checkpoint

              Write-Host ""
              Write-Host "[PASS] V001 DRY-RUN checkpoint preserved."
              Write-Host "Path : $checkpoint"
              Write-Host "Size : $($item.Length) bytes"
          }
          else {

              Write-Host ""
              Write-Host (
                  "[INFO] V001 DRY-RUN checkpoint is not present."
              )
              Write-Host (
                  "[INFO] No deletion was performed by this workflow."
              )
          }


      # ======================================================
      # STEP 19
      # Verify Git safety
      #
      # No tracked source file may be modified.
      # ======================================================

      - name: Verify final Git safety

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY FINAL GIT SAFETY"
          Write-Host "============================================================"

          $trackedChanges = @(
              git diff --name-only
          )

          if ($LASTEXITCODE -ne 0) {
              throw "git diff --name-only failed."
          }

          if ($trackedChanges.Count -gt 0) {

              Write-Host ""
              Write-Host "Tracked changes detected:"
              Write-Host ""

              foreach ($change in $trackedChanges) {
                  Write-Host "  $change"
              }

              throw (
                  "PREVIEW modified tracked Git files."
              )
          }

          Write-Host ""
          Write-Host "[PASS] No tracked Git changes detected."

          Write-Host ""
          Write-Host "[SAFETY] git reset was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."
          Write-Host "[SAFETY] git commit was NOT executed."
          Write-Host "[SAFETY] git push was NOT executed."


      # ======================================================
      # STEP 20
      # Runtime file information
      #
      # PREVIEW may create/update runtime reports.
      # This is informational only.
      # ======================================================

      - name: Show recovery runtime files

        if: always()

        run: |

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECOVERY RUNTIME FILES"
          Write-Host "============================================================"

          if (Test-Path "data\recovery") {

              $files = @(
                  Get-ChildItem `
                      -Path "data\recovery" `
                      -File `
                      -Recurse |
                  Sort-Object FullName
              )

              if ($files.Count -eq 0) {

                  Write-Host ""
                  Write-Host "[INFO] No recovery runtime files found."
              }
              else {

                  Write-Host ""

                  foreach ($file in $files) {

                      Write-Host (
                          "$($file.FullName) | " +
                          "$($file.Length) bytes"
                      )
                  }
              }
          }
          else {

              Write-Host ""
              Write-Host "[INFO] data\recovery directory not found."
          }

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 21
      # Final result
      # ======================================================

      - name: recover_history_gaps_test.yml completed

        if: success()

        run: |

          Write-Host "============================================================"
          Write-Host "[RESULT] recover_history_gaps_test.yml PASSED"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Project:"
          Write-Host "  Upbit Surge Monitor"

          Write-Host ""
          Write-Host "Target:"
          Write-Host "  recover_history_gaps.py - Clean V003"

          Write-Host ""
          Write-Host "Execution:"
          Write-Host "  Mode           : PREVIEW"
          Write-Host "  Markets        : 290"
          Write-Host "  Timeframes     : 3"
          Write-Host "  OHLCV jobs     : 870"

          Write-Host ""
          Write-Host "Verification:"
          Write-Host "  Clean V003     : VERIFIED"
          Write-Host "  Recovery input : VERIFIED"
          Write-Host "  OHLCV count    : VERIFIED"
          Write-Host "  OHLCV SHA256   : UNCHANGED"
          Write-Host "  Git source     : UNCHANGED"

          Write-Host ""
          Write-Host "Safety:"
          Write-Host "  --repair       : NOT USED"
          Write-Host "  OHLCV write    : DISABLED"
          Write-Host "  OHLCV delete   : DISABLED"
          Write-Host "  Actual repair  : DISABLED"
          Write-Host "  Feature build  : DISABLED"
          Write-Host "  256 Detector   : DISABLED"
          Write-Host "  Future labels  : DISABLED"
          Write-Host "  Prediction     : DISABLED"
          Write-Host "  Trading        : DISABLED"
          Write-Host "  Git reset      : DISABLED"
          Write-Host "  Git clean      : DISABLED"
          Write-Host "  Git commit     : DISABLED"
          Write-Host "  Git push       : DISABLED"

          Write-Host ""
          Write-Host "[PASS] Clean V003 PREVIEW safety test completed."
          Write-Host (
              "[NEXT] Review PREVIEW result before enabling " +
              "actual --repair."
          )

          Write-Host "============================================================"
