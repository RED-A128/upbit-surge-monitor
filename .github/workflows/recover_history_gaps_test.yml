name: Historical Gap Recovery Clean V002 Preview Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-history-gaps-preview-test:
    name: Historical Gap Recovery Clean V002 Preview Safety Test
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    steps:

      # ======================================================
      # 01. Repository synchronization
      # ======================================================

      - name: Synchronize local repository
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE LOCAL REPOSITORY"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {
              throw "git fetch failed."
          }

          git reset --hard origin/main

          if ($LASTEXITCODE -ne 0) {
              throw "git reset failed."
          }

          Write-Host ""
          Write-Host "Repository synchronized."
          Write-Host ""

          git status --short


      # ======================================================
      # 02. Verify Python
      # ======================================================

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is not available."
          }

          Write-Host ""
          Write-Host "Python verification passed."


      # ======================================================
      # 03. Verify required project files
      # ======================================================

      - name: Verify required project files
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED PROJECT FILES"
          Write-Host "============================================================"

          $requiredFiles = @(
              "recover_history_gaps.py",
              "requirements.txt"
          )

          foreach ($file in $requiredFiles) {

              if (-not (Test-Path $file)) {
                  throw "Required file missing: $file"
              }

              Write-Host "FOUND: $file"
          }

          Write-Host ""
          Write-Host "Required project files verified."


      # ======================================================
      # 04. Verify OHLCV directories
      # ======================================================

      - name: Verify OHLCV directories
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($directory in $directories) {

              if (-not (Test-Path $directory)) {
                  throw "Required OHLCV directory missing: $directory"
              }

              Write-Host "FOUND: $directory"
          }

          Write-Host ""
          Write-Host "OHLCV directories verified."


      # ======================================================
      # 05. Verify full KRW OHLCV set
      #
      # Expected:
      #   290 markets x 3 timeframes = 870 CSV files
      # ======================================================

      - name: Verify full 290 market OHLCV set
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY FULL KRW OHLCV SET"
          Write-Host "============================================================"

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $expectedPerTimeframe = 290
          $expectedTotal = 870

          $total = 0

          foreach ($timeframe in $timeframes) {

              $directory = "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -Path $directory `
                      -Filter "KRW-*.csv" `
                      -File
              )

              $count = $files.Count

              Write-Host ""
              Write-Host "$timeframe files : $count"

              if ($count -ne $expectedPerTimeframe) {

                  throw (
                      "Expected $expectedPerTimeframe KRW CSV files " +
                      "for $timeframe. Found: $count"
                  )
              }

              $total += $count
          }

          Write-Host ""
          Write-Host "Total OHLCV files : $total"

          if ($total -ne $expectedTotal) {

              throw (
                  "Expected $expectedTotal total OHLCV files. " +
                  "Found: $total"
              )
          }

          Write-Host ""
          Write-Host "Full 290-market x 3-timeframe OHLCV set verified."


      # ======================================================
      # 06. Verify identical market sets
      #
      # h1 / h4 / d1 must contain exactly the same
      # 290 KRW market filenames.
      # ======================================================

      - name: Verify identical market sets
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY IDENTICAL MARKET SETS"
          Write-Host "============================================================"

          $h1 = @(
              Get-ChildItem `
                  "data\ohlcv\h1" `
                  -Filter "KRW-*.csv" `
                  -File |
              ForEach-Object {
                  $_.BaseName.ToUpper()
              } |
              Sort-Object
          )

          $h4 = @(
              Get-ChildItem `
                  "data\ohlcv\h4" `
                  -Filter "KRW-*.csv" `
                  -File |
              ForEach-Object {
                  $_.BaseName.ToUpper()
              } |
              Sort-Object
          )

          $d1 = @(
              Get-ChildItem `
                  "data\ohlcv\d1" `
                  -Filter "KRW-*.csv" `
                  -File |
              ForEach-Object {
                  $_.BaseName.ToUpper()
              } |
              Sort-Object
          )

          $compareH1H4 = @(
              Compare-Object $h1 $h4
          )

          $compareH1D1 = @(
              Compare-Object $h1 $d1
          )

          if ($compareH1H4.Count -ne 0) {

              Write-Host ""
              Write-Host "h1 / h4 market mismatch:"
              $compareH1H4 | Format-Table

              throw "h1 and h4 market sets differ."
          }

          if ($compareH1D1.Count -ne 0) {

              Write-Host ""
              Write-Host "h1 / d1 market mismatch:"
              $compareH1D1 | Format-Table

              throw "h1 and d1 market sets differ."
          }

          Write-Host ""
          Write-Host "Identical market sets verified."
          Write-Host "Markets: $($h1.Count)"


      # ======================================================
      # 07. Python syntax compilation test
      #
      # IMPORTANT:
      #   Does NOT execute recovery.
      # ======================================================

      - name: Compile recover_history_gaps.py
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX COMPILE TEST"
          Write-Host "============================================================"

          py -m py_compile recover_history_gaps.py

          if ($LASTEXITCODE -ne 0) {
              throw "recover_history_gaps.py syntax compilation failed."
          }

          Write-Host ""
          Write-Host "Python syntax compilation passed."


      # ======================================================
      # 08. Verify Clean V002 safety markers
      #
      # Prevent accidental use of a wrong/old script.
      # ======================================================

      - name: Verify Clean V002 safety markers
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY CLEAN V002 SAFETY MARKERS"
          Write-Host "============================================================"

          $content = Get-Content `
              "recover_history_gaps.py" `
              -Raw

          $requiredMarkers = @(
              "Historical Gap Recovery Clean V002",
              "--repair",
              "recover_history_gaps_repair_checkpoint.json",
              "Fake candles",
              "atomic_save_ohlcv",
              "validate_existing_rows_preserved"
          )

          foreach ($marker in $requiredMarkers) {

              if (-not $content.Contains($marker)) {
                  throw "Required Clean V002 marker missing: $marker"
              }

              Write-Host "FOUND: $marker"
          }

          Write-Host ""
          Write-Host "Clean V002 safety markers verified."


      # ======================================================
      # 09. Remove previous TEST hash snapshots only
      #
      # IMPORTANT:
      #   Does NOT delete OHLCV.
      #   Does NOT delete recovery checkpoint.
      # ======================================================

      - name: Prepare preview safety test directory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PREPARE PREVIEW SAFETY TEST DIRECTORY"
          Write-Host "============================================================"

          $testDirectory = "data\recovery\preview_safety_test"

          if (-not (Test-Path $testDirectory)) {

              New-Item `
                  -ItemType Directory `
                  -Path $testDirectory `
                  -Force |
              Out-Null
          }

          $beforeHash = Join-Path `
              $testDirectory `
              "ohlcv_sha256_before.csv"

          $afterHash = Join-Path `
              $testDirectory `
              "ohlcv_sha256_after.csv"

          if (Test-Path $beforeHash) {
              Remove-Item $beforeHash -Force
          }

          if (Test-Path $afterHash) {
              Remove-Item $afterHash -Force
          }

          Write-Host ""
          Write-Host "Test directory prepared:"
          Write-Host $testDirectory


      # ======================================================
      # 10. Record ALL 870 OHLCV SHA256 BEFORE preview
      #
      # PowerShell Get-FileHash only.
      # No embedded Python.
      # ======================================================

      - name: Record OHLCV SHA256 before preview
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE PREVIEW"
          Write-Host "============================================================"

          $outputFile = (
              "data\recovery\preview_safety_test\" +
              "ohlcv_sha256_before.csv"
          )

          $files = @(
              Get-ChildItem `
                  "data\ohlcv" `
                  -Recurse `
                  -Filter "KRW-*.csv" `
                  -File |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {
              throw "Expected 870 OHLCV files. Found: $($files.Count)"
          }

          $rows = @()

          foreach ($file in $files) {

              $hash = Get-FileHash `
                  -Path $file.FullName `
                  -Algorithm SHA256

              $relativePath = (
                  $file.FullName.Substring(
                      "${{ github.workspace }}".Length
                  )
              ).TrimStart('\')

              $rows += [PSCustomObject]@{
                  path   = $relativePath
                  sha256 = $hash.Hash.ToLower()
                  length = $file.Length
              }
          }

          $rows |
              Export-Csv `
                  -Path $outputFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Recorded files : $($rows.Count)"
          Write-Host "Output         : $outputFile"

          if ($rows.Count -ne 870) {
              throw "SHA256 BEFORE snapshot does not contain 870 files."
          }


      # ======================================================
      # 11. Record repair checkpoint state BEFORE preview
      #
      # Preview must NOT create or modify actual repair
      # checkpoint.
      # ======================================================

      - name: Record repair checkpoint state before preview
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD REPAIR CHECKPOINT STATE BEFORE PREVIEW"
          Write-Host "============================================================"

          $checkpoint = (
              "data\recovery\checkpoint\" +
              "recover_history_gaps_repair_checkpoint.json"
          )

          $stateFile = (
              "data\recovery\preview_safety_test\" +
              "repair_checkpoint_before.txt"
          )

          if (Test-Path $checkpoint) {

              $hash = Get-FileHash `
                  -Path $checkpoint `
                  -Algorithm SHA256

              $content = @(
                  "EXISTS=1",
                  "SHA256=$($hash.Hash.ToLower())"
              )

              $content |
                  Set-Content `
                      -Path $stateFile `
                      -Encoding UTF8

              Write-Host "Repair checkpoint exists."
              Write-Host "SHA256: $($hash.Hash.ToLower())"
          }
          else {

              "EXISTS=0" |
                  Set-Content `
                      -Path $stateFile `
                      -Encoding UTF8

              Write-Host "Repair checkpoint does not exist."
          }


      # ======================================================
      # 12. RUN PREVIEW
      #
      # CRITICAL:
      #   DO NOT add --repair here.
      #
      # Expected:
      #   - report discovery
      #   - gap analysis
      #   - PREVIEW results
      #   - ZERO OHLCV modifications
      # ======================================================

      - name: Run Historical Gap Recovery Clean V002 PREVIEW
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RUN HISTORICAL GAP RECOVERY CLEAN V002 - PREVIEW"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "SAFETY:"
          Write-Host "  --repair NOT supplied"
          Write-Host "  Actual OHLCV repair must remain disabled."
          Write-Host ""

          py recover_history_gaps.py

          if ($LASTEXITCODE -ne 0) {

              throw (
                  "Historical Gap Recovery Clean V002 " +
                  "PREVIEW failed with exit code $LASTEXITCODE."
              )
          }

          Write-Host ""
          Write-Host "PREVIEW execution completed."


      # ======================================================
      # 13. Record ALL 870 OHLCV SHA256 AFTER preview
      # ======================================================

      - name: Record OHLCV SHA256 after preview
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 AFTER PREVIEW"
          Write-Host "============================================================"

          $outputFile = (
              "data\recovery\preview_safety_test\" +
              "ohlcv_sha256_after.csv"
          )

          $files = @(
              Get-ChildItem `
                  "data\ohlcv" `
                  -Recurse `
                  -Filter "KRW-*.csv" `
                  -File |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {
              throw "Expected 870 OHLCV files. Found: $($files.Count)"
          }

          $rows = @()

          foreach ($file in $files) {

              $hash = Get-FileHash `
                  -Path $file.FullName `
                  -Algorithm SHA256

              $relativePath = (
                  $file.FullName.Substring(
                      "${{ github.workspace }}".Length
                  )
              ).TrimStart('\')

              $rows += [PSCustomObject]@{
                  path   = $relativePath
                  sha256 = $hash.Hash.ToLower()
                  length = $file.Length
              }
          }

          $rows |
              Export-Csv `
                  -Path $outputFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Recorded files : $($rows.Count)"
          Write-Host "Output         : $outputFile"

          if ($rows.Count -ne 870) {
              throw "SHA256 AFTER snapshot does not contain 870 files."
          }


      # ======================================================
      # 14. Verify ZERO OHLCV changes
      #
      # This is the most important PREVIEW safety test.
      # ======================================================

      - name: Verify all OHLCV files remained unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY ALL OHLCV FILES REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeFile = (
              "data\recovery\preview_safety_test\" +
              "ohlcv_sha256_before.csv"
          )

          $afterFile = (
              "data\recovery\preview_safety_test\" +
              "ohlcv_sha256_after.csv"
          )

          if (-not (Test-Path $beforeFile)) {
              throw "BEFORE SHA256 snapshot missing."
          }

          if (-not (Test-Path $afterFile)) {
              throw "AFTER SHA256 snapshot missing."
          }

          $before = @(
              Import-Csv $beforeFile
          )

          $after = @(
              Import-Csv $afterFile
          )

          if ($before.Count -ne 870) {
              throw "BEFORE snapshot expected 870 rows. Found: $($before.Count)"
          }

          if ($after.Count -ne 870) {
              throw "AFTER snapshot expected 870 rows. Found: $($after.Count)"
          }

          $beforeMap = @{}

          foreach ($row in $before) {

              $beforeMap[$row.path] = @{
                  sha256 = $row.sha256
                  length = $row.length
              }
          }

          $afterMap = @{}

          foreach ($row in $after) {

              $afterMap[$row.path] = @{
                  sha256 = $row.sha256
                  length = $row.length
              }
          }

          $changes = @()

          foreach ($path in $beforeMap.Keys) {

              if (-not $afterMap.ContainsKey($path)) {

                  $changes += (
                      "MISSING AFTER: $path"
                  )

                  continue
              }

              if (
                  $beforeMap[$path].sha256 -ne
                  $afterMap[$path].sha256
              ) {

                  $changes += (
                      "SHA256 CHANGED: $path"
                  )
              }

              if (
                  $beforeMap[$path].length -ne
                  $afterMap[$path].length
              ) {

                  $changes += (
                      "FILE LENGTH CHANGED: $path"
                  )
              }
          }

          foreach ($path in $afterMap.Keys) {

              if (-not $beforeMap.ContainsKey($path)) {

                  $changes += (
                      "NEW OHLCV FILE: $path"
                  )
              }
          }

          if ($changes.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV PREVIEW SAFETY VIOLATION:"
              Write-Host ""

              foreach ($change in $changes) {
                  Write-Host $change
              }

              throw (
                  "PREVIEW modified OHLCV data. " +
                  "This is not allowed."
              )
          }

          Write-Host ""
          Write-Host "PASS"
          Write-Host "All 870 OHLCV files remained byte-for-byte unchanged."


      # ======================================================
      # 15. Verify actual repair checkpoint remained unchanged
      #
      # Preview must not consume Resume state.
      # ======================================================

      - name: Verify repair checkpoint remained unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY REPAIR CHECKPOINT REMAINED UNCHANGED"
          Write-Host "============================================================"

          $checkpoint = (
              "data\recovery\checkpoint\" +
              "recover_history_gaps_repair_checkpoint.json"
          )

          $stateFile = (
              "data\recovery\preview_safety_test\" +
              "repair_checkpoint_before.txt"
          )

          if (-not (Test-Path $stateFile)) {
              throw "Checkpoint BEFORE state file missing."
          }

          $state = @(
              Get-Content $stateFile
          )

          $existedBefore = (
              $state -contains "EXISTS=1"
          )

          if ($existedBefore) {

              if (-not (Test-Path $checkpoint)) {

                  throw (
                      "Repair checkpoint existed before PREVIEW " +
                      "but disappeared afterward."
                  )
              }

              $beforeHashLine = (
                  $state |
                  Where-Object {
                      $_ -like "SHA256=*"
                  } |
                  Select-Object -First 1
              )

              if (-not $beforeHashLine) {
                  throw "Checkpoint BEFORE SHA256 missing."
              }

              $beforeHash = (
                  $beforeHashLine.Substring(7)
              )

              $afterHash = (
                  Get-FileHash `
                      -Path $checkpoint `
                      -Algorithm SHA256
              ).Hash.ToLower()

              Write-Host "Before SHA256 : $beforeHash"
              Write-Host "After SHA256  : $afterHash"

              if ($beforeHash -ne $afterHash) {

                  throw (
                      "PREVIEW modified the actual repair checkpoint."
                  )
              }
          }
          else {

              if (Test-Path $checkpoint) {

                  throw (
                      "PREVIEW created an actual repair checkpoint. " +
                      "This is not allowed."
                  )
              }

              Write-Host (
                  "Repair checkpoint did not exist before or after PREVIEW."
              )
          }

          Write-Host ""
          Write-Host "PASS"
          Write-Host "Actual repair checkpoint remained unchanged."


      # ======================================================
      # 16. Verify PREVIEW output files
      # ======================================================

      - name: Verify preview output files
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PREVIEW OUTPUT FILES"
          Write-Host "============================================================"

          $requiredOutputs = @(
              "data\recovery\reports\historical_gap_repair_detail.csv",
              "data\recovery\reports\historical_gap_repair_summary.csv",
              "data\recovery\reports\historical_gap_repair_meta.json"
          )

          foreach ($file in $requiredOutputs) {

              if (-not (Test-Path $file)) {
                  throw "Expected PREVIEW output missing: $file"
              }

              $info = Get-Item $file

              if ($info.Length -le 0) {
                  throw "PREVIEW output is empty: $file"
              }

              Write-Host (
                  "FOUND: $file " +
                  "($($info.Length) bytes)"
              )
          }

          Write-Host ""
          Write-Host "PREVIEW output files verified."


      # ======================================================
      # 17. Verify PREVIEW meta
      # ======================================================

      - name: Verify preview meta JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PREVIEW META JSON"
          Write-Host "============================================================"

          $metaFile = (
              "data\recovery\reports\" +
              "historical_gap_repair_meta.json"
          )

          if (-not (Test-Path $metaFile)) {
              throw "Preview meta JSON missing."
          }

          $meta = (
              Get-Content `
                  $metaFile `
                  -Raw |
              ConvertFrom-Json
          )

          Write-Host "Project      : $($meta.project)"
          Write-Host "Version      : $($meta.version)"
          Write-Host "Mode         : $($meta.mode)"
          Write-Host "Markets      : $($meta.markets)"
          Write-Host "Jobs         : $($meta.jobs)"
          Write-Host "Gap events   : $($meta.gap_events)"
          Write-Host "Inserted     : $($meta.inserted_candles)"

          if (
              $meta.version -ne
              "Historical Gap Recovery Clean V002"
          ) {

              throw (
                  "Unexpected version in preview meta: " +
                  "$($meta.version)"
              )
          }

          if ($meta.mode -ne "PREVIEW") {

              throw (
                  "Expected PREVIEW mode. " +
                  "Found: $($meta.mode)"
              )
          }

          if ([int]$meta.markets -ne 290) {

              throw (
                  "Expected 290 markets in preview meta. " +
                  "Found: $($meta.markets)"
              )
          }

          if ([int]$meta.jobs -ne 870) {

              throw (
                  "Expected 870 jobs in preview meta. " +
                  "Found: $($meta.jobs)"
              )
          }

          if ([int]$meta.inserted_candles -ne 0) {

              throw (
                  "PREVIEW inserted candles. " +
                  "Expected 0. Found: $($meta.inserted_candles)"
              )
          }

          Write-Host ""
          Write-Host "PREVIEW meta JSON verified."


      # ======================================================
      # 18. Verify detail CSV contains PREVIEW only
      # ======================================================

      - name: Verify preview detail results
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PREVIEW DETAIL RESULTS"
          Write-Host "============================================================"

          $detailFile = (
              "data\recovery\reports\" +
              "historical_gap_repair_detail.csv"
          )

          if (-not (Test-Path $detailFile)) {
              throw "Preview detail CSV missing."
          }

          $rows = @(
              Import-Csv $detailFile
          )

          Write-Host "Detail rows : $($rows.Count)"

          if ($rows.Count -eq 0) {

              Write-Host ""
              Write-Host (
                  "No gap detail rows were produced. " +
                  "This is allowed only when no valid gap events exist."
              )

              exit 0
          }

          $invalidStatuses = @(
              $rows |
              Where-Object {
                  $_.status -notin @(
                      "PREVIEW",
                      "RECOVERED",
                      "FAILED",
                      "UNRESOLVED"
                  )
              }
          )

          if ($invalidStatuses.Count -gt 0) {

              Write-Host ""
              Write-Host "Unexpected statuses:"

              $invalidStatuses |
                  Select-Object `
                      timeframe,
                      market,
                      status,
                      message |
                  Format-Table -AutoSize

              throw "Unexpected status found in PREVIEW detail CSV."
          }

          $insertedRows = @(
              $rows |
              Where-Object {
                  [int]$_.inserted -ne 0
              }
          )

          if ($insertedRows.Count -gt 0) {

              Write-Host ""
              Write-Host "Rows reporting inserted candles:"

              $insertedRows |
                  Select-Object `
                      timeframe,
                      market,
                      gap_start,
                      gap_end,
                      inserted,
                      status |
                  Format-Table -AutoSize

              throw (
                  "PREVIEW detail reports inserted candles. " +
                  "Expected zero."
              )
          }

          $statusGroups = (
              $rows |
              Group-Object status |
              Sort-Object Name
          )

          Write-Host ""
          Write-Host "Status summary:"

          foreach ($group in $statusGroups) {

              Write-Host (
                  "  $($group.Name) : $($group.Count)"
              )
          }

          Write-Host ""
          Write-Host "PREVIEW detail results verified."


      # ======================================================
      # 19. Verify no temporary OHLCV recovery files remain
      # ======================================================

      - name: Verify no recovery temp files remain
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY NO RECOVERY TEMP FILES REMAIN"
          Write-Host "============================================================"

          $tempFiles = @(
              Get-ChildItem `
                  "data\ohlcv" `
                  -Recurse `
                  -File |
              Where-Object {
                  $_.Name -like "*.recovery.tmp"
              }
          )

          if ($tempFiles.Count -gt 0) {

              Write-Host ""
              Write-Host "Unexpected recovery temp files:"

              foreach ($file in $tempFiles) {
                  Write-Host $file.FullName
              }

              throw (
                  "Recovery temporary files remain in OHLCV directories."
              )
          }

          Write-Host ""
          Write-Host "PASS"
          Write-Host "No recovery temporary OHLCV files remain."


      # ======================================================
      # 20. Final Git safety check
      #
      # Generated runtime files may be ignored.
      #
      # Any Git-visible modification after PREVIEW is a failure.
      # ======================================================

      - name: Verify final Git safety
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"

          $changes = @(
              git status --porcelain
          )

          if ($LASTEXITCODE -ne 0) {
              throw "git status failed."
          }

          if ($changes.Count -gt 0) {

              Write-Host ""
              Write-Host "Git-visible changes detected:"
              Write-Host ""

              foreach ($change in $changes) {
                  Write-Host $change
              }

              throw (
                  "PREVIEW created unexpected Git-visible changes."
              )
          }

          Write-Host ""
          Write-Host "PASS"
          Write-Host "No Git-visible changes detected."


