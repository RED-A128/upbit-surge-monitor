name: audit_pattern_256_delayed_entry_timing.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-pattern-256-delayed-entry-timing
  cancel-in-progress: false

jobs:
  delayed-entry-timing:
    name: delayed-entry-timing

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and script
        run: |
          $ErrorActionPreference = 'Stop'

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Python unavailable'
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            'audit_pattern_256_delayed_entry_timing.py'

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw 'Python syntax verification failed'
          }

      - name: Verify input files
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'data\reports\pattern_256_signal_timestamp_convention\signal_timestamp_convention_result.json',
            'data\reports\pattern_256_signal_timestamp_convention\signal_timestamp_convention_manifest.json',
            'data\reports\pattern_256_train_feature_join\shards'
          )

          foreach ($relative in $required) {
            $path = Join-Path $env:DATA_ROOT $relative

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required input missing: $path"
            }

            Write-Host "PASS: $path"
          }

      - name: Run delayed entry timing audit
        run: |
          $ErrorActionPreference = 'Stop'

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            'audit_pattern_256_delayed_entry_timing.py'

          py -u $script --root "$env:DATA_ROOT"

          if ($LASTEXITCODE -ne 0) {
            throw 'Delayed entry timing audit failed'
          }

      - name: Verify audit result and SHA256
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path `
            $env:DATA_ROOT `
            'data\reports\pattern_256_delayed_entry_timing'

          $resultPath = Join-Path `
            $out `
            'delayed_entry_timing_result.json'

          $manifestPath = Join-Path `
            $out `
            'delayed_entry_timing_manifest.json'

          foreach ($path in @($resultPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.version -ne 'Clean V001') {
            throw 'Unexpected result version'
          }

          if ($manifest.version -ne 'Clean V001') {
            throw 'Unexpected manifest version'
          }

          if ($result.execution_status -ne 'PASS') {
            throw 'Audit did not PASS'
          }

          if ($result.train_experiment_approved -ne $false) {
            throw 'Unexpected TRAIN approval'
          }

          if ($result.point_in_time_proven -ne $false) {
            throw 'Unexpected PIT proof'
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw 'Unexpected live trading approval'
          }

          $total = 0

          foreach ($property in $result.classification_counts.PSObject.Properties) {
            $total += [long]$property.Value
          }

          if ($total -ne [long]$result.source_rows) {
            throw 'Classification count mismatch'
          }

          foreach ($property in $manifest.output_sha256.PSObject.Properties) {
            $path = Join-Path $out $property.Name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output hash target: $path"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$property.Value
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $path"
            }

            Write-Host "PASS SHA256: $($property.Name)"
          }

          foreach ($property in $manifest.input_sha256.PSObject.Properties) {
            $relative = $property.Name -replace '/', '\'

            $path = Join-Path `
              $env:DATA_ROOT `
              $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing input hash target: $path"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$property.Value
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Input SHA256 mismatch: $path"
            }

            Write-Host "PASS input SHA256: $($property.Name)"
          }

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'

          $path = Join-Path `
            $env:DATA_ROOT `
            'data\reports\pattern_256_delayed_entry_timing\delayed_entry_timing_result.json'

          $r = Get-Content `
            -LiteralPath $path `
            -Raw | ConvertFrom-Json

          @"
          # Pattern 256 Delayed Entry Timing Audit

          | Check | Result |
          |---|---|
          | Execution | $($r.execution_status) |
          | Version | $($r.version) |
          | Source rows | $($r.source_rows) |
          | Source shards | $($r.source_shards) |
          | Normal next-open | $($r.classification_counts.NORMAL_NEXT_OPEN) |
          | Delayed aligned entry | $($r.classification_counts.DELAYED_ALIGNED_ENTRY) |
          | Delayed unaligned entry | $($r.classification_counts.DELAYED_UNALIGNED_ENTRY) |
          | Entry before feature close | $($r.classification_counts.ENTRY_BEFORE_FEATURE_CLOSE) |
          | Feature end mismatch | $($r.classification_counts.FEATURE_END_MISMATCH) |
          | Invalid timestamp | $($r.classification_counts.INVALID_TIMESTAMP) |
          | Unknown timeframe | $($r.classification_counts.UNKNOWN_TIMEFRAME) |
          | Research decision | $($r.research_decision) |
          | TRAIN approved | $($r.train_experiment_approved) |
          | Independent OOS proven | $($r.independent_oos_proven) |
          | Live trading approved | $($r.approved_for_live_trading) |

          A delayed aligned entry is not proof that the corresponding
          market candle existed or that upstream features are leakage-free.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-delayed-entry-timing-v001
          path: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_delayed_entry_timing\'
          if-no-files-found: warn
          retention-days: 30
