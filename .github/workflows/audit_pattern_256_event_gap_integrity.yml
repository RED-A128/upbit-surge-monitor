
name: audit_pattern_256_event_gap_integrity.yml

on:
  workflow_dispatch:
    inputs:
      force_replay:
        description: "Ignore valid checkpoints"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pattern-256-event-gap-integrity
  cancel-in-progress: false

jobs:
  event-gap-integrity:
    name: event-gap-integrity

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_gap_integrity.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing Python script: $script"
          }

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          py -c "import pandas, numpy; print('Dependencies PASS')"

          if ($LASTEXITCODE -ne 0) {
            throw "Python dependencies unavailable"
          }

          py -c "import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig')); print('Syntax PASS')" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          $required = @(
            "data\ohlcv\h1",
            "data\ohlcv\h4",
            "data\ohlcv\d1",
            "data\reports\pattern_256_trigger_event_study\event_study_result.json",
            "data\reports\pattern_256_trigger_event_study\event_study_manifest.json",
            "data\reports\pattern_256_trigger_event_study\event_study_files.csv",
            "data\reports\pattern_256_trigger_event_study\event_study_events.csv"
          )

          foreach ($relative in $required) {
            $path = Join-Path $env:DATA_ROOT $relative

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required input missing: $path"
            }
          }

          Write-Host "[PASS] Environment verified"

      - name: Execute gap integrity audit
        id: audit
        continue-on-error: true
        env:
          FORCE_REPLAY: ${{ inputs.force_replay }}
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_gap_integrity.py"

          $arguments = @(
            "-u",
            $script,
            "--root",
            $env:DATA_ROOT
          )

          if ($env:FORCE_REPLAY -eq "true") {
            $arguments += "--force"
          }

          $diagnostics = Join-Path `
            $env:RUNNER_TEMP `
            "event_gap_audit_diagnostics.log"

          $exitCode = 1

          try {
            & py @arguments 2>&1 |
              ForEach-Object {
                $line = [string]$_
                Write-Host $line
                $line |
                  Out-File `
                    -FilePath $diagnostics `
                    -Append `
                    -Encoding utf8
              }

            $exitCode = $LASTEXITCODE
          }
          catch {
            $message = $_.Exception.Message

            Write-Host "[ERROR] $message"

            $message |
              Out-File `
                -FilePath $diagnostics `
                -Append `
                -Encoding utf8

            $exitCode = 1
          }

          if ($exitCode -ne 0) {
            Write-Host "[FAIL] Python exit code: $exitCode"
            throw "Gap integrity audit failed"
          }

          Write-Host "[PASS] Python audit completed"

      - name: Verify result and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Audit execution did not succeed"
          }

          $folder = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_event_gap_integrity"

          $resultPath = Join-Path `
            $folder `
            "gap_integrity_result.json"

          $manifestPath = Join-Path `
            $folder `
            "gap_integrity_manifest.json"

          foreach ($path in @($resultPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing report: $path"
            }
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($r.version -ne "Clean V002") {
            throw "Unexpected audit version"
          }

          if ($r.execution -ne "PASS") {
            throw "Audit execution not PASS"
          }

          if ($m.execution -ne "PASS") {
            throw "Manifest execution not PASS"
          }

          if ($r.jobs -ne 870) {
            throw "Unexpected job count"
          }

          if ($r.completed_jobs -ne 870) {
            throw "Incomplete jobs"
          }

          if ($r.failed_jobs -ne 0) {
            throw "Failed jobs detected"
          }

          if ($r.original_event_records -ne 252600) {
            throw "Original event count mismatch"
          }

          if ($r.audited_event_records -ne 252600) {
            throw "Audited event count mismatch"
          }

          if ($r.gap_integrity_audit_completed -ne $true) {
            throw "Gap integrity audit incomplete"
          }

          $classified = (
            [long]$r.confirmed_hits +
            [long]$r.confirmed_misses +
            [long]$r.gap_censored +
            [long]$r.end_censored
          )

          if ($classified -ne 252600) {
            throw "Outcome totals inconsistent"
          }

          if ($r.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($r.point_in_time_proven -ne $false) {
            throw "Unexpected point-in-time approval"
          }

          if ($r.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          $names = @(
            "gap_integrity_events.csv",
            "gap_integrity_summary.csv",
            "gap_integrity_result.json"
          )

          foreach ($name in $names) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }

            $expected = [string]$m.output_sha256.$name

            if ($expected.Length -ne 64) {
              throw "Invalid expected SHA256: $name"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_gap_integrity.py"

          $actualScriptHash = (
            Get-FileHash `
              -LiteralPath $script `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $expectedScriptHash = (
            [string]$m.script_sha256
          ).ToLowerInvariant()

          if ($actualScriptHash -ne $expectedScriptHash) {
            throw "Python script SHA256 mismatch"
          }

          $previousManifest = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_trigger_event_study\event_study_manifest.json"

          $actualPreviousHash = (
            Get-FileHash `
              -LiteralPath $previousManifest `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $expectedPreviousHash = (
            [string]$m.previous_manifest_sha256
          ).ToLowerInvariant()

          if ($actualPreviousHash -ne $expectedPreviousHash) {
            throw "Previous manifest SHA256 mismatch"
          }

          Write-Host "[PASS] All integrity checks passed"

      - name: Publish summary
        if: always()
        run: |
          $folder = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_event_gap_integrity"

          $resultPath = Join-Path `
            $folder `
            "gap_integrity_result.json"

          if ("${{ steps.verify.outcome }}" -ne "success") {
            @"
          ## Pattern 256 Gap Integrity Audit - FAILED

          | Check | Result |
          |---|---|
          | Python execution | ${{ steps.audit.outcome }} |
          | Integrity verification | ${{ steps.verify.outcome }} |
          | Research decision | HOLD |

          Review the Execute gap integrity audit log
          and the uploaded diagnostic log.
          "@ |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8

            exit 0
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          @"
          ## Pattern 256 Event Gap Integrity

          | Check | Result |
          |---|---|
          | Version | $($r.version) |
          | Execution | $($r.execution) |
          | Jobs | $($r.jobs) |
          | Completed | $($r.completed_jobs) |
          | Executed | $($r.executed_jobs) |
          | Resumed | $($r.resumed_jobs) |
          | Failed | $($r.failed_jobs) |
          | Audited records | $($r.audited_event_records) |
          | Confirmed hits | $($r.confirmed_hits) |
          | Confirmed misses | $($r.confirmed_misses) |
          | Gap censored | $($r.gap_censored) |
          | End censored | $($r.end_censored) |
          | Original outcome disagreements | $($r.original_outcome_disagreements) |
          | Independent OOS proven | $($r.independent_oos_proven) |
          | Research decision | $($r.research_decision) |

          ### Corrected +30% retrospective results

          | Timeframe | Period | Hours | Events | Hits | Misses | Gap censored | End censored | Hit rate |
          |---|---|---:|---:|---:|---:|---:|---:|---:|
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

          foreach ($s in $r.summary) {
            $rate = [string]$s.confirmed_hit_rate_pct

            if ([string]::IsNullOrWhiteSpace($rate)) {
              $rate = "N/A"
            } else {
              $rate = "$rate%"
            }

            "| $($s.timeframe) | $($s.period) | $($s.horizon_hours) | $($s.events) | $($s.confirmed_hits) | $($s.confirmed_misses) | $($s.gap_censored) | $($s.end_censored) | $rate |" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8
          }

          @"

          **Research decision: HOLD.**

          This is a retrospective candle-continuity
          audit, not an independent OOS validation.
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-event-gap-integrity
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_gap_integrity\gap_integrity_events.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_gap_integrity\gap_integrity_summary.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_gap_integrity\gap_integrity_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_gap_integrity\gap_integrity_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostics on failure
        if: always() && steps.audit.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-event-gap-diagnostics
          path: |
            ${{ runner.temp }}\event_gap_audit_diagnostics.log
          if-no-files-found: warn
          retention-days: 14

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Gap integrity audit execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Gap integrity verification failed"
          }

          Write-Host "EVENT GAP INTEGRITY AUDIT PASSED"
          Write-Host "RESEARCH DECISION: HOLD"
