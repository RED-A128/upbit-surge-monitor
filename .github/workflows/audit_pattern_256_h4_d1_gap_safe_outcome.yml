
name: audit_pattern_256_h4_d1_gap_safe_outcome.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-h4-d1-gap-safe-outcome
  cancel-in-progress: false

jobs:
  gap-safe-outcome:
    name: gap-safe-outcome

    runs-on:
      - self-hosted
      - Windows

    defaults:
      run:
        shell: powershell

    timeout-minutes: 180

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        id: environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h4_d1_gap_safe_outcome.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing audit script: $script"
          }

          if (-not (Test-Path -LiteralPath $env:PROJECT_ROOT -PathType Container)) {
            throw "Missing project root: $env:PROJECT_ROOT"
          }

          foreach ($tf in @("h4", "d1")) {
            foreach ($relative in @(
              "data\ohlcv\$tf",
              "data\signals\256\$tf"
            )) {
              $folder = Join-Path $env:PROJECT_ROOT $relative

              if (-not (Test-Path -LiteralPath $folder -PathType Container)) {
                throw "Missing directory: $folder"
              }

              $count = @(
                Get-ChildItem `
                  -LiteralPath $folder `
                  -Filter "KRW-*.csv" `
                  -File
              ).Count

              Write-Host "[FOUND] $folder CSV=$count"

              if ($count -eq 0) {
                throw "No CSV files: $folder"
              }
            }
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          Write-Host "[PASS] Environment"

      - name: Execute gap-safe outcome audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h4_d1_gap_safe_outcome.py"

          & py -u $script `
            --root $env:PROJECT_ROOT `
            --threshold 0.30 `
            --warmup 3

          if ($LASTEXITCODE -ne 0) {
            throw "Gap-safe outcome audit failed"
          }

          Write-Host "[PASS] Audit"

      - name: Verify result and SHA256
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h4_d1_gap_safe_outcome"

          $resultPath = Join-Path `
            $folder `
            "gap_safe_outcome_result.json"

          $manifestPath = Join-Path `
            $folder `
            "gap_safe_outcome_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw "Missing result JSON"
          }

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Missing manifest JSON"
          }

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($name in @(
            "gap_safe_outcome_result.json",
            "gap_safe_outcome_report.md"
          )) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing output: $name"
            }

            $expected = $manifest.output_sha256.$name

            if ([string]::IsNullOrWhiteSpace($expected)) {
              throw "Missing expected hash: $name"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($r.execution -ne "PASS") {
            throw "Audit execution not PASS"
          }

          if ($r.classification -ne "GAP_SAFE_OUTCOME_DESCRIPTIVE") {
            throw "Unexpected classification"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($r.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($r.profitability_proven -ne $false) {
            throw "Unexpected profitability approval"
          }

          if ($r.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          foreach ($tf in @("h4", "d1")) {
            $s = $r.timeframes.$tf

            if ($s.markets -ne 290) {
              throw "Unexpected market count: $tf"
            }

            if ($s.total_signals -ne ($s.eligible + $s.excluded_total)) {
              throw "Signal accounting mismatch: $tf"
            }

            if ($s.eligible -ne ($s.hit + $s.miss)) {
              throw "Outcome accounting mismatch: $tf"
            }
          }

          Write-Host "[PASS] Integrity"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h4_d1_gap_safe_outcome\gap_safe_outcome_result.json"

          $r = Get-Content `
            -LiteralPath $path `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 H4/D1 Gap-Safe Outcome Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Classification | $($r.classification) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## +30% outcome within 7 days",
            "",
            "| TF | Markets | Signals | Eligible | Hits | Misses | Hit rate | Excluded |",
            "|---|---:|---:|---:|---:|---:|---:|---:|"
          )

          foreach ($tf in @("h4", "d1")) {
            $s = $r.timeframes.$tf

            $rate = if ($null -eq $s.hit_rate_pct) {
              "N/A"
            } else {
              "$($s.hit_rate_pct)%"
            }

            $lines += (
              "| $tf " +
              "| $($s.markets) " +
              "| $($s.total_signals) " +
              "| $($s.eligible) " +
              "| $($s.hit) " +
              "| $($s.miss) " +
              "| $rate " +
              "| $($s.excluded_total) |"
            )
          }

          $lines += @(
            "",
            "## Exclusion breakdown",
            "",
            "| TF | Warmup | History gap | Incomplete future | Future gap |",
            "|---|---:|---:|---:|---:|"
          )

          foreach ($tf in @("h4", "d1")) {
            $s = $r.timeframes.$tf

            $lines += (
              "| $tf " +
              "| $($s.excluded_warmup) " +
              "| $($s.excluded_history_gap) " +
              "| $($s.excluded_future_incomplete) " +
              "| $($s.excluded_future_gap) |"
            )
          }

          $lines += @(
            "",
            "## Research limitations",
            "",
            "Historical signal events may overlap.",
            "",
            "High-price target touch is not realized profit.",
            "",
            "Independent OOS: NOT PROVEN.",
            "",
            "Profitability: NOT PROVEN.",
            "",
            "Training and live trading remain unapproved."
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage verified reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h4_d1_gap_safe_outcome"

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "gap_safe_outcome_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "gap_safe_outcome_result.json",
            "gap_safe_outcome_report.md",
            "gap_safe_outcome_manifest.json"
          )) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $sourceHash = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash

            $stagedHash = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash

            if ($sourceHash -ne $stagedHash) {
              throw "Staging hash mismatch: $name"
            }
          }

          "STAGED_REPORT_DIR=$destination" |
            Out-File `
              -LiteralPath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

          Write-Host "[PASS] Staging"

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-h4-d1-gap-safe-outcome
          path: ${{ env.STAGED_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $statuses = @(
            "${{ steps.environment.outcome }}",
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )

          foreach ($status in $statuses) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] Gap-safe outcome audit"
          Write-Host "Research decision: HOLD"
