
name: compare_pattern_256_baseline.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-baseline:
    name: compare-baseline
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:
      RESEARCH_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      REPORT_FOLDER: data\reports\pattern_256_baseline_comparison

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify inputs
        run: |
          $ErrorActionPreference = "Stop"

          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE "compare_pattern_256_baseline.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Comparison script missing"
          }

          $previous = Join-Path $env:RESEARCH_ROOT "data\reports\pattern_256_chronological_oos"

          foreach ($name in @(
            "oos_result.json",
            "oos_manifest.json"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $previous $name))) {
              throw "Previous report missing: $name"
            }
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            foreach ($relative in @(
              "data\ohlcv\$tf",
              "data\signals\256\$tf"
            )) {
              $path = Join-Path $env:RESEARCH_ROOT $relative

              if (-not (Test-Path -LiteralPath $path)) {
                throw "Input directory missing: $path"
              }
            }
          }

      - name: Execute baseline comparison
        id: compare
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE "compare_pattern_256_baseline.py"

          py -u $script --root $env:RESEARCH_ROOT --max-samples-per-market-split 100

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline comparison failed"
          }

      - name: Verify SHA256
        id: integrity
        if: steps.compare.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER
          $manifestPath = Join-Path $folder "baseline_manifest.json"
          $resultPath = Join-Path $folder "baseline_result.json"

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Manifest missing"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json

          foreach ($property in $manifest.files.PSObject.Properties) {
            $path = Join-Path $folder $property.Name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Report missing: $($property.Name)"
            }

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = ([string]$property.Value).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $($property.Name)"
            }
          }

          $result = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Execution not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.comparison.Count -ne 27) {
            throw "Expected 27 comparison groups"
          }

          Write-Host "SHA256 verification PASS"

      - name: Publish summary
        if: always()
        run: |
          $folder = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER
          $resultPath = Join-Path $folder "baseline_result.json"

          @"
          # Pattern 256 Baseline Comparison

          | Check | Result |
          |---|---|
          | Execution | ${{ steps.compare.outcome }} |
          | SHA256 integrity | ${{ steps.integrity.outcome }} |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ("${{ steps.integrity.outcome }}" -eq "success") {
            $result = Get-Content -LiteralPath $resultPath -Raw |
              ConvertFrom-Json

            @"

          | Metric | Value |
          |---|---|
          | Version | $($result.version) |
          | Input pairs | $($result.input_pairs) |
          | Baseline candidates | $($result.selected_candidates) |
          | Research decision | $($result.research_decision) |

          ## TEST results

          | TF | Horizon | Signal % | Baseline % | Difference pp |
          |---|---:|---:|---:|---:|
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

            foreach ($row in $result.comparison) {
              if ($row.split -eq "TEST") {
                "| $($row.timeframe) | $($row.horizon) | $($row.signal_hit_rate_pct) | $($row.baseline_hit_rate_pct) | $($row.difference_percentage_points) |" |
                  Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              }
            }

            "`nResearch only. Independent OOS and profitability remain unproven." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Stage reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER
          $target = Join-Path $env:GITHUB_WORKSPACE "baseline_artifacts"

          New-Item -ItemType Directory -Path $target -Force |
            Out-Null

          foreach ($name in @(
            "baseline_result.json",
            "baseline_comparison.csv",
            "baseline_report.md",
            "baseline_manifest.json"
          )) {
            Copy-Item -LiteralPath (Join-Path $source $name) `
              -Destination (Join-Path $target $name) `
              -Force -ErrorAction Stop
          }

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-baseline-comparison
          path: baseline_artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Final gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($outcome in @(
            "${{ steps.compare.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )) {
            if ($outcome -ne "success") {
              throw "Baseline comparison workflow failed"
            }
          }

          Write-Host "Workflow PASS"
          Write-Host "Research decision: HOLD"
