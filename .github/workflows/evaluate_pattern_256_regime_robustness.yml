name: evaluate_pattern_256_regime_robustness.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-regime-robustness
  cancel-in-progress: false

jobs:
  regime-robustness:
    name: regime-robustness

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python validation failed"
          }

      - name: Validate analysis script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_regime_robustness.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing analysis script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          Write-Host "PASS: Python syntax"

      - name: Validate source reports
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_market_regime"

          if (-not (Test-Path -LiteralPath $sourceDir -PathType Container)) {
            throw "Missing source directory: $sourceDir"
          }

          $files = @(
            "market_regime_comparison.csv",
            "market_regime_result.json",
            "market_regime_manifest.json"
          )

          foreach ($file in $files) {
            $path = Join-Path $sourceDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source report: $path"
            }

            Write-Host "FOUND: $path"
          }

          Write-Host "PASS: source reports"

      - name: Validate source metadata
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_market_regime\market_regime_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          if ($result.execution_status -ne "PASS") {
            throw "Source research execution is not PASS"
          }

          if ($result.version -ne "Clean V002") {
            throw "Unexpected source version"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected source trading approval"
          }

          Write-Host "PASS: source metadata"

      - name: Run regime robustness evaluation
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_regime_robustness.py"

          py $script `
            --root "$env:DATA_ROOT" `
            --min-events 30

          if ($LASTEXITCODE -ne 0) {
            throw "Regime robustness evaluation failed"
          }

          Write-Host "PASS: regime robustness evaluation"

      - name: Verify output files and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_robustness"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_market_regime"

          $csvPath = Join-Path `
            $outputDir `
            "regime_robustness_comparison.csv"

          $resultPath = Join-Path `
            $outputDir `
            "regime_robustness_result.json"

          $manifestPath = Join-Path `
            $outputDir `
            "regime_robustness_manifest.json"

          # --------------------------------------------------
          # 1. Validate output files
          # --------------------------------------------------

          foreach ($path in @(
            $csvPath,
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }
          }

          Write-Host "PASS: output files exist"

          # --------------------------------------------------
          # 2. Read result and manifest
          # --------------------------------------------------

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          # --------------------------------------------------
          # 3. Validate research safety
          # --------------------------------------------------

          if ($result.version -ne "Clean V002") {
            throw "Result version mismatch"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Evaluation status is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($manifest.version -ne "Clean V002") {
            throw "Manifest version mismatch"
          }

          Write-Host "PASS: research safety"

          # --------------------------------------------------
          # 4. Validate manifest structure
          # --------------------------------------------------

          if ($null -eq $manifest.output_sha256) {
            throw "Manifest output_sha256 missing"
          }

          if ($null -eq $manifest.input_sha256) {
            throw "Manifest input_sha256 missing"
          }

          Write-Host "PASS: manifest structure"

          # --------------------------------------------------
          # 5. Verify output SHA256
          # --------------------------------------------------

          $outputFiles = @(
            "regime_robustness_comparison.csv",
            "regime_robustness_result.json"
          )

          foreach ($file in $outputFiles) {
            $path = Join-Path $outputDir $file

            $entry = $manifest.output_sha256.PSObject.Properties[$file]

            if ($null -eq $entry) {
              throw "Missing output SHA256 entry: $file"
            }

            $expected = (
              [string]$entry.Value
            ).Trim().ToLowerInvariant()

            if ($expected -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid output SHA256: $file"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.Trim().ToLowerInvariant()

            Write-Host "OUTPUT: $file"
            Write-Host "EXPECTED: $expected"
            Write-Host "ACTUAL:   $actual"

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $file"
            }

            Write-Host "PASS: $file"
          }

          # --------------------------------------------------
          # 6. Verify input SHA256
          # --------------------------------------------------

          $sourceFiles = @(
            "market_regime_comparison.csv",
            "market_regime_result.json",
            "market_regime_manifest.json"
          )

          foreach ($file in $sourceFiles) {
            $path = Join-Path $sourceDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source file: $path"
            }

            $entry = $manifest.input_sha256.PSObject.Properties[$file]

            if ($null -eq $entry) {
              throw "Missing input SHA256 entry: $file"
            }

            $expected = (
              [string]$entry.Value
            ).Trim().ToLowerInvariant()

            if ($expected -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid input SHA256: $file"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.Trim().ToLowerInvariant()

            Write-Host "INPUT: $file"
            Write-Host "EXPECTED: $expected"
            Write-Host "ACTUAL:   $actual"

            if ($actual -ne $expected) {
              throw "Input SHA256 mismatch: $file"
            }

            Write-Host "PASS: $file"
          }

          # --------------------------------------------------
          # 7. Optional result source SHA256 cross-check
          # --------------------------------------------------

          $sourceHashProperty = `
            $result.PSObject.Properties["source_sha256"]

          if ($null -ne $sourceHashProperty) {
            $resultSourceHash = (
              [string]$sourceHashProperty.Value
            ).Trim().ToLowerInvariant()

            if ($resultSourceHash -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid result source_sha256"
            }

            $sourceCsvPath = Join-Path `
              $sourceDir `
              "market_regime_comparison.csv"

            $actualSourceHash = (
              Get-FileHash `
                -LiteralPath $sourceCsvPath `
                -Algorithm SHA256
            ).Hash.Trim().ToLowerInvariant()

            if ($actualSourceHash -ne $resultSourceHash) {
              throw "Result source SHA256 mismatch"
            }

            Write-Host "PASS: result source SHA256"
          }
          else {
            Write-Host "INFO: result source_sha256 not present"
            Write-Host "PASS: source integrity verified using manifest input_sha256"
          }

          # --------------------------------------------------
          # 8. Verify CSV row count
          # --------------------------------------------------

          $csvRows = @(
            Import-Csv -LiteralPath $csvPath
          )

          $expectedRows = [int]$result.comparison_rows

          if ($csvRows.Count -ne $expectedRows) {
            Write-Host "Expected rows: $expectedRows"
            Write-Host "Actual rows: $($csvRows.Count)"

            throw "Comparison row count mismatch"
          }

          Write-Host "PASS: comparison row count"

          # --------------------------------------------------
          # 9. Final verification
          # --------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PATTERN 256 REGIME ROBUSTNESS"
          Write-Host "========================================"
          Write-Host "PASS: Python evaluation"
          Write-Host "PASS: output files"
          Write-Host "PASS: manifest structure"
          Write-Host "PASS: input SHA256"
          Write-Host "PASS: output SHA256"
          Write-Host "PASS: comparison row count"
          Write-Host "PASS: research safety"
          Write-Host "========================================"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_robustness\regime_robustness_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          @"
          # Pattern 256 Regime Robustness

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Version | $($result.version) |
          | Source rows | $($result.source_rows) |
          | Comparison rows | $($result.comparison_rows) |
          | Research decision | $($result.research_decision) |
          | Statistical independence proven | $($result.statistical_independence_proven) |
          | Live trading approved | $($result.approved_for_live_trading) |
          | Input SHA256 | Verified |
          | Output SHA256 | Verified |
          | Comparison row count | Verified |

          ## Notes

          - TRAIN and TEST are evaluated separately.
          - Missing comparison groups remain visible.
          - Small samples do not establish robustness.
          - Results are observational only.
          - No automated trading is enabled.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload robustness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-regime-robustness-v002
          path: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_regime_robustness\'
          if-no-files-found: warn
          retention-days: 30
