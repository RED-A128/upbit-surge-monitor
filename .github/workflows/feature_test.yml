  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: upbit-feature-builder-test
  cancel-in-progress: false

name: Feature Builder Test

on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: upbit-feature-builder-test
  cancel-in-progress: false


jobs:

  feature-test:

    name: KRW-BTC Feature Builder Test

    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"


    steps:


      # ============================================================
      # 1. SHOW TEST INFORMATION
      # ============================================================

      - name: Show feature test information
        run: |
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR - FEATURE BUILDER TEST"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project:"
          Write-Host "Upbit Surge Monitor"
          Write-Host ""

          Write-Host "Feature Builder:"
          Write-Host "Clean V002"
          Write-Host ""

          Write-Host "Research target:"
          Write-Host "256 technique - first quantitative feature expansion"
          Write-Host ""

          Write-Host "Test market:"
          Write-Host "KRW-BTC"
          Write-Host ""

          Write-Host "Test timeframes:"
          Write-Host "H1 / H4 / D1"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "${{ github.repository }}"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "${{ runner.name }}"
          Write-Host ""

          Write-Host "Runner OS:"
          Write-Host "${{ runner.os }}"
          Write-Host ""

          Write-Host "Local project:"
          Write-Host "$env:PROJECT_DIR"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "Source OHLCV write  : DISABLED"
          Write-Host "Source OHLCV delete : DISABLED"
          Write-Host "Future labels       : DISABLED"
          Write-Host "Trading             : DISABLED"
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 2. VERIFY LOCAL PROJECT
      # ============================================================

      - name: Verify local project repository
        run: |
          $project = $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "LOCAL PROJECT CHECK"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[FAIL] Local project directory not found."
              Write-Host ""
              Write-Host $project
              exit 1
          }

          if (-not (Test-Path "$project\.git")) {
              Write-Host "[FAIL] .git directory not found."
              Write-Host ""
              Write-Host "Expected:"
              Write-Host "$project\.git"
              exit 1
          }

          Set-Location $project

          $branch = git branch --show-current

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine Git branch."
              exit 1
          }

          Write-Host "Current branch:"
          Write-Host $branch
          Write-Host ""

          if ($branch -ne "main") {
              Write-Host "[FAIL] Local repository must be on main."
              exit 1
          }

          Write-Host "[PASS] Local repository found."
          Write-Host "[PASS] Current branch is main."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 3. FETCH ORIGIN
      # ============================================================

      - name: Fetch origin safely
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SAFE ORIGIN FETCH"
          Write-Host "============================================================"
          Write-Host ""

          git fetch origin

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] git fetch origin failed."
              exit 1
          }

          $local = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read local HEAD."
              exit 1
          }

          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read origin/main."
              exit 1
          }

          Write-Host "Local HEAD:"
          Write-Host $local
          Write-Host ""

          Write-Host "Origin/main:"
          Write-Host $remote
          Write-Host ""

          Write-Host "[PASS] Origin fetched."
          Write-Host "[PASS] Local files have not been modified."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 4. VERIFY REMOTE DATA PROTECTION
      # ============================================================

      - name: Verify origin data protection rules
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "DATA PROTECTION CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $remoteGitignore = git show origin/main:.gitignore

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read origin/main:.gitignore"
              exit 1
          }

          $requiredRules = @(
              "data/ohlcv/",
              "data/features/",
              "data/latest_features.csv"
          )

          $failed = $false

          foreach ($rule in $requiredRules) {

              $found = $false

              foreach ($line in $remoteGitignore) {

                  if ($line.Trim() -eq $rule) {
                      $found = $true
                      break
                  }
              }

              if ($found) {
                  Write-Host "[FOUND] $rule"
              }
              else {
                  Write-Host "[MISSING] $rule"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] Required data protection rules are missing."
              Write-Host ""
              Write-Host "Feature test stopped before synchronization."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] OHLCV data is ignored by Git."
          Write-Host "[PASS] Feature runtime data is ignored by Git."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 5. PROTECT TRACKED LOCAL CHANGES
      # ============================================================

      - name: Protect tracked local source changes
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "TRACKED LOCAL SOURCE SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $unstaged = @(git diff --name-only)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect unstaged changes."
              exit 1
          }

          $staged = @(git diff --cached --name-only)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect staged changes."
              exit 1
          }

          $trackedChanges = @(
              $unstaged
              $staged
          ) |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              Sort-Object -Unique

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Tracked local changes detected."
              Write-Host ""

              foreach ($file in $trackedChanges) {
                  Write-Host "  $file"
              }

              Write-Host ""
              Write-Host "Automatic overwrite is disabled."
              Write-Host "No reset will be performed."
              Write-Host "No cleanup will be performed."

              exit 1
          }

          Write-Host "[PASS] No tracked local source changes detected."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 6. VERIFY FAST-FORWARD
      # ============================================================

      - name: Verify fast forward synchronization
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FAST-FORWARD SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $local = git rev-parse HEAD
          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine repository revisions."
              exit 1
          }

          if ($local -eq $remote) {

              Write-Host "[PASS] Local main already matches origin/main."
              Write-Host ""
              Write-Host "============================================================"

              exit 0
          }

          git merge-base --is-ancestor HEAD origin/main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Local main cannot be safely fast-forwarded."
              Write-Host ""
              Write-Host "Local and remote history may have diverged."
              Write-Host ""
              Write-Host "No reset or forced synchronization will be used."

              exit 1
          }

          Write-Host "[PASS] Fast-forward synchronization is safe."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 7. SYNCHRONIZE LOCAL REPOSITORY
      # ============================================================

      - name: Synchronize local repository
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "LOCAL REPOSITORY SYNCHRONIZATION"
          Write-Host "============================================================"
          Write-Host ""

          $localBefore = git rev-parse HEAD
          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine Git revisions."
              exit 1
          }

          Write-Host "Local before:"
          Write-Host $localBefore
          Write-Host ""

          Write-Host "Origin/main:"
          Write-Host $remote
          Write-Host ""

          if ($localBefore -eq $remote) {

              Write-Host "[INFO] Local main is already synchronized."

          }
          else {

              Write-Host "Fast-forwarding local main..."
              Write-Host ""

              git merge --ff-only origin/main

              if ($LASTEXITCODE -ne 0) {

                  Write-Host ""
                  Write-Host "[FAIL] Fast-forward synchronization failed."
                  Write-Host ""
                  Write-Host "No reset was attempted."
                  Write-Host "No forced checkout was attempted."
                  Write-Host "No local OHLCV data was deleted."

                  exit 1
              }
          }

          $localAfter = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read synchronized local commit."
              exit 1
          }

          if ($localAfter -ne $remote) {

              Write-Host "[FAIL] Local main does not match origin/main."
              exit 1
          }

          Write-Host ""
          Write-Host "Local after:"
          Write-Host $localAfter
          Write-Host ""

          Write-Host "[PASS] Local repository synchronized safely."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 8. VERIFY REQUIRED FILES
      # ============================================================

      - name: Verify feature builder files
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE BUILDER FILE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $requiredFiles = @(
              "build_features.py",
              "data\ohlcv\h1\KRW-BTC.csv",
              "data\ohlcv\h4\KRW-BTC.csv",
              "data\ohlcv\d1\KRW-BTC.csv"
          )

          $failed = $false

          foreach ($file in $requiredFiles) {

              if (Test-Path $file) {

                  $item = Get-Item $file

                  Write-Host "[FOUND] $file"
                  Write-Host "        Size: $($item.Length) bytes"

              }
              else {

                  Write-Host "[MISSING] $file"
                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Required Feature Builder input files are missing."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Feature Builder and KRW-BTC source data are present."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 9. VERIFY PYTHON
      # ============================================================

      - name: Verify Python
        run: |
          Write-Host "============================================================"
          Write-Host "PYTHON CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Windows Python launcher 'py' is unavailable."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python is available."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 10. VERIFY PYTHON DEPENDENCIES
      # ============================================================

      - name: Verify feature dependencies
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE DEPENDENCY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py -c "import pandas; import numpy; print('pandas:', pandas.__version__); print('numpy :', numpy.__version__)"

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] pandas and/or numpy is unavailable."
              Write-Host ""
              Write-Host "Feature test stopped."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Required Python dependencies are available."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 11. RECORD SOURCE OHLCV HASHES BEFORE TEST
      # ============================================================

      - name: Record source hashes before feature build
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SOURCE OHLCV HASH - BEFORE"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\ohlcv\h1\KRW-BTC.csv",
              "data\ohlcv\h4\KRW-BTC.csv",
              "data\ohlcv\d1\KRW-BTC.csv"
          )

          $hashFile = Join-Path $env:RUNNER_TEMP "feature_test_source_hashes.txt"

          if (Test-Path $hashFile) {
              Remove-Item $hashFile -Force
          }

          foreach ($file in $files) {

              $hash = (Get-FileHash -Algorithm SHA256 $file).Hash

              "$file|$hash" | Out-File `
                  -FilePath $hashFile `
                  -Append `
                  -Encoding utf8

              Write-Host "$file"
              Write-Host "  SHA256: $hash"
              Write-Host ""
          }

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Source hash snapshot was not created."
              exit 1
          }

          Write-Host "[PASS] Source hashes recorded."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 12. RUN BUILD_FEATURES.PY
      # ============================================================

      - name: Run KRW-BTC feature builder
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "KRW-BTC FEATURE BUILDER - CLEAN V002"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Command:"
          Write-Host "py build_features.py"
          Write-Host ""

          py build_features.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Feature Builder exit code:"
          Write-Host $exitCode
          Write-Host ""

          if ($exitCode -ne 0) {

              Write-Host "[FAIL] build_features.py failed."
              Write-Host ""
              Write-Host "Feature test stopped."

              exit $exitCode
          }

          Write-Host "[PASS] build_features.py completed normally."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 13. VERIFY SOURCE OHLCV HASHES AFTER TEST
      # ============================================================

      - name: Verify source OHLCV remained unchanged
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SOURCE OHLCV IMMUTABILITY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path $env:RUNNER_TEMP "feature_test_source_hashes.txt"

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Before-test hash snapshot not found."
              exit 1
          }

          $failed = $false

          $lines = Get-Content $hashFile

          foreach ($line in $lines) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $parts = $line.Split("|", 2)

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid hash snapshot line:"
                  Write-Host $line

                  $failed = $true
                  continue
              }

              $file = $parts[0]
              $beforeHash = $parts[1]

              if (-not (Test-Path $file)) {

                  Write-Host "[FAIL] Source file disappeared:"
                  Write-Host $file

                  $failed = $true
                  continue
              }

              $afterHash = (Get-FileHash -Algorithm SHA256 $file).Hash

              Write-Host "$file"
              Write-Host "  Before: $beforeHash"
              Write-Host "  After : $afterHash"

              if ($beforeHash -ne $afterHash) {

                  Write-Host "  [FAIL] SOURCE FILE CHANGED"
                  $failed = $true

              }
              else {

                  Write-Host "  [PASS] UNCHANGED"
              }

              Write-Host ""
          }

          if ($failed) {

              Write-Host "[FAIL] One or more source OHLCV files changed."
              Write-Host ""
              Write-Host "This violates the Feature Builder safety policy."

              exit 1
          }

          Write-Host "[PASS] All KRW-BTC source OHLCV files remained unchanged."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 14. VERIFY FEATURE OUTPUT FILES
      # ============================================================

      - name: Verify feature output files
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE OUTPUT FILE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\features\h1\KRW-BTC.csv",
              "data\features\h4\KRW-BTC.csv",
              "data\features\d1\KRW-BTC.csv"
          )

          $failed = $false

          foreach ($file in $files) {

              if (-not (Test-Path $file)) {

                  Write-Host "[MISSING] $file"
                  $failed = $true

                  continue
              }

              $item = Get-Item $file

              Write-Host "[FOUND] $file"
              Write-Host "        Size: $($item.Length) bytes"

              if ($item.Length -le 0) {

                  Write-Host "        [FAIL] Feature file is empty."
                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Feature output verification failed."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] KRW-BTC H1/H4/D1 feature files exist."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 15. VERIFY FEATURE CSV ROW COUNTS
      # ============================================================

      - name: Verify feature row counts
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE ROW COUNT CHECK"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import pandas as pd
          from pathlib import Path

          pairs = [
              (
                  Path("data/ohlcv/h1/KRW-BTC.csv"),
                  Path("data/features/h1/KRW-BTC.csv"),
                  "H1",
              ),
              (
                  Path("data/ohlcv/h4/KRW-BTC.csv"),
                  Path("data/features/h4/KRW-BTC.csv"),
                  "H4",
              ),
              (
                  Path("data/ohlcv/d1/KRW-BTC.csv"),
                  Path("data/features/d1/KRW-BTC.csv"),
                  "D1",
              ),
          ]

          failed = False

          for source_path, feature_path, timeframe in pairs:

              source = pd.read_csv(
                  source_path,
                  encoding="utf-8-sig",
              )

              feature = pd.read_csv(
                  feature_path,
                  encoding="utf-8-sig",
              )

              source_rows = len(source)
              feature_rows = len(feature)

              print(
                  f"{timeframe}: "
                  f"source={source_rows:,}, "
                  f"feature={feature_rows:,}"
              )

              if source_rows != feature_rows:

                  print(
                      f"[FAIL] {timeframe} row count mismatch."
                  )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} row count matches."
                  )

          if failed:
              raise SystemExit(1)

          print()
          print(
              "[PASS] All feature row counts match source OHLCV."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Feature row count verification failed."

              exit 1
          }

          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 16. VERIFY REQUIRED FEATURE COLUMNS
      #
      # Clean V002:
      #
      # Existing V001 columns
      # +
      # 21 first-stage quantitative features for 256 research
      #
      # ============================================================

      - name: Verify required Clean V002 feature columns
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "CLEAN V002 FEATURE COLUMN CHECK"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import pandas as pd
          from pathlib import Path

          files = [
              (
                  Path("data/features/h1/KRW-BTC.csv"),
                  "H1",
              ),
              (
                  Path("data/features/h4/KRW-BTC.csv"),
                  "H4",
              ),
              (
                  Path("data/features/d1/KRW-BTC.csv"),
                  "D1",
              ),
          ]

          base_required = [
              "market",
              "candle_date_time_utc",
              "open",
              "high",
              "low",
              "close",
              "volume",
              "trade_value",

              "return_1",
              "return_3",
              "return_6",
              "return_12",
              "return_24",

              "sma_5",
              "sma_10",
              "sma_20",
              "sma_60",
              "sma_120",

              "ema_5",
              "ema_10",
              "ema_20",
              "ema_60",

              "rsi_14",

              "macd",
              "macd_signal",
              "macd_hist",

              "atr_14",
              "atr_pct_14",

              "bb_mid",
              "bb_upper",
              "bb_lower",
              "bb_width",
              "bb_position",

              "volume_sma_5",
              "volume_sma_20",
              "volume_ratio_5",
              "volume_ratio_20",

              "body",
              "body_pct",
              "range",
              "range_pct",

              "rolling_high_20",
              "rolling_low_20",
              "rolling_high_60",
              "rolling_low_60",
          ]

          feature_256_required = [
              "sma_112",
              "sma_224",

              "close_to_sma_5",
              "close_to_sma_112",
              "close_to_sma_224",

              "sma_5_to_20",
              "sma_5_to_60",
              "sma_20_to_60",
              "sma_5_to_112",
              "sma_5_to_224",
              "sma_112_to_224",

              "sma_5_slope_1",
              "sma_5_slope_3",

              "sma_20_slope_1",
              "sma_20_slope_3",

              "sma_60_slope_1",
              "sma_60_slope_3",

              "sma_112_slope_1",
              "sma_112_slope_3",

              "sma_224_slope_1",
              "sma_224_slope_3",
          ]

          if len(feature_256_required) != 21:
              print(
                  "[FAIL] Internal test definition error: "
                  f"expected 21 V002 features, "
                  f"got {len(feature_256_required)}."
              )
              raise SystemExit(1)

          required = (
              base_required
              + feature_256_required
          )

          failed = False

          print(
              "Base required columns :",
              len(base_required),
          )

          print(
              "256 V002 columns      :",
              len(feature_256_required),
          )

          print(
              "Total required columns:",
              len(required),
          )

          print()

          for path, timeframe in files:

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
                  nrows=5,
              )

              missing_base = [
                  column
                  for column in base_required
                  if column not in df.columns
              ]

              missing_256 = [
                  column
                  for column in feature_256_required
                  if column not in df.columns
              ]

              print(
                  f"{timeframe}: "
                  f"{len(df.columns):,} columns"
              )

              if missing_base:

                  print(
                      "[FAIL] Missing existing/base columns:"
                  )

                  for column in missing_base:
                      print(
                          f"  {column}"
                      )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} "
                      "existing/base columns present."
                  )

              if missing_256:

                  print(
                      "[FAIL] Missing Clean V002 "
                      "256 research columns:"
                  )

                  for column in missing_256:
                      print(
                          f"  {column}"
                      )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} "
                      "all 21 Clean V002 "
                      "256 research columns present."
                  )

              print()

          if failed:
              raise SystemExit(1)

          print(
              "[PASS] Existing Feature V001 columns preserved."
          )

          print(
              "[PASS] All 21 Clean V002 "
              "256 research features verified."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Clean V002 feature column verification failed."

              exit 1
          }

          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 17. VERIFY FEATURE TIMESTAMP INTEGRITY
      #
      # Confirm:
      #
      # - timestamp column exists
      # - timestamps parse correctly
      # - no duplicate candle timestamps
      # - chronological ascending order
      # - source and feature timestamps are identical
      #
      # ============================================================

      - name: Verify feature timestamp integrity
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE TIMESTAMP INTEGRITY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import pandas as pd
          from pathlib import Path

          pairs = [
              (
                  Path("data/ohlcv/h1/KRW-BTC.csv"),
                  Path("data/features/h1/KRW-BTC.csv"),
                  "H1",
              ),
              (
                  Path("data/ohlcv/h4/KRW-BTC.csv"),
                  Path("data/features/h4/KRW-BTC.csv"),
                  "H4",
              ),
              (
                  Path("data/ohlcv/d1/KRW-BTC.csv"),
                  Path("data/features/d1/KRW-BTC.csv"),
                  "D1",
              ),
          ]

          failed = False

          timestamp_column = "candle_date_time_utc"

          for source_path, feature_path, timeframe in pairs:

              source = pd.read_csv(
                  source_path,
                  encoding="utf-8-sig",
              )

              feature = pd.read_csv(
                  feature_path,
                  encoding="utf-8-sig",
              )

              print(
                  "------------------------------------------------------------"
              )

              print(
                  f"{timeframe} timestamp validation"
              )

              if timestamp_column not in source.columns:

                  print(
                      "[FAIL] Source timestamp column missing."
                  )

                  failed = True
                  continue

              if timestamp_column not in feature.columns:

                  print(
                      "[FAIL] Feature timestamp column missing."
                  )

                  failed = True
                  continue

              source_ts = pd.to_datetime(
                  source[timestamp_column],
                  errors="coerce",
                  utc=True,
              )

              feature_ts = pd.to_datetime(
                  feature[timestamp_column],
                  errors="coerce",
                  utc=True,
              )

              if source_ts.isna().any():

                  print(
                      "[FAIL] Source contains invalid timestamps."
                  )

                  failed = True

              if feature_ts.isna().any():

                  print(
                      "[FAIL] Feature contains invalid timestamps."
                  )

                  failed = True

              if feature_ts.duplicated().any():

                  duplicate_count = int(
                      feature_ts.duplicated().sum()
                  )

                  print(
                      "[FAIL] Duplicate feature timestamps:",
                      duplicate_count,
                  )

                  failed = True

              else:

                  print(
                      "[PASS] No duplicate feature timestamps."
                  )

              if not feature_ts.is_monotonic_increasing:

                  print(
                      "[FAIL] Feature timestamps are not "
                      "chronologically ascending."
                  )

                  failed = True

              else:

                  print(
                      "[PASS] Feature timestamps are ascending."
                  )

              if len(source_ts) != len(feature_ts):

                  print(
                      "[FAIL] Source/feature timestamp lengths differ."
                  )

                  failed = True

              elif not source_ts.reset_index(
                  drop=True
              ).equals(
                  feature_ts.reset_index(
                      drop=True
                  )
              ):

                  print(
                      "[FAIL] Feature timestamps do not exactly "
                      "match source OHLCV timestamps."
                  )

                  failed = True

              else:

                  print(
                      "[PASS] Feature timestamps exactly match "
                      "source OHLCV."
                  )

              print()

          if failed:
              raise SystemExit(1)

          print(
              "[PASS] H1/H4/D1 timestamp integrity verified."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Feature timestamp integrity check failed."

              exit 1
          }

          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 18. VERIFY FEATURE VALUES
      #
      # This is intentionally a structural/sanity test.
      #
      # NaN values at the beginning of rolling indicators are valid.
      #
      # The test rejects:
      #
      # - completely empty V002 feature columns
      # - infinite values
      #
      # ============================================================

      - name: Verify Clean V002 feature values
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "CLEAN V002 FEATURE VALUE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import numpy as np
          import pandas as pd
          from pathlib import Path

          files = [
              (
                  Path("data/features/h1/KRW-BTC.csv"),
                  "H1",
              ),
              (
                  Path("data/features/h4/KRW-BTC.csv"),
                  "H4",
              ),
              (
                  Path("data/features/d1/KRW-BTC.csv"),
                  "D1",
              ),
          ]

          feature_256_required = [
              "sma_112",
              "sma_224",
              "close_to_sma_5",
              "close_to_sma_112",
              "close_to_sma_224",
              "sma_5_to_20",
              "sma_5_to_60",
              "sma_20_to_60",
              "sma_5_to_112",
              "sma_5_to_224",
              "sma_112_to_224",
              "sma_5_slope_1",
              "sma_5_slope_3",
              "sma_20_slope_1",
              "sma_20_slope_3",
              "sma_60_slope_1",
              "sma_60_slope_3",
              "sma_112_slope_1",
              "sma_112_slope_3",
              "sma_224_slope_1",
              "sma_224_slope_3",
          ]

          failed = False

          for path, timeframe in files:

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
              )

              print(
                  "------------------------------------------------------------"
              )

              print(
                  f"{timeframe} V002 value validation"
              )

              for column in feature_256_required:

                  if column not in df.columns:

                      print(
                          f"[FAIL] Missing column: {column}"
                      )

                      failed = True
                      continue

                  values = pd.to_numeric(
                      df[column],
                      errors="coerce",
                  )

                  valid_count = int(
                      values.notna().sum()
                  )

                  if valid_count == 0:

                      print(
                          f"[FAIL] {column}: "
                          "no usable numeric values."
                      )

                      failed = True
                      continue

                  finite_mask = np.isfinite(
                      values.dropna().to_numpy(
                          dtype=float
                      )
                  )

                  if not finite_mask.all():

                      print(
                          f"[FAIL] {column}: "
                          "infinite value detected."
                      )

                      failed = True
                      continue

                  print(
                      f"[PASS] {column}: "
                      f"{valid_count:,} usable values"
                  )

              print()

          if failed:
              raise SystemExit(1)

          print(
              "[PASS] Clean V002 feature values passed "
              "basic sanity validation."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Clean V002 feature value check failed."

              exit 1
          }

          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 19. VERIFY FEATURE STATUS FILE
      # ============================================================

      - name: Verify feature build status
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE BUILD STATUS CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $statusFile = "data\feature_build_status.csv"

          if (-not (Test-Path $statusFile)) {

              Write-Host "[FAIL] Feature build status file not found."
              Write-Host ""
              Write-Host "Expected:"
              Write-Host $statusFile

              exit 1
          }

          $item = Get-Item $statusFile

          Write-Host "[FOUND] $statusFile"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host ""

          if ($item.Length -le 0) {

              Write-Host "[FAIL] Feature status file is empty."
              exit 1
          }

          Write-Host "[PASS] Feature build status file exists."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 20. FINAL GIT SAFETY CHECK
      # ============================================================

      - name: Verify generated data remains ignored
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $trackedChanges = @(
              git status --porcelain
          )

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Could not inspect Git status."
              exit 1
          }

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Feature test created unexpected Git-visible changes."
              Write-Host ""

              git status --short

              Write-Host ""
              Write-Host "Generated runtime data must remain ignored."

              exit 1
          }

          Write-Host "[PASS] Git working tree remains clean."
          Write-Host "[PASS] Generated feature data is not tracked."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 21. COMPLETED
      # ============================================================

      - name: Feature Builder test completed
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FEATURE BUILDER TEST COMPLETED"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Feature Builder:"
          Write-Host "Clean V002"
          Write-Host ""

          Write-Host "Research:"
          Write-Host "256 technique - quantitative feature foundation"
          Write-Host ""

          Write-Host "Market:"
          Write-Host "KRW-BTC"
          Write-Host ""

          Write-Host "Timeframes:"
          Write-Host "H1 / H4 / D1"
          Write-Host ""

          Write-Host "[PASS] Git synchronization completed safely."
          Write-Host "[PASS] Existing OHLCV data was preserved."
          Write-Host "[PASS] Source SHA256 remained unchanged."
          Write-Host "[PASS] KRW-BTC H1 feature file generated."
          Write-Host "[PASS] KRW-BTC H4 feature file generated."
          Write-Host "[PASS] KRW-BTC D1 feature file generated."
          Write-Host "[PASS] Feature row counts match source rows."
          Write-Host "[PASS] Existing Feature V001 columns preserved."
          Write-Host "[PASS] All 21 Clean V002 256 research features exist."
          Write-Host "[PASS] Feature timestamps match source OHLCV."
          Write-Host "[PASS] No duplicate feature timestamps detected."
          Write-Host "[PASS] Feature chronological order verified."
          Write-Host "[PASS] Clean V002 feature values passed sanity checks."
          Write-Host "[PASS] Generated feature data remains ignored by Git."
          Write-Host ""

          Write-Host "Feature output:"
          Write-Host "$env:PROJECT_DIR\data\features"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "Source OHLCV write    : DISABLED"
          Write-Host "Source OHLCV delete   : DISABLED"
          Write-Host "Git reset --hard      : DISABLED"
          Write-Host "Git clean             : DISABLED"
          Write-Host "Forced synchronization: DISABLED"
          Write-Host "Automatic Git commit  : DISABLED"
          Write-Host "Automatic Git push    : DISABLED"
          Write-Host "Future labels         : DISABLED"
          Write-Host "Trading               : DISABLED"
          Write-Host ""

          Write-Host "============================================================"
jobs:

  feature-test:

    name: KRW-BTC Feature Builder Test

    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"


    steps:


      # ============================================================
      # 1. SHOW TEST INFORMATION
      # ============================================================

      - name: Show feature test information
        run: |
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR - FEATURE BUILDER TEST"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project:"
          Write-Host "Upbit Surge Monitor"
          Write-Host ""

          Write-Host "Feature Builder:"
          Write-Host "Clean V001"
          Write-Host ""

          Write-Host "Test market:"
          Write-Host "KRW-BTC"
          Write-Host ""

          Write-Host "Test timeframes:"
          Write-Host "H1 / H4 / D1"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "${{ github.repository }}"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "${{ runner.name }}"
          Write-Host ""

          Write-Host "Runner OS:"
          Write-Host "${{ runner.os }}"
          Write-Host ""

          Write-Host "Local project:"
          Write-Host "$env:PROJECT_DIR"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "Source OHLCV write  : DISABLED"
          Write-Host "Source OHLCV delete : DISABLED"
          Write-Host "Trading             : DISABLED"
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 2. VERIFY LOCAL PROJECT
      # ============================================================

      - name: Verify local project repository
        run: |
          $project = $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "LOCAL PROJECT CHECK"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[FAIL] Local project directory not found."
              Write-Host ""
              Write-Host $project
              exit 1
          }

          if (-not (Test-Path "$project\.git")) {
              Write-Host "[FAIL] .git directory not found."
              Write-Host ""
              Write-Host "Expected:"
              Write-Host "$project\.git"
              exit 1
          }

          Set-Location $project

          $branch = git branch --show-current

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine Git branch."
              exit 1
          }

          Write-Host "Current branch:"
          Write-Host $branch
          Write-Host ""

          if ($branch -ne "main") {
              Write-Host "[FAIL] Local repository must be on main."
              exit 1
          }

          Write-Host "[PASS] Local repository found."
          Write-Host "[PASS] Current branch is main."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 3. FETCH ORIGIN
      # ============================================================

      - name: Fetch origin safely
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SAFE ORIGIN FETCH"
          Write-Host "============================================================"
          Write-Host ""

          git fetch origin

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] git fetch origin failed."
              exit 1
          }

          $local = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read local HEAD."
              exit 1
          }

          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read origin/main."
              exit 1
          }

          Write-Host "Local HEAD:"
          Write-Host $local
          Write-Host ""

          Write-Host "Origin/main:"
          Write-Host $remote
          Write-Host ""

          Write-Host "[PASS] Origin fetched."
          Write-Host "[PASS] Local files have not been modified."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 4. VERIFY REMOTE DATA PROTECTION
      # ============================================================

      - name: Verify origin data protection rules
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "DATA PROTECTION CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $remoteGitignore = git show origin/main:.gitignore

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read origin/main:.gitignore"
              exit 1
          }

          $requiredRules = @(
              "data/ohlcv/",
              "data/features/",
              "data/latest_features.csv"
          )

          $failed = $false

          foreach ($rule in $requiredRules) {

              $found = $false

              foreach ($line in $remoteGitignore) {

                  if ($line.Trim() -eq $rule) {
                      $found = $true
                      break
                  }
              }

              if ($found) {
                  Write-Host "[FOUND] $rule"
              }
              else {
                  Write-Host "[MISSING] $rule"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host ""
              Write-Host "[FAIL] Required data protection rules are missing."
              Write-Host ""
              Write-Host "Feature test stopped before synchronization."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] OHLCV data is ignored by Git."
          Write-Host "[PASS] Feature runtime data is ignored by Git."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 5. PROTECT TRACKED LOCAL CHANGES
      # ============================================================

      - name: Protect tracked local source changes
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "TRACKED LOCAL SOURCE SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $unstaged = @(git diff --name-only)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect unstaged changes."
              exit 1
          }

          $staged = @(git diff --cached --name-only)

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect staged changes."
              exit 1
          }

          $trackedChanges = @(
              $unstaged
              $staged
          ) |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              Sort-Object -Unique

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Tracked local changes detected."
              Write-Host ""

              foreach ($file in $trackedChanges) {
                  Write-Host "  $file"
              }

              Write-Host ""
              Write-Host "Automatic overwrite is disabled."
              Write-Host "No reset will be performed."
              Write-Host "No cleanup will be performed."

              exit 1
          }

          Write-Host "[PASS] No tracked local source changes detected."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 6. VERIFY FAST-FORWARD
      # ============================================================

      - name: Verify fast forward synchronization
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FAST-FORWARD SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $local = git rev-parse HEAD
          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine repository revisions."
              exit 1
          }

          if ($local -eq $remote) {

              Write-Host "[PASS] Local main already matches origin/main."
              Write-Host ""
              Write-Host "============================================================"

              exit 0
          }

          git merge-base --is-ancestor HEAD origin/main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Local main cannot be safely fast-forwarded."
              Write-Host ""
              Write-Host "Local and remote history may have diverged."
              Write-Host ""
              Write-Host "No reset or forced synchronization will be used."

              exit 1
          }

          Write-Host "[PASS] Fast-forward synchronization is safe."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 7. SYNCHRONIZE LOCAL REPOSITORY
      # ============================================================

      - name: Synchronize local repository
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "LOCAL REPOSITORY SYNCHRONIZATION"
          Write-Host "============================================================"
          Write-Host ""

          $localBefore = git rev-parse HEAD
          $remote = git rev-parse origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine Git revisions."
              exit 1
          }

          Write-Host "Local before:"
          Write-Host $localBefore
          Write-Host ""

          Write-Host "Origin/main:"
          Write-Host $remote
          Write-Host ""

          if ($localBefore -eq $remote) {

              Write-Host "[INFO] Local main is already synchronized."

          }
          else {

              Write-Host "Fast-forwarding local main..."
              Write-Host ""

              git merge --ff-only origin/main

              if ($LASTEXITCODE -ne 0) {

                  Write-Host ""
                  Write-Host "[FAIL] Fast-forward synchronization failed."
                  Write-Host ""
                  Write-Host "No reset was attempted."
                  Write-Host "No forced checkout was attempted."
                  Write-Host "No local OHLCV data was deleted."

                  exit 1
              }
          }

          $localAfter = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read synchronized local commit."
              exit 1
          }

          if ($localAfter -ne $remote) {

              Write-Host "[FAIL] Local main does not match origin/main."
              exit 1
          }

          Write-Host ""
          Write-Host "Local after:"
          Write-Host $localAfter
          Write-Host ""

          Write-Host "[PASS] Local repository synchronized safely."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 8. VERIFY REQUIRED FILES
      # ============================================================

      - name: Verify feature builder files
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE BUILDER FILE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $requiredFiles = @(
              "build_features.py",
              "data\ohlcv\h1\KRW-BTC.csv",
              "data\ohlcv\h4\KRW-BTC.csv",
              "data\ohlcv\d1\KRW-BTC.csv"
          )

          $failed = $false

          foreach ($file in $requiredFiles) {

              if (Test-Path $file) {

                  $item = Get-Item $file

                  Write-Host "[FOUND] $file"
                  Write-Host "        Size: $($item.Length) bytes"

              }
              else {

                  Write-Host "[MISSING] $file"
                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Required Feature Builder input files are missing."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Feature Builder and KRW-BTC source data are present."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 9. VERIFY PYTHON
      # ============================================================

      - name: Verify Python
        run: |
          Write-Host "============================================================"
          Write-Host "PYTHON CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Windows Python launcher 'py' is unavailable."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python is available."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 10. VERIFY PYTHON DEPENDENCIES
      # ============================================================

      - name: Verify feature dependencies
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE DEPENDENCY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py -c "import pandas; import numpy; print('pandas:', pandas.__version__); print('numpy :', numpy.__version__)"

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] pandas and/or numpy is unavailable."
              Write-Host ""
              Write-Host "Feature test stopped."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Required Python dependencies are available."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 11. RECORD SOURCE OHLCV HASHES BEFORE TEST
      # ============================================================

      - name: Record source hashes before feature build
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SOURCE OHLCV HASH - BEFORE"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\ohlcv\h1\KRW-BTC.csv",
              "data\ohlcv\h4\KRW-BTC.csv",
              "data\ohlcv\d1\KRW-BTC.csv"
          )

          $hashFile = Join-Path $env:RUNNER_TEMP "feature_test_source_hashes.txt"

          if (Test-Path $hashFile) {
              Remove-Item $hashFile -Force
          }

          foreach ($file in $files) {

              $hash = (Get-FileHash -Algorithm SHA256 $file).Hash

              "$file|$hash" | Out-File `
                  -FilePath $hashFile `
                  -Append `
                  -Encoding utf8

              Write-Host "$file"
              Write-Host "  SHA256: $hash"
              Write-Host ""
          }

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Source hash snapshot was not created."
              exit 1
          }

          Write-Host "[PASS] Source hashes recorded."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 12. RUN BUILD_FEATURES.PY
      # ============================================================

      - name: Run KRW-BTC feature builder
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "KRW-BTC FEATURE BUILDER"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Command:"
          Write-Host "py build_features.py"
          Write-Host ""

          py build_features.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Feature Builder exit code:"
          Write-Host $exitCode
          Write-Host ""

          if ($exitCode -ne 0) {

              Write-Host "[FAIL] build_features.py failed."
              Write-Host ""
              Write-Host "Feature test stopped."

              exit $exitCode
          }

          Write-Host "[PASS] build_features.py completed normally."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 13. VERIFY SOURCE OHLCV HASHES AFTER TEST
      # ============================================================

      - name: Verify source OHLCV remained unchanged
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "SOURCE OHLCV IMMUTABILITY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path $env:RUNNER_TEMP "feature_test_source_hashes.txt"

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Before-test hash snapshot not found."
              exit 1
          }

          $failed = $false

          $lines = Get-Content $hashFile

          foreach ($line in $lines) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $parts = $line.Split("|", 2)

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid hash snapshot line:"
                  Write-Host $line

                  $failed = $true
                  continue
              }

              $file = $parts[0]
              $beforeHash = $parts[1]

              if (-not (Test-Path $file)) {

                  Write-Host "[FAIL] Source file disappeared:"
                  Write-Host $file

                  $failed = $true
                  continue
              }

              $afterHash = (Get-FileHash -Algorithm SHA256 $file).Hash

              Write-Host "$file"
              Write-Host "  Before: $beforeHash"
              Write-Host "  After : $afterHash"

              if ($beforeHash -ne $afterHash) {

                  Write-Host "  [FAIL] SOURCE FILE CHANGED"
                  $failed = $true

              }
              else {

                  Write-Host "  [PASS] UNCHANGED"
              }

              Write-Host ""
          }

          if ($failed) {

              Write-Host "[FAIL] One or more source OHLCV files changed."
              Write-Host ""
              Write-Host "This violates the Feature Builder safety policy."

              exit 1
          }

          Write-Host "[PASS] All KRW-BTC source OHLCV files remained unchanged."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 14. VERIFY FEATURE OUTPUT FILES
      # ============================================================

      - name: Verify feature output files
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE OUTPUT FILE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\features\h1\KRW-BTC.csv",
              "data\features\h4\KRW-BTC.csv",
              "data\features\d1\KRW-BTC.csv"
          )

          $failed = $false

          foreach ($file in $files) {

              if (-not (Test-Path $file)) {

                  Write-Host "[MISSING] $file"
                  $failed = $true

                  continue
              }

              $item = Get-Item $file

              Write-Host "[FOUND] $file"
              Write-Host "        Size: $($item.Length) bytes"

              if ($item.Length -le 0) {

                  Write-Host "        [FAIL] Feature file is empty."
                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Feature output verification failed."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] KRW-BTC H1/H4/D1 feature files exist."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 15. VERIFY FEATURE CSV ROW COUNTS
      # ============================================================

      - name: Verify feature row counts
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE ROW COUNT CHECK"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import pandas as pd
          from pathlib import Path

          pairs = [
              (
                  Path("data/ohlcv/h1/KRW-BTC.csv"),
                  Path("data/features/h1/KRW-BTC.csv"),
                  "H1",
              ),
              (
                  Path("data/ohlcv/h4/KRW-BTC.csv"),
                  Path("data/features/h4/KRW-BTC.csv"),
                  "H4",
              ),
              (
                  Path("data/ohlcv/d1/KRW-BTC.csv"),
                  Path("data/features/d1/KRW-BTC.csv"),
                  "D1",
              ),
          ]

          failed = False

          for source_path, feature_path, timeframe in pairs:

              source = pd.read_csv(
                  source_path,
                  encoding="utf-8-sig",
              )

              feature = pd.read_csv(
                  feature_path,
                  encoding="utf-8-sig",
              )

              source_rows = len(source)
              feature_rows = len(feature)

              print(
                  f"{timeframe}: "
                  f"source={source_rows:,}, "
                  f"feature={feature_rows:,}"
              )

              if source_rows != feature_rows:

                  print(
                      f"[FAIL] {timeframe} row count mismatch."
                  )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} row count matches."
                  )

          if failed:
              raise SystemExit(1)

          print()
          print(
              "[PASS] All feature row counts match source OHLCV."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Feature row count verification failed."

              exit 1
          }

          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 16. VERIFY REQUIRED FEATURE COLUMNS
      # ============================================================

      - name: Verify required feature columns
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE COLUMN CHECK"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import pandas as pd
          from pathlib import Path

          files = [
              (
                  Path("data/features/h1/KRW-BTC.csv"),
                  "H1",
              ),
              (
                  Path("data/features/h4/KRW-BTC.csv"),
                  "H4",
              ),
              (
                  Path("data/features/d1/KRW-BTC.csv"),
                  "D1",
              ),
          ]

          required = [
              "market",
              "candle_date_time_utc",
              "open",
              "high",
              "low",
              "close",
              "volume",
              "trade_value",

              "return_1",
              "return_3",
              "return_6",
              "return_12",
              "return_24",

              "sma_5",
              "sma_10",
              "sma_20",
              "sma_60",
              "sma_120",

              "ema_5",
              "ema_10",
              "ema_20",
              "ema_60",

              "rsi_14",

              "macd",
              "macd_signal",
              "macd_hist",

              "atr_14",
              "atr_pct_14",

              "bb_mid",
              "bb_upper",
              "bb_lower",
              "bb_width",
              "bb_position",

              "volume_sma_5",
              "volume_sma_20",
              "volume_ratio_5",
              "volume_ratio_20",

              "body",
              "body_pct",
              "range",
              "range_pct",

              "rolling_high_20",
              "rolling_low_20",
              "rolling_high_60",
              "rolling_low_60",
          ]

          failed = False

          for path, timeframe in files:

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
                  nrows=5,
              )

              missing = [
                  column
                  for column in required
                  if column not in df.columns
              ]

              print(
                  f"{timeframe}: "
                  f"{len(df.columns):,} columns"
              )

              if missing:

                  print(
                      "[FAIL] Missing columns:"
                  )

                  for column in missing:
                      print(
                          f"  {column}"
                      )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} required columns present."
                  )

          if failed:
              raise SystemExit(1)

          print()
          print(
              "[PASS] Required Feature V001 columns verified."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Feature column verification failed."

              exit 1
          }

          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 17. VERIFY FEATURE STATUS FILE
      # ============================================================

      - name: Verify feature build status
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FEATURE BUILD STATUS CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $statusFile = "data\feature_build_status.csv"

          if (-not (Test-Path $statusFile)) {

              Write-Host "[FAIL] Feature build status file not found."
              Write-Host ""
              Write-Host "Expected:"
              Write-Host $statusFile

              exit 1
          }

          $item = Get-Item $statusFile

          Write-Host "[FOUND] $statusFile"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host ""

          if ($item.Length -le 0) {

              Write-Host "[FAIL] Feature status file is empty."
              exit 1
          }

          Write-Host "[PASS] Feature build status file exists."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 18. FINAL GIT SAFETY CHECK
      # ============================================================

      - name: Verify generated data remains ignored
        run: |
          $project = $env:PROJECT_DIR
          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $trackedChanges = @(
              git status --porcelain
          )

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Could not inspect Git status."
              exit 1
          }

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Feature test created unexpected Git-visible changes."
              Write-Host ""

              git status --short

              Write-Host ""
              Write-Host "Generated runtime data must remain ignored."

              exit 1
          }

          Write-Host "[PASS] Git working tree remains clean."
          Write-Host "[PASS] Generated feature data is not tracked."
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 19. COMPLETED
      # ============================================================

      - name: Feature Builder test completed
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FEATURE BUILDER TEST COMPLETED"
          Write-Host "============================================================"
