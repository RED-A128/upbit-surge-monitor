name: Feature Full Validation Clean V004

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upbit-feature-full-validation
  cancel-in-progress: false

jobs:
  feature-validation:

    name: Full KRW Feature Validation Clean V004

    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ============================================================
      # 1. SHOW VALIDATION INFORMATION
      # ============================================================

      - name: Show feature validation information
        run: |
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "FEATURE FULL VALIDATION - CLEAN V004"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Project:"
          Write-Host "Upbit Surge Monitor"
          Write-Host ""
          Write-Host "Feature Builder:"
          Write-Host "Clean V002"
          Write-Host ""
          Write-Host "Validator:"
          Write-Host "Feature Full Validation Clean V004"
          Write-Host ""
          Write-Host "Scope:"
          Write-Host "ALL KRW OHLCV / FEATURE CSV FILES"
          Write-Host ""
          Write-Host "Timeframes:"
          Write-Host "H1 / H4 / D1"
          Write-Host ""
          Write-Host "Expected:"
          Write-Host "290 markets"
          Write-Host "870 validation jobs"
          Write-Host ""
          Write-Host "Research target:"
          Write-Host "256 technique - quantitative feature foundation"
          Write-Host ""
          Write-Host "Clean V004:"
          Write-Host "Rolling warm-up validation corrected"
          Write-Host "Short-history markets are handled safely"
          Write-Host "Calculable-but-empty features still FAIL"
          Write-Host ""
          Write-Host "Repository:"
          Write-Host "${{ github.repository }}"
          Write-Host ""
          Write-Host "Runner:"
          Write-Host "${{ runner.name }}"
          Write-Host ""
          Write-Host "Runner OS:"
          Write-Host "${{ runner.os }}"
          Write-Host ""
          Write-Host "Local project:"
          Write-Host "$env:PROJECT_DIR"
          Write-Host ""
          Write-Host "Safety:"
          Write-Host "Source OHLCV write     : DISABLED"
          Write-Host "Source OHLCV delete    : DISABLED"
          Write-Host "Feature delete         : DISABLED"
          Write-Host "Git reset --hard       : DISABLED"
          Write-Host "Git clean              : DISABLED"
          Write-Host "Future labels          : DISABLED"
          Write-Host "Prediction             : DISABLED"
          Write-Host "Trading                : DISABLED"
          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 2. VERIFY LOCAL PROJECT
      # ============================================================

      - name: Verify local project repository
        run: |
          $ErrorActionPreference = "Stop"

          $project = $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "LOCAL PROJECT CHECK"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[FAIL] Local project directory not found."
              Write-Host $project
              exit 1
          }

          if (-not (Test-Path "$project\.git")) {
              Write-Host "[FAIL] .git directory not found."
              Write-Host "$project\.git"
              exit 1
          }

          Set-Location $project

          $branch = git branch --show-current

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not determine Git branch."
              exit 1
          }

          Write-Host "Current branch: $branch"

          if ($branch -ne "main") {
              Write-Host "[FAIL] Local repository must be on main."
              exit 1
          }

          Write-Host "[PASS] Local repository found."
          Write-Host "[PASS] Current branch is main."
          Write-Host "============================================================"

      # ============================================================
      # 3. FETCH ORIGIN
      # ============================================================

      - name: Fetch origin safely
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "SAFE ORIGIN FETCH"
          Write-Host "============================================================"

          git fetch origin

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] git fetch origin failed."
              exit 1
          }

          $local = git rev-parse HEAD
          $remote = git rev-parse origin/main

          Write-Host "Local HEAD  : $local"
          Write-Host "Origin/main : $remote"

          Write-Host "[PASS] Origin fetched."
          Write-Host "[PASS] Local files have not been modified."
          Write-Host "============================================================"

      # ============================================================
      # 4. VERIFY DATA PROTECTION RULES
      # ============================================================

      - name: Verify origin data protection rules
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "DATA PROTECTION CHECK"
          Write-Host "============================================================"

          $remoteGitignore = git show origin/main:.gitignore

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not read origin/main:.gitignore"
              exit 1
          }

          $requiredRules = @(
              "data/ohlcv/",
              "data/features/",
              "data/latest_features.csv"
          )

          $failed = $false

          foreach ($rule in $requiredRules) {

              $found = $false

              foreach ($line in $remoteGitignore) {
                  if ($line.Trim() -eq $rule) {
                      $found = $true
                      break
                  }
              }

              if ($found) {
                  Write-Host "[FOUND] $rule"
              }
              else {
                  Write-Host "[MISSING] $rule"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host "[FAIL] Required data protection rules are missing."
              exit 1
          }

          Write-Host "[PASS] Runtime data protection rules confirmed."
          Write-Host "============================================================"

      # ============================================================
      # 5. PROTECT TRACKED LOCAL CHANGES
      # ============================================================

      - name: Protect tracked local source changes
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "TRACKED LOCAL SOURCE SAFETY CHECK"
          Write-Host "============================================================"

          $unstaged = @(git diff --name-only)
          $staged = @(git diff --cached --name-only)

          $trackedChanges = @(
              $unstaged
              $staged
          ) |
          Where-Object {
              -not [string]::IsNullOrWhiteSpace($_)
          } |
          Sort-Object -Unique

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Tracked local changes detected."

              foreach ($file in $trackedChanges) {
                  Write-Host "  $file"
              }

              Write-Host ""
              Write-Host "Automatic overwrite is disabled."
              Write-Host "No reset will be performed."
              Write-Host "No cleanup will be performed."

              exit 1
          }

          Write-Host "[PASS] No tracked local source changes detected."
          Write-Host "============================================================"

      # ============================================================
      # 6. VERIFY FAST-FORWARD
      # ============================================================

      - name: Verify fast forward synchronization
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FAST-FORWARD SAFETY CHECK"
          Write-Host "============================================================"

          $local = git rev-parse HEAD
          $remote = git rev-parse origin/main

          if ($local -eq $remote) {
              Write-Host "[PASS] Local main already matches origin/main."
              exit 0
          }

          git merge-base --is-ancestor HEAD origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Local main cannot be safely fast-forwarded."
              Write-Host "No reset or forced synchronization will be used."
              exit 1
          }

          Write-Host "[PASS] Fast-forward synchronization is safe."
          Write-Host "============================================================"

      # ============================================================
      # 7. SYNCHRONIZE LOCAL REPOSITORY
      # ============================================================

      - name: Synchronize local repository
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "LOCAL REPOSITORY SYNCHRONIZATION"
          Write-Host "============================================================"

          $localBefore = git rev-parse HEAD
          $remote = git rev-parse origin/main

          Write-Host "Local before : $localBefore"
          Write-Host "Origin/main  : $remote"

          if ($localBefore -ne $remote) {

              git merge --ff-only origin/main

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "[FAIL] Fast-forward synchronization failed."
                  Write-Host "No reset was attempted."
                  Write-Host "No forced checkout was attempted."
                  Write-Host "No OHLCV data was deleted."
                  exit 1
              }
          }

          $localAfter = git rev-parse HEAD

          if ($localAfter -ne $remote) {
              Write-Host "[FAIL] Local main does not match origin/main."
              exit 1
          }

          Write-Host "Local after  : $localAfter"
          Write-Host "[PASS] Local repository synchronized safely."
          Write-Host "============================================================"

      # ============================================================
      # 8. VERIFY PYTHON
      # ============================================================

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "PYTHON CHECK"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Windows Python launcher 'py' unavailable."
              exit 1
          }

          py -c "import pandas; import numpy; print('pandas:', pandas.__version__); print('numpy :', numpy.__version__)"

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] pandas and/or numpy unavailable."
              exit 1
          }

          Write-Host "[PASS] Python dependencies available."
          Write-Host "============================================================"

      # ============================================================
      # 9. VERIFY DATA DIRECTORIES
      # ============================================================

      - name: Verify full feature dataset directories
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FULL DATASET DIRECTORY CHECK"
          Write-Host "============================================================"

          $requiredDirectories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1",
              "data\features\h1",
              "data\features\h4",
              "data\features\d1"
          )

          $failed = $false

          foreach ($directory in $requiredDirectories) {

              if (Test-Path $directory -PathType Container) {

                  $count = @(
                      Get-ChildItem `
                          -Path $directory `
                          -Filter "KRW-*.csv" `
                          -File
                  ).Count

                  Write-Host "[FOUND] $directory"
                  Write-Host "        KRW CSV files: $count"
              }
              else {
                  Write-Host "[MISSING] $directory"
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host "[FAIL] Required directories missing."
              exit 1
          }

          Write-Host "[PASS] Required directories exist."
          Write-Host "============================================================"

      # ============================================================
      # 10. VERIFY FULL MARKET FILE SET
      # ============================================================

      - name: Verify full market file set
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FULL MARKET FILE SET CHECK"
          Write-Host "============================================================"

          @'
          from pathlib import Path

          TIMEFRAMES = ("h1", "h4", "d1")
          EXPECTED_MARKETS = 290
          EXPECTED_JOBS = 870

          ohlcv_root = Path("data/ohlcv")
          feature_root = Path("data/features")

          failed = False

          ohlcv_sets = {}
          feature_sets = {}

          for tf in TIMEFRAMES:
              ohlcv_files = sorted(
                  (ohlcv_root / tf).glob("KRW-*.csv")
              )

              feature_files = sorted(
                  (feature_root / tf).glob("KRW-*.csv")
              )

              ohlcv_sets[tf] = {
                  path.stem for path in ohlcv_files
              }

              feature_sets[tf] = {
                  path.stem for path in feature_files
              }

              print(
                  f"[{tf.upper()}] "
                  f"OHLCV={len(ohlcv_files):,} "
                  f"FEATURE={len(feature_files):,}"
              )

          canonical = set(ohlcv_sets["h1"])

          print()
          print("Canonical markets:", len(canonical))

          if len(canonical) != EXPECTED_MARKETS:
              print(
                  "[FAIL] Canonical market count mismatch."
              )
              failed = True

          for tf in TIMEFRAMES:

              if ohlcv_sets[tf] != canonical:
                  print(
                      f"[FAIL] {tf.upper()} "
                      "OHLCV market set mismatch."
                  )
                  failed = True
              else:
                  print(
                      f"[PASS] {tf.upper()} "
                      "OHLCV market set."
                  )

              if feature_sets[tf] != canonical:
                  print(
                      f"[FAIL] {tf.upper()} "
                      "Feature market set mismatch."
                  )

                  missing = sorted(
                      canonical - feature_sets[tf]
                  )

                  extra = sorted(
                      feature_sets[tf] - canonical
                  )

                  for market in missing[:20]:
                      print("  Missing:", market)

                  for market in extra[:20]:
                      print("  Extra:", market)

                  failed = True
              else:
                  print(
                      f"[PASS] {tf.upper()} "
                      "Feature market set."
                  )

          total_ohlcv = sum(
              len(ohlcv_sets[tf])
              for tf in TIMEFRAMES
          )

          total_features = sum(
              len(feature_sets[tf])
              for tf in TIMEFRAMES
          )

          print()
          print("Total OHLCV   :", total_ohlcv)
          print("Total Feature :", total_features)

          if total_ohlcv != EXPECTED_JOBS:
              failed = True

          if total_features != EXPECTED_JOBS:
              failed = True

          if failed:
              print("[RESULT] FULL MARKET FILE SET FAILED")
              raise SystemExit(1)

          print("[PASS] 290 canonical KRW markets confirmed.")
          print("[PASS] 870 OHLCV files confirmed.")
          print("[PASS] 870 Feature files confirmed.")
          print("[RESULT] FULL MARKET FILE SET PASSED")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Full market file set verification failed."
              exit 1
          }

      # ============================================================
      # 11. RECORD OHLCV HASHES
      # ============================================================

      - name: Record all OHLCV hashes before validation
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "ALL SOURCE OHLCV HASHES - BEFORE"
          Write-Host "============================================================"

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "feature_v004_ohlcv_hashes.txt"

          if (Test-Path $hashFile) {
              Remove-Item $hashFile -Force
          }

          $timeframes = @("h1", "h4", "d1")
          $count = 0

          foreach ($tf in $timeframes) {

              $files = @(
                  Get-ChildItem `
                      -Path "data\ohlcv\$tf" `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              foreach ($file in $files) {

                  $relative = "data\ohlcv\$tf\$($file.Name)"

                  $hash = (
                      Get-FileHash `
                          -Algorithm SHA256 `
                          -Path $file.FullName
                  ).Hash

                  "$relative|$hash" |
                      Out-File `
                          -FilePath $hashFile `
                          -Append `
                          -Encoding utf8

                  $count++

                  if (($count % 100) -eq 0) {
                      Write-Host "Hashed: $count / 870"
                  }
              }
          }

          if ($count -ne 870) {
              Write-Host "[FAIL] Expected 870 OHLCV hashes."
              Write-Host "Actual: $count"
              exit 1
          }

          Write-Host "[PASS] 870 OHLCV SHA256 hashes recorded."

      # ============================================================
      # 12. FULL FEATURE VALIDATION
      #
      # Clean V004 correction:
      #
      # A feature is only required to contain usable numeric values
      # once enough source rows exist for that feature to be
      # mathematically calculable.
      #
      # Short-history rolling warm-up NaN is valid.
      #
      # Enough history + entirely empty column = FAIL.
      # Infinite numeric value = FAIL.
      # Missing required column = FAIL.
      # ============================================================

      - name: Validate all Clean V002 feature files
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FULL CLEAN V002 FEATURE VALIDATION"
          Write-Host "VALIDATOR CLEAN V004"
          Write-Host "============================================================"

          @'
          from __future__ import annotations

          import time
          from pathlib import Path

          import numpy as np
          import pandas as pd


          PROJECT = "Upbit Surge Monitor"
          VERSION = "Feature Full Validation Clean V004"

          TIMEFRAMES = ("h1", "h4", "d1")

          EXPECTED_MARKETS = 290
          EXPECTED_JOBS = 870
          EXPECTED_TOTAL_ROWS = 9_905_993

          OHLCV_ROOT = Path("data/ohlcv")
          FEATURE_ROOT = Path("data/features")


          BASE_REQUIRED = [
              "market",
              "candle_date_time_utc",
              "open",
              "high",
              "low",
              "close",
              "volume",
              "trade_value",

              "return_1",
              "return_3",
              "return_6",
              "return_12",
              "return_24",

              "sma_5",
              "sma_10",
              "sma_20",
              "sma_60",
              "sma_120",

              "ema_5",
              "ema_10",
              "ema_20",
              "ema_60",

              "rsi_14",

              "macd",
              "macd_signal",
              "macd_hist",

              "atr_14",
              "atr_pct_14",

              "bb_mid",
              "bb_upper",
              "bb_lower",
              "bb_width",
              "bb_position",

              "volume_sma_5",
              "volume_sma_20",
              "volume_ratio_5",
              "volume_ratio_20",
          ]


          FEATURE_256_REQUIRED = [
              "sma_112",
              "sma_224",

              "close_to_sma_5",
              "close_to_sma_112",
              "close_to_sma_224",

              "sma_5_to_20",
              "sma_5_to_60",
              "sma_20_to_60",
              "sma_5_to_112",
              "sma_5_to_224",
              "sma_112_to_224",

              "sma_5_slope_1",
              "sma_5_slope_3",

              "sma_20_slope_1",
              "sma_20_slope_3",

              "sma_60_slope_1",
              "sma_60_slope_3",

              "sma_112_slope_1",
              "sma_112_slope_3",

              "sma_224_slope_1",
              "sma_224_slope_3",
          ]


          # --------------------------------------------------------
          # Minimum source-row count required before each V002
          # feature must contain at least one usable numeric value.
          #
          # Rolling mean N:
          #   first usable value at row N
          #
          # slope_1:
          #   first usable value one row after SMA becomes usable
          #
          # slope_3:
          #   first usable value three rows after SMA becomes usable
          # --------------------------------------------------------

          FEATURE_MIN_ROWS = {
              "sma_112": 112,
              "sma_224": 224,

              "close_to_sma_5": 5,
              "close_to_sma_112": 112,
              "close_to_sma_224": 224,

              "sma_5_to_20": 20,
              "sma_5_to_60": 60,
              "sma_20_to_60": 60,
              "sma_5_to_112": 112,
              "sma_5_to_224": 224,
              "sma_112_to_224": 224,

              "sma_5_slope_1": 6,
              "sma_5_slope_3": 8,

              "sma_20_slope_1": 21,
              "sma_20_slope_3": 23,

              "sma_60_slope_1": 61,
              "sma_60_slope_3": 63,

              "sma_112_slope_1": 113,
              "sma_112_slope_3": 115,

              "sma_224_slope_1": 225,
              "sma_224_slope_3": 227,
          }


          if len(FEATURE_256_REQUIRED) != 21:
              print(
                  "[FAIL] Internal validator definition error."
              )
              print(
                  "Expected Clean V002 256 feature count: 21"
              )
              print(
                  "Actual:",
                  len(FEATURE_256_REQUIRED),
              )
              raise SystemExit(1)


          if set(FEATURE_MIN_ROWS) != set(FEATURE_256_REQUIRED):

              missing = sorted(
                  set(FEATURE_256_REQUIRED)
                  - set(FEATURE_MIN_ROWS)
              )

              extra = sorted(
                  set(FEATURE_MIN_ROWS)
                  - set(FEATURE_256_REQUIRED)
              )

              print(
                  "[FAIL] FEATURE_MIN_ROWS definition mismatch."
              )

              if missing:
                  print(
                      "Missing minimum-row definitions:",
                      missing,
                  )

              if extra:
                  print(
                      "Unexpected minimum-row definitions:",
                      extra,
                  )

              raise SystemExit(1)


          REQUIRED_COLUMNS = (
              BASE_REQUIRED
              + FEATURE_256_REQUIRED
          )


          started = time.perf_counter()

          failed_jobs = 0
          passed_jobs = 0

          source_rows_total = 0
          feature_rows_total = 0

          duplicate_timestamp_total = 0
          invalid_timestamp_total = 0
          timestamp_mismatch_total = 0
          market_mismatch_total = 0
          infinite_value_total = 0

          empty_feature_column_total = 0
          warmup_empty_allowed_total = 0

          validation_errors = []


          markets = sorted(
              path.stem
              for path in (
                  OHLCV_ROOT / "h1"
              ).glob("KRW-*.csv")
          )


          print("=" * 80)
          print(PROJECT)
          print(VERSION)
          print("=" * 80)
          print()
          print(
              "Markets discovered :",
              len(markets),
          )
          print(
              "Timeframes         :",
              " / ".join(TIMEFRAMES),
          )
          print(
              "Expected jobs      :",
              EXPECTED_JOBS,
          )
          print()
          print(
              "Warm-up policy     : "
              "SOURCE-ROW-AWARE"
          )
          print(
              "Short history      : "
              "EMPTY ROLLING FEATURE ALLOWED"
          )
          print(
              "Enough history     : "
              "EMPTY FEATURE FAILS"
          )
          print()


          if len(markets) != EXPECTED_MARKETS:

              print(
                  "[FAIL] Expected "
                  f"{EXPECTED_MARKETS} markets, "
                  f"found {len(markets)}."
              )

              raise SystemExit(1)


          def add_error(
              timeframe: str,
              market: str,
              message: str,
          ) -> None:

              validation_errors.append(
                  f"[{timeframe.upper()}] "
                  f"{market}: {message}"
              )


          for market_index, market in enumerate(
              markets,
              start=1,
          ):

              print(
                  f"[{market_index:03d}/"
                  f"{len(markets):03d}] "
                  f"{market}"
              )

              for timeframe in TIMEFRAMES:

                  job_started = time.perf_counter()

                  source_path = (
                      OHLCV_ROOT
                      / timeframe
                      / f"{market}.csv"
                  )

                  feature_path = (
                      FEATURE_ROOT
                      / timeframe
                      / f"{market}.csv"
                  )

                  job_failed = False


                  if not source_path.exists():

                      add_error(
                          timeframe,
                          market,
                          "OHLCV source file missing.",
                      )

                      failed_jobs += 1

                      print(
                          f"  [{timeframe.upper()}] "
                          "[FAIL] OHLCV missing"
                      )

                      continue


                  if not feature_path.exists():

                      add_error(
                          timeframe,
                          market,
                          "Feature file missing.",
                      )

                      failed_jobs += 1

                      print(
                          f"  [{timeframe.upper()}] "
                          "[FAIL] Feature missing"
                      )

                      continue


                  try:

                      source = pd.read_csv(
                          source_path,
                          encoding="utf-8-sig",
                          low_memory=False,
                      )

                  except Exception as exc:

                      add_error(
                          timeframe,
                          market,
                          "Could not read OHLCV: "
                          f"{exc}",
                      )

                      failed_jobs += 1

                      print(
                          f"  [{timeframe.upper()}] "
                          "[FAIL] OHLCV read error"
                      )

                      continue


                  try:

                      feature = pd.read_csv(
                          feature_path,
                          encoding="utf-8-sig",
                          low_memory=False,
                      )

                  except Exception as exc:

                      add_error(
                          timeframe,
                          market,
                          "Could not read Feature: "
                          f"{exc}",
                      )

                      failed_jobs += 1

                      print(
                          f"  [{timeframe.upper()}] "
                          "[FAIL] Feature read error"
                      )

                      continue


                  source_rows = len(source)
                  feature_rows = len(feature)

                  source_rows_total += source_rows
                  feature_rows_total += feature_rows


                  # ------------------------------------------------
                  # ROW COUNT
                  # ------------------------------------------------

                  if source_rows != feature_rows:

                      add_error(
                          timeframe,
                          market,
                          "Row count mismatch: "
                          f"source={source_rows:,}, "
                          f"feature={feature_rows:,}",
                      )

                      job_failed = True


                  # ------------------------------------------------
                  # REQUIRED COLUMNS
                  # ------------------------------------------------

                  missing_columns = [
                      column
                      for column in REQUIRED_COLUMNS
                      if column not in feature.columns
                  ]

                  if missing_columns:

                      add_error(
                          timeframe,
                          market,
                          "Missing required columns: "
                          + ", ".join(missing_columns),
                      )

                      job_failed = True


                  # ------------------------------------------------
                  # TIMESTAMP VALIDATION
                  # ------------------------------------------------

                  timestamp_column = (
                      "candle_date_time_utc"
                  )


                  if timestamp_column not in source.columns:

                      add_error(
                          timeframe,
                          market,
                          "Source timestamp column missing.",
                      )

                      job_failed = True


                  if timestamp_column not in feature.columns:

                      add_error(
                          timeframe,
                          market,
                          "Feature timestamp column missing.",
                      )

                      job_failed = True


                  if (
                      timestamp_column in source.columns
                      and timestamp_column in feature.columns
                  ):

                      source_ts = pd.to_datetime(
                          source[timestamp_column],
                          errors="coerce",
                          utc=True,
                      )

                      feature_ts = pd.to_datetime(
                          feature[timestamp_column],
                          errors="coerce",
                          utc=True,
                      )


                      source_invalid = int(
                          source_ts.isna().sum()
                      )

                      feature_invalid = int(
                          feature_ts.isna().sum()
                      )

                      invalid_count = (
                          source_invalid
                          + feature_invalid
                      )

                      invalid_timestamp_total += (
                          invalid_count
                      )


                      if invalid_count > 0:

                          add_error(
                              timeframe,
                              market,
                              "Invalid timestamps: "
                              f"source={source_invalid:,}, "
                              f"feature={feature_invalid:,}",
                          )

                          job_failed = True


                      duplicate_count = int(
                          feature_ts.duplicated().sum()
                      )

                      duplicate_timestamp_total += (
                          duplicate_count
                      )


                      if duplicate_count > 0:

                          add_error(
                              timeframe,
                              market,
                              "Duplicate feature timestamps: "
                              f"{duplicate_count:,}",
                          )

                          job_failed = True


                      if (
                          not feature_ts
                          .is_monotonic_increasing
                      ):

                          add_error(
                              timeframe,
                              market,
                              "Feature timestamps "
                              "not ascending.",
                          )

                          job_failed = True


                      if (
                          not source_ts
                          .is_monotonic_increasing
                      ):

                          add_error(
                              timeframe,
                              market,
                              "Source timestamps "
                              "not ascending.",
                          )

                          job_failed = True


                      if len(source_ts) == len(feature_ts):

                          equal_mask = (
                              source_ts
                              .reset_index(drop=True)
                              .eq(
                                  feature_ts
                                  .reset_index(drop=True)
                              )
                          )

                          mismatch_count = int(
                              (~equal_mask).sum()
                          )

                      else:

                          common = min(
                              len(source_ts),
                              len(feature_ts),
                          )

                          if common > 0:

                              equal_mask = (
                                  source_ts
                                  .iloc[:common]
                                  .reset_index(drop=True)
                                  .eq(
                                      feature_ts
                                      .iloc[:common]
                                      .reset_index(drop=True)
                                  )
                              )

                              mismatch_count = int(
                                  (~equal_mask).sum()
                              )

                          else:

                              mismatch_count = 0

                          mismatch_count += abs(
                              len(source_ts)
                              - len(feature_ts)
                          )


                      timestamp_mismatch_total += (
                          mismatch_count
                      )


                      if mismatch_count > 0:

                          add_error(
                              timeframe,
                              market,
                              "Source/Feature timestamp "
                              "mismatch count: "
                              f"{mismatch_count:,}",
                          )

                          job_failed = True


                  # ------------------------------------------------
                  # MARKET COLUMN INTEGRITY
                  # ------------------------------------------------

                  if "market" not in feature.columns:

                      add_error(
                          timeframe,
                          market,
                          "Feature market column missing.",
                      )

                      job_failed = True

                  else:

                      market_series = (
                          feature["market"]
                          .astype("string")
                      )

                      missing_market_count = int(
                          market_series.isna().sum()
                      )

                      wrong_market_count = int(
                          (
                              market_series.dropna()
                              != market
                          ).sum()
                      )

                      total_market_errors = (
                          missing_market_count
                          + wrong_market_count
                      )

                      market_mismatch_total += (
                          total_market_errors
                      )


                      if total_market_errors > 0:

                          add_error(
                              timeframe,
                              market,
                              "Feature market mismatch: "
                              f"missing={missing_market_count:,}, "
                              f"wrong={wrong_market_count:,}",
                          )

                          job_failed = True


                  # ------------------------------------------------
                  # CLEAN V002 256 FEATURE VALIDATION
                  #
                  # IMPORTANT:
                  #
                  # 1. Column must always exist.
                  #
                  # 2. If source history is shorter than the minimum
                  #    mathematical requirement, an entirely NaN
                  #    feature column is legitimate rolling warm-up.
                  #
                  # 3. If source history is long enough, the feature
                  #    must contain at least one usable numeric value.
                  #
                  # 4. Any +/- infinity is invalid.
                  # ------------------------------------------------

                  for column in FEATURE_256_REQUIRED:

                      if column not in feature.columns:
                          continue


                      values = pd.to_numeric(
                          feature[column],
                          errors="coerce",
                      )


                      valid_values = values.dropna()

                      valid_count = int(
                          valid_values.shape[0]
                      )


                      min_rows = FEATURE_MIN_ROWS[column]


                      if valid_count == 0:

                          if source_rows < min_rows:

                              warmup_empty_allowed_total += 1

                              continue


                          empty_feature_column_total += 1

                          add_error(
                              timeframe,
                              market,
                              "Feature column has no "
                              "usable numeric values "
                              "despite sufficient history: "
                              f"{column} "
                              f"(rows={source_rows:,}, "
                              f"required={min_rows:,})",
                          )

                          job_failed = True

                          continue


                      array = valid_values.to_numpy(
                          dtype=np.float64,
                          copy=False,
                      )


                      infinite_count = int(
                          np.isinf(array).sum()
                      )

                      infinite_value_total += (
                          infinite_count
                      )


                      if infinite_count > 0:

                          add_error(
                              timeframe,
                              market,
                              "Infinite values in "
                              f"{column}: "
                              f"{infinite_count:,}",
                          )

                          job_failed = True


                  elapsed = (
                      time.perf_counter()
                      - job_started
                  )


                  if job_failed:

                      failed_jobs += 1

                      print(
                          f"  [{timeframe.upper()}] "
                          f"FAIL "
                          f"source={source_rows:,} "
                          f"feature={feature_rows:,} "
                          f"{elapsed:.2f}s"
                      )

                  else:

                      passed_jobs += 1

                      print(
                          f"  [{timeframe.upper()}] "
                          f"PASS "
                          f"rows={feature_rows:,} "
                          f"{elapsed:.2f}s"
                      )


          total_jobs = (
              passed_jobs
              + failed_jobs
          )

          elapsed_total = (
              time.perf_counter()
              - started
          )


          print()
          print("=" * 80)
          print("FEATURE FULL VALIDATION SUMMARY")
          print("=" * 80)
          print(
              f"Project                 : {PROJECT}"
          )
          print(
              f"Version                 : {VERSION}"
          )
          print(
