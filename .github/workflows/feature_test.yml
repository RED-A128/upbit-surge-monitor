      # ============================================================
      # 13. VERIFY FEATURE BUILD STATUS FILE
      # ============================================================

      - name: Verify full feature build status
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FEATURE BUILD STATUS CHECK"
          Write-Host "============================================================"

          $statusFile = "data\feature_build_status.csv"

          if (-not (Test-Path $statusFile)) {
              Write-Host "[FAIL] Feature build status file not found."
              Write-Host "Expected: $statusFile"
              exit 1
          }

          $item = Get-Item $statusFile

          Write-Host "[FOUND] $statusFile"
          Write-Host "Size: $($item.Length) bytes"

          if ($item.Length -le 0) {
              Write-Host "[FAIL] Feature status file is empty."
              exit 1
          }

          @'
          import pandas as pd
          from pathlib import Path

          path = Path("data/feature_build_status.csv")

          try:
              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
                  low_memory=False,
              )
          except Exception as exc:
              print(
                  "[FAIL] Could not read "
                  "feature_build_status.csv:"
              )
              print(exc)
              raise SystemExit(1)

          print("Status rows   :", f"{len(df):,}")
          print("Status columns:", f"{len(df.columns):,}")

          if len(df) == 0:
              print(
                  "[FAIL] Feature status CSV "
                  "contains no rows."
              )
              raise SystemExit(1)

          print(
              "[PASS] Feature build status CSV is readable."
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Feature build status verification failed."
              exit 1
          }

          Write-Host "[PASS] Feature build status file verified."
          Write-Host "============================================================"

      # ============================================================
      # 14. VERIFY OHLCV HASHES AFTER VALIDATION
      # ============================================================

      - name: Verify all OHLCV files remained unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "ALL SOURCE OHLCV IMMUTABILITY CHECK"
          Write-Host "============================================================"

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "feature_v004_ohlcv_hashes.txt"

          if (-not (Test-Path $hashFile)) {
              Write-Host "[FAIL] Before-validation hash snapshot not found."
              exit 1
          }

          $lines = @(
              Get-Content $hashFile |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($lines.Count -ne 870) {
              Write-Host "[FAIL] Expected 870 stored source hashes."
              Write-Host "Actual: $($lines.Count)"
              exit 1
          }

          $failed = $false
          $checked = 0

          foreach ($line in $lines) {

              $parts = $line.Split("|", 2)

              if ($parts.Count -ne 2) {
                  Write-Host "[FAIL] Invalid hash snapshot line:"
                  Write-Host $line
                  $failed = $true
                  continue
              }

              $file = $parts[0]
              $beforeHash = $parts[1]

              if (-not (Test-Path $file)) {
                  Write-Host "[FAIL] Source file disappeared:"
                  Write-Host $file
                  $failed = $true
                  continue
              }

              $afterHash = (
                  Get-FileHash `
                      -Algorithm SHA256 `
                      -Path $file
              ).Hash

              $checked++

              if ($beforeHash -ne $afterHash) {

                  Write-Host "[FAIL] SOURCE FILE CHANGED"
                  Write-Host "File   : $file"
                  Write-Host "Before : $beforeHash"
                  Write-Host "After  : $afterHash"

                  $failed = $true
              }

              if (($checked % 100) -eq 0) {
                  Write-Host "Verified: $checked / 870"
              }
          }

          Write-Host "Files checked: $checked"

          if ($checked -ne 870) {
              Write-Host "[FAIL] Source hash verification count mismatch."
              exit 1
          }

          if ($failed) {
              Write-Host "[FAIL] One or more OHLCV source files changed."
              exit 1
          }

          Write-Host "[PASS] 870 / 870 OHLCV files remained unchanged."
          Write-Host "============================================================"

      # ============================================================
      # 15. FINAL GIT SAFETY CHECK
      # ============================================================

      - name: Verify generated data remains ignored
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"

          $trackedChanges = @(
              git status --porcelain
          )

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Could not inspect Git status."
              exit 1
          }

          if ($trackedChanges.Count -gt 0) {

              Write-Host "[FAIL] Validation created unexpected Git-visible changes."

              git status --short

              Write-Host ""
              Write-Host "Generated runtime data must remain ignored."

              exit 1
          }

          Write-Host "[PASS] Git working tree remains clean."
          Write-Host "[PASS] Runtime OHLCV/Feature data remains ignored."
          Write-Host "============================================================"

