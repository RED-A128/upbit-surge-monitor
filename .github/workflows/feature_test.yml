          )
          print()

          print("Clean V002:")
          print(
              "  SMA                    : "
              "5 / 10 / 20 / 60 / 112 / 120 / 224"
          )
          print(
              "  Price vs SMA           : "
              "5 / 20 / 60 / 112 / 120 / 224"
          )
          print(
              "  MA distance            : "
              "6 pairs"
          )
          print(
              "  MA slope               : "
              "5 / 20 / 60 / 112 / 224 "
              "(1, 3 candle)"
          )
          print(
              "  V002 256 features      : "
              f"{len(FEATURE_256_REQUIRED)}"
          )
          print()

          print("Safety:")
          print(
              "  Feature write          : DISABLED"
          )
          print(
              "  OHLCV write            : DISABLED"
          )
          print(
              "  Future labels          : DISABLED"
          )
          print(
              "  Prediction             : DISABLED"
          )
          print(
              "  Trading                : DISABLED"
          )
          print("=" * 80)


          expected_total_rows = 9_905_993


          if total_jobs != EXPECTED_JOBS:

              print(
                  "[FAIL] Validation job count mismatch."
              )

              print(
                  f"Expected: {EXPECTED_JOBS:,}"
              )

              print(
                  f"Actual  : {total_jobs:,}"
              )

              raise SystemExit(1)


          if source_rows_total != feature_rows_total:

              print(
                  "[FAIL] Total source/feature "
