              f"{timestamp_mismatch_total:,}"
          )
          print(
              f"Market mismatches       : "
              f"{market_mismatch_total:,}"
          )
          print(
              f"Infinite values         : "
              f"{infinite_value_total:,}"
          )
          print(
              f"Invalid empty V002 cols : "
              f"{empty_feature_column_total:,}"
          )
          print(
              f"Warm-up empties allowed : "
              f"{warmup_empty_allowed_total:,}"
          )
          print(
              f"Validation errors       : "
              f"{len(validation_errors):,}"
          )
          print(
              f"Elapsed seconds         : "
              f"{elapsed_total:.2f}"
          )
          print()

          print("Clean V002:")
          print(
              "  SMA                    : "
              "5 / 10 / 20 / 60 / 112 / 120 / 224"
          )
          print(
              "  Price vs SMA           : "
              "5 / 20 / 60 / 112 / 120 / 224"
          )
          print(
              "  MA distance            : "
              "6 pairs"
          )
          print(
              "  MA slope               : "
              "5 / 20 / 60 / 112 / 224 "
              "(1, 3 candle)"
          )
          print(
              "  V002 256 features      : "
              f"{len(FEATURE_256_REQUIRED)}"
          )
          print()

          print("Clean V004 warm-up policy:")
          print(
              "  Insufficient history   : "
              "empty rolling feature allowed"
          )
          print(
              "  Sufficient history     : "
              "usable numeric value required"
          )
          print(
              "  Infinite values        : FAIL"
          )
          print()

          print("Safety:")
          print(
              "  Feature write          : DISABLED"
          )
          print(
              "  OHLCV write            : DISABLED"
          )
          print(
              "  Future labels          : DISABLED"
          )
          print(
              "  Prediction             : DISABLED"
          )
          print(
              "  Trading                : DISABLED"
          )
          print("=" * 80)


          if total_jobs != EXPECTED_JOBS:

              print(
                  "[FAIL] Validation job count mismatch."
              )

              print(
                  f"Expected: {EXPECTED_JOBS:,}"
              )

              print(
                  f"Actual  : {total_jobs:,}"
              )

              raise SystemExit(1)


          if source_rows_total != feature_rows_total:

              print(
                  "[FAIL] Total source/feature "
                  "row count mismatch."
              )

              raise SystemExit(1)


          if source_rows_total != EXPECTED_TOTAL_ROWS:

              print(
                  "[FAIL] Total source row count "
                  "does not match validated "
                  "OHLCV checkpoint."
              )

              print(
                  f"Expected: {EXPECTED_TOTAL_ROWS:,}"
              )

              print(
                  f"Actual  : {source_rows_total:,}"
              )

              raise SystemExit(1)


          if failed_jobs > 0:

              print()
              print("=" * 80)
              print("VALIDATION ERROR DETAILS")
              print("=" * 80)

              for error in validation_errors[:200]:
                  print(error)

              if len(validation_errors) > 200:

                  print()
                  print(
