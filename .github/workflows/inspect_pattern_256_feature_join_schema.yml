name: inspect_pattern_256_feature_join_schema.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-pattern-256-feature-join-schema
  cancel-in-progress: false

jobs:
  feature-join-schema:
    name: feature-join-schema

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Validate script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "inspect_pattern_256_feature_join_schema.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

      - name: Run schema inspection
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "inspect_pattern_256_feature_join_schema.py"

          py $script `
            --root "$env:DATA_ROOT" `
            --max-files 2000 `
            --sample-files 3

          if ($LASTEXITCODE -ne 0) {
            throw "Schema inspection failed"
          }

      - name: Verify output and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_feature_join_schema"

          $resultPath = Join-Path `
            $outputDir `
            "feature_join_schema_result.json"

          $manifestPath = Join-Path `
            $outputDir `
            "feature_join_schema_manifest.json"

          foreach ($path in @(
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Unexpected result version"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Schema inspection not PASS"
          }

          if ($result.join_completed -ne $false) {
            throw "Unexpected join completion"
          }

          if ($result.train_experiment_completed -ne $false) {
            throw "Unexpected experiment completion"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected trading approval"
          }

          $expected = `
            $manifest.output_sha256.'feature_join_schema_result.json'

          $actual = (
            Get-FileHash `
              -LiteralPath $resultPath `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Output SHA256 mismatch"
          }

          $inputs = @{
            "train_only_events.csv" = "data\reports\pattern_256_train_only\train_only_events.csv"
            "train_only_result.json" = "data\reports\pattern_256_train_only\train_only_result.json"
            "train_only_manifest.json" = "data\reports\pattern_256_train_only\train_only_manifest.json"
            "feature_integrity_summary.json" = "data\reports\pattern_256_feature_integrity\feature_integrity_summary.json"
            "feature_integrity_markets.csv" = "data\reports\pattern_256_feature_integrity\feature_integrity_markets.csv"
          }

          foreach ($name in $inputs.Keys) {
            $path = Join-Path `
              $env:DATA_ROOT `
              $inputs[$name]

            $actualInput = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expectedInput = `
              $manifest.input_sha256.$name

            if ($actualInput -ne $expectedInput) {
              throw "Input SHA256 mismatch: $name"
            }
          }

          Write-Host "PASS: Schema report"
          Write-Host "PASS: Input SHA256"
          Write-Host "PASS: Output SHA256"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_feature_join_schema\feature_join_schema_result.json"

          $result = Get-Content `
            -LiteralPath $path `
            -Raw | ConvertFrom-Json

          @"
          # Pattern 256 Feature Join Schema Gate

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Version | $($result.version) |
          | TRAIN rows | $($result.train_rows) |
          | Feature files discovered | $($result.feature_files_discovered) |
          | Feature schema variants | $($result.feature_schema_variants) |
          | Join readiness proven | $($result.join_readiness_proven) |
          | Join completed | $($result.join_completed) |
          | TRAIN experiment completed | $($result.train_experiment_completed) |
          | Research decision | $($result.research_decision) |
          | Live trading approved | $($result.approved_for_live_trading) |
          | SHA256 | Verified |

          ## Next stage

          Verify the discovered feature columns, timestamps,
          and row-level gap eligibility before implementing
          the feature-event join.

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload schema reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-feature-join-schema-v001
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_feature_join_schema\feature_join_schema_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_feature_join_schema\feature_join_schema_manifest.json
          if-no-files-found: warn
          retention-days: 30
