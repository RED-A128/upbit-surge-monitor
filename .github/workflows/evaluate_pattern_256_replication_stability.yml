
name: evaluate_pattern_256_replication_stability.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-replication-stability
  cancel-in-progress: false

jobs:
  replication-stability:
    name: replication-stability

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SCRIPT_NAME: evaluate_pattern_256_replication_stability.py
      OUTPUT_RELATIVE: data/reports/pattern_256_replication_stability
      EXPECTED_VERSION: Clean V003-10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and inputs
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python script not found: $script"
          }

          $inputDir = Join-Path `
            $env:PROJECT_ROOT `
            "data/reports/pattern_256_cross_year_replication"

          $files = @(
            "cross_year_markets.csv",
            "cross_year_summary.csv",
            "cross_year_result.json",
            "cross_year_manifest.json"
          )

          foreach ($file in $files) {
            $path = Join-Path $inputDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing input: $path"
            }
          }

          Write-Host "[PASS] Script and input files found"

      - name: Run replication stability
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Replication stability evaluation failed"
          }

      - name: Verify result and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          output = root / os.environ["OUTPUT_RELATIVE"]
          version = os.environ["EXPECTED_VERSION"]

          def sha256(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(4 * 1024 * 1024),
                      b"",
                  ):
                      digest.update(chunk)

              return digest.hexdigest()

          result = json.loads(
              (output / "replication_stability_result.json")
              .read_text(encoding="utf-8")
          )

          manifest = json.loads(
              (output / "replication_stability_manifest.json")
              .read_text(encoding="utf-8")
          )

          if result.get("version") != version:
              raise SystemExit("Result version mismatch")

          if manifest.get("version") != version:
              raise SystemExit("Manifest version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Execution not PASS")

          if result.get("overall_decision") != "HOLD":
              raise SystemExit("Decision mismatch")

          if result.get("common_markets") != 209:
              raise SystemExit("Market count mismatch")

          if result.get("positive_both_years") != 26:
              raise SystemExit("Replication count mismatch")

          for flag in (
              "independent_oos_proven",
              "statistical_independence_proven",
              "causal_improvement_proven",
              "profitability_proven",
              "approved_for_live_trading",
          ):
              if result.get(flag) is not False:
                  raise SystemExit(
                      "Unsafe approval flag: " + flag
                  )

          expected_files = {
              "replication_stability_detail.csv",
              "replication_stability_transitions.csv",
              "replication_stability_markets.csv",
              "replication_stability_result.json",
          }

          hashes = manifest.get("output_sha256")

          if not isinstance(hashes, dict):
              raise SystemExit("Missing output SHA256")

          if set(hashes) != expected_files:
              raise SystemExit("Output file set mismatch")

          for filename in sorted(expected_files):
              path = output / filename

              if not path.is_file():
                  raise SystemExit(
                      "Missing output: " + filename
                  )

              if sha256(path) != hashes[filename]:
                  raise SystemExit(
                      "SHA256 mismatch: " + filename
                  )

              print("[PASS] SHA256:", filename)

          def read_csv(name):
              with (output / name).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:
                  return list(csv.DictReader(handle))

          details = read_csv(
              "replication_stability_detail.csv"
          )

          transitions = read_csv(
              "replication_stability_transitions.csv"
          )

          markets = read_csv(
              "replication_stability_markets.csv"
          )

          if len(details) != 5:
              raise SystemExit("Detail count mismatch")

          if len(transitions) != 9:
              raise SystemExit("Transition count mismatch")

          if len(markets) != 209:
              raise SystemExit("Market row count mismatch")

          if {
              row["minimum_n_each_cohort_each_year"]
              for row in details
          } != {"0", "50", "100", "200", "500"}:
              raise SystemExit("Threshold set mismatch")

          if sum(
              int(row["markets"])
              for row in transitions
          ) != 209:
              raise SystemExit("Transition total mismatch")

          positive_both = sum(
              row["positive_both_years"].lower() == "true"
              for row in markets
          )

          if positive_both != 26:
              raise SystemExit("Positive-both mismatch")

          base = next(
              row for row in details
              if row["minimum_n_each_cohort_each_year"] == "0"
          )

          if int(base["eligible_markets"]) != 209:
              raise SystemExit("Base eligible count mismatch")

          if int(base["positive_both"]) != 26:
              raise SystemExit("Base positive count mismatch")

          for row in details:
              if row["decision"] != "HOLD":
                  raise SystemExit("Unexpected detail decision")

              valid = int(row["bootstrap_valid"])

              if valid not in (0, 2000):
                  raise SystemExit("Bootstrap count mismatch")

          print("[PASS] Clean V003-10")
          print("[PASS] Market-level replication")
          print("[PASS] Threshold sensitivity")
          print("[PASS] SHA256 integrity")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Output verification failed"
          }

      - name: Upload replication stability results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-replication-stability-v003-10
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_replication_stability/replication_stability_detail.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_replication_stability/replication_stability_transitions.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_replication_stability/replication_stability_markets.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_replication_stability/replication_stability_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_replication_stability/replication_stability_manifest.json
          if-no-files-found: error
          retention-days: 14
