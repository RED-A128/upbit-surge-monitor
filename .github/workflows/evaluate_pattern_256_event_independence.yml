name: evaluate_pattern_256_event_independence.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-event-independence
  cancel-in-progress: false

jobs:
  event-independence:
    name: event-independence
    runs-on: [self-hosted, Windows]
    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:
      SOURCE_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      SOURCE_RELATIVE: 'data/reports/pattern_256_accumulation_candidate_independent_backtest/backtest_trades.csv'
      OUTPUT_RELATIVE: 'data/reports/pattern_256_event_independence'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Validate script
        run: |
          $ErrorActionPreference = "Stop"

          $script = "audit_pattern_256_event_independence.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax check failed"
          }

      - name: Validate source
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:SOURCE_ROOT $env:SOURCE_RELATIVE

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Source CSV missing: $source"
          }

          $item = Get-Item -LiteralPath $source

          if ($item.Length -le 0) {
            throw "Source CSV empty"
          }

          Write-Host "Source: $source"
          Write-Host "Size: $($item.Length)"

      - name: Run independence audit
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:SOURCE_ROOT $env:SOURCE_RELATIVE

          py audit_pattern_256_event_independence.py `
            --root "." `
            --source "$source" `
            --output "$env:OUTPUT_RELATIVE"

          if ($LASTEXITCODE -ne 0) {
            throw "Event independence audit failed"
          }

      - name: Validate reports
        run: |
          $ErrorActionPreference = "Stop"

          $dir = $env:OUTPUT_RELATIVE

          $resultPath = Join-Path $dir "event_independence_result.json"
          $manifestPath = Join-Path $dir "event_independence_manifest.json"
          $comparisonPath = Join-Path $dir "event_independence_comparison.csv"

          foreach ($path in @(
            $resultPath,
            $manifestPath,
            $comparisonPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing report: $path"
            }
          }

          $result = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Unexpected result version"
          }

          if ($manifest.version -ne "Clean V001") {
            throw "Unexpected manifest version"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Execution status not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unsafe trading approval"
          }

          if ($result.invalid_rows -ne 0) {
            throw "Invalid source rows"
          }

          if ($result.conflicting_duplicates -ne 0) {
            throw "Conflicting duplicate rows"
          }

          $source = Join-Path $env:SOURCE_ROOT $env:SOURCE_RELATIVE

          $sourceHash = (
            Get-FileHash -LiteralPath $source -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($sourceHash -ne $manifest.source_sha256) {
            throw "Source SHA256 mismatch"
          }

          foreach ($name in @(
            "event_independence_result.json",
            "event_independence_comparison.csv"
          )) {
            $path = Join-Path $dir $name

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $manifest.output_sha256.$name

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $name"
            }
          }

          Write-Host "========================================"
          Write-Host "EVENT INDEPENDENCE AUDIT VERIFIED"
          Write-Host "========================================"
          Write-Host "Source rows: $($result.source_rows)"
          Write-Host "Eligible rows: $($result.eligible_rows)"
          Write-Host "Unique observations: $($result.unique_observations)"
          Write-Host "Identical duplicates: $($result.identical_duplicates)"
          Write-Host "Comparison groups: $($result.comparison_rows)"
          Write-Host "Research decision: HOLD"
          Write-Host "========================================"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path $env:OUTPUT_RELATIVE "event_independence_result.json"

          $result = Get-Content -LiteralPath $path -Raw |
            ConvertFrom-Json

          @"
          # Pattern 256 Event Independence

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Source rows | $($result.source_rows) |
          | Eligible rows | $($result.eligible_rows) |
          | Unique observations | $($result.unique_observations) |
          | Identical duplicates | $($result.identical_duplicates) |
          | Comparison groups | $($result.comparison_rows) |
          | Statistical independence proven | $($result.statistical_independence_proven) |
          | Research decision | $($result.research_decision) |
          | Live trading approved | $($result.approved_for_live_trading) |

          The full comparison is available in the uploaded artifact.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-event-independence-v001
          path: |
            data/reports/pattern_256_event_independence/event_independence_comparison.csv
            data/reports/pattern_256_event_independence/event_independence_result.json
            data/reports/pattern_256_event_independence/event_independence_manifest.json
          if-no-files-found: warn
          retention-days: 30
