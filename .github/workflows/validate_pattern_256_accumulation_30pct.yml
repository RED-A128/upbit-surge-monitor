
name: validate_pattern_256_accumulation_30pct.yml

run-name: validate_pattern_256_accumulation_30pct.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pattern-256-accumulation-30pct-production
  cancel-in-progress: false

jobs:
  validate-pattern-256-accumulation-30pct-production:
    name: validate_pattern_256_accumulation_30pct.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 720

    defaults:
      run:
        shell: powershell

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 02. ENVIRONMENT
      # ======================================================

      - name: 02 - Show production environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "30 PERCENT VALIDATION PRODUCTION"
          Write-Host "========================================"

          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Workspace : $env:GITHUB_WORKSPACE"
          Write-Host "Runner    : $env:RUNNER_NAME"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable"
          }

          py -c "import pandas; print('pandas:', pandas.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "pandas unavailable"
          }

          py -c "import numpy; print('numpy:', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "numpy unavailable"
          }

      # ======================================================
      # 03. VERIFY PROGRAM
      # ======================================================

      - name: 03 - Verify validation program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            "validate_pattern_256_accumulation_30pct.py"

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Validation program missing: $program"
          }

          Write-Host "[PASS] Program exists"

      # ======================================================
      # 04. VERIFY PROGRAM MARKERS
      # ======================================================

      - name: 04 - Verify Clean V001 markers
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            "validate_pattern_256_accumulation_30pct.py"

          $content = Get-Content `
            -LiteralPath $program `
            -Raw `
            -Encoding UTF8

          $required = @(
            "Clean V001",
            "TARGET_RETURN",
            "HORIZONS",
            "checkpoint_is_valid",
            "sha256_file",
            "validate_one_signal",
            "CENSORED",
            "NEXT_CANDLE_OPEN"
          )

          foreach ($marker in $required) {
            if (-not $content.Contains($marker)) {
              throw "Required program marker missing: $marker"
            }

            Write-Host "[PASS] $marker"
          }

      # ======================================================
      # 05. PYTHON SYNTAX
      # ======================================================

      - name: 05 - Validate Python syntax
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import ast
          from pathlib import Path

          path = Path(
              "validate_pattern_256_accumulation_30pct.py"
          )

          source = path.read_text(
              encoding="utf-8-sig"
          )

          ast.parse(
              source,
              filename=str(path),
          )

          print("[PASS] Python syntax")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

      # ======================================================
      # 06. STATIC SAFETY SCAN
      # ======================================================

      - name: 06 - Static safety scan
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import ast
          from pathlib import Path

          path = Path(
              "validate_pattern_256_accumulation_30pct.py"
          )

          tree = ast.parse(
              path.read_text(encoding="utf-8-sig")
          )

          forbidden_calls = {
              "subprocess.run",
              "subprocess.Popen",
              "os.system",
          }

          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue

              func = node.func

              if isinstance(func, ast.Attribute):
                  if isinstance(func.value, ast.Name):
                      full_name = (
                          func.value.id + "." + func.attr
                      )

                      if full_name in forbidden_calls:
                          raise RuntimeError(
                              "Forbidden execution call: " + full_name
                          )

              if isinstance(func, ast.Name):
                  if func.id in {"eval", "exec"}:
                      raise RuntimeError(
                          "Forbidden dynamic execution: " + func.id
                      )

          print("[PASS] Static safety scan")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Static safety scan failed"
          }

      # ======================================================
      # 07. VERIFY PRODUCTION ROOT
      # ======================================================

      - name: 07 - Verify production root
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path `
            $env:USERPROFILE `
            "Documents\upbit-surge-monitor"

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          "PRODUCTION_ROOT=$root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "[PASS] Production root: $root"

      # ======================================================
      # 08. VERIFY INPUTS
      # ======================================================

      - name: 08 - Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $candidate = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_crosscheck\crosscheck_candidates.csv"

          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "Crosscheck candidates missing: $candidate"
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            $directory = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv\$tf"

            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "OHLCV directory missing: $directory"
            }

            $sample = Get-ChildItem `
              -LiteralPath $directory `
              -Filter "*.csv" `
              -File |
              Select-Object -First 1

            if ($null -eq $sample) {
              throw "No OHLCV CSV: $directory"
            }

            Write-Host "[PASS] OHLCV $tf"
          }

          Write-Host "[PASS] Crosscheck candidates"

      # ======================================================
      # 09. PREPARE PRODUCTION WORKSPACE
      # ======================================================

      - name: 09 - Prepare production workspace
        run: |
          $ErrorActionPreference = "Stop"

          $programSource = Join-Path `
            $env:GITHUB_WORKSPACE `
            "validate_pattern_256_accumulation_30pct.py"

          $programTarget = Join-Path `
            $env:PRODUCTION_ROOT `
            "validate_pattern_256_accumulation_30pct.py"

          Copy-Item `
            -LiteralPath $programSource `
            -Destination $programTarget `
            -Force

          $sourceHash = (
            Get-FileHash `
              -LiteralPath $programSource `
              -Algorithm SHA256
          ).Hash

          $targetHash = (
            Get-FileHash `
              -LiteralPath $programTarget `
              -Algorithm SHA256
          ).Hash

          if ($sourceHash -ne $targetHash) {
            throw "Production program copy SHA256 mismatch"
          }

          Write-Host "[PASS] Production program synchronized"

      # ======================================================
      # 10. SNAPSHOT INPUT HASHES
      # ======================================================

      - name: 10 - Snapshot input SHA256 before production
        run: |
          $ErrorActionPreference = "Stop"

          $candidate = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_crosscheck\crosscheck_candidates.csv"

          $candidateHash = (
            Get-FileHash `
              -LiteralPath $candidate `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          "CANDIDATE_SHA256_BEFORE=$candidateHash" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "[PASS] Candidate SHA256 snapshot"
          Write-Host $candidateHash

      # ======================================================
      # 11. RUN PRODUCTION VALIDATION
      # ======================================================

      - name: 11 - Run full-market 30 percent validation
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location -LiteralPath $env:PRODUCTION_ROOT

          py validate_pattern_256_accumulation_30pct.py

          if ($LASTEXITCODE -ne 0) {
            throw "Production 30 percent validation failed"
          }

          Write-Host "[PASS] Full-market validation completed"

      # ======================================================
      # 12. VERIFY INPUT INTEGRITY
      # ======================================================

      - name: 12 - Verify crosscheck source SHA256 unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:PRODUCTION_ROOT) {
            Write-Host "[SKIP] Production root unavailable"
            exit 0
          }

          $candidate = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_crosscheck\crosscheck_candidates.csv"

          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "Crosscheck source missing after run"
          }

          $after = (
            Get-FileHash `
              -LiteralPath $candidate `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if (
            $env:CANDIDATE_SHA256_BEFORE -and
            $after -ne $env:CANDIDATE_SHA256_BEFORE
          ) {
            throw "Production crosscheck source SHA256 changed"
          }

          Write-Host "[PASS] Crosscheck source unchanged"

      # ======================================================
      # 13. VERIFY OUTPUT FILES
      # ======================================================

      - name: 13 - Verify required production outputs
        run: |
          $ErrorActionPreference = "Stop"

          $report = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_30pct"

          $required = @(
            "validation_detail.csv",
            "validation_summary.csv",
            "validation_result.json",
            "validation_manifest.json"
          )

          foreach ($filename in $required) {
            $path = Join-Path $report $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing production output: $path"
            }

            Write-Host "[PASS] $filename"
          }

      # ======================================================
      # 14. VALIDATE RESULT JSON
      # ======================================================

      - name: 14 - Validate production result JSON
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"

          $result = Get-Content `
            -LiteralPath $path `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Production result is not PASS"
          }

          if ($result.version -ne "Clean V001") {
            throw "Unexpected program version"
          }

          if ($result.target_return_pct -ne 30) {
            throw "Target return mismatch"
          }

          if ($result.entry_rule -ne "NEXT_CANDLE_OPEN") {
            throw "Entry rule mismatch"
          }

          if ($result.limited_test -ne $false) {
            throw "Production must not be limited test"
          }

          if ($result.detail_rows -le 0) {
            throw "No production validation rows"
          }

          Write-Host "[PASS] Production result JSON"

      # ======================================================
      # 15. VALIDATE CSV CONTENT
      # ======================================================

      - name: 15 - Validate production CSV content
        run: |
          $ErrorActionPreference = "Stop"

          $report = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_30pct"

          $detail = Join-Path $report "validation_detail.csv"
          $summary = Join-Path $report "validation_summary.csv"

          @'
          import csv
          import sys
          from collections import Counter
          from pathlib import Path

          detail = Path(sys.argv[1])
          summary = Path(sys.argv[2])

          valid_statuses = {
              "HIT",
              "MISS",
              "CENSORED",
              "INVALID",
          }

          valid_groups = {
              "PATTERN_256_ONLY",
              "ACCUMULATION_ONLY",
              "BOTH",
              "NEITHER",
          }

          horizons = {24, 72, 168}

          counts = Counter()
          rows = 0

          with detail.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              reader = csv.DictReader(handle)

              for row in reader:
                  rows += 1

                  if row["status"] not in valid_statuses:
                      raise ValueError("Invalid validation status")

                  if row["classification"] not in valid_groups:
                      raise ValueError("Invalid classification")

                  if int(row["horizon"]) not in horizons:
                      raise ValueError("Invalid horizon")

                  counts[row["status"]] += 1

          if rows <= 0:
              raise ValueError("No validation detail rows")

          with summary.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              reader = csv.DictReader(handle)
              summary_rows = list(reader)

          if len(summary_rows) != 36:
              raise ValueError(
                  "Expected 36 summary rows"
              )

          print("[PASS] Detail rows:", rows)
          print("[PASS] Summary rows:", len(summary_rows))
          print("[PASS] Status counts:", dict(counts))
          '@ | py - $detail $summary

          if ($LASTEXITCODE -ne 0) {
            throw "Production CSV validation failed"
          }

      # ======================================================
      # 16. VALIDATE CHECKPOINTS
      # ======================================================

      - name: 16 - Validate production checkpoints
        run: |
          $ErrorActionPreference = "Stop"

          $checkpointRoot = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_30pct\checkpoints"

          if (-not (Test-Path -LiteralPath $checkpointRoot -PathType Container)) {
            throw "Production checkpoint directory missing"
          }

          $checkpoints = @(
            Get-ChildItem `
              -LiteralPath $checkpointRoot `
              -Filter "*.json" `
              -File `
              -Recurse
          )

          if ($checkpoints.Count -eq 0) {
            throw "No production checkpoints generated"
          }

          foreach ($checkpoint in $checkpoints) {
            $data = Get-Content `
              -LiteralPath $checkpoint.FullName `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

            if ($data.version -ne "Clean V001") {
              throw "Checkpoint version mismatch"
            }

            if ($data.row_count -le 0) {
              throw "Checkpoint row count invalid"
            }

            $chunk = [System.IO.Path]::ChangeExtension(
              $checkpoint.FullName,
              ".csv"
            )

            if (-not (Test-Path -LiteralPath $chunk -PathType Leaf)) {
              throw "Checkpoint chunk missing: $chunk"
            }

            $actualHash = (
              Get-FileHash `
                -LiteralPath $chunk `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if (
              $actualHash -ne
              $data.chunk_sha256.ToLowerInvariant()
            ) {
              throw "Checkpoint chunk SHA256 mismatch"
            }
          }

          Write-Host "[PASS] Production checkpoints"
          Write-Host "Checkpoints: $($checkpoints.Count)"

      # ======================================================
      # 17. VERIFY OUTPUT SHA256
      # ======================================================

      - name: 17 - Verify production output SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $report = Join-Path `
            $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_30pct"

          $result = Get-Content `
            -LiteralPath (
              Join-Path $report "validation_result.json"
            ) `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          $detailHash = (
            Get-FileHash `
              -LiteralPath (
                Join-Path $report "validation_detail.csv"
              ) `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $summaryHash = (
            Get-FileHash `
              -LiteralPath (
                Join-Path $report "validation_summary.csv"
              ) `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if (
            $detailHash -ne
            $result.detail_sha256.ToLowerInvariant()
          ) {
            throw "Production detail SHA256 mismatch"
          }

          if (
            $summaryHash -ne
            $result.summary_sha256.ToLowerInvariant()
          ) {
            throw "Production summary SHA256 mismatch"
          }

          Write-Host "[PASS] Production output SHA256"

      # ======================================================
      # 18. FINAL PRODUCTION GATE
      # ======================================================

      - name: 18 - Final Clean V001 production gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "30 PERCENT VALIDATION PRODUCTION PASS"
          Write-Host "========================================"

          Write-Host "[PASS] Full-market validation"
          Write-Host "[PASS] Crosscheck source integrity"
          Write-Host "[PASS] Detail and summary CSV"
          Write-Host "[PASS] Checkpoint integrity"
          Write-Host "[PASS] Output SHA256"

          Write-Host ""
          Write-Host "NEXT: Compare pattern performance"

      # ======================================================
      # 19. UPLOAD PRODUCTION ARTIFACTS
      # ======================================================

      - name: 19 - Upload production verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-30pct-production-${{ github.run_id }}
          path: |
            ${{ env.PRODUCTION_ROOT }}/data/reports/pattern_256_accumulation_30pct/validation_result.json
            ${{ env.PRODUCTION_ROOT }}/data/reports/pattern_256_accumulation_30pct/validation_summary.csv
            ${{ env.PRODUCTION_ROOT }}/data/reports/pattern_256_accumulation_30pct/validation_manifest.json
          if-no-files-found: warn
          retention-days: 14
