
name: audit_pattern_256_h4_d1_readiness.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-h4-d1-readiness
  cancel-in-progress: false

jobs:
  h4-d1-readiness:
    name: h4-d1-readiness

    runs-on:
      - self-hosted
      - Windows

    defaults:
      run:
        shell: powershell

    timeout-minutes: 180

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        id: environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h4_d1_readiness.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Audit script missing: $script"
          }

          foreach ($tf in @("h4", "d1")) {
            $ohlcv = Join-Path `
              $env:PROJECT_ROOT `
              "data\ohlcv\$tf"

            $signals = Join-Path `
              $env:PROJECT_ROOT `
              "data\signals\256\$tf"

            foreach ($folder in @($ohlcv, $signals)) {
              if (-not (Test-Path -LiteralPath $folder -PathType Container)) {
                throw "Input directory missing: $folder"
              }

              Write-Host "[FOUND] $folder"
            }
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable"
          }

          Write-Host "[PASS] Environment"

      - name: Execute readiness audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h4_d1_readiness.py"

          & py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Readiness audit failed"
          }

          Write-Host "[PASS] Audit execution"

      - name: Verify output SHA256
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h4_d1_readiness"

          $manifestPath = Join-Path `
            $folder `
            "readiness_manifest.json"

          $resultPath = Join-Path `
            $folder `
            "readiness_result.json"

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Manifest missing"
          }

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($name in @(
            "readiness_result.json",
            "readiness_report.md"
          )) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Output missing: $name"
            }

            $expected = $manifest.output_sha256.$name

            if ([string]::IsNullOrWhiteSpace($expected)) {
              throw "SHA256 entry missing: $name"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Unexpected execution status"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($result.profitability_proven -ne $false) {
            throw "Unexpected profitability approval"
          }

          Write-Host "[PASS] Report integrity"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h4_d1_readiness\readiness_result.json"

          $r = Get-Content `
            -LiteralPath $path `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 H4/D1 Readiness Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Classification | $($r.classification) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## Timeframe summary",
            "",
            "| TF | Pairs | Passed | Review | OHLCV rows | Triggers | Gaps |",
            "|---|---:|---:|---:|---:|---:|---:|"
          )

          foreach ($tf in @("h4", "d1")) {
            $s = $r.summary.$tf

            $lines += (
              "| $tf " +
              "| $($s.matched_pairs) " +
              "| $($s.passed_pairs) " +
              "| $($s.review_pairs) " +
              "| $($s.ohlcv_rows) " +
              "| $($s.trigger_rows) " +
              "| $($s.ohlcv_gap_events) |"
            )
          }

          $lines += @(
            "",
            "Input inspection only.",
            "",
            "Independent OOS: NOT PROVEN.",
            "",
            "Profitability: NOT PROVEN.",
            "",
            "Training and live trading remain unapproved."
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage verified reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h4_d1_readiness"

          $destination = Join-Path `
            $env:GITHUB_WORKSPACE `
            "h4_d1_readiness_artifact"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item `
              -LiteralPath $destination `
              -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "readiness_result.json",
            "readiness_report.md",
            "readiness_manifest.json"
          )) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $srcHash = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash

            $dstHash = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash

            if ($srcHash -ne $dstHash) {
              throw "Staging mismatch: $name"
            }

            Write-Host "[STAGED] $name"
          }

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-h4-d1-readiness
          path: h4_d1_readiness_artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $statuses = @(
            "${{ steps.environment.outcome }}",
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )

          foreach ($status in $statuses) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] H4/D1 readiness audit completed"
          Write-Host "Research decision: HOLD"
