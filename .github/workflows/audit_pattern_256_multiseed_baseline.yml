
name: audit_pattern_256_multiseed_baseline.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-multiseed-baseline
  cancel-in-progress: false

jobs:
  multiseed-baseline:
    name: multiseed-baseline

    runs-on:
      - self-hosted
      - Windows

    defaults:
      run:
        shell: powershell

    timeout-minutes: 180

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source files
        id: verify
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_multiseed_baseline.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing audit Python script"
          }

          foreach ($tf in @("h4", "d1")) {
            foreach ($relative in @(
              "data\ohlcv\$tf",
              "data\signals\256\$tf"
            )) {
              $folder = Join-Path `
                $env:PROJECT_ROOT $relative

              if (-not (Test-Path -LiteralPath $folder)) {
                throw "Missing folder: $folder"
              }

              $count = @(
                Get-ChildItem `
                  -LiteralPath $folder `
                  -Filter "KRW-*.csv" `
                  -File
              ).Count

              if ($count -ne 290) {
                throw "Expected 290 files: $folder; found $count"
              }

              Write-Host "[OK] $folder : $count"
            }
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Run multi-seed audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_multiseed_baseline.py"

          & py -u $script `
            --root $env:PROJECT_ROOT `
            --seeds 30 `
            --base-seed 2562026 `
            --warmup 3 `
            --split 0.70

          if ($LASTEXITCODE -ne 0) {
            throw "Multi-seed audit failed"
          }

      - name: Verify reports and SHA256
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_multiseed_baseline"

          $resultPath = Join-Path $folder "result.json"
          $manifestPath = Join-Path $folder "manifest.json"

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($name in @(
            "result.json",
            "report.md"
          )) {
            $path = Join-Path $folder $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $m.sha256.$name

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          if ($r.execution -ne "PASS") {
            throw "Execution not PASS"
          }

          if ($r.seed_count -ne 30) {
            throw "Seed count mismatch"
          }

          if ($r.runs.Count -ne 30) {
            throw "Run count mismatch"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Research decision mismatch"
          }

          if ($r.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($r.profitability_proven -ne $false) {
            throw "Unexpected profitability approval"
          }

          if ($r.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          foreach ($tf in @("h4", "d1")) {
            foreach ($period in @("train", "test")) {
              $s = $r.summary.$tf.$period

              $positive = $s.positive_lift_seeds
              $negative = $s.negative_lift_seeds
              $zero = $s.zero_lift_seeds

              if (($positive + $negative + $zero) -ne 30) {
                throw "Seed classification mismatch: $tf/$period"
              }

              foreach ($run in $r.runs) {
                $item = $run.results.$tf.$period

                if ($item.signal_events -ne $item.baseline_events) {
                  throw "Sample size mismatch: $tf/$period"
                }

                if ($item.signal_hits -gt $item.signal_events) {
                  throw "Invalid signal hits: $tf/$period"
                }

                if ($item.baseline_hits -gt $item.baseline_events) {
                  throw "Invalid baseline hits: $tf/$period"
                }
              }
            }
          }

          Write-Host "[PASS] Integrity"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_multiseed_baseline\result.json"

          $r = Get-Content `
            -LiteralPath $path `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 Multi-Seed Baseline Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Seeds | $($r.seed_count) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## Results",
            "",
            "| TF | Period | Signal % | Baseline mean % | Mean lift pp | Positive seeds |",
            "|---|---|---:|---:|---:|---:|"
          )

          foreach ($tf in @("h4", "d1")) {
            foreach ($period in @("train", "test")) {
              $s = $r.summary.$tf.$period

              $lines += (
                "| $tf | $period " +
                "| $($s.signal_rate_first_seed_pct) " +
                "| $($s.baseline_mean_pct) " +
                "| $($s.lift_mean_pp) " +
                "| $($s.positive_lift_seeds)/$($s.seed_count) |"
              )
            }
          }

          $lines += @(
            "",
            "## Research limitations",
            "",
            "- Seeds reuse the same historical data",
            "- No statistical significance proof",
            "- No market-regime matching",
            "- No independent OOS proof",
            "- No realized profitability proof",
            "- Decision remains HOLD"
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_multiseed_baseline"

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "multiseed_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $a = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash

            $b = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash

            if ($a -ne $b) {
              throw "Staging hash mismatch: $name"
            }
          }

          "STAGED_REPORT_DIR=$destination" |
            Out-File `
              -LiteralPath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-multiseed-baseline
          path: ${{ env.STAGED_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Final gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($status in @(
            "${{ steps.verify.outcome }}",
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] Multi-seed baseline audit"
          Write-Host "Research decision: HOLD"
