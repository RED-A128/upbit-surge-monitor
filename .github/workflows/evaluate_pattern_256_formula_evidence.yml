
name: evaluate_pattern_256_formula_evidence.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-formula-evidence
  cancel-in-progress: false

jobs:
  formula-evidence:
    name: formula-evidence

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      EXPECTED_VERSION: Clean V003-21
      OUTPUT_VERSION: Clean V003-22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and previous audit
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $root = $env:PROJECT_ROOT

          $required = @(
            "build_features.py",
            "detect_256.py",
            "validate_256.py",
            "data/reports/pattern_256_formula_audit/formula_audit_result.json",
            "data/reports/pattern_256_formula_audit/formula_audit_manifest.json",
            "data/reports/pattern_256_formula_audit/formula_audit_findings.csv",
            "data/reports/pattern_256_formula_audit/formula_audit_functions.csv"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required file missing: $path"
            }
          }

          Write-Host "[PASS] Required files exist"

      - name: Extract formula and timing evidence
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import ast
          import csv
          import hashlib
          import io
          import json
          import os
          import re
          import sys
          import tempfile
          import tokenize

          from datetime import datetime, timezone
          from pathlib import Path


          ROOT = Path(os.environ["PROJECT_ROOT"]).resolve()

          PREVIOUS = ROOT / (
              "data/reports/pattern_256_formula_audit"
          )

          OUTPUT = ROOT / (
              "data/reports/pattern_256_formula_evidence"
          )

          VERSION = os.environ["OUTPUT_VERSION"]

          SOURCES = (
              "build_features.py",
              "detect_256.py",
              "validate_256.py",
          )

          RULES = {
              "SHIFT": r"\.shift\s*\(",
              "ROLLING": r"\.rolling\s*\(",
              "EWMA": r"\.ewm\s*\(",
              "INDEX": r"\b(?:iloc|loc)\s*\[",
              "CANDLE": (
                  r"\b(?:candle|closed|complete|"
                  r"timestamp|datetime|timeframe)\b"
              ),
              "GAP": (
                  r"\b(?:gap|missing|resample|"
                  r"asfreq|ffill|bfill|interpolate)\b"
              ),
              "SIGNAL": (
                  r"\b(?:signal|detect|pattern_256|"
                  r"accumulation|breakout)\b"
              ),
              "FUTURE": (
                  r"\b(?:future|forward|lookahead|"
                  r"target|label|horizon)\b"
              ),
          }


          def digest(path):
              h = hashlib.sha256()

              with path.open("rb") as stream:
                  for chunk in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      h.update(chunk)

              return h.hexdigest()


          def read_json(path):
              return json.loads(
                  path.read_text(encoding="utf-8-sig")
              )


          def write_atomic(path, content):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              fd, temporary_name = tempfile.mkstemp(
                  prefix=".evidence_",
                  suffix=".tmp",
                  dir=str(path.parent),
              )

              temporary = Path(temporary_name)

              try:
                  with os.fdopen(
                      fd,
                      "w",
                      encoding="utf-8",
                      newline="",
                  ) as stream:
                      stream.write(content)
                      stream.flush()
                      os.fsync(stream.fileno())

                  os.replace(temporary, path)

              finally:
                  if temporary.exists():
                      temporary.unlink()


          def to_csv(header, rows):
              buffer = io.StringIO(newline="")
              writer = csv.writer(
                  buffer,
                  lineterminator="\n",
              )

              writer.writerow(header)
              writer.writerows(rows)

              return buffer.getvalue()


          def to_json(data):
              return json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
                  allow_nan=False,
              ) + "\n"


          def verify_previous():
              result_path = (
                  PREVIOUS / "formula_audit_result.json"
              )

              manifest_path = (
                  PREVIOUS / "formula_audit_manifest.json"
              )

              result = read_json(result_path)
              manifest = read_json(manifest_path)

              expected = os.environ["EXPECTED_VERSION"]

              if result.get("version") != expected:
                  raise ValueError(
                      "Previous result version mismatch"
                  )

              if manifest.get("version") != expected:
                  raise ValueError(
                      "Previous manifest version mismatch"
                  )

              if result.get("execution_status") != "PASS":
                  raise ValueError(
                      "Previous audit did not pass"
                  )

              if result.get("overall_decision") != "HOLD":
                  raise ValueError(
                      "Previous decision mismatch"
                  )

              if result.get(
                  "approved_for_live_trading"
              ) is not False:
                  raise ValueError(
                      "Unsafe previous approval"
                  )

              hashes = manifest.get(
                  "output_sha256", {}
              )

              required = {
                  "formula_audit_result.json",
                  "formula_audit_findings.csv",
                  "formula_audit_functions.csv",
              }

              if set(hashes) != required:
                  raise ValueError(
                      "Previous output manifest incomplete"
                  )

              for name, expected_hash in hashes.items():
                  path = PREVIOUS / name

                  if digest(path) != expected_hash:
                      raise ValueError(
                          "Previous output changed: " + name
                      )

              source_hashes = manifest.get(
                  "input_sha256", {}
              ).get(
                  "implementation_files", {}
              )

              if set(source_hashes) != set(SOURCES):
                  raise ValueError(
                      "Source manifest incomplete"
                  )

              for name in SOURCES:
                  if digest(ROOT / name) != source_hashes[name]:
                      raise ValueError(
                          "Source changed: " + name
                      )

              return {
                  "previous_result": digest(result_path),
                  "previous_manifest": digest(manifest_path),
                  "previous_findings": digest(
                      PREVIOUS / "formula_audit_findings.csv"
                  ),
                  "previous_functions": digest(
                      PREVIOUS / "formula_audit_functions.csv"
                  ),
                  "implementation_files": source_hashes,
              }


          def load_previous_findings():
              path = PREVIOUS / "formula_audit_findings.csv"

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as stream:
                  return list(csv.DictReader(stream))


          def function_spans(tree):
              spans = []

              for node in ast.walk(tree):
                  if isinstance(
                      node,
                      (
                          ast.FunctionDef,
                          ast.AsyncFunctionDef,
                      ),
                  ):
                      spans.append((
                          node.lineno,
                          getattr(
                              node,
                              "end_lineno",
                              node.lineno,
                          ),
                          node.name,
                      ))

              return spans


          def containing_function(spans, line):
              matches = [
                  span
                  for span in spans
                  if span[0] <= line <= span[1]
              ]

              if not matches:
                  return "<module>"

              matches.sort(
                  key=lambda item: (
                      item[1] - item[0],
                      item[0],
                  )
              )

              return matches[0][2]


          def tokenize_lines(content):
              comments = set()
              strings = set()
              executable = set()

              tokens = tokenize.generate_tokens(
                  io.StringIO(content).readline
              )

              ignored = {
                  tokenize.NL,
                  tokenize.NEWLINE,
                  tokenize.INDENT,
                  tokenize.DEDENT,
                  tokenize.ENDMARKER,
                  tokenize.ENCODING,
              }

              for token in tokens:
                  first = token.start[0]
                  last = token.end[0]

                  if token.type == tokenize.COMMENT:
                      comments.add(first)

                  elif token.type == tokenize.STRING:
                      strings.update(
                          range(first, last + 1)
                      )

                  elif token.type not in ignored:
                      executable.add(first)

              return comments, strings, executable


          def classify_line(
              number,
              comments,
              strings,
              executable,
          ):
              if number in executable:
                  return "EXECUTABLE_LINE_REVIEW"

              if number in strings:
                  return "STRING_ONLY"

              if number in comments:
                  return "COMMENT_ONLY"

              return "NON_EXECUTABLE"


          def context(lines, line_number, radius=3):
              start = max(1, line_number - radius)
              end = min(
                  len(lines),
                  line_number + radius,
              )

              return "\n".join(
                  f"{index:05d}: {lines[index - 1]}"
                  for index in range(start, end + 1)
              )


          def build_evidence():
              previous_findings = load_previous_findings()

              indexed_findings = {}

              for finding in previous_findings:
                  key = (
                      finding["source_file"],
                      int(finding["line"]),
                  )

                  indexed_findings.setdefault(
                      key, set()
                  ).add(
                      finding["category"]
                  )

              evidence_rows = []
              function_rows = []

              for name in SOURCES:
                  path = ROOT / name

                  content = path.read_text(
                      encoding="utf-8-sig"
                  )

                  tree = ast.parse(
                      content,
                      filename=name,
                  )

                  lines = content.splitlines()
                  spans = function_spans(tree)

                  (
                      comments,
                      strings,
                      executable,
                  ) = tokenize_lines(content)

                  for first, last, function_name in spans:
                      function_rows.append([
                          name,
                          function_name,
                          first,
                          last,
                          last - first + 1,
                      ])

                  selected = set()

                  for index, line in enumerate(
                      lines,
                      start=1,
                  ):
                      if any(
                          re.search(
                              pattern,
                              line,
                              flags=re.IGNORECASE,
                          )
                          for pattern in RULES.values()
                      ):
                          selected.add(index)

                  for file_name, line_number in (
                      indexed_findings
                  ):
                      if file_name == name:
                          selected.add(line_number)

                  for line_number in sorted(selected):
                      if not (
                          1 <= line_number <= len(lines)
                      ):
                          raise ValueError(
                              "Invalid finding line"
                          )

                      line = lines[line_number - 1]

                      categories = [
                          key
                          for key, pattern in RULES.items()
                          if re.search(
                              pattern,
                              line,
                              flags=re.IGNORECASE,
                          )
                      ]

                      previous_categories = sorted(
                          indexed_findings.get(
                              (name, line_number),
                              set(),
                          )
                      )

                      classification = classify_line(
                          line_number,
                          comments,
                          strings,
                          executable,
                      )

                      evidence_rows.append([
                          name,
                          line_number,
                          containing_function(
                              spans,
                              line_number,
                          ),
                          classification,
                          "|".join(categories),
                          "|".join(previous_categories),
                          line[:500],
                          context(lines, line_number),
                      ])

                  print(
                      f"[SOURCE] {name} "
                      f"functions={len(spans)} "
                      f"selected_lines={len(selected)}",
                      flush=True,
                  )

              return evidence_rows, function_rows


          def valid_existing(inputs):
              expected_files = {
                  "formula_evidence_result.json",
                  "formula_evidence_lines.csv",
                  "formula_evidence_functions.csv",
              }

              manifest_path = (
                  OUTPUT / "formula_evidence_manifest.json"
              )

              if not manifest_path.is_file():
                  return False

              try:
                  manifest = read_json(manifest_path)

                  if manifest.get("version") != VERSION:
                      return False

                  if manifest.get("input_sha256") != inputs:
                      return False

                  hashes = manifest.get(
                      "output_sha256", {}
                  )

                  if set(hashes) != expected_files:
                      return False

                  for name, expected in hashes.items():
                      if digest(OUTPUT / name) != expected:
                          return False

                  result = read_json(
                      OUTPUT / "formula_evidence_result.json"
                  )

                  return (
                      result.get("version") == VERSION
                      and result.get(
                          "execution_status"
                      ) == "PASS"
                      and result.get(
                          "overall_decision"
                      ) == "HOLD"
                      and result.get(
                          "approved_for_live_trading"
                      ) is False
                  )

              except (
                  OSError,
                  ValueError,
                  TypeError,
                  KeyError,
              ):
                  return False


          def main():
              inputs = verify_previous()

              if valid_existing(inputs):
                  print("[SKIP] Verified prior evidence")
                  print("[DECISION] HOLD")
                  return 0

              if OUTPUT.exists() and any(
                  OUTPUT.iterdir()
              ):
                  raise ValueError(
                      "Existing evidence output is incomplete "
                      "or changed; manual review required"
                  )

              evidence, functions = build_evidence()

              executable_rows = sum(
                  row[3] == "EXECUTABLE_LINE_REVIEW"
                  for row in evidence
              )

              previous_review_lines = sum(
                  "POTENTIAL_FORWARD_LABEL" in row[5]
                  for row in evidence
              )

              result = {
                  "version": VERSION,
                  "execution_status": "PASS",
                  "checked_at_utc": datetime.now(
                      timezone.utc
                  ).isoformat(timespec="seconds"),
                  "source_file_count": len(SOURCES),
                  "function_count": len(functions),
                  "evidence_line_count": len(evidence),
                  "executable_review_line_count":
                      executable_rows,
                  "previous_forward_label_line_count":
                      previous_review_lines,
                  "source_hashes_verified": True,
                  "previous_audit_verified": True,
                  "source_evidence_extracted": True,
                  "static_classification_only": True,
                  "lookahead_absence_proven": False,
                  "signal_definition_mathematically_verified":
                      False,
                  "candle_availability_at_signal_time_verified":
                      False,
                  "ohlcv_continuity_verified": False,
                  "new_prospective_events_created": 0,
                  "independent_oos_proven": False,
                  "profitability_proven": False,
                  "approved_for_live_trading": False,
                  "overall_decision": "HOLD",
                  "next_required_validation": (
                      "Manually review extracted executable "
                      "source and reproduce the 256 formula "
                      "with closed-candle and gap-safe "
                      "point-in-time tests."
                  ),
              }

              OUTPUT.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              write_atomic(
                  OUTPUT / "formula_evidence_lines.csv",
                  to_csv(
                      (
                          "source_file",
                          "line",
                          "function",
                          "classification",
                          "rule_categories",
                          "previous_categories",
                          "source_line",
                          "source_context",
                      ),
                      evidence,
                  ),
              )

              write_atomic(
                  OUTPUT / "formula_evidence_functions.csv",
                  to_csv(
                      (
                          "source_file",
                          "function",
                          "start_line",
                          "end_line",
                          "line_count",
                      ),
                      functions,
                  ),
              )

              write_atomic(
                  OUTPUT / "formula_evidence_result.json",
                  to_json(result),
              )

              output_names = (
                  "formula_evidence_result.json",
                  "formula_evidence_lines.csv",
                  "formula_evidence_functions.csv",
              )

              manifest = {
                  "version": VERSION,
                  "input_sha256": inputs,
                  "output_sha256": {
                      name: digest(OUTPUT / name)
                      for name in output_names
                  },
              }

              write_atomic(
                  OUTPUT / "formula_evidence_manifest.json",
                  to_json(manifest),
              )

              if not valid_existing(inputs):
                  raise ValueError(
                      "Final evidence integrity check failed"
                  )

              print("[PASS] " + VERSION)
              print("[INFO] Evidence lines:", len(evidence))
              print("[INFO] Functions:", len(functions))
              print("[DECISION] HOLD")

              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())

              except KeyboardInterrupt:
                  print(
                      "[INTERRUPTED]",
                      file=sys.stderr,
                  )
                  sys.exit(130)

              except Exception as exc:
                  print(
                      "[FAIL] " + str(exc),
                      file=sys.stderr,
                  )
                  sys.exit(1)
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Formula evidence extraction failed"
          }

      - name: Verify evidence integrity
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import hashlib
          import json
          import os

          from pathlib import Path


          root = Path(os.environ["PROJECT_ROOT"])

          output = root / (
              "data/reports/pattern_256_formula_evidence"
          )

          def digest(path):
              h = hashlib.sha256()

              with path.open("rb") as stream:
                  for chunk in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      h.update(chunk)

              return h.hexdigest()

          def load(name):
              return json.loads(
                  (output / name).read_text(
                      encoding="utf-8"
                  )
              )

          result = load("formula_evidence_result.json")
          manifest = load("formula_evidence_manifest.json")

          version = os.environ["OUTPUT_VERSION"]

          if result.get("version") != version:
              raise SystemExit("Result version mismatch")

          if manifest.get("version") != version:
              raise SystemExit("Manifest version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Execution status mismatch")

          if result.get("overall_decision") != "HOLD":
              raise SystemExit("Decision mismatch")

          if result.get("approved_for_live_trading") is not False:
              raise SystemExit("Unsafe approval")

          if result.get("source_file_count") != 3:
              raise SystemExit("Source count mismatch")

          if result.get("source_hashes_verified") is not True:
              raise SystemExit("Source hashes not verified")

          if result.get("previous_audit_verified") is not True:
              raise SystemExit("Previous audit not verified")

          if result.get("new_prospective_events_created") != 0:
              raise SystemExit("Unexpected event generation")

          expected_files = {
              "formula_evidence_result.json",
              "formula_evidence_lines.csv",
              "formula_evidence_functions.csv",
          }

          hashes = manifest.get("output_sha256", {})

          if set(hashes) != expected_files:
              raise SystemExit("Output file set mismatch")

          for name, expected in hashes.items():
              if digest(output / name) != expected:
                  raise SystemExit(
                      "SHA256 mismatch: " + name
                  )

          inputs = manifest.get("input_sha256", {})

          previous = root / (
              "data/reports/pattern_256_formula_audit"
          )

          previous_files = {
              "previous_result":
                  "formula_audit_result.json",
              "previous_manifest":
                  "formula_audit_manifest.json",
              "previous_findings":
                  "formula_audit_findings.csv",
              "previous_functions":
                  "formula_audit_functions.csv",
          }

          for key, name in previous_files.items():
              if digest(previous / name) != inputs.get(key):
                  raise SystemExit(
                      "Previous audit changed: " + name
                  )

          source_hashes = inputs.get(
              "implementation_files", {}
          )

          if set(source_hashes) != {
              "build_features.py",
              "detect_256.py",
              "validate_256.py",
          }:
              raise SystemExit("Source manifest mismatch")

          for name, expected in source_hashes.items():
              if digest(root / name) != expected:
                  raise SystemExit(
                      "Implementation changed: " + name
                  )

          print("[PASS] Clean V003-22")
          print("[PASS] SHA256 integrity")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Evidence verification failed"
          }

      - name: Upload evidence results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-formula-evidence-v003-22
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_formula_evidence/formula_evidence_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_formula_evidence/formula_evidence_lines.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_formula_evidence/formula_evidence_functions.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_formula_evidence/formula_evidence_manifest.json
          if-no-files-found: error
          retention-days: 90
