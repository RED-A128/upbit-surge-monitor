
name: audit_pattern_256_pit_readiness.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-pit-readiness
  cancel-in-progress: false

jobs:
  pit-readiness:
    name: pit-readiness

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      SCRIPT_NAME: audit_pattern_256_pit_readiness.py
      REPORT_FOLDER: data\reports\pattern_256_pit_readiness

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and script
        run: |
          $ErrorActionPreference = "Stop"

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Script missing: $script"
          }

          & py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax check failed"
          }

          Write-Host "[PASS] Python and script verified"

      - name: Verify persistent project data
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner identity:"
          whoami

          $required = @(
            "data\ohlcv\d1",
            "data\features\d1",
            "data\signals\256\d1"
          )

          foreach ($relative in $required) {
            $path = Join-Path `
              $env:PROJECT_ROOT `
              $relative

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required directory missing: $path"
            }

            $count = @(
              Get-ChildItem `
                -LiteralPath $path `
                -Filter "*.csv" `
                -File
            ).Count

            if ($count -eq 0) {
              throw "No CSV files: $path"
            }

            Write-Host "[OK] $relative : $count CSV files"
          }

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_candidate_sensitivity"

          foreach ($name in @(
            "result.json",
            "manifest.json"
          )) {
            $path = Join-Path $source $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Clean V004 input missing: $path"
            }
          }

      - name: Execute PIT readiness audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          $startUtc = [DateTime]::UtcNow

          & py -u $script `
            --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "PIT readiness audit failed"
          }

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $result = Join-Path $folder "result.json"

          if (-not (Test-Path -LiteralPath $result)) {
            throw "Audit result missing"
          }

          $modified = (
            Get-Item -LiteralPath $result
          ).LastWriteTimeUtc

          if ($modified -lt $startUtc.AddSeconds(-2)) {
            throw "Stale audit result"
          }

          Write-Host "[PASS] Audit executed"

      - name: Verify result and hashes
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $resultPath = Join-Path $folder "result.json"
          $manifestPath = Join-Path $folder "manifest.json"

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            if (-not (
              Test-Path -LiteralPath (
                Join-Path $folder $name
              )
            )) {
              throw "Output missing: $name"
            }
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($r.version -ne "Clean V005") {
            throw "Unexpected version"
          }

          if ($r.execution -ne "PASS") {
            throw "Execution failed"
          }

          if ($r.candidate -ne "d1|DOWN|LOW") {
            throw "Candidate mismatch"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Research decision mismatch"
          }

          if ($r.data_readiness -notin @(
            "READY_FOR_DEEPER_AUDIT",
            "BLOCKED"
          )) {
            throw "Invalid readiness status"
          }

          foreach ($field in @(
            "point_in_time_proven",
            "independent_oos_proven",
            "formal_significance_proven",
            "multiple_testing_adjusted",
            "profitability_proven",
            "train_approved",
            "live_trading_approved"
          )) {
            if ($r.$field -ne $false) {
              throw "Unexpected approval: $field"
            }
          }

          foreach ($name in @(
            "result.json",
            "report.md"
          )) {
            $path = Join-Path $folder $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $m.sha256.$name

            if (
              [string]::IsNullOrWhiteSpace($expected)
            ) {
              throw "Missing SHA256: $name"
            }

            if (
              $actual -ne $expected.ToLowerInvariant()
            ) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[OK] SHA256 $name"
          }

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_candidate_sensitivity\result.json"

          $sourceHash = (
            Get-FileHash `
              -LiteralPath $source `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if (
            $r.source.source_result_sha256 -ne $sourceHash
          ) {
            throw "Source SHA256 mismatch"
          }

          if (
            $m.source_result_sha256 -ne $sourceHash
          ) {
            throw "Manifest source SHA256 mismatch"
          }

          Write-Host "[PASS] Integrity verified"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $r = Get-Content `
            -LiteralPath (
              Join-Path $folder "result.json"
            ) `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 PIT Data Readiness Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Data readiness | $($r.data_readiness) |",
            "| Common markets | $($r.common_market_count) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## Inventory",
            "",
            "| Category | Files | Rows | Issues |",
            "|---|---:|---:|---:|"
          )

          foreach ($category in @(
            "ohlcv",
            "features",
            "signals"
          )) {
            $info = $r.categories.$category

            $lines += (
              "| $category " +
              "| $($info.file_count) " +
              "| $($info.row_count) " +
              "| $($info.issue_count) |"
            )
          }

          $lines += @(
            "",
            "## Issue counts",
            ""
          )

          foreach ($property in $r.issue_counts.PSObject.Properties) {
            $lines += (
              "- $($property.Name): $($property.Value)"
            )
          }

          $lines += @(
            "",
            "## Limitations",
            "",
            "- Inventory PASS is not PIT proof",
            "- Schema readiness is not signal validity",
            "- No independent OOS verification",
            "- No profitability verification",
            "- Training and trading are not approved",
            "- Research decision remains HOLD"
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "pit_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $sourceHash = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash

            $copyHash = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash

            if ($sourceHash -ne $copyHash) {
              throw "Staging hash mismatch: $name"
            }
          }

          "STAGED_REPORT_DIR=$destination" |
            Out-File `
              -LiteralPath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

          Write-Host "[PASS] Reports staged"

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-pit-readiness
          path: ${{ env.STAGED_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Final gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($status in @(
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] Clean V005 completed"
          Write-Host "Research decision: HOLD"
