# ============================================================
# Upbit Surge Monitor
# Clean V003
#
# File:
#   .github/workflows/collect.yml
#
# Purpose:
#   Run collector.py Clean V003 automatically on the Windows
#   self-hosted runner.
#
#   After successful collection:
#
#       Collector
#           ↓
#       Collector Validator
#           ↓
#       OHLCV Data History Audit
#
#
# Clean V003 additions:
#
#   - Collector current-run checkpoint / Resume support
#   - Persistent local checkpoint protection
#   - Existing OHLCV preservation
#   - Dynamic KRW market count support
#   - Dynamic total jobs = KRW markets x 3
#   - Longer workflow timeout
#   - Checkpoint inspection before Collector
#   - Checkpoint verification after Collector
#   - Failed/interrupted run can resume
#
#
# Important project rules:
#
#   - Windows PC self-hosted runner
#   - Use "py" only
#   - Raw OHLCV data stays on the PC
#   - data/ohlcv is NOT committed to Git
#   - Collector checkpoint stays on the PC
#   - Collector runs before Validator
#   - Validator is READ ONLY
#   - Data History Audit is READ ONLY
#   - Existing OHLCV must NEVER be deleted
#   - No git reset
#   - No git clean
#   - No automatic git commit
#   - No automatic git push
#   - No Feature generation
#   - No 256 Detector
#   - No Prediction
#   - No Trading
#
#
# Collector Resume policy:
#
#   data/collector/collector_checkpoint.json
#
#   RUNNING checkpoint:
#       Resume the interrupted current run.
#
#   COMPLETED checkpoint:
#       collector.py starts a NEW run and checks all markets
#       again for newly created candles.
#
#   Therefore checkpoint completion does NOT permanently skip
#   future collection.
#
# ============================================================


name: Upbit Data Collector Clean V003


# ============================================================
# TRIGGERS
# ============================================================
#
# GitHub cron uses UTC.
#
# "5 * * * *"
#
# Every hour at minute 05 UTC.
#
# Korea:
#   UTC + 9
#
# workflow_dispatch:
#   Allows manual execution from GitHub Actions.
#
# ============================================================

on:

  schedule:
    - cron: "5 * * * *"

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================
#
# This workflow does not modify the Git repository.
#
# ============================================================

permissions:
  contents: read


# ============================================================
# CONCURRENCY
# ============================================================
#
# Never run two collectors simultaneously.
#
# If a Collector is still running when another scheduled
# trigger occurs, GitHub must NOT cancel the existing run.
#
# ============================================================

concurrency:

  group: upbit-data-collector-clean-v003

  cancel-in-progress: false


# ============================================================
# JOBS
# ============================================================

jobs:

  collect:

    name: Collector Clean V003

    # ========================================================
    # SELF-HOSTED WINDOWS PC
    # ========================================================

    runs-on:
      - self-hosted
      - Windows
      - X64


    # ========================================================
    # TIMEOUT
    # ========================================================
    #
    # Clean V001:
    #
    #   60 minutes
    #
    # Clean V003:
    #
    #   180 minutes
    #
    # Full market collection + validation + history audit can
    # take considerably longer than a lightweight collection.
    #
    # ========================================================

    timeout-minutes: 180


    # ========================================================
    # ENVIRONMENT
    # ========================================================

    env:

      PYTHONUTF8: "1"

      PYTHONIOENCODING: "utf-8"

      COLLECTOR_CHECKPOINT: "data\\collector\\collector_checkpoint.json"

      COLLECTOR_STATUS: "data\\collector_status.csv"


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Checkout repository
      # ======================================================
      #
      # CRITICAL:
      #
      # clean MUST remain false.
      #
      # The self-hosted runner contains persistent local data:
      #
      #   data/ohlcv/
      #   data/collector/
      #   data/collector_status.csv
      #
      # These files must survive workflow executions.
      #
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 1

          persist-credentials: false

          clean: false


      # ======================================================
      # STEP 2
      # Show execution information
      # ======================================================

      - name: Show execution information

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "COLLECTOR WORKFLOW - CLEAN V003"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Computer:"
          Write-Host "  $env:COMPUTERNAME"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"
          Write-Host ""

          Write-Host "Runner OS:"
          Write-Host "  $env:RUNNER_OS"
          Write-Host ""

          Write-Host "Runner architecture:"
          Write-Host "  $env:RUNNER_ARCH"
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"
          Write-Host ""

          Write-Host "Ref:"
          Write-Host "  $env:GITHUB_REF"
          Write-Host ""

          Write-Host "SHA:"
          Write-Host "  $env:GITHUB_SHA"
          Write-Host ""

          Write-Host "Event:"
          Write-Host "  $env:GITHUB_EVENT_NAME"
          Write-Host ""

          Write-Host "Current directory:"

          Get-Location

          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Existing OHLCV     : PRESERVE"
          Write-Host "  Checkout clean     : FALSE"
          Write-Host "  Git reset          : DISABLED"
          Write-Host "  Git clean          : DISABLED"
          Write-Host "  Git commit         : DISABLED"
          Write-Host "  Git push           : DISABLED"
          Write-Host "  Feature generation : DISABLED"
          Write-Host "  256 Detector       : DISABLED"
          Write-Host "  Prediction         : DISABLED"
          Write-Host "  Trading            : DISABLED"

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 3
      # Verify Python launcher
      # ======================================================
      #
      # PROJECT RULE:
      #
      #   python  -> DO NOT USE
      #   python3 -> DO NOT USE
      #   py      -> USE
      #
      # ======================================================

      - name: Verify Python launcher

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON LAUNCHER"
          Write-Host "============================================================"
          Write-Host ""

          $PyCommand = Get-Command py -ErrorAction SilentlyContinue

          if ($null -eq $PyCommand) {

              Write-Host "[FAIL] Windows Python launcher 'py' was not found."
              Write-Host ""
              Write-Host "This project requires:"
              Write-Host ""
              Write-Host "  py"
              Write-Host ""

              exit 1
          }

          Write-Host "[PASS] py launcher found."
          Write-Host ""

          Write-Host "Command:"
          Write-Host "  $($PyCommand.Source)"
          Write-Host ""

          Write-Host "Python version:"

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] py --version failed."

              exit $LASTEXITCODE
          }

          Write-Host ""

          Write-Host "Python executable:"

          py -c "import sys; print(sys.executable)"

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Python executable check failed."

              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "[PASS] Python environment ready."
          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 4
      # Verify required project files
      # ======================================================

      - name: Verify project files

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PROJECT FILES"
          Write-Host "============================================================"
          Write-Host ""

          $RequiredFiles = @(

              "collector.py",

              "validate_collector.py",

              "data_history_audit.py",

              "requirements.txt",

              "PROJECT_STATE.md",

              "README.md"
          )

          $Failed = $false

          foreach ($File in $RequiredFiles) {

              if (Test-Path $File -PathType Leaf) {

                  Write-Host "[PASS] $File"

              }
              else {

                  Write-Host "[FAIL] $File"

                  $Failed = $true
              }
          }

          Write-Host ""

          if ($Failed) {

              Write-Host "[FAIL] One or more required project files are missing."

              exit 1
          }

          Write-Host "[PASS] Required project files verified."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 5
      # Verify Collector Clean V003
      # ======================================================

      - name: Verify Collector Clean V003 source

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY COLLECTOR CLEAN V003 SOURCE"
          Write-Host "============================================================"
          Write-Host ""

          $CollectorSource = Get-Content `
              -Path "collector.py" `
              -Raw

          $RequiredMarkers = @(

              "Collector Clean V003",

              "collector_checkpoint.json",

              "CURRENT ACTIVE RUN ONLY",

              "prepare_checkpoint",

              "mark_job_success",

              "checkpoint_job_completed"
          )

          $MissingMarkers = @()

          foreach ($Marker in $RequiredMarkers) {

              if (-not $CollectorSource.Contains($Marker)) {

                  $MissingMarkers += $Marker
              }
          }

          if ($MissingMarkers.Count -gt 0) {

              Write-Host "[FAIL] collector.py does not appear to be Clean V003."
              Write-Host ""

              foreach ($Marker in $MissingMarkers) {

                  Write-Host "Missing marker:"
                  Write-Host "  $Marker"
              }

              exit 1
          }

          Write-Host "[PASS] collector.py Clean V003 markers verified."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 6
      # Install / verify dependencies
      # ======================================================

      - name: Install dependencies

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "INSTALL / VERIFY DEPENDENCIES"
          Write-Host "============================================================"
          Write-Host ""

          py -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Dependency installation failed."

              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies ready."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 7
      # Validate Python source syntax
      # ======================================================

      - name: Validate Python source syntax

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE PYTHON SOURCE SYNTAX"
          Write-Host "============================================================"
          Write-Host ""

          $Files = @(

              "collector.py",

              "validate_collector.py",

              "data_history_audit.py"
          )

          foreach ($File in $Files) {

              Write-Host "Checking $File..."

              py -m py_compile $File

              if ($LASTEXITCODE -ne 0) {

                  Write-Host ""
                  Write-Host "[FAIL] Python syntax validation failed:"
                  Write-Host "       $File"

                  exit $LASTEXITCODE
              }

              Write-Host "[PASS] $File"
              Write-Host ""
          }

          Write-Host "[PASS] All Python source syntax checks passed."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 8
      # Inspect existing local OHLCV
      # ======================================================

      - name: Inspect existing OHLCV data

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "EXISTING LOCAL OHLCV DATA"
          Write-Host "============================================================"
          Write-Host ""

          $TotalFiles = 0

          foreach ($Tf in @("h1", "h4", "d1")) {

              $Directory = Join-Path "data\ohlcv" $Tf

              if (Test-Path $Directory -PathType Container) {

                  $Files = @(

                      Get-ChildItem `
                          -Path $Directory `
                          -Filter "KRW-*.csv" `
                          -File `
                          -ErrorAction SilentlyContinue
                  )

                  $Count = $Files.Count

                  $TotalFiles += $Count

                  Write-Host "[$Tf]"
                  Write-Host "  Directory : $Directory"
                  Write-Host "  CSV files : $Count"
                  Write-Host ""

              }
              else {

                  Write-Host "[$Tf]"
                  Write-Host "  Directory : NOT FOUND"
                  Write-Host "  CSV files : 0"
                  Write-Host ""
              }
          }

          Write-Host "Total OHLCV CSV files:"
          Write-Host "  $TotalFiles"
          Write-Host ""

          if (Test-Path $env:COLLECTOR_STATUS -PathType Leaf) {

              $StatusInfo = Get-Item $env:COLLECTOR_STATUS

              Write-Host "Collector status:"
              Write-Host "  EXISTS"
              Write-Host "  Size: $($StatusInfo.Length) bytes"

          }
          else {

              Write-Host "Collector status:"
              Write-Host "  NOT CREATED YET"
          }

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 9
      # Inspect Collector checkpoint
      # ======================================================
      #
      # IMPORTANT:
      #
      # Do NOT delete the checkpoint here.
      #
      # RUNNING:
      #   Collector resumes the interrupted run.
      #
      # COMPLETED:
      #   Collector creates a new run.
      #
      # ======================================================

      - name: Inspect Collector Resume checkpoint

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "COLLECTOR RESUME CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          $CheckpointPath = $env:COLLECTOR_CHECKPOINT

          Write-Host "Checkpoint:"
          Write-Host "  $CheckpointPath"
          Write-Host ""

          if (-not (Test-Path $CheckpointPath -PathType Leaf)) {

              Write-Host "[INFO] No Collector checkpoint exists."
              Write-Host "[INFO] Collector will create a NEW run."
              Write-Host ""

              Write-Host "[PASS] Fresh Collector state."

              exit 0
          }

          $CheckpointInfo = Get-Item $CheckpointPath

          Write-Host "Checkpoint exists."
          Write-Host "Size:"
          Write-Host "  $($CheckpointInfo.Length) bytes"
          Write-Host ""

          if ($CheckpointInfo.Length -le 0) {

              Write-Host "[FAIL] Collector checkpoint exists but is empty."
              Write-Host "[SAFETY] The workflow will NOT delete it automatically."

              exit 1
          }

          try {

              $Checkpoint = Get-Content `
                  -Path $CheckpointPath `
                  -Raw |
                  ConvertFrom-Json

          }
          catch {

              Write-Host "[FAIL] Collector checkpoint JSON is invalid."
              Write-Host ""
              Write-Host "[SAFETY] Checkpoint was NOT deleted."
              Write-Host "[SAFETY] OHLCV data was NOT modified by this step."

              exit 1
          }

          $CompletedCount = 0
          $FailedCount = 0

          if ($null -ne $Checkpoint.completed_jobs) {

              $CompletedCount = @(

                  $Checkpoint.completed_jobs.PSObject.Properties

              ).Count
          }

          if ($null -ne $Checkpoint.failed_jobs) {

              $FailedCount = @(

                  $Checkpoint.failed_jobs.PSObject.Properties

              ).Count
          }

          Write-Host "Project:"
          Write-Host "  $($Checkpoint.project)"
          Write-Host ""

          Write-Host "Version:"
          Write-Host "  $($Checkpoint.version)"
          Write-Host ""

          Write-Host "Run ID:"
          Write-Host "  $($Checkpoint.run_id)"
          Write-Host ""

          Write-Host "Run status:"
          Write-Host "  $($Checkpoint.run_status)"
          Write-Host ""

          Write-Host "Markets:"
          Write-Host "  $($Checkpoint.market_count)"
          Write-Host ""

          Write-Host "Total jobs:"
          Write-Host "  $($Checkpoint.total_jobs)"
          Write-Host ""

          Write-Host "Completed jobs:"
          Write-Host "  $CompletedCount"
          Write-Host ""

          Write-Host "Failed jobs:"
          Write-Host "  $FailedCount"
          Write-Host ""

          Write-Host "Started UTC:"
          Write-Host "  $($Checkpoint.started_utc)"
          Write-Host ""

          Write-Host "Updated UTC:"
          Write-Host "  $($Checkpoint.updated_utc)"
          Write-Host ""

          if ($Checkpoint.run_status -eq "RUNNING") {

              Write-Host "[RESUME] Interrupted/current run detected."
              Write-Host "[RESUME] Collector Clean V003 will continue this run."
              Write-Host "[RESUME] Completed jobs will be skipped."

          }
          elseif ($Checkpoint.run_status -eq "COMPLETED") {

              Write-Host "[INFO] Previous Collector run completed."
              Write-Host "[INFO] Collector Clean V003 will create a NEW run."
              Write-Host "[INFO] All markets will be checked for newer candles."

          }
          else {

              Write-Host "[INFO] Previous checkpoint is not RUNNING."
              Write-Host "[INFO] Collector will decide the next safe run state."
          }

          Write-Host ""
          Write-Host "[PASS] Collector checkpoint inspection completed."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 10
      # Run Collector Clean V003
      # ======================================================

      - name: Run Collector Clean V003

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN UPBIT DATA COLLECTOR - CLEAN V003"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Mode:"
          Write-Host "  Dynamic KRW market discovery"
          Write-Host "  h1 / h4 / d1"
          Write-Host "  Incremental latest-candle collection"
          Write-Host "  Current-run Resume enabled"
          Write-Host ""

          Write-Host "Important:"
          Write-Host "  Existing OHLCV will be preserved."
          Write-Host "  Checkpoint will NOT be deleted."
          Write-Host ""

          $StartTime = Get-Date

          Write-Host "Started:"
          Write-Host "  $($StartTime.ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host ""

          py collector.py

          $CollectorExitCode = $LASTEXITCODE

          $EndTime = Get-Date

          $Elapsed = $EndTime - $StartTime

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "COLLECTOR EXECUTION RESULT"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          Write-Host "Started:"
          Write-Host "  $($StartTime.ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host ""

          Write-Host "Finished:"
          Write-Host "  $($EndTime.ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host ""

          Write-Host "Elapsed:"
          Write-Host ("  {0:hh\:mm\:ss}" -f $Elapsed)
          Write-Host ""

          Write-Host "Exit code:"
          Write-Host "  $CollectorExitCode"
          Write-Host ""

          if ($CollectorExitCode -ne 0) {

              Write-Host "[FAIL] Collector Clean V003 did not complete."
              Write-Host ""
              Write-Host "[IMPORTANT]"
              Write-Host "  Existing OHLCV remains preserved."
              Write-Host "  Successful jobs remain checkpointed."
              Write-Host "  Re-running this workflow can resume the active run."
              Write-Host ""
              Write-Host "[STOP] Validator and Audit will NOT run."

              exit $CollectorExitCode
          }

          Write-Host "[PASS] Collector Clean V003 completed successfully."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 11
      # Verify Collector checkpoint after successful run
      # ======================================================

      - name: Verify completed Collector checkpoint

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY COMPLETED COLLECTOR CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          $CheckpointPath = $env:COLLECTOR_CHECKPOINT

          if (-not (Test-Path $CheckpointPath -PathType Leaf)) {

              Write-Host "[FAIL] Collector checkpoint was not created."

              exit 1
          }

          try {

              $Checkpoint = Get-Content `
                  -Path $CheckpointPath `
                  -Raw |
                  ConvertFrom-Json

          }
          catch {

              Write-Host "[FAIL] Collector checkpoint JSON is invalid."

              exit 1
          }

          $CompletedCount = 0
          $FailedCount = 0

          if ($null -ne $Checkpoint.completed_jobs) {

              $CompletedCount = @(

                  $Checkpoint.completed_jobs.PSObject.Properties

              ).Count
          }

          if ($null -ne $Checkpoint.failed_jobs) {

              $FailedCount = @(

                  $Checkpoint.failed_jobs.PSObject.Properties

              ).Count
          }

          $MarketCount = [int]$Checkpoint.market_count

          $ExpectedJobs = $MarketCount * 3

          $RecordedJobs = [int]$Checkpoint.total_jobs

          Write-Host "Run ID:"
          Write-Host "  $($Checkpoint.run_id)"
          Write-Host ""

          Write-Host "Run status:"
          Write-Host "  $($Checkpoint.run_status)"
          Write-Host ""

          Write-Host "KRW markets:"
          Write-Host "  $MarketCount"
          Write-Host ""

          Write-Host "Timeframes:"
          Write-Host "  3"
          Write-Host ""

          Write-Host "Expected jobs:"
          Write-Host "  $ExpectedJobs"
          Write-Host ""

          Write-Host "Checkpoint total jobs:"
          Write-Host "  $RecordedJobs"
          Write-Host ""

          Write-Host "Completed jobs:"
          Write-Host "  $CompletedCount"
          Write-Host ""

          Write-Host "Failed jobs:"
          Write-Host "  $FailedCount"
          Write-Host ""

          if ($Checkpoint.project -ne "Upbit Surge Monitor") {

              Write-Host "[FAIL] Unexpected checkpoint project."

              exit 1
          }

          if ($Checkpoint.version -ne "Collector Clean V003") {

              Write-Host "[FAIL] Unexpected Collector checkpoint version."

              exit 1
          }

          if ($Checkpoint.run_status -ne "COMPLETED") {

              Write-Host "[FAIL] Collector checkpoint is not COMPLETED."

              exit 1
          }

          if ($MarketCount -le 0) {

              Write-Host "[FAIL] Invalid market count."

              exit 1
          }

          if ($RecordedJobs -ne $ExpectedJobs) {

              Write-Host "[FAIL] Checkpoint total_jobs mismatch."
              Write-Host "       Expected: $ExpectedJobs"
              Write-Host "       Actual  : $RecordedJobs"

              exit 1
          }

          if ($CompletedCount -ne $ExpectedJobs) {

              Write-Host "[FAIL] Collector completed job count mismatch."
              Write-Host "       Expected: $ExpectedJobs"
              Write-Host "       Actual  : $CompletedCount"

              exit 1
          }

          if ($FailedCount -ne 0) {

              Write-Host "[FAIL] Collector checkpoint contains failed jobs."

              exit 1
          }

          Write-Host "[PASS] Collector checkpoint is complete."
          Write-Host "[PASS] $CompletedCount / $ExpectedJobs jobs completed."
          Write-Host "[PASS] No failed jobs remain."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 12
      # Verify Collector output structure
      # ======================================================

      - name: Verify Collector output

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY COLLECTOR OUTPUT"
          Write-Host "============================================================"
          Write-Host ""

          $Failed = $false

          $Counts = @{}

          foreach ($Tf in @("h1", "h4", "d1")) {

              $Directory = Join-Path "data\ohlcv" $Tf

              if (-not (Test-Path $Directory -PathType Container)) {

                  Write-Host "[FAIL] Missing directory:"
                  Write-Host "       $Directory"
                  Write-Host ""

                  $Failed = $true

                  continue
              }

              $Files = @(

                  Get-ChildItem `
                      -Path $Directory `
                      -Filter "KRW-*.csv" `
                      -File `
                      -ErrorAction SilentlyContinue
              )

              $Count = $Files.Count

              $Counts[$Tf] = $Count

              Write-Host "[$Tf]"
              Write-Host "  CSV files : $Count"

              $EmptyFiles = @(

                  $Files |
                  Where-Object {
                      $_.Length -le 0
                  }
              )

              Write-Host "  Empty     : $($EmptyFiles.Count)"
              Write-Host ""

              if ($Count -eq 0) {

                  Write-Host "[FAIL] No CSV files found in $Directory"

                  $Failed = $true
              }

              if ($EmptyFiles.Count -gt 0) {

                  Write-Host "[FAIL] Empty CSV files found in $Directory"

                  $Failed = $true
              }
          }

          if (

              $Counts.ContainsKey("h1") -and
              $Counts.ContainsKey("h4") -and
              $Counts.ContainsKey("d1")

          ) {

              if (

                  $Counts["h1"] -ne $Counts["h4"] -or
                  $Counts["h1"] -ne $Counts["d1"]

              ) {

                  Write-Host "[FAIL] Cross-timeframe CSV counts differ."
                  Write-Host ""
                  Write-Host "  h1 : $($Counts['h1'])"
                  Write-Host "  h4 : $($Counts['h4'])"
                  Write-Host "  d1 : $($Counts['d1'])"
                  Write-Host ""

                  $Failed = $true
              }
          }

          if (-not (Test-Path $env:COLLECTOR_STATUS -PathType Leaf)) {

              Write-Host "[FAIL] Collector status file not found:"
              Write-Host "       $env:COLLECTOR_STATUS"
              Write-Host ""

              $Failed = $true

          }
          else {

              $StatusInfo = Get-Item $env:COLLECTOR_STATUS

              if ($StatusInfo.Length -le 0) {

                  Write-Host "[FAIL] Collector status file is empty."

                  $Failed = $true

              }
              else {

                  Write-Host "[PASS] Collector status file exists."
              }
          }

          Write-Host ""

          if ($Failed) {

              Write-Host "[FAIL] Collector output structural verification failed."

              exit 1
          }

          Write-Host "[PASS] Collector output structure verified."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 13
      # Run Collector Data Validator
      # ======================================================
      #
      # validate_collector.py is READ ONLY.
      #
      # It validates the accumulated OHLCV dataset.
      #
      # ======================================================

      - name: Run Collector Data Validator

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN COLLECTOR DATA VALIDATOR"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Validator mode : READ ONLY"
          Write-Host ""

          $StartTime = Get-Date

          Write-Host "Started:"
          Write-Host "  $($StartTime.ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host ""

          py validate_collector.py

          $ValidatorExitCode = $LASTEXITCODE

          $EndTime = Get-Date

          $Elapsed = $EndTime - $StartTime

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "VALIDATOR EXECUTION RESULT"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          Write-Host "Elapsed:"
          Write-Host ("  {0:hh\:mm\:ss}" -f $Elapsed)
          Write-Host ""

          Write-Host "Exit code:"
          Write-Host "  $ValidatorExitCode"
          Write-Host ""

          if ($ValidatorExitCode -ne 0) {

              Write-Host "[FAIL] Collector data validation failed."

              exit $ValidatorExitCode
          }

          Write-Host "[PASS] Collector data validation completed successfully."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 14
      # Run OHLCV Data History Audit
      # ======================================================
      #
      # data_history_audit.py is READ ONLY.
      #
      # ======================================================

      - name: Run OHLCV Data History Audit

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN OHLCV DATA HISTORY AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Audit mode : READ ONLY"
          Write-Host ""

          $StartTime = Get-Date

          Write-Host "Started:"
          Write-Host "  $($StartTime.ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host ""

          py data_history_audit.py

          $AuditExitCode = $LASTEXITCODE

          $EndTime = Get-Date

          $Elapsed = $EndTime - $StartTime

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "DATA HISTORY AUDIT EXECUTION RESULT"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          Write-Host "Elapsed:"
          Write-Host ("  {0:hh\:mm\:ss}" -f $Elapsed)
          Write-Host ""

          Write-Host "Exit code:"
          Write-Host "  $AuditExitCode"
          Write-Host ""

          if ($AuditExitCode -ne 0) {

              Write-Host "[FAIL] OHLCV data history audit failed."

              exit $AuditExitCode
          }

          Write-Host "[PASS] OHLCV data history audit completed successfully."

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 15
      # Final Collector state
      # ======================================================

      - name: Show final Collector state

        if: always()

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL COLLECTOR STATE"
          Write-Host "============================================================"
          Write-Host ""

          foreach ($Tf in @("h1", "h4", "d1")) {

              $Directory = Join-Path "data\ohlcv" $Tf

              if (Test-Path $Directory -PathType Container) {

                  $Files = @(

                      Get-ChildItem `
                          -Path $Directory `
                          -Filter "KRW-*.csv" `
                          -File `
                          -ErrorAction SilentlyContinue
                  )

                  Write-Host "[$Tf]"
                  Write-Host "  Directory : $Directory"
                  Write-Host "  CSV files : $($Files.Count)"
                  Write-Host ""

              }
              else {

                  Write-Host "[$Tf]"
                  Write-Host "  Directory : NOT FOUND"
                  Write-Host ""
              }
          }

          Write-Host "Collector checkpoint:"
          Write-Host ""

          if (Test-Path $env:COLLECTOR_CHECKPOINT -PathType Leaf) {

              try {

                  $Checkpoint = Get-Content `
                      -Path $env:COLLECTOR_CHECKPOINT `
                      -Raw |
                      ConvertFrom-Json

                  $CompletedCount = 0
                  $FailedCount = 0

                  if ($null -ne $Checkpoint.completed_jobs) {

                      $CompletedCount = @(

                          $Checkpoint.completed_jobs.PSObject.Properties

                      ).Count
                  }

                  if ($null -ne $Checkpoint.failed_jobs) {

                      $FailedCount = @(

                          $Checkpoint.failed_jobs.PSObject.Properties

                      ).Count
                  }

                  Write-Host "  Run ID         : $($Checkpoint.run_id)"
                  Write-Host "  Status         : $($Checkpoint.run_status)"
                  Write-Host "  Markets        : $($Checkpoint.market_count)"
                  Write-Host "  Total jobs     : $($Checkpoint.total_jobs)"
                  Write-Host "  Completed jobs : $CompletedCount"
                  Write-Host "  Failed jobs    : $FailedCount"

              }
              catch {

                  Write-Host "  [WARN] Checkpoint exists but could not be parsed."
              }

          }
          else {

              Write-Host "  NOT FOUND"
          }

          Write-Host ""
          Write-Host "Safety:"
          Write-Host "  OHLCV deletion : DISABLED"
          Write-Host "  Git reset      : DISABLED"
          Write-Host "  Git clean      : DISABLED"
          Write-Host "  Git commit     : DISABLED"
          Write-Host "  Git push       : DISABLED"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "COLLECTOR WORKFLOW CLEAN V003 FINISHED"
          Write-Host "============================================================"


      # ======================================================
      # STEP 16
      # Final success summary
      # ======================================================

      - name: Collector Clean V003 success summary

        if: success()

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          $Checkpoint = Get-Content `
              -Path $env:COLLECTOR_CHECKPOINT `
              -Raw |
              ConvertFrom-Json

          $CompletedCount = @(

              $Checkpoint.completed_jobs.PSObject.Properties

          ).Count

          $MarketCount = [int]$Checkpoint.market_count

          $ExpectedJobs = $MarketCount * 3

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FULL KRW COLLECTOR CLEAN V003 SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project          : Upbit Surge Monitor"
          Write-Host "Version          : Collector Clean V003"
          Write-Host "Execution mode   : FULL KRW MARKET"
          Write-Host ""

          Write-Host "Markets          : $MarketCount"
          Write-Host "Timeframes       : 3"
          Write-Host "Collector jobs   : $ExpectedJobs"
          Write-Host "Completed jobs   : $CompletedCount"
          Write-Host ""

          Write-Host "Collection:"
          Write-Host "  h1             : VERIFIED"
          Write-Host "  h4             : VERIFIED"
          Write-Host "  d1             : VERIFIED"
          Write-Host ""

          Write-Host "Resume:"
          Write-Host "  Checkpoint     : ENABLED"
          Write-Host "  Per-job save   : ENABLED"
          Write-Host "  Interrupted run: RESUMABLE"
          Write-Host "  Next normal run: NEW CANDLE CHECK"
          Write-Host ""

          Write-Host "Validation:"
          Write-Host "  Collector Validator : PASSED"
          Write-Host "  History Audit       : PASSED"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Existing OHLCV : PRESERVED"
          Write-Host "  Git reset      : DISABLED"
          Write-Host "  Git clean      : DISABLED"
          Write-Host "  Git commit     : DISABLED"
          Write-Host "  Git push       : DISABLED"
          Write-Host "  Feature build  : DISABLED"
          Write-Host "  256 Detector   : DISABLED"
          Write-Host "  Prediction     : DISABLED"
          Write-Host "  Trading        : DISABLED"
          Write-Host ""

          Write-Host "============================================================"
          Write-Host "[RESULT] FULL KRW COLLECTOR CLEAN V003 PASSED"
          Write-Host "[PASS] $MarketCount KRW markets processed."
          Write-Host "[PASS] $CompletedCount / $ExpectedJobs collector jobs completed."
          Write-Host "[PASS] Existing OHLCV data preserved."
          Write-Host "[PASS] Collector Resume checkpoint verified."
          Write-Host "[PASS] Collector Validator passed."
          Write-Host "[PASS] OHLCV Data History Audit passed."
          Write-Host "[NEXT] Full OHLCV freshness / gap validation."
          Write-Host "============================================================"
