
name: audit_pattern_256_candidate_sensitivity.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-candidate-sensitivity
  cancel-in-progress: false

jobs:
  candidate-sensitivity:
    name: candidate-sensitivity

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      SCRIPT_NAME: audit_pattern_256_candidate_sensitivity.py
      REPORT_FOLDER: data\reports\pattern_256_candidate_sensitivity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Verify audit script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Audit script missing: $script"
          }

          & py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Audit script syntax failed"
          }

          Write-Host "[PASS] Audit script verified"

      - name: Verify source reports
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_regime_statistical_stability"

          foreach ($name in @(
            "result.json",
            "manifest.json"
          )) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required input missing: $path"
            }

            Write-Host "[OK] $path"
          }

      - name: Execute sensitivity audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          $startUtc = [DateTime]::UtcNow

          & py -u $script `
            --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Sensitivity audit failed"
          }

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $resultPath = Join-Path `
            $folder `
            "result.json"

          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw "Audit result missing"
          }

          $file = Get-Item -LiteralPath $resultPath

          if (
            $file.LastWriteTimeUtc -lt `
            $startUtc.AddSeconds(-2)
          ) {
            throw "Stale audit result"
          }

          Write-Host "[PASS] Sensitivity audit executed"

      - name: Verify output integrity
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $resultPath = Join-Path $folder "result.json"
          $manifestPath = Join-Path $folder "manifest.json"

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Output missing: $name"
            }
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($r.version -ne "Clean V004") {
            throw "Unexpected version"
          }

          if ($r.execution -ne "PASS") {
            throw "Execution not PASS"
          }

          if ($r.source_version -ne "Clean V003") {
            throw "Unexpected source version"
          }

          if ($r.verified_strata_count -ne 24) {
            throw "Strata count mismatch"
          }

          if ($r.verified_signal_events -ne 41311) {
            throw "Signal count mismatch"
          }

          if ($r.scenario_count -ne 4) {
            throw "Scenario count mismatch"
          }

          if (@($r.scenarios).Count -ne 4) {
            throw "Scenario output mismatch"
          }

          if ($r.original_candidate -ne "d1|DOWN|LOW") {
            throw "Original candidate mismatch"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Research decision mismatch"
          }

          foreach ($field in @(
            "formal_significance_proven",
            "multiple_testing_adjusted",
            "independent_oos_proven",
            "point_in_time_regime_proven",
            "profitability_proven",
            "train_approved",
            "live_trading_approved"
          )) {
            if ($r.$field -ne $false) {
              throw "Unexpected approval: $field"
            }
          }

          foreach ($name in @(
            "result.json",
            "report.md"
          )) {
            $path = Join-Path $folder $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $m.sha256.$name

            if (
              [string]::IsNullOrWhiteSpace($expected)
            ) {
              throw "Missing SHA256: $name"
            }

            if (
              $actual -ne $expected.ToLowerInvariant()
            ) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[OK] SHA256 $name"
          }

          $sourcePath = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_regime_statistical_stability\result.json"

          $sourceHash = (
            Get-FileHash `
              -LiteralPath $sourcePath `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($r.source_result_sha256 -ne $sourceHash) {
            throw "Source result SHA256 mismatch"
          }

          if ($m.source_result_sha256 -ne $sourceHash) {
            throw "Manifest source SHA256 mismatch"
          }

          Write-Host "[PASS] Integrity verified"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $r = Get-Content `
            -LiteralPath (Join-Path $folder "result.json") `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 Candidate Sensitivity Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Source | $($r.source_version) |",
            "| Strata | $($r.verified_strata_count) |",
            "| Signals | $($r.verified_signal_events) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## Threshold sensitivity",
            "",
            "| Scenario | Passing groups | D1 DOWN LOW |",
            "|---|---:|---|"
          )

          foreach ($s in $r.scenarios) {
            $candidate = @(
              $s.groups | Where-Object {
                $_.timeframe -eq "d1" -and
                $_.regime -eq "DOWN" -and
                $_.volatility -eq "LOW"
              }
            )

            if ($candidate.Count -ne 1) {
              throw "Candidate group missing"
            }

            $lines += (
              "| $($s.name) " +
              "| $($s.passing_group_count) " +
              "| $($candidate[0].passed) |"
            )
          }

          $lines += @(
            "",
            "## Research limitations",
            "",
            "- Threshold sensitivity is descriptive",
            "- No new independent OOS data",
            "- No formal statistical significance proof",
            "- No multiple-testing correction proof",
            "- No point-in-time regime proof",
            "- No realized profitability proof",
            "- No training or live trading approval",
            "- Decision remains HOLD"
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            $env:REPORT_FOLDER

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $a = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $b = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($a -ne $b) {
              throw "Staging SHA256 mismatch: $name"
            }
          }

          "STAGED_REPORT_DIR=$destination" |
            Out-File `
              -LiteralPath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

          Write-Host "[PASS] Reports staged"

      - name: Upload audit reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-candidate-sensitivity
          path: ${{ env.STAGED_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Final gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($status in @(
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] Candidate sensitivity audit"
          Write-Host "Research decision: HOLD"
