
name: audit_pattern_256_event_source_inventory.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-event-source-inventory
  cancel-in-progress: false

jobs:
  event-source-inventory:
    name: event-source-inventory
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_source_inventory.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing script: $script"
          }

          foreach ($dir in @(
            "data\reports",
            "data\ohlcv\h1",
            "data\ohlcv\h4",
            "data\ohlcv\d1"
          )) {
            $path = Join-Path $env:DATA_ROOT $dir
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "Missing directory: $path"
            }
          }

          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          py -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig')); print('Syntax PASS')" $script
          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax failed"
          }

          Write-Host "[PASS] Environment"

      - name: Execute inventory
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_source_inventory.py"

          & py -u $script --root $env:DATA_ROOT --max-files 3000

          if ($LASTEXITCODE -ne 0) {
            throw "Inventory execution failed"
          }

      - name: Verify output and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Inventory execution failed"
          }

          $folder = Join-Path $env:DATA_ROOT `
            "data\reports\pattern_256_event_source_inventory"

          $result = Get-Content `
            -LiteralPath (Join-Path $folder "inventory_result.json") `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath (Join-Path $folder "inventory_manifest.json") `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS" -or
              $manifest.execution -ne "PASS" -or
              $result.version -ne "Clean V001" -or
              $manifest.version -ne "Clean V001") {
            throw "Execution/version mismatch"
          }

          if ($result.research_decision -ne "HOLD" -or
              $result.event_level_attribution_proven -ne $false -or
              $result.independent_oos_proven -ne $false -or
              $result.train_approved -ne $false -or
              $result.live_trading_approved -ne $false) {
            throw "Research safety gate failed"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_source_inventory.py"

          $scriptHash = (
            Get-FileHash -LiteralPath $script -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($scriptHash -ne ([string]$manifest.script_sha256).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          foreach ($name in @(
            "inventory_files.csv",
            "inventory_result.json"
          )) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }

            $expected = [string]$manifest.output_sha256.$name
            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($expected.Length -ne 64 -or
                $actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }
          }

          $rows = @(
            Import-Csv -LiteralPath (
              Join-Path $folder "inventory_files.csv"
            )
          )

          if ($rows.Count -ne $result.report_csv_files) {
            throw "CSV inventory count mismatch"
          }

          if (($result.readable_csv_files +
               $result.unreadable_csv_files) -ne
               $result.report_csv_files) {
            throw "Inventory accounting mismatch"
          }

          Write-Host "[PASS] SHA256 and result verification"

      - name: Publish summary
        if: always()
        run: |
          if ("${{ steps.verify.outcome }}" -ne "success") {
            @"
          ## Pattern 256 Event Source Inventory - FAILED

          | Check | Result |
          |---|---|
          | Execution | ${{ steps.audit.outcome }} |
          | Verification | ${{ steps.verify.outcome }} |
          | Research decision | HOLD |
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $folder = Join-Path $env:DATA_ROOT `
            "data\reports\pattern_256_event_source_inventory"

          $result = Get-Content `
            -LiteralPath (Join-Path $folder "inventory_result.json") `
            -Raw | ConvertFrom-Json

          @"
          ## Pattern 256 Event Source Inventory

          | Check | Result |
          |---|---|
          | Version | $($result.version) |
          | Execution | $($result.execution) |
          | CSV files | $($result.report_csv_files) |
          | Readable | $($result.readable_csv_files) |
          | Unreadable | $($result.unreadable_csv_files) |
          | Candidate files | $($result.candidate_files) |
          | Research decision | HOLD |

          ### Candidate source files

          | Path | Score | Columns |
          |---|---:|---|
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          foreach ($item in $result.top_candidates) {
            $cols = ($item.columns -join ", ")
            "| $($item.path) | $($item.score) | $cols |" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          @"

          This is a read-only schema inventory.
          Event-level gap attribution is not yet proven.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload reports
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-event-source-inventory-v001
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_source_inventory\inventory_files.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_source_inventory\inventory_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_event_source_inventory\inventory_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Inventory execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Inventory verification failed"
          }

          Write-Host "[PASS] Clean V001"
          Write-Host "Research decision: HOLD"
