
name: evaluate_pattern_256_independent_events.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-independent-events
  cancel-in-progress: false

jobs:
  independent-events:
    name: independent-events

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:
      EXPECTED_VERSION: Clean V002
      EXPECTED_SOURCE_ROWS: "7949826"
      EXPECTED_SOURCE_SHA256: ed4b4e44fcb387ab70eaac465b3eaa87036466298fde344195e25d06ad7996e0
      LOCAL_PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SOURCE_RELATIVE: data/reports/pattern_256_accumulation_candidate_independent_backtest/backtest_trades.csv
      SCRIPT_NAME: evaluate_pattern_256_independent_events.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python is not available."
          }

      - name: Verify source CSV
        run: |
          $ErrorActionPreference = "Stop"

          $relative = $env:SOURCE_RELATIVE.Replace("/", "\")

          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE $relative),
            (Join-Path $env:LOCAL_PROJECT_ROOT $relative)
          )

          $source = $null

          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $source = (Resolve-Path -LiteralPath $candidate).Path
              break
            }
          }

          if (-not $source) {
            throw "Source CSV not found."
          }

          $hash = (
            Get-FileHash -LiteralPath $source -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($hash -ne $env:EXPECTED_SOURCE_SHA256) {
            throw "Source CSV SHA256 mismatch."
          }

          Write-Host "[PASS] Source CSV SHA256 verified"

          "EVALUATION_SOURCE=$source" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify evaluation Python script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "REQUIRED PYTHON FILE IS MISSING"
            Write-Host "=========================================="
            Write-Host ""
            Write-Host "Repository:"
            Write-Host "RED-A128/upbit-surge-monitor"
            Write-Host ""
            Write-Host "Create this file in repository root:"
            Write-Host $env:SCRIPT_NAME
            Write-Host ""
            Write-Host "Do not create it inside .github/workflows."
            Write-Host ""
            Write-Host "After committing the Python file,"
            Write-Host "run this workflow again."
            Write-Host ""

            throw "Required Python script is not committed."
          }

          Write-Host "[PASS] Evaluation Python script found"

      - name: Prepare evaluation workspace
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path `
            $env:RUNNER_TEMP `
            "pattern_256_independent_events_$env:GITHUB_RUN_ID"

          if (Test-Path -LiteralPath $root) {
            throw "Evaluation workspace already exists."
          }

          New-Item -ItemType Directory -Path $root -Force |
            Out-Null

          $relative = $env:SOURCE_RELATIVE.Replace("/", "\")

          $destination = Join-Path $root $relative

          New-Item `
            -ItemType Directory `
            -Path (Split-Path -Parent $destination) `
            -Force |
            Out-Null

          Copy-Item `
            -LiteralPath $env:EVALUATION_SOURCE `
            -Destination $destination

          $hash = (
            Get-FileHash -LiteralPath $destination -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($hash -ne $env:EXPECTED_SOURCE_SHA256) {
            throw "Copied source SHA256 mismatch."
          }

          $scriptSource = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          $scriptDestination = Join-Path `
            $root `
            $env:SCRIPT_NAME

          Copy-Item `
            -LiteralPath $scriptSource `
            -Destination $scriptDestination

          "EVALUATION_ROOT=$root" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "EVALUATION_SCRIPT=$scriptDestination" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "[PASS] Workspace prepared"

      - name: Run independent event evaluation
        run: |
          $ErrorActionPreference = "Stop"

          py -u $env:EVALUATION_SCRIPT --root $env:EVALUATION_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Independent event evaluation failed."
          }

      - name: Verify evaluation results
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVALUATION_ROOT"])

          output = root / (
              "data/reports/pattern_256_independent_events"
          )

          result_path = output / "independent_events_result.json"
          manifest_path = output / "independent_events_manifest.json"

          expected_files = {
              "independent_events_comparison.csv",
              "independent_events_by_market.csv",
              "independent_events_by_year.csv",
              "independent_events_result.json",
          }

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(4 * 1024 * 1024),
                      b"",
                  ):
                      digest.update(chunk)

              return digest.hexdigest()

          if not result_path.is_file():
              raise SystemExit("Missing result JSON")

          if not manifest_path.is_file():
              raise SystemExit("Missing manifest JSON")

          result = json.loads(
              result_path.read_text(encoding="utf-8")
          )

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          if result.get("version") != "Clean V002":
              raise SystemExit("Version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Evaluation did not PASS")

          if result.get("source_rows") != 7949826:
              raise SystemExit("Source row count mismatch")

          if result.get("comparison_rows") != 18:
              raise SystemExit("Comparison row count mismatch")

          if result.get("approved_for_live_trading") is not False:
              raise SystemExit("Trading safety check failed")

          hashes = manifest.get("output_sha256")

          if not isinstance(hashes, dict):
              raise SystemExit("Invalid output hash manifest")

          if set(hashes) != expected_files:
              raise SystemExit("Unexpected output files")

          for filename in sorted(expected_files):
              path = output / filename

              if not path.is_file():
                  raise SystemExit("Missing output: " + filename)

              if sha256_file(path) != hashes[filename]:
                  raise SystemExit("SHA256 mismatch: " + filename)

          comparison_path = (
              output / "independent_events_comparison.csv"
          )

          with comparison_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              rows = list(csv.DictReader(handle))

          if len(rows) != 18:
              raise SystemExit("Invalid comparison CSV row count")

          print("[PASS] Clean V002")
          print("[PASS] 7,949,826 source rows")
          print("[PASS] 18 comparison rows")
          print("[PASS] Output SHA256 integrity")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Result verification failed."
          }

      - name: Upload evaluation results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-independent-events
          path: |
            ${{ env.EVALUATION_ROOT }}/data/reports/pattern_256_independent_events/independent_events_comparison.csv
            ${{ env.EVALUATION_ROOT }}/data/reports/pattern_256_independent_events/independent_events_by_market.csv
            ${{ env.EVALUATION_ROOT }}/data/reports/pattern_256_independent_events/independent_events_by_year.csv
            ${{ env.EVALUATION_ROOT }}/data/reports/pattern_256_independent_events/independent_events_result.json
            ${{ env.EVALUATION_ROOT }}/data/reports/pattern_256_independent_events/independent_events_manifest.json
          if-no-files-found: error
          retention-days: 14
