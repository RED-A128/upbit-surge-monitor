
name: evaluate_pattern_256_independent_events.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-independent-events
  cancel-in-progress: false

jobs:
  independent-events:
    name: independent-events
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: |
          py --version

      - name: Validate source data
        run: |
          $source = "data/reports/pattern_256_accumulation_candidate_independent_backtest/backtest_trades.csv"

          if (-not (Test-Path $source)) {
            throw "Source CSV not found: $source"
          }

          $file = Get-Item $source

          Write-Host "Source: $($file.FullName)"
          Write-Host "Bytes: $($file.Length)"

          $hash = Get-FileHash $source -Algorithm SHA256

          Write-Host "SHA256: $($hash.Hash)"

      - name: Run independent event evaluation
        run: |
          py -u evaluate_pattern_256_independent_events.py --root .

          if ($LASTEXITCODE -ne 0) {
            throw "Independent event evaluation failed."
          }

      - name: Verify output integrity
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path

          folder = Path(
              "data/reports/pattern_256_independent_events"
          )

          result_path = (
              folder / "independent_events_result.json"
          )

          manifest_path = (
              folder / "independent_events_manifest.json"
          )

          if not result_path.is_file():
              raise SystemExit("Missing result JSON")

          if not manifest_path.is_file():
              raise SystemExit("Missing manifest JSON")

          result = json.loads(
              result_path.read_text(encoding="utf-8")
          )

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          if result.get("version") != "Clean V002":
              raise SystemExit("Version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Evaluation did not PASS")

          if result.get("comparison_rows") != 18:
              raise SystemExit("Unexpected comparison count")

          if result.get("approved_for_live_trading") is not False:
              raise SystemExit("Trading approval safety failure")

          if (
              result.get("source_sha256")
              != manifest.get("source_sha256")
          ):
              raise SystemExit("Source hash mismatch")

          for filename, expected in (
              manifest["output_sha256"].items()
          ):
              path = folder / filename

              if not path.is_file():
                  raise SystemExit(
                      "Missing output: " + filename
                  )

              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(4 * 1024 * 1024),
                      b"",
                  ):
                      digest.update(chunk)

              if digest.hexdigest() != expected:
                  raise SystemExit(
                      "SHA256 mismatch: " + filename
                  )

          print("[PASS] Result and SHA256 verified")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Output integrity verification failed."
          }

      - name: Upload evaluation results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-independent-events
          path: |
            data/reports/pattern_256_independent_events/independent_events_comparison.csv
            data/reports/pattern_256_independent_events/independent_events_by_market.csv
            data/reports/pattern_256_independent_events/independent_events_by_year.csv
            data/reports/pattern_256_independent_events/independent_events_result.json
            data/reports/pattern_256_independent_events/independent_events_manifest.json
          if-no-files-found: error
          retention-days: 14
