
name: evaluate_pattern_256_independent_events.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-events:
    name: independent-events

    runs-on:
      - self-hosted
      - Windows

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Check source CSV
        run: |
          $source = "C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent_backtest\backtest_trades.csv"

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Source CSV not found"
          }

          Write-Host "[PASS] Source CSV found"

      - name: Check evaluation script
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "evaluate_pattern_256_independent_events.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Evaluation Python script not found in repository root"
          }

          Write-Host "[PASS] Evaluation script found"
