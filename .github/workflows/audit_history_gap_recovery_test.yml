# ============================================================
# Upbit Surge Monitor
# audit_history_gap_recovery_test.yml
# Clean V003
# ============================================================
#
# PURPOSE
#
#   Test:
#       audit_history_gap_recovery.py - Clean V001
#
#   against the REAL persistent local project data stored at:
#
#       C:\Users\USER\Documents\upbit-surge-monitor\data
#
#
# IMPORTANT
#
#   The self-hosted GitHub Actions checkout directory is NOT
#   the persistent OHLCV storage directory.
#
#   Runner checkout example:
#
#       C:\Users\USER\actions-runner\_work\
#           upbit-surge-monitor\
#           upbit-surge-monitor
#
#   Persistent project data:
#
#       C:\Users\USER\Documents\
#           upbit-surge-monitor\
#           data
#
#
# SAFETY
#
#   - NO OHLCV deletion
#   - NO OHLCV replacement
#   - NO API repair
#   - NO historical recovery execution
#   - NO feature build
#   - NO detector execution
#   - NO prediction
#   - NO trading
#   - NO git reset
#   - NO git clean
#   - NO git commit
#   - NO git push
#
#
# DATA ACCESS STRATEGY
#
#   audit_history_gap_recovery.py may use repository-relative
#   paths such as:
#
#       data/ohlcv/h1
#
#   Therefore this workflow creates a temporary directory
#   junction:
#
#       <runner checkout>\data
#
#                 ->
#
#       C:\Users\USER\Documents\
#       upbit-surge-monitor\data
#
#   The junction is removed after the test.
#
#   Removing the junction does NOT delete the target data.
#
#
# EXPECTED INVENTORY
#
#   Markets    : 290
#   Timeframes : 3
#   OHLCV files: 870
#
# ============================================================


name: audit_history_gap_recovery_test.yml


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: audit_history_gap_recovery_test
  cancel-in-progress: false


defaults:
  run:
    shell: powershell


jobs:

  audit_history_gap_recovery_test:

    name: audit_history_gap_recovery_test.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60


    env:

      # --------------------------------------------------------
      # Persistent local project data
      # --------------------------------------------------------

      LOCAL_PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor

      LOCAL_DATA_ROOT: C:\Users\USER\Documents\upbit-surge-monitor\data


      # --------------------------------------------------------
      # Expected inventory
      # --------------------------------------------------------

      EXPECTED_MARKETS: "290"

      EXPECTED_TIMEFRAMES: "3"

      EXPECTED_OHLCV_FILES: "870"


      # --------------------------------------------------------
      # Audit script
      # --------------------------------------------------------

      AUDIT_SCRIPT: audit_history_gap_recovery.py


      # --------------------------------------------------------
      # Persistent runtime outputs
      # --------------------------------------------------------

      AUDIT_REPORT_DIR: C:\Users\USER\Documents\upbit-surge-monitor\data\reports\history_gap_recovery_audit

      RETRY_CANDIDATE_FILE: C:\Users\USER\Documents\upbit-surge-monitor\data\recovery\history_gap_recovery_retry_candidates.csv

      CHECKPOINT_FILE: C:\Users\USER\Documents\upbit-surge-monitor\data\validation\audit_history_gap_recovery_checkpoint.json


      # --------------------------------------------------------
      # SHA256 records
      # --------------------------------------------------------

      BEFORE_SHA256_FILE: C:\Users\USER\Documents\upbit-surge-monitor\data\validation\audit_history_gap_recovery_ohlcv_before.sha256

      AFTER_SHA256_FILE: C:\Users\USER\Documents\upbit-surge-monitor\data\validation\audit_history_gap_recovery_ohlcv_after.sha256



    steps:

      # ========================================================
      # 01. Checkout source
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 02. Show environment
      # ========================================================

      - name: Show environment
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "AUDIT HISTORY GAP RECOVERY TEST"
          Write-Host "Clean V003"
          Write-Host "============================================================"

          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""

          Write-Host "Persistent project:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT"

          Write-Host ""

          Write-Host "Persistent data:"
          Write-Host "  $env:LOCAL_DATA_ROOT"

          Write-Host ""

          Write-Host "Expected markets:"
          Write-Host "  $env:EXPECTED_MARKETS"

          Write-Host ""

          Write-Host "Expected OHLCV files:"
          Write-Host "  $env:EXPECTED_OHLCV_FILES"

          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""

          Write-Host "OS:"
          Write-Host "  $env:RUNNER_OS"

          Write-Host ""

          Write-Host "============================================================"


      # ========================================================
      # 03. Show Python version
      # ========================================================

      - name: Show Python version
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PYTHON VERSION"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is not available."
          }


      # ========================================================
      # 04. Verify audit script exists
      # ========================================================

      - name: Verify audit script exists
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT SCRIPT"
          Write-Host "============================================================"

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE $env:AUDIT_SCRIPT

          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw "Missing audit script: $scriptPath"
          }

          Write-Host "[PASS] Audit script exists:"
          Write-Host "       $scriptPath"


      # ========================================================
      # 05. Verify persistent data root
      # ========================================================

      - name: Verify persistent local data root
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PERSISTENT LOCAL DATA ROOT"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:LOCAL_DATA_ROOT -PathType Container)) {
              throw "Persistent local data root does not exist: $env:LOCAL_DATA_ROOT"
          }

          Write-Host "[PASS] Persistent data root exists:"
          Write-Host "       $env:LOCAL_DATA_ROOT"


      # ========================================================
      # 06. Verify OHLCV directories
      # ========================================================

      - name: Verify persistent OHLCV directories
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PERSISTENT OHLCV DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              (Join-Path $env:LOCAL_DATA_ROOT "ohlcv\h1"),
              (Join-Path $env:LOCAL_DATA_ROOT "ohlcv\h4"),
              (Join-Path $env:LOCAL_DATA_ROOT "ohlcv\d1")
          )

          foreach ($dir in $directories) {

              Write-Host "Checking:"
              Write-Host "  $dir"

              if (-not (Test-Path -LiteralPath $dir -PathType Container)) {
                  throw "Missing OHLCV directory: $dir"
              }

              Write-Host "[PASS]"
          }


      # ========================================================
      # 07. Verify full 290 market OHLCV set
      # ========================================================

      - name: Verify full 290 market OHLCV set
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY FULL OHLCV INVENTORY"
          Write-Host "============================================================"

          $expectedMarkets = [int]$env:EXPECTED_MARKETS
          $expectedTotal   = [int]$env:EXPECTED_OHLCV_FILES

          $h1Dir = Join-Path $env:LOCAL_DATA_ROOT "ohlcv\h1"
          $h4Dir = Join-Path $env:LOCAL_DATA_ROOT "ohlcv\h4"
          $d1Dir = Join-Path $env:LOCAL_DATA_ROOT "ohlcv\d1"

          $h1Files = @(
              Get-ChildItem `
                  -LiteralPath $h1Dir `
                  -File `
                  -Filter "*.csv"
          )

          $h4Files = @(
              Get-ChildItem `
                  -LiteralPath $h4Dir `
                  -File `
                  -Filter "*.csv"
          )

          $d1Files = @(
              Get-ChildItem `
                  -LiteralPath $d1Dir `
                  -File `
                  -Filter "*.csv"
          )

          $h1Count = $h1Files.Count
          $h4Count = $h4Files.Count
          $d1Count = $d1Files.Count

          $total = $h1Count + $h4Count + $d1Count

          Write-Host "H1 files : $h1Count"
          Write-Host "H4 files : $h4Count"
          Write-Host "D1 files : $d1Count"
          Write-Host "Total    : $total"

          if ($h1Count -ne $expectedMarkets) {
              throw "H1 market count mismatch. expected=$expectedMarkets found=$h1Count"
          }

          if ($h4Count -ne $expectedMarkets) {
              throw "H4 market count mismatch. expected=$expectedMarkets found=$h4Count"
          }

          if ($d1Count -ne $expectedMarkets) {
              throw "D1 market count mismatch. expected=$expectedMarkets found=$d1Count"
          }

          if ($total -ne $expectedTotal) {
              throw "Total OHLCV count mismatch. expected=$expectedTotal found=$total"
          }

          # ----------------------------------------------------
          # Verify market filename sets are identical.
          # ----------------------------------------------------

          $h1Names = @(
              $h1Files |
              ForEach-Object { $_.Name.ToLowerInvariant() } |
              Sort-Object
          )

          $h4Names = @(
              $h4Files |
              ForEach-Object { $_.Name.ToLowerInvariant() } |
              Sort-Object
          )

          $d1Names = @(
              $d1Files |
              ForEach-Object { $_.Name.ToLowerInvariant() } |
              Sort-Object
          )

          $h1h4Diff = @(
              Compare-Object `
                  -ReferenceObject $h1Names `
                  -DifferenceObject $h4Names
          )

          if ($h1h4Diff.Count -ne 0) {

              Write-Host ""
              Write-Host "H1/H4 market mismatch:"

              $h1h4Diff | Format-Table | Out-String | Write-Host

              throw "H1/H4 market filename sets are different."
          }

          $h1d1Diff = @(
              Compare-Object `
                  -ReferenceObject $h1Names `
                  -DifferenceObject $d1Names
          )

          if ($h1d1Diff.Count -ne 0) {

              Write-Host ""
              Write-Host "H1/D1 market mismatch:"

              $h1d1Diff | Format-Table | Out-String | Write-Host

              throw "H1/D1 market filename sets are different."
          }

          Write-Host ""
          Write-Host "[PASS] 290 x 3 = 870 OHLCV inventory verified."


      # ========================================================
      # 08. Prepare runtime directories
      # ========================================================

      - name: Prepare persistent runtime directories
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PREPARE PERSISTENT RUNTIME DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              (Join-Path $env:LOCAL_DATA_ROOT "reports"),
              (Join-Path $env:LOCAL_DATA_ROOT "reports\history_gap_recovery_audit"),
              (Join-Path $env:LOCAL_DATA_ROOT "recovery"),
              (Join-Path $env:LOCAL_DATA_ROOT "validation")
          )

          foreach ($dir in $directories) {

              if (-not (Test-Path -LiteralPath $dir)) {

                  New-Item `
                      -ItemType Directory `
                      -Path $dir `
                      -Force |
                      Out-Null
              }

              Write-Host "[READY] $dir"
          }


      # ========================================================
      # 09. Prepare repository data junction
      # ========================================================

      - name: Prepare repository data junction
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PREPARE REPOSITORY DATA JUNCTION"
          Write-Host "============================================================"

          $repoData = Join-Path $env:GITHUB_WORKSPACE "data"
          $target   = $env:LOCAL_DATA_ROOT

          Write-Host "Repository data path:"
          Write-Host "  $repoData"

          Write-Host ""

          Write-Host "Persistent target:"
          Write-Host "  $target"

          # ----------------------------------------------------
          # Safety:
          #
          # If repository data already exists as a REAL
          # directory, do NOT delete it automatically.
          #
          # ----------------------------------------------------

          if (Test-Path -LiteralPath $repoData) {

              $item = Get-Item `
                  -LiteralPath $repoData `
                  -Force

              $isReparsePoint = (
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
              )

              if ($isReparsePoint) {

                  Write-Host ""
                  Write-Host "[INFO] Existing repository data reparse point detected."

                  cmd /c rmdir "$repoData"

                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to remove existing repository data junction."
                  }

              }
              else {

                  throw "Repository data path already exists as a real directory: $repoData. For safety this workflow will NOT delete or replace a real directory automatically."
              }
          }

          Write-Host ""
          Write-Host "Creating junction..."

          cmd /c mklink /J "$repoData" "$target"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create repository data junction."
          }

          if (-not (Test-Path -LiteralPath $repoData -PathType Container)) {
              throw "Repository data junction was not created."
          }

          Write-Host ""
          Write-Host "[PASS] Repository data junction created."


      # ========================================================
      # 10. Verify junction OHLCV inventory
      # ========================================================

      - name: Verify junction OHLCV inventory
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY JUNCTION OHLCV INVENTORY"
          Write-Host "============================================================"

          $repoData = Join-Path $env:GITHUB_WORKSPACE "data"

          $h1Dir = Join-Path $repoData "ohlcv\h1"
          $h4Dir = Join-Path $repoData "ohlcv\h4"
          $d1Dir = Join-Path $repoData "ohlcv\d1"

          foreach ($dir in @($h1Dir, $h4Dir, $d1Dir)) {

              if (-not (Test-Path -LiteralPath $dir -PathType Container)) {
                  throw "Junction target directory unavailable: $dir"
              }
          }

          $h1Count = @(
              Get-ChildItem `
                  -LiteralPath $h1Dir `
                  -File `
                  -Filter "*.csv"
          ).Count

          $h4Count = @(
              Get-ChildItem `
                  -LiteralPath $h4Dir `
                  -File `
                  -Filter "*.csv"
          ).Count

          $d1Count = @(
              Get-ChildItem `
                  -LiteralPath $d1Dir `
                  -File `
                  -Filter "*.csv"
          ).Count

          $total = $h1Count + $h4Count + $d1Count

          Write-Host "H1 files : $h1Count"
          Write-Host "H4 files : $h4Count"
          Write-Host "D1 files : $d1Count"
          Write-Host "Total    : $total"

          if ($total -ne [int]$env:EXPECTED_OHLCV_FILES) {
              throw "Junction OHLCV inventory mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$total"
          }

          Write-Host ""
          Write-Host "[PASS] Junction exposes full OHLCV inventory."


      # ========================================================
      # 11. Record BEFORE SHA256
      # ========================================================

      - name: Record OHLCV SHA256 before audit
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE AUDIT"
          Write-Host "============================================================"

          $ohlcvRoot = Join-Path $env:LOCAL_DATA_ROOT "ohlcv"

          $outputFile = $env:BEFORE_SHA256_FILE

          $outputDir = Split-Path `
              -Parent `
              $outputFile

          if (-not (Test-Path -LiteralPath $outputDir)) {

              New-Item `
                  -ItemType Directory `
                  -Path $outputDir `
                  -Force |
                  Out-Null
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $ohlcvRoot `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          if ($files.Count -ne [int]$env:EXPECTED_OHLCV_FILES) {
              throw "BEFORE SHA256 source count mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$($files.Count)"
          }

          $records = foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $ohlcvRoot.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -LiteralPath $file.FullName `
                      -Algorithm SHA256
              ).Hash.ToLowerInvariant()

              "$hash`t$relative"
          }

          $records |
              Set-Content `
                  -LiteralPath $outputFile `
                  -Encoding UTF8

          $recordCount = @(
              Get-Content `
                  -LiteralPath $outputFile |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          ).Count

          if ($recordCount -ne [int]$env:EXPECTED_OHLCV_FILES) {
              throw "BEFORE SHA256 record count mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$recordCount"
          }

          Write-Host "SHA256 records : $recordCount"

          Write-Host ""
          Write-Host "[PASS] BEFORE SHA256 recorded:"
          Write-Host "       $outputFile"


      # ========================================================
      # 12. Run audit
      # ========================================================

      - name: Run audit_history_gap_recovery.py
        working-directory: ${{ github.workspace }}
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RUN AUDIT HISTORY GAP RECOVERY"
          Write-Host "============================================================"

          Write-Host "Script:"
          Write-Host "  $env:AUDIT_SCRIPT"

          Write-Host ""

          Write-Host "Mode:"
          Write-Host "  READ ONLY AUDIT"

          Write-Host ""

          py $env:AUDIT_SCRIPT

          if ($LASTEXITCODE -ne 0) {

              throw "audit_history_gap_recovery.py failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "[PASS] audit_history_gap_recovery.py completed."


      # ========================================================
      # 13. Verify audit report directory
      # ========================================================

      - name: Verify audit report directory
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT REPORT DIRECTORY"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:AUDIT_REPORT_DIR -PathType Container)) {
              throw "Audit report directory was not created: $env:AUDIT_REPORT_DIR"
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:AUDIT_REPORT_DIR `
                  -File
          )

          if ($files.Count -eq 0) {
              throw "Audit report directory is empty: $env:AUDIT_REPORT_DIR"
          }

          Write-Host "Generated report files:"

          foreach ($file in $files) {

              Write-Host "  $($file.Name)"
          }

          Write-Host ""
          Write-Host "[PASS] Audit report directory verified."


      # ========================================================
      # 14. Verify expected audit outputs
      # ========================================================

      - name: Verify expected audit outputs
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY EXPECTED AUDIT OUTPUTS"
          Write-Host "============================================================"

          $summary = Join-Path `
              $env:AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_summary.csv"

          $detail = Join-Path `
              $env:AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_detail.csv"

          $result = Join-Path `
              $env:AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_result.json"

          $required = @(
              $summary,
              $detail,
              $result
          )

          foreach ($file in $required) {

              Write-Host "Checking:"
              Write-Host "  $file"

              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Missing required audit output: $file"
              }

              $item = Get-Item `
                  -LiteralPath $file

              if ($item.Length -le 0) {
                  throw "Audit output is empty: $file"
              }

              Write-Host "[PASS]"
          }


      # ========================================================
      # 15. Verify audit result JSON
      # ========================================================

      - name: Verify audit result JSON
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT RESULT JSON"
          Write-Host "============================================================"

          $resultFile = Join-Path `
              $env:AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_result.json"

          try {

              $result = Get-Content `
                  -LiteralPath $resultFile `
                  -Raw |
                  ConvertFrom-Json

          }
          catch {

              throw "Unable to parse audit result JSON: $($_.Exception.Message)"
          }

          Write-Host "Program : $($result.program)"
          Write-Host "Version : $($result.version)"

          if (
              [string]::IsNullOrWhiteSpace(
                  [string]$result.program
              )
          ) {
              throw "Audit result JSON does not contain program."
          }

          if (
              [string]::IsNullOrWhiteSpace(
                  [string]$result.version
              )
          ) {
              throw "Audit result JSON does not contain version."
          }

          Write-Host ""
          Write-Host "[PASS] Audit result JSON is readable."


      # ========================================================
      # 16. Verify retry candidate output
      # ========================================================

      - name: Verify retry candidate output
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY RETRY CANDIDATE OUTPUT"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:RETRY_CANDIDATE_FILE -PathType Leaf)) {

              throw "Retry candidate file was not created: $env:RETRY_CANDIDATE_FILE"
          }

          $item = Get-Item `
              -LiteralPath $env:RETRY_CANDIDATE_FILE

          Write-Host "File:"
          Write-Host "  $env:RETRY_CANDIDATE_FILE"

          Write-Host ""

          Write-Host "Size:"
          Write-Host "  $($item.Length) bytes"

          Write-Host ""

          Write-Host "[PASS] Retry candidate output exists."


      # ========================================================
      # 17. Verify persistent checkpoint
      # ========================================================

      - name: Verify persistent audit checkpoint
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PERSISTENT AUDIT CHECKPOINT"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:CHECKPOINT_FILE -PathType Leaf)) {

              throw "Audit checkpoint was not created: $env:CHECKPOINT_FILE"
          }

          try {

              $checkpoint = Get-Content `
                  -LiteralPath $env:CHECKPOINT_FILE `
                  -Raw |
                  ConvertFrom-Json

          }
          catch {

              throw "Unable to parse audit checkpoint JSON: $($_.Exception.Message)"
          }

          Write-Host "Checkpoint:"
          Write-Host "  $env:CHECKPOINT_FILE"

          Write-Host ""

          Write-Host "[PASS] Persistent audit checkpoint is readable."


      # ========================================================
      # 18. Re-run audit
      # ========================================================
      #
      # Resume / checkpoint behavior validation.
      #
      # The second run must complete safely.
      #
      # ========================================================

      - name: Verify resume and re-run behavior
        working-directory: ${{ github.workspace }}
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY RESUME / RE-RUN BEHAVIOR"
          Write-Host "============================================================"

          py $env:AUDIT_SCRIPT

          if ($LASTEXITCODE -ne 0) {

              throw "Audit re-run failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "[PASS] Audit re-run completed safely."


      # ========================================================
      # 19. Record AFTER SHA256
      # ========================================================

      - name: Record OHLCV SHA256 after audit
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 AFTER AUDIT"
          Write-Host "============================================================"

          $ohlcvRoot = Join-Path $env:LOCAL_DATA_ROOT "ohlcv"

          $outputFile = $env:AFTER_SHA256_FILE

          $files = @(
              Get-ChildItem `
                  -LiteralPath $ohlcvRoot `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          if ($files.Count -ne [int]$env:EXPECTED_OHLCV_FILES) {
              throw "AFTER SHA256 source count mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$($files.Count)"
          }

          $records = foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $ohlcvRoot.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -LiteralPath $file.FullName `
                      -Algorithm SHA256
              ).Hash.ToLowerInvariant()

              "$hash`t$relative"
          }

          $records |
              Set-Content `
                  -LiteralPath $outputFile `
                  -Encoding UTF8

          $recordCount = @(
              Get-Content `
                  -LiteralPath $outputFile |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          ).Count

          if ($recordCount -ne [int]$env:EXPECTED_OHLCV_FILES) {
              throw "AFTER SHA256 record count mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$recordCount"
          }

          Write-Host "SHA256 records : $recordCount"

          Write-Host ""
          Write-Host "[PASS] AFTER SHA256 recorded."


      # ========================================================
      # 20. Verify all OHLCV remained unchanged
      # ========================================================

      - name: Verify all OHLCV files remained unchanged
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY ALL OHLCV FILES REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeFile = $env:BEFORE_SHA256_FILE
          $afterFile  = $env:AFTER_SHA256_FILE

          if (-not (Test-Path -LiteralPath $beforeFile -PathType Leaf)) {
              throw "Missing BEFORE SHA256 file: $beforeFile"
          }

          if (-not (Test-Path -LiteralPath $afterFile -PathType Leaf)) {
              throw "Missing AFTER SHA256 file: $afterFile"
          }

          $before = @(
              Get-Content `
                  -LiteralPath $beforeFile |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          $after = @(
              Get-Content `
                  -LiteralPath $afterFile |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($before.Count -ne [int]$env:EXPECTED_OHLCV_FILES) {

              throw "BEFORE SHA256 count mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$($before.Count)"
          }

          if ($after.Count -ne [int]$env:EXPECTED_OHLCV_FILES) {

              throw "AFTER SHA256 count mismatch. expected=$env:EXPECTED_OHLCV_FILES found=$($after.Count)"
          }

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -ne 0) {

              Write-Host ""
              Write-Host "OHLCV SHA256 differences detected:"

              $difference |
                  Format-Table |
                  Out-String |
                  Write-Host

              throw "OHLCV data changed during READ ONLY audit."
          }

          Write-Host "BEFORE records : $($before.Count)"
          Write-Host "AFTER records  : $($after.Count)"

          Write-Host ""

          Write-Host "[PASS] All 870 OHLCV files remained unchanged."


      # ========================================================
      # 21. Verify generated runtime data is Git ignored
      # ========================================================

      - name: Verify generated audit data is Git ignored
        working-directory: ${{ github.workspace }}
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY GENERATED AUDIT DATA IS GIT IGNORED"
          Write-Host "============================================================"

          $paths = @(
              "data/reports/history_gap_recovery_audit/",
              "data/recovery/history_gap_recovery_retry_candidates.csv",
              "data/validation/audit_history_gap_recovery_checkpoint.json",
              "data/validation/audit_history_gap_recovery_ohlcv_before.sha256",
              "data/validation/audit_history_gap_recovery_ohlcv_after.sha256"
          )

          foreach ($path in $paths) {

              Write-Host "Checking:"
              Write-Host "  $path"

              git check-ignore -q -- "$path"

              if ($LASTEXITCODE -ne 0) {

                  throw "Runtime path is NOT ignored by Git: $path"
              }

              Write-Host "[PASS]"
          }


      # ========================================================
      # 22. Final Git safety report
      # ========================================================

      - name: Final Git safety report
        working-directory: ${{ github.workspace }}
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY REPORT"
          Write-Host "============================================================"

          $status = @(
              git status `
                  --porcelain `
                  --untracked-files=all
          )

          if ($LASTEXITCODE -ne 0) {
              throw "git status failed."
          }

          $unexpected = @()

          foreach ($line in $status) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $path = $line.Substring(3).Trim()

              # ------------------------------------------------
              # Repository data is a temporary junction.
              #
              # It is allowed only when Git sees it as ignored
              # runtime data.
              # ------------------------------------------------

              if (
                  $path -eq "data" -or
                  $path.StartsWith("data/")
              ) {

                  continue
              }

              $unexpected += $line
          }

          if ($unexpected.Count -gt 0) {

              Write-Host ""
              Write-Host "Unexpected Git-visible changes detected:"

              foreach ($line in $unexpected) {
                  Write-Host "  $line"
              }

              throw "Unexpected Git-visible source changes detected."
          }

          Write-Host "[PASS] No unexpected source changes detected."

          Write-Host ""

          Write-Host "Disabled:"
          Write-Host "  OHLCV deletion   : DISABLED"
          Write-Host "  OHLCV repair     : DISABLED"
          Write-Host "  API download     : DISABLED"
          Write-Host "  Feature build    : DISABLED"
          Write-Host "  256 Detector     : DISABLED"
          Write-Host "  Future labels    : DISABLED"
          Write-Host "  Prediction       : DISABLED"
          Write-Host "  Trading          : DISABLED"
          Write-Host "  Git reset        : DISABLED"
          Write-Host "  Git clean        : DISABLED"
          Write-Host "  Git commit       : DISABLED"
          Write-Host "  Git push         : DISABLED"


      # ========================================================
      # 23. Remove temporary data junction
      # ========================================================
      #
      # IMPORTANT
      #
      # cmd /c rmdir removes ONLY the junction.
      #
      # It does NOT delete:
      #
      #   C:\Users\USER\Documents\
      #       upbit-surge-monitor\data
      #
      # ========================================================

      - name: Remove temporary repository data junction
        if: always()
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "REMOVE TEMPORARY REPOSITORY DATA JUNCTION"
          Write-Host "============================================================"

          $repoData = Join-Path $env:GITHUB_WORKSPACE "data"

          if (-not (Test-Path -LiteralPath $repoData)) {

              Write-Host "[INFO] Repository data junction does not exist."

              exit 0
          }

          $item = Get-Item `
              -LiteralPath $repoData `
              -Force `
              -ErrorAction SilentlyContinue

          if ($null -eq $item) {

              Write-Host "[INFO] Repository data path unavailable."

              exit 0
          }

          $isReparsePoint = (
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          )

          if (-not $isReparsePoint) {

              Write-Host "[SAFETY] Repository data path is NOT a reparse point."
              Write-Host "[SAFETY] It will NOT be removed."

              exit 0
          }

          Write-Host "Removing junction only:"
          Write-Host "  $repoData"

          cmd /c rmdir "$repoData"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[WARNING] Unable to remove repository data junction."

              exit 0
          }

          Write-Host ""
          Write-Host "[PASS] Temporary junction removed."
          Write-Host "[PASS] Persistent target data remains untouched."


      # ========================================================
      # 24. Completed
      # ========================================================

      - name: audit_history_gap_recovery_test.yml completed
        if: success()
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "AUDIT HISTORY GAP RECOVERY TEST COMPLETED"
          Write-Host "============================================================"

          Write-Host ""

          Write-Host "Workflow:"
          Write-Host "  audit_history_gap_recovery_test.yml"

          Write-Host ""

          Write-Host "Version:"
          Write-Host "  Clean V003"

          Write-Host ""

          Write-Host "OHLCV:"
          Write-Host "  H1    : 290"
          Write-Host "  H4    : 290"
          Write-Host "  D1    : 290"
          Write-Host "  Total : 870"

          Write-Host ""

          Write-Host "Validation:"
          Write-Host "  Persistent data root : VERIFIED"
          Write-Host "  Audit execution      : VERIFIED"
          Write-Host "  Audit reports        : VERIFIED"
          Write-Host "  Retry candidates     : VERIFIED"
          Write-Host "  Checkpoint           : VERIFIED"
          Write-Host "  Resume / re-run      : VERIFIED"
          Write-Host "  BEFORE SHA256        : VERIFIED"
          Write-Host "  AFTER SHA256         : VERIFIED"
          Write-Host "  OHLCV unchanged      : VERIFIED"
          Write-Host "  Git ignore           : VERIFIED"
          Write-Host "  Git safety           : VERIFIED"

          Write-Host ""

          Write-Host "[PASS] audit_history_gap_recovery.py Clean V001"
          Write-Host "       validation completed successfully."

          Write-Host "============================================================"
