# ============================================================
# Upbit Surge Monitor
# .github/workflows/validate_256_test.yml
# Full KRW 256 Validator - Clean V002
# ============================================================
#
# PURPOSE
# ------------------------------------------------------------
#
# Validate the COMPLETE existing 256 Detector output generated
# for all KRW markets.
#
# Current validated foundation:
#
#   KRW markets : 290
#   Timeframes  : h1 / h4 / d1
#   Total jobs  : 870
#
# Input:
#
#   data/ohlcv/
#   data/features/
#   data/signals/256/
#
# Validator:
#
#   validate_256.py
#
#
# IMPORTANT
# ------------------------------------------------------------
#
# READ ONLY VALIDATION.
#
# This workflow does NOT:
#
#   - run collector.py
#   - run backfill_history.py
#   - run build_features.py
#   - run detect_256.py
#   - modify OHLCV
#   - modify Feature CSV
#   - modify Signal CSV
#   - generate future-result labels
#   - perform prediction
#   - perform trading
#   - run git reset --hard
#   - run git clean
#   - commit
#   - push
#
#
# RESUME POLICY
# ------------------------------------------------------------
#
# Long-running validation must support safe resume.
#
# Workflow responsibilities:
#
#   - preserve validator checkpoint/runtime state
#   - never delete checkpoint data
#   - never clean runtime data
#   - verify complete input dataset before validation
#   - verify all source files remain unchanged
#
# Validator responsibilities:
#
#   - checkpoint completed validation jobs
#   - verify checkpoint validity against current inputs
#   - skip only previously validated unchanged jobs
#   - revalidate changed / incomplete / invalid jobs
#
#
# EXPECTED DATASET
# ------------------------------------------------------------
#
#   290 KRW markets
#
#   h1 : 290 OHLCV + 290 Feature + 290 Signal
#   h4 : 290 OHLCV + 290 Feature + 290 Signal
#   d1 : 290 OHLCV + 290 Feature + 290 Signal
#
#   Validation jobs:
#
#       290 markets x 3 timeframes = 870
#
# ============================================================


name: Full KRW 256 Validator Clean V002


# ============================================================
# 1. TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. CONCURRENCY
# ============================================================

concurrency:
  group: full-krw-256-validator-v002
  cancel-in-progress: false


# ============================================================
# 4. ENVIRONMENT
# ============================================================

env:

  PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor

  EXPECTED_MARKETS: "290"
  EXPECTED_TIMEFRAMES: "3"
  EXPECTED_JOBS: "870"

  VALIDATOR_FILE: validate_256.py


# ============================================================
# 5. JOB
# ============================================================

jobs:

  validate-256-full:

    name: Full KRW 256 Validator Clean V002

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    defaults:
      run:
        shell: powershell


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Show environment
      # ======================================================

      - name: Show validation environment

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "FULL KRW 256 VALIDATOR - CLEAN V002"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  Name        : $env:RUNNER_NAME"
          Write-Host "  OS          : $env:RUNNER_OS"
          Write-Host "  Architecture: $env:RUNNER_ARCH"
          Write-Host ""

          Write-Host "Project:"
          Write-Host "  ${{ env.PROJECT_DIR }}"
          Write-Host ""

          Write-Host "Expected dataset:"
          Write-Host "  Markets    : ${{ env.EXPECTED_MARKETS }}"
          Write-Host "  Timeframes : ${{ env.EXPECTED_TIMEFRAMES }}"
          Write-Host "  Jobs       : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          Write-Host "Timeframes:"
          Write-Host "  h1"
          Write-Host "  h4"
          Write-Host "  d1"
          Write-Host ""

          Write-Host "Mode:"
          Write-Host "  READ ONLY VALIDATION"
          Write-Host "  FULL KRW MARKET"
          Write-Host "  EXISTING DETECTOR OUTPUT"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Collector           : DISABLED"
          Write-Host "  Backfill            : DISABLED"
          Write-Host "  Feature rebuild     : DISABLED"
          Write-Host "  Detector rebuild    : DISABLED"
          Write-Host "  Future labels       : DISABLED"
          Write-Host "  Prediction          : DISABLED"
          Write-Host "  Trading             : DISABLED"
          Write-Host "  Git reset           : DISABLED"
          Write-Host "  Git clean           : DISABLED"
          Write-Host "  Git commit          : DISABLED"
          Write-Host "  Git push            : DISABLED"
          Write-Host ""

          Write-Host "Resume:"
          Write-Host "  Runtime state       : PRESERVED"
          Write-Host "  Automatic clean     : DISABLED"
          Write-Host "  Checkpoint deletion : DISABLED"
          Write-Host ""

          Write-Host "[PASS] Environment information displayed."


      # ======================================================
      # STEP 2
      # Verify project directory
      # ======================================================

      - name: Verify project directory

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PROJECT DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $projectRoot `
                  -PathType Container
          )) {

              Write-Host "[FAIL] Project directory does not exist:"
              Write-Host "       $projectRoot"

              exit 1
          }

          Set-Location $projectRoot

          Write-Host "Project root:"
          Write-Host "  $projectRoot"
          Write-Host ""

          Write-Host "[PASS] Project directory exists."


      # ======================================================
      # STEP 3
      # Synchronize repository
      #
      # IMPORTANT:
      #
      # No reset.
      # No clean.
      #
      # Persistent local data and checkpoints are preserved.
      # ======================================================

      - name: Synchronize repository source

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE REPOSITORY SOURCE"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath ".git" `
                  -PathType Container
          )) {

              Write-Host "[FAIL] .git directory not found."

              exit 1
          }

          Write-Host "Git status before synchronization:"
          Write-Host ""

          git status --short

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git status failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Fetching origin/main..."
          Write-Host ""

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git fetch failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Checking out main..."
          Write-Host ""

          git checkout main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git checkout main failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Fast-forwarding local main..."
          Write-Host ""

          git pull --ff-only origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] git pull --ff-only failed."
              Write-Host ""
              Write-Host "No automatic reset was performed."
              Write-Host "No local runtime data was deleted."

              exit 1
          }

          Write-Host ""
          Write-Host "Current commit:"
          Write-Host ""

          git rev-parse --short HEAD

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Could not read current commit."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Repository synchronized safely."


      # ======================================================
      # STEP 4
      # Verify Python
      # ======================================================

      - name: Verify Python

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Python launcher 'py' is unavailable."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python available."


      # ======================================================
      # STEP 5
      # Verify validator source
      # ======================================================

      - name: Verify validator source

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          $validator = Join-Path `
              $projectRoot `
              "${{ env.VALIDATOR_FILE }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATOR SOURCE"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $validator `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] Validator does not exist:"
              Write-Host "       $validator"

              exit 1
          }

          $validatorInfo = Get-Item `
              -LiteralPath $validator

          if ($validatorInfo.Length -le 0) {

              Write-Host "[FAIL] Validator file is empty."

              exit 1
          }

          Write-Host "Validator:"
          Write-Host "  $validator"
          Write-Host ""

          Write-Host "Size:"
          Write-Host "  $($validatorInfo.Length) bytes"
          Write-Host ""

          Write-Host "[PASS] Validator source verified."


      # ======================================================
      # STEP 6
      # Verify dependencies
      # ======================================================

      - name: Verify dependencies

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY DEPENDENCIES"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath "requirements.txt" `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] requirements.txt not found."

              exit 1
          }

          py -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Dependency installation failed."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies available."


      # ======================================================
      # STEP 7
      # Verify complete directory structure
      # ======================================================

      - name: Verify full validation directories

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FULL VALIDATION DIRECTORY STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $requiredDirectories = @(

              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1",

              "data\features\h1",
              "data\features\h4",
              "data\features\d1",

              "data\signals\256\h1",
              "data\signals\256\h4",
              "data\signals\256\d1"

          )

          $failed = $false

          foreach ($relativePath in $requiredDirectories) {

              $fullPath = Join-Path `
                  $projectRoot `
                  $relativePath

              if (
                  Test-Path `
                      -LiteralPath $fullPath `
                      -PathType Container
              ) {

                  Write-Host "[PASS] $relativePath"

              }
              else {

                  Write-Host "[FAIL] $relativePath"

                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Required validation directories are incomplete."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Full directory structure verified."


      # ======================================================
      # STEP 8
      # Verify complete 290-market file sets
      #
      # OHLCV / Feature / Signal must all contain exactly
      # the same 290 KRW markets for every timeframe.
      # ======================================================

      - name: Verify complete validation file sets

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"
          $expectedMarkets = [int]"${{ env.EXPECTED_MARKETS }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY COMPLETE VALIDATION FILE SETS"
          Write-Host "============================================================"
          Write-Host ""

          $referenceMarkets = $null

          $totalOhlcv = 0
          $totalFeature = 0
          $totalSignal = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              Write-Host "------------------------------------------------------------"
              Write-Host "[$($tf.ToUpper())]"
              Write-Host "------------------------------------------------------------"

              $ohlcvDir = Join-Path `
                  $projectRoot `
                  "data\ohlcv\$tf"

              $featureDir = Join-Path `
                  $projectRoot `
                  "data\features\$tf"

              $signalDir = Join-Path `
                  $projectRoot `
                  "data\signals\256\$tf"

              $ohlcvFiles = @(
                  Get-ChildItem `
                      -LiteralPath $ohlcvDir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              $featureFiles = @(
                  Get-ChildItem `
                      -LiteralPath $featureDir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              $signalFiles = @(
                  Get-ChildItem `
                      -LiteralPath $signalDir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              $ohlcvMarkets = @(
                  $ohlcvFiles |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              $featureMarkets = @(
                  $featureFiles |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              $signalMarkets = @(
                  $signalFiles |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              Write-Host "OHLCV   : $($ohlcvMarkets.Count)"
              Write-Host "Feature : $($featureMarkets.Count)"
              Write-Host "Signal  : $($signalMarkets.Count)"
              Write-Host ""

              if ($ohlcvMarkets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf OHLCV market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($ohlcvMarkets.Count)"

                  exit 1
              }

              if ($featureMarkets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf Feature market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($featureMarkets.Count)"

                  exit 1
              }

              if ($signalMarkets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf Signal market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($signalMarkets.Count)"

                  exit 1
              }

              $ohlcvVsFeature = @(
                  Compare-Object `
                      $ohlcvMarkets `
                      $featureMarkets
              )

              if ($ohlcvVsFeature.Count -ne 0) {

                  Write-Host "[FAIL] $tf OHLCV/Feature market sets differ."
                  Write-Host ""

                  $ohlcvVsFeature |
                      Format-Table -AutoSize

                  exit 1
              }

              $ohlcvVsSignal = @(
                  Compare-Object `
                      $ohlcvMarkets `
                      $signalMarkets
              )

              if ($ohlcvVsSignal.Count -ne 0) {

                  Write-Host "[FAIL] $tf OHLCV/Signal market sets differ."
                  Write-Host ""

                  $ohlcvVsSignal |
                      Format-Table -AutoSize

                  exit 1
              }

              if ($null -eq $referenceMarkets) {

                  $referenceMarkets = @(
                      $ohlcvMarkets
                  )

              }
              else {

                  $tfComparison = @(
                      Compare-Object `
                          $referenceMarkets `
                          $ohlcvMarkets
                  )

                  if ($tfComparison.Count -ne 0) {

                      Write-Host "[FAIL] Timeframe market sets differ."
                      Write-Host ""

                      $tfComparison |
                          Format-Table -AutoSize

                      exit 1
                  }
              }

              $totalOhlcv += $ohlcvFiles.Count
              $totalFeature += $featureFiles.Count
              $totalSignal += $signalFiles.Count

              Write-Host "[PASS] $tf market sets match."
              Write-Host ""
          }

          $expectedJobs = [int]"${{ env.EXPECTED_JOBS }}"

          Write-Host "============================================================"
          Write-Host "FILE SET SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "OHLCV files   : $totalOhlcv"
          Write-Host "Feature files : $totalFeature"
          Write-Host "Signal files  : $totalSignal"
          Write-Host ""

          if ($totalOhlcv -ne $expectedJobs) {

              Write-Host "[FAIL] Total OHLCV file count mismatch."

              exit 1
          }

          if ($totalFeature -ne $expectedJobs) {

              Write-Host "[FAIL] Total Feature file count mismatch."

              exit 1
          }

          if ($totalSignal -ne $expectedJobs) {

              Write-Host "[FAIL] Total Signal file count mismatch."

              exit 1
          }

          Write-Host "[PASS] 290 markets verified."
          Write-Host "[PASS] 870 OHLCV files verified."
          Write-Host "[PASS] 870 Feature files verified."
          Write-Host "[PASS] 870 Signal files verified."


      # ======================================================
      # STEP 9
      # Verify all validation files are non-empty
      # ======================================================

      - name: Verify all validation files are non-empty

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY ALL VALIDATION FILES ARE NON-EMPTY"
          Write-Host "============================================================"
          Write-Host ""

          $failed = 0
          $checked = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              $directories = @(

                  "data\ohlcv\$tf",
                  "data\features\$tf",
                  "data\signals\256\$tf"

              )

              foreach ($relativeDirectory in $directories) {

                  $directory = Join-Path `
                      $projectRoot `
                      $relativeDirectory

                  $files = @(
                      Get-ChildItem `
                          -LiteralPath $directory `
                          -Filter "KRW-*.csv" `
                          -File
                  )

                  foreach ($file in $files) {

                      $checked++

                      if ($file.Length -le 0) {

                          Write-Host "[FAIL] Empty file:"
                          Write-Host "       $($file.FullName)"

                          $failed++
                      }
                  }
              }
          }

          Write-Host "Files checked : $checked"
          Write-Host "Empty files   : $failed"
          Write-Host ""

          if ($failed -ne 0) {

              Write-Host "[FAIL] Empty validation files detected."

              exit 1
          }

          if ($checked -ne 2610) {

              Write-Host "[FAIL] Validation file count mismatch."
              Write-Host "       Expected: 2610"
              Write-Host "       Actual  : $checked"

              exit 1
          }

          Write-Host "[PASS] All 2,610 validation source files are non-empty."


      # ======================================================
      # STEP 10
      # Record complete source SHA256 snapshot
      #
      # 870 OHLCV
      # 870 Feature
      # 870 Signal
      #
      # Total = 2,610 files
      # ======================================================

      - name: Record all source SHA256 before validation

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD COMPLETE SOURCE SHA256 SNAPSHOT"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "validate_256_full_before.sha256"

          if (Test-Path -LiteralPath $hashFile) {

              Remove-Item `
                  -LiteralPath $hashFile `
                  -Force
          }

          $lines = New-Object `
              System.Collections.Generic.List[string]

          $count = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              $directories = @(

                  "data\ohlcv\$tf",
                  "data\features\$tf",
                  "data\signals\256\$tf"

              )

              foreach ($relativeDirectory in $directories) {

                  $directory = Join-Path `
                      $projectRoot `
                      $relativeDirectory

                  $files = @(
                      Get-ChildItem `
                          -LiteralPath $directory `
                          -Filter "KRW-*.csv" `
                          -File |
                      Sort-Object Name
                  )

                  foreach ($file in $files) {

                      $hash = (
                          Get-FileHash `
                              -LiteralPath $file.FullName `
                              -Algorithm SHA256
                      ).Hash

                      $relativePath = (
                          Join-Path `
                              $relativeDirectory `
                              $file.Name
                      )

                      $lines.Add(
                          "$relativePath|$hash"
                      )

                      $count++
                  }
              }
          }

          $lines |
              Set-Content `
                  -LiteralPath $hashFile `
                  -Encoding UTF8

          Write-Host "SHA256 records : $count"
          Write-Host "Expected       : 2610"
          Write-Host ""

          if ($count -ne 2610) {

              Write-Host "[FAIL] SHA256 snapshot count mismatch."

              exit 1
          }

          Write-Host "[PASS] Complete source SHA256 snapshot saved."


      # ======================================================
      # STEP 11
      # Inspect persistent resume/checkpoint state
      #
      # IMPORTANT:
      #
      # This step does NOT delete anything.
      #
      # validate_256.py is responsible for interpreting its
      # own checkpoint format.
      # ======================================================

      - name: Inspect validator resume state

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATOR RESUME STATE"
          Write-Host "============================================================"
          Write-Host ""

          $possibleCheckpointPaths = @(

              "data\validate_256_checkpoint.json",
              "data\validate_256_checkpoint.csv",
              "data\validate_256_status.csv",
              "data\validation\256",
              "data\checkpoints\validate_256"

          )

          $found = $false

          foreach ($relativePath in $possibleCheckpointPaths) {

              $fullPath = Join-Path `
                  $projectRoot `
                  $relativePath

              if (Test-Path -LiteralPath $fullPath) {

                  Write-Host "[FOUND] $relativePath"

                  $found = $true
              }
          }

          if (-not $found) {

              Write-Host "[INFO] No known validator checkpoint currently exists."
              Write-Host "[INFO] First full validation may start from job 1."
          }

          Write-Host ""
          Write-Host "[PASS] No checkpoint data was deleted."


      # ======================================================
      # STEP 12
      # Run full validator
      #
      # IMPORTANT:
      #
      # No --market KRW-BTC restriction.
      #
      # validate_256.py must perform full-market discovery.
      #
      # Resume/checkpoint behavior belongs inside
      # validate_256.py.
      # ======================================================

      - name: Run Full KRW 256 Validator

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN FULL KRW 256 VALIDATOR"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Expected:"
          Write-Host "  Markets    : ${{ env.EXPECTED_MARKETS }}"
          Write-Host "  Timeframes : ${{ env.EXPECTED_TIMEFRAMES }}"
          Write-Host "  Jobs       : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          Write-Host "Starting validator..."
          Write-Host ""

          py "${{ env.VALIDATOR_FILE }}"

          $validatorExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code: $validatorExitCode"
          Write-Host ""

          if ($validatorExitCode -ne 0) {

              Write-Host "[FAIL] validate_256.py returned a failure."
              Write-Host ""
              Write-Host "[STOP] Do NOT proceed to future-result labels."
              Write-Host "[INFO] Existing checkpoint/runtime state was preserved."

              exit $validatorExitCode
          }

          Write-Host "[PASS] Full KRW 256 Validator completed successfully."


      # ======================================================
      # STEP 13
      # Verify complete source SHA256 after validation
      #
      # Runs even if validator fails.
      # ======================================================

      - name: Verify all source SHA256 after validation

        if: always()

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY COMPLETE SOURCE SHA256 AFTER VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "validate_256_full_before.sha256"

          if (-not (
              Test-Path `
                  -LiteralPath $hashFile `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] Pre-validation SHA256 snapshot not found."

              exit 1
          }

          $failed = 0
          $passed = 0

          foreach ($line in Get-Content -LiteralPath $hashFile) {

              if ([string]::IsNullOrWhiteSpace($line)) {

                  continue
              }

              $parts = $line -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid SHA256 record:"
                  Write-Host "       $line"

                  $failed++

                  continue
              }

              $relativePath = $parts[0]
              $beforeHash = $parts[1].Trim()

              $fullPath = Join-Path `
                  $projectRoot `
                  $relativePath

              if (-not (
                  Test-Path `
                      -LiteralPath $fullPath `
                      -PathType Leaf
              )) {

                  Write-Host "[FAIL] Source file disappeared:"
                  Write-Host "       $relativePath"

                  $failed++

                  continue
              }

              $afterHash = (
                  Get-FileHash `
                      -LiteralPath $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($beforeHash -ne $afterHash) {

                  Write-Host "[FAIL] SHA256 changed:"
                  Write-Host "       $relativePath"

                  $failed++

              }
              else {

                  $passed++
              }
          }

          Write-Host ""
          Write-Host "SHA256 verification:"
          Write-Host "  Passed : $passed"
          Write-Host "  Failed : $failed"
          Write-Host ""

          if ($failed -ne 0) {

              Write-Host "[FAIL] Validation modified source data."

              exit 1
          }

          if ($passed -ne 2610) {

              Write-Host "[FAIL] SHA256 verification count mismatch."
              Write-Host "       Expected: 2610"
              Write-Host "       Actual  : $passed"

              exit 1
          }

          Write-Host "[PASS] All 2,610 source files remained unchanged."


      # ======================================================
      # STEP 14
      # Verify Git safety
      #
      # Existing ignored runtime/checkpoint files are allowed.
      # No reset / clean is performed.
      # ======================================================

      - name: Verify Git safety

        if: always()

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY GIT SAFETY"
          Write-Host "============================================================"
          Write-Host ""

          $status = @(
              git status `
                  --short `
                  --untracked-files=all
          )

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git status failed."

              exit 1
          }

          if ($status.Count -eq 0) {

              Write-Host "[PASS] No Git-visible changes detected."

          }
          else {

              Write-Host "Git-visible changes:"
              Write-Host ""

              foreach ($line in $status) {

                  Write-Host $line
              }

              Write-Host ""
              Write-Host "[FAIL] Unexpected Git-visible changes exist."
              Write-Host ""
              Write-Host "Generated runtime/checkpoint data must remain ignored."
              Write-Host "No automatic deletion was performed."

              exit 1
          }


