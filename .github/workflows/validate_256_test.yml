# ============================================================
# Upbit Surge Monitor
# .github/workflows/validate_256_test.yml
# Clean V001
# ============================================================
#
# PURPOSE
# ------------------------------------------------------------
# Validate existing output generated by:
#
#   detect_256.py - 256 Detector Clean V001
#
# using:
#
#   validate_256.py - 256 Validator Clean V001
#
#
# IMPORTANT
# ------------------------------------------------------------
# This workflow runs on the Windows self-hosted runner because
# historical OHLCV / Feature / Signal data is stored locally:
#
#   C:\Users\USER\Documents\upbit-surge-monitor\data
#
#
# READ ONLY VALIDATION
# ------------------------------------------------------------
#
# This workflow does NOT:
#
#   - run collector.py
#   - run backfill_history.py
#   - run build_features.py
#   - run detect_256.py
#   - modify OHLCV
#   - modify Feature CSV
#   - modify Signal CSV
#   - generate future labels
#   - perform prediction
#   - perform trading
#
#
# VALIDATION TARGET
# ------------------------------------------------------------
#
# Market:
#   KRW-BTC
#
# Timeframes:
#   h1
#   h4
#   d1
#
#
# LOCAL DATA STRUCTURE
# ------------------------------------------------------------
#
# data/
#
#   ohlcv/
#     h1/KRW-BTC.csv
#     h4/KRW-BTC.csv
#     d1/KRW-BTC.csv
#
#   features/
#     h1/KRW-BTC.csv
#     h4/KRW-BTC.csv
#     d1/KRW-BTC.csv
#
#   signals/
#     256/
#       h1/KRW-BTC.csv
#       h4/KRW-BTC.csv
#       d1/KRW-BTC.csv
#
# ============================================================


name: 256 Validator Test


# ============================================================
# 1. TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. JOB
# ============================================================

jobs:

  validate-256:

    name: KRW-BTC 256 Validator Test

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 30

    defaults:
      run:
        shell: powershell


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Show environment
      # ======================================================

      - name: Show test environment

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "256 VALIDATOR TEST - CLEAN V001"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner name : $env:RUNNER_NAME"
          Write-Host "Runner OS   : $env:RUNNER_OS"
          Write-Host "Workspace   : $env:GITHUB_WORKSPACE"
          Write-Host ""

          Write-Host "Expected project directory:"
          Write-Host "C:\Users\USER\Documents\upbit-surge-monitor"
          Write-Host ""

          Write-Host "Validation mode:"
          Write-Host "  READ ONLY"
          Write-Host "  KRW-BTC"
          Write-Host "  h1 / h4 / d1"
          Write-Host "  Existing detector output"
          Write-Host ""

          Write-Host "No collector"
          Write-Host "No backfill"
          Write-Host "No feature rebuild"
          Write-Host "No detector rebuild"
          Write-Host "No future labels"
          Write-Host "No prediction"
          Write-Host "No trading"
          Write-Host ""

          Write-Host "[PASS] Environment information displayed."


      # ======================================================
      # STEP 2
      # Verify fixed local project directory
      # ======================================================

      - name: Verify project directory

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PROJECT DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project root:"
          Write-Host $projectRoot
          Write-Host ""

          if (-not (Test-Path -LiteralPath $projectRoot -PathType Container)) {

              Write-Host "[FAIL] Project directory does not exist:"
              Write-Host $projectRoot

              exit 1
          }

          Write-Host "[PASS] Project directory exists."


      # ======================================================
      # STEP 3
      # Synchronize repository source files
      # ======================================================
      #
      # The self-hosted runner executes against the persistent
      # local project directory.
      #
      # Therefore the local source code must first be synced
      # with origin/main.
      #
      # Local data/ is intentionally preserved.
      #
      # ======================================================

      - name: Synchronize repository source

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE REPOSITORY SOURCE"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Current directory:"
          Write-Host (Get-Location)
          Write-Host ""

          if (-not (Test-Path -LiteralPath ".git" -PathType Container)) {

              Write-Host "[FAIL] .git directory not found."
              Write-Host "Expected Git repository:"
              Write-Host $projectRoot

              exit 1
          }

          Write-Host "Git status before synchronization:"
          git status --short

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git status failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Fetching origin/main..."

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git fetch failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Fast-forwarding local main..."

          git checkout main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git checkout main failed."

              exit 1
          }

          git pull --ff-only origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git pull --ff-only failed."
              Write-Host ""
              Write-Host "Local source and GitHub source may have diverged."
              Write-Host "No automatic reset was performed."

              exit 1
          }

          Write-Host ""
          Write-Host "Current commit:"

          git rev-parse --short HEAD

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Could not read current commit."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Repository source synchronized."


      # ======================================================
      # STEP 4
      # Verify validator source file
      # ======================================================

      - name: Verify validator source file

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATOR SOURCE FILE"
          Write-Host "============================================================"
          Write-Host ""

          $validatorFile = Join-Path $projectRoot "validate_256.py"

          Write-Host "Validator:"
          Write-Host $validatorFile
          Write-Host ""

          if (-not (Test-Path -LiteralPath $validatorFile -PathType Leaf)) {

              Write-Host "[FAIL] Missing required file:"
              Write-Host $validatorFile

              exit 1
          }

          $validatorInfo = Get-Item -LiteralPath $validatorFile

          if ($validatorInfo.Length -le 0) {

              Write-Host "[FAIL] validate_256.py is empty."

              exit 1
          }

          Write-Host "[PASS] validate_256.py"
          Write-Host "       Size: $($validatorInfo.Length) bytes"


      # ======================================================
      # STEP 5
      # Verify Python
      # ======================================================

      - name: Verify Python

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Python launcher 'py' is unavailable."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python launcher available."


      # ======================================================
      # STEP 6
      # Install dependencies
      # ======================================================

      - name: Install dependencies

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "INSTALL DEPENDENCIES"
          Write-Host "============================================================"
          Write-Host ""

          $requirementsFile = Join-Path $projectRoot "requirements.txt"

          if (-not (Test-Path -LiteralPath $requirementsFile -PathType Leaf)) {

              Write-Host "[FAIL] requirements.txt not found."

              exit 1
          }

          py -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Dependency installation failed."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies available."


      # ======================================================
      # STEP 7
      # Verify actual local data directories
      # ======================================================

      - name: Verify local data directories

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY LOCAL DATA DIRECTORY STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $requiredDirectories = @(

              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1",

              "data\features\h1",
              "data\features\h4",
              "data\features\d1",

              "data\signals\256\h1",
              "data\signals\256\h4",
              "data\signals\256\d1"

          )

          $failed = $false

          foreach ($relativePath in $requiredDirectories) {

              $fullPath = Join-Path $projectRoot $relativePath

              if (Test-Path -LiteralPath $fullPath -PathType Container) {

                  Write-Host "[PASS] $relativePath"

              }
              else {

                  Write-Host "[FAIL] Missing directory:"
                  Write-Host "       $fullPath"

                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Required local data directory structure is incomplete."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Local data directory structure verified."


      # ======================================================
      # STEP 8
      # Verify KRW-BTC source files
      # ======================================================

      - name: Verify KRW-BTC validation files

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY KRW-BTC VALIDATION FILES"
          Write-Host "============================================================"
          Write-Host ""

          $market = "KRW-BTC"

          $requiredFiles = @(

              "data\ohlcv\h1\$market.csv",
              "data\ohlcv\h4\$market.csv",
              "data\ohlcv\d1\$market.csv",

              "data\features\h1\$market.csv",
              "data\features\h4\$market.csv",
              "data\features\d1\$market.csv",

              "data\signals\256\h1\$market.csv",
              "data\signals\256\h4\$market.csv",
              "data\signals\256\d1\$market.csv"

          )

          $failed = $false

          foreach ($relativePath in $requiredFiles) {

              $fullPath = Join-Path $projectRoot $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {

                  Write-Host "[FAIL] Missing file:"
                  Write-Host "       $fullPath"

                  $failed = $true

                  continue
              }

              $fileInfo = Get-Item -LiteralPath $fullPath

              if ($fileInfo.Length -le 0) {

                  Write-Host "[FAIL] Empty file:"
                  Write-Host "       $fullPath"

                  $failed = $true

                  continue
              }

              Write-Host "[PASS] $relativePath"
              Write-Host "       $($fileInfo.Length) bytes"
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Required KRW-BTC validation files are incomplete."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] All KRW-BTC validation files exist."


      # ======================================================
      # STEP 9
      # Save source SHA256 before validation
      # ======================================================
      #
      # validate_256.py already performs internal SHA256
      # validation.
      #
      # The workflow performs a second independent check.
      #
      # ======================================================

      - name: Save source SHA256 before validation

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SAVE SOURCE SHA256 BEFORE VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $market = "KRW-BTC"

          $files = @(

              "data\ohlcv\h1\$market.csv",
              "data\ohlcv\h4\$market.csv",
              "data\ohlcv\d1\$market.csv",

              "data\features\h1\$market.csv",
              "data\features\h4\$market.csv",
              "data\features\d1\$market.csv",

              "data\signals\256\h1\$market.csv",
              "data\signals\256\h4\$market.csv",
              "data\signals\256\d1\$market.csv"

          )

          $hashFile = Join-Path $env:RUNNER_TEMP "validate_256_before_sha256.txt"

          if (Test-Path -LiteralPath $hashFile) {

              Remove-Item -LiteralPath $hashFile -Force
          }

          foreach ($relativePath in $files) {

              $fullPath = Join-Path $projectRoot $relativePath

              $hash = Get-FileHash `
                  -LiteralPath $fullPath `
                  -Algorithm SHA256

              "$relativePath|$($hash.Hash)" |
                  Out-File `
                      -LiteralPath $hashFile `
                      -Append `
                      -Encoding utf8

              Write-Host "[HASH] $relativePath"
              Write-Host "       $($hash.Hash)"
          }

          if (-not (Test-Path -LiteralPath $hashFile -PathType Leaf)) {

              Write-Host "[FAIL] Could not create temporary SHA256 file."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Pre-validation SHA256 values saved."


      # ======================================================
      # STEP 10
      # Run validator
      # ======================================================

      - name: Run 256 Validator Clean V001

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN 256 VALIDATOR CLEAN V001"
          Write-Host "============================================================"
          Write-Host ""

          py validate_256.py

          $validatorExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code: $validatorExitCode"
          Write-Host ""

          if ($validatorExitCode -ne 0) {

              Write-Host "[FAIL] validate_256.py returned a failure."
              Write-Host ""
              Write-Host "Do NOT proceed to future-result labels."

              exit $validatorExitCode
          }

          Write-Host "[PASS] validate_256.py completed successfully."


      # ======================================================
      # STEP 11
      # Verify source SHA256 after validation
      # ======================================================

      - name: Verify source SHA256 after validation

        if: always()

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY SOURCE SHA256 AFTER VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path $env:RUNNER_TEMP "validate_256_before_sha256.txt"

          if (-not (Test-Path -LiteralPath $hashFile -PathType Leaf)) {

              Write-Host "[FAIL] Pre-validation SHA256 file not found:"
              Write-Host $hashFile

              exit 1
          }

          $lines = Get-Content -LiteralPath $hashFile

          $failed = $false

          foreach ($line in $lines) {

              if ([string]::IsNullOrWhiteSpace($line)) {

                  continue
              }

              $parts = $line -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid SHA256 record:"
                  Write-Host $line

                  $failed = $true

                  continue
              }

              $relativePath = $parts[0]
              $beforeHash = $parts[1].Trim()

              $fullPath = Join-Path $projectRoot $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {

                  Write-Host "[FAIL] Source file disappeared:"
                  Write-Host $fullPath

                  $failed = $true

                  continue
              }

              $afterHash = (
                  Get-FileHash `
                      -LiteralPath $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($beforeHash -ne $afterHash) {

                  Write-Host "[FAIL] SHA256 changed:"
                  Write-Host "       $relativePath"
                  Write-Host "       BEFORE: $beforeHash"
                  Write-Host "       AFTER : $afterHash"

                  $failed = $true
              }
              else {

                  Write-Host "[PASS] SHA256 unchanged:"
                  Write-Host "       $relativePath"
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] One or more source files changed during validation."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] All source files remained unchanged."


      # ======================================================
      # STEP 12
      # Final summary
      # ======================================================

      - name: Validation test summary

        if: success()

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "256 VALIDATOR TEST SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project:"
          Write-Host "  Upbit Surge Monitor"
          Write-Host ""

          Write-Host "Validator:"
          Write-Host "  validate_256.py - Clean V001"
          Write-Host ""

          Write-Host "Market:"
          Write-Host "  KRW-BTC"
          Write-Host ""

          Write-Host "Timeframes:"
          Write-Host "  h1"
          Write-Host "  h4"
          Write-Host "  d1"
          Write-Host ""

          Write-Host "Input structure:"
          Write-Host "  data\ohlcv\h1 | h4 | d1"
          Write-Host "  data\features\h1 | h4 | d1"
          Write-Host "  data\signals\256\h1 | h4 | d1"
          Write-Host ""

          Write-Host "Validation:"
          Write-Host "  File existence       : PASS"
          Write-Host "  CSV readability      : PASS"
          Write-Host "  Timestamp integrity  : PASS"
          Write-Host "  Feature/Signal 1:1   : PASS"
          Write-Host "  OHLC sanity          : PASS"
          Write-Host "  Research states      : PASS"
          Write-Host "  Future leakage       : PASS"
          Write-Host "  Source SHA256        : PASS"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  OHLCV modification   : NONE"
          Write-Host "  Feature modification : NONE"
          Write-Host "  Signal modification  : NONE"
          Write-Host "  Future labels        : NOT CREATED"
          Write-Host "  Prediction           : DISABLED"
          Write-Host "  Trading              : DISABLED"
          Write-Host ""

          Write-Host "============================================================"
          Write-Host "[RESULT] 256 VALIDATOR TEST PASSED"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[NEXT] Detector validation is complete."
          Write-Host "[NEXT] Review results before future-result label design."
