# ============================================================
# Upbit Surge Monitor
# .github/workflows/validate_256_test.yml
#
# Full KRW 256 Validator - Clean V003
# ============================================================
#
# PURPOSE
# ------------------------------------------------------------
#
# Validate the COMPLETE existing 256 Detector output.
#
# Expected current dataset:
#
#   KRW markets : 290
#   Timeframes  : h1 / h4 / d1
#   Total jobs  : 870
#
# Validator:
#
#   validate_256.py - Clean V003
#
#
# CLEAN V003
# ------------------------------------------------------------
#
#   - Full KRW market validation
#   - 290 markets
#   - h1 / h4 / d1
#   - 870 validation jobs
#   - Persistent local checkpoint
#   - Safe resume after interruption
#   - SHA256-aware resume
#   - Changed input -> revalidate
#   - Failed job -> retry next run
#   - Source data READ ONLY
#
#
# IMPORTANT
# ------------------------------------------------------------
#
# This workflow does NOT:
#
#   - run collector.py
#   - run backfill_history.py
#   - run build_features.py
#   - run detect_256.py
#   - modify OHLCV CSV
#   - modify Feature CSV
#   - modify Signal CSV
#   - generate future labels
#   - perform prediction
#   - perform trading
#   - run git reset --hard
#   - run git clean
#   - commit
#   - push
#
#
# RESUME
# ------------------------------------------------------------
#
# validate_256.py Clean V003 stores:
#
#   data/validation/validate_256_checkpoint.json
#
# Every successful validation job is checkpointed.
#
# On restart:
#
#   PASS + same OHLCV SHA256
#        + same Feature SHA256
#        + same Signal SHA256
#
#       -> SKIP
#
#   Input changed
#
#       -> REVALIDATE
#
#   Previous job failed
#
#       -> REVALIDATE
#
#   No checkpoint
#
#       -> VALIDATE
#
#
# Because the runner is self-hosted, the project data and
# checkpoint remain on the Windows PC after the workflow ends.
#
# ============================================================


name: Full KRW 256 Validator Clean V003


# ============================================================
# 1. TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. CONCURRENCY
# ============================================================

concurrency:
  group: full-krw-256-validator-clean-v003
  cancel-in-progress: false


# ============================================================
# 4. ENVIRONMENT
# ============================================================

env:

  PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor

  VALIDATOR_FILE: validate_256.py

  EXPECTED_MARKETS: "290"

  EXPECTED_TIMEFRAMES: "3"

  EXPECTED_JOBS: "870"

  EXPECTED_SOURCE_FILES: "2610"

  CHECKPOINT_FILE: data\validation\validate_256_checkpoint.json

  STATUS_FILE: data\validate_256_status.csv


# ============================================================
# 5. JOB
# ============================================================

jobs:

  validate-256-full:

    name: Full KRW 256 Validator Clean V003

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 360

    defaults:

      run:

        shell: powershell


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Environment
      # ======================================================

      - name: Show validation environment

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "FULL KRW 256 VALIDATOR - CLEAN V003"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  Name         : $env:RUNNER_NAME"
          Write-Host "  OS           : $env:RUNNER_OS"
          Write-Host "  Architecture : $env:RUNNER_ARCH"
          Write-Host ""

          Write-Host "Project:"
          Write-Host "  ${{ env.PROJECT_DIR }}"
          Write-Host ""

          Write-Host "Validator:"
          Write-Host "  ${{ env.VALIDATOR_FILE }}"
          Write-Host ""

          Write-Host "Expected:"
          Write-Host "  Markets      : ${{ env.EXPECTED_MARKETS }}"
          Write-Host "  Timeframes   : ${{ env.EXPECTED_TIMEFRAMES }}"
          Write-Host "  Jobs         : ${{ env.EXPECTED_JOBS }}"
          Write-Host "  Source files : ${{ env.EXPECTED_SOURCE_FILES }}"
          Write-Host ""

          Write-Host "Timeframes:"
          Write-Host "  h1"
          Write-Host "  h4"
          Write-Host "  d1"
          Write-Host ""

          Write-Host "Resume:"
          Write-Host "  Checkpoint   : ${{ env.CHECKPOINT_FILE }}"
          Write-Host "  Status       : ${{ env.STATUS_FILE }}"
          Write-Host "  SHA256 aware : ENABLED"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  OHLCV write       : DISABLED"
          Write-Host "  Feature write     : DISABLED"
          Write-Host "  Signal write      : DISABLED"
          Write-Host "  Future labels     : DISABLED"
          Write-Host "  Prediction        : DISABLED"
          Write-Host "  Trading           : DISABLED"
          Write-Host "  Git reset         : DISABLED"
          Write-Host "  Git clean         : DISABLED"
          Write-Host "  Git commit        : DISABLED"
          Write-Host "  Git push          : DISABLED"
          Write-Host ""

          Write-Host "[PASS] Environment displayed."


      # ======================================================
      # STEP 2
      # Project directory
      # ======================================================

      - name: Verify project directory

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PROJECT DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $projectRoot `
                  -PathType Container
          )) {

              Write-Host "[FAIL] Project directory not found:"
              Write-Host "       $projectRoot"

              exit 1
          }

          Set-Location $projectRoot

          if (-not (
              Test-Path `
                  -LiteralPath ".git" `
                  -PathType Container
          )) {

              Write-Host "[FAIL] Git repository not found:"
              Write-Host "       $projectRoot"

              exit 1
          }

          Write-Host "Project root:"
          Write-Host "  $projectRoot"
          Write-Host ""

          Write-Host "[PASS] Project directory verified."


      # ======================================================
      # STEP 3
      # Git synchronization
      #
      # IMPORTANT:
      #
      # No reset.
      # No clean.
      #
      # Local data and checkpoint must survive.
      # ======================================================

      - name: Synchronize repository safely

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE REPOSITORY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Git status before synchronization:"
          Write-Host ""

          git status --short

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git status failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Fetching origin/main..."
          Write-Host ""

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git fetch origin main failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Checking out main..."
          Write-Host ""

          git checkout main

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git checkout main failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Fast-forward pull..."
          Write-Host ""

          git pull --ff-only origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] git pull --ff-only failed."
              Write-Host ""
              Write-Host "[SAFETY] git reset was NOT executed."
              Write-Host "[SAFETY] git clean was NOT executed."
              Write-Host "[SAFETY] Runtime/checkpoint data was NOT deleted."

              exit 1
          }

          Write-Host ""
          Write-Host "Current commit:"
          Write-Host ""

          git rev-parse --short HEAD

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] Could not read current commit."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Repository synchronized safely."


      # ======================================================
      # STEP 4
      # Python
      # ======================================================

      - name: Verify Python

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Windows Python launcher 'py' is unavailable."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python available."


      # ======================================================
      # STEP 5
      # Dependencies
      # ======================================================

      - name: Verify Python dependencies

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON DEPENDENCIES"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath "requirements.txt" `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] requirements.txt not found."

              exit 1
          }

          py -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Dependency installation failed."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies verified."


      # ======================================================
      # STEP 6
      # Validator source
      # ======================================================

      - name: Verify Clean V003 validator source

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          $validatorPath = Join-Path `
              $projectRoot `
              "${{ env.VALIDATOR_FILE }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATOR SOURCE"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $validatorPath `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] Validator not found:"
              Write-Host "       $validatorPath"

              exit 1
          }

          $validatorInfo = Get-Item `
              -LiteralPath $validatorPath

          if ($validatorInfo.Length -le 0) {

              Write-Host "[FAIL] Validator file is empty."

              exit 1
          }

          $source = Get-Content `
              -LiteralPath $validatorPath `
              -Raw

          $requiredMarkers = @(

              "Clean V003",
              "Full KRW market validation",
              "Resume / checkpoint support",
              "CHECKPOINT_PATH",
              "checkpoint_job_is_current",
              "mark_checkpoint_passed",
              "discover_markets"

          )

          $missingMarkers = @()

          foreach ($marker in $requiredMarkers) {

              if (-not $source.Contains($marker)) {

                  $missingMarkers += $marker
              }
          }

          if ($missingMarkers.Count -gt 0) {

              Write-Host "[FAIL] validate_256.py does not appear to be Clean V003."
              Write-Host ""

              foreach ($marker in $missingMarkers) {

                  Write-Host "Missing marker:"
                  Write-Host "  $marker"
              }

              exit 1
          }

          Write-Host "Validator:"
          Write-Host "  $validatorPath"
          Write-Host ""

          Write-Host "Size:"
          Write-Host "  $($validatorInfo.Length) bytes"
          Write-Host ""

          Write-Host "[PASS] validate_256.py Clean V003 markers verified."


      # ======================================================
      # STEP 7
      # Required directories
      # ======================================================

      - name: Verify validation directories

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATION DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $requiredDirectories = @(

              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1",

              "data\features\h1",
              "data\features\h4",
              "data\features\d1",

              "data\signals\256\h1",
              "data\signals\256\h4",
              "data\signals\256\d1"

          )

          $failed = $false

          foreach ($relativePath in $requiredDirectories) {

              $fullPath = Join-Path `
                  $projectRoot `
                  $relativePath

              if (
                  Test-Path `
                      -LiteralPath $fullPath `
                      -PathType Container
              ) {

                  Write-Host "[PASS] $relativePath"

              }
              else {

                  Write-Host "[FAIL] $relativePath"

                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Validation directory structure incomplete."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Required validation directories verified."


      # ======================================================
      # STEP 8
      # Verify exact market sets
      #
      # 290 markets must exist in:
      #
      #   OHLCV
      #   Feature
      #   Signal
      #
      # for:
      #
      #   h1
      #   h4
      #   d1
      #
      # ======================================================

      - name: Verify full 290 market input sets

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          $expectedMarkets = [int]"${{ env.EXPECTED_MARKETS }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FULL 290 MARKET INPUT SETS"
          Write-Host "============================================================"
          Write-Host ""

          $referenceMarkets = $null

          $totalOhlcv = 0
          $totalFeature = 0
          $totalSignal = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              Write-Host "------------------------------------------------------------"
              Write-Host "[$($tf.ToUpper())]"
              Write-Host "------------------------------------------------------------"

              $ohlcvDir = Join-Path `
                  $projectRoot `
                  "data\ohlcv\$tf"

              $featureDir = Join-Path `
                  $projectRoot `
                  "data\features\$tf"

              $signalDir = Join-Path `
                  $projectRoot `
                  "data\signals\256\$tf"

              $ohlcvFiles = @(
                  Get-ChildItem `
                      -LiteralPath $ohlcvDir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              $featureFiles = @(
                  Get-ChildItem `
                      -LiteralPath $featureDir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              $signalFiles = @(
                  Get-ChildItem `
                      -LiteralPath $signalDir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              $ohlcvMarkets = @(
                  $ohlcvFiles |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              $featureMarkets = @(
                  $featureFiles |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              $signalMarkets = @(
                  $signalFiles |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              Write-Host "OHLCV markets   : $($ohlcvMarkets.Count)"
              Write-Host "Feature markets : $($featureMarkets.Count)"
              Write-Host "Signal markets  : $($signalMarkets.Count)"
              Write-Host ""

              if ($ohlcvMarkets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf OHLCV market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($ohlcvMarkets.Count)"

                  exit 1
              }

              if ($featureMarkets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf Feature market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($featureMarkets.Count)"

                  exit 1
              }

              if ($signalMarkets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf Signal market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($signalMarkets.Count)"

                  exit 1
              }

              $ohlcvFeatureDiff = @(
                  Compare-Object `
                      -ReferenceObject $ohlcvMarkets `
                      -DifferenceObject $featureMarkets
              )

              if ($ohlcvFeatureDiff.Count -gt 0) {

                  Write-Host "[FAIL] $tf OHLCV and Feature market sets differ."
                  Write-Host ""

                  $ohlcvFeatureDiff |
                      Format-Table -AutoSize

                  exit 1
              }

              $ohlcvSignalDiff = @(
                  Compare-Object `
                      -ReferenceObject $ohlcvMarkets `
                      -DifferenceObject $signalMarkets
              )

              if ($ohlcvSignalDiff.Count -gt 0) {

                  Write-Host "[FAIL] $tf OHLCV and Signal market sets differ."
                  Write-Host ""

                  $ohlcvSignalDiff |
                      Format-Table -AutoSize

                  exit 1
              }

              if ($null -eq $referenceMarkets) {

                  $referenceMarkets = @(
                      $ohlcvMarkets
                  )

              }
              else {

                  $timeframeDiff = @(
                      Compare-Object `
                          -ReferenceObject $referenceMarkets `
                          -DifferenceObject $ohlcvMarkets
                  )

                  if ($timeframeDiff.Count -gt 0) {

                      Write-Host "[FAIL] Market sets differ between timeframes."
                      Write-Host ""

                      $timeframeDiff |
                          Format-Table -AutoSize

                      exit 1
                  }
              }

              $totalOhlcv += $ohlcvFiles.Count
              $totalFeature += $featureFiles.Count
              $totalSignal += $signalFiles.Count

              Write-Host "[PASS] $tf market sets match."
              Write-Host ""
          }

          $expectedJobs = [int]"${{ env.EXPECTED_JOBS }}"

          Write-Host "============================================================"
          Write-Host "INPUT FILE SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "OHLCV files   : $totalOhlcv"
          Write-Host "Feature files : $totalFeature"
          Write-Host "Signal files  : $totalSignal"
          Write-Host ""

          if ($totalOhlcv -ne $expectedJobs) {

              Write-Host "[FAIL] OHLCV file count mismatch."

              exit 1
          }

          if ($totalFeature -ne $expectedJobs) {

              Write-Host "[FAIL] Feature file count mismatch."

              exit 1
          }

          if ($totalSignal -ne $expectedJobs) {

              Write-Host "[FAIL] Signal file count mismatch."

              exit 1
          }

          Write-Host "[PASS] 290 markets verified."
          Write-Host "[PASS] 870 OHLCV files verified."
          Write-Host "[PASS] 870 Feature files verified."
          Write-Host "[PASS] 870 Signal files verified."


      # ======================================================
      # STEP 9
      # Verify non-empty files
      # ======================================================

      - name: Verify all 2610 source files are non-empty

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          $expectedSourceFiles = [int]"${{ env.EXPECTED_SOURCE_FILES }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY SOURCE FILE CONTENT"
          Write-Host "============================================================"
          Write-Host ""

          $checked = 0
          $empty = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              foreach ($relativeDirectory in @(

                  "data\ohlcv\$tf",
                  "data\features\$tf",
                  "data\signals\256\$tf"

              )) {

                  $directory = Join-Path `
                      $projectRoot `
                      $relativeDirectory

                  $files = @(
                      Get-ChildItem `
                          -LiteralPath $directory `
                          -Filter "KRW-*.csv" `
                          -File
                  )

                  foreach ($file in $files) {

                      $checked++

                      if ($file.Length -le 0) {

                          Write-Host "[FAIL] Empty source file:"
                          Write-Host "       $($file.FullName)"

                          $empty++
                      }
                  }
              }
          }

          Write-Host "Files checked : $checked"
          Write-Host "Expected      : $expectedSourceFiles"
          Write-Host "Empty         : $empty"
          Write-Host ""

          if ($checked -ne $expectedSourceFiles) {

              Write-Host "[FAIL] Source file count mismatch."

              exit 1
          }

          if ($empty -ne 0) {

              Write-Host "[FAIL] Empty source files detected."

              exit 1
          }

          Write-Host "[PASS] All 2,610 source files are non-empty."


      # ======================================================
      # STEP 10
      # Record SHA256 before validation
      #
      # This snapshot is independent from the Python
      # validator's per-job resume hashes.
      #
      # Purpose:
      #
      #   prove validation did not modify input data.
      # ======================================================

      - name: Record source SHA256 before validation

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          $expectedSourceFiles = [int]"${{ env.EXPECTED_SOURCE_FILES }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD SOURCE SHA256 BEFORE VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotPath = Join-Path `
              $env:RUNNER_TEMP `
              "validate_256_v003_before.sha256"

          if (Test-Path -LiteralPath $snapshotPath) {

              Remove-Item `
                  -LiteralPath $snapshotPath `
                  -Force
          }

          $records = New-Object `
              System.Collections.Generic.List[string]

          foreach ($tf in @("h1", "h4", "d1")) {

              foreach ($relativeDirectory in @(

                  "data\ohlcv\$tf",
                  "data\features\$tf",
                  "data\signals\256\$tf"

              )) {

                  $directory = Join-Path `
                      $projectRoot `
                      $relativeDirectory

                  $files = @(
                      Get-ChildItem `
                          -LiteralPath $directory `
                          -Filter "KRW-*.csv" `
                          -File |
                      Sort-Object Name
                  )

                  foreach ($file in $files) {

                      $hash = (
                          Get-FileHash `
                              -LiteralPath $file.FullName `
                              -Algorithm SHA256
                      ).Hash

                      $relativePath = Join-Path `
                          $relativeDirectory `
                          $file.Name

                      $records.Add(
                          "$relativePath|$hash"
                      )
                  }
              }
          }

          if ($records.Count -ne $expectedSourceFiles) {

              Write-Host "[FAIL] SHA256 snapshot record count mismatch."
              Write-Host "       Expected: $expectedSourceFiles"
              Write-Host "       Actual  : $($records.Count)"

              exit 1
          }

          $records |
              Set-Content `
                  -LiteralPath $snapshotPath `
                  -Encoding UTF8

          Write-Host "SHA256 records:"
          Write-Host "  $($records.Count)"
          Write-Host ""

          Write-Host "[PASS] Pre-validation SHA256 snapshot created."


      # ======================================================
      # STEP 11
      # Resume state
      #
      # DO NOT delete checkpoint.
      # ======================================================

      - name: Inspect persistent validator checkpoint

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          $checkpointPath = Join-Path `
              $projectRoot `
              "${{ env.CHECKPOINT_FILE }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATOR RESUME CHECK"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Checkpoint:"
          Write-Host "  $checkpointPath"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $checkpointPath `
                  -PathType Leaf
          )) {

              Write-Host "[INFO] No checkpoint exists."
              Write-Host "[INFO] Clean V003 will start normal validation."
              Write-Host "[INFO] PASS jobs will be checkpointed one by one."
              Write-Host ""

              Write-Host "[PASS] Fresh validation state."

              exit 0
          }

          $checkpointInfo = Get-Item `
              -LiteralPath $checkpointPath

          Write-Host "Existing checkpoint detected."
          Write-Host "Size:"
          Write-Host "  $($checkpointInfo.Length) bytes"
          Write-Host ""

          if ($checkpointInfo.Length -le 0) {

              Write-Host "[WARN] Existing checkpoint is empty."
              Write-Host "[WARN] Python validator will decide whether it can be trusted."
              Write-Host ""

              exit 0
          }

          try {

              $checkpoint = Get-Content `
                  -LiteralPath $checkpointPath `
                  -Raw |
                  ConvertFrom-Json

          }
          catch {

              Write-Host "[WARN] Checkpoint JSON could not be parsed by workflow."
              Write-Host "[WARN] validate_256.py Clean V003 will ignore invalid checkpoint safely."
              Write-Host ""

              exit 0
          }

          $completedCount = 0

          if ($null -ne $checkpoint.completed) {

              $completedCount = @(
                  $checkpoint.completed.PSObject.Properties
              ).Count
          }

          Write-Host "Checkpoint version:"
          Write-Host "  $($checkpoint.checkpoint_version)"
          Write-Host ""

          Write-Host "Recorded completed jobs:"
          Write-Host "  $completedCount"
          Write-Host ""

          Write-Host "Updated UTC:"
          Write-Host "  $($checkpoint.updated_utc)"
          Write-Host ""

          Write-Host "[PASS] Existing checkpoint preserved."
          Write-Host "[INFO] Clean V003 will verify SHA256 before each resume skip."


      # ======================================================
      # STEP 12
      # Run validator
      #
      # IMPORTANT:
      #
      # No --market KRW-BTC.
      #
      # Clean V003 automatically discovers the full KRW
      # market set.
      #
      # ======================================================

      - name: Run Full KRW 256 Validator Clean V003

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN FULL KRW 256 VALIDATOR - CLEAN V003"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Target:"
          Write-Host "  Markets    : ${{ env.EXPECTED_MARKETS }}"
          Write-Host "  Timeframes : h1 / h4 / d1"
          Write-Host "  Jobs       : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          Write-Host "Resume:"
          Write-Host "  ENABLED"
          Write-Host ""

          Write-Host "Starting:"
          Write-Host "  py ${{ env.VALIDATOR_FILE }}"
          Write-Host ""

          py "${{ env.VALIDATOR_FILE }}"

          $validatorExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code:"
          Write-Host "  $validatorExitCode"
          Write-Host ""

          if ($validatorExitCode -ne 0) {

              Write-Host "[FAIL] validate_256.py Clean V003 did not complete successfully."
              Write-Host ""
              Write-Host "[IMPORTANT]"
              Write-Host "  Successful jobs already checkpointed remain preserved."
              Write-Host "  Failed jobs are not considered complete."
              Write-Host "  Re-running this workflow will resume safely."
              Write-Host ""
              Write-Host "[STOP] Do NOT proceed to the next project stage."

              exit $validatorExitCode
          }

          Write-Host "[PASS] validate_256.py Clean V003 completed successfully."


      # ======================================================
      # STEP 13
      # Verify final checkpoint
      # ======================================================

      - name: Verify completed 870-job checkpoint

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          $expectedMarkets = [int]"${{ env.EXPECTED_MARKETS }}"
          $expectedJobs = [int]"${{ env.EXPECTED_JOBS }}"

          Set-Location $projectRoot

          $checkpointPath = Join-Path `
              $projectRoot `
              "${{ env.CHECKPOINT_FILE }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FINAL VALIDATOR CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $checkpointPath `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] Final checkpoint does not exist."

              exit 1
          }

          try {

              $checkpoint = Get-Content `
                  -LiteralPath $checkpointPath `
                  -Raw |
                  ConvertFrom-Json

          }
          catch {

              Write-Host "[FAIL] Final checkpoint JSON is invalid."

              exit 1
          }

          $completedCount = 0

          if ($null -ne $checkpoint.completed) {

              $completedCount = @(
                  $checkpoint.completed.PSObject.Properties
              ).Count
          }

          Write-Host "Checkpoint version       : $($checkpoint.checkpoint_version)"
          Write-Host "Validator version        : $($checkpoint.validator_version)"
          Write-Host "Completed records        : $completedCount"
          Write-Host "Full validation passed   : $($checkpoint.full_validation_passed)"
          Write-Host "Market count             : $($checkpoint.market_count)"
          Write-Host "Job count                : $($checkpoint.job_count)"
          Write-Host ""

          if ($completedCount -ne $expectedJobs) {

              Write-Host "[FAIL] Completed checkpoint job count mismatch."
              Write-Host "       Expected: $expectedJobs"
              Write-Host "       Actual  : $completedCount"

              exit 1
          }

          if ($checkpoint.full_validation_passed -ne $true) {

              Write-Host "[FAIL] full_validation_passed is not true."

              exit 1
          }

          if ([int]$checkpoint.market_count -ne $expectedMarkets) {

              Write-Host "[FAIL] Final market count mismatch."

              exit 1
          }

          if ([int]$checkpoint.job_count -ne $expectedJobs) {

              Write-Host "[FAIL] Final job count mismatch."

              exit 1
          }

          Write-Host "[PASS] Final checkpoint confirms 870 successful jobs."


      # ======================================================
      # STEP 14
      # Verify status CSV
      # ======================================================

      - name: Verify validator status CSV

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          $expectedJobs = [int]"${{ env.EXPECTED_JOBS }}"

          Set-Location $projectRoot

          $statusPath = Join-Path `
              $projectRoot `
              "${{ env.STATUS_FILE }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATOR STATUS CSV"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $statusPath `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] Validator status CSV not found:"
              Write-Host "       $statusPath"

              exit 1
          }

          $rows = @(
              Import-Csv `
                  -LiteralPath $statusPath
          )

          Write-Host "Status rows:"
          Write-Host "  $($rows.Count)"
          Write-Host ""

          if ($rows.Count -ne $expectedJobs) {

              Write-Host "[FAIL] Status CSV row count mismatch."
              Write-Host "       Expected: $expectedJobs"
              Write-Host "       Actual  : $($rows.Count)"

              exit 1
          }

          $failedRows = @(
              $rows |
              Where-Object {
                  $_.passed -notmatch '^(True|true|1)$'
              }
          )

          if ($failedRows.Count -gt 0) {

              Write-Host "[FAIL] Failed validation records found:"
              Write-Host "       $($failedRows.Count)"
              Write-Host ""

              $failedRows |
                  Select-Object `
                      market,
                      timeframe,
                      passed,
                      errors |
                  Format-Table -AutoSize

              exit 1
          }

          $markets = @(
              $rows.market |
              Sort-Object -Unique
          )

          $timeframes = @(
              $rows.timeframe |
              Sort-Object -Unique
          )

          Write-Host "Unique markets:"
          Write-Host "  $($markets.Count)"
          Write-Host ""

          Write-Host "Timeframes:"
          Write-Host "  $($timeframes -join ', ')"
          Write-Host ""

          if ($markets.Count -ne 290) {

              Write-Host "[FAIL] Status CSV market count is not 290."

              exit 1
          }

          if ($timeframes.Count -ne 3) {

              Write-Host "[FAIL] Status CSV timeframe count is not 3."

              exit 1
          }

          Write-Host "[PASS] 870 / 870 status records passed."


      # ======================================================
      # STEP 15
      # Verify SHA256 after validation
      #
      # Runs even if validator fails.
      #
      # ======================================================

      - name: Verify source SHA256 after validation

        if: always()

        run: |

          $ErrorActionPreference = "Stop"

          $projectRoot = "${{ env.PROJECT_DIR }}"

          $expectedSourceFiles = [int]"${{ env.EXPECTED_SOURCE_FILES }}"

          Set-Location $projectRoot

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY SOURCE SHA256 AFTER VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotPath = Join-Path `
              $env:RUNNER_TEMP `
              "validate_256_v003_before.sha256"

          if (-not (
              Test-Path `
                  -LiteralPath $snapshotPath `
                  -PathType Leaf
          )) {

              Write-Host "[FAIL] Pre-validation SHA256 snapshot not found."

              exit 1
          }

          $passed = 0
          $failed = 0

          $records = @(
              Get-Content `
                  -LiteralPath $snapshotPath
          )

          foreach ($record in $records) {

              if ([string]::IsNullOrWhiteSpace($record)) {

                  continue
              }

              $parts = $record -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid SHA256 record:"
                  Write-Host "       $record"

                  $failed++

                  continue
              }

              $relativePath = $parts[0]
              $beforeHash = $parts[1].Trim()

              $fullPath = Join-Path `
                  $projectRoot `
                  $relativePath

              if (-not (
                  Test-Path `
                      -LiteralPath $fullPath `
                      -PathType Leaf
              )) {

                  Write-Host "[FAIL] Source file disappeared:"
                  Write-Host "       $relativePath"

                  $failed++

                  continue
              }

              $afterHash = (
                  Get-FileHash `
                      -LiteralPath $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($beforeHash -ne $afterHash) {

                  Write-Host "[FAIL] Source SHA256 changed:"
                  Write-Host "       $relativePath"

                  $failed++

              }
              else {

                  $passed++
              }
          }

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host "  Passed : $passed"
          Write-Host "  Failed : $failed"
          Write-Host ""

          if ($failed -ne 0) {

              Write-Host "[FAIL] Source data changed during validation."

              exit 1
          }

          if ($passed -ne $expectedSourceFiles) {

              Write-Host "[FAIL] SHA256 verification count mismatch."
              Write-Host "       Expected: $expectedSourceFiles"
              Write-Host "       Actual  : $passed"

              exit 1
          }

          Write-Host "[PASS] All 2,610 source files remained unchanged."


      # ======================================================
      # STEP 16
      # Git safety
      #
      # Runtime/checkpoint files should be ignored by Git.
      #
      # DO NOT delete anything.
      # ======================================================

      - name: Verify Git safety

        if: always()

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY GIT SAFETY"
          Write-Host "============================================================"
          Write-Host ""

          $status = @(
              git status `
                  --short `
                  --untracked-files=all
          )

          if ($LASTEXITCODE -ne 0) {

              Write-Host "[FAIL] git status failed."

              exit 1
          }

          if ($status.Count -eq 0) {

              Write-Host "[PASS] No Git-visible changes detected."

              exit 0
          }

          Write-Host "Git-visible changes detected:"
          Write-Host ""

          foreach ($line in $status) {

              Write-Host $line
          }

          Write-Host ""
          Write-Host "[FAIL] Validator created or modified Git-visible files."
          Write-Host ""
          Write-Host "[SAFETY] Nothing was automatically deleted."
          Write-Host "[SAFETY] git reset was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."
          Write-Host ""
          Write-Host "Checkpoint/status runtime files should be ignored by .gitignore."

          exit 1


      # ======================================================
      # STEP 17
      # Final summary
      # ======================================================

      - name: Full KRW 256 Validator summary

        if: success()

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FULL KRW 256 VALIDATOR SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project          : Upbit Surge Monitor"
          Write-Host "Version          : 256 Validator Clean V003"
          Write-Host "Execution mode   : FULL KRW MARKET"
          Write-Host ""

          Write-Host "Markets          : ${{ env.EXPECTED_MARKETS }}"
          Write-Host "Timeframes       : ${{ env.EXPECTED_TIMEFRAMES }}"
          Write-Host "Validator jobs   : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          Write-Host "Input:"
          Write-Host "  OHLCV          : 870 files"
          Write-Host "  Feature        : 870 files"
          Write-Host "  Signal         : 870 files"
          Write-Host "  Total          : 2,610 files"
          Write-Host ""

          Write-Host "Resume:"
          Write-Host "  Checkpoint     : ENABLED"
          Write-Host "  Per-job save   : ENABLED"
          Write-Host "  SHA256 verify  : ENABLED"
          Write-Host "  PASS skip      : ENABLED"
          Write-Host "  Changed rerun  : ENABLED"
          Write-Host "  Failed retry   : ENABLED"
          Write-Host ""

          Write-Host "Integrity:"
          Write-Host "  OHLCV          : VERIFIED / UNCHANGED"
          Write-Host "  Feature        : VERIFIED / UNCHANGED"
          Write-Host "  Signal         : VERIFIED / UNCHANGED"
          Write-Host "  Source SHA256  : VERIFIED"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Collector      : DISABLED"
          Write-Host "  Backfill       : DISABLED"
          Write-Host "  Feature rebuild: DISABLED"
          Write-Host "  Detector rebuild: DISABLED"
          Write-Host "  Future labels  : DISABLED"
          Write-Host "  Prediction     : DISABLED"
          Write-Host "  Trading        : DISABLED"
          Write-Host "  Git reset      : DISABLED"
          Write-Host "  Git clean      : DISABLED"
          Write-Host "  Git commit     : DISABLED"
          Write-Host "  Git push       : DISABLED"
          Write-Host ""

          Write-Host "============================================================"
          Write-Host "[RESULT] FULL KRW 256 VALIDATOR CLEAN V003 PASSED"
          Write-Host "[PASS] 290 markets verified."
          Write-Host "[PASS] 870 / 870 validator jobs passed."
          Write-Host "[PASS] Resume/checkpoint integrity verified."
          Write-Host "[PASS] 2,610 source files remained unchanged."
          Write-Host "[PASS] 256 Detector output validation completed."
          Write-Host "[NEXT] Review results and continue to the next research stage."
          Write-Host "============================================================"
