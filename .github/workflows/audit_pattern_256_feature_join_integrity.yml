name: audit_pattern_256_feature_join_integrity.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-pattern-256-feature-join-integrity
  cancel-in-progress: false

jobs:
  feature-join-integrity:
    name: feature-join-integrity

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      SCRIPT_NAME: audit_pattern_256_feature_join_integrity.py
      REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_feature_join_integrity'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python validation failed"
          }

      - name: Validate analysis script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing analysis script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          Write-Host "PASS: Python syntax"

      - name: Validate source directories
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_train_only"

          $joinDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_train_feature_join"

          $shardDir = Join-Path `
            $joinDir `
            "shards"

          foreach ($path in @(
            $sourceDir,
            $joinDir,
            $shardDir
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing directory: $path"
            }

            Write-Host "FOUND: $path"
          }

          $shards = @(
            Get-ChildItem `
              -LiteralPath $shardDir `
              -Filter "*.csv" `
              -File `
              -Recurse
          )

          if ($shards.Count -eq 0) {
            throw "No JOIN shard CSV files found"
          }

          Write-Host "JOIN shards: $($shards.Count)"

      - name: Run feature JOIN integrity audit
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script `
            --root "$env:DATA_ROOT" `
            --expected-source-rows 4164988 `
            --expected-joined-rows 3336652

          if ($LASTEXITCODE -ne 0) {
            throw "Feature JOIN integrity audit failed"
          }

      - name: Verify audit output SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $dir = $env:REPORT_DIR

          $resultPath = Join-Path `
            $dir `
            "feature_join_integrity_result.json"

          $manifestPath = Join-Path `
            $dir `
            "feature_join_integrity_manifest.json"

          $coveragePath = Join-Path `
            $dir `
            "feature_join_integrity_coverage.csv"

          $issuesPath = Join-Path `
            $dir `
            "feature_join_integrity_issues.csv"

          foreach ($path in @(
            $resultPath,
            $manifestPath,
            $coveragePath,
            $issuesPath
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing audit output: $path"
            }
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Unexpected result version"
          }

          if ($manifest.version -ne "Clean V001") {
            throw "Unexpected manifest version"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Audit execution did not complete"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected live trading approval"
          }

          if ($result.train_experiment_approved -ne $false) {
            throw "Unexpected TRAIN experiment approval"
          }

          $files = @(
            "feature_join_integrity_result.json",
            "feature_join_integrity_coverage.csv",
            "feature_join_integrity_issues.csv"
          )

          foreach ($filename in $files) {

            $path = Join-Path $dir $filename

            $expected = [string](
              $manifest.output_sha256.$filename
            )

            if (
              [string]::IsNullOrWhiteSpace($expected) -or
              $expected -notmatch '^[0-9a-fA-F]{64}$'
            ) {
              throw "Invalid manifest SHA256: $filename"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $filename"
            }

            Write-Host "PASS: $filename"
          }

          $coverage = @(
            Import-Csv -LiteralPath $coveragePath
          )

          $issues = @(
            Import-Csv -LiteralPath $issuesPath
          )

          if ($coverage.Count -ne $result.shard_files) {
            throw "Shard coverage row count mismatch"
          }

          if (
            $result.errors -ne @(
              $issues | Where-Object {
                $_.severity -eq "ERROR"
              }
            ).Count
          ) {
            throw "Error count mismatch"
          }

          if (
            $result.warnings -ne @(
              $issues | Where-Object {
                $_.severity -eq "WARNING"
              }
            ).Count
          ) {
            throw "Warning count mismatch"
          }

          Write-Host "PASS: output SHA256"
          Write-Host "PASS: coverage row count"
          Write-Host "PASS: issue count consistency"
          Write-Host "PASS: research HOLD"

      - name: Write job summary
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:REPORT_DIR `
            "feature_join_integrity_result.json"

          if (-not (Test-Path -LiteralPath $resultPath)) {
            @"
          # Pattern 256 Feature JOIN Integrity Audit

          Audit result file was not generated.

          Check the workflow execution logs.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

            exit 0
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          @"
          # Pattern 256 Feature JOIN Integrity Audit

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Version | $($result.version) |
          | Source rows | $($result.source_rows) |
          | Joined rows | $($result.joined_rows) |
          | Unjoined rows | $($result.unjoined_rows) |
          | Join rate (%) | $($result.join_rate_pct) |
          | Shard files | $($result.shard_files) |
          | Schema variants | $($result.schema_variants) |
          | Duplicate JOIN keys | $($result.duplicate_join_keys) |
          | Unmatched JOIN rows | $($result.unmatched_join_rows) |
          | Row-level reconciliation proven | $($result.row_level_reconciliation_proven) |
          | Integrity verified | $($result.integrity_verified) |
          | Errors | $($result.errors) |
          | Warnings | $($result.warnings) |
          | Research decision | $($result.research_decision) |
          | TRAIN experiment approved | $($result.train_experiment_approved) |
          | Independent OOS proven | $($result.independent_oos_proven) |
          | Live trading approved | $($result.approved_for_live_trading) |

          ## Limitations

          - SHA256 does not prove feature correctness.
          - Timestamp checks cover recognized columns only.
          - Point-in-time feature semantics require separate verification.
          - Missing values and selection bias require additional checks.
          - No automated trading is enabled.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload integrity audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-feature-join-integrity-v001
          path: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_feature_join_integrity\'
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce audit gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Audit execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Audit output verification failed"
          }

          $resultPath = Join-Path `
            $env:REPORT_DIR `
            "feature_join_integrity_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($result.errors -gt 0) {
            throw "Audit detected integrity errors"
          }

          if ($result.integrity_verified -ne $true) {
            Write-Warning (
              "Integrity is not fully verified. " +
              "Research remains HOLD."
            )
          }

          Write-Host "Audit execution and output checks completed"
