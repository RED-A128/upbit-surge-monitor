      - name: 23 - Cross-check production research outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CROSS-CHECK PRODUCTION RESEARCH OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE"

          $resultPath = Join-Path `
              $reportDir `
              $env:RESULT_FILE

          $summaryPath = Join-Path `
              $reportDir `
              $env:SUMMARY_FILE

          $detailPath = Join-Path `
              $reportDir `
              $env:DETAIL_FILE

          $candidatePath = Join-Path `
              $reportDir `
              $env:CANDIDATE_FILE

          @'
          import csv
          import json
          import pathlib
          import sys

          result_path = pathlib.Path(sys.argv[1])
          summary_path = pathlib.Path(sys.argv[2])
          detail_path = pathlib.Path(sys.argv[3])
          candidate_path = pathlib.Path(sys.argv[4])

          with result_path.open(
              "r",
              encoding="utf-8-sig",
          ) as f:
              result = json.load(f)

          with summary_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as f:
              summary = list(
                  csv.DictReader(f)
              )

          with detail_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as f:
              detail = list(
                  csv.DictReader(f)
              )

          with candidate_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as f:
              candidates = list(
                  csv.DictReader(f)
              )

          statistics = result.get(
              "statistics",
              {},
          )

          result_total = int(
              statistics.get(
                  "total_rows",
                  -1,
              )
          )

          result_candidates = int(
              statistics.get(
                  "candidate_rows",
                  -1,
              )
          )

          summary_total = sum(
              int(
                  float(
                      row.get("rows") or 0
                  )
              )
              for row in summary
          )

          summary_candidates = sum(
              int(
                  float(
                      row.get(
                          "candidate_rows"
                      ) or 0
                  )
              )
              for row in summary
          )

          detail_total = len(
              detail
          )

          detail_candidates = sum(
              1
              for row in detail
              if str(
                  row.get(
                      "pattern_256_candidate",
                      "",
                  )
              ).strip().lower()
              == "true"
          )

          candidate_total = len(
              candidates
          )

          checks = (
              (
                  result_total == summary_total,
                  "result total != summary total",
              ),
              (
                  result_total == detail_total,
                  "result total != detail total",
              ),
              (
                  result_candidates
                  == summary_candidates,
                  "result candidates != summary candidates",
              ),
              (
                  result_candidates
                  == detail_candidates,
                  "result candidates != detail candidates",
              ),
              (
                  result_candidates
                  == candidate_total,
                  "result candidates != candidate CSV",
              ),
          )

          for passed, message in checks:

              if not passed:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          print("[PASS] Production output cross-check.")
          print(
              f"[PASS] Total rows: {result_total}"
          )
          print(
              f"[PASS] Candidates: {result_candidates}"
          )
          '@ |
              py - `
