# ============================================================
# Upbit Surge Monitor
# research_pattern_256.yml
# Clean V001
# ============================================================
#
# PURPOSE
# ------------------------------------------------------------
# Production execution of:
#
#   research_pattern_256.py - Clean V001
#
# This workflow runs the independently tested Pattern 256
# research against the production OHLCV dataset.
#
# IMPORTANT
# ------------------------------------------------------------
# This is:
#
#   - Pattern 256 independent quantitative research
#   - Production research execution
#   - READ ONLY against production OHLCV
#
# This is NOT:
#
#   - a final 256 formula
#   - a backtest
#   - a future 30% outcome validation
#   - a prediction model
#   - a trading signal
#   - automatic trading
#
# SAFETY
# ------------------------------------------------------------
# Production OHLCV MUST remain unchanged.
#
# This workflow verifies:
#
#   1. Production root
#   2. research_pattern_256.py
#   3. Python syntax
#   4. h1 / h4 / d1 OHLCV inventory
#   5. OHLCV file set BEFORE research
#   6. OHLCV SHA256 BEFORE research
#   7. Pattern 256 production research
#   8. OHLCV file set AFTER research
#   9. OHLCV SHA256 AFTER research
#  10. Result JSON
#  11. Research contract
#  12. Summary CSV
#  13. Detail CSV
#  14. Candidate CSV
#  15. Source manifest
#  16. Checkpoint
#  17. Result/summary/detail consistency
#  18. Final production gate
#
# This workflow MUST NOT:
#
#   - modify OHLCV
#   - delete OHLCV
#   - repair OHLCV
#   - download candles
#   - fabricate short history
#   - use future candles
#   - use negative shift
#   - use centered rolling
#   - generate future labels
#   - generate future returns
#   - generate future 30% labels
#   - perform prediction
#   - perform trading
#   - git reset
#   - git clean
#   - git commit
#   - git push
#
# ============================================================


name: research_pattern_256.yml


# ============================================================
# 1. TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. CONCURRENCY
# ============================================================

concurrency:
  group: research_pattern_256_production
  cancel-in-progress: false


# ============================================================
# 4. JOB
# ============================================================

jobs:

  research_pattern_256:

    name: research_pattern_256.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

      PROGRAM_FILE: "research_pattern_256.py"
      EXPECTED_VERSION: "Clean V001"

      REPORT_NAMESPACE: "pattern_research_256"

      RESULT_FILE: "pattern_256_research_result.json"
      SUMMARY_FILE: "pattern_256_research_summary.csv"
      DETAIL_FILE: "pattern_256_research_detail.csv"
      CANDIDATE_FILE: "pattern_256_candidates.csv"
      MANIFEST_FILE: "pattern_256_source_manifest.csv"
      CONTRACT_FILE: "pattern_256_research_contract.json"
      README_FILE: "README.txt"

      CHECKPOINT_FILE: "research_pattern_256_checkpoint.json"


    steps:

      # ======================================================
      # 01
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      # ======================================================
      # 02
      # ======================================================

      - name: 02 - Show production environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PATTERN 256 PRODUCTION RESEARCH"
          Write-Host "CLEAN V001"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "Runner OS:"
          Write-Host "  $env:RUNNER_OS"

          Write-Host ""
          Write-Host "Python:"
          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python is unavailable."
          }


      # ======================================================
      # 03
      # ======================================================

      - name: 03 - Resolve production root
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RESOLVE PRODUCTION ROOT"
          Write-Host "============================================================"
          Write-Host ""

          $preferredRoot = "C:\Users\USER\Documents\upbit-surge-monitor"

          if (-not (
              Test-Path `
                  -LiteralPath $preferredRoot `
                  -PathType Container
          )) {
              throw "Production project root missing: $preferredRoot"
          }

          $ohlcvRoot = Join-Path `
              $preferredRoot `
              "data\ohlcv"

          if (-not (
              Test-Path `
                  -LiteralPath $ohlcvRoot `
                  -PathType Container
          )) {
              throw "Production OHLCV root missing: $ohlcvRoot"
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $path = Join-Path `
                  $ohlcvRoot `
                  $timeframe

              if (-not (
                  Test-Path `
                      -LiteralPath $path `
                      -PathType Container
              )) {
                  throw "Production timeframe directory missing: $path"
              }
          }

          $productionRoot = (
              Resolve-Path `
                  -LiteralPath $preferredRoot
          ).Path

          Write-Host "[PASS] Production project root:"
          Write-Host "  $productionRoot"

          Write-Host ""
          Write-Host "[PASS] Root source:"
          Write-Host "  user-documents"

          "PRODUCTION_ROOT=$productionRoot" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append


      # ======================================================
      # 04
      # ======================================================

      - name: 04 - Verify production research program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION RESEARCH PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $workspaceProgram = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          if (-not (
              Test-Path `
                  -LiteralPath $workspaceProgram `
                  -PathType Leaf
          )) {
              throw "Research program missing from checkout: $workspaceProgram"
          }

          $item = Get-Item `
              -LiteralPath $workspaceProgram

          if ($item.Length -le 0) {
              throw "Research program is empty."
          }

          Write-Host "[PASS] Program:"
          Write-Host "  $workspaceProgram"

          Write-Host ""
          Write-Host "Size:"
          Write-Host "  $($item.Length) bytes"


      # ======================================================
      # 05
      # ======================================================

      - name: 05 - Verify Clean V001 source contract
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY CLEAN V001 SOURCE CONTRACT"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          @'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          source = path.read_text(
              encoding="utf-8-sig"
          )

          required = (
              'PROGRAM_NAME = "research_pattern_256.py"',
              'VERSION = "Clean V001"',
              'STAGE = "PATTERN 256 INDEPENDENT RESEARCH"',
              'PATTERN_ID = "256"',
              'final_formula_defined',
              'future_candles_allowed',
              'negative_shift_allowed',
              'centered_rolling_allowed',
              'future_labels_generated',
              'future_returns_generated',
              'thirty_percent_label_generated',
              'source_sha256_unchanged',
          )

          missing = [
              marker
              for marker in required
              if marker not in source
          ]

          if missing:
              print("[FAIL] Missing required source markers:")

              for marker in missing:
                  print(f"  {marker}")

              raise SystemExit(1)

          print("[PASS] Clean V001 source contract.")
          '@ |
              py - "$program"

          if ($LASTEXITCODE -ne 0) {
              throw "Clean V001 source contract validation failed."
          }


      # ======================================================
      # 06
      # ======================================================

      - name: 06 - Python syntax compile
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX COMPILE"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
              throw "Python syntax compilation failed."
          }

          Write-Host "[PASS] Python syntax compilation succeeded."


      # ======================================================
      # 07
      # ======================================================

      - name: 07 - Verify production OHLCV inventory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"
          Write-Host ""

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $total = 0

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $base `
                  $timeframe

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv"
              )

              if ($files.Count -le 0) {
                  throw "No OHLCV CSV files found: $directory"
              }

              $total += $files.Count

              Write-Host "[PASS] $timeframe"
              Write-Host "  CSV files: $($files.Count)"
          }

          if ($total -le 0) {
              throw "Production OHLCV inventory is empty."
          }

          Write-Host ""
          Write-Host "[PASS] Total OHLCV CSV files:"
          Write-Host "  $total"


      # ======================================================
      # 08
      # ======================================================

      - name: 08 - Record production OHLCV BEFORE snapshot
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD PRODUCTION OHLCV BEFORE SNAPSHOT"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotDir = Join-Path `
              $env:RUNNER_TEMP `
              "research_pattern_256_production"

          if (Test-Path -LiteralPath $snapshotDir) {
              Remove-Item `
                  -LiteralPath $snapshotDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $snapshotDir `
              -Force |
              Out-Null

          "PATTERN_256_PROD_SNAPSHOT_DIR=$snapshotDir" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          if ($files.Count -le 0) {
              throw "No production OHLCV files found."
          }

          $fileListPath = Join-Path `
              $snapshotDir `
              "ohlcv_files_before.txt"

          $hashPath = Join-Path `
              $snapshotDir `
              "ohlcv_sha256_before.csv"

          $relativePaths = @()
          $hashRows = @()

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $env:PRODUCTION_ROOT.Length
              ).TrimStart('\')

              $relativePaths += $relative

              $hash = (
                  Get-FileHash `
                      -LiteralPath $file.FullName `
                      -Algorithm SHA256
              ).Hash

              $hashRows += [PSCustomObject]@{
                  RelativePath = $relative
                  SHA256       = $hash
                  Length       = $file.Length
              }
          }

          $relativePaths |
              Set-Content `
                  -LiteralPath $fileListPath `
                  -Encoding UTF8

          $hashRows |
              Export-Csv `
                  -LiteralPath $hashPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "[PASS] BEFORE file inventory recorded."
          Write-Host "[PASS] BEFORE SHA256 inventory recorded."
          Write-Host "[PASS] Files: $($files.Count)"


      # ======================================================
      # 09
      # ======================================================

      - name: 09 - Verify no future-information source violations
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY NO FUTURE-INFORMATION SOURCE VIOLATIONS"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          @'
          import ast
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          source = path.read_text(
              encoding="utf-8-sig"
          )

          tree = ast.parse(
              source,
              filename=str(path),
          )

          violations = []

          for node in ast.walk(tree):

              if not isinstance(node, ast.Call):
                  continue

              if isinstance(node.func, ast.Attribute):
                  name = node.func.attr

              elif isinstance(node.func, ast.Name):
                  name = node.func.id

              else:
                  continue

              if name == "shift":

                  values = []

                  if node.args:
                      values.append(node.args[0])

                  for keyword in node.keywords:
                      if keyword.arg == "periods":
                          values.append(keyword.value)

                  for value in values:

                      if (
                          isinstance(value, ast.UnaryOp)
                          and isinstance(value.op, ast.USub)
                          and isinstance(value.operand, ast.Constant)
                          and isinstance(
                              value.operand.value,
                              (int, float),
                          )
                          and value.operand.value > 0
                      ):
                          violations.append(
                              (
                                  node.lineno,
                                  "negative shift",
                              )
                          )

              if name == "rolling":

                  for keyword in node.keywords:

                      if keyword.arg != "center":
                          continue

                      if (
                          isinstance(
                              keyword.value,
                              ast.Constant,
                          )
                          and keyword.value.value is True
                      ):
                          violations.append(
                              (
                                  node.lineno,
                                  "centered rolling",
                              )
                          )

          if violations:

              print(
                  "[FAIL] Future-information "
                  "source violations:"
              )

              for line, message in violations:
                  print(
                      f"  line={line} type={message}"
                  )

              raise SystemExit(1)

          print("[PASS] Negative shift not detected.")
          print("[PASS] Centered rolling not detected.")
          '@ |
              py - "$program"

          if ($LASTEXITCODE -ne 0) {
              throw "Future-information source validation failed."
          }


      # ======================================================
      # 10
      # ======================================================

      - name: 10 - Final pre-execution production safety guard
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL PRE-EXECUTION PRODUCTION SAFETY GUARD"
          Write-Host "============================================================"
          Write-Host ""

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:PRODUCTION_ROOT
              )
          ) {
              throw "PRODUCTION_ROOT is empty."
          }

          if (
              $env:PRODUCTION_ROOT `
              -ne `
              "C:\Users\USER\Documents\upbit-surge-monitor"
          ) {
              throw "Unexpected production root: $env:PRODUCTION_ROOT"
          }

          $ohlcvRoot = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          if (-not (
              Test-Path `
                  -LiteralPath $ohlcvRoot `
                  -PathType Container
          )) {
              throw "Production OHLCV root missing."
          }

          Write-Host "[PASS] Production root locked."
          Write-Host "[PASS] Production OHLCV root exists."
          Write-Host "[PASS] Research program uses READ ONLY OHLCV policy."
          Write-Host "[PASS] Ready for production research."


      # ======================================================
      # 11
      # ======================================================

      - name: 11 - Execute PRODUCTION Pattern 256 research
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "EXECUTE PRODUCTION PATTERN 256 RESEARCH"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          py $program `
              --project-root "$env:PRODUCTION_ROOT" `
              --timeframes h1 h4 d1 `
              --force

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Production research exit code:"
          Write-Host "  $exitCode"

          "PATTERN_256_PROD_EXIT_CODE=$exitCode" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[INFO] Production research returned exit code $exitCode"
              Write-Host "[INFO] OHLCV integrity verification will still run."
          }

          exit 0


      # ======================================================
      # 12
      # ======================================================

      - name: 12 - Verify production OHLCV file set unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV FILE SET UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforePath = Join-Path `
              $env:PATTERN_256_PROD_SNAPSHOT_DIR `
              "ohlcv_files_before.txt"

          $afterPath = Join-Path `
              $env:PATTERN_256_PROD_SNAPSHOT_DIR `
              "ohlcv_files_after.txt"

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $afterFiles = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $afterRelative = @(
              foreach ($file in $afterFiles) {

                  $file.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')
              }
          )

          $afterRelative |
              Set-Content `
                  -LiteralPath $afterPath `
                  -Encoding UTF8

          $before = @(
              Get-Content `
                  -LiteralPath $beforePath `
                  -Encoding UTF8
          )

          $after = @(
              Get-Content `
                  -LiteralPath $afterPath `
                  -Encoding UTF8
          )

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -gt 0) {

              $difference |
                  Format-Table |
                  Out-String |
                  Write-Host

              throw "Production OHLCV file set changed."
          }

          Write-Host "[PASS] Production OHLCV file set unchanged."
          Write-Host "[PASS] Files: $($after.Count)"


      # ======================================================
      # 13
      # ======================================================

      - name: 13 - Verify production OHLCV SHA256 unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforePath = Join-Path `
              $env:PATTERN_256_PROD_SNAPSHOT_DIR `
              "ohlcv_sha256_before.csv"

          $afterPath = Join-Path `
              $env:PATTERN_256_PROD_SNAPSHOT_DIR `
              "ohlcv_sha256_after.csv"

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $afterRows = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName |
              ForEach-Object {

                  $relative = $_.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $hash = (
                      Get-FileHash `
                          -LiteralPath $_.FullName `
                          -Algorithm SHA256
                  ).Hash

                  [PSCustomObject]@{
                      RelativePath = $relative
                      SHA256       = $hash
                      Length       = $_.Length
                  }
              }
          )

          $afterRows |
              Export-Csv `
                  -LiteralPath $afterPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          $beforeRows = @(
              Import-Csv `
                  -LiteralPath $beforePath
          )

          if ($beforeRows.Count -ne $afterRows.Count) {
              throw "OHLCV SHA256 inventory count changed."
          }

          $beforeMap = @{}

          foreach ($row in $beforeRows) {
              $beforeMap[$row.RelativePath] = $row
          }

          $changed = @()

          foreach ($row in $afterRows) {

              if (-not (
                  $beforeMap.ContainsKey(
                      $row.RelativePath
                  )
              )) {
                  $changed += $row.RelativePath
                  continue
              }

              $before = $beforeMap[$row.RelativePath]

              if ($before.SHA256 -ne $row.SHA256) {
                  $changed += $row.RelativePath
                  continue
              }

              if (
                  [Int64]$before.Length `
                  -ne `
                  [Int64]$row.Length
              ) {
                  $changed += $row.RelativePath
              }
          }

          if ($changed.Count -gt 0) {

              Write-Host ""
              Write-Host "Changed production OHLCV files:"

              foreach ($path in $changed) {
                  Write-Host "  $path"
              }

              throw "Production OHLCV SHA256 changed."
          }

          Write-Host "[PASS] Production OHLCV SHA256 unchanged."
          Write-Host "[PASS] Verified files: $($afterRows.Count)"


      # ======================================================
      # 14
      # ======================================================

      - name: 14 - Verify production research exit code
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION RESEARCH EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:PATTERN_256_PROD_EXIT_CODE
              )
          ) {
              throw "Production research exit code was not recorded."
          }

          $exitCode = [int]$env:PATTERN_256_PROD_EXIT_CODE

          Write-Host "Exit code:"
          Write-Host "  $exitCode"

          if ($exitCode -ne 0) {
              throw "research_pattern_256.py returned exit code $exitCode"
          }

          Write-Host "[PASS] Production research exit code = 0."


      # ======================================================
      # 15
      # ======================================================

      - name: 15 - Verify production research outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION RESEARCH OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE"

          $validationDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation"

          $required = @(
              (Join-Path $reportDir $env:RESULT_FILE),
              (Join-Path $reportDir $env:SUMMARY_FILE),
              (Join-Path $reportDir $env:DETAIL_FILE),
              (Join-Path $reportDir $env:CANDIDATE_FILE),
              (Join-Path $reportDir $env:MANIFEST_FILE),
              (Join-Path $reportDir $env:CONTRACT_FILE),
              (Join-Path $reportDir $env:README_FILE),
              (Join-Path $validationDir $env:CHECKPOINT_FILE)
          )

          foreach ($path in $required) {

              if (-not (
                  Test-Path `
                      -LiteralPath $path `
                      -PathType Leaf
              )) {
                  throw "Required production output missing: $path"
              }

              $item = Get-Item `
                  -LiteralPath $path

              if ($item.Length -le 0) {
                  throw "Production output is empty: $path"
              }

              Write-Host "[PASS] $path"
          }


      # ======================================================
      # 16
      # ======================================================

      - name: 16 - Validate production result JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE PRODUCTION RESULT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\$env:RESULT_FILE"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]

          with path.open(
              "r",
              encoding="utf-8-sig",
          ) as f:
              result = json.load(f)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              result.get("program")
              == "research_pattern_256.py",
              "Unexpected program.",
          )

          require(
              result.get("version")
              == expected_version,
              "Unexpected version.",
          )

          require(
              result.get("stage")
              == "PATTERN 256 INDEPENDENT RESEARCH",
              "Unexpected stage.",
          )

          require(
              result.get("status") == "PASS",
              "Production result status is not PASS.",
          )

          pattern = result.get(
              "pattern",
              {},
          )

          require(
              pattern.get("id") == "256",
              "Unexpected pattern ID.",
          )

          require(
