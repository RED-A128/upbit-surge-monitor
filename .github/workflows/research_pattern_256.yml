      - name: 24 - Verify no forbidden Git operations are executable
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY NO FORBIDDEN GIT OPERATIONS"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          $content = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $patterns = @(
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+reset',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+clean',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+commit',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+push'
          )

          foreach ($pattern in $patterns) {

              if (
                  [regex]::IsMatch(
                      $content,
                      $pattern
                  )
              ) {
                  throw "Forbidden executable Git mutation detected."
              }
          }

          Write-Host "[PASS] No executable git reset."
          Write-Host "[PASS] No executable git clean."
          Write-Host "[PASS] No executable git commit."
          Write-Host "[PASS] No executable git push."


