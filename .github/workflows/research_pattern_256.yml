      # 25
      # ======================================================

      - name: 25 - Final Clean V001 production gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL CLEAN V001 PRODUCTION GATE"
          Write-Host "============================================================"
          Write-Host ""

          if (
              [int]$env:PATTERN_256_PROD_EXIT_CODE `
              -ne 0
          ) {
              throw "Production research process failed."
          }

          $resultPath = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\$env:RESULT_FILE"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          with path.open(
              "r",
              encoding="utf-8-sig",
          ) as f:
              result = json.load(f)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              result.get("status") == "PASS",
              "Production status is not PASS.",
          )

          pattern = result.get(
              "pattern",
              {},
          )

          require(
              pattern.get("id") == "256",
              "Pattern ID gate failed.",
          )

          require(
              pattern.get("independent_research")
              is True,
              "Independent research gate failed.",
          )

          require(
              pattern.get("final_formula_defined")
              is False,
              "Final formula safety gate failed.",
          )

          future = result.get(
              "future_information",
              {},
          )

          require(
              future.get("future_candles_used")
              is False,
              "Future candle gate failed.",
          )

          require(
              future.get("negative_shift_used")
              is False,
              "Negative shift gate failed.",
          )

          require(
              future.get("centered_rolling_used")
              is False,
              "Centered rolling gate failed.",
          )

          require(
              future.get("future_labels_generated")
              is False,
              "Future label gate failed.",
          )

          require(
              future.get(
                  "thirty_percent_label_generated"
              )
              is False,
              "30 percent future label gate failed.",
          )

          safety = result.get(
              "safety",
              {},
          )

          require(
              safety.get(
                  "source_sha256_unchanged"
              )
              is True,
              "OHLCV integrity gate failed.",
          )

          require(
              safety.get("prediction_executed")
              is False,
              "Prediction safety gate failed.",
          )

          require(
              safety.get("trading_executed")
              is False,
              "Trading safety gate failed.",
          )

          processing = result.get(
              "processing",
              {},
          )

          require(
              int(
                  processing.get(
                      "files_error",
                      -1,
                  )
              ) == 0,
              "Source processing error gate failed.",
          )

          statistics = result.get(
              "statistics",
              {},
          )

          print("")
          print("============================================================")
          print("PATTERN 256 PRODUCTION RESEARCH PASS")
          print("============================================================")
          print("")
          print("[PASS] research_pattern_256.py Clean V001")
          print("[PASS] Production execution")
          print("[PASS] Pattern ID = 256")
          print("[PASS] Independent quantitative research")
          print("[PASS] h1 / h4 / d1")
          print("[PASS] Production OHLCV unchanged")
          print("[PASS] Source SHA256 unchanged")
          print("[PASS] Future candles blocked")
          print("[PASS] Negative shift blocked")
          print("[PASS] Centered rolling blocked")
          print("[PASS] Future labels blocked")
          print("[PASS] Future returns blocked")
          print("[PASS] 30 percent future label blocked")
          print("[PASS] Prediction blocked")
          print("[PASS] Trading blocked")
          print("[PASS] Final 256 formula remains undefined")
          print("[PASS] Source manifest validated")
          print("[PASS] Checkpoint validated")
          print("[PASS] Result/summary/detail cross-check")
          print("")
          print("Files processed:")
          print(
              f"  {statistics.get('files_processed')}"
          )
          print("")
          print("Total rows:")
          print(
              f"  {statistics.get('total_rows')}"
          )
          print("")
          print("Candidate rows:")
          print(
              f"  {statistics.get('candidate_rows')}"
          )
          print("")
          print("Strong candidate rows:")
          print(
              f"  {statistics.get('strong_candidate_rows')}"
          )
          print("")
          print("[NEXT]")
          print(
              "Pattern 256 research production stage is complete."
          )
          print(
              "Proceed to Pattern 256 historical outcome validation."
          )
          print(
              "Future 30% outcome labels may only be introduced "
              "in that separate validation/backtest stage."
          )
          '@ |
              py - "$resultPath"

          if ($LASTEXITCODE -ne 0) {
              throw "Final Clean V001 production gate failed."
          }


      # ======================================================
      # 26
      # ======================================================

      - name: 26 - Create production verification bundle
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CREATE PRODUCTION VERIFICATION BUNDLE"
          Write-Host "============================================================"
          Write-Host ""

          $bundle = Join-Path `
              $env:RUNNER_TEMP `
              "research_pattern_256_production_artifact"

          if (Test-Path -LiteralPath $bundle) {
              Remove-Item `
                  -LiteralPath $bundle `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $bundle `
              -Force |
              Out-Null

          $snapshotDir = $env:PATTERN_256_PROD_SNAPSHOT_DIR

          if (
              -not [string]::IsNullOrWhiteSpace(
                  $snapshotDir
              )
              -and
              (Test-Path -LiteralPath $snapshotDir)
          ) {

              Copy-Item `
                  -Path (Join-Path $snapshotDir "*") `
                  -Destination $bundle `
                  -Force `
                  -ErrorAction SilentlyContinue
          }

          if (
              -not [string]::IsNullOrWhiteSpace(
                  $env:PRODUCTION_ROOT
              )
          ) {

              $reportDir = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\reports\$env:REPORT_NAMESPACE"

              if (
                  Test-Path `
                      -LiteralPath $reportDir `
                      -PathType Container
              ) {

                  $reportBundle = Join-Path `
                      $bundle `
                      "pattern_research_256"

                  New-Item `
                      -ItemType Directory `
                      -Path $reportBundle `
                      -Force |
                      Out-Null

                  Get-ChildItem `
                      -LiteralPath $reportDir `
                      -File `
                      -ErrorAction SilentlyContinue |
                      ForEach-Object {

                          Copy-Item `
                              -LiteralPath $_.FullName `
                              -Destination $reportBundle `
                              -Force `
                              -ErrorAction SilentlyContinue
                      }
              }

              $checkpoint = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\validation\$env:CHECKPOINT_FILE"

              if (
                  Test-Path `
                      -LiteralPath $checkpoint `
                      -PathType Leaf
              ) {
                  Copy-Item `
                      -LiteralPath $checkpoint `
                      -Destination $bundle `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }

          $metadata = @(
              "workflow=research_pattern_256.yml",
              "version=Clean V001",
              "run_id=$env:GITHUB_RUN_ID",
              "run_number=$env:GITHUB_RUN_NUMBER",
              "runner=$env:RUNNER_NAME",
              "production_root=$env:PRODUCTION_ROOT",
              "research_exit_code=$env:PATTERN_256_PROD_EXIT_CODE"
          )

          $metadata |
              Set-Content `
                  -LiteralPath (
                      Join-Path `
                          $bundle `
                          "production_metadata.txt"
                  ) `
                  -Encoding UTF8

          "PATTERN_256_PROD_ARTIFACT_DIR=$bundle" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Verification bundle prepared:"
          Write-Host "  $bundle"


      # ======================================================
      # 27
      # ======================================================

      - name: 27 - Failure diagnostics
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FAILURE DIAGNOSTICS"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Production root:"
          Write-Host "  $env:PRODUCTION_ROOT"

          Write-Host ""
          Write-Host "Research exit code:"
          Write-Host "  $env:PATTERN_256_PROD_EXIT_CODE"

          Write-Host ""
          Write-Host "Report directory:"

          if (
              -not [string]::IsNullOrWhiteSpace(
                  $env:PRODUCTION_ROOT
              )
          ) {

              $reportDir = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\reports\$env:REPORT_NAMESPACE"

              if (Test-Path -LiteralPath $reportDir) {

                  Get-ChildItem `
                      -LiteralPath $reportDir `
                      -Force |
                      Format-Table `
                          Name,
                          Length,
                          LastWriteTime `
                          -AutoSize |
                      Out-String |
                      Write-Host
              }
              else {
                  Write-Host "  [MISSING] $reportDir"
              }

              Write-Host ""
              Write-Host "Checkpoint:"

              $checkpoint = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\validation\$env:CHECKPOINT_FILE"

              if (Test-Path -LiteralPath $checkpoint) {

                  Get-Item `
                      -LiteralPath $checkpoint |
                      Format-List `
                          FullName,
                          Length,
                          LastWriteTime |
                      Out-String |
                      Write-Host
              }
              else {
                  Write-Host "  [MISSING] $checkpoint"
              }
          }

          Write-Host ""
          Write-Host "Snapshot directory:"
          Write-Host "  $env:PATTERN_256_PROD_SNAPSHOT_DIR"

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # 28
      # ======================================================

      - name: 28 - Upload production research verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-pattern-256-production-${{ github.run_id }}
          path: ${{ env.PATTERN_256_PROD_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
