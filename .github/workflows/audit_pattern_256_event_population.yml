
name: audit_pattern_256_event_population.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-event-population
  cancel-in-progress: false

jobs:
  event-population:
    name: event-population
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_population.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python audit script missing"
          }

          $sources = @(
            "data\reports\pattern_256_event_gap_integrity\gap_integrity_events.csv",
            "data\reports\pattern_256_accumulation_independent\independent_detail.csv"
          )

          foreach ($relative in $sources) {
            $path = Join-Path $env:DATA_ROOT $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Source missing: $path"
            }

            Write-Host "[OK] $relative"
          }

          & py -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax check failed"
          }

      - name: Prepare isolated output
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "pattern256_population_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"

          $output = Join-Path $env:RUNNER_TEMP $folder

          if (Test-Path -LiteralPath $output) {
            throw "Output already exists"
          }

          "POPULATION_OUTPUT=$output" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute population diagnostics
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_population.py"

          & py -u $script `
            --root $env:DATA_ROOT `
            --output $env:POPULATION_OUTPUT

          if ($LASTEXITCODE -ne 0) {
            throw "Population diagnostics failed"
          }

      - name: Verify reports and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Audit execution failed"
          }

          $out = $env:POPULATION_OUTPUT

          $resultPath = Join-Path $out `
            "population_result.json"

          $manifestPath = Join-Path $out `
            "population_manifest.json"

          if (-not (Test-Path $resultPath) -or
              -not (Test-Path $manifestPath)) {
            throw "Required JSON report missing"
          }

          $result = Get-Content $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS" -or
              $manifest.execution -ne "PASS") {
            throw "Execution result mismatch"
          }

          if ($result.version -ne "Clean V001" -or
              $manifest.version -ne "Clean V001") {
            throw "Version mismatch"
          }

          if ($result.research_decision -ne "HOLD" -or
              $result.train_approved -ne $false -or
              $result.live_trading_approved -ne $false) {
            throw "Research safety gate failed"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_population.py"

          $scriptHash = (
            Get-FileHash $script -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($scriptHash -ne (
            [string]$manifest.script_sha256
          ).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          $names = @(
            "population_result.json",
            "population_gap.csv",
            "population_independent.csv",
            "population_periods.csv",
            "population_outcomes.csv",
            "population_examples.csv"
          )

          foreach ($name in $names) {
            $path = Join-Path $out $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }

            $actual = (
              Get-FileHash $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$manifest.output_sha256.$name
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $name"
            }
          }

          $sourcePaths = @{
            gap = "data\reports\pattern_256_event_gap_integrity\gap_integrity_events.csv"
            independent = "data\reports\pattern_256_accumulation_independent\independent_detail.csv"
          }

          foreach ($key in $sourcePaths.Keys) {
            $path = Join-Path $env:DATA_ROOT `
              $sourcePaths[$key]

            $actual = (
              Get-FileHash $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$result.source_sha256.$key
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Source SHA256 mismatch: $key"
            }
          }

          Write-Host "[PASS] Output verification"

      - name: Publish summary
        if: always()
        run: |
          $execution = "${{ steps.audit.outcome }}"
          $verification = "${{ steps.verify.outcome }}"

          @"
          ## Pattern 256 Event Population Diagnostics

          | Check | Result |
          |---|---|
          | Version | Clean V001 |
          | Execution | $execution |
          | Verification | $verification |
          | Research decision | HOLD |

          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          if ($execution -ne "success" -or
              $verification -ne "success") {
            exit 0
          }

          $path = Join-Path $env:POPULATION_OUTPUT `
            "population_result.json"

          $result = Get-Content $path `
            -Raw | ConvertFrom-Json

          $t = $result.totals

          @"
          ### Event population results

          | Check | Count |
          |---|---:|
          | Gap events | $($t.gap_events) |
          | Independent events | $($t.independent_events) |
          | Exact matches | $($t.exact_matches) |
          | Original differences | $($t.original_differences) |
          | Corrected differences | $($t.corrected_differences) |
          | HIT flag differences | $($t.hit_flag_differences) |
          | Unknown HIT flags | $($t.unknown_hit_flags) |

          This audit diagnoses population differences.
          It does not prove predictive performance.

          Research decision: HOLD.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-population-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pattern256_population_${{ github.run_id }}_${{ github.run_attempt }}/population_*.json
            ${{ runner.temp }}/pattern256_population_${{ github.run_id }}_${{ github.run_attempt }}/population_*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Population audit failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Population verification failed"
          }

          Write-Host "[PASS] Event population diagnostics"
          Write-Host "Research decision: HOLD"
