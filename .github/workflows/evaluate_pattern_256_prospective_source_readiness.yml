
name: evaluate_pattern_256_prospective_source_readiness.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-prospective-source-readiness
  cancel-in-progress: false

jobs:
  prospective-source-readiness:
    name: prospective-source-readiness

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SCRIPT_NAME: evaluate_pattern_256_prospective_source_readiness.py
      OUTPUT_RELATIVE: data/reports/pattern_256_prospective_source_readiness
      EXPECTED_VERSION: Clean V003-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and script
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python script not found: $script"
          }

          Write-Host "[PASS] Python and script"

      - name: Verify input directories
        run: |
          $ErrorActionPreference = "Stop"

          $freeze = Join-Path `
            $env:PROJECT_ROOT `
            "data/reports/pattern_256_prospective_freeze"

          $registry = Join-Path `
            $env:PROJECT_ROOT `
            "data/reports/pattern_256_prospective_registry"

          $files = @(
            (Join-Path $freeze "frozen_candidates.csv"),
            (Join-Path $freeze "prospective_protocol.json"),
            (Join-Path $freeze "freeze_result.json"),
            (Join-Path $freeze "freeze_manifest.json"),
            (Join-Path $registry "prospective_events.csv"),
            (Join-Path $registry "registry_result.json"),
            (Join-Path $registry "registry_manifest.json")
          )

          foreach ($path in $files) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source: $path"
            }
          }

          Write-Host "[PASS] Input files found"

      - name: Run prospective source readiness
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Source readiness failed"
          }

      - name: Verify result integrity
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os

          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          output = root / os.environ["OUTPUT_RELATIVE"]

          def digest(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  for chunk in iter(
                      lambda: f.read(1024 * 1024),
                      b"",
                  ):
                      h.update(chunk)

              return h.hexdigest()

          def load(path):
              return json.loads(
                  path.read_text(encoding="utf-8")
              )

          result_path = (
              output / "source_readiness_result.json"
          )

          template_path = (
              output / "prospective_event_input_template.csv"
          )

          manifest_path = (
              output / "source_readiness_manifest.json"
          )

          for path in (
              result_path,
              template_path,
              manifest_path,
          ):
              if not path.is_file():
                  raise SystemExit(
                      "Missing output: " + str(path)
                  )

          result = load(result_path)
          manifest = load(manifest_path)

          version = os.environ["EXPECTED_VERSION"]

          if result.get("version") != version:
              raise SystemExit("Version mismatch")

          if manifest.get("version") != version:
              raise SystemExit("Manifest version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Execution failed")

          if result.get("overall_decision") != "HOLD":
              raise SystemExit("Unexpected decision")

          if result.get("frozen_market_count") != 209:
              raise SystemExit("Market count mismatch")

          if result.get("primary_market") != "KRW-DKA":
              raise SystemExit("Primary market mismatch")

          if result.get("freeze_cutoff_utc") != (
              "2026-10-24T00:00:00+00:00"
          ):
              raise SystemExit("Cutoff mismatch")

          if (
              result.get("frozen_protocol_verified")
              is not True
          ):
              raise SystemExit("Freeze not verified")

          if (
              result.get("registry_integrity_verified")
              is not True
          ):
              raise SystemExit("Registry not verified")

          for key in (
              "signal_generation_implemented",
              "prospective_source_verified",
              "independent_oos_proven",
              "profitability_proven",
              "approved_for_live_trading",
          ):
              if result.get(key) is not False:
                  raise SystemExit("Unsafe flag: " + key)

          if (
              digest(result_path)
              != manifest.get("result_sha256")
          ):
              raise SystemExit("Result SHA256 mismatch")

          if (
              digest(template_path)
              != manifest.get("template_sha256")
          ):
              raise SystemExit("Template SHA256 mismatch")

          with template_path.open(
              encoding="utf-8-sig",
              newline="",
          ) as f:
              reader = csv.DictReader(f)
              rows = list(reader)

          expected = [
              "market",
              "timeframe",
              "classification",
              "horizon",
              "signal_timestamp",
          ]

          if reader.fieldnames != expected:
              raise SystemExit("Template schema mismatch")

          if rows:
              raise SystemExit(
                  "Template must contain no synthetic events"
              )

          freeze = root / (
              "data/reports/"
              "pattern_256_prospective_freeze"
          )

          registry = root / (
              "data/reports/"
              "pattern_256_prospective_registry"
          )

          paths = {
              "freeze": freeze,
              "registry": registry,
          }

          for group, names in (
              manifest["input_sha256"].items()
          ):
              if group not in paths:
                  raise SystemExit(
                      "Unexpected input group"
                  )

              for name, expected_hash in names.items():
                  path = paths[group] / name

                  if digest(path) != expected_hash:
                      raise SystemExit(
                          "Input SHA256 mismatch: " + name
                      )

          print("[PASS] Clean V003-18")
          print("[PASS] Frozen source integrity")
          print("[PASS] Registry integrity")
          print("[PASS] Output SHA256")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Readiness verification failed"
          }

      - name: Upload readiness results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-prospective-source-readiness-v003-18
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_prospective_source_readiness/source_readiness_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_prospective_source_readiness/prospective_event_input_template.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_prospective_source_readiness/source_readiness_manifest.json
          if-no-files-found: error
          retention-days: 90
