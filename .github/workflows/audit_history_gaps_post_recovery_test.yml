# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/audit_history_gaps_post_recovery_test.yml
#
# Clean V003
# ============================================================
#
# PURPOSE
#
#   SAFE GitHub Actions test workflow for:
#
#       audit_history_gaps_post_recovery.py
#
#   POST-RECOVERY AUDIT REVALIDATION
#
#
# CLEAN V003 FIX
#
#   Previous workflow incorrectly assumed:
#
#       h1 = 290
#       h4 = 290
#       d1 = 290
#       total = 870
#
#   Current repository contains:
#
#       h1 = 291
#
#   Therefore market/file counts must NOT be hard-coded.
#
#   Clean V003:
#
#     1. Discovers actual production OHLCV inventory.
#     2. Requires h1/h4/d1 directories to exist.
#     3. Requires each timeframe to contain CSV files.
#     4. Records the exact BEFORE file set.
#     5. Records SHA256 for every BEFORE file.
#     6. Runs the READ-ONLY post-recovery audit.
#     7. Requires AFTER file set == BEFORE file set.
#     8. Requires AFTER SHA256 == BEFORE SHA256 for every file.
#     9. Does NOT assume 290 markets or 870 files.
#    10. Does NOT treat market-count change itself as corruption.
#
#
# SAFETY
#
#   OHLCV modification       : FORBIDDEN
#   OHLCV deletion           : FORBIDDEN
#   OHLCV file creation      : FORBIDDEN
#
#   Recovery execution       : DISABLED
#   Upbit candle download    : DISABLED
#
#   Feature build            : DISABLED
#   256 detector             : DISABLED
#   Future labels            : DISABLED
#   Prediction               : DISABLED
#   Trading                  : DISABLED
#
#   Git reset                : DISABLED
#   Git clean                : DISABLED
#   Git commit               : DISABLED
#   Git push                 : DISABLED
#
# ============================================================


name: audit_history_gaps_post_recovery_test.yml


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: audit-history-gaps-post-recovery-test
  cancel-in-progress: false


jobs:

  audit-history-gaps-post-recovery-test:

    name: audit_history_gaps_post_recovery_test.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"


    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      # ======================================================
      # 02. ENVIRONMENT
      # ======================================================

      - name: 02 - Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "POST-RECOVERY AUDIT REVALIDATION TEST"
          Write-Host "Clean V003"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner name : $env:RUNNER_NAME"
          Write-Host "Runner OS   : $env:RUNNER_OS"
          Write-Host "Runner arch : $env:RUNNER_ARCH"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""
          Write-Host "Ref:"
          Write-Host "  $env:GITHUB_REF"

          Write-Host ""
          Write-Host "SHA:"
          Write-Host "  $env:GITHUB_SHA"

          Write-Host ""
          Write-Host "Python:"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Environment confirmed."


      # ======================================================
      # 03. VERIFY AUDIT PROGRAM
      # ======================================================

      - name: 03 - Verify audit program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $auditFile = Join-Path `
              $env:GITHUB_WORKSPACE `
              "audit_history_gaps_post_recovery.py"

          if (-not (Test-Path -LiteralPath $auditFile -PathType Leaf)) {
              throw "Missing audit program: $auditFile"
          }

          $info = Get-Item -LiteralPath $auditFile

          if ($info.Length -le 0) {
              throw "Audit program is empty: $auditFile"
          }

          Write-Host "File:"
          Write-Host "  $auditFile"

          Write-Host ""
          Write-Host "Size:"
          Write-Host "  $($info.Length) bytes"

          Write-Host ""

          py -m py_compile "$auditFile"

          if ($LASTEXITCODE -ne 0) {
              throw "Audit Python syntax validation failed."
          }

          $text = Get-Content `
              -LiteralPath $auditFile `
              -Raw `
              -Encoding UTF8

          if ($text -notmatch 'PROGRAM\s*=\s*["'']audit_history_gaps_post_recovery\.py["'']') {
              throw "Unexpected PROGRAM declaration."
          }

          if ($text -notmatch 'VERSION\s*=\s*["'']Clean V001["'']') {
              throw "Unexpected audit VERSION declaration."
          }

          if ($text -notmatch 'EXECUTION_MODE\s*=\s*["'']READ_ONLY_POST_RECOVERY_AUDIT["'']') {
              throw "Unexpected audit EXECUTION_MODE declaration."
          }

          Write-Host "[PASS] audit_history_gaps_post_recovery.py"
          Write-Host "[PASS] Python syntax valid."
          Write-Host "[PASS] Program version = Clean V001"
          Write-Host "[PASS] Mode = READ_ONLY_POST_RECOVERY_AUDIT"


      # ======================================================
      # 04. VERIFY REQUIRED DIRECTORIES
      # ======================================================

      - name: 04 - Verify required directories
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $requiredDirectories = @(
              "data",
              "data\ohlcv",
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($relativePath in $requiredDirectories) {

              $fullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Container)) {
                  throw "Required directory missing: $fullPath"
              }

              Write-Host "[PASS] $relativePath"
          }

          Write-Host ""
          Write-Host "[PASS] Required OHLCV directories confirmed."
          Write-Host "[INFO] data\recovery is NOT a workflow-level requirement."


      # ======================================================
      # 05. SHOW DATA STRUCTURE
      # ======================================================

      - name: 05 - Show relevant data structure
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CURRENT RELEVANT DATA STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          Write-Host "Top-level data directories:"
          Write-Host ""

          Get-ChildItem `
              -LiteralPath $dataRoot `
              -Directory `
              -ErrorAction SilentlyContinue |
              Sort-Object Name |
              ForEach-Object {
                  Write-Host "  $($_.Name)"
              }

          Write-Host ""

          $reportsRoot = Join-Path `
              $dataRoot `
              "reports"

          if (Test-Path -LiteralPath $reportsRoot -PathType Container) {

              Write-Host "Report directories:"
              Write-Host ""

              Get-ChildItem `
                  -LiteralPath $reportsRoot `
                  -Directory `
                  -ErrorAction SilentlyContinue |
                  Sort-Object Name |
                  ForEach-Object {
                      Write-Host "  reports\$($_.Name)"
                  }
          }
          else {

              Write-Host "[INFO] data\reports does not currently exist."
          }

          Write-Host ""
          Write-Host "[PASS] Data structure inspection completed."


      # ======================================================
      # 06. DISCOVER ACTUAL PRODUCTION OHLCV INVENTORY
      # ======================================================

      - name: 06 - Discover production OHLCV inventory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DISCOVER PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"
          Write-Host ""

          $inventoryFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_inventory_contract.csv"

          $rows = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" `
                      -ErrorAction Stop |
                      Sort-Object Name
              )

              if ($files.Count -le 0) {
                  throw "No OHLCV CSV files found: $directory"
              }

              Write-Host "$($timeframe.ToUpper()) : $($files.Count)"

              foreach ($file in $files) {

                  $rows += [PSCustomObject]@{
                      timeframe = $timeframe
                      filename  = $file.Name
                      fullpath  = $file.FullName
                      bytes     = $file.Length
                  }
              }
          }

          if ($rows.Count -le 0) {
              throw "Production OHLCV inventory is empty."
          }

          $rows |
              Export-Csv `
                  -LiteralPath $inventoryFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          $h1Count = @(
              $rows | Where-Object { $_.timeframe -eq "h1" }
          ).Count

          $h4Count = @(
              $rows | Where-Object { $_.timeframe -eq "h4" }
          ).Count

          $d1Count = @(
              $rows | Where-Object { $_.timeframe -eq "d1" }
          ).Count

          Write-Host ""
          Write-Host "Discovered inventory:"
          Write-Host "  H1    : $h1Count"
          Write-Host "  H4    : $h4Count"
          Write-Host "  D1    : $d1Count"
          Write-Host "  TOTAL : $($rows.Count)"

          Write-Host ""
          Write-Host "Inventory contract:"
          Write-Host "  $inventoryFile"

          Write-Host ""
          Write-Host "[PASS] Actual production inventory discovered."
          Write-Host "[PASS] No hard-coded 290/870 assumption used."


      # ======================================================
      # 07. VERIFY MARKET FILE NAMES
      # ======================================================

      - name: 07 - Verify production OHLCV file names
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV FILE NAMES"
          Write-Host "============================================================"
          Write-Host ""

          $invalid = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" `
                      -ErrorAction Stop
              )

              foreach ($file in $files) {

                  if ($file.BaseName -notmatch '^KRW-[A-Z0-9]+$') {

                      $invalid += "$timeframe/$($file.Name)"
                  }
              }
          }

          if ($invalid.Count -gt 0) {

              Write-Host "[FAIL] Invalid OHLCV filenames:"

              foreach ($item in $invalid) {
                  Write-Host "  $item"
              }

              throw "Invalid OHLCV market filenames detected."
          }

          Write-Host "[PASS] All OHLCV filenames follow KRW-MARKET.csv contract."


      # ======================================================
      # 08. RECORD BEFORE FILE SET
      # ======================================================

      - name: 08 - Record OHLCV file set before audit
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV FILE SET BEFORE AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          $rows = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $rows += [PSCustomObject]@{
                      timeframe = $timeframe
                      filename  = $file.Name
                      bytes     = $file.Length
                  }
              }
          }

          if ($rows.Count -le 0) {
              throw "BEFORE OHLCV inventory is empty."
          }

          $keys = @{}

          foreach ($row in $rows) {

              $key = "$($row.timeframe)|$($row.filename)"

              if ($keys.ContainsKey($key)) {
                  throw "Duplicate BEFORE file key: $key"
              }

              $keys[$key] = $true
          }

          $rows |
              Export-Csv `
                  -LiteralPath $snapshotFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "Snapshot:"
          Write-Host "  $snapshotFile"

          Write-Host ""
          Write-Host "Files:"
          Write-Host "  $($rows.Count)"

          Write-Host ""
          Write-Host "[PASS] BEFORE file set recorded."


      # ======================================================
      # 09. RECORD BEFORE SHA256
      # ======================================================

      - name: 09 - Record OHLCV SHA256 before audit
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_sha256.csv"

          $rows = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $hash = Get-FileHash `
                      -LiteralPath $file.FullName `
                      -Algorithm SHA256

                  $rows += [PSCustomObject]@{
                      timeframe = $timeframe
                      filename  = $file.Name
                      bytes     = $file.Length
                      sha256    = $hash.Hash.ToLower()
                  }
              }
          }

          if ($rows.Count -le 0) {
              throw "BEFORE SHA256 inventory is empty."
          }

          $rows |
              Export-Csv `
                  -LiteralPath $hashFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "SHA256 snapshot:"
          Write-Host "  $hashFile"

          Write-Host ""
          Write-Host "Files:"
          Write-Host "  $($rows.Count)"

          Write-Host ""
          Write-Host "[PASS] BEFORE SHA256 recorded for every OHLCV file."


      # ======================================================
      # 10. RUN READ-ONLY AUDIT
      # ======================================================

      - name: 10 - Run post-recovery audit
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN POST-RECOVERY AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "[SAFETY] READ-ONLY AUDIT"
          Write-Host "[SAFETY] Recovery execution    : DISABLED"
          Write-Host "[SAFETY] OHLCV modification    : FORBIDDEN"
          Write-Host "[SAFETY] Upbit candle download : DISABLED"
          Write-Host ""

          Push-Location $env:GITHUB_WORKSPACE

          try {

              py ".\audit_history_gaps_post_recovery.py"

              $auditExitCode = $LASTEXITCODE
          }
          finally {

              Pop-Location
          }

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          Set-Content `
              -LiteralPath $exitFile `
              -Value $auditExitCode `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Audit exit code:"
          Write-Host "  $auditExitCode"

          Write-Host ""

          if ($auditExitCode -eq 0) {
              Write-Host "[PASS] Audit process exit code = 0"
          }
          else {
              Write-Host "[INFO] Audit process exit code = $auditExitCode"
              Write-Host "[INFO] Safety verification will still execute."
          }

          exit 0


      # ======================================================
      # 11. VERIFY AFTER FILE SET
      # ======================================================

      - name: 11 - Verify OHLCV file set unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV FILE SET UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          if (-not (Test-Path -LiteralPath $beforeFile -PathType Leaf)) {
              throw "BEFORE file-set snapshot missing."
          }

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeFile
          )

          if ($beforeRows.Count -le 0) {
              throw "BEFORE file-set snapshot is empty."
          }

          $beforeMap = @{}

          foreach ($row in $beforeRows) {

              $key = "$($row.timeframe)|$($row.filename)"

              if ($beforeMap.ContainsKey($key)) {
                  throw "Duplicate BEFORE file key: $key"
              }

              $beforeMap[$key] = [long]$row.bytes
          }

          $afterMap = @{}

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $key = "$timeframe|$($file.Name)"

                  if ($afterMap.ContainsKey($key)) {
                      throw "Duplicate AFTER file key: $key"
                  }

                  $afterMap[$key] = [long]$file.Length
              }
          }

          $differences = @()

          foreach ($key in $beforeMap.Keys) {

              if (-not $afterMap.ContainsKey($key)) {

                  $differences += "MISSING_AFTER:$key"
                  continue
              }

              if ($beforeMap[$key] -ne $afterMap[$key]) {

                  $differences += "SIZE_CHANGED:$key"
              }
          }

          foreach ($key in $afterMap.Keys) {

              if (-not $beforeMap.ContainsKey($key)) {

                  $differences += "NEW_AFTER:$key"
              }
          }

          Write-Host "BEFORE files : $($beforeMap.Count)"
          Write-Host "AFTER files  : $($afterMap.Count)"
          Write-Host ""

          if ($differences.Count -gt 0) {

              Write-Host "[FAIL] OHLCV file-set differences:"

              foreach ($item in $differences) {
                  Write-Host "  $item"
              }

              throw "OHLCV file set changed during READ-ONLY audit."
          }

          Write-Host "[PASS] AFTER file count = BEFORE file count."
          Write-Host "[PASS] No OHLCV file added."
          Write-Host "[PASS] No OHLCV file removed."
          Write-Host "[PASS] No OHLCV file size changed."


      # ======================================================
      # 12. VERIFY SHA256 UNCHANGED
      # ======================================================

      - name: 12 - Verify OHLCV SHA256 unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforeHashFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_sha256.csv"

          if (-not (Test-Path -LiteralPath $beforeHashFile -PathType Leaf)) {
              throw "BEFORE SHA256 snapshot missing."
          }

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeHashFile
          )

          if ($beforeRows.Count -le 0) {
              throw "BEFORE SHA256 snapshot is empty."
          }

          $beforeMap = @{}

          foreach ($row in $beforeRows) {

              $key = "$($row.timeframe)|$($row.filename)"

              if ($beforeMap.ContainsKey($key)) {
                  throw "Duplicate BEFORE SHA256 key: $key"
              }

              $beforeMap[$key] = $row.sha256.ToLower()
          }

          $afterMap = @{}

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $key = "$timeframe|$($file.Name)"

                  $hash = (
                      Get-FileHash `
                          -LiteralPath $file.FullName `
                          -Algorithm SHA256
                  ).Hash.ToLower()

                  $afterMap[$key] = $hash
              }
          }

          $changed = @()

          foreach ($key in $beforeMap.Keys) {

              if (-not $afterMap.ContainsKey($key)) {

                  $changed += "MISSING_AFTER:$key"
                  continue
              }

              if ($beforeMap[$key] -ne $afterMap[$key]) {

                  $changed += "HASH_CHANGED:$key"
              }
          }

          foreach ($key in $afterMap.Keys) {

              if (-not $beforeMap.ContainsKey($key)) {

                  $changed += "NEW_AFTER:$key"
              }
          }

          Write-Host "BEFORE hashes : $($beforeMap.Count)"
          Write-Host "AFTER hashes  : $($afterMap.Count)"
          Write-Host ""

          if ($changed.Count -gt 0) {

              Write-Host "[FAIL] OHLCV SHA256 differences:"

              foreach ($item in $changed) {
                  Write-Host "  $item"
              }

              throw "READ-ONLY safety violation: OHLCV content changed."
          }

          Write-Host "[PASS] Every BEFORE OHLCV file still exists."
          Write-Host "[PASS] No new OHLCV file exists."
          Write-Host "[PASS] Every OHLCV SHA256 is unchanged."
          Write-Host "[PASS] READ-ONLY OHLCV safety confirmed."


      # ======================================================
      # 13. VERIFY AUDIT OUTPUT DIRECTORY
      # ======================================================

      - name: 13 - Verify audit output directory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT OUTPUT DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          $outputDirectory = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit"

          if (-not (Test-Path -LiteralPath $outputDirectory -PathType Container)) {
              throw "Audit output directory missing: $outputDirectory"
          }

          $outputFiles = @(
              Get-ChildItem `
                  -LiteralPath $outputDirectory `
                  -File `
                  -ErrorAction Stop |
                  Sort-Object Name
          )

          if ($outputFiles.Count -eq 0) {
              throw "Audit output directory contains no files."
          }

          Write-Host "[PASS] $outputDirectory"
          Write-Host ""

          Write-Host "Output files:"
          Write-Host ""

          foreach ($file in $outputFiles) {

              Write-Host "  $($file.Name) [$($file.Length) bytes]"
          }

          Write-Host ""
          Write-Host "[PASS] Audit output directory contains files."


      # ======================================================
      # 14. VERIFY EXPECTED AUDIT OUTPUTS
      # ======================================================

      - name: 14 - Verify expected audit outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY EXPECTED AUDIT OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $requiredOutputs = @(
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_summary.csv",
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_detail.csv",
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_inventory.csv",
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json",
              "data\validation\audit_history_gaps_post_recovery_checkpoint.json",
              "data\audit_history_gaps_post_recovery_status.csv"
          )

          foreach ($relativePath in $requiredOutputs) {

              $fullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Expected audit output missing: $fullPath"
              }

              $info = Get-Item -LiteralPath $fullPath

              if ($info.Length -le 0) {
                  throw "Expected audit output is empty: $fullPath"
              }

              Write-Host "[PASS] $relativePath"
              Write-Host "       $($info.Length) bytes"
          }

          Write-Host ""
          Write-Host "[PASS] Expected audit outputs confirmed."


      # ======================================================
      # 15. VERIFY RESULT JSON
      # ======================================================

      - name: 15 - Verify audit result JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT RESULT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $resultPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json"

          $result = Get-Content `
              -LiteralPath $resultPath `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $result) {
              throw "Unable to parse audit result JSON."
          }

          Write-Host "Program      : $($result.program)"
          Write-Host "Version      : $($result.version)"
          Write-Host "Mode         : $($result.mode)"
          Write-Host "Final status : $($result.final_status)"
          Write-Host ""

          if ($result.program -ne "audit_history_gaps_post_recovery.py") {
              throw "Unexpected audit result program: $($result.program)"
          }

          if ($result.version -ne "Clean V001") {
              throw "Unexpected audit result version: $($result.version)"
          }

          if ($result.mode -ne "READ_ONLY_POST_RECOVERY_AUDIT") {
              throw "Unexpected audit execution mode: $($result.mode)"
          }

          $allowedStatuses = @(
              "PASS",
              "PASS_WITH_UNAVAILABLE_HISTORY"
          )

          if ($allowedStatuses -notcontains $result.final_status) {

              throw "Audit final status is not PASS-compatible: $($result.final_status)"
          }

          if ($null -eq $result.post_recovery_audit) {
              throw "post_recovery_audit object missing."
          }

          $audit = $result.post_recovery_audit

          Write-Host "Targets                      : $($audit.targets)"
          Write-Host "Recovered targets            : $($audit.recovered_targets)"
          Write-Host "Remaining gap targets        : $($audit.remaining_gap_targets)"
          Write-Host "Remaining missing timestamps : $($audit.remaining_missing_timestamps)"
          Write-Host "Invalid targets              : $($audit.invalid_targets)"
          Write-Host "OHLCV errors                 : $($audit.ohlcv_errors)"
          Write-Host "Inventory failures           : $($audit.inventory_failures)"
          Write-Host ""

          if ([int]$audit.invalid_targets -ne 0) {
              throw "Audit contains invalid targets."
          }

          if ([int]$audit.ohlcv_errors -ne 0) {
              throw "Audit contains OHLCV errors."
          }

          if ([int]$audit.inventory_failures -ne 0) {
              throw "Audit contains inventory failures."
          }

          if ($null -eq $result.next_stage) {
              throw "next_stage object missing."
          }

          if ($result.next_stage.allowed -ne $true) {
              throw "Audit next-stage gate is not allowed."
          }

          Write-Host "[PASS] Result JSON contract valid."
          Write-Host "[PASS] Final status = $($result.final_status)"
          Write-Host "[PASS] Critical errors = 0"
          Write-Host "[PASS] Next-stage gate = allowed"


      # ======================================================
      # 16. VERIFY CHECKPOINT
      # ======================================================

      - name: 16 - Verify audit checkpoint
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          $checkpointPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\validation\audit_history_gaps_post_recovery_checkpoint.json"

          $checkpoint = Get-Content `
              -LiteralPath $checkpointPath `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $checkpoint) {
              throw "Unable to parse audit checkpoint JSON."
          }

          Write-Host "Program      : $($checkpoint.program)"
          Write-Host "Version      : $($checkpoint.version)"
          Write-Host "Status       : $($checkpoint.status)"
          Write-Host "Completed    : $($checkpoint.completed)"
          Write-Host "Final status : $($checkpoint.final_status)"
          Write-Host ""

          if ($checkpoint.program -ne "audit_history_gaps_post_recovery.py") {
              throw "Unexpected audit checkpoint program."
          }

          if ($checkpoint.version -ne "Clean V001") {
              throw "Unexpected audit checkpoint version."
          }

          if ($checkpoint.status -ne "COMPLETED") {
              throw "Audit checkpoint status is not COMPLETED."
          }

          if ($checkpoint.completed -ne $true) {
              throw "Audit checkpoint completed flag is not true."
          }

          $allowedStatuses = @(
              "PASS",
              "PASS_WITH_UNAVAILABLE_HISTORY"
          )

          if ($allowedStatuses -notcontains $checkpoint.final_status) {

              throw "Audit checkpoint final status is not PASS-compatible: $($checkpoint.final_status)"
          }

          Write-Host "[PASS] Audit checkpoint valid."


      # ======================================================
      # 17. VERIFY AUDIT EXIT CODE
      # ======================================================

      - name: 17 - Verify audit process exit code
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT PROCESS EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          if (-not (Test-Path -LiteralPath $exitFile -PathType Leaf)) {
              throw "Audit exit-code record missing."
          }

          $exitCodeText = (
              Get-Content `
                  -LiteralPath $exitFile `
                  -Raw
          ).Trim()

          $auditExitCode = [int]$exitCodeText

          Write-Host "Audit exit code:"
          Write-Host "  $auditExitCode"
          Write-Host ""

          if ($auditExitCode -ne 0) {

              throw "audit_history_gaps_post_recovery.py returned exit code $auditExitCode"
          }

          Write-Host "[PASS] Python audit exit code = 0"


      # ======================================================
      # 18. PRINT SUMMARY
      # ======================================================

      - name: 18 - Print audit summary
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "POST-RECOVERY AUDIT SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          $summaryPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_summary.csv"

          $rows = @(
              Import-Csv `
                  -LiteralPath $summaryPath
          )

          if ($rows.Count -eq 0) {
              throw "Audit summary contains no rows."
          }

          foreach ($row in $rows) {

              Write-Host "------------------------------------------------------------"

              foreach ($property in $row.PSObject.Properties) {

                  Write-Host "$($property.Name) : $($property.Value)"
              }
          }

          Write-Host "------------------------------------------------------------"
          Write-Host ""


      # ======================================================
      # 19. FINAL TEST GATE
      # ======================================================

      - name: 19 - Final Clean V003 test gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL POST-RECOVERY AUDIT TEST GATE"
          Write-Host "Clean V003"
          Write-Host "============================================================"
          Write-Host ""

          $resultPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json"

          $result = Get-Content `
              -LiteralPath $resultPath `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          $allowedStatuses = @(
              "PASS",
              "PASS_WITH_UNAVAILABLE_HISTORY"
          )

          if ($allowedStatuses -notcontains $result.final_status) {

              throw "Final audit status failed: $($result.final_status)"
          }

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeFile
          )

          $h1Count = @(
              $beforeRows |
              Where-Object { $_.timeframe -eq "h1" }
          ).Count

          $h4Count = @(
              $beforeRows |
              Where-Object { $_.timeframe -eq "h4" }
          ).Count

          $d1Count = @(
              $beforeRows |
              Where-Object { $_.timeframe -eq "d1" }
          ).Count

          Write-Host "Validated production inventory:"
          Write-Host "  H1    : $h1Count"
          Write-Host "  H4    : $h4Count"
          Write-Host "  D1    : $d1Count"
          Write-Host "  TOTAL : $($beforeRows.Count)"
          Write-Host ""

          Write-Host "[PASS] Final status = $($result.final_status)"
          Write-Host "[PASS] Production OHLCV file set unchanged."
          Write-Host "[PASS] Production OHLCV SHA256 unchanged."
          Write-Host "[PASS] Critical audit errors = 0."
          Write-Host "[PASS] Next-stage gate allowed."

          if ($result.final_status -eq "PASS_WITH_UNAVAILABLE_HISTORY") {

              Write-Host ""
              Write-Host "[INFO] Some historical timestamps remain unavailable."
              Write-Host "[INFO] No automatic permanent-unavailable assumption was made."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "audit_history_gaps_post_recovery_test.yml"
          Write-Host "Clean V003"
          Write-Host "TEST PASSED"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "NEXT:"
          Write-Host "  Production POST-RECOVERY AUDIT REVALIDATION"
          Write-Host "============================================================"


      # ======================================================
      # 20. FAILURE DIAGNOSTICS
      # ======================================================

      - name: 20 - Failure diagnostics
        if: failure()
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "POST-RECOVERY AUDIT TEST FAILED"
          Write-Host "Clean V003"
          Write-Host "============================================================"
          Write-Host ""

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          Write-Host "Audit process exit code:"
          Write-Host ""

          if (Test-Path -LiteralPath $exitFile -PathType Leaf) {

              Get-Content `
                  -LiteralPath $exitFile |
                  ForEach-Object {
                      Write-Host "  $_"
                  }
          }
          else {

              Write-Host "  Not available."
          }

          Write-Host ""

          $statusPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\audit_history_gaps_post_recovery_status.csv"

          if (Test-Path -LiteralPath $statusPath -PathType Leaf) {

              Write-Host "------------------------------------------------------------"
              Write-Host "AUDIT STATUS"
              Write-Host "------------------------------------------------------------"

              Get-Content `
                  -LiteralPath $statusPath `
                  -Encoding UTF8 |
                  Select-Object -Last 50 |
                  ForEach-Object {
                      Write-Host $_
                  }

              Write-Host ""
          }

          $resultPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json"

          if (Test-Path -LiteralPath $resultPath -PathType Leaf) {

              Write-Host "------------------------------------------------------------"
              Write-Host "AUDIT RESULT JSON"
              Write-Host "------------------------------------------------------------"

              Get-Content `
                  -LiteralPath $resultPath `
                  -Encoding UTF8 |
                  Select-Object -First 300 |
                  ForEach-Object {
                      Write-Host $_
                  }

              Write-Host ""
          }

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          if (Test-Path -LiteralPath $beforeFile -PathType Leaf) {

              $beforeRows = @(
                  Import-Csv -LiteralPath $beforeFile
              )

              Write-Host "------------------------------------------------------------"
              Write-Host "DISCOVERED BEFORE INVENTORY"
              Write-Host "------------------------------------------------------------"
              Write-Host ""

              foreach ($timeframe in @("h1", "h4", "d1")) {

                  $count = @(
                      $beforeRows |
                      Where-Object {
                          $_.timeframe -eq $timeframe
                      }
                  ).Count

                  Write-Host "$($timeframe.ToUpper()) : $count"
              }

              Write-Host "TOTAL : $($beforeRows.Count)"
              Write-Host ""
          }

          Write-Host "------------------------------------------------------------"
          Write-Host "SAFETY"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          Write-Host "Recovery execution       : DISABLED"
          Write-Host "OHLCV modification       : FORBIDDEN"
          Write-Host "OHLCV deletion           : FORBIDDEN"
          Write-Host "Upbit candle download    : DISABLED"
          Write-Host "Feature build            : DISABLED"
          Write-Host "256 detector             : DISABLED"
          Write-Host "Future labels            : DISABLED"
          Write-Host "Prediction               : DISABLED"
          Write-Host "Trading                  : DISABLED"
          Write-Host "Git reset                : DISABLED"
          Write-Host "Git clean                : DISABLED"
          Write-Host "Git commit               : DISABLED"
          Write-Host "Git push                 : DISABLED"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DO NOT RUN PRODUCTION WORKFLOW UNTIL THIS TEST PASSES."
          Write-Host "============================================================"


      # ======================================================
      # 21. UPLOAD TEST EVIDENCE
      # ======================================================

      - name: 21 - Upload post-recovery audit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: audit_history_gaps_post_recovery_test_Clean_V003

          if-no-files-found: warn

          retention-days: 30

          path: |
            data/reports/history_gap_post_recovery_audit/
            data/validation/audit_history_gaps_post_recovery_checkpoint.json
            data/audit_history_gaps_post_recovery_status.csv
