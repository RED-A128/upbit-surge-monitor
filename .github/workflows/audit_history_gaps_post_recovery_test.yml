# ============================================================
# Upbit Surge Monitor
# audit_history_gaps_post_recovery_test.yml
# Clean V002
# ============================================================
#
# PURPOSE
#
#   SAFE GitHub Actions test workflow for:
#
#       audit_history_gaps_post_recovery.py
#
#   POST-RECOVERY AUDIT REVALIDATION
#
# IMPORTANT
#
#   - READ-ONLY audit test
#   - NO OHLCV modification
#   - NO recovery execution
#   - NO API download
#   - NO Git commit / push
#   - Existing production OHLCV SHA256 is independently checked
#
# Clean V002 FIX
#
#   - Removed incorrect hard requirement:
#
#       data/recovery/
#
#   - The audit program itself is responsible for validating
#     the actual second-pass evidence contract.
#
# ============================================================

name: audit_history_gaps_post_recovery_test.yml


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: audit-history-gaps-post-recovery-test
  cancel-in-progress: false


jobs:

  audit-history-gaps-post-recovery-test:

    name: audit_history_gaps_post_recovery_test.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120


    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 1
          clean: false


      # ======================================================
      # 02. ENVIRONMENT
      # ======================================================

      - name: Show environment

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "POST-RECOVERY AUDIT REVALIDATION TEST"
          Write-Host "Workflow Clean V002"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner name : $env:RUNNER_NAME"
          Write-Host "Runner OS   : $env:RUNNER_OS"
          Write-Host "Runner arch : $env:RUNNER_ARCH"
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"
          Write-Host ""

          Write-Host "Ref:"
          Write-Host "  $env:GITHUB_REF"
          Write-Host ""

          Write-Host "SHA:"
          Write-Host "  $env:GITHUB_SHA"
          Write-Host ""

          Write-Host "Python:"
          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is not available."
          }

          Write-Host ""
          Write-Host "[PASS] Environment confirmed."


      # ======================================================
      # 03. VERIFY AUDIT PROGRAM
      # ======================================================

      - name: Verify audit program

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $AuditFile = Join-Path `
              $env:GITHUB_WORKSPACE `
              "audit_history_gaps_post_recovery.py"

          if (-not (Test-Path -LiteralPath $AuditFile -PathType Leaf)) {
              throw "Missing audit program: $AuditFile"
          }

          $Info = Get-Item -LiteralPath $AuditFile

          if ($Info.Length -le 0) {
              throw "Audit program is empty: $AuditFile"
          }

          Write-Host "File:"
          Write-Host "  $AuditFile"
          Write-Host ""

          Write-Host "Size:"
          Write-Host "  $($Info.Length) bytes"
          Write-Host ""

          $Text = Get-Content `
              -LiteralPath $AuditFile `
              -Raw `
              -Encoding UTF8

          if ($Text -notmatch 'PROGRAM\s*=\s*"audit_history_gaps_post_recovery\.py"') {
              throw "Unexpected PROGRAM declaration."
          }

          if ($Text -notmatch 'VERSION\s*=\s*"Clean V001"') {
              throw "Unexpected audit VERSION declaration."
          }

          if ($Text -notmatch 'EXECUTION_MODE\s*=\s*"READ_ONLY_POST_RECOVERY_AUDIT"') {
              throw "Unexpected audit EXECUTION_MODE declaration."
          }

          Write-Host "[PASS] audit_history_gaps_post_recovery.py"
          Write-Host "[PASS] Python version = Clean V001"
          Write-Host "[PASS] Mode = READ_ONLY_POST_RECOVERY_AUDIT"


      # ======================================================
      # 04. VERIFY PRODUCTION OHLCV DIRECTORIES
      # ======================================================

      - name: Verify production OHLCV directories

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $RequiredDirectories = @(

              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"

          )

          foreach ($RelativePath in $RequiredDirectories) {

              $FullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $RelativePath

              if (-not (Test-Path -LiteralPath $FullPath -PathType Container)) {

                  throw "Required OHLCV directory missing: $FullPath"

              }

              Write-Host "[PASS] $RelativePath"

          }

          Write-Host ""
          Write-Host "[PASS] Production OHLCV directories confirmed."


      # ======================================================
      # 05. SHOW CURRENT DATA STRUCTURE
      # ======================================================

      - name: Show relevant data structure

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CURRENT RELEVANT DATA STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $DataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          if (-not (Test-Path -LiteralPath $DataRoot -PathType Container)) {
              throw "Production data directory missing: $DataRoot"
          }

          Write-Host "Top-level data directories:"
          Write-Host ""

          Get-ChildItem `
              -LiteralPath $DataRoot `
              -Directory `
              -ErrorAction SilentlyContinue |
              Sort-Object Name |
              ForEach-Object {
                  Write-Host "  $($_.Name)"
              }

          Write-Host ""

          $ReportsRoot = Join-Path `
              $DataRoot `
              "reports"

          if (Test-Path -LiteralPath $ReportsRoot -PathType Container) {

              Write-Host "Report directories:"
              Write-Host ""

              Get-ChildItem `
                  -LiteralPath $ReportsRoot `
                  -Directory `
                  -ErrorAction SilentlyContinue |
                  Sort-Object Name |
                  ForEach-Object {
                      Write-Host "  reports\$($_.Name)"
                  }

          }

          Write-Host ""
          Write-Host "[PASS] Data structure inspection completed."


      # ======================================================
      # 06. VERIFY PRODUCTION OHLCV INVENTORY
      # ======================================================

      - name: Verify production OHLCV inventory

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"
          Write-Host ""

          $ExpectedPerTimeframe = 290
          $ExpectedTotal = 870

          $Counts = @{}

          foreach ($Timeframe in @("h1", "h4", "d1")) {

              $Directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$Timeframe"

              $Files = @(
                  Get-ChildItem `
                      -LiteralPath $Directory `
                      -File `
                      -Filter "*.csv" `
                      -ErrorAction Stop
              )

              $Count = $Files.Count

              $Counts[$Timeframe] = $Count

              Write-Host "$($Timeframe.ToUpper()) : $Count"

              if ($Count -ne $ExpectedPerTimeframe) {

                  throw "$($Timeframe.ToUpper()) inventory mismatch. Expected=$ExpectedPerTimeframe Found=$Count"

              }

          }

          $Total = `
              $Counts["h1"] + `
              $Counts["h4"] + `
              $Counts["d1"]

          Write-Host ""
          Write-Host "TOTAL : $Total"
          Write-Host ""

          if ($Total -ne $ExpectedTotal) {

              throw "Total OHLCV inventory mismatch. Expected=$ExpectedTotal Found=$Total"

          }

          Write-Host "[PASS] H1 = 290"
          Write-Host "[PASS] H4 = 290"
          Write-Host "[PASS] D1 = 290"
          Write-Host "[PASS] TOTAL = 870"


      # ======================================================
      # 07. RECORD BEFORE FILE LIST
      # ======================================================

      - name: Record OHLCV file list before audit

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV FILE LIST BEFORE AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          $ListFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          $Rows = @()

          foreach ($Timeframe in @("h1", "h4", "d1")) {

              $Directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$Timeframe"

              $Files = Get-ChildItem `
                  -LiteralPath $Directory `
                  -File `
                  -Filter "*.csv" |
                  Sort-Object Name

              foreach ($File in $Files) {

                  $Rows += [PSCustomObject]@{

                      timeframe = $Timeframe
                      filename  = $File.Name
                      fullpath  = $File.FullName
                      bytes     = $File.Length

                  }

              }

          }

          if ($Rows.Count -ne 870) {

              throw "Before-audit file inventory mismatch. Expected=870 Found=$($Rows.Count)"

          }

          $Rows |
              Export-Csv `
                  -LiteralPath $ListFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "Snapshot:"
          Write-Host "  $ListFile"
          Write-Host ""

          Write-Host "Files:"
          Write-Host "  $($Rows.Count)"
          Write-Host ""

          Write-Host "[PASS] BEFORE file inventory created."


      # ======================================================
      # 08. RECORD BEFORE SHA256
      # ======================================================

      - name: Record OHLCV hashes before audit

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          $HashFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_sha256.csv"

          $Rows = @()

          foreach ($Timeframe in @("h1", "h4", "d1")) {

              $Directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$Timeframe"

              $Files = Get-ChildItem `
                  -LiteralPath $Directory `
                  -File `
                  -Filter "*.csv" |
                  Sort-Object Name

              foreach ($File in $Files) {

                  $Hash = Get-FileHash `
                      -LiteralPath $File.FullName `
                      -Algorithm SHA256

                  $Rows += [PSCustomObject]@{

                      timeframe = $Timeframe
                      filename  = $File.Name
                      bytes     = $File.Length
                      sha256    = $Hash.Hash.ToLower()

                  }

              }

          }

          if ($Rows.Count -ne 870) {

              throw "Before-audit hash inventory mismatch. Expected=870 Found=$($Rows.Count)"

          }

          $Rows |
              Export-Csv `
                  -LiteralPath $HashFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "SHA256 snapshot:"
          Write-Host "  $HashFile"
          Write-Host ""

          Write-Host "Files:"
          Write-Host "  $($Rows.Count)"
          Write-Host ""

          Write-Host "[PASS] BEFORE SHA256 snapshot created."


      # ======================================================
      # 09. RUN AUDIT
      # ======================================================

      - name: Run post-recovery audit

        shell: powershell

        run: |

          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN POST-RECOVERY AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          Set-Location `
              -LiteralPath $env:GITHUB_WORKSPACE

          py audit_history_gaps_post_recovery.py

          $AuditExitCode = $LASTEXITCODE

          $ExitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          Set-Content `
              -LiteralPath $ExitFile `
              -Value $AuditExitCode `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Audit exit code:"
          Write-Host "  $AuditExitCode"
          Write-Host ""

          if ($AuditExitCode -eq 0) {

              Write-Host "[PASS] Audit process exit code = 0"

          }
          else {

              Write-Host "[FAIL] Audit process exit code = $AuditExitCode"

          }

          exit 0


      # ======================================================
      # 10. VERIFY AFTER INVENTORY
      # ======================================================

      - name: Verify OHLCV inventory unchanged

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV INVENTORY UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $BeforeListFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          if (-not (Test-Path -LiteralPath $BeforeListFile -PathType Leaf)) {
              throw "BEFORE file inventory missing."
          }

          $BeforeRows = @(
              Import-Csv -LiteralPath $BeforeListFile
          )

          $BeforeMap = @{}

          foreach ($Row in $BeforeRows) {

              $Key = "$($Row.timeframe)|$($Row.filename)"

              if ($BeforeMap.ContainsKey($Key)) {
                  throw "Duplicate BEFORE inventory key: $Key"
              }

              $BeforeMap[$Key] = [long]$Row.bytes

          }

          $AfterMap = @{}

          foreach ($Timeframe in @("h1", "h4", "d1")) {

              $Directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$Timeframe"

              $Files = Get-ChildItem `
                  -LiteralPath $Directory `
                  -File `
                  -Filter "*.csv" |
                  Sort-Object Name

              foreach ($File in $Files) {

                  $Key = "$Timeframe|$($File.Name)"

                  if ($AfterMap.ContainsKey($Key)) {
                      throw "Duplicate AFTER inventory key: $Key"
                  }

                  $AfterMap[$Key] = [long]$File.Length

              }

          }

          if ($BeforeMap.Count -ne 870) {
              throw "Invalid BEFORE inventory count: $($BeforeMap.Count)"
          }

          if ($AfterMap.Count -ne 870) {
              throw "Invalid AFTER inventory count: $($AfterMap.Count)"
          }

          $Differences = @()

          foreach ($Key in $BeforeMap.Keys) {

              if (-not $AfterMap.ContainsKey($Key)) {

                  $Differences += "MISSING_AFTER:$Key"
                  continue

              }

              if ($BeforeMap[$Key] -ne $AfterMap[$Key]) {

                  $Differences += "SIZE_CHANGED:$Key"

              }

          }

          foreach ($Key in $AfterMap.Keys) {

              if (-not $BeforeMap.ContainsKey($Key)) {

                  $Differences += "NEW_AFTER:$Key"

              }

          }

          if ($Differences.Count -gt 0) {

              foreach ($Item in $Differences) {
                  Write-Host $Item
              }

              throw "OHLCV inventory changed during READ-ONLY audit."

          }

          Write-Host "[PASS] BEFORE files = 870"
          Write-Host "[PASS] AFTER files  = 870"
          Write-Host "[PASS] No OHLCV file added."
          Write-Host "[PASS] No OHLCV file removed."
          Write-Host "[PASS] No OHLCV file size changed."


      # ======================================================
      # 11. VERIFY SHA256 UNCHANGED
      # ======================================================

      - name: Verify OHLCV hashes unchanged

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $BeforeHashFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_sha256.csv"

          if (-not (Test-Path -LiteralPath $BeforeHashFile -PathType Leaf)) {
              throw "BEFORE SHA256 snapshot missing."
          }

          $BeforeRows = @(
              Import-Csv -LiteralPath $BeforeHashFile
          )

          if ($BeforeRows.Count -ne 870) {
              throw "Invalid BEFORE SHA256 count. Expected=870 Found=$($BeforeRows.Count)"
          }

          $BeforeMap = @{}

          foreach ($Row in $BeforeRows) {

              $Key = "$($Row.timeframe)|$($Row.filename)"

              if ($BeforeMap.ContainsKey($Key)) {
                  throw "Duplicate BEFORE SHA256 key: $Key"
              }

              $BeforeMap[$Key] = $Row.sha256.ToLower()

          }

          $Changed = @()
          $AfterCount = 0

          foreach ($Timeframe in @("h1", "h4", "d1")) {

              $Directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$Timeframe"

              $Files = Get-ChildItem `
                  -LiteralPath $Directory `
                  -File `
                  -Filter "*.csv" |
                  Sort-Object Name

              foreach ($File in $Files) {

                  $AfterCount++

                  $Key = "$Timeframe|$($File.Name)"

                  if (-not $BeforeMap.ContainsKey($Key)) {

                      $Changed += "UNEXPECTED_FILE:$Key"
                      continue

                  }

                  $AfterHash = (
                      Get-FileHash `
                          -LiteralPath $File.FullName `
                          -Algorithm SHA256
                  ).Hash.ToLower()

                  if ($AfterHash -ne $BeforeMap[$Key]) {

                      $Changed += "HASH_CHANGED:$Key"

                  }

              }

          }

          if ($AfterCount -ne 870) {

              throw "AFTER SHA256 inventory mismatch. Expected=870 Found=$AfterCount"

          }

          if ($Changed.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV SHA256 differences:"
              Write-Host ""

              foreach ($Item in $Changed) {
                  Write-Host "  $Item"
              }

              throw "READ-ONLY safety violation: production OHLCV content changed."

          }

          Write-Host "[PASS] AFTER SHA256 files = 870"
          Write-Host "[PASS] All 870 SHA256 hashes unchanged."
          Write-Host "[PASS] READ-ONLY OHLCV safety confirmed."


      # ======================================================
      # 12. VERIFY AUDIT OUTPUT DIRECTORY
      # ======================================================

      - name: Verify audit output directory

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT OUTPUT DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          $OutputDirectory = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit"

          if (-not (Test-Path -LiteralPath $OutputDirectory -PathType Container)) {

              throw "Audit output directory missing: $OutputDirectory"

          }

          Write-Host "[PASS] $OutputDirectory"
          Write-Host ""

          Write-Host "Output files:"
          Write-Host ""

          $OutputFiles = @(
              Get-ChildItem `
                  -LiteralPath $OutputDirectory `
                  -File `
                  -ErrorAction Stop |
                  Sort-Object Name
          )

          if ($OutputFiles.Count -eq 0) {

              throw "Audit output directory contains no files."

          }

          foreach ($File in $OutputFiles) {

              Write-Host "  $($File.Name) [$($File.Length) bytes]"

          }

          Write-Host ""
          Write-Host "[PASS] Audit output directory contains files."


      # ======================================================
      # 13. VERIFY EXPECTED AUDIT OUTPUTS
      # ======================================================

      - name: Verify expected audit outputs

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY EXPECTED AUDIT OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $RequiredOutputs = @(

              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_summary.csv",
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_detail.csv",
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_inventory.csv",
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json",

              "data\validation\audit_history_gaps_post_recovery_checkpoint.json",

              "data\audit_history_gaps_post_recovery_status.csv"

          )

          foreach ($RelativePath in $RequiredOutputs) {

              $FullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $RelativePath

              if (-not (Test-Path -LiteralPath $FullPath -PathType Leaf)) {

                  throw "Expected audit output missing: $FullPath"

              }

              $Info = Get-Item -LiteralPath $FullPath

              if ($Info.Length -le 0) {

                  throw "Expected audit output is empty: $FullPath"

              }

              Write-Host "[PASS] $RelativePath"
              Write-Host "       $($Info.Length) bytes"

          }

          Write-Host ""
          Write-Host "[PASS] Expected audit outputs confirmed."


      # ======================================================
      # 14. VERIFY RESULT JSON
      # ======================================================

      - name: Verify audit result JSON

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT RESULT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $ResultPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json"

          $Result = Get-Content `
              -LiteralPath $ResultPath `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $Result) {
              throw "Unable to parse audit result JSON."
          }

          Write-Host "Program      : $($Result.program)"
          Write-Host "Version      : $($Result.version)"
          Write-Host "Mode         : $($Result.mode)"
          Write-Host "Final status : $($Result.final_status)"
          Write-Host ""

          if ($Result.program -ne "audit_history_gaps_post_recovery.py") {
              throw "Unexpected audit result program: $($Result.program)"
          }

          if ($Result.version -ne "Clean V001") {
              throw "Unexpected audit result version: $($Result.version)"
          }

          if ($Result.mode -ne "READ_ONLY_POST_RECOVERY_AUDIT") {
              throw "Unexpected audit execution mode: $($Result.mode)"
          }

          $AllowedStatuses = @(

              "PASS",
              "PASS_WITH_UNAVAILABLE_HISTORY"

          )

          if ($AllowedStatuses -notcontains $Result.final_status) {

              throw "Audit final status is not PASS-compatible: $($Result.final_status)"

          }

          if ($null -eq $Result.post_recovery_audit) {

              throw "post_recovery_audit object missing."

          }

          Write-Host "Targets:"
          Write-Host "  $($Result.post_recovery_audit.targets)"
          Write-Host ""

          Write-Host "Recovered targets:"
          Write-Host "  $($Result.post_recovery_audit.recovered_targets)"
          Write-Host ""

          Write-Host "Remaining gap targets:"
          Write-Host "  $($Result.post_recovery_audit.remaining_gap_targets)"
          Write-Host ""

          Write-Host "Remaining missing timestamps:"
          Write-Host "  $($Result.post_recovery_audit.remaining_missing_timestamps)"
          Write-Host ""

          Write-Host "Invalid targets:"
          Write-Host "  $($Result.post_recovery_audit.invalid_targets)"
          Write-Host ""

          Write-Host "OHLCV errors:"
          Write-Host "  $($Result.post_recovery_audit.ohlcv_errors)"
          Write-Host ""

          Write-Host "Inventory failures:"
          Write-Host "  $($Result.post_recovery_audit.inventory_failures)"
          Write-Host ""

          if ([int]$Result.post_recovery_audit.invalid_targets -ne 0) {

              throw "Audit contains invalid targets."

          }

          if ([int]$Result.post_recovery_audit.ohlcv_errors -ne 0) {

              throw "Audit contains OHLCV errors."

          }

          if ([int]$Result.post_recovery_audit.inventory_failures -ne 0) {

              throw "Audit contains inventory failures."

          }

          if ($null -eq $Result.next_stage) {

              throw "next_stage object missing."

          }

          if ($Result.next_stage.allowed -ne $true) {

              throw "Audit next-stage gate is not allowed."

          }

          Write-Host "[PASS] Result JSON contract valid."
          Write-Host "[PASS] Final status = $($Result.final_status)"
          Write-Host "[PASS] Critical errors = 0"
          Write-Host "[PASS] Next-stage gate = allowed"


      # ======================================================
      # 15. VERIFY AUDIT CHECKPOINT
      # ======================================================

      - name: Verify audit checkpoint

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          $CheckpointPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\validation\audit_history_gaps_post_recovery_checkpoint.json"

          $Checkpoint = Get-Content `
              -LiteralPath $CheckpointPath `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $Checkpoint) {

              throw "Unable to parse audit checkpoint JSON."

          }

          Write-Host "Program      : $($Checkpoint.program)"
          Write-Host "Version      : $($Checkpoint.version)"
          Write-Host "Status       : $($Checkpoint.status)"
          Write-Host "Completed    : $($Checkpoint.completed)"
          Write-Host "Final status : $($Checkpoint.final_status)"
          Write-Host ""

          if ($Checkpoint.program -ne "audit_history_gaps_post_recovery.py") {

              throw "Unexpected audit checkpoint program."

          }

          if ($Checkpoint.version -ne "Clean V001") {

              throw "Unexpected audit checkpoint version."

          }

          if ($Checkpoint.status -ne "COMPLETED") {

              throw "Audit checkpoint status is not COMPLETED."

          }

          if ($Checkpoint.completed -ne $true) {

              throw "Audit checkpoint completed flag is not true."

          }

          $AllowedStatuses = @(

              "PASS",
              "PASS_WITH_UNAVAILABLE_HISTORY"

          )

          if ($AllowedStatuses -notcontains $Checkpoint.final_status) {

              throw "Audit checkpoint final status is not PASS-compatible: $($Checkpoint.final_status)"

          }

          Write-Host "[PASS] Audit checkpoint valid."


      # ======================================================
      # 16. VERIFY PYTHON EXIT CODE
      # ======================================================

      - name: Verify audit process exit code

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT PROCESS EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          $ExitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          if (-not (Test-Path -LiteralPath $ExitFile -PathType Leaf)) {

              throw "Audit exit-code record missing."

          }

          $ExitCodeText = (
              Get-Content `
                  -LiteralPath $ExitFile `
                  -Raw
          ).Trim()

          $AuditExitCode = [int]$ExitCodeText

          Write-Host "Audit exit code:"
          Write-Host "  $AuditExitCode"
          Write-Host ""

          if ($AuditExitCode -ne 0) {

              throw "audit_history_gaps_post_recovery.py returned exit code $AuditExitCode"

          }

          Write-Host "[PASS] Python audit exit code = 0"


      # ======================================================
      # 17. PRINT SUMMARY
      # ======================================================

      - name: Print audit summary

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "POST-RECOVERY AUDIT SUMMARY"
          Write-Host "============================================================"
          Write-Host ""

          $SummaryPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_summary.csv"

          $Rows = @(
              Import-Csv `
                  -LiteralPath $SummaryPath
          )

          if ($Rows.Count -eq 0) {

              throw "Audit summary contains no rows."

          }

          foreach ($Row in $Rows) {

              Write-Host "------------------------------------------------------------"

              foreach ($Property in $Row.PSObject.Properties) {

                  Write-Host "$($Property.Name) : $($Property.Value)"

              }

          }

          Write-Host "------------------------------------------------------------"
          Write-Host ""


      # ======================================================
      # 18. FINAL TEST GATE
      # ======================================================

      - name: Final test gate

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL POST-RECOVERY AUDIT TEST GATE"
          Write-Host "============================================================"
          Write-Host ""

          $ResultPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json"

          $Result = Get-Content `
              -LiteralPath $ResultPath `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($Result.final_status -eq "PASS") {

              Write-Host "[PASS] FINAL STATUS = PASS"
              Write-Host ""
              Write-Host "[PASS] Post-recovery audit completed."
              Write-Host "[PASS] Production OHLCV inventory intact."
              Write-Host "[PASS] Production OHLCV SHA256 intact."
              Write-Host "[PASS] Critical audit errors = 0."
              Write-Host "[PASS] Next-stage gate allowed."

          }
          elseif ($Result.final_status -eq "PASS_WITH_UNAVAILABLE_HISTORY") {

              Write-Host "[PASS] FINAL STATUS = PASS_WITH_UNAVAILABLE_HISTORY"
              Write-Host ""
              Write-Host "[PASS] Post-recovery audit completed."
              Write-Host "[PASS] Production OHLCV inventory intact."
              Write-Host "[PASS] Production OHLCV SHA256 intact."
              Write-Host "[PASS] Critical audit errors = 0."
              Write-Host "[PASS] Next-stage gate allowed."
              Write-Host ""
              Write-Host "[INFO] Historical timestamps remain unavailable."
              Write-Host "[INFO] No automatic permanent-unavailable assumption is made."

          }
          else {

              throw "Final audit status failed: $($Result.final_status)"

          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "audit_history_gaps_post_recovery_test.yml"
          Write-Host "Workflow Clean V002"
          Write-Host "TEST PASSED"
          Write-Host "============================================================"


      # ======================================================
      # 19. FAILURE DIAGNOSTICS
      # ======================================================

      - name: Failure diagnostics

        if: failure()

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "POST-RECOVERY AUDIT TEST FAILED"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Python audit exit code:"
          Write-Host ""

          $ExitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          if (Test-Path -LiteralPath $ExitFile -PathType Leaf) {

              Get-Content `
                  -LiteralPath $ExitFile |
                  ForEach-Object {
                      Write-Host "  $_"
                  }

          }
          else {

              Write-Host "  Not available."

          }

          Write-Host ""

          $StatusPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\audit_history_gaps_post_recovery_status.csv"

          if (Test-Path -LiteralPath $StatusPath -PathType Leaf) {

              Write-Host "------------------------------------------------------------"
              Write-Host "AUDIT STATUS"
              Write-Host "------------------------------------------------------------"

              Get-Content `
                  -LiteralPath $StatusPath `
                  -Encoding UTF8 |
                  Select-Object -Last 30 |
                  ForEach-Object {
                      Write-Host $_
                  }

              Write-Host ""

          }

          $ResultPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\reports\history_gap_post_recovery_audit\history_gap_post_recovery_audit_result.json"

          if (Test-Path -LiteralPath $ResultPath -PathType Leaf) {

              Write-Host "------------------------------------------------------------"
              Write-Host "AUDIT RESULT JSON"
              Write-Host "------------------------------------------------------------"

              Get-Content `
                  -LiteralPath $ResultPath `
                  -Encoding UTF8 |
                  Select-Object -First 300 |
                  ForEach-Object {
                      Write-Host $_
                  }

              Write-Host ""

          }

          Write-Host "------------------------------------------------------------"
          Write-Host "SAFETY"
          Write-Host "------------------------------------------------------------"
          Write-Host ""
          Write-Host "No recovery operation is executed by this workflow."
          Write-Host "No API candle download is executed."
          Write-Host "No Git reset/clean/commit/push is executed."
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DO NOT RUN PRODUCTION WORKFLOW UNTIL THIS TEST PASSES."
          Write-Host "============================================================"
