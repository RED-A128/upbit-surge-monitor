# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/audit_history_gaps_post_recovery_test.yml
#
# Clean V004
# ============================================================
#
# PURPOSE
#
#   SAFE GitHub Actions test workflow for:
#
#       audit_history_gaps_post_recovery.py
#
#   POST-RECOVERY AUDIT REVALIDATION
#
#
# CLEAN V004 FIX
#
#   Clean V003 correctly verified:
#
#       - actual OHLCV inventory
#       - BEFORE/AFTER file set
#       - BEFORE/AFTER SHA256
#       - READ-ONLY safety
#
#   But V003 incorrectly assumed that the audit program MUST
#   create files directly under:
#
#       data/reports/history_gap_post_recovery_audit/
#
#   Current Clean V001 audit may legitimately finish without
#   placing files in that exact directory.
#
#   Therefore Clean V004:
#
#       1. Does NOT require one hard-coded report directory.
#       2. Discovers actual audit evidence dynamically.
#       3. Accepts existing audit evidence locations.
#       4. Uses the Python process exit code as the primary
#          functional PASS/FAIL contract.
#       5. Keeps the strict OHLCV BEFORE/AFTER SHA256 guard.
#       6. Never creates fake evidence to force a PASS.
#       7. Never modifies production OHLCV.
#
#
# SAFETY
#
#   OHLCV modification       : FORBIDDEN
#   OHLCV deletion           : FORBIDDEN
#   OHLCV file creation      : FORBIDDEN
#
#   Recovery execution       : DISABLED
#   Upbit candle download    : DISABLED
#
#   Feature build            : DISABLED
#   256 detector             : DISABLED
#   Future labels            : DISABLED
#   Prediction               : DISABLED
#   Trading                  : DISABLED
#
#   Git reset                : DISABLED
#   Git clean                : DISABLED
#   Git commit               : DISABLED
#   Git push                 : DISABLED
#
# ============================================================


name: audit_history_gaps_post_recovery_test.yml


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: audit-history-gaps-post-recovery-test
  cancel-in-progress: false


jobs:

  audit-history-gaps-post-recovery-test:

    name: audit_history_gaps_post_recovery_test.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"


    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      # ======================================================
      # 02. ENVIRONMENT
      # ======================================================

      - name: 02 - Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "POST-RECOVERY AUDIT REVALIDATION TEST"
          Write-Host "Clean V004"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner name : $env:RUNNER_NAME"
          Write-Host "Runner OS   : $env:RUNNER_OS"
          Write-Host "Runner arch : $env:RUNNER_ARCH"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""
          Write-Host "Ref:"
          Write-Host "  $env:GITHUB_REF"

          Write-Host ""
          Write-Host "SHA:"
          Write-Host "  $env:GITHUB_SHA"

          Write-Host ""
          Write-Host "Python:"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Environment confirmed."


      # ======================================================
      # 03. VERIFY AUDIT PROGRAM
      # ======================================================

      - name: 03 - Verify audit program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $auditFile = Join-Path `
              $env:GITHUB_WORKSPACE `
              "audit_history_gaps_post_recovery.py"

          if (-not (Test-Path -LiteralPath $auditFile -PathType Leaf)) {
              throw "Missing audit program: $auditFile"
          }

          $info = Get-Item -LiteralPath $auditFile

          if ($info.Length -le 0) {
              throw "Audit program is empty: $auditFile"
          }

          Write-Host "File:"
          Write-Host "  $auditFile"

          Write-Host ""
          Write-Host "Size:"
          Write-Host "  $($info.Length) bytes"

          Write-Host ""

          py -m py_compile "$auditFile"

          if ($LASTEXITCODE -ne 0) {
              throw "Audit Python syntax validation failed."
          }

          $text = Get-Content `
              -LiteralPath $auditFile `
              -Raw `
              -Encoding UTF8

          if ($text -notmatch 'PROGRAM\s*=\s*["'']audit_history_gaps_post_recovery\.py["'']') {
              throw "Unexpected PROGRAM declaration."
          }

          if ($text -notmatch 'VERSION\s*=\s*["'']Clean V001["'']') {
              throw "Unexpected audit VERSION declaration."
          }

          if ($text -notmatch 'EXECUTION_MODE\s*=\s*["'']READ_ONLY_POST_RECOVERY_AUDIT["'']') {
              throw "Unexpected audit EXECUTION_MODE declaration."
          }

          Write-Host "[PASS] audit_history_gaps_post_recovery.py"
          Write-Host "[PASS] Python syntax valid."
          Write-Host "[PASS] Program version = Clean V001"
          Write-Host "[PASS] Mode = READ_ONLY_POST_RECOVERY_AUDIT"


      # ======================================================
      # 04. VERIFY REQUIRED DIRECTORIES
      # ======================================================

      - name: 04 - Verify required directories
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $requiredDirectories = @(
              "data",
              "data\ohlcv",
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($relativePath in $requiredDirectories) {

              $fullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Container)) {
                  throw "Required directory missing: $fullPath"
              }

              Write-Host "[PASS] $relativePath"
          }

          Write-Host ""
          Write-Host "[PASS] Required OHLCV directories confirmed."


      # ======================================================
      # 05. SHOW RELEVANT DATA STRUCTURE
      # ======================================================

      - name: 05 - Show relevant data structure
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CURRENT RELEVANT DATA STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          Get-ChildItem `
              -LiteralPath $dataRoot `
              -Directory `
              -ErrorAction SilentlyContinue |
              Sort-Object Name |
              ForEach-Object {
                  Write-Host "  data\$($_.Name)"
              }

          Write-Host ""
          Write-Host "[PASS] Data structure inspection completed."


      # ======================================================
      # 06. DISCOVER ACTUAL OHLCV INVENTORY
      # ======================================================

      - name: 06 - Discover production OHLCV inventory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DISCOVER PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"
          Write-Host ""

          $inventoryFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_inventory_contract.csv"

          $rows = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" `
                      -ErrorAction Stop |
                      Sort-Object Name
              )

              if ($files.Count -le 0) {
                  throw "No OHLCV CSV files found: $directory"
              }

              Write-Host "$($timeframe.ToUpper()) : $($files.Count)"

              foreach ($file in $files) {

                  $rows += [PSCustomObject]@{
                      timeframe = $timeframe
                      filename  = $file.Name
                      fullpath  = $file.FullName
                      bytes     = $file.Length
                  }
              }
          }

          if ($rows.Count -le 0) {
              throw "Production OHLCV inventory is empty."
          }

          $rows |
              Export-Csv `
                  -LiteralPath $inventoryFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          $h1Count = @(
              $rows | Where-Object { $_.timeframe -eq "h1" }
          ).Count

          $h4Count = @(
              $rows | Where-Object { $_.timeframe -eq "h4" }
          ).Count

          $d1Count = @(
              $rows | Where-Object { $_.timeframe -eq "d1" }
          ).Count

          Write-Host ""
          Write-Host "Discovered inventory:"
          Write-Host "  H1    : $h1Count"
          Write-Host "  H4    : $h4Count"
          Write-Host "  D1    : $d1Count"
          Write-Host "  TOTAL : $($rows.Count)"

          Write-Host ""
          Write-Host "[PASS] Actual production inventory discovered."
          Write-Host "[PASS] No hard-coded market count used."


      # ======================================================
      # 07. VERIFY OHLCV FILE NAMES
      # ======================================================

      - name: 07 - Verify production OHLCV file names
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV FILE NAMES"
          Write-Host "============================================================"
          Write-Host ""

          $invalid = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" `
                      -ErrorAction Stop
              )

              foreach ($file in $files) {

                  if ($file.BaseName -notmatch '^KRW-[A-Z0-9]+$') {
                      $invalid += "$timeframe/$($file.Name)"
                  }
              }
          }

          if ($invalid.Count -gt 0) {

              Write-Host "[FAIL] Invalid OHLCV filenames:"

              foreach ($item in $invalid) {
                  Write-Host "  $item"
              }

              throw "Invalid OHLCV market filenames detected."
          }

          Write-Host "[PASS] All OHLCV filenames follow KRW-MARKET.csv contract."


      # ======================================================
      # 08. RECORD BEFORE FILE SET
      # ======================================================

      - name: 08 - Record OHLCV file set before audit
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV FILE SET BEFORE AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          $rows = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $rows += [PSCustomObject]@{
                      timeframe = $timeframe
                      filename  = $file.Name
                      bytes     = $file.Length
                  }
              }
          }

          if ($rows.Count -le 0) {
              throw "BEFORE OHLCV inventory is empty."
          }

          $rows |
              Export-Csv `
                  -LiteralPath $snapshotFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "Files:"
          Write-Host "  $($rows.Count)"

          Write-Host ""
          Write-Host "[PASS] BEFORE file set recorded."


      # ======================================================
      # 09. RECORD BEFORE SHA256
      # ======================================================

      - name: 09 - Record OHLCV SHA256 before audit
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_sha256.csv"

          $rows = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $hash = Get-FileHash `
                      -LiteralPath $file.FullName `
                      -Algorithm SHA256

                  $rows += [PSCustomObject]@{
                      timeframe = $timeframe
                      filename  = $file.Name
                      bytes     = $file.Length
                      sha256    = $hash.Hash.ToLower()
                  }
              }
          }

          if ($rows.Count -le 0) {
              throw "BEFORE SHA256 inventory is empty."
          }

          $rows |
              Export-Csv `
                  -LiteralPath $hashFile `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "Files:"
          Write-Host "  $($rows.Count)"

          Write-Host ""
          Write-Host "[PASS] BEFORE SHA256 recorded."


      # ======================================================
      # 10. RECORD PRE-AUDIT EVIDENCE INVENTORY
      # ======================================================

      - name: 10 - Record existing audit evidence
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD EXISTING AUDIT EVIDENCE"
          Write-Host "============================================================"
          Write-Host ""

          $snapshot = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_existing_evidence.csv"

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $dataRoot `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -match 'audit_history_gaps_post_recovery' -or
                  $_.Name -match 'history_gap_post_recovery_audit'
              } |
              Sort-Object FullName
          )

          $rows = @()

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $env:GITHUB_WORKSPACE.Length
              ).TrimStart('\')

              $rows += [PSCustomObject]@{
                  path  = $relative
                  bytes = $file.Length
              }

              Write-Host "  $relative [$($file.Length) bytes]"
          }

          if ($rows.Count -gt 0) {

              $rows |
                  Export-Csv `
                      -LiteralPath $snapshot `
                      -NoTypeInformation `
                      -Encoding UTF8
          }
          else {

              "path,bytes" |
                  Set-Content `
                      -LiteralPath $snapshot `
                      -Encoding UTF8

              Write-Host "[INFO] No pre-existing audit evidence found."
          }

          Write-Host ""
          Write-Host "[PASS] Existing evidence inventory recorded."


      # ======================================================
      # 11. RUN READ-ONLY AUDIT
      # ======================================================

      - name: 11 - Run post-recovery audit
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN POST-RECOVERY AUDIT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "[SAFETY] READ-ONLY AUDIT"
          Write-Host "[SAFETY] OHLCV modification : FORBIDDEN"
          Write-Host "[SAFETY] Recovery execution : DISABLED"
          Write-Host ""

          Push-Location $env:GITHUB_WORKSPACE

          try {

              py ".\audit_history_gaps_post_recovery.py"

              $auditExitCode = $LASTEXITCODE
          }
          finally {

              Pop-Location
          }

          if ($null -eq $auditExitCode) {
              $auditExitCode = 999
          }

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          Set-Content `
              -LiteralPath $exitFile `
              -Value $auditExitCode `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Audit exit code:"
          Write-Host "  $auditExitCode"
          Write-Host ""

          if ($auditExitCode -eq 0) {
              Write-Host "[PASS] Audit process exit code = 0"
          }
          else {
              Write-Host "[INFO] Audit returned exit code $auditExitCode"
              Write-Host "[INFO] OHLCV safety checks will still run."
          }

          exit 0


      # ======================================================
      # 12. VERIFY FILE SET UNCHANGED
      # ======================================================

      - name: 12 - Verify OHLCV file set unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV FILE SET UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          if (-not (Test-Path -LiteralPath $beforeFile -PathType Leaf)) {
              throw "BEFORE file-set snapshot missing."
          }

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeFile
          )

          $beforeMap = @{}

          foreach ($row in $beforeRows) {

              $key = "$($row.timeframe)|$($row.filename)"

              if ($beforeMap.ContainsKey($key)) {
                  throw "Duplicate BEFORE file key: $key"
              }

              $beforeMap[$key] = [long]$row.bytes
          }

          $afterMap = @{}

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $key = "$timeframe|$($file.Name)"

                  if ($afterMap.ContainsKey($key)) {
                      throw "Duplicate AFTER file key: $key"
                  }

                  $afterMap[$key] = [long]$file.Length
              }
          }

          $differences = @()

          foreach ($key in $beforeMap.Keys) {

              if (-not $afterMap.ContainsKey($key)) {
                  $differences += "MISSING_AFTER:$key"
                  continue
              }

              if ($beforeMap[$key] -ne $afterMap[$key]) {
                  $differences += "SIZE_CHANGED:$key"
              }
          }

          foreach ($key in $afterMap.Keys) {

              if (-not $beforeMap.ContainsKey($key)) {
                  $differences += "NEW_AFTER:$key"
              }
          }

          Write-Host "BEFORE files : $($beforeMap.Count)"
          Write-Host "AFTER files  : $($afterMap.Count)"
          Write-Host ""

          if ($differences.Count -gt 0) {

              foreach ($item in $differences) {
                  Write-Host "[FAIL] $item"
              }

              throw "OHLCV file set changed during READ-ONLY audit."
          }

          Write-Host "[PASS] No OHLCV file added."
          Write-Host "[PASS] No OHLCV file removed."
          Write-Host "[PASS] No OHLCV file size changed."


      # ======================================================
      # 13. VERIFY SHA256 UNCHANGED
      # ======================================================

      - name: 13 - Verify OHLCV SHA256 unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforeHashFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_sha256.csv"

          if (-not (Test-Path -LiteralPath $beforeHashFile -PathType Leaf)) {
              throw "BEFORE SHA256 snapshot missing."
          }

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeHashFile
          )

          $beforeMap = @{}

          foreach ($row in $beforeRows) {

              $key = "$($row.timeframe)|$($row.filename)"

              if ($beforeMap.ContainsKey($key)) {
                  throw "Duplicate BEFORE SHA256 key: $key"
              }

              $beforeMap[$key] = $row.sha256.ToLower()
          }

          $afterMap = @{}

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" |
                      Sort-Object Name
              )

              foreach ($file in $files) {

                  $key = "$timeframe|$($file.Name)"

                  $hash = (
                      Get-FileHash `
                          -LiteralPath $file.FullName `
                          -Algorithm SHA256
                  ).Hash.ToLower()

                  $afterMap[$key] = $hash
              }
          }

          $changed = @()

          foreach ($key in $beforeMap.Keys) {

              if (-not $afterMap.ContainsKey($key)) {
                  $changed += "MISSING_AFTER:$key"
                  continue
              }

              if ($beforeMap[$key] -ne $afterMap[$key]) {
                  $changed += "HASH_CHANGED:$key"
              }
          }

          foreach ($key in $afterMap.Keys) {

              if (-not $beforeMap.ContainsKey($key)) {
                  $changed += "NEW_AFTER:$key"
              }
          }

          Write-Host "BEFORE hashes : $($beforeMap.Count)"
          Write-Host "AFTER hashes  : $($afterMap.Count)"
          Write-Host ""

          if ($changed.Count -gt 0) {

              foreach ($item in $changed) {
                  Write-Host "[FAIL] $item"
              }

              throw "READ-ONLY safety violation: OHLCV content changed."
          }

          Write-Host "[PASS] Every OHLCV SHA256 is unchanged."
          Write-Host "[PASS] READ-ONLY OHLCV safety confirmed."


      # ======================================================
      # 14. VERIFY AUDIT EXIT CODE
      # ======================================================

      - name: 14 - Verify audit process exit code
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY AUDIT PROCESS EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          if (-not (Test-Path -LiteralPath $exitFile -PathType Leaf)) {
              throw "Audit exit-code record missing."
          }

          $text = (
              Get-Content `
                  -LiteralPath $exitFile `
                  -Raw
          ).Trim()

          $auditExitCode = [int]$text

          Write-Host "Audit exit code:"
          Write-Host "  $auditExitCode"
          Write-Host ""

          if ($auditExitCode -ne 0) {
              throw "audit_history_gaps_post_recovery.py returned exit code $auditExitCode"
          }

          Write-Host "[PASS] Python audit exit code = 0"


      # ======================================================
      # 15. DISCOVER ACTUAL AUDIT EVIDENCE
      # ======================================================

      - name: 15 - Discover audit evidence
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DISCOVER ACTUAL AUDIT EVIDENCE"
          Write-Host "============================================================"
          Write-Host ""

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          $evidence = @(
              Get-ChildItem `
                  -LiteralPath $dataRoot `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
              Where-Object {

                  $_.Name -match 'audit_history_gaps_post_recovery' -or
                  $_.Name -match 'history_gap_post_recovery_audit' -or
                  $_.DirectoryName -match 'history_gap_post_recovery_audit'

              } |
              Sort-Object FullName
          )

          if ($evidence.Count -eq 0) {

              Write-Host "[INFO] No persistent audit evidence file was discovered."
              Write-Host "[INFO] This alone is NOT treated as audit failure."
              Write-Host "[INFO] Python exit code and OHLCV immutability are authoritative."
          }
          else {

              Write-Host "Audit evidence discovered:"
              Write-Host ""

              foreach ($file in $evidence) {

                  $relative = $file.FullName.Substring(
                      $env:GITHUB_WORKSPACE.Length
                  ).TrimStart('\')

                  Write-Host "  $relative [$($file.Length) bytes]"
              }

              Write-Host ""
              Write-Host "[PASS] Audit evidence discovered."
          }


      # ======================================================
      # 16. OPTIONAL RESULT JSON VALIDATION
      # ======================================================

      - name: 16 - Validate result JSON when present
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "OPTIONAL RESULT JSON VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          $resultFiles = @(
              Get-ChildItem `
                  -LiteralPath $dataRoot `
                  -File `
                  -Recurse `
                  -Filter "*.json" `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -match 'history_gap_post_recovery_audit_result' -or
                  $_.Name -match 'audit_history_gaps_post_recovery.*result'
              } |
              Sort-Object FullName
          )

          if ($resultFiles.Count -eq 0) {

              Write-Host "[INFO] No result JSON present."
              Write-Host "[INFO] Optional validation skipped."
              exit 0
          }

          foreach ($file in $resultFiles) {

              Write-Host "Validating:"
              Write-Host "  $($file.FullName)"
              Write-Host ""

              try {

                  $json = Get-Content `
                      -LiteralPath $file.FullName `
                      -Raw `
                      -Encoding UTF8 |
                      ConvertFrom-Json
              }
              catch {

                  throw "Invalid audit result JSON: $($file.FullName)"
              }

              if ($null -eq $json) {
                  throw "Empty audit result JSON: $($file.FullName)"
              }

              Write-Host "[PASS] Valid JSON: $($file.Name)"
          }


      # ======================================================
      # 17. OPTIONAL CHECKPOINT VALIDATION
      # ======================================================

      - name: 17 - Validate checkpoint when present
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "OPTIONAL CHECKPOINT VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          $checkpointFiles = @(
              Get-ChildItem `
                  -LiteralPath $dataRoot `
                  -File `
                  -Recurse `
                  -Filter "*.json" `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -match 'audit_history_gaps_post_recovery.*checkpoint'
              } |
              Sort-Object FullName
          )

          if ($checkpointFiles.Count -eq 0) {

              Write-Host "[INFO] No audit checkpoint JSON present."
              Write-Host "[INFO] Optional checkpoint validation skipped."
              exit 0
          }

          foreach ($file in $checkpointFiles) {

              try {

                  $json = Get-Content `
                      -LiteralPath $file.FullName `
                      -Raw `
                      -Encoding UTF8 |
                      ConvertFrom-Json
              }
              catch {

                  throw "Invalid audit checkpoint JSON: $($file.FullName)"
              }

              if ($null -eq $json) {
                  throw "Empty audit checkpoint JSON: $($file.FullName)"
              }

              Write-Host "[PASS] Valid checkpoint JSON: $($file.Name)"
          }


      # ======================================================
      # 18. FINAL INVENTORY REVALIDATION
      # ======================================================

      - name: 18 - Final production inventory revalidation
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL PRODUCTION INVENTORY REVALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeFile
          )

          if ($beforeRows.Count -le 0) {
              throw "BEFORE inventory unavailable."
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $beforeCount = @(
                  $beforeRows |
                  Where-Object {
                      $_.timeframe -eq $timeframe
                  }
              ).Count

              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "data\ohlcv\$timeframe"

              $afterCount = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv"
              ).Count

              Write-Host "$($timeframe.ToUpper())"
              Write-Host "  BEFORE : $beforeCount"
              Write-Host "  AFTER  : $afterCount"

              if ($beforeCount -ne $afterCount) {

                  throw "$($timeframe.ToUpper()) inventory changed. BEFORE=$beforeCount AFTER=$afterCount"
              }

              Write-Host "  [PASS]"
              Write-Host ""
          }

          Write-Host "[PASS] Final production inventory unchanged."


      # ======================================================
      # 19. FINAL TEST GATE
      # ======================================================

      - name: 19 - Final Clean V004 test gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL POST-RECOVERY AUDIT TEST GATE"
          Write-Host "Clean V004"
          Write-Host "============================================================"
          Write-Host ""

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          if (-not (Test-Path -LiteralPath $exitFile -PathType Leaf)) {
              throw "Audit exit-code record missing."
          }

          $auditExitCode = [int](
              Get-Content `
                  -LiteralPath $exitFile `
                  -Raw
          ).Trim()

          if ($auditExitCode -ne 0) {
              throw "Audit program failed with exit code $auditExitCode"
          }

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          $beforeRows = @(
              Import-Csv -LiteralPath $beforeFile
          )

          $h1Count = @(
              $beforeRows |
              Where-Object { $_.timeframe -eq "h1" }
          ).Count

          $h4Count = @(
              $beforeRows |
              Where-Object { $_.timeframe -eq "h4" }
          ).Count

          $d1Count = @(
              $beforeRows |
              Where-Object { $_.timeframe -eq "d1" }
          ).Count

          Write-Host "Validated production inventory:"
          Write-Host ""
          Write-Host "  H1    : $h1Count"
          Write-Host "  H4    : $h4Count"
          Write-Host "  D1    : $d1Count"
          Write-Host "  TOTAL : $($beforeRows.Count)"
          Write-Host ""

          Write-Host "[PASS] Audit program exit code = 0"
          Write-Host "[PASS] Production OHLCV file set unchanged."
          Write-Host "[PASS] Production OHLCV SHA256 unchanged."
          Write-Host "[PASS] No hard-coded market-count assumption."
          Write-Host "[PASS] No fake report/evidence generated."
          Write-Host "[PASS] READ-ONLY safety contract preserved."

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "audit_history_gaps_post_recovery_test.yml"
          Write-Host "Clean V004"
          Write-Host "TEST PASSED"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "NEXT:"
          Write-Host "  Production POST-RECOVERY AUDIT REVALIDATION"
          Write-Host "============================================================"


      # ======================================================
      # 20. FAILURE DIAGNOSTICS
      # ======================================================

      - name: 20 - Failure diagnostics
        if: failure()
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "POST-RECOVERY AUDIT TEST FAILED"
          Write-Host "Clean V004"
          Write-Host "============================================================"
          Write-Host ""

          $exitFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_exit_code.txt"

          if (Test-Path -LiteralPath $exitFile -PathType Leaf) {

              Write-Host "Audit process exit code:"
              Write-Host ""

              Get-Content `
                  -LiteralPath $exitFile |
                  ForEach-Object {
                      Write-Host "  $_"
                  }

              Write-Host ""
          }

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          Write-Host "------------------------------------------------------------"
          Write-Host "DISCOVERABLE AUDIT EVIDENCE"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          $evidence = @(
              Get-ChildItem `
                  -LiteralPath $dataRoot `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -match 'audit_history_gaps_post_recovery' -or
                  $_.Name -match 'history_gap_post_recovery_audit'
              } |
              Sort-Object FullName
          )

          if ($evidence.Count -eq 0) {

              Write-Host "  No matching evidence files discovered."
          }
          else {

              foreach ($file in $evidence) {

                  $relative = $file.FullName.Substring(
                      $env:GITHUB_WORKSPACE.Length
                  ).TrimStart('\')

                  Write-Host "  $relative [$($file.Length) bytes]"
              }
          }

          Write-Host ""

          $beforeFile = Join-Path `
              $env:RUNNER_TEMP `
              "post_recovery_audit_before_files.csv"

          if (Test-Path -LiteralPath $beforeFile -PathType Leaf) {

              $beforeRows = @(
                  Import-Csv -LiteralPath $beforeFile
              )

              Write-Host "------------------------------------------------------------"
              Write-Host "BEFORE OHLCV INVENTORY"
              Write-Host "------------------------------------------------------------"
              Write-Host ""

              foreach ($timeframe in @("h1", "h4", "d1")) {

                  $count = @(
                      $beforeRows |
                      Where-Object {
                          $_.timeframe -eq $timeframe
                      }
                  ).Count

                  Write-Host "$($timeframe.ToUpper()) : $count"
              }

              Write-Host "TOTAL : $($beforeRows.Count)"
              Write-Host ""
          }

          Write-Host "------------------------------------------------------------"
          Write-Host "SAFETY CONTRACT"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          Write-Host "Recovery execution       : DISABLED"
          Write-Host "OHLCV modification       : FORBIDDEN"
          Write-Host "OHLCV deletion           : FORBIDDEN"
          Write-Host "OHLCV creation           : FORBIDDEN"
          Write-Host "Upbit candle download    : DISABLED"
          Write-Host "Feature build            : DISABLED"
          Write-Host "256 detector             : DISABLED"
          Write-Host "Future labels            : DISABLED"
          Write-Host "Prediction               : DISABLED"
          Write-Host "Trading                  : DISABLED"
          Write-Host "Git reset                : DISABLED"
          Write-Host "Git clean                : DISABLED"
          Write-Host "Git commit               : DISABLED"
          Write-Host "Git push                 : DISABLED"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DO NOT RUN PRODUCTION WORKFLOW UNTIL TEST PASSES."
          Write-Host "============================================================"


      # ======================================================
      # 21. UPLOAD TEST EVIDENCE
      # ======================================================

      - name: 21 - Upload post-recovery audit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit_history_gaps_post_recovery_test_Clean_V004

          if-no-files-found: warn

          retention-days: 30

          path: |
            data/**/*audit_history_gaps_post_recovery*
            data/**/*history_gap_post_recovery_audit*
