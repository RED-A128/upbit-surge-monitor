
name: evaluate_pattern_256_holdout_statistical_gate.yml

on:
  workflow_dispatch:
    inputs:
      holdout_run_id:
        description: "Successful Temporal Holdout Run ID"
        required: true
        default: "39964542010"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pattern-256-holdout-statistical-gate
  cancel-in-progress: false

jobs:
  statistical-gate:
    name: statistical-gate

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      SCRIPT_NAME: evaluate_pattern_256_holdout_statistical_gate.py
      EXPECTED_VERSION: Clean V001
      ARTIFACT_NAME: pattern-256-temporal-holdout-full-v001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          py -c "import csv, json, hashlib, math"

          if ($LASTEXITCODE -ne 0) {
            throw "Python dependencies unavailable"
          }

      - name: Validate analysis script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Analysis script missing: $script"
          }

          py -m py_compile "$script"

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

      - name: Download Temporal Holdout artifact
        uses: actions/download-artifact@v4
        with:
          name: pattern-256-temporal-holdout-full-v001
          run-id: ${{ inputs.holdout_run_id }}
          github-token: ${{ github.token }}
          path: holdout_input

      - name: Prepare isolated workspace
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = Join-Path `
            $env:RUNNER_TEMP `
            "pattern256_statistical_${{ github.run_id }}_${{ github.run_attempt }}"

          if (Test-Path -LiteralPath $workspace) {
            throw "Workspace already exists"
          }

          $sourceDir = Join-Path `
            $workspace `
            "data\reports\pattern_256_temporal_holdout"

          New-Item `
            -ItemType Directory `
            -Path $sourceDir `
            -Force | Out-Null

          $inputDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "holdout_input"

          if (-not (Test-Path -LiteralPath $inputDir)) {
            throw "Downloaded artifact directory missing"
          }

          $comparisonFiles = @(
            Get-ChildItem `
              -LiteralPath $inputDir `
              -Recurse `
              -File `
              -Filter "temporal_holdout_comparison.csv"
          )

          $resultFiles = @(
            Get-ChildItem `
              -LiteralPath $inputDir `
              -Recurse `
              -File `
              -Filter "temporal_holdout_result.json"
          )

          $manifestFiles = @(
            Get-ChildItem `
              -LiteralPath $inputDir `
              -Recurse `
              -File `
              -Filter "temporal_holdout_manifest.json"
          )

          if ($comparisonFiles.Count -ne 1) {
            throw "Expected exactly one comparison CSV"
          }

          if ($resultFiles.Count -ne 1) {
            throw "Expected exactly one result JSON"
          }

          if ($manifestFiles.Count -ne 1) {
            throw "Expected exactly one manifest JSON"
          }

          foreach ($file in @(
            $comparisonFiles[0],
            $resultFiles[0],
            $manifestFiles[0]
          )) {
            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination (
                Join-Path $sourceDir $file.Name
              ) `
              -ErrorAction Stop
          }

          "STATISTICAL_WORKSPACE=$workspace" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "ISOLATED WORKSPACE READY"

      - name: Verify source SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:STATISTICAL_WORKSPACE `
            "data\reports\pattern_256_temporal_holdout"

          $manifest = Get-Content `
            -LiteralPath (
              Join-Path $sourceDir "temporal_holdout_manifest.json"
            ) `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          $result = Get-Content `
            -LiteralPath (
              Join-Path $sourceDir "temporal_holdout_result.json"
            ) `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.execution_status -ne "PASS") {
            throw "Temporal Holdout execution was not PASS"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($result.comparison_rows -ne 18) {
            throw "Unexpected comparison count"
          }

          $filenames = @(
            "temporal_holdout_comparison.csv",
            "temporal_holdout_result.json"
          )

          foreach ($filename in $filenames) {
            $expected = [string](
              $manifest.output_sha256.$filename
            )

            if ($expected -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid source SHA256: $filename"
            }

            $filePath = Join-Path $sourceDir $filename

            $actual = (
              Get-FileHash `
                -LiteralPath $filePath `
                -Algorithm SHA256
            ).Hash

            if ($actual -ne $expected) {
              throw "Source SHA256 mismatch: $filename"
            }

            Write-Host "SOURCE SHA256 PASS: $filename"
          }

      - name: Run statistical gate
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py "$script" --root "$env:STATISTICAL_WORKSPACE"

          if ($LASTEXITCODE -ne 0) {
            throw "Statistical gate execution failed"
          }

      - name: Validate statistical result
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:STATISTICAL_WORKSPACE `
            "data\reports\pattern_256_holdout_statistical_gate"

          $resultPath = Join-Path `
            $outputDir `
            "statistical_gate_result.json"

          $manifestPath = Join-Path `
            $outputDir `
            "statistical_gate_manifest.json"

          $comparisonPath = Join-Path `
            $outputDir `
            "statistical_gate_comparison.csv"

          foreach ($path in @(
            $resultPath,
            $manifestPath,
            $comparisonPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Result version mismatch"
          }

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Manifest version mismatch"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Execution status is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected live trading approval"
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Unexpected OOS proof claim"
          }

          if ($result.statistical_independence_proven -ne $false) {
            throw "Unexpected independence proof claim"
          }

          if ($result.comparison_rows -ne 18) {
            throw "Expected 18 comparison rows"
          }

          if ($result.test_comparisons -ne 9) {
            throw "Expected 9 TEST comparisons"
          }

          $hashes = @(
            $manifest.output_sha256.PSObject.Properties
          )

          if ($hashes.Count -ne 2) {
            throw "Expected exactly two output hashes"
          }

          foreach ($entry in $hashes) {
            $filename = [string]$entry.Name
            $expected = [string]$entry.Value

            if ([IO.Path]::GetFileName($filename) -ne $filename) {
              throw "Unsafe manifest filename"
            }

            if ($expected -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid output SHA256"
            }

            $path = Join-Path $outputDir $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $filename"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $filename"
            }

            Write-Host "OUTPUT SHA256 PASS: $filename"
          }

          @(
            "## Pattern 256 Holdout Statistical Gate",
            "",
            "| Check | Result |",
            "|---|---|",
            "| Execution | PASS |",
            "| Research decision | HOLD |",
            "| TEST comparisons | $($result.test_comparisons) |",
            "| TEST improvements | $($result.test_observed_improvements) |",
            "| TEST deteriorations | $($result.test_observed_deteriorations) |",
            "| TEST small samples | $($result.test_small_samples) |",
            "| Independent OOS proven | False |",
            "| Live trading approved | False |",
            "",
            "Exploratory statistics do not prove independence."
          ) |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

          Write-Host "STATISTICAL GATE VALIDATION PASS"

      - name: Upload statistical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-holdout-statistical-gate-v001
          path: |
            ${{ runner.temp }}/pattern256_statistical_${{ github.run_id }}_${{ github.run_attempt }}/data/reports/pattern_256_holdout_statistical_gate/
          if-no-files-found: warn
          retention-days: 14
