name: audit_pattern_256_feature_point_in_time.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-pattern-256-feature-point-in-time
  cancel-in-progress: false

jobs:
  feature-point-in-time:
    name: feature-point-in-time

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_feature_point_in_time'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python validation failed"
          }

      - name: Verify audit script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_feature_point_in_time.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Audit script missing: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          Write-Host "PASS: audit script"

      - name: Verify source data
        run: |
          $ErrorActionPreference = "Stop"

          $trainPath = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_train_only\train_only_events.csv"

          $joinDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_train_feature_join"

          $joinResult = Join-Path `
            $joinDir `
            "train_feature_join_result.json"

          $joinManifest = Join-Path `
            $joinDir `
            "train_feature_join_manifest.json"

          $integrityResult = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_feature_join_integrity\feature_join_integrity_result.json"

          foreach ($path in @(
            $trainPath,
            $joinResult,
            $joinManifest,
            $integrityResult
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required source missing: $path"
            }

            Write-Host "FOUND: $path"
          }

          $shardDir = Join-Path $joinDir "shards"

          if (-not (Test-Path -LiteralPath $shardDir)) {
            throw "JOIN shard directory missing"
          }

          $shards = @(
            Get-ChildItem `
              -LiteralPath $shardDir `
              -Recurse `
              -Filter "*.csv" `
              -File
          )

          if ($shards.Count -eq 0) {
            throw "No JOIN shard CSV files found"
          }

          Write-Host "PASS: source data"
          Write-Host "JOIN shards: $($shards.Count)"

      - name: Run point-in-time and coverage audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_feature_point_in_time.py"

          py -u $script --root "$env:DATA_ROOT"

          if ($LASTEXITCODE -ne 0) {
            throw "Point-in-time audit failed"
          }

          Write-Host "PASS: audit script execution"

      - name: Verify audit result
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:REPORT_DIR `
            "feature_point_in_time_result.json"

          $manifestPath = Join-Path `
            $env:REPORT_DIR `
            "feature_point_in_time_manifest.json"

          foreach ($path in @(
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Audit output missing: $path"
            }

            Write-Host "FOUND: $path"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          Write-Host "===== AUDIT RESULT ====="
          $result | ConvertTo-Json -Depth 20

          Write-Host "===== AUDIT MANIFEST ====="
          $manifest | ConvertTo-Json -Depth 20

          if ($result.execution_status -and
              $result.execution_status -ne "PASS") {
            throw "Audit execution status is not PASS"
          }

          if ($result.approved_for_live_trading -eq $true) {
            throw "Unexpected live trading approval"
          }

          Write-Host "PASS: result and manifest files exist"
          Write-Host "NOTE: Execution success does not prove absence of future leakage"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:REPORT_DIR `
            "feature_point_in_time_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          @"
          # Pattern 256 Feature Point-in-Time Audit

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Version | $($result.version) |
          | Research decision | $($result.research_decision) |
          | Independent OOS proven | $($result.independent_oos_proven) |
          | Live trading approved | $($result.approved_for_live_trading) |

          ## Notes

          - Audit output files were located successfully.
          - Source data remains unchanged.
          - Point-in-time findings require review.
          - Execution success is not proof of no future leakage.
          - No automated trading is enabled.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-feature-point-in-time
          path: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_feature_point_in_time\'
          if-no-files-found: warn
          retention-days: 30
