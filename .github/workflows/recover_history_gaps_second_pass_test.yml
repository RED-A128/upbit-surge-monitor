              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(
                  handle
              )

              fieldnames = list(
                  reader.fieldnames
                  or []
              )

              rows = list(
                  reader
              )

          print(
              f"Target rows : {len(rows)}"
          )

          print(
              f"Columns     : {len(fieldnames)}"
          )

          normalized = {
              str(name).strip().lower():
