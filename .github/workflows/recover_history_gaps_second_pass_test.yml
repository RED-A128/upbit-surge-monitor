      - name: 14 - Record workspace 870-file SHA256 baseline
        run: |
          Write-Host "============================================================"
          Write-Host "WORKSPACE OHLCV SHA256 BASELINE"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          from pathlib import Path

          root = Path(
              "data/ohlcv"
          )

          output = Path(
              "_workspace_production_before_sha256.csv"
          )

          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          rows = []

          for timeframe in (
              "h1",
              "h4",
              "d1",
          ):

              directory = (
                  root
                  / timeframe
              )

              for path in sorted(
                  directory.glob(
                      "*.csv"
                  )
              ):

                  rows.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem,

                          "path":
                              path.relative_to(
                                  root
                              ).as_posix(),

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(
                                  path
                              ),
                      }
                  )

          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] Expected 870 files, "
                  f"found {len(rows)}"
              )

          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "path",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(
                  rows
              )

          print(
              f"[PASS] SHA256 baseline files : {len(rows)}"
          )

          print(
              f"[PASS] Saved : {output}"
          )
          '@ | Set-Content -Path "_record_workspace_hash.py" -Encoding UTF8

