      # ======================================================
      # 19. VERIFY ISOLATED COPY HASHES
      # ======================================================

      - name: 19 - Verify isolated copy equals workspace before test

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY ISOLATED COPY"
          Write-Host "============================================================"

          @'
          import hashlib
          from pathlib import Path


          production = Path(
              "data/ohlcv"
          )

          isolated = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()


          production_files = {}

          isolated_files = {}


          for path in production.rglob(
              "*.csv"
          ):

              relative = path.relative_to(
                  production
              ).as_posix()

              production_files[
                  relative
              ] = sha256_file(
                  path
              )


          for path in isolated.rglob(
              "*.csv"
          ):

              relative = path.relative_to(
                  isolated
              ).as_posix()

              isolated_files[
                  relative
              ] = sha256_file(
                  path
              )


          if len(production_files) != 870:

              raise SystemExit(
                  "[FAIL] Workspace file count is not 870."
              )


          if len(isolated_files) != 870:

              raise SystemExit(
                  "[FAIL] Isolated file count is not 870."
              )


          if (
              set(production_files)
              != set(isolated_files)
          ):

              raise SystemExit(
                  "[FAIL] Workspace/isolated file sets differ."
              )


          mismatches = []


          for relative in sorted(
              production_files
          ):

              if (
                  production_files[relative]
                  !=
                  isolated_files[relative]
              ):

                  mismatches.append(
                      relative
                  )


          if mismatches:

              print(
                  "[FAIL] Initial SHA256 mismatches:"
              )

              for item in mismatches[:20]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)


          print(
              "[PASS] Workspace files : 870"
          )

          print(
              "[PASS] Isolated files  : 870"
          )

          print(
              "[PASS] All 870 SHA256 values identical."
          )
          '@ | Set-Content -Path "_verify_isolated_copy.py" -Encoding UTF8

          py _verify_isolated_copy.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_verify_isolated_copy.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Isolated copy SHA256 validation failed."

          }


