# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/recover_history_gaps_second_pass_test.yml
#
# Clean V001
# ============================================================
#
# PURPOSE
#
#   Validate:
#
#       recover_history_gaps_second_pass.py
#
#   BEFORE allowing real second-pass OHLCV recovery.
#
#
# TEST SCOPE
#
#   1. Repository / Python environment validation
#   2. Required planner output validation
#   3. Production OHLCV inventory validation
#   4. Production 870-file SHA256 baseline
#   5. Isolated test workspace creation
#   6. Real Upbit API connectivity test
#   7. Second-pass recovery execution in isolated workspace
#   8. Existing candle immutability validation
#   9. Missing-candle insertion validation
#  10. No OHLCV file deletion validation
#  11. 870-file inventory preservation validation
#  12. Resume / checkpoint second execution
#  13. Resume idempotency validation
#  14. Production OHLCV SHA256 final comparison
#  15. Production OHLCV must remain 100% unchanged
#
#
# IMPORTANT
#
#   The recovery program is NOT executed against the repository's
#   production data/ohlcv directory.
#
#   A complete isolated copy is created first.
#
#   The recovery script itself is copied into the isolated project
#   root and executed there.
#
#   Because recover_history_gaps_second_pass.py resolves PROJECT_ROOT
#   from __file__, this guarantees that its data/ohlcv writes are
#   directed to the isolated workspace.
#
#
# SAFETY
#
#   Production OHLCV write       : FORBIDDEN
#   Production OHLCV delete      : FORBIDDEN
#
#   Isolated OHLCV write         : ENABLED
#   Real Upbit API               : ENABLED
#   Second-pass gap recovery     : ENABLED IN ISOLATED COPY ONLY
#
#   Feature build                : DISABLED
#   256 detector                 : DISABLED
#   Future labels                : DISABLED
#   Prediction                   : DISABLED
#   Trading                      : DISABLED
#
#   Git reset                    : DISABLED
#   Git clean                    : DISABLED
#   Git commit                   : DISABLED
#   Git push                     : DISABLED
#
# ============================================================


name: recover_history_gaps_second_pass_test.yml


on:

  workflow_dispatch:


permissions:

  contents: read


concurrency:

  group: recover-history-gaps-second-pass-test

  cancel-in-progress: false


jobs:

  recover-history-gaps-second-pass-test:

    name: recover_history_gaps_second_pass_test.yml

    runs-on:

      - self-hosted
      - Windows
      - X64


    timeout-minutes: 180


    defaults:

      run:

        shell: powershell


    env:

      PYTHONUTF8: "1"

      PYTHONIOENCODING: "utf-8"

      PYTHONUNBUFFERED: "1"

      TEST_ROOT: "_second_pass_recovery_test"

      EXPECTED_MARKETS: "290"

      EXPECTED_TIMEFRAMES: "3"

      EXPECTED_OHLCV_FILES: "870"


    steps:


      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # 02. BASIC INFORMATION
      # ======================================================

      - name: 02 - Show test information

        run: |

          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "SECOND-PASS RECOVERY TEST"
          Write-Host "Clean V001"
          Write-Host "============================================================"

          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""

          Write-Host "Safety mode:"
          Write-Host "  Production OHLCV write  : FORBIDDEN"
          Write-Host "  Production OHLCV delete : FORBIDDEN"
          Write-Host "  Isolated OHLCV write    : ENABLED"
          Write-Host "  Real Upbit API          : ENABLED"

          Write-Host ""

          Write-Host "Expected:"
          Write-Host "  Markets      : $env:EXPECTED_MARKETS"
          Write-Host "  Timeframes   : $env:EXPECTED_TIMEFRAMES"
          Write-Host "  OHLCV files  : $env:EXPECTED_OHLCV_FILES"

          Write-Host "============================================================"


      # ======================================================
      # 03. PYTHON
      # ======================================================

      - name: 03 - Verify Python

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {

              throw "Python launcher 'py' is unavailable."

          }

          Write-Host ""

          Write-Host "[PASS] Python launcher available."


      # ======================================================
      # 04. DEPENDENCIES
      # ======================================================

      - name: 04 - Install dependencies

        run: |

          Write-Host "============================================================"
          Write-Host "INSTALL / VERIFY DEPENDENCIES"
          Write-Host "============================================================"

          if (Test-Path "requirements.txt") {

              py -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {

                  throw "requirements.txt installation failed."

              }

          }
          else {

              Write-Host "[INFO] requirements.txt not found."
              Write-Host "[INFO] Installing requests directly."

              py -m pip install "requests>=2.32,<3"

              if ($LASTEXITCODE -ne 0) {

                  throw "requests installation failed."

              }

          }

          Write-Host ""

          py -c "import requests; print('requests', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {

              throw "Unable to import requests."

          }

          Write-Host ""

          Write-Host "[PASS] Python dependencies available."


      # ======================================================
      # 05. REQUIRED FILES
      # ======================================================

      - name: 05 - Verify required source files

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED FILES"
          Write-Host "============================================================"

          $required = @(

              "recover_history_gaps_second_pass.py",

              "data/recovery/history_gap_second_pass_targets.csv",

              "data/recovery/history_gap_second_pass_plan.json"

          )

          foreach ($file in $required) {

              if (-not (Test-Path $file)) {

                  throw "Required file missing: $file"

              }

              $item = Get-Item $file

              if ($item.Length -le 0) {

                  throw "Required file is empty: $file"

              }

              Write-Host "[PASS] $file"

          }


      # ======================================================
      # 06. SYNTAX CHECK
      # ======================================================

      - name: 06 - Python syntax check

        run: |

          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX CHECK"
          Write-Host "============================================================"

          py -m py_compile recover_history_gaps_second_pass.py

          if ($LASTEXITCODE -ne 0) {

              throw "Python syntax validation failed."

          }

          Write-Host ""

          Write-Host "[PASS] Python syntax valid."


      # ======================================================
      # 07. PRODUCTION OHLCV INVENTORY
      # ======================================================

      - name: 07 - Validate production OHLCV inventory

        run: |

          Write-Host "============================================================"
          Write-Host "VALIDATE PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"

          @'
          from pathlib import Path
          import sys


          root = Path("data/ohlcv")

          expected_markets = 290

          expected_total = 870

          timeframes = (
              "h1",
              "h4",
              "d1",
          )


          total = 0

          market_sets = {}


          for timeframe in timeframes:

              directory = root / timeframe

              if not directory.is_dir():

                  raise SystemExit(
                      f"[FAIL] Missing directory: {directory}"
                  )

              files = sorted(
                  directory.glob("*.csv")
              )

              count = len(files)

              total += count

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              print(
                  f"{timeframe.upper()} files : {count}"
              )

              if count != expected_markets:

                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, found {count}"
                  )


          if total != expected_total:

              raise SystemExit(
                  f"[FAIL] Expected total {expected_total}, "
                  f"found {total}"
              )


          reference = market_sets["h1"]


          for timeframe in (
              "h4",
              "d1",
          ):

              if market_sets[timeframe] != reference:

                  raise SystemExit(
                      "[FAIL] Market sets differ between "
                      f"H1 and {timeframe.upper()}."
                  )


          print()

          print(
              f"Markets : {len(reference)}"
          )

          print(
              f"Total   : {total}"
          )

          print()

          print(
              "[PASS] Production OHLCV inventory valid."
          )
          '@ | Set-Content -Path "_validate_production_inventory.py" -Encoding UTF8

          py _validate_production_inventory.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_validate_production_inventory.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Production OHLCV inventory validation failed."

          }


      # ======================================================
      # 08. TARGET FILE VALIDATION
      # ======================================================

      - name: 08 - Validate second-pass target contract

        run: |

          Write-Host "============================================================"
          Write-Host "VALIDATE SECOND-PASS TARGET CONTRACT"
          Write-Host "============================================================"

          @'
          import csv
          import json
          from pathlib import Path


          target_file = Path(
              "data/recovery/history_gap_second_pass_targets.csv"
          )

          plan_file = Path(
              "data/recovery/history_gap_second_pass_plan.json"
          )


          with target_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(handle)

              fieldnames = list(
                  reader.fieldnames
                  or []
              )

              rows = list(reader)


          print(
              f"Target rows : {len(rows)}"
          )

          print(
              f"Columns     : {len(fieldnames)}"
          )


          normalized = {
              str(name).strip().lower():
              name
              for name in fieldnames
          }


          if "classification" not in normalized:

              raise SystemExit(
                  "[FAIL] classification column missing."
              )


          classification_column = normalized[
              "classification"
          ]


          invalid = []


          for index, row in enumerate(
              rows,
              start=2,
          ):

              value = str(
                  row.get(
                      classification_column,
                      ""
                  )
              ).strip()

              if value != "READY_SECOND_PASS":

                  invalid.append(
                      (
                          index,
                          value,
                      )
                  )


          if invalid:

              print(
                  "[FAIL] Unauthorized target classifications:"
              )

              for item in invalid[:20]:

                  print(item)

              raise SystemExit(1)


          with plan_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              plan = json.load(handle)


          if not isinstance(
              plan,
              dict,
          ):

              raise SystemExit(
                  "[FAIL] Plan JSON root is not object."
              )


          if (
              str(
                  plan.get(
                      "program",
                      ""
                  )
              ).strip()
              !=
              "plan_history_gap_retry.py"
          ):

              raise SystemExit(
                  "[FAIL] Unexpected planner program."
              )


          if (
              str(
                  plan.get(
                      "version",
                      ""
                  )
              ).strip()
              !=
              "Clean V001"
          ):

              raise SystemExit(
                  "[FAIL] Unexpected planner version."
              )


          print()

          print(
              "[PASS] Target contract valid."
          )

          print(
              "[PASS] Every target is READY_SECOND_PASS."
          )

          print(
              "[PASS] Planner program/version valid."
          )
          '@ | Set-Content -Path "_validate_second_pass_targets.py" -Encoding UTF8

          py _validate_second_pass_targets.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_validate_second_pass_targets.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Second-pass target validation failed."

          }


      # ======================================================
      # 09. PRODUCTION SHA256 BASELINE
      # ======================================================

      - name: 09 - Record production 870-file SHA256 baseline

        run: |

          Write-Host "============================================================"
          Write-Host "PRODUCTION OHLCV SHA256 BASELINE"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          from pathlib import Path


          root = Path("data/ohlcv")

          output = Path(
              "_production_ohlcv_before.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(chunk)

              return digest.hexdigest()


          rows = []


          for timeframe in (
              "h1",
              "h4",
              "d1",
          ):

              directory = (
                  root
                  / timeframe
              )

              for path in sorted(
                  directory.glob("*.csv")
              ):

                  rows.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem.upper(),

                          "path":
                              path.as_posix(),

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] Expected 870 files, "
                  f"found {len(rows)}"
              )


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "path",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(rows)


          print(
              f"[PASS] SHA256 baseline files : {len(rows)}"
          )

          print(
              f"[PASS] Saved : {output}"
          )
          '@ | Set-Content -Path "_record_production_hash.py" -Encoding UTF8

          py _record_production_hash.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_record_production_hash.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Production SHA256 baseline failed."

          }


      # ======================================================
      # 10. CLEAN OLD ISOLATED TEST DIRECTORY
      # ======================================================

      - name: 10 - Prepare isolated test workspace

        run: |

          Write-Host "============================================================"
          Write-Host "PREPARE ISOLATED TEST WORKSPACE"
          Write-Host "============================================================"

          $testRoot = Join-Path $env:GITHUB_WORKSPACE $env:TEST_ROOT

          if (Test-Path $testRoot) {

              Write-Host "[INFO] Removing previous isolated test directory."

              Remove-Item `
                  -Path $testRoot `
                  -Recurse `
                  -Force

          }

          New-Item `
              -ItemType Directory `
              -Path $testRoot `
              -Force | Out-Null

          New-Item `
              -ItemType Directory `
              -Path (Join-Path $testRoot "data") `
              -Force | Out-Null

          Write-Host ""

          Write-Host "[PASS] Isolated root:"
          Write-Host "       $testRoot"


      # ======================================================
      # 11. COPY RECOVERY PROGRAM
      # ======================================================

      - name: 11 - Copy recovery program into isolated root

        run: |

          Write-Host "============================================================"
          Write-Host "COPY RECOVERY PROGRAM"
          Write-Host "============================================================"

          $testRoot = Join-Path $env:GITHUB_WORKSPACE $env:TEST_ROOT

          Copy-Item `
              "recover_history_gaps_second_pass.py" `
              (Join-Path $testRoot "recover_history_gaps_second_pass.py") `
              -Force

          if (-not (Test-Path (Join-Path $testRoot "recover_history_gaps_second_pass.py"))) {

              throw "Recovery program copy failed."

          }

          Write-Host "[PASS] Recovery program copied."


      # ======================================================
      # 12. COPY FULL 870-FILE OHLCV DATASET
      # ======================================================

      - name: 12 - Copy production OHLCV into isolated workspace

        run: |

          Write-Host "============================================================"
          Write-Host "COPY 870 OHLCV FILES TO ISOLATED WORKSPACE"
          Write-Host "============================================================"

          $testRoot = Join-Path $env:GITHUB_WORKSPACE $env:TEST_ROOT

          $destination = Join-Path $testRoot "data\ohlcv"

          Copy-Item `
              "data\ohlcv" `
              $destination `
              -Recurse `
              -Force

          $count = (
              Get-ChildItem `
                  -Path $destination `
                  -Filter "*.csv" `
                  -Recurse `
                  -File
          ).Count

          Write-Host ""

          Write-Host "Copied OHLCV files : $count"

          if ($count -ne 870) {

              throw "Isolated OHLCV copy expected 870 files, found $count."

          }

          Write-Host ""

          Write-Host "[PASS] Full OHLCV dataset isolated."


      # ======================================================
      # 13. COPY PLANNER OUTPUTS
      # ======================================================

      - name: 13 - Copy planner outputs into isolated workspace

        run: |

          Write-Host "============================================================"
          Write-Host "COPY SECOND-PASS PLANNER OUTPUTS"
          Write-Host "============================================================"

          $testRoot = Join-Path $env:GITHUB_WORKSPACE $env:TEST_ROOT

          $recoveryDir = Join-Path $testRoot "data\recovery"

          New-Item `
              -ItemType Directory `
              -Path $recoveryDir `
              -Force | Out-Null

          Copy-Item `
              "data\recovery\history_gap_second_pass_targets.csv" `
              (Join-Path $recoveryDir "history_gap_second_pass_targets.csv") `
              -Force

          Copy-Item `
              "data\recovery\history_gap_second_pass_plan.json" `
              (Join-Path $recoveryDir "history_gap_second_pass_plan.json") `
              -Force

          Write-Host "[PASS] Planner outputs copied."


      # ======================================================
      # 14. VERIFY ISOLATED COPY HASHES
      # ======================================================

      - name: 14 - Verify isolated copy equals production before test

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY ISOLATED COPY"
          Write-Host "============================================================"

          @'
          import hashlib
          from pathlib import Path


          production = Path(
              "data/ohlcv"
          )

          isolated = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(chunk)

              return digest.hexdigest()


          production_files = {}


          isolated_files = {}


          for path in production.rglob(
              "*.csv"
          ):

              relative = path.relative_to(
                  production
              ).as_posix()

              production_files[
                  relative
              ] = sha256_file(
                  path
              )


          for path in isolated.rglob(
              "*.csv"
          ):

              relative = path.relative_to(
                  isolated
              ).as_posix()

              isolated_files[
                  relative
              ] = sha256_file(
                  path
              )


          if len(production_files) != 870:

              raise SystemExit(
                  "[FAIL] Production file count is not 870."
              )


          if len(isolated_files) != 870:

              raise SystemExit(
                  "[FAIL] Isolated file count is not 870."
              )


          if (
              set(production_files)
              != set(isolated_files)
          ):

              raise SystemExit(
                  "[FAIL] Production/isolated file sets differ."
              )


          mismatches = []


          for relative in sorted(
              production_files
          ):

              if (
                  production_files[relative]
                  !=
                  isolated_files[relative]
              ):

                  mismatches.append(
                      relative
                  )


          if mismatches:

              print(
                  "[FAIL] Initial SHA256 mismatches:"
              )

              for item in mismatches[:20]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)


          print(
              "[PASS] Production files : 870"
          )

          print(
              "[PASS] Isolated files   : 870"
          )

          print(
              "[PASS] All 870 SHA256 values identical."
          )
          '@ | Set-Content -Path "_verify_isolated_copy.py" -Encoding UTF8

          py _verify_isolated_copy.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_verify_isolated_copy.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Isolated copy SHA256 validation failed."

          }


      # ======================================================
      # 15. RECORD ISOLATED BEFORE SNAPSHOT
      # ======================================================

      - name: 15 - Record isolated OHLCV before snapshot

        run: |

          Write-Host "============================================================"
          Write-Host "RECORD ISOLATED BEFORE SNAPSHOT"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          from pathlib import Path


          root = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )

          output = Path(
              "_isolated_before.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(chunk)

              return digest.hexdigest()


          rows = []


          for path in sorted(
              root.rglob("*.csv")
          ):

              relative = path.relative_to(
                  root
              ).as_posix()

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  row_count = max(
                      0,
                      sum(
                          1
                          for _ in handle
                      )
                      - 1
                  )

              rows.append(
                  {
                      "path":
                          relative,

                      "rows":
                          row_count,

                      "sha256":
                          sha256_file(path),
                  }
              )


          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] Expected 870 files, found {len(rows)}"
              )


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "path",
                      "rows",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(rows)


          print(
              "[PASS] Isolated BEFORE snapshot recorded."
          )
          '@ | Set-Content -Path "_record_isolated_before.py" -Encoding UTF8

          py _record_isolated_before.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_record_isolated_before.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Isolated before snapshot failed."

          }


      # ======================================================
      # 16. REAL UPBIT API CONNECTIVITY
      # ======================================================

      - name: 16 - Test real Upbit API connectivity

        run: |

          Write-Host "============================================================"
          Write-Host "REAL UPBIT API CONNECTIVITY TEST"
          Write-Host "============================================================"

          @'
          import requests


          url = (
              "https://api.upbit.com/v1/candles/minutes/60"
          )


          params = {
              "market":
                  "KRW-BTC",

              "count":
                  1,
          }


          response = requests.get(
              url,
              params=params,
              timeout=15,
              headers={
                  "Accept":
                      "application/json",

                  "User-Agent":
                      "Upbit-Surge-Monitor-Recovery-Test",
              },
          )


          print(
              "HTTP status :",
              response.status_code,
          )


          if response.status_code != 200:

              raise SystemExit(
                  "[FAIL] Upbit API connectivity failed: "
                  + response.text[:500]
              )


          payload = response.json()


          if (
              not isinstance(
                  payload,
                  list,
              )
              or
              len(payload) < 1
          ):

              raise SystemExit(
                  "[FAIL] Unexpected Upbit API response."
              )


          candle = payload[0]


          if (
              "candle_date_time_utc"
              not in candle
          ):

              raise SystemExit(
                  "[FAIL] candle_date_time_utc missing."
              )


          print(
              "Latest UTC candle :",
              candle[
                  "candle_date_time_utc"
              ],
          )

          print()

          print(
              "[PASS] Real Upbit API available."
          )
          '@ | Set-Content -Path "_test_upbit_api.py" -Encoding UTF8

          py _test_upbit_api.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_test_upbit_api.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Real Upbit API test failed."

          }


      # ======================================================
      # 17. FIRST ISOLATED RECOVERY
      # ======================================================

      - name: 17 - Execute first isolated second-pass recovery

        run: |

          Write-Host "============================================================"
          Write-Host "FIRST ISOLATED SECOND-PASS RECOVERY"
          Write-Host "============================================================"

          $testRoot = Join-Path $env:GITHUB_WORKSPACE $env:TEST_ROOT

          Push-Location $testRoot

          try {

              py recover_history_gaps_second_pass.py

              $exitCode = $LASTEXITCODE

          }
          finally {

              Pop-Location

          }

          if ($exitCode -ne 0) {

              throw "First isolated recovery execution failed with exit code $exitCode."

          }

