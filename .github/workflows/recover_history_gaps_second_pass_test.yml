              relative = path.relative_to(
                  root
              ).as_posix()

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  rows = max(
                      0,
                      sum(
                          1
                          for _ in handle
                      )
                      - 1
