          @'
          import hashlib
          from pathlib import Path

          production = Path(
              "data/ohlcv"
          )

          isolated = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )

          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          production_files = {}
          isolated_files = {}

          for path in production.rglob(
              "*.csv"
          ):

              relative = path.relative_to(
                  production
              ).as_posix()

              production_files[
                  relative
              ] = sha256_file(
