                      f"{expected_markets}, found {count}"
                  )

          if total != expected_total:

              raise SystemExit(
                  f"[FAIL] Expected total {expected_total}, "
                  f"found {total}"
              )

          reference = market_sets[
              "h1"
          ]

          for timeframe in (
              "h4",
              "d1",
          ):

              if (
                  market_sets[timeframe]
                  != reference
              ):

