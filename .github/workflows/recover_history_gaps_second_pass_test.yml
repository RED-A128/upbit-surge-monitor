          }

          Write-Host "[PASS] Recovery program copied."


      # ======================================================
      # 17. COPY FULL 870-FILE OHLCV DATASET
      # ======================================================

      - name: 17 - Copy workspace OHLCV into isolated workspace

        run: |

          Write-Host "============================================================"
          Write-Host "COPY 870 OHLCV FILES TO ISOLATED WORKSPACE"
