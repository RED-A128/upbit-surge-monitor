          )

          expected_markets = 290
          expected_total = 870

          timeframes = (
              "h1",
              "h4",
              "d1",
          )

          total = 0
          market_sets = {}

          for timeframe in timeframes:

              directory = (
                  root
                  / timeframe
              )

              if not directory.is_dir():

                  raise SystemExit(
                      f"[FAIL] Missing directory: {directory}"
                  )

              files = sorted(
                  directory.glob("*.csv")
              )

              count = len(files)
              total += count

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              print(
                  f"{timeframe.upper()} files : {count}"
              )

              if count != expected_markets:

