      - name: 36 - Verify recovery report SHA256 contract
        run: |
          Write-Host "============================================================"
          Write-Host "VERIFY RECOVERY REPORT SHA256 CONTRACT"
          Write-Host "============================================================"

          @'
          import csv
          from pathlib import Path

          report_root = (
              Path("_second_pass_recovery_test")
              / "data"
              / "reports"
              / "history_gap_second_pass_recovery"
          )

          before_file = (
              report_root
              / "history_gap_second_pass_before_sha256.csv"
          )

          after_file = (
              report_root
              / "history_gap_second_pass_after_sha256.csv"
          )

          for path in (
              before_file,
              after_file,
          ):

              if not path.is_file():

                  raise SystemExit(
                      f"[FAIL] Required SHA256 report missing: {path}"
                  )

              if path.stat().st_size <= 0:

                  raise SystemExit(
                      f"[FAIL] Required SHA256 report empty: {path}"
                  )

          def read_report(path):

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  reader = csv.DictReader(
                      handle
                  )

                  fields = list(
                      reader.fieldnames
                      or []
                  )

                  rows = list(
                      reader
                  )

              normalized = {
                  str(name).strip().lower():
                  name
                  for name in fields
              }

              required = (
                  "timeframe",
                  "market",
                  "path",
                  "sha256",
              )

              missing = [
                  name
                  for name in required
                  if name not in normalized
              ]

              if missing:

                  raise SystemExit(
                      f"[FAIL] Missing SHA256 report columns "
                      f"in {path}: {missing}"
                  )

              result = {}

              for row_number, row in enumerate(
                  rows,
                  start=2,
              ):

                  relative = str(
                      row.get(
                          normalized["path"],
                          "",
                      )
                  ).strip().replace(
                      "\\",
                      "/",
                  )

                  sha256 = str(
                      row.get(
                          normalized["sha256"],
                          "",
                      )
                  ).strip().lower()

                  timeframe = str(
                      row.get(
                          normalized["timeframe"],
                          "",
                      )
                  ).strip()

                  market = str(
                      row.get(
                          normalized["market"],
                          "",
                      )
                  ).strip()

                  if not relative:

                      raise SystemExit(
                          f"[FAIL] Empty path in {path} row {row_number}"
                      )

                  if len(sha256) != 64:

                      raise SystemExit(
                          f"[FAIL] Invalid SHA256 in {path} "
                          f"row {row_number}: {sha256!r}"
                      )

                  if relative in result:

                      raise SystemExit(
                          f"[FAIL] Duplicate path in {path}: {relative}"
                      )

                  result[
                      relative
                  ] = {
                      "timeframe":
                          timeframe,

                      "market":
                          market,

                      "sha256":
                          sha256,
                  }

              return result

          before = read_report(
              before_file
          )

          after = read_report(
              after_file
          )

          print(
              "Recovery BEFORE SHA256 rows :",
              len(before),
          )

          print(
              "Recovery AFTER SHA256 rows  :",
              len(after),
          )

          if set(before) != set(after):

