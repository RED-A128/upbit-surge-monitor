                  f"[FAIL] Expected 870 files, found {len(rows)}"
              )


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "path",
                      "rows",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(
                  rows
              )


          print(
              "[PASS] Isolated BEFORE snapshot recorded."
          )
          '@ | Set-Content -Path "_record_isolated_before.py" -Encoding UTF8

