              for name in fieldnames
          }

          if "classification" not in normalized:

              raise SystemExit(
                  "[FAIL] classification column missing."
              )

          classification_column = normalized[
              "classification"
          ]

          invalid = []

          for index, row in enumerate(
              rows,
              start=2,
          ):

              value = str(
                  row.get(
                      classification_column,
                      ""
                  )
              ).strip()

              if value != "READY_SECOND_PASS":

                  invalid.append(
                      (
                          index,
                          value,
                      )
                  )

          if invalid:

