      # 26. VERIFY EXISTING CANDLE IMMUTABILITY
      # ======================================================
      - name: 26 - Verify existing candle immutability
        run: |
          Write-Host "============================================================"
          Write-Host "VERIFY EXISTING CANDLE IMMUTABILITY"
          Write-Host "============================================================"

          @'
          import csv
          import json
          from pathlib import Path

          before_root = Path(
              "data/ohlcv"
          )

          after_root = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )

          result_file = Path(
              "_second_pass_recovery_test"
          ) / (
              "data/reports/"
              "history_gap_second_pass_recovery/"
              "history_gap_second_pass_recovery_result.json"
          )

          with result_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              result = json.load(
                  handle
              )

          changed_files = result.get(
              "changed_files",
              [],
          )

          if not isinstance(
              changed_files,
              list,
          ):

              raise SystemExit(
                  "[FAIL] changed_files is not list."
              )

          def read_csv(path):

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  reader = csv.DictReader(
                      handle
                  )

                  fieldnames = list(
                      reader.fieldnames
                      or []
                  )

                  rows = list(
                      reader
                  )

              return (
                  fieldnames,
                  rows,
              )

          def detect_timestamp_column(
              fieldnames,
          ):

              normalized = {
                  str(name).strip().lower():
                  name
                  for name in fieldnames
              }

              candidates = (
                  "timestamp",
                  "datetime",
                  "date_time",
                  "candle_date_time_utc",
                  "time",
                  "date",
              )

              for candidate in candidates:

                  if candidate in normalized:

                      return normalized[
                          candidate
                      ]

              raise RuntimeError(
                  "Unable to detect timestamp column."
              )

          checked_files = 0
          checked_existing_rows = 0
          inserted_rows = 0

          for item in changed_files:

              timeframe = str(
                  item.get(
                      "timeframe",
                      ""
                  )
              ).strip()

              market = str(
                  item.get(
                      "market",
                      ""
                  )
              ).strip()

              if (
                  not timeframe
                  or
                  not market
              ):

                  raise SystemExit(
                      "[FAIL] Invalid changed_files entry."
                  )

              relative = (
                  Path(timeframe)
                  / f"{market}.csv"
              )

              before_path = (
                  before_root
                  / relative
              )

              after_path = (
                  after_root
                  / relative
              )

              if not before_path.is_file():

                  raise SystemExit(
                      f"[FAIL] BEFORE file missing: {before_path}"
                  )

              if not after_path.is_file():

                  raise SystemExit(
                      f"[FAIL] AFTER file missing: {after_path}"
                  )

              (
                  before_fields,
                  before_rows,
              ) = read_csv(
                  before_path
              )

              (
                  after_fields,
                  after_rows,
              ) = read_csv(
                  after_path
              )

              before_timestamp = (
                  detect_timestamp_column(
                      before_fields
                  )
              )

              after_timestamp = (
                  detect_timestamp_column(
                      after_fields
                  )
              )

              before_map = {}

              for row in before_rows:

                  timestamp = str(
                      row.get(
                          before_timestamp,
                          ""
                      )
                  ).strip()

                  if not timestamp:

                      raise SystemExit(
                          f"[FAIL] Empty BEFORE timestamp: {relative}"
                      )

                  if timestamp in before_map:

                      raise SystemExit(
                          f"[FAIL] Duplicate BEFORE timestamp: "
                          f"{relative} {timestamp}"
                      )

                  before_map[
                      timestamp
                  ] = row

              after_map = {}

              for row in after_rows:

                  timestamp = str(
                      row.get(
                          after_timestamp,
                          ""
                      )
                  ).strip()

                  if not timestamp:

                      raise SystemExit(
                          f"[FAIL] Empty AFTER timestamp: {relative}"
                      )

                  if timestamp in after_map:

                      raise SystemExit(
                          f"[FAIL] Duplicate AFTER timestamp: "
                          f"{relative} {timestamp}"
                      )

                  after_map[
                      timestamp
                  ] = row

              missing_existing = (
                  set(before_map)
                  - set(after_map)
              )

              if missing_existing:

                  raise SystemExit(
                      "[FAIL] Existing candles disappeared: "
                      f"{relative} "
                      f"{sorted(missing_existing)[:10]}"
                  )

              common_columns = [
                  name
                  for name in before_fields
                  if name in after_fields
              ]

              for timestamp in before_map:

                  before_row = before_map[
                      timestamp
                  ]

                  after_row = after_map[
                      timestamp
                  ]

                  for column in common_columns:

                      before_value = str(
                          before_row.get(
                              column,
                              ""
                          )
                      )

                      after_value = str(
                          after_row.get(
                              column,
                              ""
                          )
                      )

                      if (
                          before_value
                          !=
                          after_value
                      ):

                          raise SystemExit(
                              "[FAIL] Existing candle modified: "
                              f"{relative} "
                              f"timestamp={timestamp} "
                              f"column={column} "
                              f"before={before_value!r} "
                              f"after={after_value!r}"
                          )

                  checked_existing_rows += 1

              inserted = (
                  set(after_map)
                  - set(before_map)
              )

              inserted_rows += len(
                  inserted
              )

              checked_files += 1

          print(
              "Changed files checked :",
              checked_files,
          )

          print(
              "Existing rows checked :",
              checked_existing_rows,
          )

          print(
              "Inserted timestamps   :",
              inserted_rows,
          )

          print()

          print(
              "[PASS] Every pre-existing candle remained byte-value equivalent by CSV field."
          )

          print(
              "[PASS] Recovery only added timestamps not present before."
          )
          '@ | Set-Content -Path "_verify_existing_candles.py" -Encoding UTF8

          py _verify_existing_candles.py

