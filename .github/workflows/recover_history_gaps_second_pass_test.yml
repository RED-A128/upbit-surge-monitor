      - name: 21 - Verify existing candle immutability

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY EXISTING CANDLE IMMUTABILITY"
          Write-Host "============================================================"

          @'
          import csv
          import json
          from datetime import datetime, timezone
          from pathlib import Path


          production_root = Path(
              "data/ohlcv"
          )

          isolated_root = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )

          result_file = Path(
              "_second_pass_recovery_test"
          ) / (
              "data/reports/"
              "history_gap_second_pass_recovery/"
              "history_gap_second_pass_recovery_result.json"
          )


          timestamp_aliases = (
              "candle_date_time_utc",
              "timestamp",
              "datetime",
              "date_time",
              "time",
              "utc_time",
          )


          def clean(value):

              if value is None:

                  return ""

              return str(value).strip()


          def normalize(value):

              text = clean(value).lower()

              result = []

              previous = False

              for char in text:

                  if char.isalnum():

                      result.append(char)

                      previous = False

                  else:

                      if not previous:

                          result.append("_")

                          previous = True

              return "".join(
                  result
              ).strip("_")


          def detect_timestamp(fieldnames):

              mapping = {
                  normalize(name):
                  name
                  for name in fieldnames
              }

              for alias in timestamp_aliases:

                  key = normalize(alias)

                  if key in mapping:

                      return mapping[key]

              raise RuntimeError(
                  "Timestamp column not found."
              )


          def parse_datetime(value):

              text = clean(value)

              if not text:

                  return None

              if text.isdigit():

                  number = int(text)

                  if number > 10_000_000_000:

                      return datetime.fromtimestamp(
                          number / 1000.0,
                          tz=timezone.utc,
                      )

                  return datetime.fromtimestamp(
                      number,
                      tz=timezone.utc,
                  )

              text = text.replace(
                  "Z",
                  "+00:00",
              )

              try:

                  dt = datetime.fromisoformat(
                      text
                  )

                  if dt.tzinfo is None:

                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:

                  pass

              try:

                  dt = datetime.fromisoformat(
                      text.replace(
                          " ",
                          "T",
                      )
                  )

                  if dt.tzinfo is None:

                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:

                  return None


          def load_csv(path):

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  reader = csv.DictReader(
                      handle
                  )

                  fields = list(
                      reader.fieldnames
                      or []
                  )

                  rows = [
                      {
                          str(k):
                          clean(v)
                          for k, v
                          in row.items()
                          if k is not None
                      }
                      for row in reader
                  ]

              timestamp_column = (
                  detect_timestamp(
                      fields
                  )
              )

              mapping = {}


              for row in rows:

                  dt = parse_datetime(
                      row.get(
                          timestamp_column,
                          ""
                      )
                  )

                  if dt is None:

                      raise RuntimeError(
                          f"Invalid timestamp: {path}"
                      )

                  key = int(
                      dt.timestamp()
                  )

                  if key in mapping:

                      raise RuntimeError(
                          f"Duplicate timestamp: {path}"
                      )

                  mapping[key] = row


              return (
                  fields,
                  mapping,
              )


          with result_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              result = json.load(handle)


          changed = result.get(
              "changed_files",
              [],
          )


          checked_files = 0

          checked_existing_rows = 0


          for item in changed:

              timeframe = str(
                  item.get(
                      "timeframe",
                      ""
                  )
              ).strip()

              market = str(
                  item.get(
                      "market",
                      ""
                  )
              ).strip()


              before_path = (
                  production_root
                  / timeframe
                  / f"{market}.csv"
              )

              after_path = (
                  isolated_root
                  / timeframe
                  / f"{market}.csv"
              )


              if not before_path.is_file():

                  raise SystemExit(
                      "[FAIL] Production comparison file missing: "
                      f"{before_path}"
                  )


              if not after_path.is_file():

                  raise SystemExit(
                      "[FAIL] Isolated comparison file missing: "
                      f"{after_path}"
                  )


              before_fields, before_map = (
                  load_csv(
                      before_path
                  )
              )

              after_fields, after_map = (
                  load_csv(
                      after_path
                  )
              )


              if before_fields != after_fields:

                  raise SystemExit(
                      "[FAIL] Header changed: "
                      f"{timeframe}/{market}"
                  )


              if not set(
                  before_map
              ).issubset(
                  set(after_map)
              ):

                  raise SystemExit(
                      "[FAIL] Existing timestamp disappeared: "
                      f"{timeframe}/{market}"
                  )


              for timestamp in before_map:

                  before_row = before_map[
                      timestamp
                  ]

                  after_row = after_map[
                      timestamp
                  ]


                  for field in before_fields:

                      if (
                          clean(
                              before_row.get(
                                  field,
                                  ""
                              )
                          )
                          !=
                          clean(
                              after_row.get(
                                  field,
                                  ""
                              )
                          )
                      ):

                          raise SystemExit(
                              "[FAIL] Existing candle changed: "
                              f"{timeframe}/{market} "
                              f"timestamp={timestamp} "
                              f"field={field}"
                          )


                  checked_existing_rows += 1


              checked_files += 1


          print(
              "Changed files checked :",
              checked_files,
          )

          print(
              "Existing rows checked :",
              checked_existing_rows,
          )

          print()

          print(
              "[PASS] Every pre-existing candle remained unchanged."
          )
          '@ | Set-Content -Path "_verify_existing_candles.py" -Encoding UTF8

          py _verify_existing_candles.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_verify_existing_candles.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Existing candle immutability validation failed."

          }


