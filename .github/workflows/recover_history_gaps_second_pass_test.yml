# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/recover_history_gaps_second_pass_test.yml
#
# Clean V009
# ============================================================
#
# PURPOSE
#
#   Validate:
#
#       recover_history_gaps_second_pass.py
#
#   BEFORE allowing real second-pass OHLCV recovery.
#
#
# TEST SCOPE
#
#   1. Repository / Python environment validation
#   2. Local production OHLCV inventory validation
#   3. Local production 870-file BEFORE SHA256 baseline
#   4. Safe local-production -> workspace synchronization
#   5. Workspace copy 870-file SHA256 verification
#   6. Planner output generation / validation
#   7. Workspace OHLCV inventory validation
#   8. Workspace 870-file SHA256 baseline
#   9. Isolated test workspace creation
#  10. Real Upbit API connectivity test
#  11. Second-pass recovery execution in isolated workspace
#  12. Existing candle immutability validation
#  13. Missing-candle insertion validation
#  14. No OHLCV file deletion validation
#  15. 870-file inventory preservation validation
#  16. Resume / checkpoint second execution
#  17. Resume idempotency validation
#  18. Workspace OHLCV SHA256 final comparison
#  19. Local production OHLCV final SHA256 comparison
#
#
# IMPORTANT
#
#   The real accumulated OHLCV source is:
#
#       C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv
#
#   It is treated as READ-ONLY source data.
#
#   The workflow:
#
#       1. validates the local production OHLCV set
#       2. records SHA256 for all 870 source files
#       3. copies the dataset into GITHUB_WORKSPACE\data\ohlcv
#       4. verifies every copied file against the source SHA256
#       5. runs the planner only after the copy is verified
#       6. creates another isolated recovery workspace
#       7. executes real recovery only inside that isolated copy
#       8. verifies the local production source remained unchanged
#
#
# SAFETY
#
#   Local production OHLCV write : FORBIDDEN
#   Local production OHLCV delete: FORBIDDEN
#
#   Workspace OHLCV staging      : ENABLED
#   Isolated OHLCV write         : ENABLED
#   Real Upbit API               : ENABLED
#   Second-pass gap recovery     : ENABLED IN ISOLATED COPY ONLY
#
#   Feature build                : DISABLED
#   256 detector                 : DISABLED
#   Future labels                : DISABLED
#   Prediction                   : DISABLED
#   Trading                      : DISABLED
#
#   Git reset                    : DISABLED
#   Git clean                    : DISABLED
#   Git commit                   : DISABLED
#   Git push                     : DISABLED
#
# ============================================================

name: recover_history_gaps_second_pass_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-history-gaps-second-pass-test
  cancel-in-progress: false

jobs:
  recover-history-gaps-second-pass-test:
    name: recover_history_gaps_second_pass_test.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"

      TEST_ROOT: "_second_pass_recovery_test"

      LOCAL_PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      LOCAL_DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor\data'
      LOCAL_PRODUCTION_OHLCV: 'C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv'

      LOCAL_AUDIT_REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\history_gap_recovery_audit'
      LOCAL_RETRY_CANDIDATE_FILE: 'C:\Users\USER\Documents\upbit-surge-monitor\data\recovery\history_gap_recovery_retry_candidates.csv'

      EXPECTED_MARKETS: "290"
      EXPECTED_TIMEFRAMES: "3"
      EXPECTED_OHLCV_FILES: "870"

    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 02. BASIC INFORMATION
      # ======================================================

      - name: 02 - Show test information
        run: |
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "SECOND-PASS RECOVERY TEST"
          Write-Host "Clean V009"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"
          Write-Host ""

          Write-Host "Local production OHLCV:"
          Write-Host "  $env:LOCAL_PRODUCTION_OHLCV"
          Write-Host ""

          Write-Host "Safety mode:"
          Write-Host "  Local production OHLCV write  : FORBIDDEN"
          Write-Host "  Local production OHLCV delete : FORBIDDEN"
          Write-Host "  Workspace staging             : ENABLED"
          Write-Host "  Isolated OHLCV write          : ENABLED"
          Write-Host "  Real Upbit API                : ENABLED"
          Write-Host ""

          Write-Host "Expected:"
          Write-Host "  Markets      : $env:EXPECTED_MARKETS"
          Write-Host "  Timeframes   : $env:EXPECTED_TIMEFRAMES"
          Write-Host "  OHLCV files  : $env:EXPECTED_OHLCV_FILES"

          Write-Host "============================================================"


      # ======================================================
      # 03. PYTHON
      # ======================================================

      - name: 03 - Verify Python
        run: |
          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Python launcher available."


      # ======================================================
      # 04. DEPENDENCIES
      # ======================================================

      - name: 04 - Install dependencies
        run: |
          Write-Host "============================================================"
          Write-Host "INSTALL / VERIFY DEPENDENCIES"
          Write-Host "============================================================"

          if (Test-Path "requirements.txt") {

              py -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "requirements.txt installation failed."
              }

          }
          else {

              Write-Host "[INFO] requirements.txt not found."
              Write-Host "[INFO] Installing requests directly."

              py -m pip install "requests>=2.32,<3"

              if ($LASTEXITCODE -ne 0) {
                  throw "requests installation failed."
              }
          }

          Write-Host ""

          py -c "import requests; print('requests', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to import requests."
          }

          Write-Host ""
          Write-Host "[PASS] Python dependencies available."


      # ======================================================
      # 05. SOURCE FILES
      # ======================================================

      - name: 05 - Verify planner and recovery source files
        run: |
          Write-Host "============================================================"
          Write-Host "VERIFY PLANNER / RECOVERY SOURCE FILES"
          Write-Host "============================================================"

          $required = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $required) {

              if (-not (Test-Path $file)) {
                  throw "Required source file missing: $file"
              }

              if ((Get-Item $file).Length -le 0) {
                  throw "Required source file is empty: $file"
              }

              Write-Host "[PASS] $file"
          }


      # ======================================================
      # 06. PYTHON SYNTAX
      # ======================================================

      - name: 06 - Python syntax check for planner and recovery
        run: |
          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX CHECK"
          Write-Host "============================================================"

          py -m py_compile plan_history_gap_retry.py

          if ($LASTEXITCODE -ne 0) {
              throw "Planner Python syntax validation failed."
          }

          py -m py_compile recover_history_gaps_second_pass.py

          if ($LASTEXITCODE -ne 0) {
              throw "Recovery Python syntax validation failed."
          }

          Write-Host "[PASS] Planner/recovery syntax valid."


      # ======================================================
      # 07. LOCAL PRODUCTION INVENTORY + BEFORE SHA256
      # ======================================================

      - name: 07 - Validate local production OHLCV and record SHA256 baseline
        run: |
          Write-Host "============================================================"
          Write-Host "VALIDATE LOCAL PRODUCTION OHLCV"
          Write-Host "AND RECORD BEFORE SHA256"
          Write-Host "============================================================"

          if (-not (Test-Path $env:LOCAL_PRODUCTION_OHLCV)) {
              throw "Local production OHLCV directory missing: $env:LOCAL_PRODUCTION_OHLCV"
          }

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path

          root = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )

          expected_markets = int(
              os.environ["EXPECTED_MARKETS"]
          )

          expected_total = int(
              os.environ["EXPECTED_OHLCV_FILES"]
          )

          timeframes = (
              "h1",
              "h4",
              "d1",
          )

          records = []

          for timeframe in timeframes:

              directory = (
                  root
                  / timeframe
              )

              if not directory.is_dir():

                  raise SystemExit(
                      f"[FAIL] Missing local production directory: {directory}"
                  )

              files = sorted(
                  directory.glob(
                      "*.csv"
                  )
              )

              print(
                  f"{timeframe}: {len(files)} files"
              )

              if (
                  len(files)
                  !=
                  expected_markets
              ):

                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, "
                      f"found {len(files)}"
                  )

              for path in files:

                  digest = hashlib.sha256()

                  with path.open(
                      "rb"
                  ) as handle:

                      for chunk in iter(
                          lambda: handle.read(
                              1024 * 1024
                          ),
                          b"",
                      ):

                          digest.update(
                              chunk
                          )

                  records.append(
                      {
                          "timeframe": timeframe,
                          "file": path.name,
                          "relative_path": str(
                              path.relative_to(
                                  root
                              )
                          ).replace(
                              "\\",
                              "/",
                          ),
                          "size": path.stat().st_size,
                          "sha256": digest.hexdigest(),
                      }
                  )

          if (
              len(records)
              !=
              expected_total
          ):

              raise SystemExit(
                  f"[FAIL] Expected {expected_total} "
                  f"local OHLCV files, "
                  f"found {len(records)}"
              )

          output = Path(
              "_local_production_before_sha256.csv"
          )

          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      "timeframe",
                      "file",
                      "relative_path",
                      "size",
                      "sha256",
                  ],
              )

              writer.writeheader()
              writer.writerows(
                  records
              )

          print()
          print(
              "Total local production OHLCV files:",
              len(records),
          )
          print(
              "SHA256 baseline:",
              output,
          )
          print()
          print(
              "[PASS] Local production inventory = 870."
          )
          print(
              "[PASS] BEFORE SHA256 recorded for all 870 files."
          )

          '@ | Set-Content -Path "_record_local_production_before.py" -Encoding UTF8

          py _record_local_production_before.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_record_local_production_before.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Local production OHLCV validation failed."
          }


      # ======================================================
      # 08. SAFE LOCAL -> WORKSPACE SYNCHRONIZATION
      # ======================================================

      - name: 08 - Safely synchronize local production OHLCV into workspace and verify SHA256
        run: |
          Write-Host "============================================================"
          Write-Host "SAFE LOCAL -> WORKSPACE OHLCV SYNCHRONIZATION"
          Write-Host "============================================================"

          $workspaceOhlcv = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data\ohlcv"

          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "  $env:LOCAL_PRODUCTION_OHLCV"
          Write-Host ""

          Write-Host "DESTINATION:"
          Write-Host "  $workspaceOhlcv"
          Write-Host ""

          if (
              $workspaceOhlcv `
              -eq `
              $env:LOCAL_PRODUCTION_OHLCV
          ) {
              throw "Unsafe configuration: workspace OHLCV equals local production OHLCV."
          }

          if (
              Test-Path `
                  $workspaceOhlcv
          ) {

              Write-Host "[INFO] Removing workspace staging OHLCV only."

              Remove-Item `
                  -Path $workspaceOhlcv `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $workspaceOhlcv `
              | Out-Null

          foreach (
              $timeframe
              in
              @(
                  "h1",
                  "h4",
                  "d1"
              )
          ) {

              $sourceDir = Join-Path `
                  $env:LOCAL_PRODUCTION_OHLCV `
                  $timeframe

              $destDir = Join-Path `
                  $workspaceOhlcv `
                  $timeframe

              if (
                  -not (
                      Test-Path `
                          $sourceDir
                  )
              ) {
                  throw "Local source directory missing: $sourceDir"
              }

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path $destDir `
                  | Out-Null

              Copy-Item `
                  -Path (
                      Join-Path `
                          $sourceDir `
                          "*.csv"
                  ) `
                  -Destination $destDir `
                  -Force

              Write-Host "[PASS] copied: $timeframe"
          }

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path

          source_root = Path(
              os.environ[
                  "LOCAL_PRODUCTION_OHLCV"
              ]
          )

          workspace_root = (
              Path(
                  os.environ[
                      "GITHUB_WORKSPACE"
                  ]
              )
              / "data"
              / "ohlcv"
          )

          baseline_file = Path(
              "_local_production_before_sha256.csv"
          )

          with baseline_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              rows = list(
                  csv.DictReader(
                      handle
                  )
              )

          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] BEFORE baseline expected 870 rows, "
                  f"found {len(rows)}"
              )

          mismatches = []

          missing = []

          for row in rows:

              relative = row[
                  "relative_path"
              ]

              source_path = (
                  source_root
                  / Path(relative)
              )

              workspace_path = (
                  workspace_root
                  / Path(relative)
              )

              if not source_path.is_file():

                  missing.append(
                      f"source:{relative}"
                  )

                  continue

              if not workspace_path.is_file():

                  missing.append(
                      f"workspace:{relative}"
                  )

                  continue

              digest = hashlib.sha256()

              with workspace_path.open(
                  "rb"
              ) as handle:

                  for chunk in iter(
                      lambda: handle.read(
                          1024 * 1024
                      ),
                      b"",
                  ):

                      digest.update(
                          chunk
                      )

              actual = digest.hexdigest()

              expected = row[
                  "sha256"
              ]

              if (
                  actual
                  !=
                  expected
              ):

                  mismatches.append(
                      relative
                  )

              if (
                  workspace_path.stat().st_size
                  !=
                  int(
                      row[
                          "size"
                      ]
                  )
              ):

                  mismatches.append(
                      f"{relative}:size"
                  )

          workspace_files = sorted(
              workspace_root.glob(
                  "*/*.csv"
              )
          )

          if (
              len(workspace_files)
              !=
              870
          ):

              raise SystemExit(
                  f"[FAIL] Workspace OHLCV expected 870 files, "
                  f"found {len(workspace_files)}"
              )

          if missing:

              print(
                  "[FAIL] Missing files:"
              )

              for item in missing[:100]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)

          if mismatches:

              print(
                  "[FAIL] SHA256/size mismatches:"
              )

              for item in mismatches[:100]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)

          print(
              "Workspace files:",
              len(workspace_files),
          )

          print(
              "Compared SHA256:",
              len(rows),
          )

          print(
              "Missing:",
              len(missing),
          )

          print(
              "Mismatch:",
              len(mismatches),
          )

          print()

          print(
              "[PASS] Local -> workspace file count = 870."
          )

          print(
              "[PASS] Local -> workspace size values identical."
          )

          print(
              "[PASS] Local -> workspace SHA256 870/870 identical."
          )

          '@ | Set-Content -Path "_verify_local_workspace_copy.py" -Encoding UTF8

          py _verify_local_workspace_copy.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_verify_local_workspace_copy.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Local production -> workspace SHA256 validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Workspace staging OHLCV is a verified copy of local production."


      # ======================================================
      # 09. VALIDATE PERSISTENT AUDIT INPUTS
      # ======================================================

      - name: 09 - Validate persistent audit inputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VALIDATE PERSISTENT AUDIT INPUTS"
          Write-Host "============================================================"

          $required = @(
              $env:LOCAL_RETRY_CANDIDATE_FILE,
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_summary.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_detail.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_result.json")
          )

          foreach ($path in $required) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required persistent audit input missing: $path"
              }

              $item = Get-Item -LiteralPath $path

              if ($item.Length -le 0) {
                  throw "Required persistent audit input is empty: $path"
              }

              Write-Host "[PASS] $path ($($item.Length) bytes)"
          }

          py -c "import csv,sys; p=sys.argv[1]; f=open(p,encoding='utf-8-sig',newline=''); r=csv.DictReader(f); fields=list(r.fieldnames or []); rows=list(r); f.close(); assert fields, 'retry candidate CSV header is missing'; print('[PASS] retry candidate CSV parsed'); print('[INFO] retry candidate columns:',len(fields)); print('[INFO] retry candidate rows:',len(rows)); print('[INFO] zero retry candidates is a valid audit result' if len(rows)==0 else '[PASS] retry candidates available for second-pass planning')" "$env:LOCAL_RETRY_CANDIDATE_FILE"

          if ($LASTEXITCODE -ne 0) {
              throw "Retry candidate CSV structure validation failed."
          }

          $jsonPath = Join-Path `
              $env:LOCAL_AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_result.json"

          py -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8-sig')); print('[PASS] audit result JSON parsed')" "$jsonPath"

          if ($LASTEXITCODE -ne 0) {
              throw "Audit result JSON validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] All four persistent planner audit inputs are present and readable."


      # ======================================================
      # 10. SYNC PERSISTENT AUDIT INPUTS INTO WORKSPACE
      # Clean V009
      # ======================================================

      - name: 10 - Safely synchronize persistent audit inputs into workspace
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SYNC PERSISTENT AUDIT INPUTS INTO WORKSPACE"
          Write-Host "Clean V009"
          Write-Host "============================================================"

          $workspaceRecovery = Join-Path $env:GITHUB_WORKSPACE "data\recovery"
          $workspaceAudit = Join-Path $env:GITHUB_WORKSPACE "data\reports\history_gap_recovery_audit"

          New-Item -ItemType Directory -Force -Path $workspaceRecovery | Out-Null
          New-Item -ItemType Directory -Force -Path $workspaceAudit | Out-Null

          $pairs = @(
              @{
                  Source = $env:LOCAL_RETRY_CANDIDATE_FILE
                  Destination = Join-Path $workspaceRecovery "history_gap_recovery_retry_candidates.csv"
              },
              @{
                  Source = Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_summary.csv"
                  Destination = Join-Path $workspaceAudit "history_gap_recovery_audit_summary.csv"
              },
              @{
                  Source = Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_detail.csv"
                  Destination = Join-Path $workspaceAudit "history_gap_recovery_audit_detail.csv"
              },
              @{
                  Source = Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_result.json"
                  Destination = Join-Path $workspaceAudit "history_gap_recovery_audit_result.json"
              }
          )

          if ($pairs.Count -ne 4) {
              throw "Expected exactly 4 persistent audit input pairs, found $($pairs.Count)."
          }

          foreach ($pair in $pairs) {
              $src = $pair.Source
              $dst = $pair.Destination

              if ([string]::IsNullOrWhiteSpace($src)) { throw "Audit input source path is empty." }
              if ([string]::IsNullOrWhiteSpace($dst)) { throw "Audit input destination path is empty." }
              if (-not (Test-Path -LiteralPath $src -PathType Leaf)) {
                  throw "Audit input source missing before synchronization: $src"
              }

              $sourceItem = Get-Item -LiteralPath $src
              if ($sourceItem.Length -le 0) {
                  throw "Audit input source is empty before synchronization: $src"
              }

              $destinationDirectory = Split-Path -Parent $dst
              if (-not (Test-Path -LiteralPath $destinationDirectory -PathType Container)) {
                  New-Item -ItemType Directory -Force -Path $destinationDirectory | Out-Null
              }

              Copy-Item -LiteralPath $src -Destination $dst -Force

              if (-not (Test-Path -LiteralPath $dst -PathType Leaf)) {
                  throw "Audit input destination missing after synchronization: $dst"
              }

              $destinationItem = Get-Item -LiteralPath $dst
              if ($destinationItem.Length -ne $sourceItem.Length) {
                  throw "Audit input size mismatch after synchronization: $dst"
              }

              $srcHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $src).Hash
              $dstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dst).Hash
              if ($srcHash -ne $dstHash) {
                  throw "Audit input SHA256 mismatch after synchronization: $dst"
              }

              Write-Host "[PASS] synchronized: $dst"
              Write-Host "[PASS] size identical: $($sourceItem.Length) bytes"
              Write-Host "[PASS] SHA256 identical: $dst"
          }

          $workspaceRetryCandidate = Join-Path $workspaceRecovery "history_gap_recovery_retry_candidates.csv"
          $workspaceAuditSummary = Join-Path $workspaceAudit "history_gap_recovery_audit_summary.csv"
          $workspaceAuditDetail = Join-Path $workspaceAudit "history_gap_recovery_audit_detail.csv"
          $workspaceAuditResult = Join-Path $workspaceAudit "history_gap_recovery_audit_result.json"

          $requiredWorkspaceInputs = @(
              $workspaceRetryCandidate,
              $workspaceAuditSummary,
              $workspaceAuditDetail,
              $workspaceAuditResult
          )

          foreach ($path in $requiredWorkspaceInputs) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required workspace audit input missing after synchronization: $path"
              }
              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Required workspace audit input empty after synchronization: $path"
              }
          }

          py -c "import csv,sys; p=sys.argv[1]; f=open(p,encoding='utf-8-sig',newline=''); r=csv.DictReader(f); fields=list(r.fieldnames or []); rows=list(r); f.close(); assert fields, 'retry candidate CSV header is missing'; print('[PASS] workspace retry candidate CSV parsed'); print('[INFO] retry candidate columns:',len(fields)); print('[INFO] retry candidate rows:',len(rows)); print('[INFO] zero retry candidates is a valid audit result' if len(rows)==0 else '[PASS] retry candidates available')" "$workspaceRetryCandidate"
          if ($LASTEXITCODE -ne 0) { throw "Workspace retry candidate CSV validation failed." }

          py -c "import json,sys; p=sys.argv[1]; data=json.load(open(p,encoding='utf-8-sig')); assert isinstance(data,dict), 'audit result JSON root must be object'; print('[PASS] workspace audit result JSON parsed')" "$workspaceAuditResult"
          if ($LASTEXITCODE -ne 0) { throw "Workspace audit result JSON validation failed." }

          Write-Host ""
          Write-Host "[PASS] 4/4 persistent audit inputs synchronized."
          Write-Host "[PASS] 4/4 source/destination SHA256 values identical."
          Write-Host "[PASS] Retry candidate zero-row result remains valid."
          Write-Host "[PASS] Persistent audit inputs synchronized into current workspace."


      # ======================================================
