      # ======================================================
      # 25. VERIFY 870-FILE SAFETY
      # ======================================================
      - name: 25 - Verify isolated 870-file safety after recovery
        run: |
          Write-Host "============================================================"
          Write-Host "VERIFY 870-FILE SAFETY"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )

          before_file = Path(
              "_isolated_before.csv"
          )

          result_file = Path(
              "_second_pass_recovery_test"
          ) / (
              "data/reports/"
              "history_gap_second_pass_recovery/"
              "history_gap_second_pass_recovery_result.json"
          )

          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          before = {}

          with before_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(
                  handle
              )

              for row in reader:

                  before[
                      row["path"]
                  ] = {
                      "rows":
                          int(
                              row["rows"]
                          ),

                      "sha256":
                          row["sha256"],
                  }

          after = {}

          for path in sorted(
              root.rglob("*.csv")
          ):

              relative = path.relative_to(
                  root
              ).as_posix()

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  rows = max(
                      0,
                      sum(
                          1
                          for _ in handle
                      )
                      - 1
                  )

              after[
                  relative
              ] = {
                  "rows":
                      rows,

                  "sha256":
                      sha256_file(path),
              }

          if len(before) != 870:

              raise SystemExit(
                  "[FAIL] BEFORE inventory is not 870."
              )

          if len(after) != 870:

              raise SystemExit(
                  "[FAIL] AFTER inventory is not 870."
              )

          if set(before) != set(after):

              removed = sorted(
                  set(before)
                  - set(after)
              )

              added = sorted(
                  set(after)
                  - set(before)
              )

              print(
                  "Removed:",
                  removed[:20],
              )

              print(
                  "Added:",
                  added[:20],
              )

              raise SystemExit(
                  "[FAIL] OHLCV file set changed."
              )

          changed = []

          for relative in sorted(
              before
          ):

              before_rows = before[
                  relative
              ]["rows"]

              after_rows = after[
                  relative
              ]["rows"]

              if after_rows < before_rows:

                  raise SystemExit(
                      "[FAIL] OHLCV row count decreased: "
                      f"{relative} "
                      f"{before_rows} -> {after_rows}"
                  )

              if (
                  before[
                      relative
                  ]["sha256"]
                  !=
                  after[
                      relative
                  ]["sha256"]
              ):

                  changed.append(
                      relative
                  )

          with result_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              result = json.load(
                  handle
              )

          authorized = set()

          for item in result.get(
              "changed_files",
              [],
          ):

              timeframe = str(
                  item.get(
                      "timeframe",
                      ""
                  )
              ).strip()

              market = str(
                  item.get(
                      "market",
                      ""
                  )
              ).strip()

              if timeframe and market:

                  authorized.add(
                      f"{timeframe}/{market}.csv"
                  )

          unexpected = (
              set(changed)
              - authorized
          )

          if unexpected:

              print(
                  "[FAIL] Unexpected changed files:"
              )

              for item in sorted(
                  unexpected
              )[:50]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)

          print(
              "OHLCV files          : 870"
          )

          print(
              "Changed files        :",
              len(changed),
          )

          print(
              "Authorized changes   :",
              len(authorized),
          )

          print()

          print(
              "[PASS] No OHLCV file deleted."
          )

          print(
              "[PASS] No OHLCV file count decreased."
          )

          print(
              "[PASS] Only authorized recovery files changed."
          )
