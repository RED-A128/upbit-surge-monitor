          Write-Host "============================================================"


      # ======================================================
      # 29. CLEANUP
      # ======================================================

      - name: 29 - Cleanup isolated test workspace

        if: always()

        run: |

          Write-Host "============================================================"
          Write-Host "CLEANUP ISOLATED TEST WORKSPACE"
          Write-Host "============================================================"

          $testRoot = Join-Path $env:GITHUB_WORKSPACE $env:TEST_ROOT

