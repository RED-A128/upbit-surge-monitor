# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/recover_history_gaps_second_pass_test.yml
#
# Clean V003
# ============================================================
#
# PURPOSE
#
#   Validate:
#
#       recover_history_gaps_second_pass.py
#
#   BEFORE allowing real second-pass OHLCV recovery.
#
#
# TEST SCOPE
#
#   1. Repository / Python environment validation
#   2. Local production OHLCV inventory validation
#   3. Local production 870-file BEFORE SHA256 baseline
#   4. Safe local-production -> workspace synchronization
#   5. Workspace copy 870-file SHA256 verification
#   6. Planner output generation / validation
#   7. Workspace OHLCV inventory validation
#   8. Workspace 870-file SHA256 baseline
#   9. Isolated test workspace creation
#  10. Real Upbit API connectivity test
#  11. Second-pass recovery execution in isolated workspace
#  12. Existing candle immutability validation
#  13. Missing-candle insertion validation
#  14. No OHLCV file deletion validation
#  15. 870-file inventory preservation validation
#  16. Resume / checkpoint second execution
#  17. Resume idempotency validation
#  18. Workspace OHLCV SHA256 final comparison
#  19. Local production OHLCV final SHA256 comparison
#
#
# IMPORTANT
#
#   The real accumulated OHLCV source is:
#
#       C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv
#
#   It is treated as READ-ONLY source data.
#
#   The workflow:
#
#       1. validates the local production OHLCV set
#       2. records SHA256 for all 870 source files
#       3. copies the dataset into GITHUB_WORKSPACE\data\ohlcv
#       4. verifies every copied file against the source SHA256
#       5. runs the planner only after the copy is verified
#       6. creates another isolated recovery workspace
#       7. executes real recovery only inside that isolated copy
#       8. verifies the local production source remained unchanged
#
#
# SAFETY
#
#   Local production OHLCV write : FORBIDDEN
#   Local production OHLCV delete: FORBIDDEN
#
#   Workspace OHLCV staging      : ENABLED
#   Isolated OHLCV write         : ENABLED
#   Real Upbit API               : ENABLED
#   Second-pass gap recovery     : ENABLED IN ISOLATED COPY ONLY
#
#   Feature build                : DISABLED
#   256 detector                 : DISABLED
#   Future labels                : DISABLED
#   Prediction                   : DISABLED
#   Trading                      : DISABLED
#
#   Git reset                    : DISABLED
#   Git clean                    : DISABLED
#   Git commit                   : DISABLED
#   Git push                     : DISABLED
#
# ============================================================


name: recover_history_gaps_second_pass_test.yml


on:

  workflow_dispatch:


permissions:

  contents: read


concurrency:

  group: recover-history-gaps-second-pass-test

  cancel-in-progress: false


jobs:

  recover-history-gaps-second-pass-test:

    name: recover_history_gaps_second_pass_test.yml

    runs-on:

      - self-hosted
      - Windows
      - X64


    timeout-minutes: 180


    defaults:

      run:

        shell: powershell


    env:

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"

      TEST_ROOT: "_second_pass_recovery_test"

      LOCAL_PROJECT_ROOT: "C:\Users\USER\Documents\upbit-surge-monitor"
      LOCAL_OHLCV_ROOT: "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv"

      EXPECTED_MARKETS: "290"
      EXPECTED_TIMEFRAMES: "3"
      EXPECTED_OHLCV_FILES: "870"


    steps:


      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # 02. BASIC INFORMATION
      # ======================================================

      - name: 02 - Show test information

        run: |

          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "SECOND-PASS RECOVERY TEST"
          Write-Host "Clean V003"
          Write-Host "============================================================"

          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""

          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""

          Write-Host "Local production OHLCV:"
          Write-Host "  $env:LOCAL_OHLCV_ROOT"

          Write-Host ""

          Write-Host "Safety mode:"
          Write-Host "  Local production OHLCV write  : FORBIDDEN"
          Write-Host "  Local production OHLCV delete : FORBIDDEN"
          Write-Host "  Workspace staging             : ENABLED"
          Write-Host "  Isolated OHLCV write          : ENABLED"
          Write-Host "  Real Upbit API                : ENABLED"

          Write-Host ""

          Write-Host "Expected:"
          Write-Host "  Markets      : $env:EXPECTED_MARKETS"
          Write-Host "  Timeframes   : $env:EXPECTED_TIMEFRAMES"
          Write-Host "  OHLCV files  : $env:EXPECTED_OHLCV_FILES"

          Write-Host "============================================================"


      # ======================================================
      # 03. PYTHON
      # ======================================================

      - name: 03 - Verify Python

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {

              throw "Python launcher 'py' is unavailable."

          }

          Write-Host ""

          Write-Host "[PASS] Python launcher available."


      # ======================================================
      # 04. DEPENDENCIES
      # ======================================================

      - name: 04 - Install dependencies

        run: |

          Write-Host "============================================================"
          Write-Host "INSTALL / VERIFY DEPENDENCIES"
          Write-Host "============================================================"

          if (Test-Path "requirements.txt") {

              py -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {

                  throw "requirements.txt installation failed."

              }

          }
          else {

              Write-Host "[INFO] requirements.txt not found."
              Write-Host "[INFO] Installing requests directly."

              py -m pip install "requests>=2.32,<3"

              if ($LASTEXITCODE -ne 0) {

                  throw "requests installation failed."

              }

          }

          Write-Host ""

          py -c "import requests; print('requests', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {

              throw "Unable to import requests."

          }

          Write-Host ""

          Write-Host "[PASS] Python dependencies available."


      # ======================================================
      # 05. SOURCE FILES
      # ======================================================

      - name: 05 - Verify planner and recovery source files

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY PLANNER / RECOVERY SOURCE FILES"
          Write-Host "============================================================"

          $required = @(

              "plan_history_gap_retry.py",

              "recover_history_gaps_second_pass.py"

          )

          foreach ($file in $required) {

              if (-not (Test-Path $file)) {

                  throw "Required source file missing: $file"

              }

              if ((Get-Item $file).Length -le 0) {

                  throw "Required source file is empty: $file"

              }

              Write-Host "[PASS] $file"

          }


      # ======================================================
      # 06. PYTHON SYNTAX
      # ======================================================

      - name: 06 - Python syntax check for planner and recovery

        run: |

          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX CHECK"
          Write-Host "============================================================"

          py -m py_compile plan_history_gap_retry.py

          if ($LASTEXITCODE -ne 0) {

              throw "Planner Python syntax validation failed."

          }

          py -m py_compile recover_history_gaps_second_pass.py

          if ($LASTEXITCODE -ne 0) {

              throw "Recovery Python syntax validation failed."

          }

          Write-Host "[PASS] Planner/recovery syntax valid."


      # ======================================================
      # 07. LOCAL PRODUCTION INVENTORY + BEFORE SHA256
      # ======================================================

      - name: 07 - Validate local production OHLCV and record SHA256 baseline

        run: |

          Write-Host "============================================================"
          Write-Host "VALIDATE LOCAL PRODUCTION OHLCV"
          Write-Host "AND RECORD BEFORE SHA256"
          Write-Host "============================================================"

          if (-not (Test-Path $env:LOCAL_OHLCV_ROOT)) {

              throw "Local production OHLCV root missing: $env:LOCAL_OHLCV_ROOT"

          }

          $localRoot = [System.IO.Path]::GetFullPath(
              $env:LOCAL_OHLCV_ROOT
          )

          $workspaceRoot = [System.IO.Path]::GetFullPath(
              $env:GITHUB_WORKSPACE
          )

          if (
              $localRoot.StartsWith(
                  $workspaceRoot,
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {

              throw "Local production OHLCV must not be inside GITHUB_WORKSPACE."

          }

          Write-Host "Local source:"
          Write-Host "  $localRoot"

          Write-Host ""

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(
              os.environ["LOCAL_OHLCV_ROOT"]
          ).resolve()

          output = Path(
              "_local_production_ohlcv_before.csv"
          )

          expected_markets = int(
              os.environ.get(
                  "EXPECTED_MARKETS",
                  "290",
              )
          )

          expected_total = int(
              os.environ.get(
                  "EXPECTED_OHLCV_FILES",
                  "870",
              )
          )

          timeframes = (
              "h1",
              "h4",
              "d1",
          )


          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          if not root.is_dir():
              raise SystemExit(
                  f"[FAIL] Local production root missing: {root}"
              )


          rows = []
          market_sets = {}


          for timeframe in timeframes:
              directory = root / timeframe

              if not directory.is_dir():
                  raise SystemExit(
                      "[FAIL] Missing local production directory: "
                      f"{directory}"
                  )

              files = sorted(
                  directory.glob("*.csv")
              )

              count = len(files)

              print(
                  f"{timeframe.upper()} files : {count}"
              )

              if count != expected_markets:
                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, found {count}"
                  )

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              for path in files:
                  relative = path.relative_to(
                      root
                  ).as_posix()

                  rows.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem.upper(),

                          "relative_path":
                              relative,

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(rows) != expected_total:
              raise SystemExit(
                  f"[FAIL] Expected {expected_total} local OHLCV files, "
                  f"found {len(rows)}"
              )


          reference = market_sets["h1"]

          if len(reference) != expected_markets:
              raise SystemExit(
                  "[FAIL] H1 unique market count mismatch."
              )


          for timeframe in (
              "h4",
              "d1",
          ):
              if market_sets[timeframe] != reference:
                  missing = sorted(
                      reference
                      - market_sets[timeframe]
                  )

                  extra = sorted(
                      market_sets[timeframe]
                      - reference
                  )

                  print(
                      f"[FAIL] Market set mismatch: {timeframe}"
                  )

                  print(
                      "Missing:",
                      missing[:20],
                  )

                  print(
                      "Extra:",
                      extra[:20],
                  )

                  raise SystemExit(1)


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "relative_path",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()
              writer.writerows(rows)


          print()
          print(
              f"Markets       : {len(reference)}"
          )
          print(
              f"OHLCV files   : {len(rows)}"
          )
          print(
              f"SHA256 rows   : {len(rows)}"
          )
          print(
              f"Baseline file : {output}"
          )

          print()

          print(
              "[PASS] Local production OHLCV inventory valid."
          )

          print(
              "[PASS] Local production BEFORE SHA256 recorded for 870 files."
          )
          '@ | Set-Content -Path "_validate_local_production.py" -Encoding UTF8

          py _validate_local_production.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_validate_local_production.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Local production OHLCV validation failed."

          }


      # ======================================================
      # 08. SAFE LOCAL -> WORKSPACE SYNCHRONIZATION
      # ======================================================

      - name: 08 - Safely synchronize local production OHLCV into workspace and verify SHA256

        run: |

          Write-Host "============================================================"
          Write-Host "SAFE LOCAL PRODUCTION -> WORKSPACE SYNCHRONIZATION"
          Write-Host "============================================================"

          $source = [System.IO.Path]::GetFullPath(
              $env:LOCAL_OHLCV_ROOT
          )

          $workspace = [System.IO.Path]::GetFullPath(
              $env:GITHUB_WORKSPACE
          )

          $destination = [System.IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE "data\ohlcv")
          )

          Write-Host "Source:"
          Write-Host "  $source"

          Write-Host ""

          Write-Host "Destination:"
          Write-Host "  $destination"

          Write-Host ""

          if (-not (Test-Path $source)) {

              throw "Local production source missing: $source"

          }

          if (
              -not $destination.StartsWith(
                  $workspace,
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {

              throw "Workspace destination escaped GITHUB_WORKSPACE."

          }

          if (
              $source.StartsWith(
                  $workspace,
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {

              throw "Local production source unexpectedly resides inside GITHUB_WORKSPACE."

          }

          if (
              [string]::Equals(
                  $source.TrimEnd('\'),
                  $destination.TrimEnd('\'),
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {

              throw "Source and destination are identical."

          }

          $dataRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "data"

          if (-not (Test-Path $dataRoot)) {

              New-Item `
                  -ItemType Directory `
                  -Path $dataRoot `
                  -Force | Out-Null

          }

          if (Test-Path $destination) {

              Write-Host "[INFO] Removing workspace staging OHLCV only:"
              Write-Host "       $destination"

              Remove-Item `
                  -Path $destination `
                  -Recurse `
                  -Force

          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force | Out-Null

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $sourceTf = Join-Path `
                  $source `
                  $timeframe

              $destinationTf = Join-Path `
                  $destination `
                  $timeframe

              if (-not (Test-Path $sourceTf)) {

                  throw "Source timeframe directory missing: $sourceTf"

              }

              New-Item `
                  -ItemType Directory `
                  -Path $destinationTf `
                  -Force | Out-Null

              Copy-Item `
                  -Path (Join-Path $sourceTf "*.csv") `
                  -Destination $destinationTf `
                  -Force

              $copied = (
                  Get-ChildItem `
                      -Path $destinationTf `
                      -Filter "*.csv" `
                      -File
              ).Count

              Write-Host "$timeframe copied files : $copied"

              if ($copied -ne [int]$env:EXPECTED_MARKETS) {

                  throw "$timeframe workspace copy expected $env:EXPECTED_MARKETS files, found $copied."

              }

          }

          Write-Host ""

          Write-Host "[INFO] Copy completed."
          Write-Host "[INFO] Verifying all 870 source/destination SHA256 values..."

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          source = Path(
              os.environ["LOCAL_OHLCV_ROOT"]
          ).resolve()

          destination = (
              Path(
                  os.environ["GITHUB_WORKSPACE"]
              ).resolve()
              / "data"
              / "ohlcv"
          )

          baseline_file = Path(
              "_local_production_ohlcv_before.csv"
          )

          expected_total = int(
              os.environ.get(
                  "EXPECTED_OHLCV_FILES",
                  "870",
              )
          )


          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          baseline = {}

          with baseline_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              reader = csv.DictReader(handle)

              for row in reader:
                  relative = str(
                      row.get(
                          "relative_path",
                          ""
                      )
                  ).strip()

                  sha256 = str(
                      row.get(
                          "sha256",
                          ""
                      )
                  ).strip()

                  size_text = str(
                      row.get(
                          "size",
                          ""
                      )
                  ).strip()

                  if not relative:
                      raise SystemExit(
                          "[FAIL] Empty relative_path in local baseline."
                      )

                  if not sha256:
                      raise SystemExit(
                          "[FAIL] Empty SHA256 in local baseline."
                      )

                  baseline[relative] = {
                      "sha256":
                          sha256,

                      "size":
                          int(size_text),
                  }


          if len(baseline) != expected_total:
              raise SystemExit(
                  f"[FAIL] Local baseline expected {expected_total}, "
                  f"found {len(baseline)}"
              )


          workspace_files = {}

          for path in sorted(
              destination.rglob("*.csv")
          ):
              relative = path.relative_to(
                  destination
              ).as_posix()

              workspace_files[relative] = {
                  "sha256":
                      sha256_file(path),

                  "size":
                      path.stat().st_size,
              }


          if len(workspace_files) != expected_total:
              raise SystemExit(
                  f"[FAIL] Workspace expected {expected_total} files, "
                  f"found {len(workspace_files)}"
              )


          if set(baseline) != set(workspace_files):
              missing = sorted(
                  set(baseline)
                  - set(workspace_files)
              )

              extra = sorted(
                  set(workspace_files)
                  - set(baseline)
              )

              print(
                  "[FAIL] Workspace file set differs from local production."
              )

              print(
                  "Missing:",
                  missing[:50],
              )

              print(
                  "Extra:",
                  extra[:50],
              )

              raise SystemExit(1)


          mismatches = []

          for relative in sorted(baseline):
              expected = baseline[
                  relative
              ]

              actual = workspace_files[
                  relative
              ]

              if (
                  expected["size"]
                  != actual["size"]
                  or
                  expected["sha256"]
                  != actual["sha256"]
              ):
                  mismatches.append(
                      {
                          "path":
                              relative,

                          "expected_size":
                              expected["size"],

                          "actual_size":
                              actual["size"],

                          "expected_sha256":
                              expected["sha256"],

                          "actual_sha256":
                              actual["sha256"],
                      }
                  )


          if mismatches:
              print(
                  "[FAIL] Local/workspace SHA256 mismatch:"
              )

              for item in mismatches[:20]:
                  print(
                      item
                  )

              raise SystemExit(1)


          print(
              f"[PASS] Local source files      : {len(baseline)}"
          )

          print(
              f"[PASS] Workspace copied files : {len(workspace_files)}"
          )

          print(
              "[PASS] Local -> workspace file set identical."
          )

          print(
              "[PASS] Local -> workspace size values identical."
          )

          print(
              "[PASS] Local -> workspace SHA256 870/870 identical."
          )
          '@ | Set-Content -Path "_verify_local_workspace_copy.py" -Encoding UTF8

          py _verify_local_workspace_copy.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_verify_local_workspace_copy.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Local production -> workspace SHA256 validation failed."

          }

          Write-Host ""

          Write-Host "[PASS] Workspace staging OHLCV is a verified copy of local production."


      # ======================================================
      # 09. GENERATE PLANNER OUTPUTS
      # ======================================================

      - name: 09 - Generate second-pass planner outputs

        run: |

          Write-Host "============================================================"
          Write-Host "GENERATE SECOND-PASS PLANNER OUTPUTS"
          Write-Host "============================================================"

          Write-Host "[SAFETY] Planner runs against workspace staging data/ohlcv."
          Write-Host "[SAFETY] Local production OHLCV is outside GITHUB_WORKSPACE."
          Write-Host "[SAFETY] Local production OHLCV must remain unchanged."

          $runtimeFiles = @(

              "data/recovery/history_gap_second_pass_targets.csv",

              "data/recovery/history_gap_second_pass_plan.json",

              "data/reports/history_gap_retry_plan/history_gap_retry_plan_summary.csv",

              "data/reports/history_gap_retry_plan/history_gap_retry_plan_detail.csv",

              "data/validation/plan_history_gap_retry_checkpoint.json"

          )

          foreach ($path in $runtimeFiles) {

              if (Test-Path $path) {

                  Remove-Item `
                      -Path $path `
                      -Force

                  Write-Host "[INFO] Removed stale planner runtime file: $path"

              }

          }

          py plan_history_gap_retry.py

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {

              throw "plan_history_gap_retry.py failed with exit code $exitCode."

          }

          $requiredOutputs = @(

              "data/recovery/history_gap_second_pass_targets.csv",

              "data/recovery/history_gap_second_pass_plan.json"

          )

          foreach ($path in $requiredOutputs) {

              if (-not (Test-Path $path)) {

                  throw "Planner output missing after execution: $path"

              }

              if ((Get-Item $path).Length -le 0) {

                  throw "Planner output empty after execution: $path"

              }

              Write-Host "[PASS] Generated: $path"

          }

          Write-Host ""

          Write-Host "[PASS] Planner outputs generated after verified OHLCV staging."


      # ======================================================
      # 10. REQUIRED FILES
      # ======================================================

      - name: 10 - Verify required source files

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED FILES"
          Write-Host "============================================================"

          $required = @(

              "recover_history_gaps_second_pass.py",

              "data/recovery/history_gap_second_pass_targets.csv",

              "data/recovery/history_gap_second_pass_plan.json"

          )

          foreach ($file in $required) {

              if (-not (Test-Path $file)) {

                  throw "Required file missing: $file"

              }

              $item = Get-Item $file

              if ($item.Length -le 0) {

                  throw "Required file is empty: $file"

              }

              Write-Host "[PASS] $file"

          }


      # ======================================================
      # 11. RECOVERY SYNTAX CHECK
      # ======================================================

      - name: 11 - Python syntax check

        run: |

          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX CHECK"
          Write-Host "============================================================"

          py -m py_compile recover_history_gaps_second_pass.py

          if ($LASTEXITCODE -ne 0) {

              throw "Python syntax validation failed."

          }

          Write-Host ""

          Write-Host "[PASS] Python syntax valid."


      # ======================================================
      # 12. WORKSPACE OHLCV INVENTORY
      # ======================================================

      - name: 12 - Validate workspace OHLCV inventory

        run: |

          Write-Host "============================================================"
          Write-Host "VALIDATE WORKSPACE OHLCV INVENTORY"
          Write-Host "============================================================"

          @'
          from pathlib import Path


          root = Path(
              "data/ohlcv"
          )

          expected_markets = 290
          expected_total = 870

          timeframes = (
              "h1",
              "h4",
              "d1",
          )


          total = 0
          market_sets = {}


          for timeframe in timeframes:
              directory = (
                  root
                  / timeframe
              )

              if not directory.is_dir():
                  raise SystemExit(
                      f"[FAIL] Missing directory: {directory}"
                  )

              files = sorted(
                  directory.glob("*.csv")
              )

              count = len(files)

              total += count

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              print(
                  f"{timeframe.upper()} files : {count}"
              )

              if count != expected_markets:
                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, found {count}"
                  )


          if total != expected_total:
              raise SystemExit(
                  f"[FAIL] Expected total {expected_total}, "
                  f"found {total}"
              )


          reference = market_sets[
              "h1"
          ]


          for timeframe in (
              "h4",
              "d1",
          ):
              if (
                  market_sets[timeframe]
                  != reference
              ):
                  raise SystemExit(
                      "[FAIL] Market sets differ between "
                      f"H1 and {timeframe.upper()}."
                  )


          print()

          print(
              f"Markets : {len(reference)}"
          )

          print(
              f"Total   : {total}"
          )

          print()

          print(
              "[PASS] Workspace OHLCV inventory valid."
          )
          '@ | Set-Content -Path "_validate_workspace_inventory.py" -Encoding UTF8

          py _validate_workspace_inventory.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_validate_workspace_inventory.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Workspace OHLCV inventory validation failed."

          }


      # ======================================================
      # 13. TARGET FILE VALIDATION
      # ======================================================

      - name: 13 - Validate second-pass target contract

        run: |

          Write-Host "============================================================"
          Write-Host "VALIDATE SECOND-PASS TARGET CONTRACT"
          Write-Host "============================================================"

          @'
          import csv
          import json
          from pathlib import Path


          target_file = Path(
              "data/recovery/history_gap_second_pass_targets.csv"
          )

          plan_file = Path(
              "data/recovery/history_gap_second_pass_plan.json"
          )


          with target_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(
                  handle
              )

              fieldnames = list(
                  reader.fieldnames
                  or []
              )

              rows = list(
                  reader
              )


          print(
              f"Target rows : {len(rows)}"
          )

          print(
              f"Columns     : {len(fieldnames)}"
          )


          normalized = {
              str(name).strip().lower():
              name
              for name in fieldnames
          }


          if "classification" not in normalized:

              raise SystemExit(
                  "[FAIL] classification column missing."
              )


          classification_column = normalized[
              "classification"
          ]


          invalid = []


          for index, row in enumerate(
              rows,
              start=2,
          ):

              value = str(
                  row.get(
                      classification_column,
                      ""
                  )
              ).strip()

              if value != "READY_SECOND_PASS":

                  invalid.append(
                      (
                          index,
                          value,
                      )
                  )


          if invalid:

              print(
                  "[FAIL] Unauthorized target classifications:"
              )

              for item in invalid[:20]:

                  print(
                      item
                  )

              raise SystemExit(1)


          with plan_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              plan = json.load(
                  handle
              )


          if not isinstance(
              plan,
              dict,
          ):

              raise SystemExit(
                  "[FAIL] Plan JSON root is not object."
              )


          if (
              str(
                  plan.get(
                      "program",
                      ""
                  )
              ).strip()
              !=
              "plan_history_gap_retry.py"
          ):

              raise SystemExit(
                  "[FAIL] Unexpected planner program."
              )


          if (
              str(
                  plan.get(
                      "version",
                      ""
                  )
              ).strip()
              !=
              "Clean V001"
          ):

              raise SystemExit(
                  "[FAIL] Unexpected planner version."
              )


          print()

          print(
              "[PASS] Target contract valid."
          )

          print(
              "[PASS] Every target is READY_SECOND_PASS."
          )

          print(
              "[PASS] Planner program/version valid."
          )
          '@ | Set-Content -Path "_validate_second_pass_targets.py" -Encoding UTF8

          py _validate_second_pass_targets.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_validate_second_pass_targets.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Second-pass target validation failed."

          }


      # ======================================================
      # 14. WORKSPACE SHA256 BASELINE
      # ======================================================

      - name: 14 - Record workspace 870-file SHA256 baseline

        run: |

          Write-Host "============================================================"
          Write-Host "WORKSPACE OHLCV SHA256 BASELINE"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          from pathlib import Path


          root = Path(
              "data/ohlcv"
          )

          output = Path(
              "_workspace_ohlcv_before.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()


          rows = []


          for timeframe in (
              "h1",
              "h4",
              "d1",
          ):

              directory = (
                  root
                  / timeframe
              )

              for path in sorted(
                  directory.glob("*.csv")
              ):

                  rows.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem.upper(),

                          "path":
                              path.as_posix(),

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] Expected 870 files, "
                  f"found {len(rows)}"
              )


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "path",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(
                  rows
              )


          print(
              f"[PASS] SHA256 baseline files : {len(rows)}"
          )

          print(
              f"[PASS] Saved : {output}"
          )
          '@ | Set-Content -Path "_record_workspace_hash.py" -Encoding UTF8

          py _record_workspace_hash.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_record_workspace_hash.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Workspace SHA256 baseline failed."

          }


      # ======================================================
      # 15. PREPARE ISOLATED TEST DIRECTORY
      # ======================================================

      - name: 15 - Prepare isolated test workspace

        run: |

          Write-Host "============================================================"
          Write-Host "PREPARE ISOLATED TEST WORKSPACE"
          Write-Host "============================================================"

          $testRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:TEST_ROOT

          if (Test-Path $testRoot) {

              Write-Host "[INFO] Removing previous isolated test directory."

              Remove-Item `
                  -Path $testRoot `
                  -Recurse `
                  -Force

          }

          New-Item `
              -ItemType Directory `
              -Path $testRoot `
              -Force | Out-Null

          New-Item `
              -ItemType Directory `
              -Path (Join-Path $testRoot "data") `
              -Force | Out-Null

          Write-Host ""

          Write-Host "[PASS] Isolated root:"
          Write-Host "       $testRoot"


      # ======================================================
      # 16. COPY RECOVERY PROGRAM
      # ======================================================

      - name: 16 - Copy recovery program into isolated root

        run: |

          Write-Host "============================================================"
          Write-Host "COPY RECOVERY PROGRAM"
          Write-Host "============================================================"

          $testRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:TEST_ROOT

          Copy-Item `
