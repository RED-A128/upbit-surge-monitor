          Write-Host "[PASS] Only authorized target files changed"
          Write-Host "[PASS] Resume / checkpoint execution"
          Write-Host "[PASS] Resume idempotency"
          Write-Host "[PASS] No duplicate timestamps"
          Write-Host "[PASS] Production OHLCV changed files = 0"
          Write-Host "[PASS] Production 870 SHA256 preserved"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host ""
          Write-Host "  Production OHLCV write  : FORBIDDEN"
          Write-Host "  Production OHLCV delete : FORBIDDEN"
          Write-Host "  Test-copy OHLCV write   : ENABLED"
          Write-Host "  Real Upbit API          : ENABLED"
          Write-Host "  Feature build           : DISABLED"
          Write-Host "  256 Detector            : DISABLED"
