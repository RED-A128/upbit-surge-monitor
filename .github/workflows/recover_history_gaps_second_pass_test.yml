      # 20. RECORD ISOLATED BEFORE SNAPSHOT
      # ======================================================

      - name: 20 - Record isolated OHLCV before snapshot

        run: |

          Write-Host "============================================================"
          Write-Host "RECORD ISOLATED BEFORE SNAPSHOT"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          from pathlib import Path


          root = Path(
              "_second_pass_recovery_test/data/ohlcv"
          )

          output = Path(
              "_isolated_before.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()


          rows = []


          for path in sorted(
              root.rglob("*.csv")
          ):

              relative = path.relative_to(
                  root
              ).as_posix()

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  row_count = max(
                      0,
                      sum(
                          1
                          for _ in handle
                      )
                      - 1
                  )


              rows.append(
                  {
