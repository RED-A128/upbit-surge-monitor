        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV REMAINED UNCHANGED"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          from pathlib import Path


          root = Path(
              "data/ohlcv"
          )

          baseline_file = Path(
              "_production_ohlcv_before.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(chunk)

              return digest.hexdigest()


          before = {}


          with baseline_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(handle)

              for row in reader:

                  before[
                      row["path"]
                  ] = row[
                      "sha256"
                  ]


          after = {}


          for path in sorted(
              root.rglob("*.csv")
          ):

              after[
                  path.as_posix()
              ] = sha256_file(
                  path
              )


          if len(before) != 870:

              raise SystemExit(
                  "[FAIL] Production BEFORE count is not 870."
              )


          if len(after) != 870:

              raise SystemExit(
                  "[FAIL] Production AFTER count is not 870."
              )


          if set(before) != set(after):

              raise SystemExit(
                  "[FAIL] Production OHLCV file set changed."
              )


          changed = []


          for path in sorted(
              before
          ):

              if (
                  before[path]
                  !=
                  after[path]
              ):

                  changed.append(
                      path
                  )


          if changed:

              print(
                  "[FAIL] PRODUCTION OHLCV WAS MODIFIED:"
              )

              for item in changed[:100]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)


          print(
              "[PASS] Production OHLCV files : 870"
          )

          print(
              "[PASS] Production changed files : 0"
          )

          print(
              "[PASS] Every production SHA256 is unchanged."
          )
          '@ | Set-Content -Path "_verify_production_final.py" -Encoding UTF8

          py _verify_production_final.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_verify_production_final.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "CRITICAL: Production OHLCV integrity validation failed."

          }


      # ======================================================
      # 27. FINAL CHECKPOINT VALIDATION
      # ======================================================

      - name: 27 - Validate recovery checkpoint

        run: |

          Write-Host "============================================================"
          Write-Host "VALIDATE RECOVERY CHECKPOINT"
          Write-Host "============================================================"

          @'
          import json
          from pathlib import Path


          checkpoint_file = Path(
              "_second_pass_recovery_test"
          ) / (
              "data/validation/"
              "recover_history_gaps_second_pass_checkpoint.json"
          )


          with checkpoint_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              checkpoint = json.load(handle)


          if (
              checkpoint.get(
                  "program"
              )
              !=
              "recover_history_gaps_second_pass.py"
          ):

              raise SystemExit(
                  "[FAIL] Checkpoint program mismatch."
              )


          if (
              checkpoint.get(
                  "version"
              )
              !=
              "Clean V001"
          ):

              raise SystemExit(
                  "[FAIL] Checkpoint version mismatch."
              )


          if (
              checkpoint.get(
                  "status"
              )
              !=
              "COMPLETED"
          ):

              raise SystemExit(
                  "[FAIL] Checkpoint status is not COMPLETED."
              )


          if (
              checkpoint.get(
                  "completed"
              )
              is not True
          ):

              raise SystemExit(
                  "[FAIL] Checkpoint completed flag is not true."
              )


          summary = checkpoint.get(
              "summary",
              {},
          )


          failed = int(
              summary.get(
                  "failed",
                  0,
              )
              or 0
          )


          if failed > 0:

              raise SystemExit(
                  f"[FAIL] Checkpoint contains failed={failed}"
              )


          print(
              "Checkpoint status :",
              checkpoint.get(
                  "status"
              ),
          )

          print(
              "Target total      :",
              checkpoint.get(
                  "target_total"
              ),
          )

          print(
              "Failed            :",
              failed,
          )

          print()

          print(
              "[PASS] Recovery checkpoint valid."
          )
          '@ | Set-Content -Path "_validate_checkpoint.py" -Encoding UTF8

          py _validate_checkpoint.py

          $exitCode = $LASTEXITCODE

          Remove-Item "_validate_checkpoint.py" -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Checkpoint validation failed."

          }


      # ======================================================
      # 28. FINAL TEST RESULT
      # ======================================================

      - name: 28 - Final test result

        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SECOND-PASS RECOVERY TEST RESULT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "[PASS] recover_history_gaps_second_pass.py syntax"
          Write-Host "[PASS] Planner target contract"
          Write-Host "[PASS] Production OHLCV inventory = 870"
          Write-Host "[PASS] Full isolated OHLCV copy = 870"
          Write-Host "[PASS] Initial production/copy SHA256 match"
          Write-Host "[PASS] Real Upbit API connectivity"
          Write-Host "[PASS] Recovery executed only in isolated workspace"
          Write-Host "[PASS] Existing candle immutability"
          Write-Host "[PASS] No OHLCV file deletion"
