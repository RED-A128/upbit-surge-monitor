                  -Recurse
          ).Count

          Write-Host ""
          Write-Host "Total local production OHLCV files: $total"

          if ($total -ne 870) {

              throw "Expected 870 local production OHLCV files, found $total."

          }

          Write-Host ""
          Write-Host "[PASS] Local production OHLCV inventory remains 870."


      # ======================================================
      # 34. RECORD LOCAL PRODUCTION AFTER SHA256
      # ======================================================

      - name: 34 - Record local production AFTER SHA256

        run: |

          Write-Host "============================================================"
          Write-Host "RECORD LOCAL PRODUCTION AFTER SHA256"
          Write-Host "============================================================"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(
              os.environ[
                  "LOCAL_PRODUCTION_OHLCV"
              ]
          )

          output = Path(
              "_local_production_after_sha256.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open(
                  "rb"
              ) as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:

                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()


          rows = []


          for timeframe in (
              "h1",
              "h4",
              "d1",
          ):

              directory = (
                  root
                  / timeframe
              )


              if not directory.is_dir():

                  raise SystemExit(
                      "[FAIL] Missing local production directory: "
                      f"{directory}"
                  )


              files = sorted(
                  directory.glob(
                      "*.csv"
                  )
              )


              if len(files) != 290:

                  raise SystemExit(
                      "[FAIL] Expected 290 files in "
                      f"{directory}, found {len(files)}"
                  )


              for path in files:

                  rows.append(
                      {
                          "path":
                              path.relative_to(
                                  root
                              ).as_posix(),

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(
                                  path
                              ),
                      }
                  )


          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] Expected 870 local production files, "
                  f"found {len(rows)}"
              )


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "path",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(
                  rows
              )


          print(
              "Recorded files :",
              len(rows),
          )

          print()

          print(
              "[PASS] Local production AFTER SHA256 recorded."
          )
          '@ | Set-Content -Path "_record_local_after_sha256.py" -Encoding UTF8

          py _record_local_after_sha256.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_record_local_after_sha256.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Local production AFTER SHA256 recording failed."

          }


      # ======================================================
      # 35. VERIFY LOCAL PRODUCTION BEFORE / AFTER SHA256
      # ======================================================

      - name: 35 - Verify all 870 local production files remained unchanged

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY LOCAL PRODUCTION BEFORE / AFTER SHA256"
          Write-Host "============================================================"

          @'
          import csv
          from pathlib import Path


          before_file = Path(
              "_local_production_before_sha256.csv"
          )

          after_file = Path(
              "_local_production_after_sha256.csv"
          )


          if not before_file.is_file():

              raise SystemExit(
                  "[FAIL] Local production BEFORE SHA256 file missing."
              )


          if not after_file.is_file():

              raise SystemExit(
                  "[FAIL] Local production AFTER SHA256 file missing."
              )


          def load(path):

              result = {}


              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  reader = csv.DictReader(
                      handle
                  )


                  for row in reader:

                      relative = row[
                          "path"
                      ]


                      if relative in result:

                          raise SystemExit(
                              "[FAIL] Duplicate SHA256 record: "
                              f"{relative}"
                          )


                      result[
                          relative
                      ] = {
                          "size":
                              int(
                                  row[
                                      "size"
                                  ]
                              ),

                          "sha256":
                              row[
                                  "sha256"
                              ],
                      }


              return result


          before = load(
              before_file
          )

          after = load(
              after_file
          )


          if len(before) != 870:

              raise SystemExit(
                  f"[FAIL] BEFORE expected 870 records, "
                  f"found {len(before)}"
              )


          if len(after) != 870:

              raise SystemExit(
                  f"[FAIL] AFTER expected 870 records, "
                  f"found {len(after)}"
              )


          before_set = set(
              before
          )

          after_set = set(
              after
          )


          if before_set != after_set:

              removed = sorted(
                  before_set
                  - after_set
              )

              added = sorted(
                  after_set
                  - before_set
              )

              print(
                  "Removed files:"
              )

              for item in removed[:50]:

                  print(
                      "  ",
                      item,
                  )


              print(
                  "Added files:"
              )

              for item in added[:50]:

                  print(
                      "  ",
                      item,
                  )


              raise SystemExit(
                  "[FAIL] Local production file set changed."
              )


          changed = []


          for relative in sorted(
              before
          ):

              before_item = before[
                  relative
              ]

              after_item = after[
                  relative
              ]


              if (
                  before_item[
                      "size"
                  ]
                  !=
                  after_item[
                      "size"
                  ]
                  or
                  before_item[
                      "sha256"
                  ]
                  !=
                  after_item[
                      "sha256"
                  ]
              ):

                  changed.append(
                      relative
                  )


          if changed:

              print(
                  "[FAIL] Local production files changed:"
              )

              for item in changed[:100]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)


          print(
              "BEFORE records :",
              len(before),
          )

          print(
              "AFTER records  :",
              len(after),
          )

          print(
              "Changed files  :",
              len(changed),
          )

          print()

          print(
              "[PASS] All 870 local production OHLCV files are byte-identical."
          )

          print(
              "[PASS] Test workflow did not modify local production OHLCV."
          )
          '@ | Set-Content -Path "_verify_local_production_sha256.py" -Encoding UTF8

          py _verify_local_production_sha256.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_verify_local_production_sha256.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Local production BEFORE/AFTER SHA256 validation failed."

          }


      # ======================================================
      # 36. VERIFY WORKSPACE SYNC BASELINE AGAINST LOCAL
      # ======================================================

      - name: 36 - Verify synchronized workspace baseline matches local production baseline

        run: |

          Write-Host "============================================================"
          Write-Host "VERIFY WORKSPACE SYNC BASELINE"
          Write-Host "============================================================"

          @'
          import csv
          from pathlib import Path


          local_file = Path(
              "_local_production_before_sha256.csv"
          )

          workspace_file = Path(
              "_workspace_production_before_sha256.csv"
          )


          def load_sha(path):

              result = {}


              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  reader = csv.DictReader(
                      handle
                  )


                  for row in reader:

                      result[
                          row["path"]
                      ] = row[
                          "sha256"
                      ]


              return result


          local = load_sha(
              local_file
          )

          workspace = load_sha(
              workspace_file
          )


          if len(local) != 870:

              raise SystemExit(
                  f"[FAIL] Local baseline expected 870, "
                  f"found {len(local)}"
              )


          if len(workspace) != 870:

              raise SystemExit(
                  f"[FAIL] Workspace baseline expected 870, "
                  f"found {len(workspace)}"
              )


          if set(local) != set(workspace):

              raise SystemExit(
                  "[FAIL] Local/workspace synchronized file sets differ."
              )


          mismatch = []


          for relative in sorted(
              local
          ):

              if (
                  local[relative]
                  !=
                  workspace[relative]
              ):

                  mismatch.append(
                      relative
                  )


          if mismatch:

              print(
                  "[FAIL] Local/workspace SHA256 mismatch:"
              )

              for item in mismatch[:100]:

                  print(
                      "  ",
                      item,
                  )

              raise SystemExit(1)


          print(
              "Compared files :",
              len(local),
          )

          print(
              "SHA256 mismatch:",
              len(mismatch),
          )

          print()

          print(
              "[PASS] Workspace synchronization was byte-identical for all 870 files."
          )
          '@ | Set-Content -Path "_verify_workspace_sync_baseline.py" -Encoding UTF8

          py _verify_workspace_sync_baseline.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              "_verify_workspace_sync_baseline.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Workspace synchronization baseline validation failed."

          }


      # ======================================================
