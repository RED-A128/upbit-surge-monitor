name: validate_pattern_research_input_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_pattern_research_input_test:
    name: validate_pattern_research_input_test.yml
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ================================================================
      # 01. CHECKOUT
      # ================================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      # ================================================================
      # 02. SHOW ENVIRONMENT
      # ================================================================

      - name: 02 - Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SHOW ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "OS:"
          Write-Host "  $env:RUNNER_OS"

          Write-Host ""
          Write-Host "Python:"
          py --version

          Write-Host ""
          Write-Host "[PASS] Environment displayed."


      # ================================================================
      # 03. RESOLVE PRODUCTION PROJECT ROOT
      # ================================================================

      - name: 03 - Resolve production project root
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RESOLVE PRODUCTION PROJECT ROOT"
          Write-Host "============================================================"
          Write-Host ""

          $productionRoot = Join-Path `
              $env:USERPROFILE `
              "Documents\upbit-surge-monitor"

          if (-not (Test-Path -LiteralPath $productionRoot -PathType Container)) {
              throw "Production project root missing: $productionRoot"
          }

          $ohlcvRoot = Join-Path `
              $productionRoot `
              "data\ohlcv"

          if (-not (Test-Path -LiteralPath $ohlcvRoot -PathType Container)) {
              throw "Production OHLCV root missing: $ohlcvRoot"
          }

          "UPBIT_SURGE_PROJECT_ROOT=$productionRoot" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "PRODUCTION_OHLCV_ROOT=$ohlcvRoot" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PATH] Production project root:"
          Write-Host "  $productionRoot"

          Write-Host ""
          Write-Host "[PATH] Production OHLCV root:"
          Write-Host "  $ohlcvRoot"

          Write-Host ""
          Write-Host "[PASS] Production project root resolved."


      # ================================================================
      # 04. VERIFY VALIDATOR PROGRAM
      # ================================================================

      - name: 04 - Verify validator program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATOR PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $validator = Join-Path `
              $env:GITHUB_WORKSPACE `
              "validate_pattern_research_input.py"

          if (-not (Test-Path -LiteralPath $validator -PathType Leaf)) {
              throw "Validator program missing: $validator"
          }

          Write-Host "[PASS] Validator exists:"
          Write-Host "  $validator"

          $content = Get-Content `
              -LiteralPath $validator `
              -Raw

          if ($content -notmatch "Clean V001") {
              throw "Validator does not contain expected version: Clean V001"
          }

          Write-Host ""
          Write-Host "[PASS] Clean V001 marker found."


      # ================================================================
      # 05. VERIFY REQUIRED PRODUCTION DIRECTORIES
      # ================================================================

      - name: 05 - Verify required production directories
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED PRODUCTION DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $required = @(
              "h1",
              "h4",
              "d1"
          )

          foreach ($timeframe in $required) {

              $directory = Join-Path `
                  $env:PRODUCTION_OHLCV_ROOT `
                  $timeframe

              if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
                  throw "Required timeframe directory missing: $directory"
              }

              Write-Host "[PASS] $directory"
          }


      # ================================================================
      # 06. DISCOVER PRODUCTION OHLCV INVENTORY
      # ================================================================

      - name: 06 - Discover production OHLCV inventory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DISCOVER PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"
          Write-Host ""

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $grandTotal = 0

          foreach ($timeframe in $timeframes) {

              $directory = Join-Path `
                  $env:PRODUCTION_OHLCV_ROOT `
                  $timeframe

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Recurse `
                      -Filter "*.csv"
              )

              $count = $files.Count
              $grandTotal += $count

              Write-Host "$($timeframe.ToUpper()) : $count CSV file(s)"

              if ($count -eq 0) {
                  throw "No production CSV files found: $directory"
              }
          }

          Write-Host ""
          Write-Host "TOTAL : $grandTotal CSV file(s)"

          if ($grandTotal -eq 0) {
              throw "Production OHLCV inventory is empty."
          }

          Write-Host ""
          Write-Host "[PASS] Production OHLCV inventory discovered."


      # ================================================================
      # 07. CREATE TEST EVIDENCE DIRECTORY
      # ================================================================

      - name: 07 - Create test evidence directory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CREATE TEST EVIDENCE DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          $evidenceRoot = Join-Path `
              $env:RUNNER_TEMP `
              "validate_pattern_research_input_test"

          if (Test-Path -LiteralPath $evidenceRoot) {
              Remove-Item `
                  -LiteralPath $evidenceRoot `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $evidenceRoot `
              -Force |
              Out-Null

          "PATTERN_TEST_EVIDENCE=$evidenceRoot" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PATH] Evidence directory:"
          Write-Host "  $evidenceRoot"

          Write-Host ""
          Write-Host "[PASS] Evidence directory ready."


      # ================================================================
      # 08. RECORD OHLCV FILE SET BEFORE VALIDATION
      # ================================================================

      - name: 08 - Record OHLCV file set before validation
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV FILE SET BEFORE VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $output = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_files_before.txt"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:PRODUCTION_OHLCV_ROOT `
                  -File `
                  -Recurse `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $relativePaths = foreach ($file in $files) {

              $file.FullName.Substring(
                  $env:PRODUCTION_OHLCV_ROOT.Length
              ).TrimStart('\')
          }

          $relativePaths |
              Set-Content `
                  -LiteralPath $output `
                  -Encoding utf8

          Write-Host "Recorded files: $($files.Count)"
          Write-Host "[PASS] BEFORE file set recorded."


      # ================================================================
      # 09. RECORD OHLCV SHA256 BEFORE VALIDATION
      # ================================================================

      - name: 09 - Record OHLCV SHA256 before validation
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $output = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_sha256_before.csv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:PRODUCTION_OHLCV_ROOT `
                  -File `
                  -Recurse `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $records = foreach ($file in $files) {

              $relativePath = $file.FullName.Substring(
                  $env:PRODUCTION_OHLCV_ROOT.Length
              ).TrimStart('\')

              $hash = Get-FileHash `
                  -LiteralPath $file.FullName `
                  -Algorithm SHA256

              [PSCustomObject]@{
                  path   = $relativePath
                  sha256 = $hash.Hash.ToLower()
                  size   = $file.Length
              }
          }

          $records |
              Export-Csv `
                  -LiteralPath $output `
                  -NoTypeInformation `
                  -Encoding utf8

          Write-Host "Hashed files: $($records.Count)"
          Write-Host "[PASS] BEFORE SHA256 inventory recorded."


      # ================================================================
      # 10. RUN PATTERN RESEARCH INPUT VALIDATOR
      # ================================================================

      - name: 10 - Run pattern research input validator
        id: run_validator
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN PATTERN RESEARCH INPUT VALIDATOR"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "[SAFETY] READ-ONLY VALIDATION"
          Write-Host "[SAFETY] OHLCV modification : FORBIDDEN"
          Write-Host "[SAFETY] Recovery execution : DISABLED"
          Write-Host "[SAFETY] Pattern detection : DISABLED"
          Write-Host ""

          $validator = Join-Path `
              $env:GITHUB_WORKSPACE `
              "validate_pattern_research_input.py"

          & py -X utf8 $validator

          $validatorExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code:"
          Write-Host "  $validatorExitCode"

          $exitCodeFile = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "validator_exit_code.txt"

          "$validatorExitCode" |
              Set-Content `
                  -LiteralPath $exitCodeFile `
                  -Encoding ascii

          if ($validatorExitCode -ne 0) {

              Write-Host ""
              Write-Host "[INFO] Validator returned exit code $validatorExitCode"
              Write-Host "[INFO] OHLCV safety checks will still run."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Validator returned exit code 0."


      # ================================================================
      # 11. RECORD OHLCV FILE SET AFTER VALIDATION
      # ================================================================

      - name: 11 - Record OHLCV file set after validation
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV FILE SET AFTER VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $output = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_files_after.txt"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:PRODUCTION_OHLCV_ROOT `
                  -File `
                  -Recurse `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $relativePaths = foreach ($file in $files) {

              $file.FullName.Substring(
                  $env:PRODUCTION_OHLCV_ROOT.Length
              ).TrimStart('\')
          }

          $relativePaths |
              Set-Content `
                  -LiteralPath $output `
                  -Encoding utf8

          Write-Host "Recorded files: $($files.Count)"
          Write-Host "[PASS] AFTER file set recorded."


      # ================================================================
      # 12. VERIFY OHLCV FILE SET UNCHANGED
      # ================================================================

      - name: 12 - Verify OHLCV file set unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV FILE SET UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $before = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_files_before.txt"

          $after = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_files_after.txt"

          if (-not (Test-Path -LiteralPath $before -PathType Leaf)) {
              throw "BEFORE file inventory missing."
          }

          if (-not (Test-Path -LiteralPath $after -PathType Leaf)) {
              throw "AFTER file inventory missing."
          }

          $beforeHash = (
              Get-FileHash `
                  -LiteralPath $before `
                  -Algorithm SHA256
          ).Hash

          $afterHash = (
              Get-FileHash `
                  -LiteralPath $after `
                  -Algorithm SHA256
          ).Hash

          Write-Host "BEFORE:"
          Write-Host "  $beforeHash"

          Write-Host ""
          Write-Host "AFTER:"
          Write-Host "  $afterHash"

          if ($beforeHash -ne $afterHash) {

              Write-Host ""
              Write-Host "OHLCV file set changed."

              $beforeContent = @(
                  Get-Content -LiteralPath $before
              )

              $afterContent = @(
                  Get-Content -LiteralPath $after
              )

              Compare-Object `
                  -ReferenceObject $beforeContent `
                  -DifferenceObject $afterContent |
                  Format-Table |
                  Out-String |
                  Write-Host

              throw "Production OHLCV file set changed during validation."
          }

          Write-Host ""
          Write-Host "[PASS] Production OHLCV file set unchanged."


      # ================================================================
      # 13. RECORD OHLCV SHA256 AFTER VALIDATION
      # ================================================================

      - name: 13 - Record OHLCV SHA256 after validation
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 AFTER VALIDATION"
          Write-Host "============================================================"
          Write-Host ""

          $output = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_sha256_after.csv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:PRODUCTION_OHLCV_ROOT `
                  -File `
                  -Recurse `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $records = foreach ($file in $files) {

              $relativePath = $file.FullName.Substring(
                  $env:PRODUCTION_OHLCV_ROOT.Length
              ).TrimStart('\')

              $hash = Get-FileHash `
                  -LiteralPath $file.FullName `
                  -Algorithm SHA256

              [PSCustomObject]@{
                  path   = $relativePath
                  sha256 = $hash.Hash.ToLower()
                  size   = $file.Length
              }
          }

          $records |
              Export-Csv `
                  -LiteralPath $output `
                  -NoTypeInformation `
                  -Encoding utf8

          Write-Host "Hashed files: $($records.Count)"
          Write-Host "[PASS] AFTER SHA256 inventory recorded."


      # ================================================================
      # 14. VERIFY OHLCV SHA256 UNCHANGED
      # ================================================================

      - name: 14 - Verify OHLCV SHA256 unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforePath = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_sha256_before.csv"

          $afterPath = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "ohlcv_sha256_after.csv"

          if (-not (Test-Path -LiteralPath $beforePath -PathType Leaf)) {
              throw "BEFORE SHA256 inventory missing."
          }

          if (-not (Test-Path -LiteralPath $afterPath -PathType Leaf)) {
              throw "AFTER SHA256 inventory missing."
          }

          $before = @(
              Import-Csv -LiteralPath $beforePath
          )

          $after = @(
              Import-Csv -LiteralPath $afterPath
          )

          if ($before.Count -ne $after.Count) {
              throw "OHLCV file count changed during validation."
          }

          $beforeMap = @{}

          foreach ($item in $before) {

              $beforeMap[$item.path] = @{
                  sha256 = $item.sha256
                  size   = $item.size
              }
          }

          $changed = @()

          foreach ($item in $after) {

              if (-not $beforeMap.ContainsKey($item.path)) {

                  $changed += [PSCustomObject]@{
                      path   = $item.path
                      reason = "NEW_FILE"
                  }

                  continue
              }

              $old = $beforeMap[$item.path]

              if ($old.sha256 -ne $item.sha256) {

                  $changed += [PSCustomObject]@{
                      path   = $item.path
                      reason = "SHA256_CHANGED"
                  }

                  continue
              }

              if ([string]$old.size -ne [string]$item.size) {

                  $changed += [PSCustomObject]@{
                      path   = $item.path
                      reason = "SIZE_CHANGED"
                  }
              }
          }

          if ($changed.Count -gt 0) {

              Write-Host ""
              Write-Host "Modified OHLCV files:"
              Write-Host ""

              $changed |
                  Format-Table -AutoSize |
                  Out-String |
                  Write-Host

              throw "Production OHLCV content changed during validation."
          }

          Write-Host "[PASS] All production OHLCV SHA256 hashes unchanged."


      # ================================================================
      # 15. VERIFY VALIDATOR EXIT CODE
      # ================================================================

      - name: 15 - Verify validator process exit code
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATOR PROCESS EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          $exitCodeFile = Join-Path `
              $env:PATTERN_TEST_EVIDENCE `
              "validator_exit_code.txt"

          if (-not (Test-Path -LiteralPath $exitCodeFile -PathType Leaf)) {
              throw "Validator exit-code evidence missing."
          }

          $validatorExitCode = (
              Get-Content `
                  -LiteralPath $exitCodeFile `
                  -Raw
          ).Trim()

          Write-Host "Validator exit code:"
          Write-Host "  $validatorExitCode"

          if ($validatorExitCode -ne "0") {
              throw "validate_pattern_research_input.py returned exit code $validatorExitCode"
          }

          Write-Host ""
          Write-Host "[PASS] Validator exit code is 0."


      # ================================================================
      # 16. VERIFY VALIDATION OUTPUT DIRECTORY
      # ================================================================

      - name: 16 - Verify validation output directory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY VALIDATION OUTPUT DIRECTORY"
          Write-Host "============================================================"
          Write-Host ""

          $reportDirectory = Join-Path `
              $env:UPBIT_SURGE_PROJECT_ROOT `
              "data\reports\pattern_research_input_validation"

          if (-not (Test-Path -LiteralPath $reportDirectory -PathType Container)) {
              throw "Validation report directory missing: $reportDirectory"
          }

          "PATTERN_VALIDATION_REPORT_DIR=$reportDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          $files = @(
              Get-ChildItem `
                  -LiteralPath $reportDirectory `
                  -File
          )

          if ($files.Count -eq 0) {
              throw "Validation report directory contains no files."
          }

          Write-Host "Report directory:"
          Write-Host "  $reportDirectory"

          Write-Host ""
          Write-Host "Files:"

          foreach ($file in $files) {
              Write-Host "  $($file.Name)"
          }

          Write-Host ""
          Write-Host "[PASS] Validation output directory verified."


      # ================================================================
      # 17. VERIFY EXPECTED VALIDATION OUTPUTS
      # ================================================================

      - name: 17 - Verify expected validation outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY EXPECTED VALIDATION OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $requiredFiles = @(
              "pattern_research_input_validation.json",
              "pattern_research_input_validation_detail.csv",
              "pattern_research_input_validation_issues.csv",
              "pattern_research_input_validation_checkpoint.json",
              "pattern_research_input_validation_manifest.json"
          )

          foreach ($name in $requiredFiles) {

              $path = Join-Path `
                  $env:PATTERN_VALIDATION_REPORT_DIR `
                  $name

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required validation output missing: $path"
              }

              $file = Get-Item -LiteralPath $path

              if ($file.Length -eq 0) {
                  throw "Validation output is empty: $path"
              }

              Write-Host "[PASS] $name ($($file.Length) bytes)"
          }


      # ================================================================
      # 18. VALIDATE RESULT JSON
      #
      # IMPORTANT:
      # PowerShell ConvertFrom-Json is intentionally NOT used here.
      #
      # The validation report can contain a very large issues array.
      # Windows PowerShell JSON parsing can fail on large/deep reports.
      #
      # Python parses the original JSON directly and validates only the
      # required contract fields.
      # ================================================================

      - name: 18 - Validate result JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE RESULT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $resultPath = Join-Path `
              $env:PATTERN_VALIDATION_REPORT_DIR `
              "pattern_research_input_validation.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
              throw "Result JSON missing: $resultPath"
          }

          $pythonCode = @'
          import json
          import os
          import sys

          path = os.environ["PATTERN_RESULT_JSON"]

          try:
              with open(path, "r", encoding="utf-8-sig") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse result JSON: {type(exc).__name__}: {exc}")
              sys.exit(10)

          if not isinstance(data, dict):
              print("[FAIL] Result JSON root must be an object.")
              sys.exit(11)

          summary = data.get("summary")

          if not isinstance(summary, dict):
              print("[FAIL] Result JSON missing summary object.")
              sys.exit(12)

          program = summary.get("program")
          version = summary.get("version")
          result = summary.get("result")
          total_files = summary.get("total_files")
          passed_files = summary.get("passed_files")
          failed_files = summary.get("failed_files")
          fatal_count = summary.get("fatal_count")

          print(f"Program:")
          print(f"  {program}")
          print()
          print(f"Version:")
          print(f"  {version}")
          print()
          print(f"Result:")
          print(f"  {result}")
          print()
          print(f"Total files:")
          print(f"  {total_files}")
          print()
          print(f"Passed files:")
          print(f"  {passed_files}")
          print()
          print(f"Failed files:")
          print(f"  {failed_files}")
          print()
          print(f"Fatal issues:")
          print(f"  {fatal_count}")

          if version != "Clean V001":
              print(f"[FAIL] Unexpected validator version: {version}")
              sys.exit(20)

          if result != "PASS":
              print(f"[FAIL] Pattern research input validation result is not PASS: {result}")
              sys.exit(21)

          try:
              total_files_int = int(total_files)
              passed_files_int = int(passed_files)
              failed_files_int = int(failed_files)
              fatal_count_int = int(fatal_count)
          except (TypeError, ValueError):
              print("[FAIL] Summary counters are not valid integers.")
              sys.exit(22)

          if total_files_int <= 0:
              print("[FAIL] Validation result contains zero files.")
              sys.exit(23)

          if failed_files_int != 0:
              print(f"[FAIL] Validation result contains failed files: {failed_files_int}")
              sys.exit(24)

          if fatal_count_int != 0:
              print(f"[FAIL] Validation result contains fatal issues: {fatal_count_int}")
              sys.exit(25)

          if passed_files_int != total_files_int:
              print(
                  "[FAIL] passed_files does not equal total_files: "
                  f"{passed_files_int} != {total_files_int}"
              )
              sys.exit(26)

          print()
          print("[PASS] Result JSON validated.")
          '@

          $env:PATTERN_RESULT_JSON = $resultPath

          $pythonCode | py -X utf8 -

          if ($LASTEXITCODE -ne 0) {
              throw "Result JSON validation failed with Python exit code $LASTEXITCODE"
          }


      # ================================================================
      # 19. VALIDATE CHECKPOINT
      # ================================================================

      - name: 19 - Validate checkpoint
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          $checkpointPath = Join-Path `
              $env:PATTERN_VALIDATION_REPORT_DIR `
              "pattern_research_input_validation_checkpoint.json"

          if (-not (Test-Path -LiteralPath $checkpointPath -PathType Leaf)) {
              throw "Checkpoint missing: $checkpointPath"
          }

          $pythonCode = @'
          import json
          import os
          import sys

          path = os.environ["PATTERN_CHECKPOINT_JSON"]

          try:
              with open(path, "r", encoding="utf-8-sig") as f:
                  checkpoint = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse checkpoint JSON: {type(exc).__name__}: {exc}")
              sys.exit(10)

          if not isinstance(checkpoint, dict):
              print("[FAIL] Checkpoint root must be an object.")
              sys.exit(11)

          result = checkpoint.get("result")
          research_stage = checkpoint.get("research_stage")
          next_stage_allowed = checkpoint.get("next_stage_allowed")
          next_stage = checkpoint.get("next_stage")
          patterns = checkpoint.get("patterns")

          print("Result:")
          print(f"  {result}")
          print()
          print("Research stage:")
          print(f"  {research_stage}")
          print()
          print("Next stage allowed:")
          print(f"  {next_stage_allowed}")
          print()
          print("Next stage:")
          print(f"  {next_stage}")

          if result != "PASS":
              print(f"[FAIL] Checkpoint result is not PASS: {result}")
              sys.exit(20)

          if research_stage != "PATTERN_RESEARCH_INPUT_VALIDATION":
              print(f"[FAIL] Unexpected research stage: {research_stage}")
              sys.exit(21)

          if next_stage_allowed is not True:
              print("[FAIL] Checkpoint does not allow next research stage.")
              sys.exit(22)

          if next_stage != "PATTERN_QUANTIFICATION":
              print(f"[FAIL] Unexpected next stage: {next_stage}")
              sys.exit(23)

          expected_patterns = [
              "256",
              "밥그릇 3번자리",
              "역매공파",
              "공구리",
              "돌파",
              "눌림목",
              "기준봉",
              "하이힐",
              "오돌이",
          ]

          if not isinstance(patterns, list):
              print("[FAIL] Checkpoint patterns must be a list.")
              sys.exit(24)

          if patterns != expected_patterns:
              print("[FAIL] Research pattern contract mismatch.")
              print()
              print("Expected:")
              for index, value in enumerate(expected_patterns, start=1):
                  print(f"  {index:02d}. {value}")

              print()
              print("Found:")
              for index, value in enumerate(patterns, start=1):
                  print(f"  {index:02d}. {value}")

              sys.exit(25)

          print()
          print("Patterns:")

          for index, pattern in enumerate(patterns, start=1):
              print(f"  {index:02d}. {pattern}")

          print()
          print("[PASS] Checkpoint validated.")
          '@

          $env:PATTERN_CHECKPOINT_JSON = $checkpointPath

          $pythonCode | py -X utf8 -

          if ($LASTEXITCODE -ne 0) {
              throw "Checkpoint validation failed with Python exit code $LASTEXITCODE"
          }


      # ================================================================
      # 20. VALIDATE REPORT MANIFEST HASHES
      # ================================================================

      - name: 20 - Validate report manifest hashes
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE REPORT MANIFEST HASHES"
          Write-Host "============================================================"
          Write-Host ""

          $manifestPath = Join-Path `
              $env:PATTERN_VALIDATION_REPORT_DIR `
              "pattern_research_input_validation_manifest.json"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Manifest missing: $manifestPath"
          }

          $pythonCode = @'
          import hashlib
          import json
          import os
          import sys

          manifest_path = os.environ["PATTERN_MANIFEST_JSON"]
          report_dir = os.environ["PATTERN_VALIDATION_REPORT_DIR"]

          try:
              with open(manifest_path, "r", encoding="utf-8-sig") as f:
                  manifest = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse manifest JSON: {type(exc).__name__}: {exc}")
              sys.exit(10)

          if not isinstance(manifest, dict):
              print("[FAIL] Manifest root must be an object.")
              sys.exit(11)

          version = manifest.get("version")

          if version != "Clean V001":
              print(f"[FAIL] Unexpected manifest version: {version}")
              sys.exit(20)

          records = manifest.get("files")

          if not isinstance(records, list) or not records:
              print("[FAIL] Manifest contains no file records.")
              sys.exit(21)

          validated = 0

          for record in records:
              if not isinstance(record, dict):
                  print("[FAIL] Invalid manifest file record.")
                  sys.exit(22)

              name = record.get("name")
              expected_hash = record.get("sha256")
              expected_size = record.get("size_bytes")

              if not name:
                  print("[FAIL] Manifest record missing file name.")
                  sys.exit(23)

              path = os.path.join(report_dir, name)

              if not os.path.isfile(path):
                  print(f"[FAIL] Manifest file missing: {path}")
                  sys.exit(24)

              digest = hashlib.sha256()

              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      digest.update(chunk)

              actual_hash = digest.hexdigest().lower()

              if str(expected_hash).lower() != actual_hash:
                  print(f"[FAIL] Manifest SHA256 mismatch: {name}")
                  print(f"  Expected: {expected_hash}")
                  print(f"  Actual  : {actual_hash}")
                  sys.exit(25)

              actual_size = os.path.getsize(path)

              try:
                  expected_size_int = int(expected_size)
              except (TypeError, ValueError):
                  print(f"[FAIL] Invalid manifest size for: {name}")
                  sys.exit(26)

              if actual_size != expected_size_int:
                  print(f"[FAIL] Manifest size mismatch: {name}")
                  print(f"  Expected: {expected_size_int}")
                  print(f"  Actual  : {actual_size}")
                  sys.exit(27)

              print(f"[PASS] {name}")
              validated += 1

          print()
          print(f"Validated manifest records: {validated}")
          print("[PASS] Manifest hashes validated.")
          '@

          $env:PATTERN_MANIFEST_JSON = $manifestPath

          $pythonCode | py -X utf8 -

          if ($LASTEXITCODE -ne 0) {
              throw "Manifest validation failed with Python exit code $LASTEXITCODE"
          }


      # ================================================================
      # 21. VERIFY NO FORBIDDEN GIT OPERATIONS
      # ================================================================

      - name: 21 - Verify no forbidden Git operations are executable
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY NO FORBIDDEN GIT OPERATIONS"
          Write-Host "============================================================"
          Write-Host ""

          $validator = Join-Path `
              $env:GITHUB_WORKSPACE `
              "validate_pattern_research_input.py"

          $content = Get-Content `
              -LiteralPath $validator `
              -Raw

          $forbiddenPatterns = @(
              '(?im)^\s*os\.system\s*\(\s*["'']git\s+(reset|clean|commit|push)\b',
              '(?im)^\s*subprocess\.(run|call|Popen|check_call|check_output)\s*\([^\r\n]*(git)[^\r\n]*(reset|clean|commit|push)',
              '(?im)^\s*["'']git["'']\s*,\s*["''](reset|clean|commit|push)["'']'
          )

          foreach ($pattern in $forbiddenPatterns) {

              if ($content -match $pattern) {
                  throw "Potential executable forbidden Git operation detected."
              }
          }

          Write-Host "[PASS] No executable forbidden Git operation detected."


      # ================================================================
      # 22. FINAL CLEAN V001 TEST GATE
      # ================================================================

      - name: 22 - Final Clean V001 test gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL CLEAN V001 TEST GATE"
          Write-Host "============================================================"
          Write-Host ""

          $resultPath = Join-Path `
              $env:PATTERN_VALIDATION_REPORT_DIR `
              "pattern_research_input_validation.json"

          $checkpointPath = Join-Path `
              $env:PATTERN_VALIDATION_REPORT_DIR `
              "pattern_research_input_validation_checkpoint.json"

          $pythonCode = @'
          import json
          import os
          import sys

          result_path = os.environ["PATTERN_RESULT_JSON"]
          checkpoint_path = os.environ["PATTERN_CHECKPOINT_JSON"]

          try:
              with open(result_path, "r", encoding="utf-8-sig") as f:
                  result_data = json.load(f)

              with open(checkpoint_path, "r", encoding="utf-8-sig") as f:
                  checkpoint = json.load(f)

          except Exception as exc:
              print(f"[FAIL] Final gate JSON parse error: {type(exc).__name__}: {exc}")
              sys.exit(10)

          summary = result_data.get("summary")

          if not isinstance(summary, dict):
              print("[FAIL] Final gate: summary missing.")
              sys.exit(11)

          if summary.get("result") != "PASS":
              print("[FAIL] Final gate: result != PASS")
              sys.exit(20)

          try:
              failed_files = int(summary.get("failed_files"))
              fatal_count = int(summary.get("fatal_count"))
          except (TypeError, ValueError):
              print("[FAIL] Final gate: invalid summary counters.")
              sys.exit(21)

          if failed_files != 0:
              print("[FAIL] Final gate: failed_files != 0")
              sys.exit(22)

          if fatal_count != 0:
              print("[FAIL] Final gate: fatal_count != 0")
              sys.exit(23)

          if checkpoint.get("result") != "PASS":
              print("[FAIL] Final gate: checkpoint result != PASS")
              sys.exit(24)

          if checkpoint.get("next_stage_allowed") is not True:
              print("[FAIL] Final gate: next_stage_allowed != true")
              sys.exit(25)

          if checkpoint.get("next_stage") != "PATTERN_QUANTIFICATION":
              print(
                  "[FAIL] Final gate: next_stage != PATTERN_QUANTIFICATION"
              )
              sys.exit(26)

          expected_patterns = [
              "256",
              "밥그릇 3번자리",
              "역매공파",
              "공구리",
              "돌파",
              "눌림목",
              "기준봉",
              "하이힐",
              "오돌이",
          ]

          if checkpoint.get("patterns") != expected_patterns:
              print("[FAIL] Final gate: pattern contract mismatch.")
              sys.exit(27)

          print("Program:")
          print("  validate_pattern_research_input.py")
          print()
          print("Version:")
          print("  Clean V001")
          print()
          print("Validation:")
          print("  PASS")
          print()
          print("Production OHLCV:")
          print("  UNCHANGED")
          print()
          print("Research patterns:")
          print(f"  {len(expected_patterns)}")
          print()
          print("Next stage:")
          print("  PATTERN_QUANTIFICATION")
          print()
          print("============================================================")
          print("CLEAN V001 TEST GATE: PASS")
          print("============================================================")
          '@

          $env:PATTERN_RESULT_JSON = $resultPath
          $env:PATTERN_CHECKPOINT_JSON = $checkpointPath

          $pythonCode | py -X utf8 -

          if ($LASTEXITCODE -ne 0) {
              throw "Final Clean V001 test gate failed with Python exit code $LASTEXITCODE"
          }


      # ================================================================
      # 23. FAILURE DIAGNOSTICS
      # ================================================================

      - name: 23 - Failure diagnostics
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FAILURE DIAGNOSTICS"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Production root:"
          Write-Host "  $env:UPBIT_SURGE_PROJECT_ROOT"

          Write-Host ""
          Write-Host "OHLCV root:"
          Write-Host "  $env:PRODUCTION_OHLCV_ROOT"

          Write-Host ""
          Write-Host "Evidence:"
          Write-Host "  $env:PATTERN_TEST_EVIDENCE"

          Write-Host ""
          Write-Host "Report directory:"
          Write-Host "  $env:PATTERN_VALIDATION_REPORT_DIR"

          if (
              $env:PATTERN_VALIDATION_REPORT_DIR -and
              (Test-Path -LiteralPath $env:PATTERN_VALIDATION_REPORT_DIR)
          ) {

              Write-Host ""
              Write-Host "Validation report files:"

              Get-ChildItem `
                  -LiteralPath $env:PATTERN_VALIDATION_REPORT_DIR `
                  -File |
                  Select-Object `
                      Name,
                      Length,
                      LastWriteTime |
                  Format-Table -AutoSize |
                  Out-String |
                  Write-Host
          }

          if (
              $env:PATTERN_TEST_EVIDENCE -and
              (Test-Path -LiteralPath $env:PATTERN_TEST_EVIDENCE)
          ) {

              Write-Host ""
              Write-Host "Test evidence files:"

              Get-ChildItem `
                  -LiteralPath $env:PATTERN_TEST_EVIDENCE `
                  -File |
                  Select-Object `
                      Name,
                      Length,
                      LastWriteTime |
                  Format-Table -AutoSize |
                  Out-String |
                  Write-Host
          }


      # ================================================================
      # 24. UPLOAD TEST EVIDENCE
      # ================================================================

      - name: 24 - Upload pattern research input validation test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-research-input-validation-test-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/validate_pattern_research_input_test/**
            ${{ env.UPBIT_SURGE_PROJECT_ROOT }}/data/reports/pattern_research_input_validation/**
