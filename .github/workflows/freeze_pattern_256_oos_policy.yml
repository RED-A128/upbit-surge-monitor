
name: freeze_pattern_256_oos_policy.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-oos-policy-freeze
  cancel-in-progress: false

jobs:
  freeze-oos-policy:
    name: freeze-oos-policy
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $script = Join-Path $env:GITHUB_WORKSPACE "freeze_pattern_256_oos_policy.py"

          $inputs = @(
            "data\reports\pattern_256_entry_policy_gate\entry_policy_gate_result.json",
            "data\reports\pattern_256_entry_policy_gate\entry_policy_gate_report.md",
            "data\reports\pattern_256_entry_policy_gate\entry_policy_gate_manifest.json"
          )

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Python script missing: $script"
          }

          foreach ($relative in $inputs) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required input missing: $path"
            }
          }

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python environment failed"
          }

          Write-Host "Environment PASS"

      - name: Freeze provisional OOS policy
        id: freeze
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $script = Join-Path $env:GITHUB_WORKSPACE "freeze_pattern_256_oos_policy.py"

          py -u $script --root $root

          if ($LASTEXITCODE -ne 0) {
            throw "Policy freeze execution failed"
          }

      - name: Verify policy and SHA256
        id: verify
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $dir = Join-Path $root "data\reports\pattern_256_oos_policy_freeze"

          $resultPath = Join-Path $dir "oos_policy_freeze_result.json"
          $policyPath = Join-Path $dir "oos_policy.json"
          $manifestPath = Join-Path $dir "oos_policy_freeze_manifest.json"

          foreach ($path in @($resultPath, $policyPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required output missing: $path"
            }
          }

          $result = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json

          $policy = Get-Content -LiteralPath $policyPath -Raw |
            ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json

          $expectedNames = @(
            "oos_policy.json",
            "oos_policy_freeze_result.json",
            "oos_policy_freeze_report.md"
          )

          $actualNames = @(
            $manifest.outputs.PSObject.Properties.Name
          )

          if (
            (Compare-Object `
              -ReferenceObject $expectedNames `
              -DifferenceObject $actualNames).Count -ne 0
          ) {
            throw "Unexpected manifest outputs"
          }

          foreach ($item in $manifest.outputs.PSObject.Properties) {
            $path = Join-Path $dir $item.Name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Output missing: $path"
            }

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLower()

            $expected = ([string]$item.Value).ToLower()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $($item.Name)"
            }
          }

          if ($result.version -ne "Clean V001") {
            throw "Unexpected version"
          }

          if ($result.execution -ne "PASS") {
            throw "Execution did not PASS"
          }

          if (
            $result.classification -ne
            "PROVISIONAL_OOS_POLICY_FROZEN"
          ) {
            throw "Unexpected classification"
          }

          if ($result.previous_gate_verified -ne $true) {
            throw "Previous gate not verified"
          }

          if ($policy.status -ne "PROVISIONAL_RESEARCH_POLICY") {
            throw "Unexpected policy status"
          }

          if (
            $result.policy_id -ne
            $policy.policy_id
          ) {
            throw "Policy ID mismatch"
          }

          if ($result.execution_policy_confirmed -ne $false) {
            throw "Unexpected execution approval"
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($result.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($result.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          Write-Host "Policy and SHA256 verification PASS"

      - name: Publish summary
        if: always()
        run: |
          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $path = Join-Path $root "data\reports\pattern_256_oos_policy_freeze\oos_policy_freeze_result.json"

          Add-Content $env:GITHUB_STEP_SUMMARY "## Pattern 256 OOS Policy Freeze"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Check | Result |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|---|---|"

          if ("${{ steps.verify.outcome }}" -eq "success") {
            $r = Get-Content -LiteralPath $path -Raw |
              ConvertFrom-Json

            Add-Content $env:GITHUB_STEP_SUMMARY "| Execution | $($r.execution) |"
            Add-Content $env:GITHUB_STEP_SUMMARY "| Classification | $($r.classification) |"
            Add-Content $env:GITHUB_STEP_SUMMARY "| Previous gate | $($r.previous_gate_verified) |"
            Add-Content $env:GITHUB_STEP_SUMMARY "| Policy ID | $($r.policy_id) |"
          }
          else {
            Add-Content $env:GITHUB_STEP_SUMMARY "| Execution | FAILED OR NOT VERIFIED |"
          }

          Add-Content $env:GITHUB_STEP_SUMMARY "| Independent OOS | NOT PROVEN |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Research decision | HOLD |"

      - name: Stage reports
        if: steps.verify.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $source = Join-Path $root "data\reports\pattern_256_oos_policy_freeze"
          $destination = Join-Path $env:GITHUB_WORKSPACE "oos-policy-freeze-artifact"

          New-Item -ItemType Directory -Force -Path $destination |
            Out-Null

          $names = @(
            "oos_policy.json",
            "oos_policy_freeze_result.json",
            "oos_policy_freeze_report.md",
            "oos_policy_freeze_manifest.json"
          )

          foreach ($name in $names) {
            Copy-Item `
              -LiteralPath (Join-Path $source $name) `
              -Destination (Join-Path $destination $name) `
              -Force `
              -ErrorAction Stop
          }

      - name: Upload reports
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-oos-policy-freeze
          path: oos-policy-freeze-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.freeze.outcome }}" -ne "success") {
            throw "Policy freeze execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Policy verification failed"
          }

          Write-Host "OOS policy freeze PASS"
