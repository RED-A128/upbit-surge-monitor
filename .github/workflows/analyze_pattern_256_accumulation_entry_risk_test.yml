
name: analyze_pattern_256_accumulation_entry_risk_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-accumulation-entry-risk
  cancel-in-progress: false

jobs:
  entry-risk-test:
    name: Entry Risk Analysis Test

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: analyze_pattern_256_accumulation_entry_risk.py

    steps:

      # ============================================================
      # 01. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      # ============================================================
      # 02. Verify Python program
      # ============================================================

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Entry risk program missing: $program"
          }

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          Write-Host "Python verification PASS"

      # ============================================================
      # 03. Verify production inputs
      # ============================================================

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          $requiredFiles = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"
          )

          $optionalFiles = @(
            "data\reports\pattern_256_accumulation_fair\fair_comparison.csv"
            "data\reports\pattern_256_accumulation_fair\fair_result.json"
          )

          foreach ($relative in $requiredFiles) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required input missing: $path"
            }

            Write-Host "FOUND: $relative"
          }

          $optionalCount = 0

          foreach ($relative in $optionalFiles) {
            $path = Join-Path $root $relative

            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $optionalCount++
            }
          }

          if ($optionalCount -eq 1) {
            throw "Optional fair comparison input set is incomplete."
          }

          $validationPath = Join-Path $root `
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"

          $validation = Get-Content `
            -LiteralPath $validationPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($validation.status -ne "PASS") {
            throw "Validation result status is not PASS."
          }

          if ($optionalCount -eq 2) {
            $fairPath = Join-Path $root `
              "data\reports\pattern_256_accumulation_fair\fair_result.json"

            $fair = Get-Content `
              -LiteralPath $fairPath `
              -Raw -Encoding UTF8 | ConvertFrom-Json

            if ($fair.status -ne "PASS") {
              throw "Fair comparison result status is not PASS."
            }
          }

          Write-Host "Production input verification PASS"

      # ============================================================
      # 04. Capture input SHA256
      # ============================================================

      - name: Capture production input SHA256
        id: hashes
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $files = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"
          )

          $optionalFiles = @(
            "data\reports\pattern_256_accumulation_fair\fair_comparison.csv"
            "data\reports\pattern_256_accumulation_fair\fair_result.json"
          )

          $optionalCount = @(
            $optionalFiles | Where-Object {
              Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf
            }
          ).Count

          if ($optionalCount -eq 1) {
            throw "Optional input set incomplete."
          }

          if ($optionalCount -eq 2) {
            $files += $optionalFiles
          }

          $hashes = @{}

          foreach ($relative in $files) {
            $path = Join-Path $root $relative

            $hash = (Get-FileHash `
              -LiteralPath $path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            $hashes[$relative] = $hash

            Write-Host "SHA256: $relative = $hash"
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP `
            "entry_risk_input_hashes_${{ github.run_id }}_${{ github.run_attempt }}.json"

          if (Test-Path -LiteralPath $manifestPath) {
            throw "Hash manifest already exists. Refusing overwrite."
          }

          $hashes |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath $manifestPath -Encoding UTF8

          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT

          Write-Host "Input SHA256 capture PASS"

      # ============================================================
      # 05. Prepare isolated workspace
      # ============================================================

      - name: Prepare isolated entry risk workspace
        id: workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path $env:RUNNER_TEMP `
            "entry_risk_test_${{ github.run_id }}_${{ github.run_attempt }}"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists. Refusing overwrite."
          }

          New-Item -ItemType Directory `
            -Path $testRoot | Out-Null

          $source = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME
          $target = Join-Path $testRoot $env:PROGRAM_NAME

          Copy-Item -LiteralPath $source -Destination $target

          $sourceHash = (Get-FileHash `
            -LiteralPath $source `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          $targetHash = (Get-FileHash `
            -LiteralPath $target `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($sourceHash -ne $targetHash) {
            throw "Copied program SHA256 mismatch."
          }

          "test_root=$testRoot" >> $env:GITHUB_OUTPUT

          Write-Host "Isolated workspace PASS: $testRoot"

      # ============================================================
      # 06. Copy and verify isolated inputs
      # ============================================================

      - name: Copy verified production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = "${{ steps.workspace.outputs.test_root }}"
          $manifestPath = "${{ steps.hashes.outputs.manifest_path }}"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Input hash manifest missing."
          }

          $expected = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($property in $expected.PSObject.Properties) {
            $relative = $property.Name
            $expectedHash = [string]$property.Value

            $source = Join-Path $env:PRODUCTION_ROOT $relative
            $target = Join-Path $testRoot $relative

            $parent = Split-Path $target -Parent

            New-Item -ItemType Directory `
              -Path $parent `
              -Force | Out-Null

            if (Test-Path -LiteralPath $target) {
              throw "Target already exists: $target"
            }

            $sourceHash = (Get-FileHash `
              -LiteralPath $source `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($sourceHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Production input changed before copy: $relative"
            }

            Copy-Item `
              -LiteralPath $source `
              -Destination $target

            $targetHash = (Get-FileHash `
              -LiteralPath $target `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($targetHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Copied input SHA256 mismatch: $relative"
            }

            Write-Host "COPY VERIFIED: $relative"
          }

          Write-Host "Isolated input verification PASS"

      # ============================================================
      # 07. Execute entry risk test
      # ============================================================

      - name: Execute entry risk analysis test
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = "${{ steps.workspace.outputs.test_root }}"
          $program = Join-Path $testRoot $env:PROGRAM_NAME

          Set-Location $testRoot

          Write-Host "========================================"
          Write-Host "Entry Risk Analysis Test"
          Write-Host "========================================"

          py $program

          if ($LASTEXITCODE -ne 0) {
            throw "Entry risk analysis execution failed."
          }

          Write-Host "Entry risk analysis execution PASS"

      # ============================================================
      # 08. Verify test outputs
      # ============================================================

      - name: Verify entry risk test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = "${{ steps.workspace.outputs.test_root }}"

          $outputDir = Join-Path $testRoot `
            "data\reports\pattern_256_accumulation_entry_risk"

          $summary = Join-Path $outputDir "entry_risk_summary.csv"
          $stops = Join-Path $outputDir "entry_risk_stop_scenarios.csv"
          $resultPath = Join-Path $outputDir "entry_risk_result.json"
          $manifestPath = Join-Path $outputDir "entry_risk_manifest.json"

          foreach ($path in @(
            $summary,
            $stops,
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }

            Write-Host "FOUND: $path"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Entry risk result is not PASS."
          }

          if ($result.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected program name."
          }

          if ($result.version -ne "Clean V002") {
            throw "Unexpected program version."
          }

          if ([int]$result.summary_rows -ne 18) {
            throw "Expected 18 summary rows."
          }

          if ([int]$result.stop_scenario_rows -ne 72) {
            throw "Expected 72 stop scenario rows."
          }

          if ($manifest.program -ne $result.program) {
            throw "Manifest program mismatch."
          }

          if ($manifest.version -ne $result.version) {
            throw "Manifest version mismatch."
          }

          $checks = @(
            @{
              Path = $summary
              ResultHash = [string]$result.entry_risk_summary_sha256
              ManifestHash = [string]$manifest.outputs.'entry_risk_summary.csv'
            },
            @{
              Path = $stops
              ResultHash = [string]$result.entry_risk_stop_scenarios_sha256
              ManifestHash = [string]$manifest.outputs.'entry_risk_stop_scenarios.csv'
            }
          )

          foreach ($check in $checks) {
            $actual = (Get-FileHash `
              -LiteralPath $check.Path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $check.ResultHash.ToLowerInvariant()) {
              throw "Result SHA256 mismatch: $($check.Path)"
            }

            if ($actual -ne $check.ManifestHash.ToLowerInvariant()) {
              throw "Manifest SHA256 mismatch: $($check.Path)"
            }

            Write-Host "SHA256 PASS: $($check.Path)"
          }

          $summaryRows = @(Import-Csv -LiteralPath $summary)
          $stopRows = @(Import-Csv -LiteralPath $stops)

          if ($summaryRows.Count -ne 18) {
            throw "Summary CSV row count mismatch."
          }

          if ($stopRows.Count -ne 72) {
            throw "Stop scenario CSV row count mismatch."
          }

          $included = [int64]0
          $complete = [int64]0
          $hits = [int64]0

          foreach ($row in $summaryRows) {
            $included += [int64]$row.total_rows
            $complete += [int64]$row.complete_rows
            $hits += [int64]$row.hit_count
          }

          if ($included -ne [int64]$result.included_rows) {
            throw "Included row count mismatch."
          }

          if ($complete -ne [int64]$result.complete_rows) {
            throw "Complete row count mismatch."
          }

          if ($hits -ne [int64]$result.hit_rows) {
            throw "HIT count mismatch."
          }

          Write-Host "========================================"
          Write-Host "Entry Risk Test Summary"
          Write-Host "========================================"

          Write-Host "Source rows: $($result.source_rows)"
          Write-Host "Included rows: $($result.included_rows)"
          Write-Host "Complete rows: $($result.complete_rows)"
          Write-Host "HIT rows: $($result.hit_rows)"
          Write-Host "Summary rows: $($result.summary_rows)"
          Write-Host "Stop scenario rows: $($result.stop_scenario_rows)"
          Write-Host "Elapsed seconds: $($result.elapsed_seconds)"

          Write-Host "Entry risk output verification PASS"

      # ============================================================
      # 09. Verify production inputs unchanged
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = "${{ steps.hashes.outputs.manifest_path }}"

          if (
            -not $manifestPath -or
            -not (Test-Path -LiteralPath $manifestPath -PathType Leaf)
          ) {
            Write-Host "Initial SHA256 manifest unavailable."
            exit 0
          }

          $expected = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($property in $expected.PSObject.Properties) {
            $relative = $property.Name
            $expectedHash = [string]$property.Value

            $path = Join-Path $env:PRODUCTION_ROOT $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $relative"
            }

            $actual = (Get-FileHash `
              -LiteralPath $path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $expectedHash.ToLowerInvariant()) {
              throw "Production input changed: $relative"
            }

            Write-Host "UNCHANGED PASS: $relative"
          }

          Write-Host "All production inputs unchanged PASS"

      # ============================================================
      # 10. Upload test reports
      # ============================================================

      - name: Upload entry risk test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-entry-risk-test
          path: |
            ${{ steps.workspace.outputs.test_root }}/data/reports/pattern_256_accumulation_entry_risk/entry_risk_summary.csv
            ${{ steps.workspace.outputs.test_root }}/data/reports/pattern_256_accumulation_entry_risk/entry_risk_stop_scenarios.csv
            ${{ steps.workspace.outputs.test_root }}/data/reports/pattern_256_accumulation_entry_risk/entry_risk_result.json
            ${{ steps.workspace.outputs.test_root }}/data/reports/pattern_256_accumulation_entry_risk/entry_risk_manifest.json
          if-no-files-found: error
          retention-days: 14
