
name: backtest_pattern_256_accumulation_candidate_independent.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-production
  cancel-in-progress: false

jobs:
  independent-backtest-production:
    name: Candidate Independent Backtest Production
    runs-on: [self-hosted, Windows]
    timeout-minutes: 720

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHON_SCRIPT: backtest_pattern_256_accumulation_candidate_independent.py
      OUTPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent_backtest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and program
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing Python program: $script"
          }

          & py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }

          & py $script --help

          if ($LASTEXITCODE -ne 0) {
            throw "Python argument verification failed."
          }

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          $required = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing production input: $path"
            }

            Write-Host "[INPUT] $path"
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {
            $directory = Join-Path $root ("data\ohlcv\" + $timeframe)

            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "Missing OHLCV directory: $directory"
            }
          }

          $output = Join-Path $root $env:OUTPUT_RELATIVE

          "PRODUCTION_OUTPUT=$output" >> $env:GITHUB_ENV

          Write-Host "[OUTPUT] $output"

      - name: Prepare production workspace
        run: |
          $ErrorActionPreference = "Stop"

          $auditRoot = Join-Path `
            $env:RUNNER_TEMP `
            ("candidate_independent_production_v004_" +
              $env:GITHUB_RUN_ID + "_" +
              $env:GITHUB_RUN_ATTEMPT)

          New-Item -ItemType Directory -Path $auditRoot -Force |
            Out-Null

          "AUDIT_ROOT=$auditRoot" >> $env:GITHUB_ENV

          $output = $env:PRODUCTION_OUTPUT

          if (Test-Path -LiteralPath $output -PathType Container) {
            Write-Host "[MODE] Existing output found."
            Write-Host "[MODE] Resume only after checkpoint validation."
          }
          else {
            New-Item -ItemType Directory -Path $output -Force |
              Out-Null

            Write-Host "[MODE] New production run."
          }

          Write-Host "[AUDIT] $auditRoot"

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $relativePaths = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          $snapshot = @()

          foreach ($relative in $relativePaths) {
            $path = Join-Path $root $relative

            $snapshot += [PSCustomObject]@{
              relative_path = $relative
              sha256 = (Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256).Hash
            }
          }

          $snapshotPath = Join-Path `
            $env:AUDIT_ROOT `
            "production_input_snapshot.json"

          $json = ConvertTo-Json `
            -InputObject @($snapshot) `
            -Depth 5

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Production input SHA256 snapshot completed."

          foreach ($item in $snapshot) {
            Write-Host "[SHA256] $($item.relative_path) $($item.sha256)"
          }

      - name: Snapshot existing output files
        run: |
          $ErrorActionPreference = "Stop"

          $output = $env:PRODUCTION_OUTPUT

          $files = @(
            Get-ChildItem `
              -LiteralPath $output `
              -File `
              -Recurse
          )

          $records = @()

          foreach ($file in $files) {
            $relative = $file.FullName.Substring(
              $output.Length
            ).TrimStart('\', '/')

            $records += [PSCustomObject]@{
              relative_path = $relative
              sha256 = (Get-FileHash `
                -LiteralPath $file.FullName `
                -Algorithm SHA256).Hash
              size = $file.Length
            }
          }

          $path = Join-Path `
            $env:AUDIT_ROOT `
            "existing_output_snapshot.json"

          $json = ConvertTo-Json `
            -InputObject @($records) `
            -Depth 5

          [System.IO.File]::WriteAllText(
            $path,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "[EXISTING OUTPUT FILES] $($records.Count)"

      - name: Execute independent production backtest
        id: backtest
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PYTHON_SCRIPT

          Write-Host "=============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST PRODUCTION"
          Write-Host "WORKFLOW CLEAN V004"
          Write-Host "=============================================="

          Write-Host "[ROOT] $env:PRODUCTION_ROOT"
          Write-Host "[OUTPUT] $env:PRODUCTION_OUTPUT"

          & py $script `
            --root $env:PRODUCTION_ROOT `
            --output $env:PRODUCTION_OUTPUT `
            --checkpoint-interval 1000

          $exitCode = $LASTEXITCODE

          Write-Host "[BACKTEST] Exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Production backtest failed with exit code $exitCode."
          }

      - name: Verify production result
        run: |
          $ErrorActionPreference = "Stop"

          $output = $env:PRODUCTION_OUTPUT

          if (-not (Test-Path -LiteralPath $output -PathType Container)) {
            throw "Production output directory missing."
          }

          $jsonFiles = @(
            Get-ChildItem `
              -LiteralPath $output `
              -File `
              -Recurse `
              -Filter "*.json" |
              Where-Object {
                $_.Name -match "result"
              }
          )

          if ($jsonFiles.Count -eq 0) {
            throw "Production result JSON missing."
          }

          $requiredMismatchFields = @(
            "status_mismatches",
            "entry_price_mismatches",
            "first_hit_mismatches",
            "observed_bars_mismatches",
            "max_return_mismatches",
            "max_drawdown_mismatches",
            "entry_time_mismatches"
          )

          $verifiedResult = $false

          foreach ($file in $jsonFiles) {
            $result = Get-Content `
              -LiteralPath $file.FullName `
              -Raw |
              ConvertFrom-Json

            if ($null -eq $result) {
              throw "Invalid result JSON: $($file.FullName)"
            }

            $properties = @($result.PSObject.Properties.Name)

            if ("execution_status" -notin $properties) {
              continue
            }

            $status = [string]$result.execution_status

            if ($status -ne "PASS") {
              throw "Production result status is not PASS: $status"
            }

            foreach ($field in $requiredMismatchFields) {
              if ($field -notin $properties) {
                throw "Missing result field: $field"
              }

              $value = [long]$result.$field

              if ($value -ne 0) {
                throw "Production mismatch detected: $field=$value"
              }
            }

            if ("independent_oos_proven" -in $properties) {
              Write-Host "[INDEPENDENT OOS PROVEN] $($result.independent_oos_proven)"
            }

            if ("approved_for_live_trading" -in $properties) {
              if ($result.approved_for_live_trading -eq $true) {
                throw "Live trading approval must remain false."
              }
            }

            Write-Host "[PASS] $($file.FullName)"

            $verifiedResult = $true
          }

          if (-not $verifiedResult) {
            throw "No recognized production result JSON was verified."
          }

          Write-Host "Production result verification PASS."

      - name: Verify trade CSV
        run: |
          $ErrorActionPreference = "Stop"

          $output = $env:PRODUCTION_OUTPUT

          $csvFiles = @(
            Get-ChildItem `
              -LiteralPath $output `
              -File `
              -Recurse `
              -Filter "*.csv"
          )

          if ($csvFiles.Count -eq 0) {
            throw "Production CSV output missing."
          }

          foreach ($file in $csvFiles) {
            $header = Get-Content `
              -LiteralPath $file.FullName `
              -TotalCount 1

            if ([string]::IsNullOrWhiteSpace($header)) {
              throw "Empty CSV header: $($file.FullName)"
            }

            Write-Host "[CSV] $($file.FullName)"
          }

          Write-Host "Trade CSV verification PASS."

      - name: Generate output SHA256 audit
        run: |
          $ErrorActionPreference = "Stop"

          $output = $env:PRODUCTION_OUTPUT

          $files = @(
            Get-ChildItem `
              -LiteralPath $output `
              -File `
              -Recurse
          )

          if ($files.Count -eq 0) {
            throw "No production output files."
          }

          $records = @()

          foreach ($file in $files) {
            $relative = $file.FullName.Substring(
              $output.Length
            ).TrimStart('\', '/')

            $records += [PSCustomObject]@{
              relative_path = $relative
              sha256 = (Get-FileHash `
                -LiteralPath $file.FullName `
                -Algorithm SHA256).Hash
              size = $file.Length
            }
          }

          $manifest = Join-Path `
            $env:AUDIT_ROOT `
            "production_output_sha256.json"

          $json = ConvertTo-Json `
            -InputObject @($records) `
            -Depth 5

          [System.IO.File]::WriteAllText(
            $manifest,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          foreach ($record in $records) {
            $path = Join-Path $output $record.relative_path

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actual -ne $record.sha256) {
              throw "Output SHA256 verification failed: $path"
            }
          }

          Write-Host "Output SHA256 audit PASS."

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:AUDIT_ROOT)) {
            throw "AUDIT_ROOT was not initialized."
          }

          $snapshotPath = Join-Path `
            $env:AUDIT_ROOT `
            "production_input_snapshot.json"

          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Production input snapshot missing."
          }

          $raw = Get-Content `
            -LiteralPath $snapshotPath `
            -Raw

          $parsed = ConvertFrom-Json -InputObject $raw

          $snapshot = @($parsed)

          if (
            $snapshot.Count -eq 1 -and
            $snapshot[0] -is [System.Array]
          ) {
            $snapshot = @($snapshot[0])
          }

          $expectedPaths = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          if ($snapshot.Count -ne $expectedPaths.Count) {
            throw "Unexpected production input snapshot count: $($snapshot.Count)"
          }

          $verified = @{}

          foreach ($item in $snapshot) {
            $relative = [string]$item.relative_path
            $expectedHash = [string]$item.sha256

            if ($relative -notin $expectedPaths) {
              throw "Unexpected snapshot path: $relative"
            }

            if ($verified.ContainsKey($relative)) {
              throw "Duplicate snapshot path: $relative"
            }

            if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid snapshot SHA256: $relative"
            }

            $file = Join-Path `
              $env:PRODUCTION_ROOT `
              $relative

            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Production input disappeared: $relative"
            }

            $currentHash = (
              Get-FileHash `
                -LiteralPath $file `
                -Algorithm SHA256
            ).Hash

            if ($currentHash -ne $expectedHash) {
              throw "Production input changed: $relative"
            }

            $verified[$relative] = $true

            Write-Host "[PASS] $relative"
          }

          foreach ($relative in $expectedPaths) {
            if (-not $verified.ContainsKey($relative)) {
              throw "Production input was not verified: $relative"
            }
          }

          Write-Host "Production input SHA256 verification PASS."

      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-independent-backtest-production-v004-audit
          path: |
            ${{ env.AUDIT_ROOT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Final production validation gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST PRODUCTION"
          Write-Host "FINAL VALIDATION GATE"
          Write-Host "=============================================="

          Write-Host "[PASS] Python program execution"
          Write-Host "[PASS] Production result verification"
          Write-Host "[PASS] Trade CSV verification"
          Write-Host "[PASS] Output SHA256 audit"
          Write-Host "[PASS] Production input SHA256 verification"

          Write-Host "=============================================="
          Write-Host "PRODUCTION WORKFLOW PASS"
          Write-Host "=============================================="

          Write-Host "Research validation only."
          Write-Host "Live trading is not approved."
