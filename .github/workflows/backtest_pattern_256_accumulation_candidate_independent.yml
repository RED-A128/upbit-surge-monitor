
name: backtest_pattern_256_accumulation_candidate_independent.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-production
  cancel-in-progress: false

jobs:
  candidate-independent-backtest-production:
    name: Candidate Independent Backtest Production
    runs-on: [self-hosted, Windows]

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHON_SCRIPT: backtest_pattern_256_accumulation_candidate_independent.py
      EXPECTED_VERSION: Clean V004
      OUTPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent_backtest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and program
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python program missing: $script"
          }

          Write-Host "Python program verified."

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          $required = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required production input missing: $path"
            }
          }

          $ohlcvRoot = Join-Path $root "data\ohlcv"

          if (-not (Test-Path -LiteralPath $ohlcvRoot -PathType Container)) {
            throw "OHLCV directory missing: $ohlcvRoot"
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {
            $folder = Join-Path $ohlcvRoot $timeframe

            if (-not (Test-Path -LiteralPath $folder -PathType Container)) {
              throw "OHLCV timeframe directory missing: $folder"
            }
          }

          Write-Host "Production inputs verified."

      - name: Prepare production workspace
        run: |
          $ErrorActionPreference = "Stop"

          $output = Join-Path $env:PRODUCTION_ROOT $env:OUTPUT_RELATIVE

          $auditRoot = Join-Path $env:RUNNER_TEMP (
            "candidate_independent_production_v002_" +
            $env:GITHUB_RUN_ID + "_" +
            $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $auditRoot) {
            throw "Audit workspace already exists: $auditRoot"
          }

          New-Item -ItemType Directory -Path $auditRoot | Out-Null

          $snapshot = Join-Path $auditRoot "production_input_snapshot.json"
          $runInfo = Join-Path $auditRoot "production_run_info.json"

          "BACKTEST_OUTPUT=$output" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "AUDIT_ROOT=$auditRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "SNAPSHOT_FILE=$snapshot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "RUN_INFO_FILE=$runInfo" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $mode = "NEW"

          if (Test-Path -LiteralPath $output) {
            if (-not (Test-Path -LiteralPath $output -PathType Container)) {
              throw "Output path is not a directory."
            }

            $checkpoint = Join-Path $output "checkpoint.sqlite3"
            $result = Join-Path $output "independent_backtest_result.json"

            if (Test-Path -LiteralPath $checkpoint -PathType Leaf) {
              $mode = "RESUME"
            }
            elseif (Test-Path -LiteralPath $result -PathType Leaf) {
              $existing = Get-Content -LiteralPath $result -Raw -Encoding UTF8 |
                ConvertFrom-Json

              if (
                $existing.version -eq $env:EXPECTED_VERSION -and
                $existing.execution_status -eq "PASS"
              ) {
                $mode = "VERIFY_EXISTING"
              }
              else {
                throw "Existing output is not verified and has no checkpoint."
              }
            }
            else {
              $items = @(
                Get-ChildItem -LiteralPath $output -Force
              )

              if ($items.Count -gt 0) {
                throw "Existing nonempty output has no checkpoint."
              }
            }
          }

          $info = [PSCustomObject]@{
            workflow_version = "Clean V002"
            python_version = $env:EXPECTED_VERSION
            mode = $mode
            output = $output
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          }

          $json = ConvertTo-Json -InputObject $info -Depth 5

          Set-Content -LiteralPath $runInfo -Value $json -Encoding UTF8

          "BACKTEST_MODE=$mode" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST PRODUCTION"
          Write-Host "WORKFLOW CLEAN V002"
          Write-Host "PYTHON CLEAN V004"
          Write-Host "============================================="
          Write-Host "[MODE] $mode"
          Write-Host "[OUTPUT] $output"

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $paths = @(
            (Join-Path $root "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"),
            (Join-Path $root "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json")
          )

          $ohlcvRoot = Join-Path $root "data\ohlcv"

          $paths += @(
            Get-ChildItem -LiteralPath $ohlcvRoot -Recurse -File -Filter "*.csv" |
              Select-Object -ExpandProperty FullName
          )

          $paths = @($paths | Sort-Object -Unique)

          if ($paths.Count -lt 3) {
            throw "Insufficient production input files."
          }

          $snapshot = @(
            foreach ($path in $paths) {
              [PSCustomObject]@{
                path = [System.IO.Path]::GetFullPath($path)
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )

          $json = ConvertTo-Json -InputObject $snapshot -Depth 5

          Set-Content -LiteralPath $env:SNAPSHOT_FILE -Value $json -Encoding UTF8

          Write-Host "Production snapshot count: $($snapshot.Count)"

      - name: Execute independent production backtest
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT

          if ($env:BACKTEST_MODE -eq "VERIFY_EXISTING") {
            Write-Host "Existing result found. Verification required."
            exit 0
          }

          $arguments = @(
            $script,
            "--root",
            $env:PRODUCTION_ROOT,
            "--output-dir",
            $env:BACKTEST_OUTPUT
          )

          if ($env:BACKTEST_MODE -eq "RESUME") {
            $arguments += "--resume"
          }

          Write-Host "============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST PRODUCTION"
          Write-Host "WORKFLOW CLEAN V002"
          Write-Host "PYTHON CLEAN V004"
          Write-Host "============================================="
          Write-Host "[MODE] $env:BACKTEST_MODE"

          & py @arguments

          $exitCode = $LASTEXITCODE

          Write-Host "[BACKTEST] Exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Production backtest failed with exit code $exitCode."
          }

      - name: Verify production result
        run: |
          $ErrorActionPreference = "Stop"

          $output = $env:BACKTEST_OUTPUT

          $required = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json",
            "independent_backtest_manifest.json",
            "checkpoint.sqlite3"
          )

          foreach ($name in $required) {
            $path = Join-Path $output $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing production output: $name"
            }
          }

          $resultPath = Join-Path $output "independent_backtest_result.json"

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Result version mismatch."
          }

          if ($result.execution_status -ne "PASS") {
            throw "Production execution status is not PASS."
          }

          if ($result.smoke_test -ne $false) {
            throw "Production result incorrectly marked as smoke test."
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Independent OOS claim invalid."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading approval invalid."
          }

          if ($result.automatic_trading_enabled -ne $false) {
            throw "Automatic trading flag invalid."
          }

          if ([int64]$result.source_rows_read -le 0) {
            throw "No source rows processed."
          }

          if ([int64]$result.matched_source_rows -le 0) {
            throw "No matched source rows."
          }

          if ([int64]$result.output_rows -le 0) {
            throw "No output rows."
          }

          if ($null -eq $result.mismatch_counts) {
            throw "Missing mismatch_counts object."
          }

          $fields = @(
            "status_mismatches",
            "entry_price_mismatches",
            "first_hit_mismatches",
            "observed_bars_mismatches",
            "max_return_mismatches",
            "max_drawdown_mismatches",
            "entry_time_mismatches"
          )

          $total = [int64]0

          foreach ($field in $fields) {
            $property = $result.mismatch_counts.PSObject.Properties[$field]

            if ($null -eq $property) {
              throw "Missing mismatch field: $field"
            }

            $value = [int64]$property.Value

            if ($value -lt 0) {
              throw "Negative mismatch count: $field"
            }

            Write-Host "$field = $value"

            $total += $value

            if ($value -ne 0) {
              throw "Production mismatch detected: $field = $value"
            }
          }

          if ($null -eq $result.total_field_mismatches) {
            throw "Missing total_field_mismatches."
          }

          if ($total -ne [int64]$result.total_field_mismatches) {
            throw "Mismatch total inconsistency."
          }

          if ($total -ne 0) {
            throw "Production backtest has nonzero mismatches."
          }

          Write-Host "Production result verification PASS."

      - name: Verify trade CSV
        run: |
          $ErrorActionPreference = "Stop"

          $tradePath = Join-Path $env:BACKTEST_OUTPUT "independent_backtest_trades.csv"
          $resultPath = Join-Path $env:BACKTEST_OUTPUT "independent_backtest_result.json"

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          $rows = @(
            Import-Csv -LiteralPath $tradePath
          )

          if ($rows.Count -ne [int64]$result.output_rows) {
            throw (
              "Trade row count mismatch. " +
              "CSV=$($rows.Count) Result=$($result.output_rows)"
            )
          }

          $invalid = @(
            $rows | Where-Object {
              $_.entry_time_check -ne "PASS" -or
              $_.all_checks_match -ne "True"
            }
          )

          if ($invalid.Count -gt 0) {
            Write-Host "Invalid trade rows: $($invalid.Count)"

            $invalid |
              Select-Object -First 20 |
              Format-Table -AutoSize

            throw "Trade CSV contains failed validation rows."
          }

          Write-Host "Trade CSV verified."
          Write-Host "Trade rows: $($rows.Count)"

      - name: Verify output SHA256 manifest
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = Join-Path $env:BACKTEST_OUTPUT "independent_backtest_manifest.json"

          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Manifest version mismatch."
          }

          $names = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json"
          )

          foreach ($name in $names) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Missing manifest hash: $name"
            }

            $path = Join-Path $env:BACKTEST_OUTPUT $name

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne [string]$property.Value) {
              throw "Output SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          Write-Host "Output SHA256 manifest verification PASS."

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:SNAPSHOT_FILE -PathType Leaf)) {
            throw "Production input snapshot missing."
          }

          $beforeRaw = Get-Content -LiteralPath $env:SNAPSHOT_FILE -Raw -Encoding UTF8 |
            ConvertFrom-Json

          $before = @($beforeRaw)

          $root = $env:PRODUCTION_ROOT

          $paths = @(
            (Join-Path $root "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"),
            (Join-Path $root "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json")
          )

          $paths += @(
            Get-ChildItem -LiteralPath (Join-Path $root "data\ohlcv") -Recurse -File -Filter "*.csv" |
              Select-Object -ExpandProperty FullName
          )

          $paths = @($paths | Sort-Object -Unique)

          $beforeMap = @{}

          foreach ($item in $before) {
            $key = [string]$item.path

            if ($beforeMap.ContainsKey($key)) {
              throw "Duplicate production snapshot path: $key"
            }

            $beforeMap[$key] = [string]$item.sha256
          }

          if ($beforeMap.Count -ne $paths.Count) {
            throw (
              "Production input file count changed. " +
              "Before=$($beforeMap.Count) After=$($paths.Count)"
            )
          }

          foreach ($path in $paths) {
            $full = [System.IO.Path]::GetFullPath($path)

            if (-not $beforeMap.ContainsKey($full)) {
              throw "Unexpected production input: $full"
            }

            $actual = (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash

            if ($actual -ne $beforeMap[$full]) {
              throw "Production input changed: $full"
            }
          }

          Write-Host "Production input SHA256 verification PASS."
          Write-Host "Verified input files: $($beforeMap.Count)"

      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-independent-backtest-production-v002-audit
          path: ${{ env.AUDIT_ROOT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Final production validation gate
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path $env:BACKTEST_OUTPUT "independent_backtest_result.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Production result missing."
          }

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Final result version mismatch."
          }

          if ($result.execution_status -ne "PASS") {
            throw "Final execution status mismatch."
          }

          if ($result.smoke_test -ne $false) {
            throw "Final smoke test flag mismatch."
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Independent OOS claim invalid."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading approval invalid."
          }

          if ($result.automatic_trading_enabled -ne $false) {
            throw "Automatic trading flag invalid."
          }

          if ([int64]$result.total_field_mismatches -ne 0) {
            throw "Final mismatch total is not zero."
          }

          Write-Host "============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST PRODUCTION PASS"
          Write-Host "WORKFLOW CLEAN V002"
          Write-Host "PYTHON CLEAN V004"
          Write-Host "============================================="
          Write-Host "SOURCE ROWS: $($result.source_rows_read)"
          Write-Host "MATCHED ROWS: $($result.matched_source_rows)"
          Write-Host "OUTPUT ROWS: $($result.output_rows)"
          Write-Host "FIELD MISMATCHES: 0"
          Write-Host "OUTPUT SHA256: PASS"
          Write-Host "PRODUCTION INPUT SHA256: PASS"
          Write-Host "INDEPENDENT OOS PROVEN: FALSE"
          Write-Host "LIVE TRADING APPROVED: FALSE"
          Write-Host "AUTOMATIC TRADING: FALSE"
          Write-Host "============================================="
