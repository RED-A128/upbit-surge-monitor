
name: audit_pattern_256_market_regime.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-market-regime
  cancel-in-progress: false

jobs:
  market-regime:
    name: market-regime

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify inputs
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_market_regime.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Audit script missing"
          }

          foreach ($tf in @("h4", "d1")) {
            foreach ($relative in @(
              "data\ohlcv\$tf",
              "data\signals\256\$tf"
            )) {
              $path = Join-Path $env:PROJECT_ROOT $relative

              if (-not (Test-Path -LiteralPath $path)) {
                throw "Directory missing: $path"
              }

              $count = @(
                Get-ChildItem `
                  -LiteralPath $path `
                  -Filter "KRW-*.csv" `
                  -File
              ).Count

              if ($count -ne 290) {
                throw "Expected 290 CSV files, got $count"
              }

              Write-Host "[OK] $path : $count"
            }
          }

          & py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Execute audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_market_regime.py"

          & py -u $script `
            --root $env:PROJECT_ROOT `
            --seeds 30 `
            --base-seed 2562026 `
            --split 0.70 `
            --lookback 30

          if ($LASTEXITCODE -ne 0) {
            throw "Audit failed"
          }

      - name: Verify integrity
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_market_regime"

          $resultPath = Join-Path $folder "result.json"
          $manifestPath = Join-Path $folder "manifest.json"

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($name in @("result.json", "report.md")) {
            $path = Join-Path $folder $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $m.sha256.$name

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }
          }

          if ($r.execution -ne "PASS") {
            throw "Execution not PASS"
          }

          if ($r.seeds -ne 30) {
            throw "Seed count mismatch"
          }

          if ($r.market_counts.h4 -ne 290) {
            throw "H4 market count mismatch"
          }

          if ($r.market_counts.d1 -ne 290) {
            throw "D1 market count mismatch"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Invalid research decision"
          }

          if ($r.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          Write-Host "[PASS] Integrity verification"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_market_regime"

          $r = Get-Content `
            -LiteralPath (Join-Path $folder "result.json") `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 Market Regime Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Seeds | $($r.seeds) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## Regime results",
            "",
            "| TF | Period | Regime | Vol | Events | Signal % | Baseline % | Lift pp |",
            "|---|---|---|---|---:|---:|---:|---:|"
          )

          foreach ($tf in @("h4", "d1")) {
            foreach ($period in @("train", "test")) {
              foreach ($regime in @("UP", "SIDE", "DOWN")) {
                foreach ($vol in @("LOW", "HIGH")) {
                  $s = $r.summary.$tf.$period.$regime.$vol

                  $lines += (
                    "| $tf | $period | $regime | $vol " +
                    "| $($s.signal_events) " +
                    "| $($s.signal_rate_pct) " +
                    "| $($s.baseline_mean_pct) " +
                    "| $($s.mean_lift_pp) |"
                  )
                }
              }
            }
          }

          $lines += @(
            "",
            "## Limitations",
            "",
            "- Regime analysis is descriptive",
            "- Volatility median uses retrospective grouping",
            "- Some strata may have unmatched signals",
            "- No independent OOS proof",
            "- No realized profitability proof",
            "- Decision remains HOLD"
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_market_regime"

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "regime_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $a = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash

            $b = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash

            if ($a -ne $b) {
              throw "Staging hash mismatch: $name"
            }
          }

          "STAGED_REPORT_DIR=$destination" |
            Out-File `
              -LiteralPath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

      - name: Upload artifact
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-market-regime
          path: ${{ env.STAGED_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Final gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($status in @(
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] Market regime audit"
          Write-Host "Research decision: HOLD"
