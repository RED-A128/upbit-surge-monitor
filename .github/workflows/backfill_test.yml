name: Upbit Backfill Environment Check V001

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upbit-surge-monitor-backfill-environment-check
  cancel-in-progress: false

jobs:
  environment-check:
    name: Local Project Environment Check

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 10

    defaults:
      run:
        shell: cmd

    steps:

      # ======================================================
      # 1. CHECKOUT GITHUB REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. BASIC RUNNER INFORMATION
      # ======================================================

      - name: Show runner environment
        run: |
          echo ============================================================
          echo UPBIT SURGE MONITOR
          echo BACKFILL ENVIRONMENT CHECK V001
          echo ============================================================
          echo.
          echo Runner Name:
          echo %RUNNER_NAME%
          echo.
          echo Runner OS:
          echo %RUNNER_OS%
          echo.
          echo Repository:
          echo %GITHUB_REPOSITORY%
          echo.
          echo GitHub Workspace:
          echo %GITHUB_WORKSPACE%
          echo.
          echo GitHub Commit:
          echo %GITHUB_SHA%
          echo.
          echo ============================================================

      # ======================================================
      # 3. DEFINE LOCAL PROJECT PATH
      # ======================================================

      - name: Show local project path
        run: |
          echo ============================================================
          echo LOCAL PROJECT PATH
          echo ============================================================
          echo.
          echo C:\Users\USER\Documents\upbit-surge-monitor
          echo.
          echo IMPORTANT:
          echo This workflow is READ ONLY.
          echo.
          echo No git pull.
          echo No git reset.
          echo No git checkout.
          echo No file deletion.
          echo No OHLCV modification.
          echo No backfill execution.
          echo.
          echo ============================================================

      # ======================================================
      # 4. VERIFY LOCAL PROJECT DIRECTORY
      # ======================================================

      - name: Verify local project directory
        run: |
          echo ============================================================
          echo LOCAL PROJECT DIRECTORY CHECK
          echo ============================================================

          if not exist "C:\Users\USER\Documents\upbit-surge-monitor" (
            echo [FAIL] Local project directory not found.
            exit /b 1
          )

          echo [PASS] Local project directory exists.
          echo.
          echo Path:
          echo C:\Users\USER\Documents\upbit-surge-monitor

      # ======================================================
      # 5. SHOW LOCAL DIRECTORY CONTENTS
      # ======================================================

      - name: Show local project files
        run: |
          echo ============================================================
          echo LOCAL PROJECT FILE LIST
          echo ============================================================
          echo.

          dir /b "C:\Users\USER\Documents\upbit-surge-monitor"

          echo.
          echo ============================================================

      # ======================================================
      # 6. VERIFY LOCAL GIT REPOSITORY
      # ======================================================

      - name: Verify local Git repository
        run: |
          echo ============================================================
          echo LOCAL GIT REPOSITORY CHECK
          echo ============================================================

          if not exist "C:\Users\USER\Documents\upbit-surge-monitor\.git" (
            echo [FAIL] .git directory not found.
            exit /b 1
          )

          echo [PASS] .git directory exists.

          cd /d "C:\Users\USER\Documents\upbit-surge-monitor"

          echo.
          echo Git repository root:
          git rev-parse --show-toplevel

          echo.
          echo Current branch:
          git branch --show-current

          echo.
          echo Current local commit:
          git rev-parse HEAD

          echo.
          echo Current remote:
          git remote -v

      # ======================================================
      # 7. SHOW LOCAL GIT STATUS
      # ======================================================

      - name: Show local Git status
        run: |
          echo ============================================================
          echo LOCAL GIT STATUS - READ ONLY
          echo ============================================================

          cd /d "C:\Users\USER\Documents\upbit-surge-monitor"

          echo.
          git status --short

          echo.
          echo ------------------------------------------------------------
          echo FULL STATUS
          echo ------------------------------------------------------------
          echo.

          git status

          echo.
          echo ============================================================

      # ======================================================
      # 8. COMPARE LOCAL AND GITHUB COMMITS
      # ======================================================

      - name: Compare local and GitHub commits
        run: |
          echo ============================================================
          echo COMMIT COMPARISON
          echo ============================================================

          cd /d "C:\Users\USER\Documents\upbit-surge-monitor"

          echo.
          echo Local Documents repository commit:
          git rev-parse HEAD

          echo.
          echo GitHub Actions checked-out commit:
          echo %GITHUB_SHA%

          echo.
          echo NOTE:
          echo Different commit IDs do NOT modify anything.
          echo This step only displays the current state.
          echo.
          echo ============================================================

      # ======================================================
      # 9. CHECK REQUIRED PYTHON FILES IN LOCAL PROJECT
      # ======================================================

      - name: Check local Python files
        run: |
          echo ============================================================
          echo LOCAL PYTHON FILE CHECK
          echo ============================================================
          echo.

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\collector.py" (
            echo [FOUND] collector.py
          ) else (
            echo [MISSING] collector.py
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\validate_collector.py" (
            echo [FOUND] validate_collector.py
          ) else (
            echo [MISSING] validate_collector.py
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data_history_audit.py" (
            echo [FOUND] data_history_audit.py
          ) else (
            echo [MISSING] data_history_audit.py
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\backfill_history.py" (
            echo [FOUND] backfill_history.py
          ) else (
            echo [MISSING] backfill_history.py
          )

          echo.
          echo ============================================================

      # ======================================================
      # 10. CHECK DATA DIRECTORY
      # ======================================================

      - name: Check local OHLCV directories
        run: |
          echo ============================================================
          echo LOCAL OHLCV DIRECTORY CHECK
          echo ============================================================
          echo.

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data" (
            echo [FOUND] data
          ) else (
            echo [MISSING] data
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv" (
            echo [FOUND] data\ohlcv
          ) else (
            echo [MISSING] data\ohlcv
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h1" (
            echo [FOUND] data\ohlcv\h1
          ) else (
            echo [MISSING] data\ohlcv\h1
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h4" (
            echo [FOUND] data\ohlcv\h4
          ) else (
            echo [MISSING] data\ohlcv\h4
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\d1" (
            echo [FOUND] data\ohlcv\d1
          ) else (
            echo [MISSING] data\ohlcv\d1
          )

          echo.
          echo ============================================================

      # ======================================================
      # 11. CHECK KRW-BTC SOURCE FILES
      # ======================================================

      - name: Check local KRW-BTC OHLCV files
        run: |
          echo ============================================================
          echo KRW-BTC LOCAL SOURCE DATA CHECK
          echo ============================================================
          echo.

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h1\KRW-BTC.csv" (
            echo [FOUND] H1 KRW-BTC.csv
          ) else (
            echo [MISSING] H1 KRW-BTC.csv
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h4\KRW-BTC.csv" (
            echo [FOUND] H4 KRW-BTC.csv
          ) else (
            echo [MISSING] H4 KRW-BTC.csv
          )

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\d1\KRW-BTC.csv" (
            echo [FOUND] D1 KRW-BTC.csv
          ) else (
            echo [MISSING] D1 KRW-BTC.csv
          )

          echo.
          echo ============================================================

      # ======================================================
      # 12. SHOW KRW-BTC FILE INFORMATION
      # ======================================================

      - name: Show KRW-BTC file information
        run: |
          echo ============================================================
          echo KRW-BTC FILE INFORMATION
          echo ============================================================
          echo.

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h1\KRW-BTC.csv" (
            dir "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h1\KRW-BTC.csv"
          )

          echo.

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h4\KRW-BTC.csv" (
            dir "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\h4\KRW-BTC.csv"
          )

          echo.

          if exist "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\d1\KRW-BTC.csv" (
            dir "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv\d1\KRW-BTC.csv"
          )

          echo.
          echo ============================================================

      # ======================================================
      # 13. CHECK GITHUB CHECKOUT FILES
      # ======================================================

      - name: Check files available in GitHub checkout
        run: |
          echo ============================================================
          echo GITHUB CHECKOUT FILE CHECK
          echo ============================================================
          echo.

          cd /d "%GITHUB_WORKSPACE%"

          if exist "backfill_history.py" (
            echo [FOUND] GitHub checkout: backfill_history.py
          ) else (
            echo [MISSING] GitHub checkout: backfill_history.py
          )

          if exist "data_history_audit.py" (
            echo [FOUND] GitHub checkout: data_history_audit.py
          ) else (
            echo [MISSING] GitHub checkout: data_history_audit.py
          )

          if exist "validate_collector.py" (
            echo [FOUND] GitHub checkout: validate_collector.py
          ) else (
            echo [MISSING] GitHub checkout: validate_collector.py
          )

          echo.
          echo ============================================================

      # ======================================================
      # 14. FINAL READ-ONLY RESULT
      # ======================================================

      - name: Environment check completed
        run: |
          echo ============================================================
          echo ENVIRONMENT CHECK COMPLETED
          echo ============================================================
          echo.
          echo [PASS] Read-only environment inspection completed.
          echo.
          echo NO backfill was executed.
          echo NO OHLCV file was modified.
          echo NO git pull was executed.
          echo NO git reset was executed.
          echo NO git checkout was executed.
          echo NO local project file was changed.
          echo.
          echo Review these sections:
          echo.
          echo 1. LOCAL GIT STATUS
          echo 2. COMMIT COMPARISON
          echo 3. LOCAL PYTHON FILE CHECK
          echo 4. KRW-BTC LOCAL SOURCE DATA CHECK
          echo 5. GITHUB CHECKOUT FILE CHECK
          echo.
          echo ============================================================
