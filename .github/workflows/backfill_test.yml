name: KRW-BTC Backfill Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill-test:
    name: KRW-BTC Backfill Test

    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    steps:

      # ============================================================
      # 1. SHOW EXECUTION ENVIRONMENT
      # ============================================================

      - name: Show execution environment
        run: |
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR - KRW-BTC BACKFILL TEST"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner Name:"
          Write-Host "${{ runner.name }}"
          Write-Host ""

          Write-Host "Runner OS:"
          Write-Host "${{ runner.os }}"
          Write-Host ""

          Write-Host "GitHub Repository:"
          Write-Host "${{ github.repository }}"
          Write-Host ""

          Write-Host "GitHub Commit:"
          Write-Host "${{ github.sha }}"
          Write-Host ""

          Write-Host "Test Market:"
          Write-Host "KRW-BTC"
          Write-Host ""

          Write-Host "Execution Mode:"
          Write-Host "LOCAL DOCUMENTS REPOSITORY"
          Write-Host ""

          Write-Host "============================================================"


      # ============================================================
      # 2. DEFINE LOCAL PROJECT
      # ============================================================

      - name: Define local project path
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Write-Host "============================================================"
          Write-Host "LOCAL PROJECT PATH"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project:"
          Write-Host $project
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[FAIL] Local project directory not found."
              Write-Host $project
              exit 1
          }

          if (-not (Test-Path "$project\.git")) {
              Write-Host "[FAIL] Local project is not a Git repository."
              exit 1
          }

          Write-Host "[PASS] Local project directory found."
          Write-Host "[PASS] Local Git repository found."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 3. SYNCHRONIZE LOCAL REPOSITORY
      # ============================================================

      - name: Synchronize local repository
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "LOCAL REPOSITORY SYNCHRONIZATION"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Current branch:"
          git branch --show-current

          $branch = git branch --show-current

          if ($branch -ne "main") {
              Write-Host ""
              Write-Host "[FAIL] Local repository is not on main."
              Write-Host "Current branch: $branch"
              exit 1
          }

          Write-Host ""
          Write-Host "Fetching origin..."
          git fetch origin

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] git fetch origin failed."
              exit 1
          }

          Write-Host ""
          Write-Host "Local commit before synchronization:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Origin/main commit:"
          git rev-parse origin/main

          Write-Host ""
          Write-Host "Checking working tree..."

          $status = git status --porcelain

          if ($status) {
              Write-Host ""
              Write-Host "[FAIL] Local working tree contains changes."
              Write-Host ""
              git status
              Write-Host ""
              Write-Host "Backfill test stopped to protect local files."
              exit 1
          }

          Write-Host "[PASS] Working tree is clean."

          Write-Host ""
          Write-Host "Fast-forwarding local main..."
          git merge --ff-only origin/main

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Fast-forward synchronization failed."
              exit 1
          }

          Write-Host ""
          Write-Host "Local commit after synchronization:"
          git rev-parse HEAD

          $localCommit = git rev-parse HEAD
          $remoteCommit = git rev-parse origin/main

          if ($localCommit -ne $remoteCommit) {
              Write-Host ""
              Write-Host "[FAIL] Local main and origin/main are different."
              Write-Host "Local : $localCommit"
              Write-Host "Remote: $remoteCommit"
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Local repository synchronized with origin/main."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 4. CHECK PYTHON
      # ============================================================

      - name: Check Python
        run: |
          Write-Host "============================================================"
          Write-Host "PYTHON CHECK"
          Write-Host "============================================================"
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Python launcher 'py' is unavailable."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python is available."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 5. VERIFY REQUIRED PROJECT FILES
      # ============================================================

      - name: Verify required project files
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "REQUIRED PROJECT FILE CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "collector.py",
              "validate_collector.py",
              "data_history_audit.py",
              "backfill_history.py",
              "requirements.txt"
          )

          $failed = $false

          foreach ($file in $files) {

              if (Test-Path $file) {
                  Write-Host "[FOUND] $file"
              }
              else {
                  Write-Host "[MISSING] $file"
                  $failed = $true
              }
          }

          Write-Host ""

          if ($failed) {
              Write-Host "[FAIL] One or more required project files are missing."
              exit 1
          }

          Write-Host "[PASS] All required project files are present."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 6. INSTALL REQUIREMENTS
      # ============================================================

      - name: Install requirements
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "INSTALL REQUIREMENTS"
          Write-Host "============================================================"
          Write-Host ""

          py -m pip install --disable-pip-version-check -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Requirement installation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Requirements installed."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 7. VERIFY KRW-BTC SOURCE FILES
      # ============================================================

      - name: Verify KRW-BTC source files
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "KRW-BTC SOURCE DATA CHECK"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\ohlcv\h1\KRW-BTC.csv",
              "data\ohlcv\h4\KRW-BTC.csv",
              "data\ohlcv\d1\KRW-BTC.csv"
          )

          $failed = $false

          foreach ($file in $files) {

              if (Test-Path $file) {

                  $item = Get-Item $file

                  Write-Host "[FOUND] $file"
                  Write-Host "        Size: $($item.Length) bytes"
              }
              else {
                  Write-Host "[MISSING] $file"
                  $failed = $true
              }
          }

          Write-Host ""

          if ($failed) {
              Write-Host "[FAIL] One or more KRW-BTC OHLCV files are missing."
              Write-Host ""
              Write-Host "Backfill requires existing OHLCV files."
              exit 1
          }

          Write-Host "[PASS] H1/H4/D1 KRW-BTC source files are present."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 8. RECORD BEFORE-BACKFILL STATE
      # ============================================================

      - name: Record KRW-BTC state before backfill
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "KRW-BTC STATE BEFORE BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import csv
          from pathlib import Path

          files = {
              "H1": Path("data/ohlcv/h1/KRW-BTC.csv"),
              "H4": Path("data/ohlcv/h4/KRW-BTC.csv"),
              "D1": Path("data/ohlcv/d1/KRW-BTC.csv"),
          }

          for timeframe, path in files.items():

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:

                  reader = csv.DictReader(f)
                  rows = list(reader)

              if not rows:
                  raise SystemExit(
                      f"[FAIL] {timeframe} contains zero rows."
                  )

              oldest = rows[0].get(
                  "candle_date_time_utc",
                  ""
              )

              newest = rows[-1].get(
                  "candle_date_time_utc",
                  ""
              )

              print(
                  f"{timeframe}: "
                  f"rows={len(rows):,} | "
                  f"oldest={oldest} | "
                  f"newest={newest}"
              )

          print()
          print("[PASS] Before-backfill state recorded.")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Could not inspect KRW-BTC source files."
              exit 1
          }

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 9. RUN KRW-BTC BACKFILL
      # ============================================================

      - name: Run KRW-BTC history backfill
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "KRW-BTC HISTORY BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Command:"
          Write-Host "py backfill_history.py --market KRW-BTC"
          Write-Host ""

          py backfill_history.py --market KRW-BTC

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Backfill exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] KRW-BTC backfill failed."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] KRW-BTC backfill completed successfully."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 10. RECORD AFTER-BACKFILL STATE
      # ============================================================

      - name: Record KRW-BTC state after backfill
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "KRW-BTC STATE AFTER BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          @'
          import csv
          from pathlib import Path

          files = {
              "H1": Path("data/ohlcv/h1/KRW-BTC.csv"),
              "H4": Path("data/ohlcv/h4/KRW-BTC.csv"),
              "D1": Path("data/ohlcv/d1/KRW-BTC.csv"),
          }

          for timeframe, path in files.items():

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:

                  reader = csv.DictReader(f)
                  rows = list(reader)

              if not rows:
                  raise SystemExit(
                      f"[FAIL] {timeframe} contains zero rows."
                  )

              oldest = rows[0].get(
                  "candle_date_time_utc",
                  ""
              )

              newest = rows[-1].get(
                  "candle_date_time_utc",
                  ""
              )

              print(
                  f"{timeframe}: "
                  f"rows={len(rows):,} | "
                  f"oldest={oldest} | "
                  f"newest={newest}"
              )

          print()
          print("[PASS] After-backfill state recorded.")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Could not inspect backfilled KRW-BTC files."
              exit 1
          }

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 11. SHOW BACKFILL STATUS
      # ============================================================

      - name: Show KRW-BTC backfill status
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "BACKFILL STATUS"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "data\backfill_status.csv")) {
              Write-Host "[FAIL] data\backfill_status.csv was not created."
              exit 1
          }

          @'
          import pandas as pd
          from pathlib import Path

          path = Path("data/backfill_status.csv")

          df = pd.read_csv(
              path,
              encoding="utf-8-sig"
          )

          btc = df[
              df["market"].astype(str).eq("KRW-BTC")
          ].copy()

          if btc.empty:
              raise SystemExit(
                  "[FAIL] No KRW-BTC records found "
                  "in backfill_status.csv."
              )

          print(
              btc.tail(3).to_string(
                  index=False
              )
          )

          print()
          print(
              f"[PASS] KRW-BTC status records found: "
              f"{len(btc):,}"
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Backfill status verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 12. RUN COLLECTOR VALIDATION
      # ============================================================

      - name: Run Collector Validation
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "COLLECTOR VALIDATION AFTER BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          py validate_collector.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Validator exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Collector validation failed."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] Collector validation passed."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 13. RUN DATA HISTORY AUDIT
      # ============================================================

      - name: Run OHLCV Data History Audit
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "DATA HISTORY AUDIT AFTER BACKFILL"
          Write-Host "============================================================"
          Write-Host ""

          py data_history_audit.py

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Audit exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Data history audit failed."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "[PASS] Data history audit passed."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 14. SHOW FINAL LOCAL GIT STATUS
      # ============================================================

      - name: Show final local Git status
        if: always()
        run: |
          $project = "C:\Users\USER\Documents\upbit-surge-monitor"

          Set-Location $project

          Write-Host "============================================================"
          Write-Host "FINAL LOCAL GIT STATUS"
          Write-Host "============================================================"
          Write-Host ""

          git status --short

          Write-Host ""

          Write-Host "NOTE:"
          Write-Host "Backfill modifies local OHLCV data files."
          Write-Host "This step is READ ONLY."
          Write-Host "No commit or push is performed automatically."

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 15. TEST COMPLETED
      # ============================================================

      - name: Backfill Test Completed
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "KRW-BTC BACKFILL TEST COMPLETED"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "[PASS] Local repository synchronization completed."
          Write-Host "[PASS] KRW-BTC H1/H4/D1 source data confirmed."
          Write-Host "[PASS] KRW-BTC historical backfill completed."
          Write-Host "[PASS] Backfill status confirmed."
          Write-Host "[PASS] Collector validation completed."
          Write-Host "[PASS] Data history audit completed."
          Write-Host ""

          Write-Host "IMPORTANT:"
          Write-Host "Backfilled OHLCV data remains in:"
          Write-Host "C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv"
          Write-Host ""

          Write-Host "No automatic Git commit."
          Write-Host "No automatic Git push."
          Write-Host "No trading."
          Write-Host "No orders."

          Write-Host ""
          Write-Host "============================================================"
