name: Upbit Local Repository Sync Check V001

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upbit-surge-monitor-local-sync
  cancel-in-progress: false

jobs:
  sync-check:
    name: Local Repository Sync Check

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 10

    defaults:
      run:
        shell: cmd

    env:
      LOCAL_PROJECT: C:\Users\USER\Documents\upbit-surge-monitor

    steps:

      # ======================================================
      # 1. CHECKOUT CURRENT GITHUB COMMIT
      # ======================================================

      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. SHOW EXECUTION INFORMATION
      # ======================================================

      - name: Show execution information
        run: |
          echo ============================================================
          echo UPBIT SURGE MONITOR
          echo LOCAL REPOSITORY SYNC CHECK V001
          echo ============================================================
          echo.
          echo Runner:
          echo %RUNNER_NAME%
          echo.
          echo Runner OS:
          echo %RUNNER_OS%
          echo.
          echo GitHub repository:
          echo %GITHUB_REPOSITORY%
          echo.
          echo GitHub Actions commit:
          echo %GITHUB_SHA%
          echo.
          echo GitHub workspace:
          echo %GITHUB_WORKSPACE%
          echo.
          echo Local project:
          echo %LOCAL_PROJECT%
          echo.
          echo ============================================================

      # ======================================================
      # 3. VERIFY LOCAL PROJECT
      # ======================================================

      - name: Verify local project
        run: |
          echo ============================================================
          echo VERIFY LOCAL PROJECT
          echo ============================================================
          echo.

          if not exist "%LOCAL_PROJECT%" (
            echo [FAIL] Local project directory does not exist.
            exit /b 1
          )

          if not exist "%LOCAL_PROJECT%\.git" (
            echo [FAIL] Local project is not a Git repository.
            exit /b 1
          )

          if not exist "%LOCAL_PROJECT%\data" (
            echo [FAIL] Local data directory does not exist.
            exit /b 1
          )

          echo [PASS] Local project directory exists.
          echo [PASS] Local Git repository exists.
          echo [PASS] Local data directory exists.
          echo.
          echo ============================================================

      # ======================================================
      # 4. VERIFY WORKING TREE IS CLEAN
      # ======================================================

      - name: Verify local working tree is clean
        run: |
          echo ============================================================
          echo VERIFY LOCAL WORKING TREE
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          echo Current branch:
          git branch --show-current

          echo.
          echo Current commit:
          git rev-parse HEAD

          echo.
          echo Git status:
          git status --short

          echo.

          for /f "delims=" %%i in ('git status --porcelain') do (
            echo [FAIL] Local working tree contains changes.
            echo.
            echo Automatic synchronization has been stopped.
            echo No git pull will be performed.
            exit /b 1
          )

          echo [PASS] Local working tree is clean.
          echo.
          echo ============================================================

      # ======================================================
      # 5. VERIFY MAIN BRANCH
      # ======================================================

      - name: Verify local branch is main
        run: |
          echo ============================================================
          echo VERIFY LOCAL BRANCH
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          for /f "delims=" %%i in ('git branch --show-current') do set CURRENT_BRANCH=%%i

          echo Current branch:
          echo %CURRENT_BRANCH%
          echo.

          if /I not "%CURRENT_BRANCH%"=="main" (
            echo [FAIL] Local repository is not on main branch.
            echo Synchronization stopped.
            exit /b 1
          )

          echo [PASS] Local repository is on main branch.
          echo.
          echo ============================================================

      # ======================================================
      # 6. SHOW CONFIGURED REMOTE
      # ======================================================

      - name: Show local Git remote
        run: |
          echo ============================================================
          echo LOCAL GIT REMOTE
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          git remote -v

          echo.
          echo ============================================================

      # ======================================================
      # 7. FETCH CURRENT GITHUB STATE
      # ======================================================

      - name: Fetch origin
        run: |
          echo ============================================================
          echo FETCH ORIGIN
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          git fetch origin

          if errorlevel 1 (
            echo.
            echo [FAIL] git fetch origin failed.
            exit /b 1
          )

          echo.
          echo [PASS] origin fetched successfully.
          echo.
          echo ============================================================

      # ======================================================
      # 8. COMPARE LOCAL AND ORIGIN MAIN
      # ======================================================

      - name: Compare local and origin main
        run: |
          echo ============================================================
          echo LOCAL VS ORIGIN MAIN
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          echo Local HEAD:
          git rev-parse HEAD

          echo.
          echo origin/main:
          git rev-parse origin/main

          echo.
          echo GitHub Actions commit:
          echo %GITHUB_SHA%

          echo.
          echo Ahead / Behind:
          git rev-list --left-right --count HEAD...origin/main

          echo.
          echo ============================================================

      # ======================================================
      # 9. FAST-FORWARD ONLY SYNCHRONIZATION
      # ======================================================

      - name: Fast-forward local repository
        run: |
          echo ============================================================
          echo FAST-FORWARD LOCAL REPOSITORY
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          echo Synchronization method:
          echo git pull --ff-only origin main
          echo.

          echo IMPORTANT:
          echo - No git reset
          echo - No force checkout
          echo - No clean
          echo - No data deletion
          echo - Fast-forward only
          echo.

          git pull --ff-only origin main

          if errorlevel 1 (
            echo.
            echo [FAIL] Fast-forward synchronization failed.
            echo.
            echo Local repository was NOT force-reset.
            echo Existing data was NOT intentionally deleted.
            exit /b 1
          )

          echo.
          echo [PASS] Local repository synchronized successfully.
          echo.
          echo ============================================================

      # ======================================================
      # 10. VERIFY SYNCHRONIZED COMMIT
      # ======================================================

      - name: Verify synchronized commit
        run: |
          echo ============================================================
          echo VERIFY SYNCHRONIZED COMMIT
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          echo Local HEAD after synchronization:
          git rev-parse HEAD

          echo.
          echo origin/main:
          git rev-parse origin/main

          echo.
          echo GitHub Actions commit:
          echo %GITHUB_SHA%

          echo.

          for /f "delims=" %%i in ('git rev-parse HEAD') do set LOCAL_HEAD=%%i
          for /f "delims=" %%i in ('git rev-parse origin/main') do set ORIGIN_HEAD=%%i

          if /I not "%LOCAL_HEAD%"=="%ORIGIN_HEAD%" (
            echo [FAIL] Local HEAD and origin/main are different.
            exit /b 1
          )

          echo [PASS] Local HEAD matches origin/main.
          echo.
          echo ============================================================

      # ======================================================
      # 11. VERIFY REQUIRED PROJECT FILES
      # ======================================================

      - name: Verify synchronized project files
        run: |
          echo ============================================================
          echo VERIFY SYNCHRONIZED PROJECT FILES
          echo ============================================================
          echo.

          set FILE_ERROR=0

          if exist "%LOCAL_PROJECT%\collector.py" (
            echo [FOUND] collector.py
          ) else (
            echo [MISSING] collector.py
            set FILE_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\validate_collector.py" (
            echo [FOUND] validate_collector.py
          ) else (
            echo [MISSING] validate_collector.py
            set FILE_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\data_history_audit.py" (
            echo [FOUND] data_history_audit.py
          ) else (
            echo [MISSING] data_history_audit.py
            set FILE_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\backfill_history.py" (
            echo [FOUND] backfill_history.py
          ) else (
            echo [MISSING] backfill_history.py
            set FILE_ERROR=1
          )

          echo.

          if "%FILE_ERROR%"=="1" (
            echo [FAIL] One or more required project files are missing.
            exit /b 1
          )

          echo [PASS] All required project files exist.
          echo.
          echo ============================================================

      # ======================================================
      # 12. VERIFY EXISTING OHLCV DIRECTORIES
      # ======================================================

      - name: Verify existing OHLCV directories
        run: |
          echo ============================================================
          echo VERIFY EXISTING OHLCV DIRECTORIES
          echo ============================================================
          echo.

          set DATA_ERROR=0

          if exist "%LOCAL_PROJECT%\data\ohlcv\h1" (
            echo [FOUND] data\ohlcv\h1
          ) else (
            echo [MISSING] data\ohlcv\h1
            set DATA_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\data\ohlcv\h4" (
            echo [FOUND] data\ohlcv\h4
          ) else (
            echo [MISSING] data\ohlcv\h4
            set DATA_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\data\ohlcv\d1" (
            echo [FOUND] data\ohlcv\d1
          ) else (
            echo [MISSING] data\ohlcv\d1
            set DATA_ERROR=1
          )

          echo.

          if "%DATA_ERROR%"=="1" (
            echo [FAIL] One or more OHLCV directories are missing.
            exit /b 1
          )

          echo [PASS] All OHLCV directories still exist.
          echo.
          echo ============================================================

      # ======================================================
      # 13. VERIFY KRW-BTC DATA SURVIVED SYNCHRONIZATION
      # ======================================================

      - name: Verify KRW-BTC OHLCV files
        run: |
          echo ============================================================
          echo VERIFY KRW-BTC OHLCV FILES
          echo ============================================================
          echo.

          set BTC_ERROR=0

          if exist "%LOCAL_PROJECT%\data\ohlcv\h1\KRW-BTC.csv" (
            echo [FOUND] H1 KRW-BTC.csv
          ) else (
            echo [MISSING] H1 KRW-BTC.csv
            set BTC_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\data\ohlcv\h4\KRW-BTC.csv" (
            echo [FOUND] H4 KRW-BTC.csv
          ) else (
            echo [MISSING] H4 KRW-BTC.csv
            set BTC_ERROR=1
          )

          if exist "%LOCAL_PROJECT%\data\ohlcv\d1\KRW-BTC.csv" (
            echo [FOUND] D1 KRW-BTC.csv
          ) else (
            echo [MISSING] D1 KRW-BTC.csv
            set BTC_ERROR=1
          )

          echo.

          if "%BTC_ERROR%"=="1" (
            echo [FAIL] One or more KRW-BTC OHLCV files are missing.
            exit /b 1
          )

          echo [PASS] Existing KRW-BTC data is present.
          echo.
          echo ============================================================

      # ======================================================
      # 14. FINAL GIT STATUS
      # ======================================================

      - name: Show final local Git status
        run: |
          echo ============================================================
          echo FINAL LOCAL GIT STATUS
          echo ============================================================
          echo.

          cd /d "%LOCAL_PROJECT%"

          git status

          echo.
          echo ============================================================

      # ======================================================
      # 15. FINAL RESULT
      # ======================================================

      - name: Synchronization check completed
        run: |
          echo ============================================================
          echo LOCAL REPOSITORY SYNC CHECK COMPLETED
          echo ============================================================
          echo.
          echo [PASS] Local Git repository synchronized with origin/main.
          echo [PASS] Required Python files verified.
          echo [PASS] Existing OHLCV directories verified.
          echo [PASS] Existing KRW-BTC files verified.
          echo.
          echo IMPORTANT:
          echo.
          echo NO backfill was executed.
          echo NO validator was executed.
          echo NO history audit was executed.
          echo NO git reset was executed.
          echo NO git clean was executed.
          echo NO force checkout was executed.
          echo.
          echo Next step:
          echo KRW-BTC BACKFILL EXECUTION TEST
          echo.
          echo ============================================================
