# ============================================================
# Upbit Surge Monitor
# Full KRW History Gap Classification Review Clean V002
#
# File:
#   .github/workflows/review_history_gap_classification_test.yml
#
# Purpose:
#   Test review_history_gap_classification.py - Clean V002
#
# Important:
#   - FULL OHLCV coverage:
#       290 markets
#       870 jobs/files
#
#   - GAP coverage:
#       dynamically derived from data_history_gap_report.py output
#       DO NOT force classifier coverage to 290 / 870
#
# Safety:
#   - READ ONLY source validation
#   - NO OHLCV write
#   - NO OHLCV delete
#   - NO historical repair
#   - NO feature build
#   - NO 256 detector
#   - NO future labels
#   - NO prediction
#   - NO trading
#   - NO git reset
#   - NO git clean
#   - NO git commit
#   - NO git push
#
# Runner:
#   Self-hosted Windows
#
# Resume:
#   Persistent runtime files under data/ are preserved locally.
# ============================================================

name: Full KRW History Gap Classification Review Clean V002


# ============================================================
# 1. TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. JOB
# ============================================================

jobs:

  review-history-gap-classification:

    name: Full KRW History Gap Classification Review Clean V002

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120


    # ========================================================
    # 4. DEFAULTS
    # ========================================================

    defaults:
      run:
        shell: powershell


    # ========================================================
    # 5. STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Synchronize local repository
      #
      # IMPORTANT:
      # We intentionally DO NOT use:
      #
      #   git reset --hard
      #   git clean -fd
      #
      # because persistent runtime/checkpoint files under
      # data/ must survive between executions.
      # ======================================================

      - name: Synchronize local repository

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE LOCAL REPOSITORY"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Repository:"
          Write-Host $env:GITHUB_WORKSPACE

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Current branch:"
          git branch --show-current

          Write-Host ""
          Write-Host "Fetch origin/main..."

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {
              throw "git fetch origin main failed."
          }

          Write-Host ""
          Write-Host "Fast-forward local main..."

          git merge --ff-only origin/main

          if ($LASTEXITCODE -ne 0) {
              throw "git merge --ff-only origin/main failed."
          }

          Write-Host ""
          Write-Host "[PASS] Repository synchronized."
          Write-Host ""
          Write-Host "[SAFETY] git reset --hard was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."


      # ======================================================
      # STEP 2
      # Verify Python
      # ======================================================

      - name: Verify Python

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Python launcher verified."


      # ======================================================
      # STEP 3
      # Verify required Python package
      # ======================================================

      - name: Verify pandas

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PANDAS"
          Write-Host "============================================================"

          py -c "import pandas; print('pandas:', pandas.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "pandas is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] pandas verified."


      # ======================================================
      # STEP 4
      # Verify required project files
      # ======================================================

      - name: Verify required project files

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED PROJECT FILES"
          Write-Host "============================================================"

          $requiredFiles = @(
              "review_history_gap_classification.py",
              "classify_history_gaps.py",
              "data_history_gap_report.py"
          )

          foreach ($file in $requiredFiles) {

              if (-not (Test-Path $file -PathType Leaf)) {

                  throw "Required project file missing: $file"
              }

              Write-Host "[PASS] $file"
          }

          Write-Host ""
          Write-Host "[PASS] Required project files verified."


      # ======================================================
      # STEP 5
      # Verify OHLCV directories
      # ======================================================

      - name: Verify OHLCV directories

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($directory in $directories) {

              if (-not (Test-Path $directory -PathType Container)) {

                  throw "Required OHLCV directory missing: $directory"
              }

              Write-Host "[PASS] $directory"
          }

          Write-Host ""
          Write-Host "[PASS] OHLCV directories verified."


      # ======================================================
      # STEP 6
      # Verify FULL OHLCV coverage
      #
      # IMPORTANT:
      # This verifies the complete local source dataset.
      #
      # It does NOT verify classifier counts.
      #
      # Expected:
      #   h1 = 290
      #   h4 = 290
      #   d1 = 290
      #   TOTAL = 870
      # ======================================================

      - name: Verify full 290 market OHLCV set

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY FULL 290 MARKET OHLCV SET"
          Write-Host "============================================================"

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $expectedPerTimeframe = 290
          $expectedTotal = 870

          $total = 0

          foreach ($timeframe in $timeframes) {

              $directory = "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -Path $directory `
                      -Filter "KRW-*.csv" `
                      -File
              )

              $count = $files.Count

              Write-Host ""
              Write-Host "$timeframe : $count files"

              if ($count -ne $expectedPerTimeframe) {

                  throw (
                      "OHLCV coverage mismatch for " +
                      "$timeframe. expected=" +
                      "$expectedPerTimeframe found=$count"
                  )
              }

              $total += $count
          }

          Write-Host ""
          Write-Host "TOTAL : $total files"

          if ($total -ne $expectedTotal) {

              throw (
                  "Total OHLCV coverage mismatch. " +
                  "expected=$expectedTotal found=$total"
              )
          }

          Write-Host ""
          Write-Host "[PASS] 290 markets verified for h1."
          Write-Host "[PASS] 290 markets verified for h4."
          Write-Host "[PASS] 290 markets verified for d1."
          Write-Host "[PASS] 870 OHLCV source files verified."


      # ======================================================
      # STEP 7
      # Record OHLCV SHA256 BEFORE review
      #
      # We hash every source OHLCV file.
      #
      # This manifest is stored OUTSIDE the repository so it
      # does not affect Git safety checks or runtime outputs.
      # ======================================================

      - name: Record OHLCV SHA256 before review

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE REVIEW"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_ohlcv_before.sha256"

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw (
                  "Expected 870 OHLCV files before hashing. " +
                  "found=$($files.Count)"
              )
          }

          $rows = @()

          foreach ($file in $files) {

              $relative = [System.IO.Path]::GetRelativePath(
                  $env:GITHUB_WORKSPACE,
                  $file.FullName
              )

              $hash = (
                  Get-FileHash `
                      -Path $file.FullName `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"
          }

          $rows |
              Set-Content `
                  -Path $manifest `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Manifest:"
          Write-Host $manifest

          Write-Host ""
          Write-Host "Files hashed: $($files.Count)"

          Write-Host ""
          Write-Host "[PASS] OHLCV SHA256 BEFORE recorded."


      # ======================================================
      # STEP 8
      # Record classifier/gap-report SHA256 BEFORE review
      #
      # V002 dynamically discovers these source files itself.
      # Therefore this step records all likely source CSVs
      # rather than hard-coding the previous 290/870 classifier
      # assumption.
      # ======================================================

      - name: Record review source SHA256 before review

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECORD REVIEW SOURCE SHA256 BEFORE"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_sources_before.sha256"

          $candidateFiles = @()

          if (Test-Path "data") {

              $candidateFiles += @(
                  Get-ChildItem `
                      -Path "data" `
                      -Filter "*.csv" `
                      -File `
                      -Recurse |
                  Where-Object {

                      $_.FullName -notmatch `
                          "[\\/]ohlcv[\\/]" -and

                      (
                          $_.Name -match `
                              "classification" -or

                          $_.Name -match `
                              "classifier" -or

                          $_.Name -match `
                              "classified.*gap" -or

                          $_.Name -match `
                              "gap.*report"
                      )
                  }
              )
          }

          $candidateFiles = @(
              $candidateFiles |
              Sort-Object FullName -Unique
          )

          if ($candidateFiles.Count -eq 0) {

              throw (
                  "No classifier/gap-report source CSV " +
                  "candidates were found."
              )
          }

          $rows = @()

          foreach ($file in $candidateFiles) {

              $relative = [System.IO.Path]::GetRelativePath(
                  $env:GITHUB_WORKSPACE,
                  $file.FullName
              )

              $hash = (
                  Get-FileHash `
                      -Path $file.FullName `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"

              Write-Host "[SOURCE] $relative"
          }

          $rows |
              Set-Content `
                  -Path $manifest `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Source candidates: $($candidateFiles.Count)"

          Write-Host ""
          Write-Host "[PASS] Review source SHA256 BEFORE recorded."


      # ======================================================
      # STEP 9
      # Inspect persistent checkpoint
      #
      # This is informational.
      #
      # Existing compatible checkpoint:
      #   -> V002 resumes
      #
      # Missing/incompatible checkpoint:
      #   -> V002 safely rebuilds runtime checkpoint
      # ======================================================

      - name: Inspect persistent review checkpoint

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "INSPECT PERSISTENT REVIEW CHECKPOINT"
          Write-Host "============================================================"

          $checkpoint = `
              "data\validation\review_history_gap_classification_checkpoint.json"

          if (Test-Path $checkpoint -PathType Leaf) {

              Write-Host ""
              Write-Host "[INFO] Existing checkpoint found:"
              Write-Host $checkpoint

              $item = Get-Item $checkpoint

              Write-Host ""
              Write-Host "Size:"
              Write-Host $item.Length

              Write-Host ""
              Write-Host "Last write:"
              Write-Host $item.LastWriteTime
          }
          else {

              Write-Host ""
              Write-Host "[INFO] No existing checkpoint found."
              Write-Host "[INFO] Clean V002 will create one."
          }

          Write-Host ""
          Write-Host "[PASS] Checkpoint inspection completed."


      # ======================================================
      # STEP 10
      # Run Clean V002
      #
      # CRITICAL V002 CHANGE:
      #
      # OLD V001:
      #   --expected-markets 290
      #   --expected-jobs 870
      #
      # NEW V002:
      #   --expected-full-markets 290
      #   --expected-full-jobs 870
      #
      # These apply ONLY to FULL OHLCV coverage.
      #
      # Classifier/gap counts are dynamically derived.
      # ======================================================

      - name: Run Full KRW History Gap Classification Review Clean V002

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RUN FULL KRW HISTORY GAP CLASSIFICATION REVIEW CLEAN V002"
          Write-Host "============================================================"

          py review_history_gap_classification.py `
              --expected-full-markets 290 `
              --expected-full-jobs 870 `
              --checkpoint-every 10

          if ($LASTEXITCODE -ne 0) {

              throw (
                  "review_history_gap_classification.py " +
                  "failed with exit code " +
                  "$LASTEXITCODE."
              )
          }

          Write-Host ""
          Write-Host "[PASS] Clean V002 review completed."


      # ======================================================
      # STEP 11
      # Verify required V002 outputs
      # ======================================================

      - name: Verify Clean V002 output files

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY CLEAN V002 OUTPUT FILES"
          Write-Host "============================================================"

          $requiredOutputs = @(
              "data\validation\review_history_gap_classification_checkpoint.json",
              "data\review_history_gap_classification_status.csv",
              "data\reports\history_gap_classification_review_summary.csv",
              "data\reports\history_gap_classification_review_detail.csv",
              "data\reports\history_gap_structural.csv",
              "data\reports\history_gap_manual_review.csv",
              "data\recovery\history_gap_recovery_targets.csv",
              "data\recovery\history_gap_recovery_plan.json"
          )

          foreach ($file in $requiredOutputs) {

              if (-not (Test-Path $file -PathType Leaf)) {

                  throw "Required V002 output missing: $file"
              }

              $item = Get-Item $file

              Write-Host (
                  "[PASS] " +
                  "$file | " +
                  "$($item.Length) bytes"
              )
          }

          Write-Host ""
          Write-Host "[PASS] Clean V002 output files verified."


      # ======================================================
      # STEP 12
      # Verify V002 status
      # ======================================================

      - name: Verify Clean V002 status

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY CLEAN V002 STATUS"
          Write-Host "============================================================"

          py -c "import pandas as pd; p=r'data/review_history_gap_classification_status.csv'; d=pd.read_csv(p); assert len(d)==1, f'Expected 1 status row, found {len(d)}'; r=d.iloc[0]; assert str(r['result']).strip().upper()=='PASSED', f'Unexpected result: {r['result']}'; assert int(r['full_ohlcv_markets'])==290, f'Unexpected full markets: {r['full_ohlcv_markets']}'; assert int(r['full_ohlcv_jobs'])==870, f'Unexpected full jobs: {r['full_ohlcv_jobs']}'; assert int(r['gap_markets'])>0, 'gap_markets must be > 0'; assert int(r['gap_jobs'])>0, 'gap_jobs must be > 0'; assert int(r['classification_rows'])>0, 'classification_rows must be > 0'; print(d.to_string(index=False))"

          if ($LASTEXITCODE -ne 0) {

              throw "Clean V002 status validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] V002 status verified."


      # ======================================================
      # STEP 13
      # Verify recovery plan JSON
      # ======================================================

      - name: Verify recovery plan

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RECOVERY PLAN"
          Write-Host "============================================================"

          py -c "import json; from pathlib import Path; p=Path(r'data/recovery/history_gap_recovery_plan.json'); d=json.loads(p.read_text(encoding='utf-8')); assert int(d['plan_version'])==2, f'Unexpected plan version: {d['plan_version']}'; assert int(d['full_ohlcv_coverage']['markets'])==290; assert int(d['full_ohlcv_coverage']['jobs'])==870; assert int(d['gap_coverage']['markets'])>0; assert int(d['gap_coverage']['jobs'])>0; assert int(d['gap_coverage']['events'])>0; assert d['safety']['ohlcv_write']=='DISABLED'; assert d['safety']['ohlcv_delete']=='DISABLED'; assert d['safety']['gap_repair']=='DISABLED'; assert d['safety']['trading']=='DISABLED'; print(json.dumps(d, indent=2, ensure_ascii=True))"

          if ($LASTEXITCODE -ne 0) {

              throw "Recovery plan validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Recovery plan verified."


      # ======================================================
      # STEP 14
      # Verify checkpoint completeness
      #
      # IMPORTANT:
      # Completed checkpoint jobs must equal the dynamic
      # GAP job count, NOT 870.
      # ======================================================

      - name: Verify dynamic checkpoint completeness

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY DYNAMIC CHECKPOINT COMPLETENESS"
          Write-Host "============================================================"

          py -c "import json, pandas as pd; from pathlib import Path; cp=json.loads(Path(r'data/validation/review_history_gap_classification_checkpoint.json').read_text(encoding='utf-8')); st=pd.read_csv(r'data/review_history_gap_classification_status.csv').iloc[0]; completed=cp.get('completed_jobs',{}); expected=int(st['gap_jobs']); assert isinstance(completed,dict), 'completed_jobs is not a dictionary'; assert len(completed)==expected, f'Checkpoint mismatch: expected {expected}, found {len(completed)}'; assert all(bool(v.get('completed')) for v in completed.values()), 'Incomplete checkpoint entry detected'; print('Dynamic gap jobs :', expected); print('Completed jobs   :', len(completed))"

          if ($LASTEXITCODE -ne 0) {

              throw "Dynamic checkpoint completeness validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Dynamic checkpoint completeness verified."


      # ======================================================
      # STEP 15
      # Verify Resume behavior
      #
      # Run V002 again.
      #
      # Compatible checkpoint should allow the existing
      # gap jobs to be resumed rather than reprocessed.
      # ======================================================

      - name: Verify Resume behavior

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RESUME BEHAVIOR"
          Write-Host "============================================================"

          py review_history_gap_classification.py `
              --expected-full-markets 290 `
              --expected-full-jobs 870 `
              --checkpoint-every 10

          if ($LASTEXITCODE -ne 0) {

              throw (
                  "Resume execution failed with exit code " +
                  "$LASTEXITCODE."
              )
          }

          py -c "import pandas as pd; d=pd.read_csv(r'data/review_history_gap_classification_status.csv'); r=d.iloc[0]; gap_jobs=int(r['gap_jobs']); resumed=int(r['resumed_jobs']); processed=int(r['processed_jobs']); assert resumed==gap_jobs, f'Expected resumed_jobs={gap_jobs}, found {resumed}'; assert processed==0, f'Expected processed_jobs=0 on second identical run, found {processed}'; print('Gap jobs       :', gap_jobs); print('Resumed jobs   :', resumed); print('Processed jobs :', processed)"

          if ($LASTEXITCODE -ne 0) {

              throw "Resume behavior validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Persistent Resume verified."


      # ======================================================
      # STEP 16
      # Verify OHLCV SHA256 AFTER review
      # ======================================================

      - name: Verify all OHLCV files remained unchanged

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY ALL OHLCV FILES REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeManifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_ohlcv_before.sha256"

          if (-not (Test-Path $beforeManifest -PathType Leaf)) {

              throw "OHLCV BEFORE manifest missing."
          }

          $afterManifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_ohlcv_after.sha256"

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw (
                  "Expected 870 OHLCV files after review. " +
                  "found=$($files.Count)"
              )
          }

          $rows = @()

          foreach ($file in $files) {

              $relative = [System.IO.Path]::GetRelativePath(
                  $env:GITHUB_WORKSPACE,
                  $file.FullName
              )

              $hash = (
                  Get-FileHash `
                      -Path $file.FullName `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"
          }

          $rows |
              Set-Content `
                  -Path $afterManifest `
                  -Encoding UTF8

          $before = Get-Content $beforeManifest
          $after = Get-Content $afterManifest

          $difference = Compare-Object `
              -ReferenceObject $before `
              -DifferenceObject $after

          if ($null -ne $difference) {

              Write-Host ""
              Write-Host "OHLCV SHA256 differences:"
              $difference | Format-Table -AutoSize

              throw "OHLCV source files changed during review."
          }

          Write-Host ""
          Write-Host "[PASS] All 870 OHLCV source files remained unchanged."


      # ======================================================
      # STEP 17
      # Verify source classifier/gap files remained unchanged
      #
      # Runtime outputs created by V002 are excluded from the
      # AFTER candidate set.
      # ======================================================

      - name: Verify classifier and gap sources remained unchanged

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY CLASSIFIER AND GAP SOURCES REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeManifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_sources_before.sha256"

          if (-not (Test-Path $beforeManifest -PathType Leaf)) {

              throw "Review source BEFORE manifest missing."
          }

          $beforeRows = @(
              Get-Content $beforeManifest
          )

          foreach ($row in $beforeRows) {

              if ([string]::IsNullOrWhiteSpace($row)) {
                  continue
              }

              $parts = $row -split "`t", 2

              if ($parts.Count -ne 2) {

                  throw "Invalid source manifest row: $row"
              }

              $expectedHash = $parts[0].Trim()
              $relativePath = $parts[1].Trim()

              $fullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $relativePath

              if (-not (Test-Path $fullPath -PathType Leaf)) {

                  throw (
                      "Source file disappeared during review: " +
                      "$relativePath"
                  )
              }

              $actualHash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($actualHash -ne $expectedHash) {

                  throw (
                      "Source file changed during review: " +
                      "$relativePath"
                  )
              }

              Write-Host "[UNCHANGED] $relativePath"
          }

          Write-Host ""
          Write-Host "[PASS] Pre-existing classifier/gap sources remained unchanged."


      # ======================================================
      # STEP 18
      # Verify Git safety
      #
      # Runtime files under data/ are expected to be ignored.
      #
      # No tracked source file should be modified by review.
      # ======================================================

      - name: Verify final Git safety

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"

          $trackedChanges = @(
              git diff --name-only
          )

          if ($LASTEXITCODE -ne 0) {

              throw "git diff --name-only failed."
          }

          if ($trackedChanges.Count -gt 0) {

              Write-Host ""
              Write-Host "Tracked changes detected:"

              $trackedChanges |
                  ForEach-Object {
                      Write-Host "  $_"
                  }

              throw (
                  "Review created or modified " +
                  "Git-visible tracked files."
              )
          }

          Write-Host ""
          Write-Host "[PASS] No tracked Git changes detected."

          Write-Host ""
          Write-Host "[SAFETY] git reset was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."
          Write-Host "[SAFETY] git commit was NOT executed."
          Write-Host "[SAFETY] git push was NOT executed."


      # ======================================================
      # STEP 19
      # Final summary
      # ======================================================

      - name: Full History Gap Classification Review summary

        if: always()

        run: |

          Set-Location $env:GITHUB_WORKSPACE

