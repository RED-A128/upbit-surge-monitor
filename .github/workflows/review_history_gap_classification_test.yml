# ============================================================
# Upbit Surge Monitor
# review_history_gap_classification_test.yml
# Clean V003
#
# Target:
#   review_history_gap_classification.py - Clean V002
#
# Purpose:
#   - Verify full KRW OHLCV source coverage
#   - Run History Gap Classification Review
#   - Verify dynamic GAP coverage
#   - Verify recovery plan
#   - Verify persistent Resume
#   - Verify OHLCV/source integrity
#   - Verify Git safety
#
# Full OHLCV:
#   290 markets
#   3 timeframes
#   870 source files/jobs
#
# IMPORTANT:
#   290 / 870 applies ONLY to the full OHLCV source set.
#
#   Gap classification/review coverage is dynamic.
#   It MUST NOT be forced to 290 / 870.
#
# Clean V003 changes:
#   - Workflow display name = workflow filename
#   - Windows PowerShell 5.1 compatible
#   - Removed System.IO.Path.GetRelativePath()
#   - Runtime manifests stored in RUNNER_TEMP
#   - Safer Python verification blocks
#   - Persistent Resume verification
#
# Safety:
#   - NO OHLCV write
#   - NO OHLCV delete
#   - NO historical repair
#   - NO feature build
#   - NO detector execution
#   - NO future labels
#   - NO prediction
#   - NO trading
#   - NO git reset
#   - NO git clean
#   - NO git commit
#   - NO git push
# ============================================================


name: review_history_gap_classification_test.yml


# ============================================================
# TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOB
# ============================================================

jobs:

  review-history-gap-classification:

    name: review_history_gap_classification_test.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120


    defaults:
      run:
        shell: powershell


    steps:


      # ======================================================
      # STEP 1
      # Synchronize repository
      #
      # IMPORTANT:
      #   git reset --hard : NOT USED
      #   git clean        : NOT USED
      #
      # Persistent runtime/checkpoint files under data/
      # must survive between workflow executions.
      # ======================================================

      - name: Synchronize local repository

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE LOCAL REPOSITORY"
          Write-Host "============================================================"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Current branch:"
          git branch --show-current

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to determine current Git branch."
          }

          Write-Host ""
          Write-Host "Fetching origin/main..."

          git fetch origin main

          if ($LASTEXITCODE -ne 0) {
              throw "git fetch origin main failed."
          }

          Write-Host ""
          Write-Host "Fast-forwarding local branch..."

          git merge --ff-only origin/main

          if ($LASTEXITCODE -ne 0) {
              throw "git merge --ff-only origin/main failed."
          }

          Write-Host ""
          Write-Host "[PASS] Repository synchronized."

          Write-Host ""
          Write-Host "[SAFETY] git reset was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."


      # ======================================================
      # STEP 2
      # Verify Python
      # ======================================================

      - name: Verify Python

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Python launcher verified."


      # ======================================================
      # STEP 3
      # Verify pandas
      # ======================================================

      - name: Verify pandas

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PANDAS"
          Write-Host "============================================================"

          py -c "import pandas as pd; print('pandas:', pd.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "pandas is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] pandas verified."


      # ======================================================
      # STEP 4
      # Verify required project files
      # ======================================================

      - name: Verify required project files

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED PROJECT FILES"
          Write-Host "============================================================"

          $requiredFiles = @(
              "review_history_gap_classification.py",
              "classify_history_gaps.py",
              "data_history_gap_report.py"
          )

          foreach ($file in $requiredFiles) {

              if (-not (Test-Path $file -PathType Leaf)) {
                  throw "Required project file missing: $file"
              }

              Write-Host "[PASS] $file"
          }

          Write-Host ""
          Write-Host "[PASS] Required project files verified."


      # ======================================================
      # STEP 5
      # Verify OHLCV directories
      # ======================================================

      - name: Verify OHLCV directories

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($directory in $directories) {

              if (-not (Test-Path $directory -PathType Container)) {
                  throw "Required OHLCV directory missing: $directory"
              }

              Write-Host "[PASS] $directory"
          }

          Write-Host ""
          Write-Host "[PASS] OHLCV directories verified."


      # ======================================================
      # STEP 6
      # Verify full OHLCV coverage
      #
      # Expected:
      #   h1 = 290
      #   h4 = 290
      #   d1 = 290
      #
      # Total:
      #   870 files
      # ======================================================

      - name: Verify full 290 market OHLCV set

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY FULL 290 MARKET OHLCV SET"
          Write-Host "============================================================"

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $expectedPerTimeframe = 290
          $expectedTotal = 870

          $total = 0

          foreach ($timeframe in $timeframes) {

              $directory = "data\ohlcv\$timeframe"

              $files = @(
                  Get-ChildItem `
                      -Path $directory `
                      -Filter "KRW-*.csv" `
                      -File
              )

              $count = $files.Count

              Write-Host ""
              Write-Host "$timeframe : $count files"

              if ($count -ne $expectedPerTimeframe) {

                  throw (
                      "OHLCV coverage mismatch for " +
                      "$timeframe. expected=" +
                      "$expectedPerTimeframe found=$count"
                  )
              }

              $total += $count
          }

          Write-Host ""
          Write-Host "Total OHLCV files : $total"

          if ($total -ne $expectedTotal) {

              throw (
                  "Total OHLCV coverage mismatch. " +
                  "expected=$expectedTotal found=$total"
              )
          }

          Write-Host ""
          Write-Host "[PASS] h1 : 290 files verified."
          Write-Host "[PASS] h4 : 290 files verified."
          Write-Host "[PASS] d1 : 290 files verified."
          Write-Host "[PASS] Total 870 OHLCV files verified."


      # ======================================================
      # STEP 7
      # Record OHLCV SHA256 BEFORE review
      #
      # Clean V003:
      #
      # DO NOT USE:
      #
      #   [System.IO.Path]::GetRelativePath()
      #
      # because Windows PowerShell 5.1 / older .NET
      # environments may not support it.
      #
      # Instead:
      #
      #   Resolve workspace
      #   Remove workspace prefix using Substring()
      # ======================================================

      - name: Record OHLCV SHA256 before review

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE REVIEW"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_ohlcv_before.sha256"

          $workspacePath = (
              Resolve-Path $env:GITHUB_WORKSPACE
          ).Path.TrimEnd('\')

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw (
                  "Expected 870 OHLCV files before hashing. " +
                  "found=$($files.Count)"
              )
          }

          $rows = @()

          foreach ($file in $files) {

              $fullPath = $file.FullName

              if (-not $fullPath.StartsWith(
                  $workspacePath,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {

                  throw (
                      "OHLCV file is outside workspace: " +
                      $fullPath
                  )
              }

              $relative = $fullPath.Substring(
                  $workspacePath.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"
          }

          $rows |
              Set-Content `
                  -Path $manifest `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Manifest:"
          Write-Host $manifest

          Write-Host ""
          Write-Host "Files hashed : $($files.Count)"

          Write-Host ""
          Write-Host "[PASS] OHLCV SHA256 BEFORE recorded."


      # ======================================================
      # STEP 8
      # Record classifier / gap source SHA256 BEFORE review
      #
      # Only PRE-EXISTING source files are recorded.
      #
      # This allows us to verify later that the review did not
      # alter classifier/gap-report source data.
      # ======================================================

      - name: Record review source SHA256 before review

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RECORD REVIEW SOURCE SHA256 BEFORE"
          Write-Host "============================================================"

          $manifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_sources_before.sha256"

          $workspacePath = (
              Resolve-Path $env:GITHUB_WORKSPACE
          ).Path.TrimEnd('\')

          $candidateFiles = @()

          if (Test-Path "data" -PathType Container) {

              $candidateFiles = @(
                  Get-ChildItem `
                      -Path "data" `
                      -Filter "*.csv" `
                      -File `
                      -Recurse |
                  Where-Object {

                      $full = $_.FullName

                      $isOHLCV = (
                          $full -match "[\\/]ohlcv[\\/]"
                      )

                      $isReviewOutput = (
                          $_.Name -match "^history_gap_classification_review_" -or
                          $_.Name -eq "review_history_gap_classification_status.csv"
                      )

                      $isSource = (
                          $_.Name -match "classification" -or
                          $_.Name -match "classifier" -or
                          $_.Name -match "classified.*gap" -or
                          $_.Name -match "gap.*report"
                      )

                      (-not $isOHLCV) -and
                      (-not $isReviewOutput) -and
                      $isSource
                  } |
                  Sort-Object FullName -Unique
              )
          }

          if ($candidateFiles.Count -eq 0) {

              throw (
                  "No classifier/gap-report source CSV " +
                  "candidates were found."
              )
          }

          $rows = @()

          foreach ($file in $candidateFiles) {

              $fullPath = $file.FullName

              if (-not $fullPath.StartsWith(
                  $workspacePath,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {

                  throw (
                      "Source file is outside workspace: " +
                      $fullPath
                  )
              }

              $relative = $fullPath.Substring(
                  $workspacePath.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"

              Write-Host "[SOURCE] $relative"
          }

          $rows |
              Set-Content `
                  -Path $manifest `
                  -Encoding UTF8

          Write-Host ""
          Write-Host "Source candidates : $($candidateFiles.Count)"

          Write-Host ""
          Write-Host "[PASS] Review source SHA256 BEFORE recorded."


      # ======================================================
      # STEP 9
      # Inspect persistent checkpoint
      #
      # Existing checkpoint is NOT deleted.
      # ======================================================

      - name: Inspect persistent review checkpoint

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "INSPECT PERSISTENT REVIEW CHECKPOINT"
          Write-Host "============================================================"

          $checkpoint = `
              "data\validation\review_history_gap_classification_checkpoint.json"

          if (Test-Path $checkpoint -PathType Leaf) {

              $item = Get-Item $checkpoint

              Write-Host ""
              Write-Host "[INFO] Existing checkpoint found."
              Write-Host "Path       : $checkpoint"
              Write-Host "Size       : $($item.Length) bytes"
              Write-Host "Last write : $($item.LastWriteTime)"
          }
          else {

              Write-Host ""
              Write-Host "[INFO] No existing checkpoint found."
              Write-Host "[INFO] Clean V002 Python review will create it."
          }

          Write-Host ""
          Write-Host "[PASS] Checkpoint inspection completed."


      # ======================================================
      # STEP 10
      # Run Review Clean V002
      #
      # IMPORTANT:
      #
      # 290 / 870 = FULL OHLCV SOURCE
      #
      # Gap markets/jobs are dynamically derived.
      # ======================================================

      - name: Run History Gap Classification Review Clean V002

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "RUN HISTORY GAP CLASSIFICATION REVIEW CLEAN V002"
          Write-Host "============================================================"

          py review_history_gap_classification.py `
              --expected-full-markets 290 `
              --expected-full-jobs 870 `
              --checkpoint-every 10

          if ($LASTEXITCODE -ne 0) {

              throw (
                  "review_history_gap_classification.py " +
                  "failed with exit code " +
                  "$LASTEXITCODE."
              )
          }

          Write-Host ""
          Write-Host "[PASS] History Gap Classification Review completed."


      # ======================================================
      # STEP 11
      # Verify expected output files
      # ======================================================

      - name: Verify review output files

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY REVIEW OUTPUT FILES"
          Write-Host "============================================================"

          $requiredOutputs = @(
              "data\validation\review_history_gap_classification_checkpoint.json",
              "data\review_history_gap_classification_status.csv",
              "data\reports\history_gap_classification_review_summary.csv",
              "data\reports\history_gap_classification_review_detail.csv",
              "data\reports\history_gap_structural.csv",
              "data\reports\history_gap_manual_review.csv",
              "data\recovery\history_gap_recovery_targets.csv",
              "data\recovery\history_gap_recovery_plan.json"
          )

          foreach ($file in $requiredOutputs) {

              if (-not (Test-Path $file -PathType Leaf)) {
                  throw "Required review output missing: $file"
              }

              $item = Get-Item $file

              Write-Host (
                  "[PASS] " +
                  $file +
                  " | " +
                  $item.Length +
                  " bytes"
              )
          }

          Write-Host ""
          Write-Host "[PASS] Review output files verified."


      # ======================================================
      # STEP 12
      # Verify status CSV
      #
      # Use a PowerShell here-string to avoid quoting problems
      # with long Python -c commands.
      # ======================================================

      - name: Verify review status CSV

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY REVIEW STATUS CSV"
          Write-Host "============================================================"

          $pythonCode = @'
          import pandas as pd

          path = r"data/review_history_gap_classification_status.csv"

          df = pd.read_csv(path)

          if len(df) != 1:
              raise RuntimeError(
                  f"Expected exactly 1 status row. Found: {len(df)}"
              )

          row = df.iloc[0]

          result = str(row["result"]).strip().upper()

          if result != "PASSED":
              raise RuntimeError(
                  f"Unexpected review result: {result}"
              )

          full_markets = int(row["full_ohlcv_markets"])
          full_jobs = int(row["full_ohlcv_jobs"])

          gap_markets = int(row["gap_markets"])
          gap_jobs = int(row["gap_jobs"])

          classification_rows = int(row["classification_rows"])

          if full_markets != 290:
              raise RuntimeError(
                  f"Expected full_ohlcv_markets=290. Found: {full_markets}"
              )

          if full_jobs != 870:
              raise RuntimeError(
                  f"Expected full_ohlcv_jobs=870. Found: {full_jobs}"
              )

          if gap_markets <= 0:
              raise RuntimeError(
                  f"gap_markets must be > 0. Found: {gap_markets}"
              )

          if gap_jobs <= 0:
              raise RuntimeError(
                  f"gap_jobs must be > 0. Found: {gap_jobs}"
              )

          if classification_rows <= 0:
              raise RuntimeError(
                  "classification_rows must be > 0. "
                  f"Found: {classification_rows}"
              )

          print()
          print("Review status")
          print("-------------")
          print(f"Result              : {result}")
          print(f"Full OHLCV markets  : {full_markets}")
          print(f"Full OHLCV jobs     : {full_jobs}")
          print(f"Gap markets         : {gap_markets}")
          print(f"Gap jobs            : {gap_jobs}")
          print(f"Classification rows : {classification_rows}")
          '@

          $tempPython = Join-Path `
              $env:RUNNER_TEMP `
              "verify_review_status.py"

          $pythonCode |
              Set-Content `
                  -Path $tempPython `
                  -Encoding UTF8

          py $tempPython

          if ($LASTEXITCODE -ne 0) {
              throw "Review status CSV validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Review status CSV verified."


      # ======================================================
      # STEP 13
      # Verify recovery plan JSON
      # ======================================================

      - name: Verify recovery plan

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RECOVERY PLAN"
          Write-Host "============================================================"

          $pythonCode = @'
          import json
          from pathlib import Path

          path = Path(
              r"data/recovery/history_gap_recovery_plan.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          plan_version = int(data["plan_version"])

          if plan_version != 2:
              raise RuntimeError(
                  f"Expected plan_version=2. Found: {plan_version}"
              )

          full = data["full_ohlcv_coverage"]
          gap = data["gap_coverage"]
          safety = data["safety"]

          full_markets = int(full["markets"])
          full_jobs = int(full["jobs"])

          gap_markets = int(gap["markets"])
          gap_jobs = int(gap["jobs"])
          gap_events = int(gap["events"])

          if full_markets != 290:
              raise RuntimeError(
                  f"Expected full markets=290. Found: {full_markets}"
              )

          if full_jobs != 870:
              raise RuntimeError(
                  f"Expected full jobs=870. Found: {full_jobs}"
              )

          if gap_markets <= 0:
              raise RuntimeError(
                  f"gap markets must be > 0. Found: {gap_markets}"
              )

          if gap_jobs <= 0:
              raise RuntimeError(
                  f"gap jobs must be > 0. Found: {gap_jobs}"
              )

          if gap_events <= 0:
              raise RuntimeError(
                  f"gap events must be > 0. Found: {gap_events}"
              )

          expected_safety = {
              "ohlcv_write": "DISABLED",
              "ohlcv_delete": "DISABLED",
              "gap_repair": "DISABLED",
              "trading": "DISABLED",
          }

          for key, expected in expected_safety.items():

              actual = str(safety.get(key, "")).strip().upper()

              if actual != expected:
                  raise RuntimeError(
                      f"Unexpected safety flag {key}: {actual}"
                  )

          print()
          print("Recovery plan")
          print("-------------")
          print(f"Plan version : {plan_version}")
          print(f"Full markets : {full_markets}")
          print(f"Full jobs    : {full_jobs}")
          print(f"Gap markets  : {gap_markets}")
          print(f"Gap jobs     : {gap_jobs}")
          print(f"Gap events   : {gap_events}")
          '@

          $tempPython = Join-Path `
              $env:RUNNER_TEMP `
              "verify_recovery_plan.py"

          $pythonCode |
              Set-Content `
                  -Path $tempPython `
                  -Encoding UTF8

          py $tempPython

          if ($LASTEXITCODE -ne 0) {
              throw "Recovery plan validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Recovery plan verified."


      # ======================================================
      # STEP 14
      # Verify dynamic checkpoint completeness
      #
      # IMPORTANT:
      #
      # completed checkpoint jobs
      #
      # MUST equal:
      #
      #   dynamic gap_jobs
      #
      # NOT:
      #
      #   870
      # ======================================================

      - name: Verify dynamic checkpoint completeness

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY DYNAMIC CHECKPOINT COMPLETENESS"
          Write-Host "============================================================"

          $pythonCode = @'
          import json
          from pathlib import Path

          import pandas as pd

          checkpoint_path = Path(
              r"data/validation/review_history_gap_classification_checkpoint.json"
          )

          status_path = Path(
              r"data/review_history_gap_classification_status.csv"
          )

          checkpoint = json.loads(
              checkpoint_path.read_text(encoding="utf-8")
          )

          status = pd.read_csv(status_path).iloc[0]

          expected = int(status["gap_jobs"])

          completed = checkpoint.get(
              "completed_jobs",
              {}
          )

          if not isinstance(completed, dict):
              raise RuntimeError(
                  "checkpoint completed_jobs must be a dictionary."
              )

          actual = len(completed)

          if actual != expected:
              raise RuntimeError(
                  "Checkpoint job count mismatch. "
                  f"expected={expected}, found={actual}"
              )

          incomplete = []

          for key, value in completed.items():

              if not isinstance(value, dict):
                  incomplete.append(key)
                  continue

              if not bool(value.get("completed")):
                  incomplete.append(key)

          if incomplete:
              raise RuntimeError(
                  "Incomplete checkpoint entries detected: "
                  + ", ".join(incomplete[:20])
              )

          print()
          print("Checkpoint")
          print("----------")
          print(f"Expected gap jobs : {expected}")
          print(f"Completed jobs    : {actual}")
          '@

          $tempPython = Join-Path `
              $env:RUNNER_TEMP `
              "verify_review_checkpoint.py"

          $pythonCode |
              Set-Content `
                  -Path $tempPython `
                  -Encoding UTF8

          py $tempPython

          if ($LASTEXITCODE -ne 0) {
              throw "Dynamic checkpoint validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Dynamic checkpoint completeness verified."


      # ======================================================
      # STEP 15
      # Verify Resume behavior
      #
      # Run the exact same review again.
      #
      # Expected:
      #
      #   resumed_jobs   = gap_jobs
      #   processed_jobs = 0
      #
      # This proves interruption-safe persistent Resume.
      # ======================================================

      - name: Verify Resume behavior

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RESUME BEHAVIOR"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Running second identical review..."

          py review_history_gap_classification.py `
              --expected-full-markets 290 `
              --expected-full-jobs 870 `
              --checkpoint-every 10

          if ($LASTEXITCODE -ne 0) {

              throw (
                  "Resume execution failed with exit code " +
                  "$LASTEXITCODE."
              )
          }

          $pythonCode = @'
          import pandas as pd

          path = r"data/review_history_gap_classification_status.csv"

          df = pd.read_csv(path)

          if len(df) != 1:
              raise RuntimeError(
                  f"Expected exactly 1 status row. Found: {len(df)}"
              )

          row = df.iloc[0]

          gap_jobs = int(row["gap_jobs"])
          resumed_jobs = int(row["resumed_jobs"])
          processed_jobs = int(row["processed_jobs"])

          if resumed_jobs != gap_jobs:
              raise RuntimeError(
                  "Resume mismatch. "
                  f"gap_jobs={gap_jobs}, "
                  f"resumed_jobs={resumed_jobs}"
              )

          if processed_jobs != 0:
              raise RuntimeError(
                  "Second identical run should process zero jobs. "
                  f"processed_jobs={processed_jobs}"
              )

          print()
          print("Resume")
          print("------")
          print(f"Gap jobs       : {gap_jobs}")
          print(f"Resumed jobs   : {resumed_jobs}")
          print(f"Processed jobs : {processed_jobs}")
          '@

          $tempPython = Join-Path `
              $env:RUNNER_TEMP `
              "verify_review_resume.py"

          $pythonCode |
              Set-Content `
                  -Path $tempPython `
                  -Encoding UTF8

          py $tempPython

          if ($LASTEXITCODE -ne 0) {
              throw "Resume behavior validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Persistent Resume verified."


      # ======================================================
      # STEP 16
      # Verify OHLCV SHA256 AFTER review
      #
      # Clean V003:
      # PowerShell 5.1 compatible.
      # ======================================================

      - name: Verify all OHLCV files remained unchanged

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY ALL OHLCV FILES REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeManifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_ohlcv_before.sha256"

          if (-not (Test-Path $beforeManifest -PathType Leaf)) {
              throw "OHLCV BEFORE manifest missing."
          }

          $afterManifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_ohlcv_after.sha256"

          $workspacePath = (
              Resolve-Path $env:GITHUB_WORKSPACE
          ).Path.TrimEnd('\')

          $files = @(
              Get-ChildItem `
                  -Path "data\ohlcv" `
                  -Filter "KRW-*.csv" `
                  -File `
                  -Recurse |
              Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw (
                  "Expected 870 OHLCV files after review. " +
                  "found=$($files.Count)"
              )
          }

          $rows = @()

          foreach ($file in $files) {

              $fullPath = $file.FullName

              if (-not $fullPath.StartsWith(
                  $workspacePath,
                  [System.StringComparison]::OrdinalIgnoreCase
              )) {

                  throw (
                      "OHLCV file is outside workspace: " +
                      $fullPath
                  )
              }

              $relative = $fullPath.Substring(
                  $workspacePath.Length
              ).TrimStart('\')

              $hash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              $rows += "$hash`t$relative"
          }

          $rows |
              Set-Content `
                  -Path $afterManifest `
                  -Encoding UTF8

          $before = @(
              Get-Content $beforeManifest
          )

          $after = @(
              Get-Content $afterManifest
          )

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV SHA256 differences:"
              Write-Host ""

              $difference |
                  Format-Table -AutoSize

              throw "OHLCV source files changed during review."
          }

          Write-Host ""
          Write-Host "[PASS] All 870 OHLCV source files remained unchanged."


      # ======================================================
      # STEP 17
      # Verify classifier / gap source files remained unchanged
      #
      # We compare only the files that existed BEFORE review.
      # ======================================================

      - name: Verify classifier and gap sources remained unchanged

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY CLASSIFIER AND GAP SOURCES REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforeManifest = Join-Path `
              $env:RUNNER_TEMP `
              "review_history_gap_sources_before.sha256"

          if (-not (Test-Path $beforeManifest -PathType Leaf)) {
              throw "Review source BEFORE manifest missing."
          }

          $beforeRows = @(
              Get-Content $beforeManifest
          )

          $checked = 0

          foreach ($row in $beforeRows) {

              if ([string]::IsNullOrWhiteSpace($row)) {
                  continue
              }

              $parts = $row -split "`t", 2

              if ($parts.Count -ne 2) {
                  throw "Invalid source manifest row: $row"
              }

              $expectedHash = $parts[0].Trim()
              $relativePath = $parts[1].Trim()

              $fullPath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $relativePath

              if (-not (Test-Path $fullPath -PathType Leaf)) {

                  throw (
                      "Source file disappeared during review: " +
                      $relativePath
                  )
              }

              $actualHash = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($actualHash -ne $expectedHash) {

                  throw (
                      "Source file changed during review: " +
                      $relativePath
                  )
              }

              $checked += 1

              Write-Host "[UNCHANGED] $relativePath"
          }

          if ($checked -eq 0) {
              throw "No source files were checked."
          }

          Write-Host ""
          Write-Host "Source files checked : $checked"

          Write-Host ""
          Write-Host "[PASS] Classifier/gap sources remained unchanged."


      # ======================================================
      # STEP 18
      # Verify runtime outputs are Git ignored
      #
      # Runtime outputs may exist locally and persist between
      # executions, but they must not pollute Git status.
      # ======================================================

      - name: Verify runtime files are Git ignored

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "VERIFY RUNTIME FILES ARE GIT IGNORED"
          Write-Host "============================================================"

          $runtimeFiles = @(
              "data\validation\review_history_gap_classification_checkpoint.json",
              "data\review_history_gap_classification_status.csv",
              "data\reports\history_gap_classification_review_summary.csv",
              "data\reports\history_gap_classification_review_detail.csv",
              "data\reports\history_gap_structural.csv",
              "data\reports\history_gap_manual_review.csv",
              "data\recovery\history_gap_recovery_targets.csv",
              "data\recovery\history_gap_recovery_plan.json"
          )

          foreach ($file in $runtimeFiles) {

              if (-not (Test-Path $file -PathType Leaf)) {
                  throw "Expected runtime file missing: $file"
              }

              git check-ignore -q -- $file

              if ($LASTEXITCODE -ne 0) {

                  throw (
                      "Runtime file is NOT ignored by Git: " +
                      $file
                  )
              }

              Write-Host "[IGNORED] $file"
          }

          Write-Host ""
          Write-Host "[PASS] Review runtime files are Git ignored."


      # ======================================================
      # STEP 19
      # Final Git safety
      #
      # No tracked source file may be changed by this workflow.
      #
      # NOTE:
      # Runtime files under data/ are expected to be ignored.
      # ======================================================

      - name: Verify final Git safety

        run: |

          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"

          $trackedChanges = @(
              git diff --name-only
          )

          if ($LASTEXITCODE -ne 0) {
              throw "git diff --name-only failed."
          }

          if ($trackedChanges.Count -gt 0) {

              Write-Host ""
              Write-Host "Tracked changes detected:"
              Write-Host ""

              foreach ($change in $trackedChanges) {
                  Write-Host "  $change"
              }

              throw (
                  "Review created or modified tracked Git files."
              )
          }

          Write-Host ""
          Write-Host "[PASS] No tracked Git changes detected."

          Write-Host ""
          Write-Host "[SAFETY] git reset was NOT executed."
          Write-Host "[SAFETY] git clean was NOT executed."
          Write-Host "[SAFETY] git commit was NOT executed."
          Write-Host "[SAFETY] git push was NOT executed."


      # ======================================================
      # STEP 20
      # Summary
      # ======================================================

      - name: Review summary

        if: always()

        run: |

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "HISTORY GAP CLASSIFICATION REVIEW CLEAN V003 SUMMARY"
          Write-Host "============================================================"

          $status = `
              "data\review_history_gap_classification_status.csv"

          if (Test-Path $status -PathType Leaf) {

              Write-Host ""
              Write-Host "Status CSV:"
              Write-Host "-----------"

              Get-Content $status
          }
          else {

              Write-Host ""
              Write-Host "[INFO] Review status CSV not available."
          }

          $summary = `
              "data\reports\history_gap_classification_review_summary.csv"

          if (Test-Path $summary -PathType Leaf) {

              Write-Host ""
              Write-Host "Review summary:"
              Write-Host "---------------"

              Get-Content $summary
          }
          else {

              Write-Host ""
              Write-Host "[INFO] Review summary CSV not available."
          }

          $plan = `
              "data\recovery\history_gap_recovery_plan.json"

          if (Test-Path $plan -PathType Leaf) {

              Write-Host ""
              Write-Host "Recovery plan:"
              Write-Host "--------------"

              Get-Content $plan
          }
          else {

              Write-Host ""
              Write-Host "[INFO] Recovery plan JSON not available."
          }

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 21
      # Final success
      # ======================================================

      - name: review_history_gap_classification_test.yml completed

        if: success()

        run: |

          Write-Host "============================================================"
          Write-Host "[RESULT] review_history_gap_classification_test.yml PASSED"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "[PASS] Full 290-market OHLCV coverage verified."
          Write-Host "[PASS] Full 870-file OHLCV coverage verified."
          Write-Host "[PASS] Gap coverage dynamically verified."
          Write-Host "[PASS] Review outputs verified."
          Write-Host "[PASS] Recovery plan verified."
          Write-Host "[PASS] Dynamic checkpoint verified."
          Write-Host "[PASS] Persistent Resume verified."
          Write-Host "[PASS] OHLCV SHA256 remained unchanged."
          Write-Host "[PASS] Classifier/gap sources remained unchanged."
          Write-Host "[PASS] Runtime files are Git ignored."
          Write-Host "[PASS] No tracked Git source changes detected."

          Write-Host ""
          Write-Host "Safety:"
          Write-Host "  OHLCV write    : DISABLED"
          Write-Host "  OHLCV delete   : DISABLED"
          Write-Host "  Gap repair     : DISABLED"
          Write-Host "  Feature build  : DISABLED"
          Write-Host "  256 Detector   : DISABLED"
          Write-Host "  Future labels  : DISABLED"
          Write-Host "  Prediction     : DISABLED"
          Write-Host "  Trading        : DISABLED"
          Write-Host "  Git reset      : DISABLED"
          Write-Host "  Git clean      : DISABLED"
          Write-Host "  Git commit     : DISABLED"
          Write-Host "  Git push       : DISABLED"

          Write-Host ""
          Write-Host "[NEXT] Review recovery classification results."
          Write-Host "[NEXT] Then proceed toward actual historical gap recovery."
          Write-Host "============================================================"
