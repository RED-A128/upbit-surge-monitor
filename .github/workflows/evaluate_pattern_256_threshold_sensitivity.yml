
name: evaluate_pattern_256_threshold_sensitivity.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-threshold-sensitivity
  cancel-in-progress: false

jobs:
  threshold-sensitivity:
    name: threshold-sensitivity

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SCRIPT_NAME: evaluate_pattern_256_threshold_sensitivity.py
      OUTPUT_RELATIVE: data/reports/pattern_256_threshold_sensitivity
      EXPECTED_VERSION: Clean V003-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and source files
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python script not found: $script"
          }

          $inputDir = Join-Path `
            $env:PROJECT_ROOT `
            "data/reports/pattern_256_candidate_reliability"

          $files = @(
            "candidate_reliability_markets.csv",
            "candidate_reliability_summary.csv",
            "candidate_reliability_result.json",
            "candidate_reliability_manifest.json"
          )

          foreach ($file in $files) {
            $path = Join-Path $inputDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source: $path"
            }
          }

          Write-Host "[PASS] Script and source files found"

      - name: Run threshold sensitivity audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Threshold sensitivity audit failed"
          }

      - name: Verify result and SHA256 integrity
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os

          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          output = root / os.environ["OUTPUT_RELATIVE"]
          version = os.environ["EXPECTED_VERSION"]

          def sha256(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(chunk)

              return digest.hexdigest()

          def read_json(name):
              return json.loads(
                  (output / name).read_text(
                      encoding="utf-8"
                  )
              )

          def read_csv(name):
              with (output / name).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:
                  return list(csv.DictReader(handle))

          result = read_json(
              "threshold_sensitivity_result.json"
          )

          manifest = read_json(
              "threshold_sensitivity_manifest.json"
          )

          if result.get("version") != version:
              raise SystemExit("Result version mismatch")

          if manifest.get("version") != version:
              raise SystemExit("Manifest version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Execution not PASS")

          if result.get("overall_decision") != "HOLD":
              raise SystemExit("Decision mismatch")

          if result.get("market_count") != 209:
              raise SystemExit("Market count mismatch")

          if result.get("original_candidate_count") != 22:
              raise SystemExit("Candidate count mismatch")

          if result.get("sample_thresholds") != [
              100, 200, 500
          ]:
              raise SystemExit("Sample thresholds mismatch")

          if result.get("improvement_thresholds_pp") != [
              0.0, 0.25, 0.5, 1.0
          ]:
              raise SystemExit("Improvement thresholds mismatch")

          for flag in (
              "independent_oos_proven",
              "statistical_independence_proven",
              "causal_improvement_proven",
              "profitability_proven",
              "approved_for_live_trading",
          ):
              if result.get(flag) is not False:
                  raise SystemExit(
                      "Unsafe approval flag: " + flag
                  )

          expected_files = {
              "threshold_sensitivity_grid.csv",
              "threshold_sensitivity_markets.csv",
              "threshold_sensitivity_result.json",
          }

          hashes = manifest.get("output_sha256")

          if not isinstance(hashes, dict):
              raise SystemExit("Missing output hashes")

          if set(hashes) != expected_files:
              raise SystemExit("Output file set mismatch")

          for filename in sorted(expected_files):
              path = output / filename

              if not path.is_file():
                  raise SystemExit(
                      "Missing output: " + filename
                  )

              if sha256(path) != hashes[filename]:
                  raise SystemExit(
                      "SHA256 mismatch: " + filename
                  )

              print("[PASS] SHA256:", filename)

          grid = read_csv(
              "threshold_sensitivity_grid.csv"
          )

          markets = read_csv(
              "threshold_sensitivity_markets.csv"
          )

          if len(grid) != 12:
              raise SystemExit("Grid row count mismatch")

          if len(markets) != 209:
              raise SystemExit("Market row count mismatch")

          if len({
              row["market"] for row in markets
          }) != 209:
              raise SystemExit("Duplicate market")

          expected_pairs = {
              (n, threshold)
              for n in (100, 200, 500)
              for threshold in (0.0, 0.25, 0.5, 1.0)
          }

          actual_pairs = {
              (
                  int(row["minimum_observations"]),
                  float(
                      row["minimum_each_year_improvement_pp"]
                  ),
              )
              for row in grid
          }

          if actual_pairs != expected_pairs:
              raise SystemExit("Threshold grid mismatch")

          original = [
              row for row in markets
              if row["previous_classification"]
              == "RESEARCH_CANDIDATE"
          ]

          if len(original) != 22:
              raise SystemExit("Original candidate mismatch")

          for row in grid:
              sample = int(
                  row["minimum_observations"]
              )

              threshold = float(
                  row["minimum_each_year_improvement_pp"]
              )

              expected = sum(
                  int(market["minimum_observations"]) >= sample
                  and float(
                      market["year_2025_difference_pp"]
                  ) > threshold
                  and float(
                      market["year_2026_difference_pp"]
                  ) > threshold
                  for market in markets
              )

              if int(row["eligible_markets"]) != expected:
                  raise SystemExit(
                      "Grid count mismatch: "
                      + str((sample, threshold))
                  )

              if int(
                  row["retained_from_original_22"]
              ) != expected:
                  raise SystemExit(
                      "Retention mismatch: "
                      + str((sample, threshold))
                  )

              if row["decision"] != "HOLD":
                  raise SystemExit("Unsafe grid decision")

          strict = sum(
              int(row["minimum_observations"]) >= 200
              and float(
                  row["year_2025_difference_pp"]
              ) > 0.5
              and float(
                  row["year_2026_difference_pp"]
              ) > 0.5
              for row in markets
          )

          if strict != result.get("strict_200_05_count"):
              raise SystemExit("Strict count mismatch")

          if any(
              row["approved_for_live_trading"].lower()
              != "false"
              for row in markets
          ):
              raise SystemExit("Unsafe market approval")

          print("[PASS] Clean V003-13")
          print("[PASS] Threshold sensitivity")
          print("[PASS] SHA256 integrity")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Output verification failed"
          }

      - name: Upload threshold sensitivity results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-threshold-sensitivity-v003-13
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_threshold_sensitivity/threshold_sensitivity_grid.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_threshold_sensitivity/threshold_sensitivity_markets.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_threshold_sensitivity/threshold_sensitivity_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_threshold_sensitivity/threshold_sensitivity_manifest.json
          if-no-files-found: error
          retention-days: 14
