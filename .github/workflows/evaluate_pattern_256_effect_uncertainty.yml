name: evaluate_pattern_256_effect_uncertainty.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-effect-uncertainty
  cancel-in-progress: false

jobs:
  effect-uncertainty:
    name: effect-uncertainty

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python validation failed"
          }

      - name: Validate analysis script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_effect_uncertainty.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing analysis script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          Write-Host "PASS: Python syntax"

      - name: Validate source reports
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_stability_gate"

          foreach ($file in @(
            "regime_stability_comparison.csv",
            "regime_stability_result.json",
            "regime_stability_manifest.json"
          )) {
            $path = Join-Path $sourceDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source file: $path"
            }

            Write-Host "FOUND: $path"
          }

      - name: Run effect uncertainty audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_effect_uncertainty.py"

          py $script `
            --root "$env:DATA_ROOT" `
            --min-events 30

          if ($LASTEXITCODE -ne 0) {
            throw "Effect uncertainty audit failed"
          }

      - name: Verify results and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_stability_gate"

          $outputDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_effect_uncertainty"

          $csvPath = Join-Path `
            $outputDir `
            "effect_uncertainty_comparison.csv"

          $resultPath = Join-Path `
            $outputDir `
            "effect_uncertainty_result.json"

          $manifestPath = Join-Path `
            $outputDir `
            "effect_uncertainty_manifest.json"

          foreach ($path in @(
            $csvPath,
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Result version mismatch"
          }

          if ($manifest.version -ne "Clean V001") {
            throw "Manifest version mismatch"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Execution status is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.comparison_rows -ne 27) {
            throw "Unexpected comparison count"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Trading safety check failed"
          }

          if ($result.statistical_independence_proven -ne $false) {
            throw "Unexpected independence proof"
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Unexpected OOS proof"
          }

          if ($result.profitability_proven -ne $false) {
            throw "Unexpected profitability proof"
          }

          foreach ($file in @(
            "effect_uncertainty_comparison.csv",
            "effect_uncertainty_result.json"
          )) {
            $path = Join-Path $outputDir $file

            $property = `
              $manifest.output_sha256.PSObject.Properties[$file]

            if ($null -eq $property) {
              throw "Missing output SHA256: $file"
            }

            $expected = (
              [string]$property.Value
            ).Trim().ToLowerInvariant()

            if ($expected -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid output SHA256: $file"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $file"
            }

            Write-Host "PASS: output SHA256 - $file"
          }

          foreach ($file in @(
            "regime_stability_comparison.csv",
            "regime_stability_result.json",
            "regime_stability_manifest.json"
          )) {
            $path = Join-Path $sourceDir $file

            $property = `
              $manifest.input_sha256.PSObject.Properties[$file]

            if ($null -eq $property) {
              throw "Missing input SHA256: $file"
            }

            $expected = (
              [string]$property.Value
            ).Trim().ToLowerInvariant()

            if ($expected -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid input SHA256: $file"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Input SHA256 mismatch: $file"
            }

            Write-Host "PASS: input SHA256 - $file"
          }

          $rows = @(
            Import-Csv -LiteralPath $csvPath
          )

          if ($rows.Count -ne 27) {
            throw "CSV row count mismatch"
          }

          $requiredColumns = @(
            "timeframe",
            "horizon",
            "regime",
            "stability_status",
            "test_only_events",
            "test_only_hits",
            "test_only_hit_rate_pct",
            "test_both_events",
            "test_both_hits",
            "test_both_hit_rate_pct",
            "test_uplift_pp",
            "test_uplift_lower_pp",
            "test_uplift_upper_pp",
            "sample_status",
            "interval_status",
            "research_priority"
          )

          foreach ($column in $requiredColumns) {
            if (
              $null -eq $rows[0].PSObject.Properties[$column]
            ) {
              throw "Missing CSV column: $column"
            }
          }

          $validPriorities = @(
            "INSUFFICIENT_DATA",
            "INVESTIGATE_REVERSAL",
            "REVIEW_OTHER",
            "EVENT_LEVEL_VALIDATION_CANDIDATE",
            "UNCERTAINTY_REMAINS"
          )

          foreach ($row in $rows) {
            if ($row.research_priority -notin $validPriorities) {
              throw "Invalid research priority"
            }
          }

          Write-Host "PASS: result structure"
          Write-Host "PASS: input SHA256"
          Write-Host "PASS: output SHA256"
          Write-Host "PASS: comparison rows"
          Write-Host "PASS: research safety"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_effect_uncertainty\effect_uncertainty_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $priority = $result.priority_counts
          $interval = $result.interval_status_counts

          function Get-Count {
            param(
              $Object,
              [string]$Name
            )

            $property = $Object.PSObject.Properties[$Name]

            if ($null -eq $property) {
              return 0
            }

            return [int]$property.Value
          }

          $candidates = Get-Count `
            $priority `
            "EVENT_LEVEL_VALIDATION_CANDIDATE"

          $reversals = Get-Count `
            $priority `
            "INVESTIGATE_REVERSAL"

          $insufficient = Get-Count `
            $priority `
            "INSUFFICIENT_DATA"

          $uncertain = Get-Count `
            $priority `
            "UNCERTAINTY_REMAINS"

          $positive = Get-Count `
            $interval `
            "EXPLORATORY_POSITIVE"

          $crossesZero = Get-Count `
            $interval `
            "CROSSES_ZERO"

          @"
          # Pattern 256 Effect Size and Uncertainty Audit

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Version | $($result.version) |
          | Source rows | $($result.source_rows) |
          | Comparison rows | $($result.comparison_rows) |
          | Event-level validation candidates | $candidates |
          | Direction reversal investigations | $reversals |
          | Insufficient data | $insufficient |
          | Uncertainty remains | $uncertain |
          | Exploratory positive intervals | $positive |
          | Intervals crossing zero | $crossesZero |
          | Research decision | $($result.research_decision) |
          | Statistical independence proven | $($result.statistical_independence_proven) |
          | Independent OOS proven | $($result.independent_oos_proven) |
          | Profitability proven | $($result.profitability_proven) |
          | Live trading approved | $($result.approved_for_live_trading) |
          | Input SHA256 | Verified |
          | Output SHA256 | Verified |

          ## Limitations

          - Confidence intervals are exploratory only.
          - Aggregated signal events may overlap.
          - Independence assumptions have not been established.
          - No profitability or causal proof.
          - No automated trading.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-effect-uncertainty-v001
          path: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_effect_uncertainty\'
          if-no-files-found: warn
          retention-days: 30
