          )

          if ($LASTEXITCODE -ne 0) {

              throw "git status failed."
          }

          $visible = @(
              $status |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($visible.Count -gt 0) {

              Write-Host "Git-visible changes detected:"

              foreach ($line in $visible) {

