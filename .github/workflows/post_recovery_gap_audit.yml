# ============================================================
# Upbit Surge Monitor
# post_recovery_gap_audit.yml
# Clean V003
# ============================================================
#
# PURPOSE
# ------------------------------------------------------------
# Run a fresh historical gap audit AFTER actual gap recovery
# and persist the result as an independent POST-recovery
# snapshot for analyze_post_recovery_gaps.py.
#
# Clean V003 fixes the handoff problem discovered after:
#
#   recover_history_gaps_repair.yml
#       -> post_recovery_gap_audit.yml
#       -> analyze_post_recovery_gaps_test.yml
#
# IMPORTANT
# ------------------------------------------------------------
#
# PRE source:
#
#   data/reports/history_gap/
#
# POST snapshot:
#
#   data/reports/post_recovery_gap_audit/
#
# Required POST files:
#
#   data_history_gap_report.csv
#   data_history_gap_summary.csv
#
# SAFETY
# ------------------------------------------------------------
#
# This workflow:
#
#   - DOES NOT repair gaps
#   - DOES NOT download candles
#   - DOES NOT delete OHLCV
#   - DOES NOT modify OHLCV
#   - DOES NOT build features
#   - DOES NOT run detector
#   - DOES NOT run prediction
#   - DOES NOT trade
#   - DOES NOT git reset
#   - DOES NOT git clean
#   - DOES NOT git commit
#   - DOES NOT git push
#
# ============================================================


name: post_recovery_gap_audit.yml


# ============================================================
# 1. TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. CONCURRENCY
# ============================================================

concurrency:
  group: post-recovery-gap-audit
  cancel-in-progress: false


# ============================================================
# 4. JOB
# ============================================================

jobs:

  post_recovery_gap_audit:

    name: post_recovery_gap_audit.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180


    # ========================================================
    # 5. STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Checkout source
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          clean: false
          fetch-depth: 1


      # ======================================================
      # STEP 2
      # Show execution information
      # ======================================================

      - name: Show execution information

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "POST RECOVERY GAP AUDIT"
          Write-Host "Clean V003"
          Write-Host "============================================================"

          Write-Host ""

          Write-Host "Workflow:"
          Write-Host "  post_recovery_gap_audit.yml"

          Write-Host ""

          Write-Host "Execution:"
          Write-Host "  Mode              : READ ONLY OHLCV AUDIT"
          Write-Host "  Runner            : $env:RUNNER_NAME"
          Write-Host "  Workspace         : $env:GITHUB_WORKSPACE"

          Write-Host ""

          Write-Host "Expected:"
          Write-Host "  Markets           : 290"
          Write-Host "  Timeframes        : 3"
          Write-Host "  OHLCV files       : 870"

          Write-Host ""

          Write-Host "POST output:"
          Write-Host "  data/reports/post_recovery_gap_audit/"

          Write-Host ""

          Write-Host "Required POST files:"
          Write-Host "  data_history_gap_report.csv"
          Write-Host "  data_history_gap_summary.csv"

          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  OHLCV write       : DISABLED"
          Write-Host "  OHLCV delete      : DISABLED"
          Write-Host "  Gap repair        : DISABLED"
          Write-Host "  API download      : DISABLED"
          Write-Host "  Feature build     : DISABLED"
          Write-Host "  Detector          : DISABLED"
          Write-Host "  Prediction        : DISABLED"
          Write-Host "  Trading           : DISABLED"
          Write-Host "  Git reset         : DISABLED"
          Write-Host "  Git clean         : DISABLED"
          Write-Host "  Git commit        : DISABLED"
          Write-Host "  Git push          : DISABLED"

          Write-Host "============================================================"


      # ======================================================
      # STEP 3
      # Verify required Python source
      # ======================================================

      - name: Verify required source files

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED SOURCE FILES"
          Write-Host "============================================================"

          $required = @(
              "data_history_gap_report.py"
          )

          foreach ($file in $required) {

              if (-not (Test-Path $file)) {

                  throw "Required source file not found: $file"
              }

              Write-Host "[PASS] $file"
          }

          Write-Host "============================================================"


      # ======================================================
      # STEP 4
      # Verify OHLCV directories
      # ======================================================

      - name: Verify OHLCV directories

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV DIRECTORIES"
          Write-Host "============================================================"

          $directories = @(
              "data/ohlcv/h1",
              "data/ohlcv/h4",
              "data/ohlcv/d1"
          )

          foreach ($dir in $directories) {

              if (-not (Test-Path $dir)) {

                  throw "Required OHLCV directory not found: $dir"
              }

              Write-Host "[PASS] $dir"
          }

          Write-Host "============================================================"


      # ======================================================
      # STEP 5
      # Verify full 290 x 3 OHLCV inventory
      # ======================================================

      - name: Verify full 290 market OHLCV set

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY FULL OHLCV INVENTORY"
          Write-Host "============================================================"

          $h1 = @(
              Get-ChildItem `
                  "data/ohlcv/h1" `
                  -Filter "KRW-*.csv" `
                  -File
          ).Count

          $h4 = @(
              Get-ChildItem `
                  "data/ohlcv/h4" `
                  -Filter "KRW-*.csv" `
                  -File
          ).Count

          $d1 = @(
              Get-ChildItem `
                  "data/ohlcv/d1" `
                  -Filter "KRW-*.csv" `
                  -File
          ).Count

          $total = $h1 + $h4 + $d1

          Write-Host "H1 files : $h1"
          Write-Host "H4 files : $h4"
          Write-Host "D1 files : $d1"
          Write-Host "Total    : $total"

          if ($h1 -ne 290) {

              throw "H1 OHLCV count mismatch. expected=290 found=$h1"
          }

          if ($h4 -ne 290) {

              throw "H4 OHLCV count mismatch. expected=290 found=$h4"
          }

          if ($d1 -ne 290) {

              throw "D1 OHLCV count mismatch. expected=290 found=$d1"
          }

          if ($total -ne 870) {

              throw "Total OHLCV count mismatch. expected=870 found=$total"
          }

          Write-Host ""
          Write-Host "[PASS] 290 markets verified for H1."
          Write-Host "[PASS] 290 markets verified for H4."
          Write-Host "[PASS] 290 markets verified for D1."
          Write-Host "[PASS] 870 OHLCV files verified."

          Write-Host "============================================================"


      # ======================================================
      # STEP 6
      # Record OHLCV SHA256 BEFORE audit
      #
      # Windows PowerShell 5.1 compatible.
      # Do NOT use [System.IO.Path]::GetRelativePath().
      # ======================================================

      - name: Record OHLCV SHA256 before audit

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE AUDIT"
          Write-Host "============================================================"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path "data/validation" `
              | Out-Null

          $root = (Resolve-Path ".").Path

          $records = @()

          $files = Get-ChildItem `
              "data/ohlcv" `
              -Recurse `
              -Filter "*.csv" `
              -File `
              | Sort-Object FullName

          foreach ($file in $files) {

              $fullPath = $file.FullName

              if ($fullPath.StartsWith($root)) {

                  $relative = $fullPath.Substring($root.Length)

                  $relative = $relative.TrimStart(
                      [System.IO.Path]::DirectorySeparatorChar,
                      [System.IO.Path]::AltDirectorySeparatorChar
                  )

              }
              else {

                  $relative = $fullPath
              }

              $relative = $relative.Replace("\", "/")

              $hash = (
                  Get-FileHash `
                      -Algorithm SHA256 `
                      -Path $fullPath
              ).Hash

              $records += [PSCustomObject]@{
                  path   = $relative
                  sha256 = $hash
              }
          }

          if ($records.Count -ne 870) {

              throw "Unable to record all OHLCV hashes. expected=870 found=$($records.Count)"
          }

          $records |
              Export-Csv `
                  "data/validation/post_recovery_audit_ohlcv_before.csv" `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "[PASS] OHLCV hashes recorded: $($records.Count)"

          Write-Host "============================================================"


      # ======================================================
      # STEP 7
      # Prepare clean POST snapshot directory
      #
      # IMPORTANT:
      # Only generated POST report directory is cleared.
      # OHLCV is NEVER touched.
      # ======================================================

      - name: Prepare POST recovery audit directory

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PREPARE POST RECOVERY AUDIT DIRECTORY"
          Write-Host "============================================================"

          $postDir = "data/reports/post_recovery_gap_audit"

          if (Test-Path $postDir) {

              Remove-Item `
                  "$postDir/*" `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue
          }
          else {

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path $postDir `
                  | Out-Null
          }

          Write-Host "[PASS] POST audit directory prepared."
          Write-Host "       $postDir"

          Write-Host "============================================================"


      # ======================================================
      # STEP 8
      # Record PRE source report timestamps
      #
      # This lets us identify which history-gap files were
      # freshly regenerated by data_history_gap_report.py.
      # ======================================================

      - name: Record gap report state before scan

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD GAP REPORT STATE BEFORE SCAN"
          Write-Host "============================================================"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path "data/validation" `
              | Out-Null

          $sourceDir = "data/reports/history_gap"

          $records = @()

          if (Test-Path $sourceDir) {

              $files = Get-ChildItem `
                  $sourceDir `
                  -Filter "*.csv" `
                  -File

              foreach ($file in $files) {

                  $records += [PSCustomObject]@{
                      name             = $file.Name
                      full_name        = $file.FullName
                      length           = $file.Length
                      last_write_ticks = $file.LastWriteTimeUtc.Ticks
                      sha256           = (
                          Get-FileHash `
                              -Algorithm SHA256 `
                              -Path $file.FullName
                      ).Hash
                  }
              }
          }

          $records |
              Export-Csv `
                  "data/validation/post_recovery_gap_source_before.csv" `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "Existing history-gap CSV files: $($records.Count)"

          foreach ($record in $records) {

              Write-Host "  $($record.name)"
          }

          Write-Host "============================================================"


      # ======================================================
      # STEP 9
      # Run fresh POST-recovery gap scan
      #
      # data_history_gap_report.py remains responsible for
      # scanning all 870 OHLCV files.
      # ======================================================

      - name: Run post-recovery gap report

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RUN POST-RECOVERY GAP REPORT"
          Write-Host "============================================================"

          py data_history_gap_report.py

          if ($LASTEXITCODE -ne 0) {

              throw "data_history_gap_report.py failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[PASS] Fresh post-recovery gap scan completed."

          Write-Host "============================================================"


      # ======================================================
      # STEP 10
      # Verify expected source outputs exist
      #
      # Current data_history_gap_report.py produces files in:
      #
      #   data/reports/history_gap/
      #
      # Clean V003 then snapshots those freshly calculated
      # results into the dedicated POST directory.
      # ======================================================

      - name: Verify fresh gap report outputs

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY FRESH GAP REPORT OUTPUTS"
          Write-Host "============================================================"

          $sourceDir = "data/reports/history_gap"

          if (-not (Test-Path $sourceDir)) {

              throw "History gap report directory not found after scan: $sourceDir"
          }

          $csvFiles = @(
              Get-ChildItem `
                  $sourceDir `
                  -Filter "*.csv" `
                  -File
          )

          if ($csvFiles.Count -eq 0) {

              throw "No CSV output found after post-recovery gap scan."
          }

          Write-Host "CSV outputs found: $($csvFiles.Count)"

          foreach ($file in $csvFiles) {

              Write-Host "  $($file.Name)"
          }

          $summaryPath = Join-Path `
              $sourceDir `
              "data_history_gap_summary.csv"

          if (-not (Test-Path $summaryPath)) {

              throw "Required gap summary not found: $summaryPath"
          }

          if ((Get-Item $summaryPath).Length -le 0) {

              throw "Gap summary is empty: $summaryPath"
          }

          Write-Host ""
          Write-Host "[PASS] Fresh gap summary exists."

          Write-Host "============================================================"


      # ======================================================
      # STEP 11
      # Create independent POST snapshot
      #
      # IMPORTANT:
      #
      # We copy the freshly generated reports AFTER the scan.
      #
      # The POST summary filename is fixed:
      #
      #   data_history_gap_summary.csv
      #
      # For detail:
      #   data_history_gap_report.csv is copied when available.
      #
      # If the detail file exists but uses a different schema,
      # it is still preserved as the raw POST detail snapshot.
      # The analyzer can use the validated summary.
      # ======================================================

      - name: Create POST recovery gap snapshot

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "CREATE POST RECOVERY GAP SNAPSHOT"
          Write-Host "============================================================"

          $sourceDir = "data/reports/history_gap"
          $postDir   = "data/reports/post_recovery_gap_audit"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $postDir `
              | Out-Null

          $sourceSummary = Join-Path `
              $sourceDir `
              "data_history_gap_summary.csv"

          $postSummary = Join-Path `
              $postDir `
              "data_history_gap_summary.csv"

          if (-not (Test-Path $sourceSummary)) {

              throw "Source summary not found: $sourceSummary"
          }

          Copy-Item `
              $sourceSummary `
              $postSummary `
              -Force

          Write-Host "[PASS] POST summary snapshot created:"
          Write-Host "       $postSummary"

          $sourceDetail = Join-Path `
              $sourceDir `
              "data_history_gap_report.csv"

          $postDetail = Join-Path `
              $postDir `
              "data_history_gap_report.csv"

          if (Test-Path $sourceDetail) {

              Copy-Item `
                  $sourceDetail `
                  $postDetail `
                  -Force

              Write-Host "[PASS] POST detail snapshot created:"
              Write-Host "       $postDetail"

          }
          else {

              Write-Host "[INFO] data_history_gap_report.csv was not produced."
              Write-Host "[INFO] POST summary remains the validated analyzer input."
          }

          Write-Host "============================================================"


      # ======================================================
      # STEP 12
      # Verify POST summary schema
      #
      # Analyzer V003 requires:
      #
      #   market
      #   timeframe
      #   and at least one gap/missing metric
      #
      # Alias matching here mirrors the analyzer contract.
      # ======================================================

      - name: Verify POST summary schema

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY POST SUMMARY SCHEMA"
          Write-Host "============================================================"

          $postSummary = `
              "data/reports/post_recovery_gap_audit/data_history_gap_summary.csv"

          if (-not (Test-Path $postSummary)) {

              throw "POST summary does not exist: $postSummary"
          }

          if ((Get-Item $postSummary).Length -le 0) {

              throw "POST summary is empty: $postSummary"
          }

          $firstLine = Get-Content `
              $postSummary `
              -First 1

          if ([string]::IsNullOrWhiteSpace($firstLine)) {

              throw "POST summary header is empty."
          }

          $headers = @(
              $firstLine.Split(",") |
              ForEach-Object {
                  $_.Trim().Trim('"').ToLower().Replace("-", "_").Replace(" ", "_")
              }
          )

          Write-Host "Headers:"

          foreach ($header in $headers) {

              Write-Host "  $header"
          }

          $marketAliases = @(
              "market",
              "ticker",
              "symbol",
              "code"
          )

          $timeframeAliases = @(
              "timeframe",
              "interval",
              "tf",
              "unit"
          )

          $gapAliases = @(
              "gap_count",
              "gaps",
              "gap_events",
              "gap_event_count",
              "total_gaps",
              "total_gap_count"
          )

          $missingAliases = @(
              "missing_count",
              "missing",
              "missing_est",
              "missing_estimate",
              "estimated_missing",
              "missing_candles",
              "missing_candle_count"
          )

          $hasMarket = $false

          foreach ($alias in $marketAliases) {

              if ($headers -contains $alias) {

                  $hasMarket = $true
                  break
              }
          }

          $hasTimeframe = $false

          foreach ($alias in $timeframeAliases) {

              if ($headers -contains $alias) {

                  $hasTimeframe = $true
                  break
              }
          }

          $hasGapMetric = $false

          foreach ($alias in $gapAliases) {

              if ($headers -contains $alias) {

                  $hasGapMetric = $true
                  break
              }
          }

          if (-not $hasGapMetric) {

              foreach ($alias in $missingAliases) {

                  if ($headers -contains $alias) {

                      $hasGapMetric = $true
                      break
                  }
              }
          }

          if (-not $hasMarket) {

              throw "POST summary schema does not contain a market column."
          }

          if (-not $hasTimeframe) {

              throw "POST summary schema does not contain a timeframe column."
          }

          if (-not $hasGapMetric) {

              throw "POST summary schema does not contain a gap/missing metric."
          }

          Write-Host ""
          Write-Host "[PASS] POST report schema verified."

          Write-Host "============================================================"


      # ======================================================
      # STEP 13
      # Verify POST report is independently stored
      #
      # This checks the PATH contract.
      #
      # PRE:
      #   data/reports/history_gap/...
      #
      # POST:
      #   data/reports/post_recovery_gap_audit/...
      #
      # Same content is allowed when recovery did not change
      # a particular aggregate result.
      #
      # Same physical path is NOT allowed.
      # ======================================================

      - name: Verify POST report separation

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY POST REPORT SEPARATION"
          Write-Host "============================================================"

          $pre = (
              Resolve-Path `
                  "data/reports/history_gap/data_history_gap_summary.csv"
          ).Path

          $post = (
              Resolve-Path `
                  "data/reports/post_recovery_gap_audit/data_history_gap_summary.csv"
          ).Path

          Write-Host "PRE  : $pre"
          Write-Host "POST : $post"

          if ($pre -eq $post) {

              throw "PRE and POST reports resolve to the same physical path."
          }

          Write-Host ""
          Write-Host "[PASS] PRE and POST report paths are independent."

          $preHash = (
              Get-FileHash `
                  -Algorithm SHA256 `
                  -Path $pre
          ).Hash

          $postHash = (
              Get-FileHash `
                  -Algorithm SHA256 `
                  -Path $post
          ).Hash

          Write-Host "PRE SHA256  : $preHash"
          Write-Host "POST SHA256 : $postHash"

          Write-Host ""
          Write-Host "[INFO] Matching hashes are allowed."
          Write-Host "[INFO] The POST snapshot represents the fresh scan result."

          Write-Host "============================================================"


      # ======================================================
      # STEP 14
      # Verify POST snapshot row count
      # ======================================================

      - name: Verify POST summary rows

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY POST SUMMARY ROWS"
          Write-Host "============================================================"

          $postSummary = `
              "data/reports/post_recovery_gap_audit/data_history_gap_summary.csv"

          $rows = @(
              Import-Csv $postSummary
          )

          Write-Host "POST summary rows : $($rows.Count)"

          if ($rows.Count -le 0) {

              throw "POST summary contains zero data rows."
          }

          Write-Host ""
          Write-Host "[PASS] POST summary contains data rows."

          Write-Host "============================================================"


      # ======================================================
      # STEP 15
      # Verify OHLCV remained unchanged
      # ======================================================

      - name: Verify OHLCV remained unchanged

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV REMAINED UNCHANGED"
          Write-Host "============================================================"

          $beforePath = `
              "data/validation/post_recovery_audit_ohlcv_before.csv"

          if (-not (Test-Path $beforePath)) {

              throw "OHLCV before-hash file not found: $beforePath"
          }

          $beforeRows = @(
              Import-Csv $beforePath
          )

          if ($beforeRows.Count -ne 870) {

              throw "Before-hash count mismatch. expected=870 found=$($beforeRows.Count)"
          }

          $before = @{}

          foreach ($row in $beforeRows) {

              $before[$row.path] = $row.sha256
          }

          $root = (Resolve-Path ".").Path

          $files = @(
              Get-ChildItem `
                  "data/ohlcv" `
                  -Recurse `
                  -Filter "*.csv" `
                  -File `
                  | Sort-Object FullName
          )

          if ($files.Count -ne 870) {

              throw "OHLCV file count changed during audit. expected=870 found=$($files.Count)"
          }

          $changed = @()
          $missingBefore = @()

          foreach ($file in $files) {

              $fullPath = $file.FullName

              if ($fullPath.StartsWith($root)) {

                  $relative = $fullPath.Substring($root.Length)

                  $relative = $relative.TrimStart(
                      [System.IO.Path]::DirectorySeparatorChar,
                      [System.IO.Path]::AltDirectorySeparatorChar
                  )

              }
              else {

                  $relative = $fullPath
              }

              $relative = $relative.Replace("\", "/")

              if (-not $before.ContainsKey($relative)) {

                  $missingBefore += $relative
                  continue
              }

              $currentHash = (
                  Get-FileHash `
                      -Algorithm SHA256 `
                      -Path $fullPath
              ).Hash

              if ($currentHash -ne $before[$relative]) {

                  $changed += $relative
              }
          }

          if ($missingBefore.Count -gt 0) {

              Write-Host ""
              Write-Host "Files absent from BEFORE hash inventory:"

              foreach ($item in $missingBefore) {

                  Write-Host "  $item"
              }

              throw "OHLCV inventory changed during audit."
          }

          if ($changed.Count -gt 0) {

              Write-Host ""
              Write-Host "Changed OHLCV files:"

              foreach ($item in $changed) {

                  Write-Host "  $item"
              }

              throw "OHLCV data changed during read-only audit."
          }

          Write-Host "[PASS] All 870 OHLCV files remained unchanged."

          Write-Host "============================================================"


      # ======================================================
      # STEP 16
      # Verify POST files explicitly
      # ======================================================

      - name: Verify POST snapshot files

        shell: powershell

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY POST SNAPSHOT FILES"
          Write-Host "============================================================"

          $postDir = `
              "data/reports/post_recovery_gap_audit"

          $summary = Join-Path `
              $postDir `
              "data_history_gap_summary.csv"

          $detail = Join-Path `
              $postDir `
              "data_history_gap_report.csv"

          if (-not (Test-Path $summary)) {

              throw "Required POST summary missing: $summary"
          }

          Write-Host "[PASS] POST summary report exists."

          if (Test-Path $detail) {

              Write-Host "[PASS] POST detail report exists."
          }
          else {

              Write-Host "[INFO] POST detail report was not generated by the current scanner."
              Write-Host "[INFO] Analyzer will use the validated POST summary."
          }

          Write-Host ""
          Write-Host "POST directory contents:"

          Get-ChildItem `
              $postDir `
              -File `
              | ForEach-Object {

                  Write-Host (
                      "  {0}  ({1} bytes)" `
                      -f $_.Name, $_.Length
                  )
              }

          Write-Host "============================================================"


      # ======================================================
      # STEP 17
      # Verify runtime files are ignored by Git
      # ======================================================

