
name: evaluate_pattern_256_market_sensitivity.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-market-sensitivity
  cancel-in-progress: false

jobs:
  market-sensitivity:
    name: market-sensitivity

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SCRIPT_NAME: evaluate_pattern_256_market_sensitivity.py
      OUTPUT_RELATIVE: data/reports/pattern_256_market_sensitivity
      EXPECTED_VERSION: Clean V003-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Verify script and inputs
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Evaluation script not found"
          }

          $required = @(
            "data/reports/pattern_256_walk_forward/walk_forward_comparison.csv",
            "data/reports/pattern_256_walk_forward/walk_forward_by_market.csv",
            "data/reports/pattern_256_walk_forward/walk_forward_result.json",
            "data/reports/pattern_256_walk_forward/walk_forward_manifest.json",
            "data/reports/pattern_256_statistical_robustness/robustness_comparison.csv",
            "data/reports/pattern_256_statistical_robustness/robustness_market_concentration.csv",
            "data/reports/pattern_256_statistical_robustness/robustness_result.json",
            "data/reports/pattern_256_statistical_robustness/robustness_manifest.json"
          )

          foreach ($relative in $required) {
            $path = Join-Path $env:PROJECT_ROOT $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing input: $path"
            }
          }

          Write-Host "[PASS] Script and input files found"

      - name: Run market sensitivity
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Market sensitivity evaluation failed"
          }

      - name: Verify output integrity
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          output = root / os.environ["OUTPUT_RELATIVE"]
          expected_version = os.environ["EXPECTED_VERSION"]

          def sha256_file(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(
                      lambda: f.read(4 * 1024 * 1024),
                      b"",
                  ):
                      h.update(chunk)
              return h.hexdigest()

          result_path = output / "market_sensitivity_result.json"
          manifest_path = output / "market_sensitivity_manifest.json"

          result = json.loads(
              result_path.read_text(encoding="utf-8")
          )
          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          if result.get("version") != expected_version:
              raise SystemExit("Result version mismatch")

          if manifest.get("version") != expected_version:
              raise SystemExit("Manifest version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Evaluation not PASS")

          if result.get("overall_decision") != "HOLD":
              raise SystemExit("Unexpected decision")

          if result.get("candidate_count") != 2:
              raise SystemExit("Candidate count mismatch")

          if result.get("summary_rows") != 2:
              raise SystemExit("Summary row count mismatch")

          if len(result.get("summary", [])) != 2:
              raise SystemExit("Summary length mismatch")

          for flag in (
              "independent_oos_proven",
              "statistical_independence_proven",
              "causal_improvement_proven",
              "profitability_proven",
              "approved_for_live_trading",
          ):
              if result.get(flag) is not False:
                  raise SystemExit("Safety flag mismatch: " + flag)

          expected_files = {
              "market_sensitivity_detail.csv",
              "market_sensitivity_summary.csv",
              "market_sensitivity_result.json",
          }

          hashes = manifest.get("output_sha256")

          if not isinstance(hashes, dict):
              raise SystemExit("Invalid output manifest")

          if set(hashes) != expected_files:
              raise SystemExit("Output file set mismatch")

          for filename in sorted(expected_files):
              path = output / filename
              if sha256_file(path) != hashes[filename]:
                  raise SystemExit(
                      "SHA256 mismatch: " + filename
                  )
              print("[PASS] SHA256:", filename)

          with (
              output / "market_sensitivity_detail.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              details = list(csv.DictReader(f))

          with (
              output / "market_sensitivity_summary.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              summaries = list(csv.DictReader(f))

          if len(details) != result["detail_rows"]:
              raise SystemExit("Detail count mismatch")

          if len(summaries) != 2:
              raise SystemExit("Summary CSV count mismatch")

          expected_candidates = {("h1", "24"), ("h4", "24")}
          actual_candidates = {
              (row["timeframe"], row["horizon"])
              for row in summaries
          }

          if actual_candidates != expected_candidates:
              raise SystemExit("Candidate set mismatch")

          if any(row["decision"] != "HOLD" for row in summaries):
              raise SystemExit("Unexpected candidate decision")

          print("[PASS] Clean V003-4")
          print("[PASS] Detail rows:", len(details))
          print("[PASS] Candidate groups: 2")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Output verification failed"
          }

      - name: Upload market sensitivity results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-market-sensitivity-v003-4
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_market_sensitivity/market_sensitivity_detail.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_market_sensitivity/market_sensitivity_summary.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_market_sensitivity/market_sensitivity_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_market_sensitivity/market_sensitivity_manifest.json
          if-no-files-found: error
          retention-days: 14
