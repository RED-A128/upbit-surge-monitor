
name: validate_pattern_256_accumulation_candidate_oos_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-oos-validation-test
  cancel-in-progress: false

jobs:
  candidate-oos-validation-test:
    name: Candidate OOS Validation Test
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: validate_pattern_256_accumulation_candidate_oos.py
      REPORT_DIR: data\reports\pattern_256_accumulation_candidate_oos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          $content = Get-Content -LiteralPath $program -Raw -Encoding UTF8

          if ($content -notmatch 'VERSION\s*=\s*["'']Clean V002["'']') {
            throw "Expected Python program Clean V002."
          }

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $pycache = Join-Path $env:RUNNER_TEMP (
            "candidate_oos_pycache_{0}_{1}" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )

          $env:PYTHONPYCACHEPREFIX = $pycache

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          Write-Host "Python program verification PASS"

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $sources = @(
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_research.csv',
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_comparison.csv',
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_result.json',
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_manifest.json',
            'data\reports\pattern_256_accumulation_30pct\validation_detail.csv'
          )

          $snapshot = @()

          foreach ($relative in $sources) {
            $source = Join-Path `
              -Path $env:PRODUCTION_ROOT `
              -ChildPath ([string]$relative)

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $hash = (
              Get-FileHash -LiteralPath $source -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $snapshot += [PSCustomObject]@{
              relative_path = [string]$relative
              sha256 = [string]$hash
            }

            Write-Host "SHA256 CAPTURED: $relative"
          }

          $snapshotPath = Join-Path $env:RUNNER_TEMP (
            "candidate_oos_input_hash_{0}_{1}.json" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $snapshotPath) {
            throw "Input snapshot already exists."
          }

          ConvertTo-Json -InputObject @($snapshot) -Depth 5 |
            Set-Content -LiteralPath $snapshotPath -Encoding UTF8

          "OOS_INPUT_SNAPSHOT=$snapshotPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Production input snapshot PASS"

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path $env:RUNNER_TEMP (
            "candidate_oos_test_{0}_{1}" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $testRoot) {
            throw "Isolated workspace already exists: $testRoot"
          }

          New-Item -ItemType Directory -Path $testRoot |
            Out-Null

          $programSource = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          $programTarget = Join-Path `
            $testRoot `
            $env:PROGRAM_NAME

          Copy-Item `
            -LiteralPath $programSource `
            -Destination $programTarget `
            -ErrorAction Stop

          $programSourceHash = (
            Get-FileHash -LiteralPath $programSource -Algorithm SHA256
          ).Hash

          $programTargetHash = (
            Get-FileHash -LiteralPath $programTarget -Algorithm SHA256
          ).Hash

          if ($programSourceHash -ne $programTargetHash) {
            throw "Python program copy SHA256 mismatch."
          }

          $snapshot = @(
            Get-Content `
              -LiteralPath $env:OOS_INPUT_SNAPSHOT `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json
          )

          foreach ($item in $snapshot) {
            $relative = [string]$item.relative_path

            if ([string]::IsNullOrWhiteSpace($relative)) {
              throw "Invalid snapshot relative path."
            }

            $source = Join-Path `
              -Path $env:PRODUCTION_ROOT `
              -ChildPath $relative

            $target = Join-Path `
              -Path $testRoot `
              -ChildPath $relative

            $parent = Split-Path -Path $target -Parent

            New-Item `
              -ItemType Directory `
              -Path $parent `
              -Force |
              Out-Null

            Copy-Item `
              -LiteralPath $source `
              -Destination $target `
              -ErrorAction Stop

            $copiedHash = (
              Get-FileHash -LiteralPath $target -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expectedHash = [string]$item.sha256

            if ($copiedHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Copied input SHA256 mismatch: $relative"
            }

            Write-Host "COPY VERIFIED: $relative"
          }

          "OOS_TEST_ROOT=$testRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Isolated test workspace PASS"

      - name: Execute candidate OOS validation test
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:OOS_TEST_ROOT)) {
            throw "OOS test root unavailable."
          }

          $program = Join-Path `
            $env:OOS_TEST_ROOT `
            $env:PROGRAM_NAME

          Write-Host "========================================"
          Write-Host "Candidate OOS Validation Test"
          Write-Host "========================================"

          py $program --root $env:OOS_TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate OOS validation execution failed."
          }

          Write-Host "Candidate OOS validation execution PASS"

      - name: Verify candidate OOS test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:OOS_TEST_ROOT `
            $env:REPORT_DIR

          $required = @(
            'candidate_oos_summary.csv',
            'candidate_oos_yearly.csv',
            'candidate_oos_result.json',
            'candidate_oos_manifest.json'
          )

          foreach ($name in $required) {
            $path = Join-Path $outputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing OOS output: $path"
            }

            Write-Host "FOUND: $name"
          }

          $resultPath = Join-Path `
            $outputDir `
            'candidate_oos_result.json'

          $manifestPath = Join-Path `
            $outputDir `
            'candidate_oos_manifest.json'

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.status -ne 'PASS') {
            throw "OOS result status is not PASS."
          }

          if ($manifest.status -ne 'PASS') {
            throw "OOS manifest status is not PASS."
          }

          if ($result.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected OOS program."
          }

          if ($result.version -ne 'Clean V002') {
            throw "Unexpected OOS program version."
          }

          if ($result.assessment -ne 'DESCRIPTIVE_CHRONOLOGICAL_OOS_ONLY') {
            throw "Unexpected OOS assessment."
          }

          if ([int]$result.summary_rows -ne 45) {
            throw "Unexpected OOS summary row count."
          }

          $summaryPath = Join-Path `
            $outputDir `
            'candidate_oos_summary.csv'

          $summary = @(
            Import-Csv -LiteralPath $summaryPath
          )

          if ($summary.Count -ne 45) {
            throw "OOS summary CSV row count mismatch."
          }

          foreach ($name in @(
            'candidate_oos_summary.csv',
            'candidate_oos_yearly.csv',
            'candidate_oos_result.json'
          )) {
            $property = $manifest.outputs.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Missing manifest output hash: $name"
            }

            $expected = [string]$property.Value

            if ($expected -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid manifest output SHA256: $name"
            }

            $path = Join-Path $outputDir $name

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "Output SHA256 mismatch: $name"
            }

            Write-Host "OUTPUT VERIFIED: $name"
          }

          Write-Host "Candidate OOS test outputs PASS"

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:OOS_INPUT_SNAPSHOT)) {
            Write-Host "Input snapshot not created; verification unavailable."
            exit 0
          }

          if (-not (
            Test-Path `
              -LiteralPath $env:OOS_INPUT_SNAPSHOT `
              -PathType Leaf
          )) {
            throw "Production input snapshot missing."
          }

          $snapshot = @(
            Get-Content `
              -LiteralPath $env:OOS_INPUT_SNAPSHOT `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json
          )

          foreach ($item in $snapshot) {
            $relative = [string]$item.relative_path

            if ([string]::IsNullOrWhiteSpace($relative)) {
              throw "Invalid snapshot relative path."
            }

            $path = Join-Path `
              -Path $env:PRODUCTION_ROOT `
              -ChildPath $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = [string]$item.sha256

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "Production input changed: $relative"
            }

            Write-Host "UNCHANGED PASS: $relative"
          }

          Write-Host "Production inputs unchanged PASS"

      - name: Upload candidate OOS test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-oos-test
          path: ${{ env.OOS_TEST_ROOT }}/data/reports/pattern_256_accumulation_candidate_oos/
          if-no-files-found: error
          retention-days: 30
