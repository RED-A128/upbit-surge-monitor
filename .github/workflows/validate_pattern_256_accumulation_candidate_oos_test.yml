
name: validate_pattern_256_accumulation_candidate_oos_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-oos-validation-test:
    name: Candidate OOS Validation Test
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: validate_pattern_256_accumulation_candidate_oos.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          py -3 --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable."
          }

          py -3 -m py_compile $program
          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }

          Write-Host "Python program verification PASS"

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $relativePaths = @(
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_research.csv'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_comparison.csv'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_result.json'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_manifest.json'
            'data\reports\pattern_256_accumulation_30pct\validation_detail.csv'
          )

          $snapshot = New-Object System.Collections.ArrayList

          foreach ($relativePath in $relativePaths) {
            $source = Join-Path -Path $env:PRODUCTION_ROOT -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash

            $entry = [PSCustomObject]@{
              relative_path = [string]$relativePath
              sha256 = [string]$hash
            }

            [void]$snapshot.Add($entry)

            Write-Host "HASH CAPTURED: $relativePath"
          }

          if ($snapshot.Count -ne 5) {
            throw "Expected exactly 5 input records."
          }

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hashes.json"

          $json = ConvertTo-Json -InputObject $snapshot.ToArray() -Depth 5

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          $check = ConvertFrom-Json -InputObject (
            [System.IO.File]::ReadAllText($snapshotPath)
          )

          if (@($check).Count -ne 5) {
            throw "SHA256 snapshot JSON array verification failed."
          }

          Write-Host "Production SHA256 snapshot PASS"

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hashes.json"

          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Input hash snapshot missing."
          }

          $items = ConvertFrom-Json -InputObject (
            [System.IO.File]::ReadAllText($snapshotPath)
          )

          if (@($items).Count -ne 5) {
            throw "Expected exactly 5 snapshot entries."
          }

          $testRoot = Join-Path $env:RUNNER_TEMP (
            "candidate_oos_test_" +
            $env:GITHUB_RUN_ID +
            "_" +
            $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          foreach ($item in $items) {
            $relativePath = [string]$item.relative_path
            $expectedHash = [string]$item.sha256

            if ([string]::IsNullOrWhiteSpace($relativePath)) {
              throw "Empty input relative path."
            }

            if ($relativePath -match '(^[\\/]|^[A-Za-z]:|\.\.)') {
              throw "Unsafe input relative path: $relativePath"
            }

            $source = Join-Path -Path $env:PRODUCTION_ROOT -ChildPath $relativePath
            $target = Join-Path -Path $testRoot -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $actualSourceHash = (
              Get-FileHash -LiteralPath $source -Algorithm SHA256
            ).Hash

            if ($actualSourceHash -ne $expectedHash) {
              throw "Production input changed before copy: $relativePath"
            }

            $targetDirectory = Split-Path -Parent $target

            New-Item -ItemType Directory -Path $targetDirectory -Force |
              Out-Null

            Copy-Item `
              -LiteralPath $source `
              -Destination $target `
              -ErrorAction Stop

            $targetHash = (
              Get-FileHash -LiteralPath $target -Algorithm SHA256
            ).Hash

            if ($targetHash -ne $expectedHash) {
              throw "Copied input SHA256 mismatch: $relativePath"
            }

            Write-Host "COPY VERIFIED: $relativePath"
          }

          $programSource = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME
          $programTarget = Join-Path $testRoot $env:PROGRAM_NAME

          Copy-Item `
            -LiteralPath $programSource `
            -Destination $programTarget `
            -ErrorAction Stop

          $sourceHash = (
            Get-FileHash -LiteralPath $programSource -Algorithm SHA256
          ).Hash

          $targetHash = (
            Get-FileHash -LiteralPath $programTarget -Algorithm SHA256
          ).Hash

          if ($sourceHash -ne $targetHash) {
            throw "Python program SHA256 mismatch."
          }

          "CANDIDATE_OOS_TEST_ROOT=$testRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Isolated test workspace PASS"

      - name: Execute candidate OOS validation test
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:CANDIDATE_OOS_TEST_ROOT) {
            throw "Test workspace variable missing."
          }

          $program = Join-Path `
            $env:CANDIDATE_OOS_TEST_ROOT `
            $env:PROGRAM_NAME

          & py -3 $program --root $env:CANDIDATE_OOS_TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate OOS validation execution failed."
          }

          Write-Host "Candidate OOS execution PASS"

      - name: Verify candidate OOS test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:CANDIDATE_OOS_TEST_ROOT `
            'data\reports\pattern_256_accumulation_candidate_oos'

          $expectedFiles = @(
            'candidate_oos_summary.csv'
            'candidate_oos_yearly.csv'
            'candidate_oos_result.json'
            'candidate_oos_manifest.json'
          )

          foreach ($filename in $expectedFiles) {
            $path = Join-Path $outputDir $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected output missing: $filename"
            }

            Write-Host "FOUND: $filename"
          }

          $resultPath = Join-Path $outputDir 'candidate_oos_result.json'

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw `
            -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Candidate OOS result status is not PASS."
          }

          Write-Host "Candidate OOS output verification PASS"

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hashes.json"

          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Production input SHA256 snapshot unavailable."
          }

          $items = ConvertFrom-Json -InputObject (
            [System.IO.File]::ReadAllText($snapshotPath)
          )

          if (@($items).Count -ne 5) {
            throw "Unexpected snapshot entry count."
          }

          foreach ($item in $items) {
            $relativePath = [string]$item.relative_path
            $expectedHash = [string]$item.sha256

            $path = Join-Path -Path $env:PRODUCTION_ROOT -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $relativePath"
            }

            $actualHash = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Production input SHA256 changed: $relativePath"
            }

            Write-Host "UNCHANGED: $relativePath"
          }

          Write-Host "Production inputs unchanged PASS"

      - name: Upload candidate OOS test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-oos-test
          path: ${{ env.CANDIDATE_OOS_TEST_ROOT }}/data/reports/pattern_256_accumulation_candidate_oos/
          if-no-files-found: error
          retention-days: 14
