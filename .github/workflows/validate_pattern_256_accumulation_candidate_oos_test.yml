
name: validate_pattern_256_accumulation_candidate_oos_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-oos-validation-test:
    name: Candidate OOS Validation Test
    runs-on: [self-hosted, Windows]

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: validate_pattern_256_accumulation_candidate_oos.py
      EXPECTED_VERSION: Clean V002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          $content = Get-Content `
            -LiteralPath $program `
            -Raw `
            -Encoding UTF8

          if ($content -notmatch 'VERSION\s*=\s*["'']Clean V002["'']') {
            throw "Expected Clean V002 Python program."
          }

          py -3 --version

          py -3 -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }

          Write-Host "Python program verification PASS"

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $relativePaths = @(
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_research.csv'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_comparison.csv'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_result.json'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_manifest.json'
            'data\reports\pattern_256_accumulation_30pct\validation_detail.csv'
          )

          $snapshot = @()

          foreach ($relativePath in $relativePaths) {
            $source = Join-Path `
              -Path $env:PRODUCTION_ROOT `
              -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $hash = (
              Get-FileHash `
                -LiteralPath $source `
                -Algorithm SHA256
            ).Hash

            $snapshot += [PSCustomObject]@{
              relative_path = $relativePath
              sha256 = $hash
            }

            Write-Host "HASH CAPTURED: $relativePath"
          }

          $snapshotPath = Join-Path `
            -Path $env:RUNNER_TEMP `
            -ChildPath "candidate_oos_input_hashes.json"

          $snapshot |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath $snapshotPath `
              -Encoding UTF8

          Write-Host "Production SHA256 snapshot PASS"

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path `
            -Path $env:RUNNER_TEMP `
            -ChildPath ("candidate_oos_test_" + $env:GITHUB_RUN_ID + "_" + $env:GITHUB_RUN_ATTEMPT)

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          New-Item `
            -ItemType Directory `
            -Path $testRoot `
            -Force | Out-Null

          $relativePaths = @(
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_research.csv'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_comparison.csv'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_result.json'
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_manifest.json'
            'data\reports\pattern_256_accumulation_30pct\validation_detail.csv'
          )

          foreach ($relativePath in $relativePaths) {
            $source = Join-Path `
              -Path $env:PRODUCTION_ROOT `
              -ChildPath $relativePath

            $target = Join-Path `
              -Path $testRoot `
              -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $targetDirectory = Split-Path -Parent $target

            New-Item `
              -ItemType Directory `
              -Path $targetDirectory `
              -Force | Out-Null

            Copy-Item `
              -LiteralPath $source `
              -Destination $target `
              -ErrorAction Stop

            $sourceHash = (
              Get-FileHash -LiteralPath $source -Algorithm SHA256
            ).Hash

            $targetHash = (
              Get-FileHash -LiteralPath $target -Algorithm SHA256
            ).Hash

            if ($sourceHash -ne $targetHash) {
              throw "Copied input SHA256 mismatch: $relativePath"
            }

            Write-Host "COPY VERIFIED: $relativePath"
          }

          $programSource = Join-Path `
            -Path $env:GITHUB_WORKSPACE `
            -ChildPath $env:PROGRAM_NAME

          $programTarget = Join-Path `
            -Path $testRoot `
            -ChildPath $env:PROGRAM_NAME

          Copy-Item `
            -LiteralPath $programSource `
            -Destination $programTarget `
            -ErrorAction Stop

          $programSourceHash = (
            Get-FileHash -LiteralPath $programSource -Algorithm SHA256
          ).Hash

          $programTargetHash = (
            Get-FileHash -LiteralPath $programTarget -Algorithm SHA256
          ).Hash

          if ($programSourceHash -ne $programTargetHash) {
            throw "Python program copy SHA256 mismatch."
          }

          "CANDIDATE_OOS_TEST_ROOT=$testRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Isolated test workspace PASS"

      - name: Execute candidate OOS validation test
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:CANDIDATE_OOS_TEST_ROOT) {
            throw "Test workspace environment variable missing."
          }

          $program = Join-Path `
            -Path $env:CANDIDATE_OOS_TEST_ROOT `
            -ChildPath $env:PROGRAM_NAME

          Write-Host "========================================"
          Write-Host "Candidate OOS Validation Test"
          Write-Host "========================================"

          & py -3 $program --root $env:CANDIDATE_OOS_TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate OOS validation execution failed."
          }

          Write-Host "Candidate OOS validation execution PASS"

      - name: Verify candidate OOS test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            -Path $env:CANDIDATE_OOS_TEST_ROOT `
            -ChildPath 'data\reports\pattern_256_accumulation_candidate_oos'

          $expectedFiles = @(
            'candidate_oos_summary.csv'
            'candidate_oos_yearly.csv'
            'candidate_oos_result.json'
            'candidate_oos_manifest.json'
          )

          foreach ($filename in $expectedFiles) {
            $path = Join-Path `
              -Path $outputDir `
              -ChildPath $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected output missing: $path"
            }

            Write-Host "FOUND: $filename"
          }

          $resultPath = Join-Path `
            -Path $outputDir `
            -ChildPath 'candidate_oos_result.json'

          $manifestPath = Join-Path `
            -Path $outputDir `
            -ChildPath 'candidate_oos_manifest.json'

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Candidate OOS result status is not PASS."
          }

          if ($manifest.status -ne "PASS") {
            throw "Candidate OOS manifest status is not PASS."
          }

          if ($result.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected result program."
          }

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Unexpected result program version."
          }

          if ($result.assessment -ne "DESCRIPTIVE_CHRONOLOGICAL_OOS_ONLY") {
            throw "Unexpected OOS assessment."
          }

          if ($result.methodology.chronological_split -ne $true) {
            throw "Chronological split verification failed."
          }

          if ($result.methodology.split_by_unique_signal_event -ne $true) {
            throw "Unique signal event split verification failed."
          }

          if ($result.methodology.embargo_applied -ne $true) {
            throw "Embargo verification failed."
          }

          foreach ($filename in @(
            'candidate_oos_summary.csv'
            'candidate_oos_yearly.csv'
            'candidate_oos_result.json'
          )) {
            $path = Join-Path `
              -Path $outputDir `
              -ChildPath $filename

            $expectedHash = $manifest.outputs.$filename

            if (-not $expectedHash) {
              throw "Output manifest hash missing: $filename"
            }

            $actualHash = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash

            if ($actualHash.ToLowerInvariant() -ne ([string]$expectedHash).ToLowerInvariant()) {
              throw "Output SHA256 mismatch: $filename"
            }

            Write-Host "OUTPUT HASH VERIFIED: $filename"
          }

          Write-Host "Candidate OOS output verification PASS"

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotPath = Join-Path `
            -Path $env:RUNNER_TEMP `
            -ChildPath "candidate_oos_input_hashes.json"

          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Production input hash snapshot unavailable."
          }

          $snapshot = @(
            Get-Content `
              -LiteralPath $snapshotPath `
              -Raw `
              -Encoding UTF8 | ConvertFrom-Json
          )

          foreach ($item in $snapshot) {
            $relativePath = [string]$item.relative_path

            $path = Join-Path `
              -Path $env:PRODUCTION_ROOT `
              -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $relativePath"
            }

            $actualHash = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash

            if ($actualHash.ToLowerInvariant() -ne ([string]$item.sha256).ToLowerInvariant()) {
              throw "Production input SHA256 changed: $relativePath"
            }

            Write-Host "UNCHANGED: $relativePath"
          }

          Write-Host "Production inputs unchanged PASS"

      - name: Upload candidate OOS test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-oos-test
          path: ${{ env.CANDIDATE_OOS_TEST_ROOT }}/data/reports/pattern_256_accumulation_candidate_oos/
          if-no-files-found: error
          retention-days: 14
