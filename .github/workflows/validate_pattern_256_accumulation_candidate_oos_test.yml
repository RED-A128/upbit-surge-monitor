
name: validate_pattern_256_accumulation_candidate_oos_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-oos-validation-test:
    name: Candidate OOS Validation Test
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: validate_pattern_256_accumulation_candidate_oos.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          py -3 --version
          py -3 -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }

          Write-Host "Python verification PASS"

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_research.csv',
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_comparison.csv',
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_result.json',
            'data\reports\pattern_256_accumulation_candidate_rules\candidate_rule_manifest.json',
            'data\reports\pattern_256_accumulation_30pct\validation_detail.csv'
          )

          $snapshot = @()

          foreach ($relativePath in $paths) {
            $source = Join-Path -Path $env:PRODUCTION_ROOT -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash

            $snapshot += [PSCustomObject]@{
              relative_path = $relativePath
              sha256 = $hash
            }

            Write-Host "CAPTURED: $relativePath"
          }

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hashes.json"

          ConvertTo-Json -InputObject @($snapshot) -Depth 5 |
            Set-Content -LiteralPath $snapshotPath -Encoding UTF8

          Write-Host "Input SHA256 snapshot PASS"

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path $env:RUNNER_TEMP (
            "candidate_oos_test_" + $env:GITHUB_RUN_ID + "_" + $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $testRoot) {
            throw "Workspace already exists: $testRoot"
          }

          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hashes.json"

          $items = @(
            Get-Content -LiteralPath $snapshotPath -Raw -Encoding UTF8 |
              ConvertFrom-Json
          )

          foreach ($item in $items) {
            $relativePath = [string]$item.relative_path

            $source = Join-Path -Path $env:PRODUCTION_ROOT -ChildPath $relativePath
            $target = Join-Path -Path $testRoot -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Source missing: $relativePath"
            }

            New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force |
              Out-Null

            Copy-Item -LiteralPath $source -Destination $target -ErrorAction Stop

            $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash

            if ($sourceHash -ne $targetHash) {
              throw "Copy hash mismatch: $relativePath"
            }

            Write-Host "COPY VERIFIED: $relativePath"
          }

          $programSource = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME
          $programTarget = Join-Path $testRoot $env:PROGRAM_NAME

          Copy-Item -LiteralPath $programSource -Destination $programTarget -ErrorAction Stop

          $sourceHash = (Get-FileHash -LiteralPath $programSource -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -LiteralPath $programTarget -Algorithm SHA256).Hash

          if ($sourceHash -ne $targetHash) {
            throw "Program copy hash mismatch."
          }

          "CANDIDATE_OOS_TEST_ROOT=$testRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Isolated workspace PASS"

      - name: Execute candidate OOS validation test
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:CANDIDATE_OOS_TEST_ROOT $env:PROGRAM_NAME

          & py -3 $program --root $env:CANDIDATE_OOS_TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate OOS validation failed."
          }

          Write-Host "Candidate OOS execution PASS"

      - name: Verify candidate OOS test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:CANDIDATE_OOS_TEST_ROOT `
            'data\reports\pattern_256_accumulation_candidate_oos'

          $expectedFiles = @(
            'candidate_oos_summary.csv',
            'candidate_oos_yearly.csv',
            'candidate_oos_result.json',
            'candidate_oos_manifest.json'
          )

          foreach ($filename in $expectedFiles) {
            $path = Join-Path $outputDir $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $filename"
            }

            Write-Host "FOUND: $filename"
          }

          $resultPath = Join-Path $outputDir 'candidate_oos_result.json'

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Result status is not PASS."
          }

          Write-Host "Candidate OOS output verification PASS"

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hashes.json"

          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Production hash snapshot unavailable."
          }

          $items = @(
            Get-Content -LiteralPath $snapshotPath -Raw -Encoding UTF8 |
              ConvertFrom-Json
          )

          foreach ($item in $items) {
            $relativePath = [string]$item.relative_path
            $path = Join-Path -Path $env:PRODUCTION_ROOT -ChildPath $relativePath

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $relativePath"
            }

            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actualHash -ne [string]$item.sha256) {
              throw "Production input changed: $relativePath"
            }

            Write-Host "UNCHANGED: $relativePath"
          }

          Write-Host "Production inputs unchanged PASS"

      - name: Upload candidate OOS test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-oos-test
          path: ${{ env.CANDIDATE_OOS_TEST_ROOT }}/data/reports/pattern_256_accumulation_candidate_oos/
          if-no-files-found: error
          retention-days: 14
