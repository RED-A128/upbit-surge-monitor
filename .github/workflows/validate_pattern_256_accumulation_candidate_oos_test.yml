
name: validate_pattern_256_accumulation_candidate_oos_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-oos-validation-test
  cancel-in-progress: false

jobs:
  candidate-oos-validation-test:
    name: Candidate OOS Validation Test
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: validate_pattern_256_accumulation_candidate_oos.py
      REPORT_DIR: data/reports/pattern_256_accumulation_candidate_oos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          $content = Get-Content -LiteralPath $program -Raw -Encoding UTF8

          if ($content -notmatch 'VERSION\s*=\s*["'']Clean V002["'']') {
            throw "Expected Python program Clean V002."
          }

          py --version

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed."
          }

          Write-Host "Python program verification PASS"

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $sources = @(
            'data/reports/pattern_256_accumulation_candidate_rules/candidate_rule_research.csv',
            'data/reports/pattern_256_accumulation_candidate_rules/candidate_rule_comparison.csv',
            'data/reports/pattern_256_accumulation_candidate_rules/candidate_rule_result.json',
            'data/reports/pattern_256_accumulation_candidate_rules/candidate_rule_manifest.json',
            'data/reports/pattern_256_accumulation_30pct/validation_detail.csv'
          )

          $snapshot = @()

          foreach ($relative in $sources) {
            $source = Join-Path $env:PRODUCTION_ROOT $relative

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Production input missing: $source"
            }

            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash

            $snapshot += [PSCustomObject]@{
              relative_path = $relative
              sha256 = $hash
            }

            Write-Host "SHA256 CAPTURED: $relative"
          }

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_input_hash_$env:GITHUB_RUN_ID.json"

          $snapshot |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath $snapshotPath -Encoding UTF8

          "OOS_INPUT_SNAPSHOT=$snapshotPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Production input snapshot PASS"

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path $env:RUNNER_TEMP "candidate_oos_test_$env:GITHUB_RUN_ID"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Isolated workspace already exists: $testRoot"
          }

          New-Item -ItemType Directory -Path $testRoot | Out-Null

          $programSource = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME
          $programTarget = Join-Path $testRoot $env:PROGRAM_NAME

          Copy-Item -LiteralPath $programSource -Destination $programTarget

          $snapshot = @(
            Get-Content -LiteralPath $env:OOS_INPUT_SNAPSHOT -Raw |
              ConvertFrom-Json
          )

          foreach ($item in $snapshot) {
            $source = Join-Path $env:PRODUCTION_ROOT $item.relative_path
            $target = Join-Path $testRoot $item.relative_path

            $parent = Split-Path -Parent $target

            New-Item -ItemType Directory -Path $parent -Force | Out-Null

            Copy-Item -LiteralPath $source -Destination $target

            $copiedHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash

            if ($copiedHash -ne $item.sha256) {
              throw "Copied input SHA256 mismatch: $($item.relative_path)"
            }

            Write-Host "COPY VERIFIED: $($item.relative_path)"
          }

          "OOS_TEST_ROOT=$testRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Isolated test workspace PASS"

      - name: Execute candidate OOS validation test
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:OOS_TEST_ROOT $env:PROGRAM_NAME

          py $program --root $env:OOS_TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate OOS validation execution failed."
          }

          Write-Host "Candidate OOS validation execution PASS"

      - name: Verify candidate OOS test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path $env:OOS_TEST_ROOT $env:REPORT_DIR

          $required = @(
            'candidate_oos_summary.csv',
            'candidate_oos_yearly.csv',
            'candidate_oos_result.json',
            'candidate_oos_manifest.json'
          )

          foreach ($name in $required) {
            $path = Join-Path $outputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing OOS output: $path"
            }

            Write-Host "FOUND: $name"
          }

          $result = Get-Content -LiteralPath (
            Join-Path $outputDir 'candidate_oos_result.json'
          ) -Raw | ConvertFrom-Json

          $manifest = Get-Content -LiteralPath (
            Join-Path $outputDir 'candidate_oos_manifest.json'
          ) -Raw | ConvertFrom-Json

          if ($result.status -ne 'PASS') {
            throw "OOS result status is not PASS."
          }

          if ($manifest.status -ne 'PASS') {
            throw "OOS manifest status is not PASS."
          }

          if ($result.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected OOS program."
          }

          if ($result.version -ne 'Clean V002') {
            throw "Unexpected OOS program version."
          }

          if ($result.assessment -ne 'DESCRIPTIVE_CHRONOLOGICAL_OOS_ONLY') {
            throw "Unexpected OOS assessment."
          }

          if ([int]$result.summary_rows -ne 45) {
            throw "Unexpected OOS summary row count."
          }

          foreach ($name in @(
            'candidate_oos_summary.csv',
            'candidate_oos_yearly.csv',
            'candidate_oos_result.json'
          )) {
            $expected = $manifest.outputs.PSObject.Properties[$name].Value

            if (-not $expected) {
              throw "Missing manifest output hash: $name"
            }

            $path = Join-Path $outputDir $name
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $name"
            }

            Write-Host "OUTPUT VERIFIED: $name"
          }

          Write-Host "Candidate OOS test outputs PASS"

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:OOS_INPUT_SNAPSHOT) {
            Write-Host "Input snapshot not created; verification unavailable."
            exit 0
          }

          if (-not (Test-Path -LiteralPath $env:OOS_INPUT_SNAPSHOT)) {
            throw "Production input snapshot missing."
          }

          $snapshot = @(
            Get-Content -LiteralPath $env:OOS_INPUT_SNAPSHOT -Raw |
              ConvertFrom-Json
          )

          foreach ($item in $snapshot) {
            $path = Join-Path $env:PRODUCTION_ROOT $item.relative_path

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne $item.sha256) {
              throw "Production input changed: $($item.relative_path)"
            }

            Write-Host "UNCHANGED: $($item.relative_path)"
          }

          Write-Host "Production inputs unchanged PASS"

      - name: Upload candidate OOS test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-oos-test
          path: ${{ env.OOS_TEST_ROOT }}/data/reports/pattern_256_accumulation_candidate_oos/
          if-no-files-found: error
          retention-days: 30
