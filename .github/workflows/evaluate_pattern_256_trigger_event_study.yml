
name: evaluate_pattern_256_trigger_event_study.yml

on:
  workflow_dispatch:
    inputs:
      force_replay:
        description: "Ignore valid checkpoints"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pattern-256-trigger-event-study
  cancel-in-progress: false

jobs:
  trigger-event-study:
    name: trigger-event-study
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_trigger_event_study.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing event study script: $script"
          }

          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          py -c "import pandas, numpy; print('Dependencies PASS')"
          if ($LASTEXITCODE -ne 0) {
            throw "Required dependencies unavailable"
          }

          py -c "import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script
          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax check failed"
          }

          $required = @(
            "data\ohlcv\h1",
            "data\ohlcv\h4",
            "data\ohlcv\d1",
            "data\signals\256\h1",
            "data\signals\256\h4",
            "data\signals\256\d1",
            "data\reports\pattern_256_signal_ohlcv_alignment\alignment_result.json",
            "data\reports\pattern_256_signal_ohlcv_alignment\alignment_manifest.json",
            "data\reports\pattern_256_signal_ohlcv_alignment\alignment_files.csv"
          )

          foreach ($relative in $required) {
            $path = Join-Path $env:DATA_ROOT $relative
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required input missing: $path"
            }
          }

          Write-Host "[PASS] Environment verified"

      - name: Execute event study
        id: study
        continue-on-error: true
        env:
          FORCE_REPLAY: ${{ inputs.force_replay }}
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_trigger_event_study.py"

          $arguments = @(
            "-u",
            $script,
            "--root",
            $env:DATA_ROOT
          )

          if ($env:FORCE_REPLAY -eq "true") {
            $arguments += "--force"
          }

          & py @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Event study execution failed"
          }

      - name: Verify results and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.study.outcome }}" -ne "success") {
            throw "Event study did not finish successfully"
          }

          $folder = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_trigger_event_study"

          $resultPath = Join-Path $folder "event_study_result.json"
          $manifestPath = Join-Path $folder "event_study_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw "Result JSON missing"
          }

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Manifest JSON missing"
          }

          $r = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json

          $m = Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json

          if ($r.execution -ne "PASS") {
            throw "Execution not PASS"
          }

          if ($m.execution -ne "PASS") {
            throw "Manifest not PASS"
          }

          if ($r.jobs -ne 870) {
            throw "Unexpected job count"
          }

          if ($r.completed_jobs -ne $r.jobs) {
            throw "Incomplete jobs"
          }

          if ($r.failed_jobs -ne 0) {
            throw "Failed jobs detected"
          }

          if ($r.retrospective_event_study_completed -ne $true) {
            throw "Study incomplete"
          }

          if ($r.event_records -ne ($r.selected_events * 3)) {
            throw "Unexpected event record count"
          }

          if ($r.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($r.point_in_time_proven -ne $false) {
            throw "Unexpected point-in-time approval"
          }

          if ($r.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          foreach ($filename in @(
            "event_study_files.csv",
            "event_study_events.csv",
            "event_study_result.json"
          )) {
            $path = Join-Path $folder $filename
            $expected = [string]$m.output_sha256.$filename

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing output: $filename"
            }

            if ($expected.Length -ne 64) {
              throw "Invalid SHA256: $filename"
            }

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $filename"
            }

            Write-Host "[SHA256 PASS] $filename"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_trigger_event_study.py"

          $scriptHash = (
            Get-FileHash -LiteralPath $script -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($scriptHash -ne (
            [string]$m.script_sha256
          ).ToLowerInvariant()) {
            throw "Audit script SHA256 mismatch"
          }

          Write-Host "[PASS] Event study integrity"

      - name: Publish summary
        if: always()
        run: |
          if ("${{ steps.verify.outcome }}" -ne "success") {
            "## Pattern 256 Event Study - Failed" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
            exit 0
          }

          $path = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_trigger_event_study\event_study_result.json"

          $r = Get-Content -LiteralPath $path -Raw |
            ConvertFrom-Json

          @"
          ## Pattern 256 Trigger +30% Event Study

          | Check | Result |
          |---|---|
          | Version | $($r.version) |
          | Execution | $($r.execution) |
          | Jobs | $($r.jobs) |
          | Completed | $($r.completed_jobs) |
          | Failed | $($r.failed_jobs) |
          | Trigger run starts | $($r.trigger_run_starts) |
          | Selected events | $($r.selected_events) |
          | Event records | $($r.event_records) |
          | Skipped entry gaps | $($r.skipped_entry_gap) |
          | Skipped cooldown | $($r.skipped_cooldown) |
          | Independent OOS proven | $($r.independent_oos_proven) |
          | Research decision | $($r.research_decision) |

          ### Retrospective +30% target results

          | Timeframe | Period | Horizon (hours) | Events | Hits | Misses | Censored | Hit rate |
          |---|---|---:|---:|---:|---:|---:|---:|
          "@ |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append -Encoding utf8

          foreach ($s in $r.summary) {
            $rate = if ($null -eq $s.hit_rate_pct) {
              "N/A"
            } else {
              "$($s.hit_rate_pct)%"
            }

            "| $($s.timeframe) | $($s.period) | $($s.horizon_hours) | $($s.events) | $($s.hits) | $($s.misses) | $($s.censored) | $rate |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
          }

          @"

          **Important:** Target touches are not verified
          executable trades. Independent OOS remains unproven.
          "@ |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append -Encoding utf8

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-trigger-event-study
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_trigger_event_study\event_study_files.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_trigger_event_study\event_study_events.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_trigger_event_study\event_study_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_trigger_event_study\event_study_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.study.outcome }}" -ne "success") {
            throw "Event study execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Event study integrity verification failed"
          }

          Write-Host "TRIGGER EVENT STUDY COMPLETED"
          Write-Host "RESEARCH DECISION: HOLD"
