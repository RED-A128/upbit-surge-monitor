
name: evaluate_pattern_256_concentration_audit.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-concentration-audit
  cancel-in-progress: false

jobs:
  concentration-audit:
    name: concentration-audit

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SCRIPT_NAME: evaluate_pattern_256_concentration_audit.py
      OUTPUT_RELATIVE: data/reports/pattern_256_concentration_audit
      EXPECTED_VERSION: Clean V003-11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and inputs
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python script not found: $script"
          }

          $inputDir = Join-Path `
            $env:PROJECT_ROOT `
            "data/reports/pattern_256_replication_stability"

          $files = @(
            "replication_stability_detail.csv",
            "replication_stability_markets.csv",
            "replication_stability_result.json",
            "replication_stability_transitions.csv",
            "replication_stability_manifest.json"
          )

          foreach ($file in $files) {
            $path = Join-Path $inputDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing input: $path"
            }
          }

          Write-Host "[PASS] Script and inputs found"

      - name: Run concentration audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Concentration audit failed"
          }

      - name: Verify result and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os

          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])

          output = (
              root / os.environ["OUTPUT_RELATIVE"]
          )

          version = os.environ["EXPECTED_VERSION"]

          def sha256(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(chunk)

              return digest.hexdigest()

          def read_json(name):
              return json.loads(
                  (output / name).read_text(
                      encoding="utf-8"
                  )
              )

          def read_csv(name):
              with (output / name).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:
                  return list(csv.DictReader(handle))

          result = read_json(
              "concentration_result.json"
          )

          manifest = read_json(
              "concentration_manifest.json"
          )

          if result.get("version") != version:
              raise SystemExit(
                  "Result version mismatch"
              )

          if manifest.get("version") != version:
              raise SystemExit(
                  "Manifest version mismatch"
              )

          if result.get("execution_status") != "PASS":
              raise SystemExit(
                  "Execution not PASS"
              )

          if result.get("overall_decision") != "HOLD":
              raise SystemExit(
                  "Decision mismatch"
              )

          if result.get("markets") != 209:
              raise SystemExit(
                  "Market count mismatch"
              )

          if result.get("positive_both_years") != 26:
              raise SystemExit(
                  "Positive-both mismatch"
              )

          for flag in (
              "independent_oos_proven",
              "profitability_proven",
              "approved_for_live_trading",
          ):
              if result.get(flag) is not False:
                  raise SystemExit(
                      "Unsafe approval flag: " + flag
                  )

          expected_files = {
              "concentration_exclusion.csv",
              "concentration_markets.csv",
              "concentration_result.json",
          }

          hashes = manifest.get("output_sha256")

          if not isinstance(hashes, dict):
              raise SystemExit(
                  "Missing output SHA256"
              )

          if set(hashes) != expected_files:
              raise SystemExit(
                  "Output file set mismatch"
              )

          for filename in sorted(expected_files):
              path = output / filename

              if not path.is_file():
                  raise SystemExit(
                      "Missing output: " + filename
                  )

              if sha256(path) != hashes[filename]:
                  raise SystemExit(
                      "SHA256 mismatch: " + filename
                  )

              print(
                  "[PASS] SHA256:",
                  filename,
              )

          exclusion = read_csv(
              "concentration_exclusion.csv"
          )

          markets = read_csv(
              "concentration_markets.csv"
          )

          if len(exclusion) != 8:
              raise SystemExit(
                  "Exclusion row count mismatch"
              )

          if len(markets) != 209:
              raise SystemExit(
                  "Market row count mismatch"
              )

          expected_exclusions = {
              "0", "1", "3", "5",
              "10", "20", "30", "50",
          }

          actual_exclusions = {
              row["excluded_top_k"]
              for row in exclusion
          }

          if actual_exclusions != expected_exclusions:
              raise SystemExit(
                  "Exclusion set mismatch"
              )

          for row in exclusion:
              excluded = int(
                  row["excluded_top_k"]
              )

              remaining = int(
                  row["remaining_markets"]
              )

              if remaining != 209 - excluded:
                  raise SystemExit(
                      "Remaining count mismatch"
                  )

              if row["decision"] != "HOLD":
                  raise SystemExit(
                      "Unexpected decision"
                  )

          base = next(
              row for row in exclusion
              if row["excluded_top_k"] == "0"
          )

          if int(base["positive_both"]) != 26:
              raise SystemExit(
                  "Base replication mismatch"
              )

          if abs(
              float(base["remaining_mean_pp"])
              - float(result["base_mean_pp"])
          ) > 0.000001:
              raise SystemExit(
                  "Base mean mismatch"
              )

          ranks = [
              int(row["rank"])
              for row in markets
          ]

          if ranks != list(range(1, 210)):
              raise SystemExit(
                  "Market rank mismatch"
              )

          print("[PASS] Clean V003-11")
          print("[PASS] Market concentration")
          print("[PASS] Top-K exclusion sensitivity")
          print("[PASS] SHA256 integrity")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Output verification failed"
          }

      - name: Upload concentration audit results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-concentration-audit-v003-11
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_concentration_audit/concentration_exclusion.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_concentration_audit/concentration_markets.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_concentration_audit/concentration_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_concentration_audit/concentration_manifest.json
          if-no-files-found: error
          retention-days: 14
