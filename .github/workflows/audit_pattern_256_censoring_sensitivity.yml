
name: audit_pattern_256_censoring_sensitivity.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-censoring-sensitivity
  cancel-in-progress: false

jobs:
  censoring-sensitivity:
    name: censoring-sensitivity

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_censoring_sensitivity.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing audit Python script: $script"
          }

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          py -c "import pandas; print('Pandas PASS')"

          if ($LASTEXITCODE -ne 0) {
            throw "Pandas unavailable"
          }

          py -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig')); print('Syntax PASS')" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          $source = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_event_gap_integrity"

          $required = @(
            "gap_integrity_events.csv",
            "gap_integrity_summary.csv",
            "gap_integrity_result.json",
            "gap_integrity_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $source $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required source file missing: $path"
            }
          }

          Write-Host "[PASS] Environment verified"

      - name: Execute censoring sensitivity audit
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_censoring_sensitivity.py"

          $log = Join-Path `
            $env:RUNNER_TEMP `
            "censoring_sensitivity_diagnostics.log"

          $output = @()
          $exitCode = 1

          try {
            $output = @(
              & py -u $script --root $env:DATA_ROOT 2>&1
            )

            $exitCode = $LASTEXITCODE

            foreach ($line in $output) {
              Write-Host ([string]$line)
            }

            $output |
              ForEach-Object { [string]$_ } |
              Out-File `
                -LiteralPath $log `
                -Encoding utf8

          } catch {
            $message = $_.Exception.ToString()

            Write-Host "[ERROR] $message"

            $message |
              Out-File `
                -LiteralPath $log `
                -Append `
                -Encoding utf8

            $exitCode = 1
          }

          if ($exitCode -ne 0) {
            throw "Python audit failed with exit code $exitCode"
          }

          Write-Host "[PASS] Python audit completed"

      - name: Verify output and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Python audit did not succeed"
          }

          $folder = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_censoring_sensitivity"

          $resultPath = Join-Path `
            $folder `
            "censoring_result.json"

          $manifestPath = Join-Path `
            $folder `
            "censoring_manifest.json"

          foreach ($path in @($resultPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing report: $path"
            }
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($r.execution -ne "PASS") {
            throw "Audit result is not PASS"
          }

          if ($m.execution -ne "PASS") {
            throw "Manifest is not PASS"
          }

          if ($r.version -ne "Clean V002") {
            throw "Unexpected result version"
          }

          if ($m.version -ne "Clean V002") {
            throw "Unexpected manifest version"
          }

          if ($r.audited_event_records -ne 252600) {
            throw "Event count mismatch"
          }

          if ($r.group_count -ne 27) {
            throw "Group count mismatch"
          }

          if ($r.market_timeframe_groups -le 0 -or
              $r.market_timeframe_groups -gt 870) {
            throw "Market group count invalid"
          }

          $o = $r.overall

          $total = (
            [long]$o.hits +
            [long]$o.misses +
            [long]$o.gap_censored +
            [long]$o.end_censored
          )

          if ($total -ne 252600) {
            throw "Outcome accounting mismatch"
          }

          if ($o.hits -ne 14062 -or
              $o.misses -ne 218617 -or
              $o.gap_censored -ne 19235 -or
              $o.end_censored -ne 686) {
            throw "Source outcome totals changed"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Research decision incorrectly changed"
          }

          if ($r.independent_oos_proven -ne $false) {
            throw "Independent OOS incorrectly approved"
          }

          if ($r.train_approved -ne $false) {
            throw "Training incorrectly approved"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Live trading incorrectly approved"
          }

          $names = @(
            "censoring_summary.csv",
            "censoring_market.csv",
            "censoring_result.json"
          )

          foreach ($name in $names) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output file: $name"
            }

            $expected = [string]$m.output_sha256.$name

            if ($expected.Length -ne 64) {
              throw "Invalid expected SHA256: $name"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          $summaryPath = Join-Path `
            $folder `
            "censoring_summary.csv"

          $marketPath = Join-Path `
            $folder `
            "censoring_market.csv"

          $summaryRows = @(Import-Csv -LiteralPath $summaryPath)
          $marketRows = @(Import-Csv -LiteralPath $marketPath)

          if ($summaryRows.Count -ne 27) {
            throw "Written summary row count mismatch"
          }

          if ($marketRows.Count -ne $r.market_timeframe_groups) {
            throw "Written market row count mismatch"
          }

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_censoring_sensitivity.py"

          $scriptHash = (
            Get-FileHash `
              -LiteralPath $script `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($scriptHash -ne ([string]$m.script_sha256).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          $sourceManifest = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_event_gap_integrity\gap_integrity_manifest.json"

          $sourceHash = (
            Get-FileHash `
              -LiteralPath $sourceManifest `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($sourceHash -ne ([string]$m.source_manifest_sha256).ToLowerInvariant()) {
            throw "Source manifest SHA256 mismatch"
          }

          if ($sourceHash -ne ([string]$r.source_manifest_sha256).ToLowerInvariant()) {
            throw "Result source SHA256 mismatch"
          }

          Write-Host "[PASS] All integrity checks passed"

      - name: Publish summary
        if: always()
        run: |
          if ("${{ steps.verify.outcome }}" -ne "success") {
            @"
          ## Pattern 256 Censoring Sensitivity - FAILED

          | Check | Result |
          |---|---|
          | Python execution | ${{ steps.audit.outcome }} |
          | Verification | ${{ steps.verify.outcome }} |
          | Research decision | HOLD |

          Open the Python execution log and
          download the diagnostic artifact.
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

            exit 0
          }

          $folder = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_censoring_sensitivity"

          $resultPath = Join-Path `
            $folder `
            "censoring_result.json"

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $o = $r.overall

          @"
          ## Pattern 256 Censoring Sensitivity

          | Check | Result |
          |---|---|
          | Version | $($r.version) |
          | Execution | $($r.execution) |
          | Events | $($r.audited_event_records) |
          | Groups | $($r.group_count) |
          | Market groups | $($r.market_timeframe_groups) |
          | Hits | $($o.hits) |
          | Misses | $($o.misses) |
          | Gap censored | $($o.gap_censored) |
          | End censored | $($o.end_censored) |
          | Censoring rate | $($o.censoring_rate_pct)% |
          | Pessimistic rate | $($o.pessimistic_hit_rate_pct)% |
          | Observed rate | $($o.observed_hit_rate_pct)% |
          | Optimistic rate | $($o.optimistic_hit_rate_pct)% |
          | Uncertainty width | $($o.uncertainty_width_pp) pp |
          | Independent OOS | False |
          | Research decision | HOLD |

          ### Sensitivity by timeframe and period

          | Timeframe | Period | Hours | Events | Censored | Lower % | Observed % | Upper % | Status |
          |---|---|---:|---:|---:|---:|---:|---:|---|
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

          $summaryPath = Join-Path `
            $folder `
            "censoring_summary.csv"

          $rows = Import-Csv -LiteralPath $summaryPath

          foreach ($s in $rows) {
            "| $($s.timeframe) | $($s.period) | $($s.horizon_hours) | $($s.events) | $($s.censored_total) | $($s.pessimistic_hit_rate_pct) | $($s.observed_hit_rate_pct) | $($s.optimistic_hit_rate_pct) | $($s.status) |" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8
          }

          @"

          **Research decision: HOLD.**

          Bounds are sensitivity scenarios,
          not statistical confidence intervals.

          Independent OOS, profitability and
          executable trade fills remain unproven.
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      - name: Upload verified reports
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-censoring-sensitivity-v002
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_censoring_sensitivity\censoring_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_censoring_sensitivity\censoring_summary.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_censoring_sensitivity\censoring_market.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_censoring_sensitivity\censoring_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: always() && steps.audit.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-censoring-diagnostics
          path: |
            ${{ runner.temp }}\censoring_sensitivity_diagnostics.log
          if-no-files-found: warn
          retention-days: 14

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Censoring sensitivity audit execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Censoring sensitivity audit verification failed"
          }

          Write-Host "[PASS] Censoring sensitivity Clean V002"
          Write-Host "Research decision: HOLD"
