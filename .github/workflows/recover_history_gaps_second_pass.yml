                      )
                  ).strip()


                  if not timestamp:

                      raise SystemExit(
                          f"[FAIL] Empty AFTER timestamp: {relative}"
                      )


                  if timestamp in after_map:

                      raise SystemExit(
                          f"[FAIL] Duplicate AFTER timestamp: "
                          f"{relative} {timestamp}"
                      )


                  after_map[
                      timestamp
                  ] = row


              missing_existing = (
                  set(before_map)
                  - set(after_map)
              )


              if missing_existing:

