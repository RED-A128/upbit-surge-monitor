      # ======================================================
      # 16. AFTER SHA256
      # ======================================================

      - name: 16 - Record production AFTER SHA256
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path

          root = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )

          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          rows = []

          for timeframe in (
              "h1",
              "h4",
              "d1",
          ):

              directory = (
                  root / timeframe
              )

              files = sorted(
                  directory.glob("*.csv")
              )

              if len(files) != 290:

                  raise SystemExit(
                      f"[FAIL] {timeframe} expected 290, "
                      f"found {len(files)}"
                  )

              for path in files:

                  with path.open(
                      "r",
                      encoding="utf-8-sig",
                      newline="",
                  ) as handle:

                      row_count = max(
                          0,
                          sum(1 for _ in handle) - 1,
                      )

                  rows.append(
                      {
                          "timeframe": timeframe,
                          "market": path.stem,
                          "relative_path":
                              path.relative_to(root).as_posix(),
                          "rows": row_count,
                          "size": path.stat().st_size,
                          "sha256": sha256_file(path),
                      }
                  )

          if len(rows) != 870:

              raise SystemExit(
                  f"[FAIL] AFTER inventory expected 870, "
                  f"found {len(rows)}"
              )

          output = Path(
              "_production_after_snapshot.csv"
          )

          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "relative_path",
                      "rows",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()
              writer.writerows(rows)

          print("[PASS] AFTER inventory = 870.")
          print("[PASS] AFTER SHA256 recorded = 870/870.")
          '@ | Set-Content `
