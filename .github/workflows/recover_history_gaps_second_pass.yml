          )

          required_true = (
              "missing_candle_insert_only",
          )

          failures = []

          for key in required_false:

              if safety.get(key) is not False:

                  failures.append(
                      f"{key} expected False, "
                      f"got {safety.get(key)!r}"
                  )

          for key in required_true:

              if safety.get(key) is not True:

                  failures.append(
                      f"{key} expected True, "
                      f"got {safety.get(key)!r}"
                  )

          if failures:

              for item in failures:
                  print("[FAIL]", item)

              raise SystemExit(1)

          failed = int(
              summary.get(
