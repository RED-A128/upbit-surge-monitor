# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/recover_history_gaps_second_pass.yml
#
# Clean V001
# ============================================================
#
# PURPOSE
#
#   Execute REAL production second-pass historical gap recovery.
#
#   This workflow writes ONLY missing candles into:
#
#     C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv
#
#
# SAFETY CONTRACT
#
#   Existing candle overwrite : FORBIDDEN
#   OHLCV file deletion       : FORBIDDEN
#   OHLCV row deletion        : FORBIDDEN
#   Missing candle insertion  : ENABLED
#   Real Upbit API            : ENABLED
#
#   Feature build             : DISABLED
#   256 detector              : DISABLED
#   Future labels             : DISABLED
#   Prediction                : DISABLED
#   Trading                   : DISABLED
#
#   Git reset                 : DISABLED
#   Git clean                 : DISABLED
#   Git commit                : DISABLED
#   Git push                  : DISABLED
#
# IMPORTANT
#
#   BEFORE production recovery:
#     - Validate 870 OHLCV files
#     - Record SHA256
#     - Create full read-only comparison backup
#     - Generate/validate second-pass plan
#
#   AFTER production recovery:
#     - Verify file inventory remains 870
#     - Verify no file disappeared
#     - Verify no row disappeared
#     - Verify every existing candle remained identical
#     - Verify newly inserted timestamps were authorized targets
#     - Verify recovery result safety contract
#     - Verify checkpoint
#
#   Post-Recovery Audit is intentionally the NEXT workflow stage.
#
# ============================================================

name: recover_history_gaps_second_pass.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-history-gaps-second-pass-production
  cancel-in-progress: false

jobs:

  recover-history-gaps-second-pass:

    name: recover_history_gaps_second_pass.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"

      LOCAL_PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      LOCAL_DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor\data'
      LOCAL_PRODUCTION_OHLCV: 'C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv'

      LOCAL_AUDIT_REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\history_gap_recovery_audit'
      LOCAL_RETRY_CANDIDATE_FILE: 'C:\Users\USER\Documents\upbit-surge-monitor\data\recovery\history_gap_recovery_retry_candidates.csv'

      EXPECTED_MARKETS: "290"
      EXPECTED_TIMEFRAMES: "3"
      EXPECTED_OHLCV_FILES: "870"

      PRODUCTION_BACKUP_ROOT: '_production_second_pass_before'

    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 02. INFORMATION
      # ======================================================

      - name: 02 - Show production recovery information
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "PRODUCTION SECOND-PASS RECOVERY"
          Write-Host "Clean V001"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Production project:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT"

          Write-Host ""
          Write-Host "Production OHLCV:"
          Write-Host "  $env:LOCAL_PRODUCTION_OHLCV"

          Write-Host ""
          Write-Host "Expected:"
          Write-Host "  Markets     : $env:EXPECTED_MARKETS"
          Write-Host "  Timeframes  : $env:EXPECTED_TIMEFRAMES"
          Write-Host "  OHLCV files : $env:EXPECTED_OHLCV_FILES"

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "SAFETY"
          Write-Host "------------------------------------------------------------"

          Write-Host "Existing candle overwrite : FORBIDDEN"
          Write-Host "OHLCV deletion             : FORBIDDEN"
          Write-Host "Missing candle insertion   : ENABLED"
          Write-Host "Real Upbit API             : ENABLED"
          Write-Host "Feature build              : DISABLED"
          Write-Host "256 detector               : DISABLED"
          Write-Host "Future labels              : DISABLED"
          Write-Host "Prediction                 : DISABLED"
          Write-Host "Trading                    : DISABLED"
          Write-Host "Git reset                  : DISABLED"
          Write-Host "Git clean                  : DISABLED"
          Write-Host "Git commit                 : DISABLED"
          Write-Host "Git push                   : DISABLED"

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # 03. PYTHON
      # ======================================================

      - name: 03 - Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host "[PASS] Python available."


      # ======================================================
      # 04. DEPENDENCIES
      # ======================================================

      - name: 04 - Install dependencies
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "requirements.txt") {

              py -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "requirements.txt installation failed."
              }
          }
          else {

              py -m pip install "requests>=2.32,<3"

              if ($LASTEXITCODE -ne 0) {
                  throw "requests installation failed."
              }
          }

          py -c "import requests; print('requests', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to import requests."
          }

          Write-Host "[PASS] Dependencies available."


      # ======================================================
      # 05. SOURCE PROGRAMS
      # ======================================================

      - name: 05 - Verify production source programs
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $required) {

              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Required source program missing: $file"
              }

              if ((Get-Item -LiteralPath $file).Length -le 0) {
                  throw "Required source program empty: $file"
              }

              Write-Host "[PASS] $file"
          }

          py -m py_compile plan_history_gap_retry.py

          if ($LASTEXITCODE -ne 0) {
              throw "Planner Python syntax validation failed."
          }

          py -m py_compile recover_history_gaps_second_pass.py

          if ($LASTEXITCODE -ne 0) {
              throw "Recovery Python syntax validation failed."
          }

          Write-Host "[PASS] Source programs valid."


      # ======================================================
      # 06. PRODUCTION INPUTS
      # ======================================================

      - name: 06 - Validate persistent production inputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VALIDATE PRODUCTION INPUTS"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:LOCAL_PROJECT_ROOT -PathType Container)) {
              throw "Production project root missing: $env:LOCAL_PROJECT_ROOT"
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_PRODUCTION_OHLCV -PathType Container)) {
              throw "Production OHLCV root missing: $env:LOCAL_PRODUCTION_OHLCV"
          }

          $required = @(
              $env:LOCAL_RETRY_CANDIDATE_FILE,
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_summary.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_detail.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_result.json")
          )

          foreach ($path in $required) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required production input missing: $path"
              }

              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Required production input empty: $path"
              }

              Write-Host "[PASS] $path"
          }

          py -c "import csv,sys; p=sys.argv[1]; f=open(p,encoding='utf-8-sig',newline=''); r=csv.DictReader(f); fields=list(r.fieldnames or []); rows=list(r); f.close(); assert fields, 'retry candidate CSV header missing'; print('[PASS] retry candidate CSV parsed'); print('[INFO] rows:',len(rows))" "$env:LOCAL_RETRY_CANDIDATE_FILE"

          if ($LASTEXITCODE -ne 0) {
              throw "Retry candidate CSV validation failed."
          }

          $auditJson = Join-Path `
              $env:LOCAL_AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_result.json"

          py -c "import json,sys; data=json.load(open(sys.argv[1],encoding='utf-8-sig')); assert isinstance(data,dict); print('[PASS] Audit JSON parsed')" "$auditJson"

          if ($LASTEXITCODE -ne 0) {
              throw "Audit result JSON validation failed."
          }

          Write-Host "[PASS] Production inputs valid."


      # ======================================================
      # 07. PRODUCTION INVENTORY + BEFORE SNAPSHOT
      # ======================================================

      - name: 07 - Validate 870 production OHLCV files and record BEFORE snapshot
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["LOCAL_PRODUCTION_OHLCV"])

          expected_markets = int(os.environ["EXPECTED_MARKETS"])
          expected_total = int(os.environ["EXPECTED_OHLCV_FILES"])

          timeframes = ("h1", "h4", "d1")

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          records = []
          market_sets = {}

          for timeframe in timeframes:

              directory = root / timeframe

              if not directory.is_dir():
                  raise SystemExit(
                      f"[FAIL] Missing production directory: {directory}"
                  )

              files = sorted(directory.glob("*.csv"))

              print(f"{timeframe}: {len(files)} files")

              if len(files) != expected_markets:
                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, found {len(files)}"
                  )

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              for path in files:

                  with path.open(
                      "r",
                      encoding="utf-8-sig",
                      newline="",
                  ) as handle:

                      row_count = max(
                          0,
                          sum(1 for _ in handle) - 1,
                      )

                  records.append(
                      {
                          "timeframe": timeframe,
                          "market": path.stem,
                          "relative_path":
                              path.relative_to(root).as_posix(),
                          "rows": row_count,
                          "size": path.stat().st_size,
                          "sha256": sha256_file(path),
                      }
                  )

          if len(records) != expected_total:
              raise SystemExit(
                  f"[FAIL] Expected {expected_total} OHLCV files, "
                  f"found {len(records)}"
              )

          reference = market_sets["h1"]

          for timeframe in ("h4", "d1"):

              if market_sets[timeframe] != reference:
                  raise SystemExit(
                      f"[FAIL] Market set mismatch: {timeframe}"
                  )

          output = Path("_production_before_snapshot.csv")

          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "relative_path",
                      "rows",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()
              writer.writerows(records)

          print()
          print("Markets     :", len(reference))
          print("OHLCV files :", len(records))
          print()
          print("[PASS] Production inventory = 870.")
          print("[PASS] BEFORE SHA256 recorded = 870/870.")
          '@ | Set-Content `
              -LiteralPath "_production_before_snapshot.py" `
              -Encoding UTF8

          py _production_before_snapshot.py
          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_production_before_snapshot.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Production BEFORE snapshot failed."
          }


      # ======================================================
      # 08. FULL SAFETY BACKUP
      # ======================================================

      - name: 08 - Create verified full BEFORE backup
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "CREATE FULL PRODUCTION BEFORE BACKUP"
          Write-Host "============================================================"

          $backupRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PRODUCTION_BACKUP_ROOT

          if (Test-Path -LiteralPath $backupRoot) {

              Remove-Item `
                  -LiteralPath $backupRoot `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $backupRoot `
              -Force |
              Out-Null

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $source = Join-Path `
                  $env:LOCAL_PRODUCTION_OHLCV `
                  $timeframe

              $destination = Join-Path `
                  $backupRoot `
                  $timeframe

              New-Item `
                  -ItemType Directory `
                  -Path $destination `
                  -Force |
                  Out-Null

              Copy-Item `
                  -Path (Join-Path $source "*.csv") `
                  -Destination $destination `
                  -Force
          }

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path

          production = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )

          backup = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / os.environ["PRODUCTION_BACKUP_ROOT"]
          )

          baseline = Path(
              "_production_before_snapshot.csv"
          )

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          with baseline.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              rows = list(csv.DictReader(handle))

          if len(rows) != 870:
              raise SystemExit(
                  f"[FAIL] BEFORE baseline expected 870 rows, "
                  f"found {len(rows)}"
              )

          failures = []

          for row in rows:

              relative = row["relative_path"]

              production_path = (
                  production / Path(relative)
              )

              backup_path = (
                  backup / Path(relative)
              )

              if not backup_path.is_file():
                  failures.append(
                      f"missing:{relative}"
                  )
                  continue

              if (
                  sha256_file(production_path)
                  != row["sha256"]
              ):
                  failures.append(
                      f"production_changed:{relative}"
                  )

              if (
                  sha256_file(backup_path)
                  != row["sha256"]
              ):
                  failures.append(
                      f"backup_mismatch:{relative}"
                  )

          backup_files = list(
              backup.glob("*/*.csv")
          )

          if len(backup_files) != 870:
              raise SystemExit(
                  f"[FAIL] Backup expected 870 files, "
                  f"found {len(backup_files)}"
              )

          if failures:

              for item in failures[:100]:
                  print("[FAIL]", item)

              raise SystemExit(1)

          print("[PASS] Production remained unchanged during backup.")
          print("[PASS] Backup inventory = 870.")
          print("[PASS] Production -> backup SHA256 = 870/870.")
          '@ | Set-Content `
              -LiteralPath "_verify_production_backup.py" `
              -Encoding UTF8

          py _verify_production_backup.py
          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_verify_production_backup.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Production backup verification failed."
          }


      # ======================================================
      # 09. GENERATE PRODUCTION PLAN
      # ======================================================

      - name: 09 - Generate production second-pass plan
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "GENERATE PRODUCTION SECOND-PASS PLAN"
          Write-Host "============================================================"

          Push-Location $env:LOCAL_PROJECT_ROOT

          try {

              py "$env:GITHUB_WORKSPACE\plan_history_gap_retry.py"

              $exitCode = $LASTEXITCODE
          }
          finally {

              Pop-Location
          }

          if ($exitCode -ne 0) {
              throw "Production second-pass planner failed with exit code $exitCode."
          }

          $targets = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_targets.csv"

          $plan = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_plan.json"

          foreach ($path in @($targets, $plan)) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Planner output missing: $path"
              }

              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Planner output empty: $path"
              }

              Write-Host "[PASS] $path"
          }

          Write-Host "[PASS] Production second-pass plan generated."


      # ======================================================
      # 10. VALIDATE TARGET CONTRACT
      # ======================================================

      - name: 10 - Validate production second-pass target contract
        run: |
          $ErrorActionPreference = "Stop"

          $targetFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_targets.csv"

          $planFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_plan.json"

          @'
          import csv
          import json
          import os
          from pathlib import Path

          target_file = Path(
              os.environ["TARGET_FILE"]
          )

          plan_file = Path(
              os.environ["PLAN_FILE"]
          )

          with target_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(handle)
              fields = list(reader.fieldnames or [])
              rows = list(reader)

          normalized = {
              str(name).strip().lower(): name
              for name in fields
          }

          if "classification" not in normalized:
              raise SystemExit(
                  "[FAIL] classification column missing."
              )

          classification_column = normalized[
              "classification"
          ]

          invalid = []

          for index, row in enumerate(
              rows,
              start=2,
          ):

              value = str(
                  row.get(
                      classification_column,
                      "",
                  )
              ).strip()

              if value != "READY_SECOND_PASS":

                  invalid.append(
                      (index, value)
                  )

          if invalid:

              print(
                  "[FAIL] Unauthorized target classifications:"
              )

              for item in invalid[:50]:
                  print(item)

              raise SystemExit(1)

          with plan_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              plan = json.load(handle)

          if not isinstance(plan, dict):
              raise SystemExit(
                  "[FAIL] Plan JSON root is not object."
              )

          if (
              str(plan.get("program", "")).strip()
              !=
              "plan_history_gap_retry.py"
          ):
              raise SystemExit(
                  "[FAIL] Unexpected planner program."
              )

          if (
              str(plan.get("version", "")).strip()
              !=
              "Clean V001"
          ):
              raise SystemExit(
                  "[FAIL] Unexpected planner version."
              )

          print("Target rows :", len(rows))
          print()
          print("[PASS] Target contract valid.")
          print("[PASS] Every target is READY_SECOND_PASS.")
          print("[PASS] Planner program/version valid.")
          '@ | Set-Content `
              -LiteralPath "_validate_production_targets.py" `
              -Encoding UTF8

          $env:TARGET_FILE = $targetFile
          $env:PLAN_FILE = $planFile

          py _validate_production_targets.py
          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_validate_production_targets.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Production target contract validation failed."
          }


      # ======================================================
      # 11. REAL API
      # ======================================================

      - name: 11 - Verify real Upbit API
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import requests

          response = requests.get(
              "https://api.upbit.com/v1/candles/minutes/60",
              params={
                  "market": "KRW-BTC",
                  "count": 1,
              },
              timeout=15,
              headers={
                  "Accept": "application/json",
                  "User-Agent":
                      "Upbit-Surge-Monitor-Production-Recovery",
              },
          )

          print(
              "HTTP status:",
              response.status_code,
          )

          if response.status_code != 200:
              raise SystemExit(
                  "[FAIL] Upbit API unavailable: "
                  + response.text[:500]
              )

          payload = response.json()

          if (
              not isinstance(payload, list)
              or
              len(payload) < 1
          ):
              raise SystemExit(
                  "[FAIL] Unexpected Upbit API response."
              )

          if (
              "candle_date_time_utc"
              not in payload[0]
          ):
              raise SystemExit(
                  "[FAIL] candle_date_time_utc missing."
              )

          print(
              "Latest UTC candle:",
              payload[0]["candle_date_time_utc"],
          )

          print("[PASS] Real Upbit API available.")
          '@ | Set-Content `
              -LiteralPath "_production_api_test.py" `
              -Encoding UTF8

          py _production_api_test.py
          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_production_api_test.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Production API connectivity validation failed."
          }


      # ======================================================
      # 12. FINAL PRE-EXECUTION GUARD
      # ======================================================

      - name: 12 - Final pre-execution production safety guard
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "FINAL PRE-EXECUTION SAFETY GUARD"
          Write-Host "============================================================"

          $backupRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PRODUCTION_BACKUP_ROOT

          $productionCount = (
              Get-ChildItem `
                  -LiteralPath $env:LOCAL_PRODUCTION_OHLCV `
                  -Filter "*.csv" `
                  -Recurse `
                  -File
          ).Count

          $backupCount = (
              Get-ChildItem `
                  -LiteralPath $backupRoot `
                  -Filter "*.csv" `
                  -Recurse `
                  -File
          ).Count

          if ($productionCount -ne 870) {
              throw "Production OHLCV inventory changed before execution: $productionCount"
          }

          if ($backupCount -ne 870) {
              throw "Production backup inventory invalid: $backupCount"
          }

          Write-Host "[PASS] Production OHLCV = 870."
          Write-Host "[PASS] BEFORE backup = 870."
          Write-Host "[PASS] Planner validated."
          Write-Host "[PASS] API validated."
          Write-Host ""
          Write-Host "[READY] Production second-pass recovery may execute."


      # ======================================================
      # 13. PRODUCTION SECOND-PASS RECOVERY
      # ======================================================

      - name: 13 - Execute PRODUCTION second-pass recovery
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "PRODUCTION SECOND-PASS RECOVERY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[SAFETY] Existing candle overwrite: FORBIDDEN"
          Write-Host "[SAFETY] OHLCV deletion            : FORBIDDEN"
          Write-Host "[SAFETY] Missing candle insertion  : ENABLED"
          Write-Host ""

          Push-Location $env:LOCAL_PROJECT_ROOT

          try {

              py "$env:GITHUB_WORKSPACE\recover_history_gaps_second_pass.py"

              $exitCode = $LASTEXITCODE
          }
          finally {

              Pop-Location
          }

          if ($exitCode -ne 0) {
              throw "Production second-pass recovery failed with exit code $exitCode."
          }

          Write-Host ""
          Write-Host "[PASS] Production second-pass recovery execution completed."


      # ======================================================
      # 14. RESULT CONTRACT
      # ======================================================

      - name: 14 - Validate production recovery result
        run: |
          $ErrorActionPreference = "Stop"

          $resultFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "reports\history_gap_second_pass_recovery\history_gap_second_pass_recovery_result.json"

          if (-not (Test-Path -LiteralPath $resultFile -PathType Leaf)) {
              throw "Production recovery result missing: $resultFile"
          }

          $env:PRODUCTION_RESULT_FILE = $resultFile

          @'
          import json
          import os
          from pathlib import Path

          path = Path(
              os.environ["PRODUCTION_RESULT_FILE"]
          )

          with path.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              result = json.load(handle)

          if (
              result.get("program")
              !=
              "recover_history_gaps_second_pass.py"
          ):
              raise SystemExit(
                  "[FAIL] Unexpected recovery program."
              )

          if (
              result.get("version")
              !=
              "Clean V001"
