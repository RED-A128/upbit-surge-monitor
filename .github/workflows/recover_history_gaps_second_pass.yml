      # ======================================================
      # 15. VERIFY PRODUCTION DATA SAFETY
      # ======================================================

      - name: 15 - Verify existing candles unchanged and only authorized timestamps inserted
        run: |
          $ErrorActionPreference = "Stop"

          $resultFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "reports\history_gap_second_pass_recovery\history_gap_second_pass_recovery_result.json"

          $targetFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_targets.csv"

          $env:PRODUCTION_RESULT_FILE = $resultFile
          $env:PRODUCTION_TARGET_FILE = $targetFile

          @'
          import csv
          import json
          import os
          from pathlib import Path

          before_root = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / os.environ["PRODUCTION_BACKUP_ROOT"]
          )

          after_root = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )

          result_file = Path(
              os.environ["PRODUCTION_RESULT_FILE"]
          )

          target_file = Path(
              os.environ["PRODUCTION_TARGET_FILE"]
          )

          def read_csv(path):

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:

                  reader = csv.DictReader(handle)

                  fields = list(
                      reader.fieldnames or []
                  )

                  rows = list(reader)

              return fields, rows

          def timestamp_column(fields):

              normalized = {
                  str(name).strip().lower(): name
                  for name in fields
              }

              candidates = (
                  "timestamp",
                  "datetime",
                  "date_time",
                  "candle_date_time_utc",
                  "time",
                  "date",
              )

              for candidate in candidates:

                  if candidate in normalized:
                      return normalized[candidate]

              raise RuntimeError(
                  "Unable to detect timestamp column."
              )

          before_files = {
              path.relative_to(before_root).as_posix(): path
              for path in before_root.glob("*/*.csv")
          }

          after_files = {
              path.relative_to(after_root).as_posix(): path
              for path in after_root.glob("*/*.csv")
          }

          if len(before_files) != 870:
              raise SystemExit(
                  f"[FAIL] BEFORE inventory != 870: "
                  f"{len(before_files)}"
              )

          if len(after_files) != 870:
              raise SystemExit(
                  f"[FAIL] AFTER inventory != 870: "
                  f"{len(after_files)}"
              )

          if set(before_files) != set(after_files):

              removed = sorted(
                  set(before_files)
                  - set(after_files)
              )

              added = sorted(
                  set(after_files)
                  - set(before_files)
              )

              print("Removed files:", removed[:50])
              print("Added files  :", added[:50])

              raise SystemExit(
                  "[FAIL] Production OHLCV file set changed."
              )

          with result_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              result = json.load(handle)

          authorized_changed_files = set()

          for item in result.get(
              "changed_files",
              [],
          ):

              timeframe = str(
                  item.get("timeframe", "")
              ).strip()

              market = str(
                  item.get("market", "")
              ).strip()

              if timeframe and market:

                  authorized_changed_files.add(
                      f"{timeframe}/{market}.csv"
                  )

          changed_files = []
          total_existing = 0
          total_inserted = 0

          for relative in sorted(before_files):

              before_path = before_files[relative]
              after_path = after_files[relative]

              before_fields, before_rows = read_csv(
                  before_path
              )

              after_fields, after_rows = read_csv(
                  after_path
              )

              before_ts = timestamp_column(
                  before_fields
              )

              after_ts = timestamp_column(
                  after_fields
              )

              before_map = {}

              for row in before_rows:

                  timestamp = str(
                      row.get(before_ts, "")
                  ).strip()

                  if not timestamp:
                      raise SystemExit(
                          f"[FAIL] Empty BEFORE timestamp: "
                          f"{relative}"
                      )

                  if timestamp in before_map:
                      raise SystemExit(
                          f"[FAIL] Duplicate BEFORE timestamp: "
                          f"{relative} {timestamp}"
                      )

                  before_map[timestamp] = row

              after_map = {}

              for row in after_rows:

                  timestamp = str(
                      row.get(after_ts, "")
                  ).strip()

                  if not timestamp:
                      raise SystemExit(
                          f"[FAIL] Empty AFTER timestamp: "
                          f"{relative}"
                      )

                  if timestamp in after_map:
                      raise SystemExit(
                          f"[FAIL] Duplicate AFTER timestamp: "
                          f"{relative} {timestamp}"
                      )

                  after_map[timestamp] = row

              missing_existing = (
                  set(before_map)
                  - set(after_map)
              )

              if missing_existing:

                  raise SystemExit(
                      f"[FAIL] Existing candles disappeared: "
                      f"{relative} "
                      f"{sorted(missing_existing)[:10]}"
                  )

              common_columns = [
                  name
                  for name in before_fields
                  if name in after_fields
              ]

              for timestamp, before_row in before_map.items():

                  after_row = after_map[timestamp]

                  for column in common_columns:

                      before_value = str(
                          before_row.get(column, "")
                      )

                      after_value = str(
                          after_row.get(column, "")
                      )

                      if before_value != after_value:

                          raise SystemExit(
                              "[FAIL] Existing candle modified: "
                              f"{relative} "
                              f"timestamp={timestamp} "
                              f"column={column} "
                              f"before={before_value!r} "
                              f"after={after_value!r}"
                          )

                  total_existing += 1

              inserted = (
                  set(after_map)
                  - set(before_map)
              )

              if inserted:

                  changed_files.append(relative)
                  total_inserted += len(inserted)

              elif (
                  before_path.read_bytes()
                  !=
                  after_path.read_bytes()
              ):

                  raise SystemExit(
                      "[FAIL] File changed without inserted timestamp: "
                      f"{relative}"
                  )

          unexpected_changed_files = (
              set(changed_files)
              - authorized_changed_files
          )

          if unexpected_changed_files:

              print(
                  "[FAIL] Unexpected changed files:"
              )

              for item in sorted(
                  unexpected_changed_files
              )[:100]:

                  print("  ", item)

              raise SystemExit(1)

          print("OHLCV files checked    :", len(after_files))
          print("Existing rows checked  :", total_existing)
          print("Changed files detected :", len(changed_files))
          print("Inserted timestamps    :", total_inserted)
          print()

          print("[PASS] Production OHLCV inventory remains 870.")
          print("[PASS] No OHLCV file disappeared.")
          print("[PASS] No existing timestamp disappeared.")
          print("[PASS] No existing candle value changed.")
          print("[PASS] No duplicate timestamp detected.")
          print("[PASS] Only authorized recovery files changed.")
          '@ | Set-Content `
