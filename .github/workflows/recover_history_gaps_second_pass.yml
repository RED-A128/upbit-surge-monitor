      # 24. AFTER SNAPSHOT
      # ======================================================

      - name: 24 - Record production OHLCV AFTER recovery snapshot
        run: |
          $ErrorActionPreference = "Stop"


          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          rows = []


          for timeframe in ("h1", "h4", "d1"):

              directory = root / timeframe
              files = sorted(directory.glob("*.csv"))


              if len(files) != 290:
                  raise SystemExit(
                      f"[FAIL] {timeframe} expected 290, "
                      f"found {len(files)}"
                  )


              for path in files:

                  with path.open(
                      "r",
                      encoding="utf-8-sig",
                      newline="",
                  ) as handle:

                      row_count = max(
                          0,
                          sum(1 for _ in handle) - 1,
                      )


                  rows.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem,

                          "relative_path":
                              path.relative_to(root).as_posix(),

                          "rows":
                              row_count,

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(rows) != 870:
              raise SystemExit(
                  f"[FAIL] AFTER inventory expected 870, "
                  f"found {len(rows)}"
              )


          output = Path("_production_after_snapshot.csv")


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "relative_path",
                      "rows",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()
              writer.writerows(rows)


          print("[PASS] AFTER inventory = 870.")
          print("[PASS] AFTER SHA256 recorded = 870/870.")
          '@ | Set-Content `
              -LiteralPath "_production_after_snapshot.py" `
              -Encoding UTF8


          py _production_after_snapshot.py

          $exitCode = $LASTEXITCODE


          Remove-Item `
              -LiteralPath "_production_after_snapshot.py" `
              -Force `
              -ErrorAction SilentlyContinue


          if ($exitCode -ne 0) {
              throw "Production AFTER snapshot failed."
          }


      # ======================================================
      # 25. VERIFY CHECKPOINT
      # ======================================================

      - name: 25 - Verify production recovery checkpoint
        run: |
          $ErrorActionPreference = "Stop"


          $checkpoint = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "validation\recover_history_gaps_second_pass_checkpoint.json"


          if (-not (Test-Path -LiteralPath $checkpoint -PathType Leaf)) {
              throw "Production recovery checkpoint missing: $checkpoint"
          }


          if ((Get-Item -LiteralPath $checkpoint).Length -le 0) {
              throw "Production recovery checkpoint empty."
          }


          py -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8-sig')); assert isinstance(d,dict); print('[PASS] Recovery checkpoint JSON valid')" "$checkpoint"


          if ($LASTEXITCODE -ne 0) {
              throw "Production recovery checkpoint validation failed."
          }


          Write-Host ""
          Write-Host "[PASS] Production checkpoint exists."
          Write-Host "[PASS] Production checkpoint is valid JSON."


      # ======================================================
      # 26. VERIFY REPORTS
      # ======================================================

      - name: 26 - Verify production recovery reports
        run: |
          $ErrorActionPreference = "Stop"


          $reportRoot = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "reports\history_gap_second_pass_recovery"


          $required = @(
              "history_gap_second_pass_recovery_summary.csv",
              "history_gap_second_pass_recovery_result.json",
              "history_gap_second_pass_before_sha256.csv",
              "history_gap_second_pass_after_sha256.csv"
          )


          foreach ($name in $required) {

              $path = Join-Path `
                  $reportRoot `
                  $name


              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required recovery report missing: $path"
              }


              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Required recovery report empty: $path"
              }


              Write-Host "[PASS] $name"
          }


          $detail = Join-Path `
              $reportRoot `
              "history_gap_second_pass_recovery_detail.csv"


          if (Test-Path -LiteralPath $detail -PathType Leaf) {

              if ((Get-Item -LiteralPath $detail).Length -le 0) {
                  throw "Recovery detail exists but is empty."
              }

              Write-Host "[PASS] history_gap_second_pass_recovery_detail.csv"
          }
          else {

              Write-Host "[INFO] Recovery detail CSV not created."
              Write-Host "[INFO] Valid when no detail rows were produced."
          }


          Write-Host ""
          Write-Host "[PASS] Production recovery report contract valid."


      # ======================================================
      # 27. VERIFY NO FORBIDDEN GIT COMMANDS
      #
      # Exact executable-command patterns only.
      # Safety text such as "Git push : DISABLED" must not
      # create a false positive.
      # ======================================================

      - name: 27 - Verify no forbidden Git commands
        run: |
          $ErrorActionPreference = "Stop"


          $recovery = Join-Path `
              $env:LOCAL_PROJECT_ROOT `
              "recover_history_gaps_second_pass.py"


          $env:RECOVERY_SOURCE_FILE = $recovery


          @'
          import os
          import re
          from pathlib import Path


          path = Path(
              os.environ["RECOVERY_SOURCE_FILE"]
          )


          text = path.read_text(
              encoding="utf-8-sig"
          )


          patterns = {
              "git reset":
                  r"(?im)^\s*(?:os\.system\(|subprocess\..*?)?[\"']?\s*git\s+reset\b",

              "git clean":
                  r"(?im)^\s*(?:os\.system\(|subprocess\..*?)?[\"']?\s*git\s+clean\b",

              "git commit":
                  r"(?im)^\s*(?:os\.system\(|subprocess\..*?)?[\"']?\s*git\s+commit\b",

              "git push":
                  r"(?im)^\s*(?:os\.system\(|subprocess\..*?)?[\"']?\s*git\s+push\b",
          }


          found = []


          for name, pattern in patterns.items():

              if re.search(pattern, text):
                  found.append(name)


          if found:

              print("[FAIL] Forbidden Git command patterns detected:")

              for item in found:
                  print("  ", item)

              raise SystemExit(1)


          print("[PASS] No forbidden Git command patterns detected.")
          '@ | Set-Content `
              -LiteralPath "_verify_forbidden_git.py" `
              -Encoding UTF8


          py _verify_forbidden_git.py

          $exitCode = $LASTEXITCODE


          Remove-Item `
              -LiteralPath "_verify_forbidden_git.py" `
              -Force `
              -ErrorAction SilentlyContinue


          if ($exitCode -ne 0) {
              throw "Forbidden Git command safety validation failed."
          }


      # ======================================================
