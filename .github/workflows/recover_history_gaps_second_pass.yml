# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/recover_history_gaps_second_pass.yml
#
# Clean V002
# ============================================================
#
# PURPOSE
#
#   Execute REAL production second-pass historical gap recovery.
#
#   Production project:
#
#     C:\Users\USER\Documents\upbit-surge-monitor
#
#   Production OHLCV:
#
#     C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv
#
#
# CLEAN V002 FIX
#
#   Clean V001 incorrectly executed:
#
#     GITHUB_WORKSPACE\plan_history_gap_retry.py
#
#   plan_history_gap_retry.py determines PROJECT_ROOT from
#   Path(__file__).resolve().parent.
#
#   Therefore the planner searched:
#
#     actions-runner\_work\...\data\ohlcv
#
#   instead of:
#
#     C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv
#
#
#   Clean V002:
#
#     1. Verifies production Python programs exist.
#     2. Verifies workspace and production program SHA256 match.
#     3. Executes the Python programs FROM production root.
#     4. Uses the production copies of:
#
#          plan_history_gap_retry.py
#          recover_history_gaps_second_pass.py
#
#
# SAFETY CONTRACT
#
#   Existing candle overwrite : FORBIDDEN
#   OHLCV file deletion       : FORBIDDEN
#   OHLCV row deletion        : FORBIDDEN
#   Missing candle insertion  : ENABLED
#   Real Upbit API            : ENABLED
#
#   Feature build             : DISABLED
#   256 detector              : DISABLED
#   Future labels             : DISABLED
#   Prediction                : DISABLED
#   Trading                   : DISABLED
#
#   Git reset                 : DISABLED
#   Git clean                 : DISABLED
#   Git commit                : DISABLED
#   Git push                  : DISABLED
#
# ============================================================

name: recover_history_gaps_second_pass.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-history-gaps-second-pass-production
  cancel-in-progress: false


jobs:

  recover-history-gaps-second-pass:

    name: recover_history_gaps_second_pass.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"

      LOCAL_PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

      LOCAL_DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor\data'

      LOCAL_PRODUCTION_OHLCV: 'C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv'

      LOCAL_AUDIT_REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\history_gap_recovery_audit'

      LOCAL_RETRY_CANDIDATE_FILE: 'C:\Users\USER\Documents\upbit-surge-monitor\data\recovery\history_gap_recovery_retry_candidates.csv'

      EXPECTED_MARKETS: "290"
      EXPECTED_TIMEFRAMES: "3"
      EXPECTED_OHLCV_FILES: "870"

      PRODUCTION_BACKUP_ROOT: '_production_second_pass_before'


    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 02. INFORMATION
      # ======================================================

      - name: 02 - Show production recovery information
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "PRODUCTION SECOND-PASS RECOVERY"
          Write-Host "Clean V002"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "GitHub workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Production project:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT"

          Write-Host ""
          Write-Host "Production OHLCV:"
          Write-Host "  $env:LOCAL_PRODUCTION_OHLCV"

          Write-Host ""
          Write-Host "Expected:"
          Write-Host "  Markets     : $env:EXPECTED_MARKETS"
          Write-Host "  Timeframes  : $env:EXPECTED_TIMEFRAMES"
          Write-Host "  OHLCV files : $env:EXPECTED_OHLCV_FILES"

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "CLEAN V002 PATH FIX"
          Write-Host "------------------------------------------------------------"

          Write-Host "Planner will execute from:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT\plan_history_gap_retry.py"

          Write-Host ""
          Write-Host "Recovery will execute from:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT\recover_history_gaps_second_pass.py"

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "SAFETY"
          Write-Host "------------------------------------------------------------"

          Write-Host "Existing candle overwrite : FORBIDDEN"
          Write-Host "OHLCV deletion             : FORBIDDEN"
          Write-Host "Missing candle insertion   : ENABLED"
          Write-Host "Real Upbit API             : ENABLED"

          Write-Host "Feature build              : DISABLED"
          Write-Host "256 detector               : DISABLED"
          Write-Host "Future labels              : DISABLED"
          Write-Host "Prediction                 : DISABLED"
          Write-Host "Trading                    : DISABLED"

          Write-Host "Git reset                  : DISABLED"
          Write-Host "Git clean                  : DISABLED"
          Write-Host "Git commit                 : DISABLED"
          Write-Host "Git push                   : DISABLED"

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # 03. PYTHON
      # ======================================================

      - name: 03 - Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Python available."


      # ======================================================
      # 04. DEPENDENCIES
      # ======================================================

      - name: 04 - Install dependencies
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "requirements.txt") {

              py -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "requirements.txt installation failed."
              }
          }
          else {

              py -m pip install "requests>=2.32,<3"

              if ($LASTEXITCODE -ne 0) {
                  throw "requests installation failed."
              }
          }

          py -c "import requests; print('requests', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to import requests."
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies available."


      # ======================================================
      # 05. VERIFY WORKSPACE SOURCE PROGRAMS
      # ======================================================

      - name: 05 - Verify workspace source programs
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $required) {

              $path = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $file

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Workspace source program missing: $path"
              }

              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Workspace source program empty: $path"
              }

              Write-Host "[PASS] Workspace source: $path"
          }

          py -m py_compile plan_history_gap_retry.py

          if ($LASTEXITCODE -ne 0) {
              throw "Planner Python syntax validation failed."
          }

          py -m py_compile recover_history_gaps_second_pass.py

          if ($LASTEXITCODE -ne 0) {
              throw "Recovery Python syntax validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Workspace source programs valid."


      # ======================================================
      # 06. VERIFY PRODUCTION SOURCE PROGRAMS
      # ======================================================

      - name: 06 - Verify production source programs and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION PROGRAMS"
          Write-Host "============================================================"

          $programs = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $programs) {

              $workspacePath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $file

              $productionPath = Join-Path `
                  $env:LOCAL_PROJECT_ROOT `
                  $file

              if (-not (Test-Path -LiteralPath $productionPath -PathType Leaf)) {

                  throw "Production source program missing: $productionPath"
              }

              if ((Get-Item -LiteralPath $productionPath).Length -le 0) {

                  throw "Production source program empty: $productionPath"
              }

              $workspaceHash = (
                  Get-FileHash `
                      -LiteralPath $workspacePath `
                      -Algorithm SHA256
              ).Hash

              $productionHash = (
                  Get-FileHash `
                      -LiteralPath $productionPath `
                      -Algorithm SHA256
              ).Hash

              Write-Host ""
              Write-Host "Program:"
              Write-Host "  $file"

              Write-Host "Workspace SHA256:"
              Write-Host "  $workspaceHash"

              Write-Host "Production SHA256:"
              Write-Host "  $productionHash"

              if ($workspaceHash -ne $productionHash) {

                  throw "Workspace/production program SHA256 mismatch: $file"
              }

              Write-Host "[PASS] Workspace/production SHA256 identical."
          }

          Write-Host ""
          Write-Host "[PASS] Production programs are synchronized."


      # ======================================================
      # 07. VERIFY PRODUCTION ROOT CONTRACT
      # ======================================================

      - name: 07 - Verify production root contract
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION ROOT CONTRACT"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:LOCAL_PROJECT_ROOT -PathType Container)) {

              throw "Production project root missing: $env:LOCAL_PROJECT_ROOT"
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_DATA_ROOT -PathType Container)) {

              throw "Production data root missing: $env:LOCAL_DATA_ROOT"
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_PRODUCTION_OHLCV -PathType Container)) {

              throw "Production OHLCV root missing: $env:LOCAL_PRODUCTION_OHLCV"
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $path = Join-Path `
                  $env:LOCAL_PRODUCTION_OHLCV `
                  $timeframe

              if (-not (Test-Path -LiteralPath $path -PathType Container)) {

                  throw "Production OHLCV timeframe missing: $path"
              }

              Write-Host "[PASS] $path"
          }

          $planner = Join-Path `
              $env:LOCAL_PROJECT_ROOT `
              "plan_history_gap_retry.py"

          $recovery = Join-Path `
              $env:LOCAL_PROJECT_ROOT `
              "recover_history_gaps_second_pass.py"

          Write-Host ""
          Write-Host "Planner:"
          Write-Host "  $planner"

          Write-Host ""
          Write-Host "Recovery:"
          Write-Host "  $recovery"

          Write-Host ""
          Write-Host "[PASS] Production root contract valid."


      # ======================================================
      # 08. VALIDATE PRODUCTION INPUTS
      # ======================================================

      - name: 08 - Validate persistent production inputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VALIDATE PRODUCTION INPUTS"
          Write-Host "============================================================"

          $required = @(
              $env:LOCAL_RETRY_CANDIDATE_FILE,
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_summary.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_detail.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_result.json")
          )

          foreach ($path in $required) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {

                  throw "Required production input missing: $path"
              }

              if ((Get-Item -LiteralPath $path).Length -le 0) {

                  throw "Required production input empty: $path"
              }

              Write-Host "[PASS] $path"
          }

          $auditJson = Join-Path `
              $env:LOCAL_AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_result.json"

          py -c "import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding='utf-8-sig')); assert isinstance(d,dict); print('[PASS] Audit JSON parsed')" "$auditJson"

          if ($LASTEXITCODE -ne 0) {

              throw "Audit JSON validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Production inputs valid."


      # ======================================================
      # 09. BEFORE SNAPSHOT
      # ======================================================

      - name: 09 - Validate 870 production OHLCV files and record BEFORE snapshot
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )

          expected_markets = int(
              os.environ["EXPECTED_MARKETS"]
          )

          expected_total = int(
              os.environ["EXPECTED_OHLCV_FILES"]
          )

          timeframes = (
              "h1",
              "h4",
              "d1",
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          records = []

          market_sets = {}


          for timeframe in timeframes:

              directory = (
                  root
                  / timeframe
              )

              if not directory.is_dir():

                  raise SystemExit(
                      f"[FAIL] Missing production directory: {directory}"
                  )

              files = sorted(
                  directory.glob("*.csv")
              )

              print(
                  f"{timeframe}: {len(files)} files"
              )

              if len(files) != expected_markets:

                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, "
                      f"found {len(files)}"
                  )

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              for path in files:

                  with path.open(
                      "r",
                      encoding="utf-8-sig",
                      newline="",
                  ) as handle:

                      row_count = max(
                          0,
                          sum(
                              1
                              for _ in handle
                          )
                          - 1,
                      )

                  records.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem,

                          "relative_path":
                              path.relative_to(
                                  root
                              ).as_posix(),

                          "rows":
                              row_count,

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(records) != expected_total:

              raise SystemExit(
                  f"[FAIL] Expected {expected_total} OHLCV files, "
                  f"found {len(records)}"
              )


          reference = market_sets["h1"]


          for timeframe in (
              "h4",
              "d1",
          ):

              if market_sets[timeframe] != reference:

                  raise SystemExit(
                      f"[FAIL] Market set mismatch: {timeframe}"
                  )


          output = Path(
              "_production_before_snapshot.csv"
          )


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "relative_path",
                      "rows",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()

              writer.writerows(
                  records
              )


          print()
          print(
              "Markets     :",
              len(reference),
          )
          print(
              "OHLCV files :",
              len(records),
          )
          print()

          print(
              "[PASS] Production inventory = 870."
          )

          print(
              "[PASS] BEFORE SHA256 recorded = 870/870."
          )
          '@ | Set-Content `
              -LiteralPath "_production_before_snapshot.py" `
              -Encoding UTF8

          py _production_before_snapshot.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_production_before_snapshot.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Production BEFORE snapshot failed."
          }


      # ======================================================
      # 10. FULL BEFORE BACKUP
      # ======================================================

      - name: 10 - Create verified full BEFORE backup
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "CREATE FULL PRODUCTION BEFORE BACKUP"
          Write-Host "============================================================"

          $backupRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PRODUCTION_BACKUP_ROOT

          if (Test-Path -LiteralPath $backupRoot) {

              Remove-Item `
                  -LiteralPath $backupRoot `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $backupRoot `
              -Force |
              Out-Null


          foreach ($timeframe in @("h1", "h4", "d1")) {

              $source = Join-Path `
                  $env:LOCAL_PRODUCTION_OHLCV `
                  $timeframe

              $destination = Join-Path `
                  $backupRoot `
                  $timeframe

              New-Item `
                  -ItemType Directory `
                  -Path $destination `
                  -Force |
                  Out-Null

              Copy-Item `
                  -Path (Join-Path $source "*.csv") `
                  -Destination $destination `
                  -Force
          }


          $backupCount = (
              Get-ChildItem `
                  -LiteralPath $backupRoot `
                  -Filter "*.csv" `
                  -Recurse `
                  -File
          ).Count


          if ($backupCount -ne 870) {

              throw "Production BEFORE backup expected 870 files, found $backupCount"
          }


          Write-Host ""
          Write-Host "[PASS] Full BEFORE backup = 870 files."


      # ======================================================
      # 11. VERIFY BACKUP SHA256
      # ======================================================

      - name: 11 - Verify full BEFORE backup SHA256
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          production = Path(
              os.environ["LOCAL_PRODUCTION_OHLCV"]
          )

          backup = (
              Path(
                  os.environ["GITHUB_WORKSPACE"]
              )
              / os.environ[
                  "PRODUCTION_BACKUP_ROOT"
              ]
          )

          baseline = Path(
              "_production_before_snapshot.csv"
          )


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          with baseline.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              rows = list(
                  csv.DictReader(handle)
              )


          if len(rows) != 870:

              raise SystemExit(
                  "[FAIL] BEFORE baseline is not 870."
              )


          checked = 0


          for row in rows:

              relative = row[
                  "relative_path"
              ]

              expected_hash = row[
                  "sha256"
              ]


              production_path = (
                  production
                  / Path(relative)
              )

              backup_path = (
                  backup
                  / Path(relative)
              )


              if not production_path.is_file():

                  raise SystemExit(
                      f"[FAIL] Production file missing: {relative}"
                  )


              if not backup_path.is_file():

                  raise SystemExit(
                      f"[FAIL] Backup file missing: {relative}"
                  )


              production_hash = sha256_file(
                  production_path
              )

              backup_hash = sha256_file(
                  backup_path
              )


              if production_hash != expected_hash:

                  raise SystemExit(
                      f"[FAIL] Production changed during backup: {relative}"
                  )


              if backup_hash != expected_hash:

                  raise SystemExit(
                      f"[FAIL] Backup SHA256 mismatch: {relative}"
                  )


              checked += 1


          print(
              "SHA256 verified:",
              checked,
          )

          print()

          print(
              "[PASS] Production -> backup SHA256 = 870/870."
          )
          '@ | Set-Content `
              -LiteralPath "_verify_production_backup.py" `
              -Encoding UTF8

          py _verify_production_backup.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_verify_production_backup.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {

              throw "Production backup SHA256 validation failed."
          }


      # ======================================================
      # 12. GENERATE PRODUCTION PLAN
      #
      # Clean V002 critical fix:
      #
      # DO NOT execute GITHUB_WORKSPACE copy.
      #
      # plan_history_gap_retry.py determines PROJECT_ROOT
      # from __file__.
      #
      # Therefore execute the PRODUCTION copy.
      # ======================================================

      - name: 12 - Generate production second-pass plan
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "GENERATE PRODUCTION SECOND-PASS PLAN"
          Write-Host "Clean V002 PATH FIX"
          Write-Host "============================================================"

          $planner = Join-Path `
              $env:LOCAL_PROJECT_ROOT `
              "plan_history_gap_retry.py"

          Write-Host ""
          Write-Host "Executing:"
          Write-Host "  $planner"
          Write-Host ""

          Push-Location `
              $env:LOCAL_PROJECT_ROOT

          try {

              py ".\plan_history_gap_retry.py"

              $exitCode = $LASTEXITCODE
          }
          finally {

              Pop-Location
          }


          if ($exitCode -ne 0) {

              throw "Production second-pass planner failed with exit code $exitCode."
          }


          $targets = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_targets.csv"

          $plan = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_plan.json"


          foreach ($path in @($targets, $plan)) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {

                  throw "Planner output missing: $path"
              }


              if ((Get-Item -LiteralPath $path).Length -le 0) {

                  throw "Planner output empty: $path"
              }


              Write-Host "[PASS] $path"
          }


          Write-Host ""
          Write-Host "[PASS] Production second-pass plan generated."


      # ======================================================
      # 13. VALIDATE TARGET CONTRACT
      # ======================================================

      - name: 13 - Validate production second-pass target contract
        run: |
          $ErrorActionPreference = "Stop"

          $targetFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_targets.csv"

          $planFile = Join-Path `
              $env:LOCAL_DATA_ROOT `
              "recovery\history_gap_second_pass_plan.json"

          $env:TARGET_FILE = $targetFile
          $env:PLAN_FILE = $planFile


          @'
          import csv
          import json
          import os
          from pathlib import Path


          target_file = Path(
              os.environ["TARGET_FILE"]
          )

          plan_file = Path(
              os.environ["PLAN_FILE"]
          )


          with target_file.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              reader = csv.DictReader(
                  handle
              )

              fields = list(
                  reader.fieldnames
                  or []
              )

              rows = list(
                  reader
              )


          normalized = {
              str(name).strip().lower():
                  name
              for name in fields
          }


          if "classification" not in normalized:

              raise SystemExit(
                  "[FAIL] classification column missing."
              )


          classification_column = normalized[
              "classification"
          ]


          invalid = []


          for index, row in enumerate(
              rows,
              start=2,
          ):

              value = str(
                  row.get(
                      classification_column,
                      "",
                  )
              ).strip()


              if value != "READY_SECOND_PASS":

                  invalid.append(
                      (
                          index,
                          value,
                      )
                  )


          if invalid:

              print(
                  "[FAIL] Unauthorized target classifications:"
              )

              for item in invalid[:50]:

                  print(
                      item
                  )

              raise SystemExit(1)


          with plan_file.open(
              "r",
              encoding="utf-8-sig",
          ) as handle:

              plan = json.load(
                  handle
              )


          if not isinstance(
              plan,
              dict,
          ):

              raise SystemExit(
                  "[FAIL] Plan JSON root is not object."
              )


          if (
              str(
                  plan.get(
                      "program",
                      "",
                  )
              ).strip()
              !=
              "plan_history_gap_retry.py"
          ):

              raise SystemExit(
                  "[FAIL] Unexpected planner program."
              )


          if (
              str(
                  plan.get(
                      "version",
                      "",
                  )
              ).strip()
              !=
              "Clean V001"
          ):

              raise SystemExit(
                  "[FAIL] Unexpected planner version."
              )


          print(
              "Target rows:",
              len(rows),
          )

          print()

          print(
