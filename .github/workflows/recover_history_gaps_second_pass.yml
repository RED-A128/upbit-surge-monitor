              }

              Write-Host "[PASS] history_gap_second_pass_recovery_detail.csv"
          }
          else {

              Write-Host "[INFO] Recovery detail CSV not created."
              Write-Host "[INFO] Valid when no detail rows were produced."
          }


          Write-Host ""
          Write-Host "[PASS] Production recovery report contract valid."


      # ======================================================
      # 23. VERIFY NO FORBIDDEN GIT OPERATIONS
      # ======================================================

      - name: 23 - Verify no forbidden Git operations
        run: |
          $ErrorActionPreference = "Stop"


          $recovery = Join-Path `
              $env:LOCAL_PROJECT_ROOT `
              "recover_history_gaps_second_pass.py"


          $text = (
              Get-Content `
                  -LiteralPath $recovery `
                  -Raw
          ).ToLowerInvariant()


          $forbidden = @(
              "git reset --hard",
              "git clean -",
              "git commit",
              "git push"
          )


          foreach ($value in $forbidden) {

              if ($text.Contains($value)) {

                  throw "Forbidden Git operation detected in recovery program: $value"
              }
          }


          Write-Host "[PASS] No forbidden Git reset/clean/commit/push operation detected."


