          Write-Host "[PASS] Second-pass target contract validated."
          Write-Host "[PASS] Real Upbit API validated."

          Write-Host ""
          Write-Host "[PASS] Recovery executed from PRODUCTION project root."
          Write-Host "[PASS] Production OHLCV AFTER inventory = 870."
          Write-Host "[PASS] No OHLCV file disappeared."
          Write-Host "[PASS] No existing timestamp disappeared."
          Write-Host "[PASS] Existing candle values remained unchanged."
