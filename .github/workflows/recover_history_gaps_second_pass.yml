# ============================================================
# Upbit Surge Monitor
#
# .github/workflows/recover_history_gaps_second_pass.yml
#
# Clean V003
# ============================================================
#
# PURPOSE
#
#   Execute REAL production second-pass historical gap recovery.
#
# PRODUCTION ROOT
#
#   C:\Users\USER\Documents\upbit-surge-monitor
#
# PRODUCTION OHLCV
#
#   C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv
#
#
# CLEAN V003 FIX
#
#   Clean V002 expected these source files to already exist
#   inside LOCAL_PROJECT_ROOT:
#
#     plan_history_gap_retry.py
#     recover_history_gaps_second_pass.py
#
#   That assumption was incorrect.
#
#   Clean V003:
#
#     1. Checkout latest GitHub source.
#     2. Validate workspace Python source.
#     3. Safely synchronize ONLY the two required Python
#        programs into LOCAL_PROJECT_ROOT.
#     4. Verify workspace <-> production SHA256.
#     5. Never synchronize data/.
#     6. Never overwrite/delete production OHLCV during sync.
#     7. Execute planner from LOCAL_PROJECT_ROOT.
#     8. Execute recovery from LOCAL_PROJECT_ROOT.
#     9. Verify existing candles remain unchanged.
#
#
# SAFETY CONTRACT
#
#   Existing candle overwrite : FORBIDDEN
#   OHLCV file deletion       : FORBIDDEN
#   OHLCV row deletion        : FORBIDDEN
#   Missing candle insertion  : ENABLED
#   Real Upbit API            : ENABLED
#
#   Feature build             : DISABLED
#   256 detector              : DISABLED
#   Future labels             : DISABLED
#   Prediction                : DISABLED
#   Trading                   : DISABLED
#
#   Git reset                 : DISABLED
#   Git clean                 : DISABLED
#   Git commit                : DISABLED
#   Git push                  : DISABLED
#
# ============================================================

name: recover_history_gaps_second_pass.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-history-gaps-second-pass-production
  cancel-in-progress: false


jobs:

  recover-history-gaps-second-pass:

    name: recover_history_gaps_second_pass.yml

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    env:

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"

      LOCAL_PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

      LOCAL_DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor\data'

      LOCAL_PRODUCTION_OHLCV: 'C:\Users\USER\Documents\upbit-surge-monitor\data\ohlcv'

      LOCAL_AUDIT_REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\history_gap_recovery_audit'

      LOCAL_RETRY_CANDIDATE_FILE: 'C:\Users\USER\Documents\upbit-surge-monitor\data\recovery\history_gap_recovery_retry_candidates.csv'

      EXPECTED_MARKETS: "290"
      EXPECTED_TIMEFRAMES: "3"
      EXPECTED_OHLCV_FILES: "870"

      PRODUCTION_BACKUP_ROOT: '_production_second_pass_before'


    steps:

      # ======================================================
      # 01. CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 02. INFORMATION
      # ======================================================

      - name: 02 - Show production recovery information
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "PRODUCTION SECOND-PASS RECOVERY"
          Write-Host "Clean V003"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "GitHub workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Production project:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT"

          Write-Host ""
          Write-Host "Production OHLCV:"
          Write-Host "  $env:LOCAL_PRODUCTION_OHLCV"

          Write-Host ""
          Write-Host "Expected:"
          Write-Host "  Markets     : $env:EXPECTED_MARKETS"
          Write-Host "  Timeframes  : $env:EXPECTED_TIMEFRAMES"
          Write-Host "  OHLCV files : $env:EXPECTED_OHLCV_FILES"

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "CLEAN V003 SOURCE SYNCHRONIZATION"
          Write-Host "------------------------------------------------------------"

          Write-Host "GitHub source:"
          Write-Host "  plan_history_gap_retry.py"
          Write-Host "  recover_history_gaps_second_pass.py"

          Write-Host ""
          Write-Host "Production execution copies:"
          Write-Host "  $env:LOCAL_PROJECT_ROOT\plan_history_gap_retry.py"
          Write-Host "  $env:LOCAL_PROJECT_ROOT\recover_history_gaps_second_pass.py"

          Write-Host ""
          Write-Host "Only these two Python programs may be synchronized."
          Write-Host "Production data/ is NEVER synchronized from workspace."

          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host "SAFETY"
          Write-Host "------------------------------------------------------------"

          Write-Host "Existing candle overwrite : FORBIDDEN"
          Write-Host "OHLCV deletion             : FORBIDDEN"
          Write-Host "Missing candle insertion   : ENABLED"
          Write-Host "Real Upbit API             : ENABLED"

          Write-Host "Feature build              : DISABLED"
          Write-Host "256 detector               : DISABLED"
          Write-Host "Future labels              : DISABLED"
          Write-Host "Prediction                 : DISABLED"
          Write-Host "Trading                    : DISABLED"

          Write-Host "Git reset                  : DISABLED"
          Write-Host "Git clean                  : DISABLED"
          Write-Host "Git commit                 : DISABLED"
          Write-Host "Git push                   : DISABLED"

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # 03. PYTHON
      # ======================================================

      - name: 03 - Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python launcher 'py' is unavailable."
          }

          Write-Host ""
          Write-Host "[PASS] Python available."


      # ======================================================
      # 04. DEPENDENCIES
      # ======================================================

      - name: 04 - Install dependencies
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "requirements.txt") {

              py -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "requirements.txt installation failed."
              }
          }
          else {

              py -m pip install "requests>=2.32,<3"

              if ($LASTEXITCODE -ne 0) {
                  throw "requests installation failed."
              }
          }

          py -c "import requests; print('requests', requests.__version__)"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to import requests."
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies available."


      # ======================================================
      # 05. VERIFY WORKSPACE SOURCE
      # ======================================================

      - name: 05 - Verify workspace source programs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY WORKSPACE SOURCE PROGRAMS"
          Write-Host "============================================================"

          $required = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $required) {

              $path = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $file

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Workspace source program missing: $path"
              }

              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Workspace source program empty: $path"
              }

              Write-Host "[PASS] $path"
          }

          Push-Location $env:GITHUB_WORKSPACE

          try {

              py -m py_compile ".\plan_history_gap_retry.py"

              if ($LASTEXITCODE -ne 0) {
                  throw "Planner Python syntax validation failed."
              }

              py -m py_compile ".\recover_history_gaps_second_pass.py"

              if ($LASTEXITCODE -ne 0) {
                  throw "Recovery Python syntax validation failed."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "[PASS] Workspace source programs valid."


      # ======================================================
      # 06. VERIFY PRODUCTION ROOT BEFORE SOURCE SYNC
      # ======================================================

      - name: 06 - Verify production root before source synchronization
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION ROOT"
          Write-Host "============================================================"

          if (-not (Test-Path -LiteralPath $env:LOCAL_PROJECT_ROOT -PathType Container)) {
              throw "Production project root missing: $env:LOCAL_PROJECT_ROOT"
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_DATA_ROOT -PathType Container)) {
              throw "Production data root missing: $env:LOCAL_DATA_ROOT"
          }

          if (-not (Test-Path -LiteralPath $env:LOCAL_PRODUCTION_OHLCV -PathType Container)) {
              throw "Production OHLCV root missing: $env:LOCAL_PRODUCTION_OHLCV"
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $path = Join-Path `
                  $env:LOCAL_PRODUCTION_OHLCV `
                  $timeframe

              if (-not (Test-Path -LiteralPath $path -PathType Container)) {
                  throw "Production OHLCV timeframe missing: $path"
              }

              Write-Host "[PASS] $path"
          }

          Write-Host ""
          Write-Host "[PASS] Production root valid."
          Write-Host "[PASS] Production data root valid."
          Write-Host "[PASS] Production OHLCV root valid."


      # ======================================================
      # 07. RECORD OHLCV BEFORE SOURCE SYNC
      #
      # Source synchronization must NEVER modify OHLCV.
      # ======================================================

      - name: 07 - Record production OHLCV SHA256 before source synchronization
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(os.environ["LOCAL_PRODUCTION_OHLCV"])
          expected_markets = int(os.environ["EXPECTED_MARKETS"])
          expected_total = int(os.environ["EXPECTED_OHLCV_FILES"])

          timeframes = ("h1", "h4", "d1")


          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          rows = []
          market_sets = {}


          for timeframe in timeframes:

              directory = root / timeframe

              if not directory.is_dir():
                  raise SystemExit(
                      f"[FAIL] Missing production OHLCV directory: {directory}"
                  )

              files = sorted(directory.glob("*.csv"))

              print(f"{timeframe}: {len(files)} files")

              if len(files) != expected_markets:
                  raise SystemExit(
                      f"[FAIL] {timeframe}: expected "
                      f"{expected_markets}, found {len(files)}"
                  )

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              for path in files:

                  rows.append(
                      {
                          "relative_path":
                              path.relative_to(root).as_posix(),

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(rows) != expected_total:
              raise SystemExit(
                  f"[FAIL] Expected {expected_total} files, "
                  f"found {len(rows)}"
              )


          reference = market_sets["h1"]

          for timeframe in ("h4", "d1"):

              if market_sets[timeframe] != reference:
                  raise SystemExit(
                      f"[FAIL] Market set mismatch: {timeframe}"
                  )


          output = Path("_source_sync_before_ohlcv_sha256.csv")

          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "relative_path",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()
              writer.writerows(rows)


          print()
          print("[PASS] Production OHLCV inventory = 870.")
          print("[PASS] Source-sync BEFORE SHA256 = 870/870.")
          '@ | Set-Content `
              -LiteralPath "_source_sync_before.py" `
              -Encoding UTF8

          py _source_sync_before.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_source_sync_before.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Source synchronization BEFORE snapshot failed."
          }


      # ======================================================
      # 08. SYNCHRONIZE ONLY REQUIRED PYTHON PROGRAMS
      #
      # IMPORTANT:
      #
      #   DO NOT copy directories.
      #   DO NOT copy data/.
      #   DO NOT use robocopy /MIR.
      #   DO NOT remove production files.
      #
      # ======================================================

      - name: 08 - Safely synchronize production execution programs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SAFE SOURCE SYNCHRONIZATION"
          Write-Host "Clean V003"
          Write-Host "============================================================"

          $programs = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $programs) {

              $source = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $file

              $destination = Join-Path `
                  $env:LOCAL_PROJECT_ROOT `
                  $file

              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                  throw "Workspace source missing: $source"
              }

              Write-Host ""
              Write-Host "Synchronizing:"
              Write-Host "  FROM: $source"
              Write-Host "  TO  : $destination"

              Copy-Item `
                  -LiteralPath $source `
                  -Destination $destination `
                  -Force

              if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
                  throw "Production execution copy missing after sync: $destination"
              }

              if ((Get-Item -LiteralPath $destination).Length -le 0) {
                  throw "Production execution copy empty after sync: $destination"
              }

              Write-Host "[PASS] Source synchronized."
          }

          Write-Host ""
          Write-Host "[PASS] Only required Python programs synchronized."
          Write-Host "[PASS] data/ was not copied."


      # ======================================================
      # 09. VERIFY SOURCE SHA256
      # ======================================================

      - name: 09 - Verify workspace and production source SHA256
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY SOURCE SHA256"
          Write-Host "============================================================"

          $programs = @(
              "plan_history_gap_retry.py",
              "recover_history_gaps_second_pass.py"
          )

          foreach ($file in $programs) {

              $workspacePath = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $file

              $productionPath = Join-Path `
                  $env:LOCAL_PROJECT_ROOT `
                  $file

              $workspaceHash = (
                  Get-FileHash `
                      -LiteralPath $workspacePath `
                      -Algorithm SHA256
              ).Hash

              $productionHash = (
                  Get-FileHash `
                      -LiteralPath $productionPath `
                      -Algorithm SHA256
              ).Hash

              Write-Host ""
              Write-Host "$file"
              Write-Host "Workspace  : $workspaceHash"
              Write-Host "Production : $productionHash"

              if ($workspaceHash -ne $productionHash) {
                  throw "Workspace/production SHA256 mismatch: $file"
              }

              Write-Host "[PASS] SHA256 identical."
          }

          Write-Host ""
          Write-Host "[PASS] Production execution source = GitHub source."


      # ======================================================
      # 10. VERIFY OHLCV UNCHANGED BY SOURCE SYNC
      # ======================================================

      - name: 10 - Verify source synchronization did not modify OHLCV
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(os.environ["LOCAL_PRODUCTION_OHLCV"])
          baseline = Path("_source_sync_before_ohlcv_sha256.csv")


          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          with baseline.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              rows = list(csv.DictReader(handle))


          if len(rows) != 870:
              raise SystemExit(
                  f"[FAIL] Source-sync baseline expected 870, "
                  f"found {len(rows)}"
              )


          checked = 0


          for row in rows:

              relative = row["relative_path"]
              expected_hash = row["sha256"]

              path = root / Path(relative)

              if not path.is_file():
                  raise SystemExit(
                      f"[FAIL] OHLCV disappeared during source sync: {relative}"
                  )

              current_hash = sha256_file(path)

              if current_hash != expected_hash:
                  raise SystemExit(
                      f"[FAIL] OHLCV changed during source sync: {relative}"
                  )

              checked += 1


          current_files = list(root.glob("*/*.csv"))

          if len(current_files) != 870:
              raise SystemExit(
                  f"[FAIL] OHLCV inventory changed during source sync: "
                  f"{len(current_files)}"
              )


          print("Verified:", checked)
          print()
          print("[PASS] Source synchronization changed zero OHLCV files.")
          print("[PASS] OHLCV SHA256 unchanged = 870/870.")
          '@ | Set-Content `
              -LiteralPath "_verify_source_sync_ohlcv.py" `
              -Encoding UTF8

          py _verify_source_sync_ohlcv.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_verify_source_sync_ohlcv.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Source synchronization OHLCV safety validation failed."
          }


      # ======================================================
      # 11. VERIFY PRODUCTION PYTHON SYNTAX
      # ======================================================

      - name: 11 - Verify synchronized production Python syntax
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location $env:LOCAL_PROJECT_ROOT

          try {

              py -m py_compile ".\plan_history_gap_retry.py"

              if ($LASTEXITCODE -ne 0) {
                  throw "Production planner syntax validation failed."
              }

              py -m py_compile ".\recover_history_gaps_second_pass.py"

              if ($LASTEXITCODE -ne 0) {
                  throw "Production recovery syntax validation failed."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "[PASS] Production Python syntax valid."


      # ======================================================
      # 12. VALIDATE PERSISTENT AUDIT INPUTS
      # ======================================================

      - name: 12 - Validate persistent production audit inputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VALIDATE PERSISTENT AUDIT INPUTS"
          Write-Host "============================================================"

          $required = @(
              $env:LOCAL_RETRY_CANDIDATE_FILE,
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_summary.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_detail.csv"),
              (Join-Path $env:LOCAL_AUDIT_REPORT_DIR "history_gap_recovery_audit_result.json")
          )

          foreach ($path in $required) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required production audit input missing: $path"
              }

              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Required production audit input empty: $path"
              }

              Write-Host "[PASS] $path"
          }

          $auditJson = Join-Path `
              $env:LOCAL_AUDIT_REPORT_DIR `
              "history_gap_recovery_audit_result.json"

          py -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8-sig')); assert isinstance(d,dict); print('[PASS] Audit JSON parsed')" "$auditJson"

          if ($LASTEXITCODE -ne 0) {
              throw "Audit JSON validation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Persistent production audit inputs valid."


      # ======================================================
      # 13. PRODUCTION BEFORE SNAPSHOT
      # ======================================================

      - name: 13 - Record production OHLCV BEFORE recovery snapshot
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
          from pathlib import Path


          root = Path(os.environ["LOCAL_PRODUCTION_OHLCV"])
          expected_markets = int(os.environ["EXPECTED_MARKETS"])
          expected_total = int(os.environ["EXPECTED_OHLCV_FILES"])

          timeframes = ("h1", "h4", "d1")


          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as handle:

                  while True:

                      chunk = handle.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()


          records = []
          market_sets = {}


          for timeframe in timeframes:

              directory = root / timeframe

              if not directory.is_dir():
                  raise SystemExit(
                      f"[FAIL] Missing production directory: {directory}"
                  )

              files = sorted(directory.glob("*.csv"))

              print(f"{timeframe}: {len(files)} files")

              if len(files) != expected_markets:
                  raise SystemExit(
                      f"[FAIL] {timeframe} expected "
                      f"{expected_markets}, found {len(files)}"
                  )

              market_sets[timeframe] = {
                  path.stem.upper()
                  for path in files
              }

              for path in files:

                  with path.open(
                      "r",
                      encoding="utf-8-sig",
                      newline="",
                  ) as handle:

                      row_count = max(
                          0,
                          sum(1 for _ in handle) - 1,
                      )

                  records.append(
                      {
                          "timeframe":
                              timeframe,

                          "market":
                              path.stem,

                          "relative_path":
                              path.relative_to(root).as_posix(),

                          "rows":
                              row_count,

                          "size":
                              path.stat().st_size,

                          "sha256":
                              sha256_file(path),
                      }
                  )


          if len(records) != expected_total:
              raise SystemExit(
                  f"[FAIL] Expected {expected_total} OHLCV files, "
                  f"found {len(records)}"
              )


          reference = market_sets["h1"]

          for timeframe in ("h4", "d1"):

              if market_sets[timeframe] != reference:
                  raise SystemExit(
                      f"[FAIL] Market set mismatch: {timeframe}"
                  )


          output = Path("_production_before_snapshot.csv")


          with output.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:

              writer = csv.DictWriter(
                  handle,
                  fieldnames=(
                      "timeframe",
                      "market",
                      "relative_path",
                      "rows",
                      "size",
                      "sha256",
                  ),
              )

              writer.writeheader()
              writer.writerows(records)


          print()
          print("Markets     :", len(reference))
          print("OHLCV files :", len(records))
          print()
          print("[PASS] Production inventory = 870.")
          print("[PASS] BEFORE SHA256 recorded = 870/870.")
          '@ | Set-Content `
              -LiteralPath "_production_before_snapshot.py" `
              -Encoding UTF8

          py _production_before_snapshot.py

          $exitCode = $LASTEXITCODE

          Remove-Item `
              -LiteralPath "_production_before_snapshot.py" `
              -Force `
              -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Production BEFORE snapshot failed."
          }


      # ======================================================
      # 14. FULL BEFORE BACKUP
      # ======================================================

      - name: 14 - Create verified full production BEFORE backup
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "CREATE FULL PRODUCTION BEFORE BACKUP"
          Write-Host "============================================================"

          $backupRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PRODUCTION_BACKUP_ROOT

          if (Test-Path -LiteralPath $backupRoot) {

              Remove-Item `
                  -LiteralPath $backupRoot `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $backupRoot `
              -Force |
              Out-Null


          foreach ($timeframe in @("h1", "h4", "d1")) {

              $source = Join-Path `
                  $env:LOCAL_PRODUCTION_OHLCV `
                  $timeframe

              $destination = Join-Path `
                  $backupRoot `
                  $timeframe

              New-Item `
                  -ItemType Directory `
                  -Path $destination `
                  -Force |
                  Out-Null

              Copy-Item `
                  -Path (Join-Path $source "*.csv") `
                  -Destination $destination `
                  -Force
          }


          $backupCount = (
              Get-ChildItem `
                  -LiteralPath $backupRoot `
                  -Filter "*.csv" `
                  -Recurse `
                  -File
          ).Count


          if ($backupCount -ne 870) {
              throw "Production BEFORE backup expected 870 files, found $backupCount"
          }


          Write-Host ""
          Write-Host "[PASS] Full BEFORE backup = 870 files."


      # ======================================================
      # 15. VERIFY BACKUP SHA256
      # ======================================================

      - name: 15 - Verify full production BEFORE backup SHA256
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import os
