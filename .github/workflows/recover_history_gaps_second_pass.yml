              )

              added = sorted(
                  set(after_files)
                  - set(before_files)
              )

              print(
                  "Removed:",
                  removed[:50],
              )

              print(
                  "Added:",
                  added[:50],
              )

              raise SystemExit(
                  "[FAIL] Production OHLCV file set changed."
              )


          checked_files = 0

          checked_existing_rows = 0

          inserted_rows = 0

          changed_files = []


          for relative in sorted(
              before_files
          ):

              before_path = before_files[
                  relative
              ]

              after_path = after_files[
                  relative
              ]


              (
                  before_fields,
                  before_rows,
              ) = read_csv(
                  before_path
              )


              (
                  after_fields,
                  after_rows,
              ) = read_csv(
                  after_path
              )


              before_timestamp = (
                  detect_timestamp_column(
                      before_fields
                  )
              )

              after_timestamp = (
                  detect_timestamp_column(
                      after_fields
                  )
              )


              before_map = {}


              for row in before_rows:

                  timestamp = str(
                      row.get(
                          before_timestamp,
                          "",
                      )
                  ).strip()


                  if not timestamp:

                      raise SystemExit(
