                  reader = csv.DictReader(
                      handle
                  )

                  fields = list(
                      reader.fieldnames
                      or []
                  )

                  rows = list(
                      reader
                  )

              return (
                  fields,
                  rows,
              )


          def detect_timestamp_column(
              fieldnames,
          ):

              normalized = {
                  str(name).strip().lower():
                      name
                  for name in fieldnames
              }


              candidates = (
                  "timestamp",
                  "datetime",
                  "date_time",
                  "candle_date_time_utc",
                  "time",
                  "date",
              )


              for candidate in candidates:

                  if candidate in normalized:

                      return normalized[
                          candidate
                      ]


              raise RuntimeError(
                  "Unable to detect timestamp column."
              )


          before_files = {
              path.relative_to(
                  before_root
              ).as_posix():
                  path
              for path in before_root.glob(
                  "*/*.csv"
              )
          }


          after_files = {
              path.relative_to(
                  after_root
              ).as_posix():
                  path
              for path in after_root.glob(
                  "*/*.csv"
