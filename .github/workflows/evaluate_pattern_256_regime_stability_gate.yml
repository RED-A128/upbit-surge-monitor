name: evaluate_pattern_256_regime_stability_gate.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-regime-stability-gate
  cancel-in-progress: false

jobs:
  regime-stability-gate:
    name: regime-stability-gate

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python validation failed"
          }

      - name: Validate analysis script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_regime_stability_gate.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing analysis script: $script"
          }

          py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          Write-Host "PASS: analysis script"

      - name: Validate source reports
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_robustness"

          foreach ($file in @(
            "regime_robustness_comparison.csv",
            "regime_robustness_result.json",
            "regime_robustness_manifest.json"
          )) {
            $path = Join-Path $sourceDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source report: $path"
            }

            Write-Host "FOUND: $path"
          }

      - name: Run regime stability gate
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "evaluate_pattern_256_regime_stability_gate.py"

          py $script `
            --root "$env:DATA_ROOT" `
            --min-events 30

          if ($LASTEXITCODE -ne 0) {
            throw "Regime stability gate failed"
          }

      - name: Verify output files and SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_stability_gate"

          $sourceDir = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_robustness"

          $csvPath = Join-Path `
            $outputDir `
            "regime_stability_comparison.csv"

          $resultPath = Join-Path `
            $outputDir `
            "regime_stability_result.json"

          $manifestPath = Join-Path `
            $outputDir `
            "regime_stability_manifest.json"

          foreach ($path in @(
            $csvPath,
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $path"
            }
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Unexpected result version"
          }

          if ($manifest.version -ne "Clean V001") {
            throw "Unexpected manifest version"
          }

          if ($result.execution_status -ne "PASS") {
            throw "Execution is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Trading safety validation failed"
          }

          if ($result.statistical_independence_proven -ne $false) {
            throw "Unexpected independence proof"
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Unexpected OOS proof"
          }

          if ($result.profitability_proven -ne $false) {
            throw "Unexpected profitability proof"
          }

          if ($result.comparison_rows -ne 27) {
            throw "Unexpected comparison row count"
          }

          if ($result.source_comparison_cells -ne 54) {
            throw "Unexpected source comparison cell count"
          }

          # Verify output hashes.

          foreach ($file in @(
            "regime_stability_comparison.csv",
            "regime_stability_result.json"
          )) {
            $path = Join-Path $outputDir $file

            $property = `
              $manifest.output_sha256.PSObject.Properties[$file]

            if ($null -eq $property) {
              throw "Missing output hash: $file"
            }

            $expected = (
              [string]$property.Value
            ).Trim().ToLowerInvariant()

            if ($expected -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid output hash: $file"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $file"
            }

            Write-Host "PASS: output SHA256 - $file"
          }

          # Verify input hashes.

          foreach ($file in @(
            "regime_robustness_comparison.csv",
            "regime_robustness_result.json",
            "regime_robustness_manifest.json"
          )) {
            $path = Join-Path $sourceDir $file

            $property = `
              $manifest.input_sha256.PSObject.Properties[$file]

            if ($null -eq $property) {
              throw "Missing input hash: $file"
            }

            $expected = (
              [string]$property.Value
            ).Trim().ToLowerInvariant()

            if ($expected -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid input hash: $file"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Input SHA256 mismatch: $file"
            }

            Write-Host "PASS: input SHA256 - $file"
          }

          # Verify comparison CSV structure.

          $rows = @(
            Import-Csv -LiteralPath $csvPath
          )

          if ($rows.Count -ne 27) {
            throw "CSV comparison row count mismatch"
          }

          $requiredColumns = @(
            "timeframe",
            "horizon",
            "regime",
            "train_only_events",
            "train_both_events",
            "test_only_events",
            "test_both_events",
            "train_uplift_pp",
            "test_uplift_pp",
            "stability_status"
          )

          foreach ($column in $requiredColumns) {
            if (
              $null -eq $rows[0].PSObject.Properties[$column]
            ) {
              throw "Missing CSV column: $column"
            }
          }

          $validStatuses = @(
            "MISSING_PERIOD",
            "MISSING_COMPARISON_GROUP",
            "INSUFFICIENT_SAMPLE",
            "POSITIVE_BOTH_PERIODS",
            "NEGATIVE_BOTH_PERIODS",
            "NEUTRAL_OR_CHANGED",
            "DIRECTION_CHANGED"
          )

          foreach ($row in $rows) {
            if ($row.stability_status -notin $validStatuses) {
              throw "Invalid stability status"
            }
          }

          Write-Host "PASS: output files"
          Write-Host "PASS: input SHA256"
          Write-Host "PASS: output SHA256"
          Write-Host "PASS: comparison structure"
          Write-Host "PASS: research safety"

      - name: Write job summary
        if: success()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_regime_stability_gate\regime_stability_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $summary = $result.summary

          @"
          # Pattern 256 Regime Stability Gate

          | Check | Result |
          |---|---|
          | Execution | $($result.execution_status) |
          | Version | $($result.version) |
          | Source rows | $($result.source_rows) |
          | Source comparison cells | $($result.source_comparison_cells) |
          | Stability comparison rows | $($result.comparison_rows) |
          | Positive in TRAIN and TEST | $($summary.positive_both_periods) |
          | Negative in TRAIN and TEST | $($summary.negative_both_periods) |
          | Direction changed | $($summary.direction_changed) |
          | Insufficient sample | $($summary.insufficient_sample) |
          | Missing period | $($summary.missing_period) |
          | Missing comparison group | $($summary.missing_comparison_group) |
          | Research decision | $($result.research_decision) |
          | Statistical independence proven | $($result.statistical_independence_proven) |
          | Independent OOS proven | $($result.independent_oos_proven) |
          | Profitability proven | $($result.profitability_proven) |
          | Live trading approved | $($result.approved_for_live_trading) |
          | Input SHA256 | Verified |
          | Output SHA256 | Verified |

          ## Research limitations

          - Aggregated observations are not independent proof.
          - Small samples remain insufficient.
          - TRAIN and TEST direction stability is diagnostic only.
          - No live trading approval.
          - No automated trading.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Upload stability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-regime-stability-gate-v001
          path: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_regime_stability_gate\'
          if-no-files-found: warn
          retention-days: 30
