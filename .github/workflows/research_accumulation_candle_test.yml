# ============================================================
# Upbit Surge Monitor
# .github/workflows/research_accumulation_candle_test.yml
# Clean V001
# ============================================================

name: research_accumulation_candle_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research_accumulation_candle_test:
    name: research_accumulation_candle_test.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ======================================================
      # 01 - CHECKOUT
      # ======================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 02 - ENVIRONMENT
      # ======================================================

      - name: 02 - Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "research_accumulation_candle_test.yml"
          Write-Host "Clean V001"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Runner:"
          Write-Host $env:RUNNER_NAME

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Python:"
          py --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python is not available through py launcher."
          }

          Write-Host ""
          Write-Host "Git:"
          git --version

          if ($LASTEXITCODE -ne 0) {
              throw "Git is not available."
          }

          Write-Host ""
          Write-Host "[PASS] Environment validated"


      # ======================================================
      # 03 - VERIFY PROGRAM
      # ======================================================

      - name: 03 - Verify research program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              "research_accumulation_candle.py"

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
              throw "Missing program: $program"
          }

          $resolved = (Resolve-Path -LiteralPath $program).Path

          "RESEARCH_PROGRAM=$resolved" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Program exists"
          Write-Host $resolved


      # ======================================================
      # 04 - PROGRAM IDENTITY
      # ======================================================

      - name: 04 - Verify Clean V001 program markers
        run: |
          $ErrorActionPreference = "Stop"

          $program = $env:RESEARCH_PROGRAM

          if ([string]::IsNullOrWhiteSpace($program)) {
              $program = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "research_accumulation_candle.py"
          }

          $text = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $required = @(
              'PROGRAM_NAME = "research_accumulation_candle.py"',
              'VERSION = "Clean V001"',
              'STAGE = "ACCUMULATION CANDLE INDEPENDENT RESEARCH"',
              'PATTERN_ID = "ACCUMULATION_CANDLE"',
              'PATTERN_NAME_KO = "매집봉"',
              'OHLCV_READ_ONLY = True',
              'FUTURE_CANDLES_ALLOWED = False',
              'NEGATIVE_SHIFT_ALLOWED = False',
              'CENTERED_ROLLING_ALLOWED = False',
              'FUTURE_LABELS_GENERATED = False',
              'FUTURE_RETURNS_GENERATED = False',
              'FUTURE_MAX_GENERATED = False',
              'FUTURE_MIN_GENERATED = False',
              'THIRTY_PERCENT_LABEL_GENERATED = False',
              'BACKTEST_GENERATED = False',
              'PREDICTION_GENERATED = False',
              'TRADING_SIGNAL_GENERATED = False',
              'FINAL_FORMULA_DEFINED = False'
          )

          foreach ($marker in $required) {

              if (-not $text.Contains($marker)) {
                  throw "Required marker missing: $marker"
              }

              Write-Host "[PASS] $marker"
          }


      # ======================================================
      # 05 - PYTHON SYNTAX
      # ======================================================

      - name: 05 - Validate Python syntax
        run: |
          $ErrorActionPreference = "Stop"

          $program = $env:RESEARCH_PROGRAM

          if ([string]::IsNullOrWhiteSpace($program)) {
              $program = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "research_accumulation_candle.py"
          }

          & py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
              throw "Python syntax validation failed."
          }

          Write-Host "[PASS] Python syntax valid"


      # ======================================================
      # 06 - STATIC FUTURE INFORMATION SCAN
      # ======================================================

      - name: 06 - Static future-information safety scan
        run: |
          $ErrorActionPreference = "Stop"

          $program = $env:RESEARCH_PROGRAM

          if ([string]::IsNullOrWhiteSpace($program)) {
              $program = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "research_accumulation_candle.py"
          }

          $text = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $forbiddenPatterns = @(
              '\.shift\s*\(\s*-\d+',
              '\.shift\s*\(\s*periods\s*=\s*-\d+',
              'center\s*=\s*True',
              'center\s*=\s*true'
          )

          foreach ($pattern in $forbiddenPatterns) {

              if ($text -match $pattern) {
                  throw "Future-information pattern detected: $pattern"
              }

              Write-Host "[PASS] Not found: $pattern"
          }

          Write-Host ""
          Write-Host "[PASS] Future-information static scan"


      # ======================================================
      # 07 - RESOLVE PRODUCTION ROOT
      # ======================================================

      - name: 07 - Resolve production project root
        run: |
          $ErrorActionPreference = "Stop"

          $candidate = "C:\Users\USER\Documents\upbit-surge-monitor"

          if (-not (Test-Path -LiteralPath $candidate -PathType Container)) {
              throw "Production root missing: $candidate"
          }

          $resolved = (Resolve-Path -LiteralPath $candidate).Path

          $ohlcvRoot = Join-Path $resolved "data\ohlcv"

          if (-not (Test-Path -LiteralPath $ohlcvRoot -PathType Container)) {
              throw "Production OHLCV root missing: $ohlcvRoot"
          }

          "PRODUCTION_ROOT=$resolved" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Production root resolved"
          Write-Host $resolved


      # ======================================================
      # 08 - VALIDATE OHLCV DIRECTORIES
      # ======================================================

      - name: 08 - Validate production OHLCV directories
        run: |
          $ErrorActionPreference = "Stop"

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $totalFiles = 0

          foreach ($timeframe in $timeframes) {

              $directory = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\ohlcv\$timeframe"

              if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
                  throw "Missing OHLCV directory: $directory"
              }

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -Filter "*.csv" `
                      -File
              )

              if ($files.Count -le 0) {
                  throw "No CSV files: $directory"
              }

              $totalFiles += $files.Count

              Write-Host "[PASS] $timeframe CSV count = $($files.Count)"
          }

          if ($totalFiles -le 0) {
              throw "No OHLCV source files."
          }

          Write-Host ""
          Write-Host "[PASS] Total OHLCV files = $totalFiles"


      # ======================================================
      # 09 - PREPARE SNAPSHOT DIRECTORY
      # ======================================================

      - name: 09 - Prepare verification snapshot
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotDir = Join-Path `
              $env:RUNNER_TEMP `
              "research_accumulation_candle_test"

          if (Test-Path -LiteralPath $snapshotDir) {
              Remove-Item `
                  -LiteralPath $snapshotDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $snapshotDir `
              -Force |
              Out-Null

          $resolved = (Resolve-Path -LiteralPath $snapshotDir).Path

          "SNAPSHOT_DIR=$resolved" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Snapshot directory prepared"
          Write-Host $resolved


      # ======================================================
      # 10 - CREATE BEFORE SNAPSHOT
      # ======================================================

      - name: 10 - Snapshot production OHLCV before research
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $snapshotDir = $env:SNAPSHOT_DIR

          if ([string]::IsNullOrWhiteSpace($snapshotDir)) {
              throw "SNAPSHOT_DIR is empty."
          }

          if (-not (Test-Path -LiteralPath $snapshotDir -PathType Container)) {
              throw "Snapshot directory missing: $snapshotDir"
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $root `
                  -Recurse `
                  -Filter "*.csv" `
                  -File |
              Sort-Object FullName
          )

          if ($files.Count -le 0) {
              throw "No production OHLCV CSV files."
          }

          $fileSetPath = Join-Path `
              $snapshotDir `
              "ohlcv_files_before.csv"

          $hashPath = Join-Path `
              $snapshotDir `
              "ohlcv_sha256_before.csv"

          $fileSetRows = @()
          $hashRows = @()

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $root.Length
              ).TrimStart('\')

              $fileSetRows += [PSCustomObject]@{
                  relative_path = $relative
                  size_bytes   = [int64]$file.Length
              }

              $hash = Get-FileHash `
                  -LiteralPath $file.FullName `
                  -Algorithm SHA256

              $hashRows += [PSCustomObject]@{
                  relative_path = $relative
                  size_bytes   = [int64]$file.Length
                  sha256       = $hash.Hash
              }
          }

          $fileSetRows |
              Export-Csv `
                  -LiteralPath $fileSetPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          $hashRows |
              Export-Csv `
                  -LiteralPath $hashPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          if (-not (Test-Path -LiteralPath $fileSetPath -PathType Leaf)) {
              throw "File-set snapshot was not created."
          }

          if (-not (Test-Path -LiteralPath $hashPath -PathType Leaf)) {
              throw "SHA256 snapshot was not created."
          }

          $checkFileSet = @(
              Import-Csv -LiteralPath $fileSetPath
          )

          $checkHash = @(
              Import-Csv -LiteralPath $hashPath
          )

          if ($checkFileSet.Count -ne $files.Count) {
              throw "File-set snapshot count mismatch."
          }

          if ($checkHash.Count -ne $files.Count) {
              throw "SHA256 snapshot count mismatch."
          }

          "SNAPSHOT_READY=1" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Production OHLCV snapshot completed"
          Write-Host "Files: $($files.Count)"


      # ======================================================
      # 11 - RUN RESEARCH
      # ======================================================

      - name: 11 - Run accumulation candle research
        id: research_run
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $program = $env:RESEARCH_PROGRAM

          if ([string]::IsNullOrWhiteSpace($program)) {
              $program = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "research_accumulation_candle.py"
          }

          $exitCode = 999

          try {

              Write-Host "============================================================"
              Write-Host "ACCUMULATION CANDLE INDEPENDENT RESEARCH"
              Write-Host "============================================================"
              Write-Host ""

              Write-Host "Program:"
              Write-Host $program

              Write-Host ""
              Write-Host "Production root:"
              Write-Host $env:PRODUCTION_ROOT

              Write-Host ""

              & py `
                  $program `
                  --project-root "$env:PRODUCTION_ROOT" `
                  --timeframes h1 h4 d1 `
                  --force

              if ($null -eq $LASTEXITCODE) {
                  $exitCode = 998
              }
              else {
                  $exitCode = [int]$LASTEXITCODE
              }
          }
          catch {

              Write-Host "::error::Research execution exception"
              Write-Host $_
              $exitCode = 997
          }
          finally {

              "RESEARCH_EXIT_CODE=$exitCode" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 `
                      -Append

              Write-Host ""
              Write-Host "Research exit code: $exitCode"
          }

          if ($exitCode -ne 0) {
              Write-Host "::error::Research program failed with exit code $exitCode"
              exit 1
          }

          Write-Host "[PASS] Research process completed"


      # ======================================================
      # 12 - VERIFY FILE SET UNCHANGED
      # ======================================================

      - name: 12 - Verify production OHLCV file set unchanged
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:SNAPSHOT_READY -ne "1") {
              throw "Before snapshot was not completed."
          }

          $root = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $beforePath = Join-Path `
              $env:SNAPSHOT_DIR `
              "ohlcv_files_before.csv"

          $afterPath = Join-Path `
              $env:SNAPSHOT_DIR `
              "ohlcv_files_after.csv"

          if (-not (Test-Path -LiteralPath $beforePath -PathType Leaf)) {
              throw "Before file-set snapshot missing."
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $root `
                  -Recurse `
                  -Filter "*.csv" `
                  -File |
              Sort-Object FullName
          )

          $rows = @()

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $root.Length
              ).TrimStart('\')

              $rows += [PSCustomObject]@{
                  relative_path = $relative
                  size_bytes   = [int64]$file.Length
              }
          }

          $rows |
              Export-Csv `
                  -LiteralPath $afterPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          $before = @(
              Import-Csv -LiteralPath $beforePath
          )

          $after = @(
              Import-Csv -LiteralPath $afterPath
          )

          if ($before.Count -ne $after.Count) {
              throw "Production OHLCV file count changed."
          }

          $beforeMap = @{}

          foreach ($row in $before) {
              $beforeMap[$row.relative_path] = $row
          }

          foreach ($row in $after) {

              if (-not $beforeMap.ContainsKey($row.relative_path)) {
                  throw "New OHLCV file detected: $($row.relative_path)"
              }

              $original = $beforeMap[$row.relative_path]

              if (
                  [int64]$original.size_bytes -ne
                  [int64]$row.size_bytes
              ) {
                  throw "OHLCV file size changed: $($row.relative_path)"
              }
          }

          "FILESET_UNCHANGED=1" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Production OHLCV file set unchanged"


      # ======================================================
      # 13 - VERIFY SHA256 UNCHANGED
      # ======================================================

      - name: 13 - Verify production OHLCV SHA256 unchanged
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:SNAPSHOT_READY -ne "1") {
              throw "Before SHA256 snapshot was not completed."
          }

          $root = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $beforePath = Join-Path `
              $env:SNAPSHOT_DIR `
              "ohlcv_sha256_before.csv"

          $afterPath = Join-Path `
              $env:SNAPSHOT_DIR `
              "ohlcv_sha256_after.csv"

          if (-not (Test-Path -LiteralPath $beforePath -PathType Leaf)) {
              throw "Before SHA256 snapshot missing."
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $root `
                  -Recurse `
                  -Filter "*.csv" `
                  -File |
              Sort-Object FullName
          )

          $rows = @()

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $root.Length
              ).TrimStart('\')

              $hash = Get-FileHash `
                  -LiteralPath $file.FullName `
                  -Algorithm SHA256

              $rows += [PSCustomObject]@{
                  relative_path = $relative
                  size_bytes   = [int64]$file.Length
                  sha256       = $hash.Hash
              }
          }

          $rows |
              Export-Csv `
                  -LiteralPath $afterPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          $before = @(
              Import-Csv -LiteralPath $beforePath
          )

          $after = @(
              Import-Csv -LiteralPath $afterPath
          )

          if ($before.Count -ne $after.Count) {
              throw "Production OHLCV SHA256 file count changed."
          }

          $afterMap = @{}

          foreach ($row in $after) {
              $afterMap[$row.relative_path] = $row
          }

          foreach ($row in $before) {

              if (-not $afterMap.ContainsKey($row.relative_path)) {
                  throw "OHLCV file missing after research: $($row.relative_path)"
              }

              $current = $afterMap[$row.relative_path]

              if ($row.sha256 -ne $current.sha256) {
                  throw "OHLCV SHA256 changed: $($row.relative_path)"
              }
          }

          "SHA256_UNCHANGED=1" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "[PASS] Production OHLCV SHA256 unchanged"


      # ======================================================
      # 14 - REQUIRE RESEARCH SUCCESS
      # ======================================================

      - name: 14 - Require research process success
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RESEARCH_EXIT_CODE)) {
              throw "Research exit code was not recorded."
          }

          $exitCode = [int]$env:RESEARCH_EXIT_CODE

          Write-Host "Research exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "Research process failed with exit code $exitCode"
          }

          if ($env:FILESET_UNCHANGED -ne "1") {
              throw "Production OHLCV file-set safety verification failed."
          }

          if ($env:SHA256_UNCHANGED -ne "1") {
              throw "Production OHLCV SHA256 safety verification failed."
          }

          Write-Host "[PASS] Research process success"
          Write-Host "[PASS] OHLCV file set unchanged"
          Write-Host "[PASS] OHLCV SHA256 unchanged"


      # ======================================================
      # 15 - VERIFY OUTPUT FILES
      # ======================================================

      - name: 15 - Verify required research outputs
        run: |
          $ErrorActionPreference = "Stop"

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research"

          $validationDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation"

          $required = @(
              (Join-Path $reportDir "accumulation_candle_research_result.json"),
              (Join-Path $reportDir "accumulation_candle_research_summary.csv"),
              (Join-Path $reportDir "accumulation_candle_research_detail.csv"),
              (Join-Path $reportDir "accumulation_candle_candidates.csv"),
              (Join-Path $reportDir "accumulation_candle_source_manifest.csv"),
              (Join-Path $reportDir "accumulation_candle_research_contract.json"),
              (Join-Path $reportDir "README.txt"),
              (Join-Path $validationDir "research_accumulation_candle_checkpoint.json")
          )

          foreach ($path in $required) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Missing required output: $path"
              }

              Write-Host "[PASS] $path"
          }


      # ======================================================
      # 16 - VALIDATE RESULT JSON
      # ======================================================

      - name: 16 - Validate research result JSON
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research\accumulation_candle_research_result.json"

          $result = Get-Content `
              -LiteralPath $path `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($result.program -ne "research_accumulation_candle.py") {
              throw "Result program mismatch."
          }

          if ($result.version -ne "Clean V001") {
              throw "Result version mismatch."
          }

          if ($result.stage -ne "ACCUMULATION CANDLE INDEPENDENT RESEARCH") {
              throw "Result stage mismatch."
          }

          if ($result.status -ne "PASS") {
              throw "Result status is not PASS."
          }

          if ($result.pattern.id -ne "ACCUMULATION_CANDLE") {
              throw "Pattern ID mismatch."
          }

          if ($result.pattern.independent_research -ne $true) {
              throw "Independent research flag invalid."
          }

          if ($result.pattern.final_formula_defined -ne $false) {
              throw "Final formula must remain undefined."
          }

          if ([int64]$result.processing.files_discovered -le 0) {
              throw "No files discovered."
          }

          if ([int64]$result.processing.files_processed -le 0) {
              throw "No files processed."
          }

          if (
              [int64]$result.processing.files_discovered -ne
              [int64]$result.processing.files_processed
          ) {
              throw "Discovered/processed file count mismatch."
          }

          if ([int64]$result.processing.files_error -ne 0) {
              throw "Research result contains file errors."
          }

          if ([int64]$result.statistics.total_rows -le 0) {
              throw "No research rows."
          }

          if ([int64]$result.statistics.eligible_rows -lt 0) {
              throw "Invalid eligible row count."
          }

          if ([int64]$result.statistics.candidate_rows -lt 0) {
              throw "Invalid candidate row count."
          }

          if ([int64]$result.statistics.strong_candidate_rows -lt 0) {
              throw "Invalid strong candidate row count."
          }

          if (
              [int64]$result.statistics.strong_candidate_rows -gt
              [int64]$result.statistics.candidate_rows
          ) {
              throw "Strong candidates exceed candidates."
          }

          if ($result.future_information.future_candles_used -ne $false) {
              throw "Future candles were used."
          }

          if ($result.future_information.negative_shift_used -ne $false) {
              throw "Negative shift was used."
          }

          if ($result.future_information.centered_rolling_used -ne $false) {
              throw "Centered rolling was used."
          }

          if ($result.future_information.future_labels_generated -ne $false) {
              throw "Future labels were generated."
          }

          if ($result.future_information.future_returns_generated -ne $false) {
              throw "Future returns were generated."
          }

          if ($result.future_information.future_max_generated -ne $false) {
              throw "Future max was generated."
          }

          if ($result.future_information.future_min_generated -ne $false) {
              throw "Future min was generated."
          }

          if ($result.future_information.thirty_percent_label_generated -ne $false) {
              throw "30 percent future label was generated."
          }

          if ($result.safety.ohlcv_read_only -ne $true) {
              throw "OHLCV read-only flag invalid."
          }

          if ($result.safety.source_sha256_unchanged -ne $true) {
              throw "Source SHA256 flag invalid."
          }

          if ($result.safety.prediction_executed -ne $false) {
              throw "Prediction was executed."
          }

          if ($result.safety.trading_executed -ne $false) {
              throw "Trading was executed."
          }

          if ([double]$result.research.maximum_score -ne 100.0) {
              throw "Maximum score must be 100."
          }

          if ([double]$result.research.candidate_threshold -ne 60.0) {
              throw "Candidate threshold must be 60."
          }

          if ([double]$result.research.strong_candidate_threshold -ne 75.0) {
              throw "Strong candidate threshold must be 75."
          }

          $longMa = @(
              $result.research.long_moving_averages |
              ForEach-Object {
                  [int]$_
              }
          )

          foreach ($requiredMa in @(112, 224, 448)) {

              if ($longMa -notcontains $requiredMa) {
                  throw "Required long MA missing: $requiredMa"
              }
          }

          Write-Host "[PASS] Research result JSON validated"


      # ======================================================
      # 17 - VALIDATE CONTRACT
      # ======================================================

      - name: 17 - Validate research contract
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research\accumulation_candle_research_contract.json"

          $contract = Get-Content `
              -LiteralPath $path `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($contract.program -ne "research_accumulation_candle.py") {
              throw "Contract program mismatch."
          }

          if ($contract.version -ne "Clean V001") {
              throw "Contract version mismatch."
          }

          if ($contract.stage -ne "ACCUMULATION CANDLE INDEPENDENT RESEARCH") {
              throw "Contract stage mismatch."
          }

          if ($contract.pattern_id -ne "ACCUMULATION_CANDLE") {
              throw "Contract pattern mismatch."
          }

          if ($contract.final_formula_defined -ne $false) {
              throw "Final formula must remain undefined."
          }

          if ($contract.contract.ohlcv_read_only -ne $true) {
              throw "OHLCV read-only contract invalid."
          }

          if ($contract.contract.future_candles_allowed -ne $false) {
              throw "Future candles must be blocked."
          }

          if ($contract.contract.negative_shift_allowed -ne $false) {
              throw "Negative shift must be blocked."
          }

          if ($contract.contract.centered_rolling_allowed -ne $false) {
              throw "Centered rolling must be blocked."
          }

          if ($contract.contract.future_labels_generated -ne $false) {
              throw "Future labels must be blocked."
          }

          if ($contract.contract.future_returns_generated -ne $false) {
              throw "Future returns must be blocked."
          }

          if ($contract.contract.future_max_generated -ne $false) {
              throw "Future max must be blocked."
          }

          if ($contract.contract.future_min_generated -ne $false) {
              throw "Future min must be blocked."
          }

          if ($contract.contract.thirty_percent_label_generated -ne $false) {
              throw "30 percent labels must be blocked."
          }

          if ($contract.contract.backtest_generated -ne $false) {
              throw "Backtest must not run."
          }

          if ($contract.contract.prediction_generated -ne $false) {
              throw "Prediction must not run."
          }

          if ($contract.contract.trading_signal_generated -ne $false) {
              throw "Trading signal must not run."
          }

          if ([double]$contract.maximum_research_score -ne 100.0) {
              throw "Maximum contract score must be 100."
          }

          if ([double]$contract.candidate_score_threshold -ne 60.0) {
              throw "Candidate threshold mismatch."
          }

          if ([double]$contract.strong_candidate_score_threshold -ne 75.0) {
              throw "Strong candidate threshold mismatch."
          }

          $expected = @(
              "VOLUME_EXPANSION",
              "CANDLE_BODY_STRENGTH",
              "CLOSE_LOCATION",
              "WICK_STRUCTURE",
              "RANGE_EXPANSION",
              "BASE_CONTEXT"
          )

          $actual = @(
              $contract.research_dimensions |
              ForEach-Object {
                  $_.name
              }
          )

          if ($actual.Count -ne $expected.Count) {
              throw "Research dimension count mismatch."
          }

          foreach ($dimension in $expected) {

              if ($actual -notcontains $dimension) {
                  throw "Missing research dimension: $dimension"
              }
          }

          $scoreTotal = 0.0

          foreach ($dimension in $contract.research_dimensions) {
              $scoreTotal += [double]$dimension.max_score
          }

          if ([math]::Abs($scoreTotal - 100.0) -gt 0.000001) {
              throw "Research dimensions do not total 100."
          }

          $maWindows = @(
              $contract.moving_average_windows |
              ForEach-Object {
                  [int]$_
              }
          )

          foreach ($requiredMa in @(112, 224, 448)) {

              if ($maWindows -notcontains $requiredMa) {
                  throw "Contract MA missing: $requiredMa"
              }
          }

          Write-Host "[PASS] Research contract validated"


      # ======================================================
      # 18 - VALIDATE SUMMARY
      # ======================================================

      - name: 18 - Validate research summary CSV
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research\accumulation_candle_research_summary.csv"

          $rows = @(
              Import-Csv -LiteralPath $path
          )

          if ($rows.Count -le 0) {
              throw "Summary CSV is empty."
          }

          $requiredColumns = @(
              "timeframe",
              "market",
              "rows",
              "eligible_rows",
              "candidate_rows",
              "strong_candidate_rows",
              "candidate_rate_pct",
              "strong_candidate_rate_pct",
              "score_mean",
              "score_median",
              "score_p90",
              "score_p95",
              "score_max",
              "status"
          )

          $columns = @(
              $rows[0].PSObject.Properties.Name
          )

          foreach ($column in $requiredColumns) {

              if ($columns -notcontains $column) {
                  throw "Summary column missing: $column"
              }
          }

          foreach ($row in $rows) {

              if ($row.status -ne "PASS") {
                  throw "Summary status is not PASS."
              }

              if ([int64]$row.rows -le 0) {
                  throw "Summary rows invalid."
              }

              if ([int64]$row.eligible_rows -lt 0) {
                  throw "Summary eligible rows invalid."
              }

              if ([int64]$row.candidate_rows -lt 0) {
                  throw "Summary candidate rows invalid."
              }

              if ([int64]$row.strong_candidate_rows -lt 0) {
                  throw "Summary strong candidate rows invalid."
              }

              if (
                  [int64]$row.strong_candidate_rows -gt
                  [int64]$row.candidate_rows
              ) {
                  throw "Strong candidates exceed candidates."
              }

              $scoreMax = [double]$row.score_max

              if ($scoreMax -lt 0.0 -or $scoreMax -gt 100.000001) {
                  throw "Summary score_max outside 0-100."
              }
          }

          Write-Host "[PASS] Summary CSV validated"
          Write-Host "Rows: $($rows.Count)"


      # ======================================================
      # 19 - VALIDATE DETAIL
      # ======================================================

      - name: 19 - Validate research detail CSV
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research\accumulation_candle_research_detail.csv"

          $rows = @(
              Import-Csv -LiteralPath $path
          )

          if ($rows.Count -le 0) {
              throw "Detail CSV is empty."
          }

          $requiredColumns = @(
              "timeframe",
              "market",
              "timestamp",
              "open",
              "high",
              "low",
              "close",
              "volume",
              "is_bullish",
              "is_bearish",
              "is_doji",
              "body_pct_of_range",
              "upper_wick_pct_of_range",
              "lower_wick_pct_of_range",
              "close_location_pct",
              "volume_ratio_prev_20",
              "volume_ratio_prev_60",
              "range_ratio_prev_20",
              "range_ratio_prev_60",
              "ma_112",
              "ma_224",
              "ma_448",
              "ma_reverse_alignment_112_224_448",
              "long_ma_spread_pct",
              "base_width_prev_20_pct",
              "base_width_prev_60_pct",
              "score_volume_expansion",
              "score_candle_body_strength",
              "score_close_location",
              "score_wick_structure",
              "score_range_expansion",
              "score_base_context",
              "accumulation_candle_research_score",
              "accumulation_candle_eligible",
              "accumulation_candle_candidate",
              "accumulation_candle_strong_candidate",
              "accumulation_candle_research_stage"
          )

          $columns = @(
              $rows[0].PSObject.Properties.Name
          )

          foreach ($column in $requiredColumns) {

              if ($columns -notcontains $column) {
                  throw "Detail column missing: $column"
              }
          }

          $allowedTimeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $allowedStages = @(
              "NONE",
              "OBSERVE",
              "CANDIDATE",
              "STRONG"
          )

          foreach ($row in $rows) {

              if ($allowedTimeframes -notcontains $row.timeframe) {
                  throw "Unexpected timeframe: $($row.timeframe)"
              }

              if ([string]::IsNullOrWhiteSpace($row.market)) {
                  throw "Market is empty."
              }

              if ([string]::IsNullOrWhiteSpace($row.timestamp)) {
                  throw "Timestamp is empty."
              }

              if (
                  $allowedStages -notcontains
                  $row.accumulation_candle_research_stage
              ) {
                  throw "Invalid research stage: $($row.accumulation_candle_research_stage)"
              }

              $score = [double]$row.accumulation_candle_research_score

              if ($score -lt 0.0 -or $score -gt 100.000001) {
                  throw "Research score outside 0-100."
              }

              $candidate = (
                  $row.accumulation_candle_candidate -eq "True"
              )

              $strong = (
                  $row.accumulation_candle_strong_candidate -eq "True"
              )

              if ($candidate -and $score -lt 60.0) {
                  throw "Candidate score below 60."
              }

              if ($strong -and $score -lt 75.0) {
                  throw "Strong candidate score below 75."
              }

              if ($strong -and -not $candidate) {
                  throw "Strong candidate is not candidate."
              }
          }

          Write-Host "[PASS] Detail CSV validated"
          Write-Host "Rows: $($rows.Count)"


      # ======================================================
      # 20 - VALIDATE CANDIDATES
      # ======================================================

      - name: 20 - Validate candidate CSV
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research\accumulation_candle_candidates.csv"

          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Candidate CSV missing."
          }

          $rows = @(
              Import-Csv -LiteralPath $path
          )

          if ($rows.Count -eq 0) {

              Write-Host "[PASS] Candidate CSV exists."
              Write-Host "[PASS] Zero candidates allowed."
              exit 0
          }

          foreach ($row in $rows) {

              if ($row.accumulation_candle_candidate -ne "True") {
                  throw "Non-candidate row exists in candidate CSV."
              }

              $score = [double]$row.accumulation_candle_research_score

              if ($score -lt 60.0) {
                  throw "Candidate score below 60."
              }

              if (
                  $row.accumulation_candle_research_stage -notin
                  @("CANDIDATE", "STRONG")
              ) {
                  throw "Invalid candidate stage."
              }
          }

          Write-Host "[PASS] Candidate CSV validated"
          Write-Host "Candidates: $($rows.Count)"


      # ======================================================
      # 21 - VALIDATE MANIFEST
      # ======================================================

      - name: 21 - Validate source manifest
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research\accumulation_candle_source_manifest.csv"

          $rows = @(
              Import-Csv -LiteralPath $path
          )

          if ($rows.Count -le 0) {
              throw "Source manifest is empty."
          }

          foreach ($row in $rows) {

              if ($row.status -ne "PASS") {
                  throw "Manifest contains non-PASS source."
              }

              if ($row.sha256_unchanged -ne "True") {
                  throw "Manifest SHA256 unchanged flag is false."
              }

              if ($row.sha256_before -ne $row.sha256_after) {
                  throw "Manifest SHA256 before/after mismatch."
              }

              if ([int64]$row.original_rows -le 0) {
                  throw "Manifest original_rows invalid."
              }

              if ([int64]$row.valid_rows -le 0) {
                  throw "Manifest valid_rows invalid."
              }
          }

          Write-Host "[PASS] Source manifest validated"
          Write-Host "Sources: $($rows.Count)"


      # ======================================================
      # 22 - VALIDATE CHECKPOINT
      # ======================================================

      - name: 22 - Validate checkpoint
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation\research_accumulation_candle_checkpoint.json"

          $checkpoint = Get-Content `
              -LiteralPath $path `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ([int]$checkpoint.checkpoint_version -ne 1) {
              throw "Checkpoint version mismatch."
          }

          if ($checkpoint.program -ne "research_accumulation_candle.py") {
              throw "Checkpoint program mismatch."
          }

          if ($checkpoint.version -ne "Clean V001") {
              throw "Checkpoint version mismatch."
          }

          if ($checkpoint.pattern_id -ne "ACCUMULATION_CANDLE") {
              throw "Checkpoint pattern mismatch."
          }

          $properties = @(
              $checkpoint.completed_sources.PSObject.Properties
          )

          if ($properties.Count -le 0) {
              throw "Checkpoint contains no sources."
          }

          foreach ($property in $properties) {

              $entry = $property.Value

              if ($entry.status -ne "PASS") {
                  throw "Checkpoint contains failed source: $($property.Name)"
              }

              if ([string]::IsNullOrWhiteSpace($entry.source_sha256)) {
                  throw "Checkpoint source SHA256 missing."
              }
          }

          Write-Host "[PASS] Checkpoint validated"
          Write-Host "Sources: $($properties.Count)"


      # ======================================================
      # 23 - CROSS CHECK
      # ======================================================

      - name: 23 - Cross-check result summary detail candidates
        run: |
          $ErrorActionPreference = "Stop"

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research"

          $result = Get-Content `
              -LiteralPath (
                  Join-Path `
                      $reportDir `
                      "accumulation_candle_research_result.json"
              ) `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          $summary = @(
              Import-Csv `
                  -LiteralPath (
                      Join-Path `
                          $reportDir `
                          "accumulation_candle_research_summary.csv"
                  )
          )

          $detail = @(
              Import-Csv `
                  -LiteralPath (
                      Join-Path `
                          $reportDir `
                          "accumulation_candle_research_detail.csv"
                  )
          )

          $candidates = @(
              Import-Csv `
                  -LiteralPath (
                      Join-Path `
                          $reportDir `
                          "accumulation_candle_candidates.csv"
                  )
          )

          $manifest = @(
              Import-Csv `
                  -LiteralPath (
                      Join-Path `
                          $reportDir `
                          "accumulation_candle_source_manifest.csv"
                  )
          )

          if (
              [int64]$result.statistics.total_rows -ne
              [int64]$detail.Count
          ) {
              throw "Result/detail total mismatch."
          }

          if (
              [int64]$result.statistics.summary_rows -ne
              [int64]$summary.Count
          ) {
              throw "Result/summary count mismatch."
          }

          if (
              [int64]$result.statistics.files_processed -ne
              [int64]$manifest.Count
          ) {
              throw "Result/manifest count mismatch."
          }

          $detailEligible = @(
              $detail |
              Where-Object {
                  $_.accumulation_candle_eligible -eq "True"
              }
          ).Count

          $detailCandidates = @(
              $detail |
              Where-Object {
                  $_.accumulation_candle_candidate -eq "True"
              }
          ).Count

          $detailStrong = @(
              $detail |
              Where-Object {
                  $_.accumulation_candle_strong_candidate -eq "True"
              }
          ).Count

          if (
              [int64]$result.statistics.eligible_rows -ne
              [int64]$detailEligible
          ) {
              throw "Eligible count mismatch."
          }

          if (
              [int64]$result.statistics.candidate_rows -ne
              [int64]$detailCandidates
          ) {
              throw "Candidate count mismatch."
          }

          if (
              [int64]$result.statistics.strong_candidate_rows -ne
              [int64]$detailStrong
          ) {
              throw "Strong candidate count mismatch."
          }

          if (
              [int64]$detailCandidates -ne
              [int64]$candidates.Count
          ) {
              throw "Detail/candidate CSV count mismatch."
          }

          $summaryRows = 0L
          $summaryEligible = 0L
          $summaryCandidates = 0L
          $summaryStrong = 0L

          foreach ($row in $summary) {

              $summaryRows += [int64]$row.rows
              $summaryEligible += [int64]$row.eligible_rows
              $summaryCandidates += [int64]$row.candidate_rows
              $summaryStrong += [int64]$row.strong_candidate_rows
          }

          if ($summaryRows -ne [int64]$detail.Count) {
              throw "Summary/detail total mismatch."
          }

          if ($summaryEligible -ne [int64]$detailEligible) {
              throw "Summary/detail eligible mismatch."
          }

          if ($summaryCandidates -ne [int64]$detailCandidates) {
              throw "Summary/detail candidate mismatch."
          }

          if ($summaryStrong -ne [int64]$detailStrong) {
              throw "Summary/detail strong mismatch."
          }

          Write-Host "[PASS] Result/summary/detail/candidate cross-check"
          Write-Host "Total rows: $($detail.Count)"
          Write-Host "Eligible: $detailEligible"
          Write-Host "Candidates: $detailCandidates"
          Write-Host "Strong candidates: $detailStrong"


      # ======================================================
      # 24 - FINAL GATE
      # ======================================================

      - name: 24 - Final Clean V001 test gate
        run: |
          $ErrorActionPreference = "Stop"

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\accumulation_candle_research"

          $result = Get-Content `
              -LiteralPath (
                  Join-Path `
                      $reportDir `
                      "accumulation_candle_research_result.json"
              ) `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          $contract = Get-Content `
              -LiteralPath (
                  Join-Path `
                      $reportDir `
                      "accumulation_candle_research_contract.json"
              ) `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($env:RESEARCH_EXIT_CODE -ne "0") {
              throw "Research exit code gate failed."
          }

          if ($env:FILESET_UNCHANGED -ne "1") {
              throw "OHLCV file-set gate failed."
          }

          if ($env:SHA256_UNCHANGED -ne "1") {
              throw "OHLCV SHA256 gate failed."
          }

          if ($result.status -ne "PASS") {
              throw "Final result is not PASS."
          }

          if ($result.safety.ohlcv_read_only -ne $true) {
              throw "OHLCV read-only gate failed."
          }

          if ($result.safety.source_sha256_unchanged -ne $true) {
              throw "Source SHA256 gate failed."
          }

          if ($result.pattern.final_formula_defined -ne $false) {
              throw "Final formula gate failed."
          }

          if ($contract.final_formula_defined -ne $false) {
              throw "Contract formula gate failed."
          }

          if ($result.future_information.future_candles_used -ne $false) {
              throw "Future candle gate failed."
          }

          if ($result.future_information.negative_shift_used -ne $false) {
              throw "Negative shift gate failed."
          }

          if ($result.future_information.centered_rolling_used -ne $false) {
              throw "Centered rolling gate failed."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ACCUMULATION CANDLE RESEARCH TEST PASS"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[PASS] Clean V001"
          Write-Host "[PASS] Production OHLCV READ ONLY"
          Write-Host "[PASS] Production OHLCV file set unchanged"
          Write-Host "[PASS] Production OHLCV SHA256 unchanged"
          Write-Host "[PASS] Future information blocked"
          Write-Host "[PASS] Negative shift blocked"
          Write-Host "[PASS] Centered rolling blocked"
          Write-Host "[PASS] Future labels blocked"
          Write-Host "[PASS] Prediction blocked"
          Write-Host "[PASS] Trading blocked"
          Write-Host "[PASS] MA 112 / 224 / 448 included"
          Write-Host "[PASS] Final accumulation-candle formula undefined"
          Write-Host "[PASS] Result / summary / detail validated"
          Write-Host "[PASS] Checkpoint validated"
          Write-Host ""
          Write-Host "[NEXT]"
          Write-Host "research_accumulation_candle.yml"


      # ======================================================
      # 25 - FAILURE DIAGNOSTICS
      # ======================================================

      - name: 25 - Failure diagnostics
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FAILURE DIAGNOSTICS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "RESEARCH_EXIT_CODE:"
          Write-Host $env:RESEARCH_EXIT_CODE

          Write-Host ""
          Write-Host "SNAPSHOT_READY:"
          Write-Host $env:SNAPSHOT_READY

          Write-Host ""
          Write-Host "FILESET_UNCHANGED:"
          Write-Host $env:FILESET_UNCHANGED

          Write-Host ""
          Write-Host "SHA256_UNCHANGED:"
          Write-Host $env:SHA256_UNCHANGED

          Write-Host ""
          Write-Host "PRODUCTION_ROOT:"
          Write-Host $env:PRODUCTION_ROOT

          Write-Host ""
          Write-Host "SNAPSHOT_DIR:"
          Write-Host $env:SNAPSHOT_DIR

          if (
              -not [string]::IsNullOrWhiteSpace(
                  $env:PRODUCTION_ROOT
              )
          ) {

              $reportDir = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\reports\accumulation_candle_research"

              Write-Host ""
              Write-Host "Report directory:"

              if (Test-Path -LiteralPath $reportDir) {

                  Get-ChildItem `
                      -LiteralPath $reportDir `
                      -Force |
                      Select-Object `
                          Name,
                          Length,
                          LastWriteTime |
                      Format-Table -AutoSize |
                      Out-String |
                      Write-Host
              }
              else {
                  Write-Host "Report directory does not exist."
              }

              $checkpoint = Join-Path `
                  $env:PRODUCTION_ROOT `
                  "data\validation\research_accumulation_candle_checkpoint.json"

              Write-Host ""
              Write-Host "Checkpoint:"

              if (Test-Path -LiteralPath $checkpoint -PathType Leaf) {

                  Get-Item `
                      -LiteralPath $checkpoint |
                      Select-Object `
                          FullName,
                          Length,
                          LastWriteTime |
                      Format-List |
                      Out-String |
                      Write-Host
              }
              else {
                  Write-Host "Checkpoint does not exist."
              }
          }


      # ======================================================
      # 26 - UPLOAD VERIFICATION ARTIFACTS
      # ======================================================

      - name: 26 - Upload test verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-accumulation-candle-test-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            ${{ runner.temp }}\research_accumulation_candle_test\ohlcv_files_before.csv
            ${{ runner.temp }}\research_accumulation_candle_test\ohlcv_files_after.csv
            ${{ runner.temp }}\research_accumulation_candle_test\ohlcv_sha256_before.csv
            ${{ runner.temp }}\research_accumulation_candle_test\ohlcv_sha256_after.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\accumulation_candle_research\accumulation_candle_research_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\accumulation_candle_research\accumulation_candle_research_summary.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\accumulation_candle_research\accumulation_candle_candidates.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\accumulation_candle_research\accumulation_candle_source_manifest.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\accumulation_candle_research\accumulation_candle_research_contract.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\accumulation_candle_research\README.txt
            C:\Users\USER\Documents\upbit-surge-monitor\data\validation\research_accumulation_candle_checkpoint.json
