
name: audit_pattern_256_dedup_baseline_temporal.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-dedup-baseline-temporal
  cancel-in-progress: false

jobs:
  dedup-baseline-temporal:
    name: dedup-baseline-temporal

    runs-on:
      - self-hosted
      - Windows

    defaults:
      run:
        shell: powershell

    timeout-minutes: 180

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify inputs
        id: verify
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_dedup_baseline_temporal.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Audit script missing"
          }

          foreach ($tf in @("h4", "d1")) {
            foreach ($relative in @(
              "data\ohlcv\$tf",
              "data\signals\256\$tf"
            )) {
              $folder = Join-Path `
                $env:PROJECT_ROOT $relative

              if (-not (Test-Path -LiteralPath $folder)) {
                throw "Missing input folder: $folder"
              }

              $count = @(
                Get-ChildItem `
                  -LiteralPath $folder `
                  -Filter "KRW-*.csv" `
                  -File
              ).Count

              if ($count -ne 290) {
                throw "Expected 290 markets: $folder; got $count"
              }

              Write-Host "[OK] $folder : $count"
            }
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Execute audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_dedup_baseline_temporal.py"

          & py -u $script `
            --root $env:PROJECT_ROOT `
            --warmup 3 `
            --split 0.70 `
            --seed 2562026

          if ($LASTEXITCODE -ne 0) {
            throw "Audit failed"
          }

      - name: Verify integrity
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_dedup_baseline_temporal"

          $resultPath = Join-Path $folder "result.json"
          $manifestPath = Join-Path $folder "manifest.json"

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $m = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($name in @("result.json", "report.md")) {
            $path = Join-Path $folder $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = $m.sha256.$name

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          if ($r.execution -ne "PASS") {
            throw "Execution is not PASS"
          }

          if ($r.research_decision -ne "HOLD") {
            throw "Research decision mismatch"
          }

          if ($r.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($r.profitability_proven -ne $false) {
            throw "Unexpected profitability approval"
          }

          if ($r.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($r.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          foreach ($tf in @("h4", "d1")) {
            foreach ($period in @("train", "test")) {
              $item = $r.summary.$tf.$period

              if ($item.signal.events -ne $item.baseline.events) {
                throw "Unmatched sample sizes: $tf/$period"
              }

              if ($item.signal.events -ne (
                $item.signal.hits + $item.signal.misses
              )) {
                throw "Signal count mismatch: $tf/$period"
              }

              if ($item.baseline.events -ne (
                $item.baseline.hits + $item.baseline.misses
              )) {
                throw "Baseline count mismatch: $tf/$period"
              }
            }
          }

          Write-Host "[PASS] Integrity"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_dedup_baseline_temporal\result.json"

          $r = Get-Content `
            -LiteralPath $path `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 Dedup / Baseline / Temporal Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "## Results",
            "",
            "| TF | Period | Events | Signal hit % | Baseline hit % | Lift pp |",
            "|---|---|---:|---:|---:|---:|"
          )

          foreach ($tf in @("h4", "d1")) {
            foreach ($period in @("train", "test")) {
              $s = $r.summary.$tf.$period

              $lines += (
                "| $tf | $period " +
                "| $($s.signal.events) " +
                "| $($s.signal.hit_rate_pct) " +
                "| $($s.baseline.hit_rate_pct) " +
                "| $($s.lift_percentage_points) |"
              )
            }
          }

          $lines += @(
            "",
            "## Research limitations",
            "",
            "- Random baseline: single seeded draw",
            "- No independent OOS proof",
            "- No realized profitability proof",
            "- No training or live trading approval",
            "- Decision: HOLD"
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_dedup_baseline_temporal"

          $destination = Join-Path `
            $env:RUNNER_TEMP `
            "dedup_baseline_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          foreach ($name in @(
            "result.json",
            "report.md",
            "manifest.json"
          )) {
            Copy-Item `
              -LiteralPath (Join-Path $source $name) `
              -Destination (Join-Path $destination $name) `
              -ErrorAction Stop

            $a = (
              Get-FileHash `
                -LiteralPath (Join-Path $source $name) `
                -Algorithm SHA256
            ).Hash

            $b = (
              Get-FileHash `
                -LiteralPath (Join-Path $destination $name) `
                -Algorithm SHA256
            ).Hash

            if ($a -ne $b) {
              throw "Staging mismatch: $name"
            }
          }

          "STAGED_REPORT_DIR=$destination" |
            Out-File `
              -LiteralPath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-dedup-baseline-temporal
          path: ${{ env.STAGED_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Final gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($status in @(
            "${{ steps.verify.outcome }}",
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] Dedup baseline temporal audit"
          Write-Host "Research decision: HOLD"
