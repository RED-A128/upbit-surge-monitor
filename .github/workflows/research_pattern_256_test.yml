name: research_pattern_256_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research_pattern_256_test:
    name: research_pattern_256_test.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 90

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

      PROJECT_NAME: "upbit-surge-monitor"

      PROGRAM_FILE: "research_pattern_256.py"
      EXPECTED_VERSION: "Clean V001"

      REPORT_NAMESPACE: "pattern_research_256"

      RESULT_FILE: "pattern_256_research_result.json"
      SUMMARY_FILE: "pattern_256_research_summary.csv"
      DETAIL_FILE: "pattern_256_research_detail.csv"
      CANDIDATE_FILE: "pattern_256_candidates.csv"
      MANIFEST_FILE: "pattern_256_source_manifest.csv"
      CONTRACT_FILE: "pattern_256_research_contract.json"
      README_FILE: "README.txt"

      CHECKPOINT_FILE: "research_pattern_256_checkpoint.json"

    steps:

      # ================================================================
      # 01
      # ================================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      # ================================================================
      # 02
      # ================================================================

      - name: 02 - Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "Runner OS:"
          Write-Host "  $env:RUNNER_OS"

          Write-Host ""
          Write-Host "Python:"
          py --version

          Write-Host ""
          Write-Host "Git:"
          git --version


      # ================================================================
      # 03
      # ================================================================

      - name: 03 - Verify research program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY RESEARCH PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
              throw "Research program missing: $program"
          }

          $item = Get-Item -LiteralPath $program

          if ($item.Length -le 0) {
              throw "Research program is empty: $program"
          }

          Write-Host "[PASS] Program exists."
          Write-Host "  $program"
          Write-Host ""
          Write-Host "Size:"
          Write-Host "  $($item.Length) bytes"


      # ================================================================
      # 04
      # ================================================================

      - name: 04 - Verify Clean V001 markers
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY CLEAN V001 MARKERS"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          $content = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $requiredMarkers = @(
              'PROGRAM_NAME = "research_pattern_256.py"',
              'VERSION = "Clean V001"',
              'STAGE = "PATTERN 256 INDEPENDENT RESEARCH"',
              'PATTERN_ID = "256"',
              'PATTERN_KOREAN_NAME = "256"',
              'final_formula_defined',
              'future_candles_allowed',
              'negative_shift_allowed',
              'centered_rolling_allowed',
              'future_labels_generated',
              'future_returns_generated',
              'thirty_percent_label_generated',
              'source_sha256_unchanged'
          )

          foreach ($marker in $requiredMarkers) {

              if (-not $content.Contains($marker)) {
                  throw "Required Clean V001 marker missing: $marker"
              }

              Write-Host "[PASS] $marker"
          }


      # ================================================================
      # 05
      # ================================================================

      - name: 05 - Python syntax compile
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PYTHON SYNTAX COMPILE"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
              throw "Python syntax compilation failed."
          }

          Write-Host ""
          Write-Host "[PASS] Python syntax compilation succeeded."


      # ================================================================
      # 06
      # ================================================================

      - name: 06 - Resolve production root
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RESOLVE PRODUCTION ROOT"
          Write-Host "============================================================"
          Write-Host ""

          $candidates = @(
              "C:\Users\USER\Documents\upbit-surge-monitor",
              $env:GITHUB_WORKSPACE
          )

          $productionRoot = $null

          foreach ($candidate in $candidates) {

              if ([string]::IsNullOrWhiteSpace($candidate)) {
                  continue
              }

              $ohlcv = Join-Path $candidate "data\ohlcv"

              if (Test-Path -LiteralPath $ohlcv -PathType Container) {

                  $h1 = Join-Path $ohlcv "h1"
                  $h4 = Join-Path $ohlcv "h4"
                  $d1 = Join-Path $ohlcv "d1"

                  if (
                      (Test-Path -LiteralPath $h1 -PathType Container) -and
                      (Test-Path -LiteralPath $h4 -PathType Container) -and
                      (Test-Path -LiteralPath $d1 -PathType Container)
                  ) {
                      $productionRoot = (
                          Resolve-Path -LiteralPath $candidate
                      ).Path

                      break
                  }
              }
          }

          if ([string]::IsNullOrWhiteSpace($productionRoot)) {
              throw "Unable to resolve production project root."
          }

          Write-Host "Production root:"
          Write-Host "  $productionRoot"

          "PRODUCTION_ROOT=$productionRoot" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append


      # ================================================================
      # 07
      # ================================================================

      - name: 07 - Verify production OHLCV structure
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PRODUCTION OHLCV STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          foreach ($timeframe in $timeframes) {

              $directory = Join-Path `
                  $base `
                  $timeframe

              if (-not (
                  Test-Path `
                      -LiteralPath $directory `
                      -PathType Container
              )) {
                  throw "OHLCV directory missing: $directory"
              }

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv"
              )

              if ($files.Count -le 0) {
                  throw "No OHLCV CSV files found: $directory"
              }

              Write-Host "[PASS] $timeframe"
              Write-Host "  CSV files: $($files.Count)"
          }


      # ================================================================
      # 08
      # ================================================================

      - name: 08 - Create OHLCV safety snapshot
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CREATE OHLCV SAFETY SNAPSHOT"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotDir = Join-Path `
              $env:RUNNER_TEMP `
              "research_pattern_256_test"

          if (Test-Path -LiteralPath $snapshotDir) {
              Remove-Item `
                  -LiteralPath $snapshotDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $snapshotDir `
              -Force |
              Out-Null

          "PATTERN_256_TEST_SNAPSHOT_DIR=$snapshotDir" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          if ($files.Count -le 0) {
              throw "No production OHLCV files found."
          }

          $fileListPath = Join-Path `
              $snapshotDir `
              "ohlcv_files_before.txt"

          $hashPath = Join-Path `
              $snapshotDir `
              "ohlcv_sha256_before.csv"

          $relativePaths = @()

          $hashRows = @()

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $env:PRODUCTION_ROOT.Length
              ).TrimStart('\')

              $relativePaths += $relative

              $hash = (
                  Get-FileHash `
                      -LiteralPath $file.FullName `
                      -Algorithm SHA256
              ).Hash

              $hashRows += [PSCustomObject]@{
                  RelativePath = $relative
                  SHA256       = $hash
                  Length       = $file.Length
              }
          }

          $relativePaths |
              Set-Content `
                  -LiteralPath $fileListPath `
                  -Encoding UTF8

          $hashRows |
              Export-Csv `
                  -LiteralPath $hashPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "Snapshot directory:"
          Write-Host "  $snapshotDir"

          Write-Host ""
          Write-Host "OHLCV files:"
          Write-Host "  $($files.Count)"

          Write-Host ""
          Write-Host "[PASS] Production OHLCV safety snapshot created."


      # ================================================================
      # 09
      # ================================================================

      - name: 09 - Static future-information leakage scan
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "STATIC FUTURE-INFORMATION LEAKAGE SCAN"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          @'
          import ast
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          source = path.read_text(
              encoding="utf-8-sig"
          )

          try:
              tree = ast.parse(
                  source,
                  filename=str(path),
              )
          except SyntaxError as exc:
              print(f"[FAIL] AST parse failed: {exc}")
              raise SystemExit(1)

          violations = []

          for node in ast.walk(tree):

              if not isinstance(node, ast.Call):
                  continue

              func_name = ""

              if isinstance(node.func, ast.Attribute):
                  func_name = node.func.attr

              elif isinstance(node.func, ast.Name):
                  func_name = node.func.id

              # --------------------------------------------------------
              # shift(-N)
              # --------------------------------------------------------

              if func_name == "shift":

                  if node.args:
                      arg = node.args[0]

                      if (
                          isinstance(arg, ast.UnaryOp)
                          and isinstance(arg.op, ast.USub)
                          and isinstance(arg.operand, ast.Constant)
                          and isinstance(arg.operand.value, (int, float))
                          and arg.operand.value > 0
                      ):
                          violations.append(
                              (
                                  node.lineno,
                                  "negative shift detected",
                              )
                          )

                  for keyword in node.keywords:

                      if keyword.arg != "periods":
                          continue

                      value = keyword.value

                      if (
                          isinstance(value, ast.UnaryOp)
                          and isinstance(value.op, ast.USub)
                          and isinstance(value.operand, ast.Constant)
                          and isinstance(value.operand.value, (int, float))
                          and value.operand.value > 0
                      ):
                          violations.append(
                              (
                                  node.lineno,
                                  "negative shift(periods=...) detected",
                              )
                          )

              # --------------------------------------------------------
              # rolling(..., center=True)
              # --------------------------------------------------------

              if func_name == "rolling":

                  for keyword in node.keywords:

                      if keyword.arg != "center":
                          continue

                      value = keyword.value

                      if (
                          isinstance(value, ast.Constant)
                          and value.value is True
                      ):
                          violations.append(
                              (
                                  node.lineno,
                                  "centered rolling detected",
                              )
                          )

          if violations:

              print("[FAIL] Future-information leakage patterns detected:")

              for line, message in violations:
                  print(f"  line {line}: {message}")

              raise SystemExit(1)

          print("[PASS] No negative shift detected.")
          print("[PASS] No centered rolling detected.")
          '@ |
              py - "$program"

          if ($LASTEXITCODE -ne 0) {
              throw "Static future-information leakage scan failed."
          }


      # ================================================================
      # 10
      # ================================================================

      - name: 10 - Static destructive operation scan
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "STATIC DESTRUCTIVE OPERATION SCAN"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          $content = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $forbiddenPatterns = @(
              '(?im)^\s*os\.remove\s*\(',
              '(?im)^\s*os\.unlink\s*\(',
              '(?im)^\s*shutil\.rmtree\s*\(',
              '(?im)^\s*Path\([^)]*\)\.unlink\s*\(',
              '(?im)^\s*[A-Za-z_][A-Za-z0-9_]*\.unlink\s*\(',
              '(?im)^\s*[A-Za-z_][A-Za-z0-9_]*\.rmdir\s*\('
          )

          foreach ($pattern in $forbiddenPatterns) {

              if ([regex]::IsMatch($content, $pattern)) {
                  throw "Potential destructive filesystem operation detected."
              }
          }

          Write-Host "[PASS] No direct destructive filesystem operation detected."


      # ================================================================
      # 11
      # ================================================================

      - name: 11 - Run research_pattern_256 Clean V001
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN PATTERN 256 INDEPENDENT RESEARCH"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          py $program `
              --project-root "$env:PRODUCTION_ROOT" `
              --timeframes h1 h4 d1 `
              --force

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Research exit code:"
          Write-Host "  $exitCode"

          "PATTERN_256_EXIT_CODE=$exitCode" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          if ($exitCode -ne 0) {

              Write-Host ""
              Write-Host "[INFO] research_pattern_256.py returned exit code $exitCode"
              Write-Host "[INFO] OHLCV integrity checks will still run."
          }

          exit 0


      # ================================================================
      # 12
      # ================================================================

      - name: 12 - Verify OHLCV file set unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV FILE SET UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforeList = Join-Path `
              $env:PATTERN_256_TEST_SNAPSHOT_DIR `
              "ohlcv_files_before.txt"

          $afterList = Join-Path `
              $env:PATTERN_256_TEST_SNAPSHOT_DIR `
              "ohlcv_files_after.txt"

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $relativePaths = @(
              foreach ($file in $files) {

                  $relative = $file.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $relative
              }
          )

          $relativePaths |
              Set-Content `
                  -LiteralPath $afterList `
                  -Encoding UTF8

          $before = @(
              Get-Content `
                  -LiteralPath $beforeList `
                  -Encoding UTF8
          )

          $after = @(
              Get-Content `
                  -LiteralPath $afterList `
                  -Encoding UTF8
          )

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV file set changed:"

              $difference |
                  Format-Table |
                  Out-String |
                  Write-Host

              throw "Production OHLCV file set changed during research."
          }

          Write-Host "[PASS] Production OHLCV file set unchanged."
          Write-Host "[PASS] File count: $($after.Count)"


      # ================================================================
      # 13
      # ================================================================

      - name: 13 - Verify OHLCV SHA256 unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforePath = Join-Path `
              $env:PATTERN_256_TEST_SNAPSHOT_DIR `
              "ohlcv_sha256_before.csv"

          $afterPath = Join-Path `
              $env:PATTERN_256_TEST_SNAPSHOT_DIR `
              "ohlcv_sha256_after.csv"

          $base = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\ohlcv"

          $afterRows = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName |
              ForEach-Object {

                  $relative = $_.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $hash = (
                      Get-FileHash `
                          -LiteralPath $_.FullName `
                          -Algorithm SHA256
                  ).Hash

                  [PSCustomObject]@{
                      RelativePath = $relative
                      SHA256       = $hash
                      Length       = $_.Length
                  }
              }
          )

          $afterRows |
              Export-Csv `
                  -LiteralPath $afterPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          $beforeRows = @(
              Import-Csv `
                  -LiteralPath $beforePath
          )

          if ($beforeRows.Count -ne $afterRows.Count) {
              throw "OHLCV SHA256 inventory count changed."
          }

          $beforeMap = @{}

          foreach ($row in $beforeRows) {
              $beforeMap[$row.RelativePath] = $row
          }

          $changed = @()

          foreach ($row in $afterRows) {

              if (-not $beforeMap.ContainsKey($row.RelativePath)) {

                  $changed += $row.RelativePath
                  continue
              }

              $before = $beforeMap[$row.RelativePath]

              if ($before.SHA256 -ne $row.SHA256) {

                  $changed += $row.RelativePath
                  continue
              }

              if (
                  [Int64]$before.Length `
                  -ne `
                  [Int64]$row.Length
              ) {
                  $changed += $row.RelativePath
              }
          }

          if ($changed.Count -gt 0) {

              Write-Host ""
              Write-Host "Changed OHLCV files:"

              foreach ($file in $changed) {
                  Write-Host "  $file"
              }

              throw "Production OHLCV content changed during research."
          }

          Write-Host "[PASS] All production OHLCV SHA256 values unchanged."
          Write-Host "[PASS] Verified files: $($afterRows.Count)"


      # ================================================================
      # 14
      # ================================================================

      - name: 14 - Verify research process exit code
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY RESEARCH PROCESS EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:PATTERN_256_EXIT_CODE
              )
          ) {
              throw "PATTERN_256_EXIT_CODE was not recorded."
          }

          $exitCode = [int]$env:PATTERN_256_EXIT_CODE

          Write-Host "Research exit code:"
          Write-Host "  $exitCode"

          if ($exitCode -ne 0) {
              throw "research_pattern_256.py returned exit code $exitCode"
          }

          Write-Host ""
          Write-Host "[PASS] research_pattern_256.py returned exit code 0."


      # ================================================================
      # 15
      # ================================================================

      - name: 15 - Verify expected research outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY EXPECTED RESEARCH OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE"

          $validationDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation"

          $required = @(
              (Join-Path $reportDir $env:RESULT_FILE),
              (Join-Path $reportDir $env:SUMMARY_FILE),
              (Join-Path $reportDir $env:DETAIL_FILE),
              (Join-Path $reportDir $env:CANDIDATE_FILE),
              (Join-Path $reportDir $env:MANIFEST_FILE),
              (Join-Path $reportDir $env:CONTRACT_FILE),
              (Join-Path $reportDir $env:README_FILE),
              (Join-Path $validationDir $env:CHECKPOINT_FILE)
          )

          foreach ($path in $required) {

              if (-not (
                  Test-Path `
                      -LiteralPath $path `
                      -PathType Leaf
              )) {
                  throw "Required research output missing: $path"
              }

              $item = Get-Item `
                  -LiteralPath $path

              if ($item.Length -le 0) {
                  throw "Research output is empty: $path"
              }

              Write-Host "[PASS] $path"
          }


      # ================================================================
      # 16
      # ================================================================

      - name: 16 - Validate result JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE RESULT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\$env:RESULT_FILE"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]

          try:
              with path.open(
                  "r",
                  encoding="utf-8-sig",
              ) as f:
                  result = json.load(f)

          except Exception as exc:
              print(
                  f"[FAIL] Unable to parse result JSON: {exc}"
              )
              raise SystemExit(1)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              result.get("program")
              == "research_pattern_256.py",
              (
                  "Unexpected program: "
                  f"{result.get('program')}"
              ),
          )

          require(
              result.get("version")
              == expected_version,
              (
                  "Unexpected version: "
                  f"{result.get('version')}"
              ),
          )

          require(
              result.get("stage")
              == "PATTERN 256 INDEPENDENT RESEARCH",
              (
                  "Unexpected stage: "
                  f"{result.get('stage')}"
              ),
          )

          require(
              result.get("status") == "PASS",
              (
                  "Research result status is not PASS: "
                  f"{result.get('status')}"
              ),
          )

          pattern = result.get(
              "pattern",
              {},
          )

          require(
              pattern.get("id") == "256",
              (
                  "Unexpected pattern ID: "
                  f"{pattern.get('id')}"
              ),
          )

          require(
              pattern.get("korean_name") == "256",
              (
                  "Unexpected pattern Korean name: "
                  f"{pattern.get('korean_name')}"
              ),
          )

          require(
              pattern.get("independent_research")
              is True,
              "Independent research flag is not true.",
          )

          require(
              pattern.get("final_formula_defined")
              is False,
              (
                  "Clean V001 must not claim "
                  "a final 256 formula."
              ),
          )

          future = result.get(
              "future_information",
              {},
          )

          require(
              future.get("future_candles_used")
              is False,
              "Future candles were used.",
          )

          require(
              future.get("negative_shift_used")
              is False,
              "Negative shift was used.",
          )

          require(
              future.get("centered_rolling_used")
              is False,
              "Centered rolling was used.",
          )

          require(
              future.get("future_labels_generated")
              is False,
              "Future labels were generated.",
          )

          require(
              future.get("future_returns_generated")
              is False,
              "Future returns were generated.",
          )

          require(
              future.get("future_max_generated")
              is False,
              "Future max was generated.",
          )

          require(
              future.get("future_min_generated")
              is False,
              "Future min was generated.",
          )

          require(
              future.get("thirty_percent_label_generated")
              is False,
              "30 percent future label was generated.",
          )

          safety = result.get(
