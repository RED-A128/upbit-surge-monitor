                  ),
              ),
              (
                  result_candidate_rows
                  == summary_candidate_rows,
                  (
                      "Result candidate_rows != "
                      "summary candidate rows"
                  ),
              ),
              (
                  result_candidate_rows
                  == detail_candidate_rows,
                  (
                      "Result candidate_rows != "
                      "detail candidate rows"
                  ),
              ),
              (
                  result_candidate_rows
                  == candidate_file_rows,
                  (
                      "Result candidate_rows != "
                      "candidate CSV row count"
                  ),
              ),
          ]

          for passed, message in checks:

              if not passed:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          print("[PASS] Result/summary/detail cross-check.")
          print(
              f"[PASS] Total rows: {result_total_rows}"
          )
          print(
              "[PASS] Candidate rows: "
              f"{result_candidate_rows}"
          )
          '@ |
              py - `
                  "$resultPath" `
                  "$summaryPath" `
                  "$detailPath" `
                  "$candidatePath"

          if ($LASTEXITCODE -ne 0) {
              throw "Research output cross-check failed."
          }


      # ================================================================
      # 24
      # ================================================================

      - name: 24 - Verify no executable forbidden Git operations
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY NO FORBIDDEN GIT OPERATIONS ARE EXECUTABLE"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          $content = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $forbiddenPatterns = @(
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+reset',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+clean',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+commit',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+push'
          )

          foreach ($pattern in $forbiddenPatterns) {

              if ([regex]::IsMatch($content, $pattern)) {
                  throw "Potential executable forbidden Git mutation detected."
              }
          }

          Write-Host "[PASS] No executable git reset detected."
          Write-Host "[PASS] No executable git clean detected."
          Write-Host "[PASS] No executable git commit detected."
          Write-Host "[PASS] No executable git push detected."


      # ================================================================
      # 25
      # ================================================================

      - name: 25 - Final Clean V001 test gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL CLEAN V001 TEST GATE"
          Write-Host "============================================================"
          Write-Host ""

          if ([int]$env:PATTERN_256_EXIT_CODE -ne 0) {
              throw "Pattern 256 research process did not pass."
          }

          $resultPath = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\$env:RESULT_FILE"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          with path.open(
              "r",
              encoding="utf-8-sig",
          ) as f:
              result = json.load(f)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              result.get("status") == "PASS",
              "Final research status is not PASS.",
          )

          pattern = result.get(
              "pattern",
              {},
          )

          require(
              pattern.get("id") == "256",
              "Pattern ID gate failed.",
          )

          require(
              pattern.get("independent_research")
              is True,
              "Independent research gate failed.",
          )

          require(
              pattern.get("final_formula_defined")
              is False,
              "Final formula safety gate failed.",
          )

          future = result.get(
              "future_information",
              {},
          )

          require(
              future.get("future_candles_used")
              is False,
              "Future candle gate failed.",
          )

          require(
              future.get("negative_shift_used")
              is False,
              "Negative shift gate failed.",
          )

          require(
              future.get("centered_rolling_used")
              is False,
              "Centered rolling gate failed.",
          )

          require(
              future.get("future_labels_generated")
              is False,
              "Future label gate failed.",
          )

          require(
              future.get("thirty_percent_label_generated")
              is False,
              "30 percent label gate failed.",
          )

          safety = result.get(
              "safety",
              {},
          )

          require(
              safety.get("source_sha256_unchanged")
              is True,
              "Production OHLCV integrity gate failed.",
          )

          require(
              safety.get("prediction_executed")
              is False,
              "Prediction safety gate failed.",
          )

          require(
              safety.get("trading_executed")
              is False,
              "Trading safety gate failed.",
          )

          processing = result.get(
              "processing",
              {},
          )

          require(
              int(
                  processing.get(
                      "files_error",
                      -1,
                  )
              ) == 0,
              "Source processing error gate failed.",
          )

          print("")
          print("============================================================")
          print("PATTERN 256 RESEARCH TEST PASS")
          print("============================================================")
          print("")
          print("[PASS] research_pattern_256.py Clean V001")
          print("[PASS] Pattern 256 independent research")
          print("[PASS] Production OHLCV unchanged")
          print("[PASS] h1 / h4 / d1 research")
          print("[PASS] Six quantitative research dimensions")
          print("[PASS] Research score 0..100")
          print("[PASS] SETUP / READY / TRIGGER research classification")
          print("[PASS] Future candles blocked")
          print("[PASS] Negative shift blocked")
          print("[PASS] Centered rolling blocked")
          print("[PASS] Future labels blocked")
          print("[PASS] 30 percent future label blocked")
          print("[PASS] Final 256 formula remains undefined")
          print("[PASS] Source manifest validated")
          print("[PASS] Checkpoint validated")
          print("[PASS] Result/summary/detail cross-check")
          print("")
          print("[NEXT]")
          print("After this workflow passes, proceed to:")
          print("  research_pattern_256.yml")
          '@ |
              py - "$resultPath"

          if ($LASTEXITCODE -ne 0) {
              throw "Final Clean V001 test gate failed."
          }


      # ================================================================
      # 26
      # ================================================================

      - name: 26 - Failure diagnostics
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FAILURE DIAGNOSTICS"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Production root:"
          Write-Host "  $env:PRODUCTION_ROOT"

          Write-Host ""
          Write-Host "Research exit code:"
          Write-Host "  $env:PATTERN_256_EXIT_CODE"

          Write-Host ""
          Write-Host "Program:"

          $program = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:PROGRAM_FILE

          if (Test-Path -LiteralPath $program) {

              Get-Item `
                  -LiteralPath $program |
                  Format-List `
                      FullName,
                      Length,
                      LastWriteTime |
                  Out-String |
                  Write-Host
          }
          else {
              Write-Host "  [MISSING] $program"
          }

          Write-Host ""
          Write-Host "Report directory:"

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE"

          if (Test-Path -LiteralPath $reportDir) {

              Get-ChildItem `
                  -LiteralPath $reportDir `
                  -Force |
                  Format-Table `
                      Name,
                      Length,
                      LastWriteTime `
                      -AutoSize |
                  Out-String |
                  Write-Host
          }
          else {
              Write-Host "  [MISSING] $reportDir"
          }

          Write-Host ""
          Write-Host "Checkpoint:"

          $checkpoint = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation\$env:CHECKPOINT_FILE"

          if (Test-Path -LiteralPath $checkpoint) {

              Get-Item `
                  -LiteralPath $checkpoint |
                  Format-List `
                      FullName,
                      Length,
                      LastWriteTime |
                  Out-String |
                  Write-Host

              Write-Host ""
              Write-Host "Checkpoint content:"
              Write-Host ""

              Get-Content `
                  -LiteralPath $checkpoint `
                  -Encoding UTF8 |
                  Select-Object -First 100 |
                  Out-String |
                  Write-Host
          }
          else {
              Write-Host "  [MISSING] $checkpoint"
          }

          Write-Host ""
          Write-Host "OHLCV snapshot directory:"
          Write-Host "  $env:PATTERN_256_TEST_SNAPSHOT_DIR"

          Write-Host ""
          Write-Host "============================================================"
