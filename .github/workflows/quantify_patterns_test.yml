name: quantify_patterns_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantify_patterns_test:
    name: quantify_patterns_test.yml
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PROJECT_NAME: "upbit-surge-monitor"
      PROGRAM_FILE: "quantify_patterns.py"
      EXPECTED_VERSION: "Clean V001"
      REPORT_NAMESPACE: "pattern_quantification"

    steps:

      # ================================================================
      # 01
      # ================================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      # ================================================================
      # 02
      # ================================================================

      - name: 02 - Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "  $env:GITHUB_REPOSITORY"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Runner:"
          Write-Host "  $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "Runner OS:"
          Write-Host "  $env:RUNNER_OS"

          Write-Host ""
          Write-Host "Python:"
          py --version

          Write-Host ""
          Write-Host "Git:"
          git --version


      # ================================================================
      # 03
      # ================================================================

      - name: 03 - Verify quantify program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY QUANTIFY PROGRAM"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
              throw "Required program missing: $program"
          }

          Write-Host "[PASS] Program exists:"
          Write-Host "       $program"

          $content = Get-Content -LiteralPath $program -Raw -Encoding UTF8

          if ($content -notmatch [regex]::Escape($env:EXPECTED_VERSION)) {
              throw "Expected version '$env:EXPECTED_VERSION' not found in $env:PROGRAM_FILE"
          }

          Write-Host ""
          Write-Host "[PASS] Expected version found:"
          Write-Host "       $env:EXPECTED_VERSION"


      # ================================================================
      # 04
      # ================================================================

      - name: 04 - Discover production project root
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DISCOVER PRODUCTION PROJECT ROOT"
          Write-Host "============================================================"
          Write-Host ""

          $candidates = @()

          if ($env:USERPROFILE) {
              $candidates += Join-Path $env:USERPROFILE "Documents\upbit-surge-monitor"
          }

          $candidates += $env:GITHUB_WORKSPACE

          $productionRoot = $null
          $rootSource = $null

          foreach ($candidate in $candidates) {

              if ([string]::IsNullOrWhiteSpace($candidate)) {
                  continue
              }

              $ohlcv = Join-Path $candidate "data\ohlcv"

              if (Test-Path -LiteralPath $ohlcv -PathType Container) {

                  $productionRoot = (
                      Resolve-Path -LiteralPath $candidate
                  ).Path

                  if ($candidate -eq $env:GITHUB_WORKSPACE) {
                      $rootSource = "github-workspace"
                  }
                  else {
                      $rootSource = "user-documents"
                  }

                  break
              }
          }

          if (-not $productionRoot) {
              throw "Unable to locate production project root containing data\ohlcv."
          }

          Write-Host "[PATH] Production project root:"
          Write-Host "       $productionRoot"

          Write-Host ""
          Write-Host "[PATH] Root source:"
          Write-Host "       $rootSource"

          "PRODUCTION_ROOT=$productionRoot" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "PRODUCTION_ROOT_SOURCE=$rootSource" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ================================================================
      # 05
      # ================================================================

      - name: 05 - Verify required directories
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY REQUIRED DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $required = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($relative in $required) {

              $fullPath = Join-Path $env:PRODUCTION_ROOT $relative

              if (-not (Test-Path -LiteralPath $fullPath -PathType Container)) {
                  throw "Required directory missing: $fullPath"
              }

              Write-Host "[PASS] $relative"
          }


      # ================================================================
      # 06
      # ================================================================

      - name: 06 - Discover production OHLCV inventory
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DISCOVER PRODUCTION OHLCV INVENTORY"
          Write-Host "============================================================"
          Write-Host ""

          $timeframes = @("h1", "h4", "d1")

          $total = 0

          foreach ($tf in $timeframes) {

              $directory = Join-Path $env:PRODUCTION_ROOT "data\ohlcv\$tf"

              $files = @(
                  Get-ChildItem `
                      -LiteralPath $directory `
                      -File `
                      -Filter "*.csv" `
                      -ErrorAction Stop
              )

              $count = $files.Count
              $total += $count

              Write-Host "$($tf.ToUpper()) : $count"
          }

          Write-Host ""
          Write-Host "TOTAL : $total"

          if ($total -le 0) {
              throw "No production OHLCV CSV files discovered."
          }

          "OHLCV_FILE_COUNT=$total" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ================================================================
      # 07
      # ================================================================

      - name: 07 - Record OHLCV file set before test
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV FILE SET BEFORE TEST"
          Write-Host "============================================================"
          Write-Host ""

          $snapshotDir = Join-Path $env:RUNNER_TEMP "quantify_patterns_test"

          if (Test-Path -LiteralPath $snapshotDir) {
              Remove-Item `
                  -LiteralPath $snapshotDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $snapshotDir |
              Out-Null

          $beforeList = Join-Path $snapshotDir "ohlcv_files_before.txt"

          $base = Join-Path $env:PRODUCTION_ROOT "data\ohlcv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $relativePaths = @(
              foreach ($file in $files) {

                  $relative = $file.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $relative
              }
          )

          $relativePaths |
              Set-Content `
                  -LiteralPath $beforeList `
                  -Encoding UTF8

          Write-Host "Recorded files:"
          Write-Host "  $($relativePaths.Count)"

          "QUANTIFY_TEST_SNAPSHOT_DIR=$snapshotDir" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ================================================================
      # 08
      # ================================================================

      - name: 08 - Record OHLCV SHA256 before test
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE TEST"
          Write-Host "============================================================"
          Write-Host ""

          $output = Join-Path `
              $env:QUANTIFY_TEST_SNAPSHOT_DIR `
              "ohlcv_sha256_before.csv"

          $base = Join-Path $env:PRODUCTION_ROOT "data\ohlcv"

          $rows = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName |
              ForEach-Object {

                  $relative = $_.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $hash = (
                      Get-FileHash `
                          -LiteralPath $_.FullName `
                          -Algorithm SHA256
                  ).Hash

                  [PSCustomObject]@{
                      RelativePath = $relative
                      SHA256       = $hash
                      Length       = $_.Length
                  }
              }
          )

          $rows |
              Export-Csv `
                  -LiteralPath $output `
                  -NoTypeInformation `
                  -Encoding UTF8

          Write-Host "[PASS] SHA256 recorded:"
          Write-Host "       $($rows.Count) files"


      # ================================================================
      # 09
      # IMPORTANT:
      # Do not compare Korean literals inside PowerShell source.
      # Windows PowerShell 5.1 on self-hosted runner can corrupt UTF-8
      # literals when the temporary .ps1 file is generated.
      #
      # Python reads quantify_patterns.py as UTF-8 and verifies the
      # Unicode pattern names safely.
      # ================================================================

      - name: 09 - Verify pattern registry source contract
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY PATTERN REGISTRY SOURCE CONTRACT"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          @'
          import pathlib
          import sys

          program = pathlib.Path(sys.argv[1])

          try:
              content = program.read_text(encoding="utf-8-sig")
          except Exception as exc:
              print(f"[FAIL] Unable to read source as UTF-8: {exc}")
              raise SystemExit(1)

          required_patterns = [
              "\u0032\u0035\u0036",
              "\ubc25\uadf8\ub987\u0020\u0033\ubc88\uc790\ub9ac",
              "\uc5ed\ub9e4\uacf5\ud30c",
              "\uacf5\uad6c\ub9ac",
              "\ub3cc\ud30c",
              "\ub20c\ub9bc\ubaa9",
              "\uae30\uc900\ubd09",
              "\ud558\uc774\ud790",
              "\uc624\ub3cc\uc774",
          ]

          missing = []

          for name in required_patterns:
              candidates = [
                  f'korean_name="{name}"',
                  f"korean_name='{name}'",
                  f'"korean_name": "{name}"',
                  f'"korean_name":"{name}"',
                  f"'korean_name': '{name}'",
                  f"'korean_name':'{name}'",
              ]

              if any(candidate in content for candidate in candidates):
                  print(f"[PASS] {name}")
              else:
                  missing.append(name)
                  print(f"[FAIL] Required pattern definition missing: {name}")

          if missing:
              print("")
              print("[FAIL] Missing pattern count:", len(missing))
              raise SystemExit(1)

          print("")
          print("[PASS] All 9 pattern definitions found.")
          '@ |
              py - "$program"

          if ($LASTEXITCODE -ne 0) {
              throw "Pattern registry source contract validation failed."
          }


      # ================================================================
      # 10
      # ================================================================

      - name: 10 - Verify no-future-information source contract
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY NO-FUTURE-INFORMATION SOURCE CONTRACT"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          @'
          import pathlib
          import re
          import sys

          program = pathlib.Path(sys.argv[1])

          try:
              content = program.read_text(encoding="utf-8-sig")
          except Exception as exc:
              print(f"[FAIL] Unable to read source: {exc}")
              raise SystemExit(1)

          required_contracts = [
              "ALLOW_FUTURE_LABELS = False",
              "future_data_allowed=False",
              "No negative shift is allowed.",
              "No centered rolling window is allowed.",
          ]

          for contract in required_contracts:
              if contract not in content:
                  print(f"[FAIL] Required no-future contract missing: {contract}")
                  raise SystemExit(1)

              print(f"[PASS] {contract}")

          negative_shift_pattern = re.compile(
              r"\.shift\s*\(\s*-\d+",
              re.IGNORECASE,
          )

          if negative_shift_pattern.search(content):
              print("[FAIL] Negative pandas shift detected.")
              raise SystemExit(1)

          center_true_pattern = re.compile(
              r"center\s*=\s*True",
              re.IGNORECASE,
          )

          if center_true_pattern.search(content):
              print("[FAIL] Centered rolling window detected.")
              raise SystemExit(1)

          print("")
          print("[PASS] No negative shift detected.")
          print("[PASS] No centered rolling window detected.")
          '@ |
              py - "$program"

          if ($LASTEXITCODE -ne 0) {
              throw "No-future-information source contract validation failed."
          }


      # ================================================================
      # 11
      # ================================================================

      - name: 11 - Run pattern quantification test
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN PATTERN QUANTIFICATION TEST"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "[SAFETY] Production OHLCV: READ ONLY"
          Write-Host "[SAFETY] OHLCV write       : FORBIDDEN"
          Write-Host "[SAFETY] OHLCV delete      : FORBIDDEN"
          Write-Host "[SAFETY] Recovery           : DISABLED"
          Write-Host "[SAFETY] API download       : DISABLED"
          Write-Host "[SAFETY] Future labels      : DISABLED"
          Write-Host "[SAFETY] Backtest           : DISABLED"
          Write-Host "[SAFETY] Prediction         : DISABLED"
          Write-Host "[SAFETY] Trading            : DISABLED"
          Write-Host ""

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          & py `
              $program `
              --project-root "$env:PRODUCTION_ROOT" `
              --timeframes h1 h4 d1 `
              --force

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Quantification exit code:"
          Write-Host "  $exitCode"

          "QUANTIFY_EXIT_CODE=$exitCode" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "[INFO] quantify_patterns.py returned exit code $exitCode"
              Write-Host "[INFO] OHLCV safety verification will still run."
          }

          exit 0


      # ================================================================
      # 12
      # ================================================================

      - name: 12 - Verify OHLCV file set unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV FILE SET UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforeList = Join-Path `
              $env:QUANTIFY_TEST_SNAPSHOT_DIR `
              "ohlcv_files_before.txt"

          $afterList = Join-Path `
              $env:QUANTIFY_TEST_SNAPSHOT_DIR `
              "ohlcv_files_after.txt"

          $base = Join-Path $env:PRODUCTION_ROOT "data\ohlcv"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName
          )

          $relativePaths = @(
              foreach ($file in $files) {

                  $relative = $file.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $relative
              }
          )

          $relativePaths |
              Set-Content `
                  -LiteralPath $afterList `
                  -Encoding UTF8

          $before = @(
              Get-Content `
                  -LiteralPath $beforeList `
                  -Encoding UTF8
          )

          $after = @(
              Get-Content `
                  -LiteralPath $afterList `
                  -Encoding UTF8
          )

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV file set changed:"
              $difference | Format-Table | Out-String | Write-Host

              throw "Production OHLCV file set changed during quantification test."
          }

          Write-Host "[PASS] Production OHLCV file set unchanged."
          Write-Host "[PASS] File count: $($after.Count)"


      # ================================================================
      # 13
      # ================================================================

      - name: 13 - Verify OHLCV SHA256 unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV SHA256 UNCHANGED"
          Write-Host "============================================================"
          Write-Host ""

          $beforePath = Join-Path `
              $env:QUANTIFY_TEST_SNAPSHOT_DIR `
              "ohlcv_sha256_before.csv"

          $afterPath = Join-Path `
              $env:QUANTIFY_TEST_SNAPSHOT_DIR `
              "ohlcv_sha256_after.csv"

          $base = Join-Path $env:PRODUCTION_ROOT "data\ohlcv"

          $afterRows = @(
              Get-ChildItem `
                  -LiteralPath $base `
                  -Recurse `
                  -File `
                  -Filter "*.csv" |
              Sort-Object FullName |
              ForEach-Object {

                  $relative = $_.FullName.Substring(
                      $env:PRODUCTION_ROOT.Length
                  ).TrimStart('\')

                  $hash = (
                      Get-FileHash `
                          -LiteralPath $_.FullName `
                          -Algorithm SHA256
                  ).Hash

                  [PSCustomObject]@{
                      RelativePath = $relative
                      SHA256       = $hash
                      Length       = $_.Length
                  }
              }
          )

          $afterRows |
              Export-Csv `
                  -LiteralPath $afterPath `
                  -NoTypeInformation `
                  -Encoding UTF8

          $beforeRows = @(
              Import-Csv -LiteralPath $beforePath
          )

          if ($beforeRows.Count -ne $afterRows.Count) {
              throw "OHLCV SHA256 inventory count changed."
          }

          $beforeMap = @{}

          foreach ($row in $beforeRows) {
              $beforeMap[$row.RelativePath] = $row
          }

          $changed = @()

          foreach ($row in $afterRows) {

              if (-not $beforeMap.ContainsKey($row.RelativePath)) {
                  $changed += $row.RelativePath
                  continue
              }

              $before = $beforeMap[$row.RelativePath]

              if ($before.SHA256 -ne $row.SHA256) {
                  $changed += $row.RelativePath
                  continue
              }

              if ([Int64]$before.Length -ne [Int64]$row.Length) {
                  $changed += $row.RelativePath
              }
          }

          if ($changed.Count -gt 0) {

              Write-Host ""
              Write-Host "Changed OHLCV files:"

              foreach ($file in $changed) {
                  Write-Host "  $file"
              }

              throw "Production OHLCV content changed during quantification test."
          }

          Write-Host "[PASS] All production OHLCV SHA256 values unchanged."
          Write-Host "[PASS] Verified files: $($afterRows.Count)"


      # ================================================================
      # 14
      # ================================================================

      - name: 14 - Verify quantification process exit code
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY QUANTIFICATION PROCESS EXIT CODE"
          Write-Host "============================================================"
          Write-Host ""

          if ([string]::IsNullOrWhiteSpace($env:QUANTIFY_EXIT_CODE)) {
              throw "QUANTIFY_EXIT_CODE was not recorded."
          }

          $exitCode = [int]$env:QUANTIFY_EXIT_CODE

          Write-Host "Quantification exit code:"
          Write-Host "  $exitCode"

          if ($exitCode -ne 0) {
              throw "quantify_patterns.py returned exit code $exitCode"
          }

          Write-Host ""
          Write-Host "[PASS] quantify_patterns.py returned exit code 0."


      # ================================================================
      # 15
      # ================================================================

      - name: 15 - Verify expected quantification outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY EXPECTED QUANTIFICATION OUTPUTS"
          Write-Host "============================================================"
          Write-Host ""

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE"

          $validationDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation"

          $required = @(
              (Join-Path $reportDir "pattern_quantification_result.json"),
              (Join-Path $reportDir "pattern_quantification_summary.csv"),
              (Join-Path $reportDir "pattern_quantification_detail.csv"),
              (Join-Path $reportDir "pattern_quantification_source_manifest.csv"),
              (Join-Path $reportDir "pattern_registry.json"),
              (Join-Path $reportDir "pattern_feature_contract.json"),
              (Join-Path $reportDir "README.txt"),
              (Join-Path $validationDir "quantify_patterns_checkpoint.json")
          )

          foreach ($path in $required) {

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required quantification output missing: $path"
              }

              $item = Get-Item -LiteralPath $path

              if ($item.Length -le 0) {
                  throw "Quantification output is empty: $path"
              }

              Write-Host "[PASS] $path"
          }


      # ================================================================
      # 16
      # ================================================================

      - name: 16 - Validate result JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE RESULT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\pattern_quantification_result.json"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]

          try:
              with path.open("r", encoding="utf-8-sig") as f:
                  result = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse result JSON: {exc}")
              raise SystemExit(1)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              result.get("program") == "quantify_patterns.py",
              f"Unexpected result program: {result.get('program')}",
          )

          require(
              result.get("version") == expected_version,
              f"Unexpected result version: {result.get('version')}",
          )

          require(
              result.get("stage") == "PATTERN QUANTIFICATION",
              f"Unexpected stage: {result.get('stage')}",
          )

          require(
              result.get("status") == "PASS",
              f"Quantification result status is not PASS: {result.get('status')}",
          )

          patterns = result.get("patterns", {})

          require(
              int(patterns.get("count", -1)) == 9,
              f"Expected 9 patterns. Found={patterns.get('count')}",
          )

          require(
              patterns.get("final_formulas_defined") is False,
              "Clean V001 must not claim final pattern formulas are defined.",
          )

          require(
              patterns.get("future_information_allowed") is False,
              "Future information must not be allowed.",
          )

          feature_contract = result.get("common_feature_contract", {})

          require(
              feature_contract.get("future_candles_used") is False,
              "Result indicates future candles were used.",
          )

          safety = result.get("safety", {})

          require(
              safety.get("ohlcv_read_only") is True,
              "OHLCV read-only safety flag is not true.",
          )

          require(
              safety.get("ohlcv_write_allowed") is False,
              "OHLCV write safety flag is invalid.",
          )

          require(
              safety.get("ohlcv_delete_allowed") is False,
              "OHLCV delete safety flag is invalid.",
          )

          require(
              safety.get("future_labels_allowed") is False,
              "Future labels safety flag is invalid.",
          )

          require(
              safety.get("backtest_allowed") is False,
              "Backtest safety flag is invalid.",
          )

          require(
              safety.get("prediction_allowed") is False,
              "Prediction safety flag is invalid.",
          )

          require(
              safety.get("trading_allowed") is False,
              "Trading safety flag is invalid.",
          )

          require(
              safety.get("source_sha256_unchanged") is True,
              "Result indicates production OHLCV SHA256 changed.",
          )

          statistics = result.get("statistics", {})

          print("[PASS] Program")
          print("[PASS] Version")
          print("[PASS] Stage")
          print("[PASS] Result status")
          print("[PASS] 9 pattern registry")
          print("[PASS] Final formulas remain undefined")
          print("[PASS] Future information forbidden")
          print("[PASS] Production OHLCV read-only")
          print("[PASS] Production OHLCV SHA256 unchanged")
          print("")
          print("Files discovered:")
          print(f"  {statistics.get('files_discovered')}")
          print("")
          print("READY:")
          print(f"  {statistics.get('files_ready')}")
          print("")
          print("WARN:")
          print(f"  {statistics.get('files_warning')}")
          print("")
          print("ERROR:")
          print(f"  {statistics.get('files_error')}")
          print("")
          print("Historical gaps:")
          print(f"  {statistics.get('total_gaps')}")
          '@ |
              py - "$path" "$env:EXPECTED_VERSION"

          if ($LASTEXITCODE -ne 0) {
              throw "Result JSON validation failed."
          }


      # ================================================================
      # 17
      # ================================================================

      - name: 17 - Validate pattern registry JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE PATTERN REGISTRY JSON"
          Write-Host "============================================================"
          Write-Host ""

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\pattern_registry.json"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          try:
              with path.open("r", encoding="utf-8-sig") as f:
                  registry = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse pattern registry: {exc}")
              raise SystemExit(1)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              int(registry.get("pattern_count", -1)) == 9,
              f"Pattern registry count mismatch. "
              f"Expected=9 Found={registry.get('pattern_count')}",
          )

          require(
              registry.get("future_information_allowed") is False,
              "Pattern registry unexpectedly allows future information.",
          )

          expected = [
              "\u0032\u0035\u0036",
              "\ubc25\uadf8\ub987\u0020\u0033\ubc88\uc790\ub9ac",
              "\uc5ed\ub9e4\uacf5\ud30c",
              "\uacf5\uad6c\ub9ac",
              "\ub3cc\ud30c",
              "\ub20c\ub9bc\ubaa9",
              "\uae30\uc900\ubd09",
              "\ud558\uc774\ud790",
              "\uc624\ub3cc\uc774",
          ]

          patterns = registry.get("patterns", [])

          actual = [
              pattern.get("korean_name")
              for pattern in patterns
          ]

          for name in expected:
              require(
                  name in actual,
                  f"Required pattern missing from registry: {name}",
              )
              print(f"[PASS] {name}")

          for pattern in patterns:
              name = pattern.get("korean_name")

              require(
                  pattern.get("future_data_allowed") is False,
                  f"Pattern unexpectedly allows future data: {name}",
              )

              require(
                  pattern.get("formula_status")
                  == "PENDING_RESEARCH_DEFINITION",
                  f"Unexpected formula status for {name}: "
                  f"{pattern.get('formula_status')}",
              )

          print("")
          print("[PASS] Pattern registry contract validated.")
          '@ |
              py - "$path"

          if ($LASTEXITCODE -ne 0) {
              throw "Pattern registry JSON validation failed."
          }


      # ================================================================
      # 18
      # ================================================================

      - name: 18 - Validate feature contract JSON
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE FEATURE CONTRACT JSON"
          Write-Host "============================================================"
          Write-Host ""

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\pattern_feature_contract.json"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          try:
              with path.open("r", encoding="utf-8-sig") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse feature contract: {exc}")
              raise SystemExit(1)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          contract = data.get("contract", {})

          require(
              contract.get("current_candle_allowed") is True,
              "Current candle must be allowed.",
          )

          require(
              contract.get("past_candles_allowed") is True,
              "Past candles must be allowed.",
          )

          require(
              contract.get("future_candles_allowed") is False,
              "Future candles must not be allowed.",
          )

          require(
              contract.get("negative_shift_allowed") is False,
              "Negative shift must not be allowed.",
          )

          require(
              contract.get("centered_rolling_allowed") is False,
              "Centered rolling must not be allowed.",
          )

          require(
              contract.get("future_labels_generated") is False,
              "Future labels must not be generated.",
          )

          require(
              contract.get("backtest_generated") is False,
              "Backtest must not be generated.",
          )

          common_features = data.get("common_features", [])

          require(
              isinstance(common_features, list)
              and len(common_features) > 0,
              "Common feature contract is empty.",
          )

          print("[PASS] Current candle allowed")
          print("[PASS] Past candles allowed")
          print("[PASS] Future candles forbidden")
          print("[PASS] Negative shift forbidden")
          print("[PASS] Centered rolling forbidden")
          print("[PASS] Future labels not generated")
          print("[PASS] Backtest not generated")
          print("")
          print("Common features:")
          print(f"  {len(common_features)}")
          '@ |
              py - "$path"

          if ($LASTEXITCODE -ne 0) {
              throw "Feature contract JSON validation failed."
          }


      # ================================================================
      # 19
      # ================================================================

      - name: 19 - Validate checkpoint
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE CHECKPOINT"
          Write-Host "============================================================"
          Write-Host ""

          $path = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation\quantify_patterns_checkpoint.json"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]
          expected_file_count = int(sys.argv[3])

          try:
              with path.open("r", encoding="utf-8-sig") as f:
                  checkpoint = json.load(f)
          except Exception as exc:
              print(f"[FAIL] Unable to parse checkpoint: {exc}")
              raise SystemExit(1)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              checkpoint.get("program") == "quantify_patterns.py",
              f"Unexpected checkpoint program: "
              f"{checkpoint.get('program')}",
          )

          require(
              checkpoint.get("version") == expected_version,
              f"Unexpected checkpoint version: "
              f"{checkpoint.get('version')}",
          )

          require(
              checkpoint.get("stage") == "PATTERN QUANTIFICATION",
              f"Unexpected checkpoint stage: "
              f"{checkpoint.get('stage')}",
          )

          require(
              checkpoint.get("final_status") == "PASS",
              f"Checkpoint final_status is not PASS: "
              f"{checkpoint.get('final_status')}",
          )

          require(
              int(checkpoint.get("pattern_count", -1)) == 9,
              "Checkpoint pattern count mismatch.",
          )

          require(
              checkpoint.get("future_information_used") is False,
              "Checkpoint indicates future information was used.",
          )

          source_file_count = int(
              checkpoint.get("source_file_count", -1)
          )

          require(
              source_file_count == expected_file_count,
              f"Checkpoint source file count mismatch. "
              f"Expected={expected_file_count} "
              f"Found={source_file_count}",
          )

          completed = checkpoint.get("completed", {})

          require(
              isinstance(completed, dict),
              "Checkpoint completed field is not an object.",
          )

          completed_count = len(completed)

          require(
              completed_count == expected_file_count,
              f"Checkpoint completed entry count mismatch. "
              f"Expected={expected_file_count} "
              f"Found={completed_count}",
          )

          print("[PASS] Checkpoint program")
          print("[PASS] Checkpoint version")
          print("[PASS] Checkpoint stage")
          print("[PASS] Final status")
          print("[PASS] Pattern count")
          print("[PASS] Future information unused")
          print("[PASS] Source file count")
          print("[PASS] Completed checkpoint entries")
          print("")
          print("Completed entries:")
          print(f"  {completed_count}")
          '@ |
              py - `
                  "$path" `
                  "$env:EXPECTED_VERSION" `
                  "$env:OHLCV_FILE_COUNT"

          if ($LASTEXITCODE -ne 0) {
              throw "Checkpoint validation failed."
          }


      # ================================================================
      # 20
      # ================================================================

      - name: 20 - Validate source manifest hashes
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VALIDATE SOURCE MANIFEST HASHES"
          Write-Host "============================================================"
          Write-Host ""

          $manifestPath = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\pattern_quantification_source_manifest.csv"

          $manifest = @(
              Import-Csv -LiteralPath $manifestPath
          )

          if ($manifest.Count -ne [int]$env:OHLCV_FILE_COUNT) {
              throw "Source manifest count mismatch. Expected=$env:OHLCV_FILE_COUNT Found=$($manifest.Count)"
          }

          $checked = 0

          foreach ($row in $manifest) {

              $fullPath = Join-Path `
                  $env:PRODUCTION_ROOT `
                  $row.relative_path

              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Manifest source file missing: $fullPath"
              }

              $currentHash = (
                  Get-FileHash `
                      -LiteralPath $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($currentHash -ne $row.sha256) {
                  throw "Manifest SHA256 mismatch: $($row.relative_path)"
              }

              $checked++
          }

          Write-Host "[PASS] Source manifest hashes verified."
          Write-Host "[PASS] Files checked: $checked"


      # ================================================================
      # 21
      # ================================================================

      - name: 21 - Verify no forbidden Git operations are executable
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY NO FORBIDDEN GIT OPERATIONS ARE EXECUTABLE"
          Write-Host "============================================================"
          Write-Host ""

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          $content = Get-Content `
              -LiteralPath $program `
              -Raw `
              -Encoding UTF8

          $forbiddenPatterns = @(
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+reset',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+clean',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+commit',
              '(?im)^\s*(?:os\.system|subprocess\.[A-Za-z_]+)\s*\([^\r\n]*git\s+push'
          )

          foreach ($pattern in $forbiddenPatterns) {

              if ([regex]::IsMatch($content, $pattern)) {
                  throw "Potential executable forbidden Git mutation detected."
              }
          }

          Write-Host "[PASS] No executable git reset detected."
          Write-Host "[PASS] No executable git clean detected."
          Write-Host "[PASS] No executable git commit detected."
          Write-Host "[PASS] No executable git push detected."


      # ================================================================
      # 22
      # ================================================================

      - name: 22 - Final Clean V001 test gate
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL CLEAN V001 TEST GATE"
          Write-Host "============================================================"
          Write-Host ""

          if ([int]$env:QUANTIFY_EXIT_CODE -ne 0) {
              throw "Quantification process did not pass."
          }

          $resultPath = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE\pattern_quantification_result.json"

          @'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])

          with path.open("r", encoding="utf-8-sig") as f:
              result = json.load(f)

          def require(condition, message):
              if not condition:
                  print(f"[FAIL] {message}")
                  raise SystemExit(1)

          require(
              result.get("status") == "PASS",
              "Final result status is not PASS.",
          )

          safety = result.get("safety", {})

          require(
              safety.get("source_sha256_unchanged") is True,
              "Production OHLCV immutability check failed.",
          )

          patterns = result.get("patterns", {})

          require(
              int(patterns.get("count", -1)) == 9,
              "Nine-pattern registry check failed.",
          )

          require(
              patterns.get("final_formulas_defined") is False,
              "Clean V001 unexpectedly defines final pattern formulas.",
          )

          feature_contract = result.get(
              "common_feature_contract",
              {},
          )

          require(
              feature_contract.get("future_candles_used") is False,
              "Future-information gate failed.",
          )

          print("[PASS] Final result status")
          print("[PASS] OHLCV immutability")
          print("[PASS] Nine-pattern registry")
          print("[PASS] Final formulas remain undefined")
          print("[PASS] Future-information gate")
          '@ |
              py - "$resultPath"

          if ($LASTEXITCODE -ne 0) {
              throw "Final Clean V001 gate failed."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[PASS] quantify_patterns_test.yml"
          Write-Host "[PASS] quantify_patterns.py Clean V001"
          Write-Host "[PASS] Production OHLCV unchanged"
          Write-Host "[PASS] 9 research patterns registered"
          Write-Host "[PASS] Common quantitative features prepared"
          Write-Host "[PASS] Future-information leakage blocked"
          Write-Host "[PASS] Checkpoint validated"
          Write-Host "[PASS] Source manifest validated"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[NEXT]"
          Write-Host "After this workflow passes, proceed to:"
          Write-Host "  quantify_patterns.yml"


      # ================================================================
      # 23
      # ================================================================

      - name: 23 - Failure diagnostics
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FAILURE DIAGNOSTICS"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host "  $env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "Production root:"
          Write-Host "  $env:PRODUCTION_ROOT"

          Write-Host ""
          Write-Host "Quantification exit code:"
          Write-Host "  $env:QUANTIFY_EXIT_CODE"

          Write-Host ""
          Write-Host "Report directory:"

          $reportDir = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\reports\$env:REPORT_NAMESPACE"

          if (Test-Path -LiteralPath $reportDir) {

              Get-ChildItem `
                  -LiteralPath $reportDir `
                  -Force |
                  Format-Table `
                      Name,
                      Length,
                      LastWriteTime `
                      -AutoSize |
                  Out-String |
                  Write-Host
          }
          else {
              Write-Host "  [MISSING] $reportDir"
          }

          Write-Host ""
          Write-Host "Checkpoint:"

          $checkpoint = Join-Path `
              $env:PRODUCTION_ROOT `
              "data\validation\quantify_patterns_checkpoint.json"

          if (Test-Path -LiteralPath $checkpoint) {
              Write-Host "  [FOUND] $checkpoint"
          }
          else {
              Write-Host "  [MISSING] $checkpoint"
          }


      # ================================================================
      # 24
      # ================================================================

      - name: 24 - Upload pattern quantification test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-quantification-test-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.PRODUCTION_ROOT }}/data/reports/pattern_quantification/**
            ${{ env.PRODUCTION_ROOT }}/data/validation/quantify_patterns_checkpoint.json
            ${{ env.QUANTIFY_TEST_SNAPSHOT_DIR }}/ohlcv_files_before.txt
            ${{ env.QUANTIFY_TEST_SNAPSHOT_DIR }}/ohlcv_files_after.txt
            ${{ env.QUANTIFY_TEST_SNAPSHOT_DIR }}/ohlcv_sha256_before.csv
            ${{ env.QUANTIFY_TEST_SNAPSHOT_DIR }}/ohlcv_sha256_after.csv
