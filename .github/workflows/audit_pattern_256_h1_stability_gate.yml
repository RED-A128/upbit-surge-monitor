
name: audit_pattern_256_h1_stability_gate.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-h1-stability-gate
  cancel-in-progress: false

jobs:
  stability-gate:
    name: stability-gate

    runs-on:
      - self-hosted
      - Windows

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        id: environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================="
          Write-Host "Pattern 256 H1 Stability Gate"
          Write-Host "=================================="

          whoami
          Write-Host $PSVersionTable.PSVersion.ToString()

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h1_stability_gate.py"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h1_period_stability"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python script missing: $script"
          }

          if (-not (Test-Path -LiteralPath $folder -PathType Container)) {
            throw "Input folder missing: $folder"
          }

          $files = @(
            "period_stability_result.json",
            "period_stability_report.md",
            "period_stability_manifest.json"
          )

          foreach ($name in $files) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Input missing: $path"
            }

            Write-Host "[FOUND] $name"
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher failed"
          }

          Write-Host "[PASS] Environment"

      - name: Execute stability gate
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h1_stability_gate.py"

          & py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Stability gate execution failed"
          }

          Write-Host "[PASS] Stability gate"

      - name: Verify output integrity
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h1_stability_gate"

          $manifestPath = Join-Path `
            $folder `
            "stability_gate_manifest.json"

          $resultPath = Join-Path `
            $folder `
            "stability_gate_result.json"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Manifest missing"
          }

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $names = @(
            "stability_gate_result.json",
            "stability_gate_report.md"
          )

          foreach ($name in $names) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Report missing: $name"
            }

            $expected = $manifest.output_sha256.$name

            if ([string]::IsNullOrWhiteSpace($expected)) {
              throw "SHA256 missing: $name"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Execution is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Unexpected OOS approval"
          }

          if ($result.profitability_proven -ne $false) {
            throw "Unexpected profitability approval"
          }

          Write-Host "[PASS] Output integrity"

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $folder = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h1_stability_gate"

          $path = Join-Path `
            $folder `
            "stability_gate_result.json"

          $r = Get-Content `
            -LiteralPath $path `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 H1 Stability Gate",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Version | $($r.version) |",
            "| Execution | $($r.execution) |",
            "| Classification | $($r.classification) |",
            "| Total pairs | $($r.total_pairs) |",
            "| Positive years | $($r.positive_years) |",
            "| Negative years | $($r.negative_years) |",
            "| First period difference pp | $($r.first_period_difference_pp) |",
            "| Latest period difference pp | $($r.latest_period_difference_pp) |",
            "| Change pp | $($r.latest_minus_first_pp) |",
            "| McNemar p | $($r.mcnemar_exact_p) |",
            "| Research decision | $($r.research_decision) |",
            "",
            "Independent OOS: NOT PROVEN.",
            "",
            "Profitability: NOT PROVEN.",
            "",
            "Training and live trading remain unapproved."
          )

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

      - name: Stage verified reports
        id: stage
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:PROJECT_ROOT `
            "data\reports\pattern_256_h1_stability_gate"

          $destination = Join-Path `
            $env:GITHUB_WORKSPACE `
            "stability_gate_artifact"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item `
              -LiteralPath $destination `
              -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          $names = @(
            "stability_gate_result.json",
            "stability_gate_report.md",
            "stability_gate_manifest.json"
          )

          foreach ($name in $names) {
            $src = Join-Path $source $name
            $dst = Join-Path $destination $name

            Copy-Item `
              -LiteralPath $src `
              -Destination $dst `
              -ErrorAction Stop

            $sourceHash = (
              Get-FileHash `
                -LiteralPath $src `
                -Algorithm SHA256
            ).Hash

            $targetHash = (
              Get-FileHash `
                -LiteralPath $dst `
                -Algorithm SHA256
            ).Hash

            if ($sourceHash -ne $targetHash) {
              throw "Staging SHA256 mismatch: $name"
            }

            Write-Host "[STAGED] $name"
          }

      - name: Upload reports
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-h1-stability-gate
          path: stability_gate_artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $checks = @(
            "${{ steps.environment.outcome }}",
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.stage.outcome }}",
            "${{ steps.upload.outcome }}"
          )

          foreach ($status in $checks) {
            if ($status -ne "success") {
              throw "Workflow stage failed: $status"
            }
          }

          Write-Host "[PASS] All verification stages"
          Write-Host "Research decision: HOLD"
