
name: evaluate_pattern_256_statistical_robustness.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-statistical-robustness
  cancel-in-progress: false

jobs:
  statistical-robustness:
    name: statistical-robustness

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      SCRIPT_NAME: evaluate_pattern_256_statistical_robustness.py
      INPUT_RELATIVE: data/reports/pattern_256_walk_forward
      OUTPUT_RELATIVE: data/reports/pattern_256_statistical_robustness
      EXPECTED_VERSION: Clean V003-3
      EXPECTED_SOURCE_SHA256: ed4b4e44fcb387ab70eaac465b3eaa87036466298fde344195e25d06ad7996e0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Verify script and input files
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Statistical robustness Python script missing"
          }

          $inputDir = Join-Path `
            $env:PROJECT_ROOT `
            $env:INPUT_RELATIVE

          $requiredFiles = @(
            "walk_forward_comparison.csv",
            "walk_forward_by_market.csv",
            "walk_forward_result.json",
            "walk_forward_manifest.json"
          )

          foreach ($filename in $requiredFiles) {
            $path = Join-Path $inputDir $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing input: $path"
            }
          }

          Write-Host "[PASS] Script found"
          Write-Host "[PASS] Input files found"

      - name: Run statistical robustness evaluation
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SCRIPT_NAME

          py -u $script --root $env:PROJECT_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Statistical robustness evaluation failed"
          }

      - name: Verify result and SHA256 integrity
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])

          output = root / (
              "data/reports/"
              "pattern_256_statistical_robustness"
          )

          input_dir = root / (
              "data/reports/"
              "pattern_256_walk_forward"
          )

          result_path = (
              output / "robustness_result.json"
          )

          manifest_path = (
              output / "robustness_manifest.json"
          )

          comparison_path = (
              output / "robustness_comparison.csv"
          )

          concentration_path = (
              output / "robustness_market_concentration.csv"
          )

          expected_version = os.environ["EXPECTED_VERSION"]

          expected_source_hash = os.environ[
              "EXPECTED_SOURCE_SHA256"
          ]

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(4 * 1024 * 1024),
                      b"",
                  ):
                      digest.update(chunk)

              return digest.hexdigest()

          for path in (
              result_path,
              manifest_path,
              comparison_path,
              concentration_path,
          ):
              if not path.is_file():
                  raise SystemExit(
                      "Missing output: " + str(path)
                  )

          result = json.loads(
              result_path.read_text(encoding="utf-8")
          )

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          if result.get("version") != expected_version:
              raise SystemExit("Result version mismatch")

          if manifest.get("version") != expected_version:
              raise SystemExit("Manifest version mismatch")

          if result.get("execution_status") != "PASS":
              raise SystemExit("Evaluation not PASS")

          if result.get("overall_decision") != "HOLD":
              raise SystemExit("Unexpected overall decision")

          if result.get("source_rows") != 7949826:
              raise SystemExit("Source row count mismatch")

          if result.get("comparison_rows") != 36:
              raise SystemExit("Comparison row count mismatch")

          if result.get("concentration_rows") != 72:
              raise SystemExit("Concentration row count mismatch")

          if result.get("research_groups") != 9:
              raise SystemExit("Research group count mismatch")

          if len(result.get("summary", [])) != 9:
              raise SystemExit("Research summary mismatch")

          if (
              result.get("source_sha256")
              != expected_source_hash
          ):
              raise SystemExit("Original source SHA256 mismatch")

          if (
              manifest.get("source_sha256")
              != expected_source_hash
          ):
              raise SystemExit("Manifest source SHA256 mismatch")

          for flag in (
              "independent_oos_proven",
              "statistical_independence_proven",
              "causal_improvement_proven",
              "profitability_proven",
              "approved_for_live_trading",
          ):
              if result.get(flag) is not False:
                  raise SystemExit(
                      "Safety flag mismatch: " + flag
                  )

          expected_outputs = {
              "robustness_comparison.csv",
              "robustness_market_concentration.csv",
              "robustness_result.json",
          }

          output_hashes = manifest.get("output_sha256")

          if not isinstance(output_hashes, dict):
              raise SystemExit("Invalid output hashes")

          if set(output_hashes) != expected_outputs:
              raise SystemExit("Unexpected output file list")

          for filename in sorted(expected_outputs):
              actual = sha256_file(output / filename)

              if actual != output_hashes[filename]:
                  raise SystemExit(
                      "Output SHA256 mismatch: " + filename
                  )

              print("[PASS] Output SHA256:", filename)

          input_hashes = manifest.get("input_sha256")

          expected_inputs = {
              "walk_forward_comparison.csv",
              "walk_forward_by_market.csv",
              "walk_forward_result.json",
          }

          if not isinstance(input_hashes, dict):
              raise SystemExit("Invalid input hashes")

          if set(input_hashes) != expected_inputs:
              raise SystemExit("Unexpected input file list")

          for filename in sorted(expected_inputs):
              actual = sha256_file(input_dir / filename)

              if actual != input_hashes[filename]:
                  raise SystemExit(
                      "Input SHA256 mismatch: " + filename
                  )

              print("[PASS] Input SHA256:", filename)

          with comparison_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              comparisons = list(csv.DictReader(handle))

          with concentration_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              concentrations = list(csv.DictReader(handle))

          if len(comparisons) != 36:
              raise SystemExit("Comparison CSV mismatch")

          if len(concentrations) != 72:
              raise SystemExit("Concentration CSV mismatch")

          expected_comparisons = {
              (fold, role, timeframe, str(horizon))
              for fold in (
                  "2024_to_2025",
                  "2025_to_2026",
              )
              for role in ("TRAIN", "TEST")
              for timeframe in ("h1", "h4", "d1")
              for horizon in (24, 72, 168)
          }

          actual_comparisons = {
              (
                  row["fold"],
                  row["role"],
                  row["timeframe"],
                  row["horizon"],
              )
              for row in comparisons
          }

          if actual_comparisons != expected_comparisons:
              raise SystemExit("Comparison groups mismatch")

          if any(
              row["decision"] != "HOLD"
              for row in comparisons
          ):
              raise SystemExit("Unexpected comparison decision")

          print("[PASS] Clean V003-3")
          print("[PASS] 36 comparison rows")
          print("[PASS] 72 concentration rows")
          print("[PASS] 9 research groups")
          print("[PASS] All SHA256 checks")
          print("[DECISION] HOLD")
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Statistical robustness verification failed"
          }

      - name: Upload statistical robustness results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-statistical-robustness-v003-3
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_statistical_robustness/robustness_comparison.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_statistical_robustness/robustness_market_concentration.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_statistical_robustness/robustness_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_statistical_robustness/robustness_manifest.json
          if-no-files-found: error
          retention-days: 14
