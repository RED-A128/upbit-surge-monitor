
name: evaluate_pattern_256_accumulation_candidate_oos_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-oos-evaluation-test
  cancel-in-progress: false

jobs:
  candidate-oos-evaluation-test:
    name: Candidate OOS Evaluation Test
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      INPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_oos
      OUTPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_oos_evaluation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE "evaluate_pattern_256_accumulation_candidate_oos.py"

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program not found: $program"
          }

          py --version
          Write-Host "[PASS] Python program found."

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $productionInput = Join-Path $env:PRODUCTION_ROOT $env:INPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $productionInput -PathType Container)) {
            throw "Production input directory missing: $productionInput"
          }

          $required = @(
            "candidate_oos_summary.csv",
            "candidate_oos_yearly.csv",
            "candidate_oos_result.json"
          )

          $testRoot = Join-Path $env:RUNNER_TEMP "candidate_oos_evaluation_test_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          $testInput = Join-Path $testRoot $env:INPUT_RELATIVE
          New-Item -ItemType Directory -Path $testInput -Force | Out-Null

          foreach ($name in $required) {
            $source = Join-Path $productionInput $name
            $destination = Join-Path $testInput $name

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required production input missing: $source"
            }

            Copy-Item -LiteralPath $source -Destination $destination -ErrorAction Stop

            $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $copyHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash

            if ($sourceHash -ne $copyHash) {
              throw "Test input copy SHA256 mismatch: $name"
            }

            Write-Host "[COPIED] $name"
          }

          "TEST_ROOT=$testRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "[PASS] Isolated test workspace prepared."

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $productionInput = Join-Path $env:PRODUCTION_ROOT $env:INPUT_RELATIVE

          $snapshotPath = Join-Path $env:RUNNER_TEMP "candidate_oos_evaluation_inputs_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT.json"

          $required = @(
            "candidate_oos_summary.csv",
            "candidate_oos_yearly.csv",
            "candidate_oos_result.json"
          )

          $snapshot = @()

          foreach ($name in $required) {
            $path = Join-Path $productionInput $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input missing: $path"
            }

            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            $snapshot += [PSCustomObject]@{
              name = $name
              sha256 = $hash
            }

            Write-Host "[SHA256] $name = $hash"
          }

          if ($snapshot.Count -ne 3) {
            throw "Unexpected input count before snapshot."
          }

          $json = ConvertTo-Json -InputObject $snapshot -Depth 5

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          "INPUT_SNAPSHOT=$snapshotPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "[PASS] Production input SHA256 captured."

      - name: Execute candidate OOS evaluation test
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE "evaluate_pattern_256_accumulation_candidate_oos.py"

          if (-not $env:TEST_ROOT) {
            throw "TEST_ROOT is missing."
          }

          Write-Host "========================================"
          Write-Host "Candidate OOS Evaluation Test"
          Write-Host "========================================"

          & py $program --root $env:TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate OOS evaluation test failed."
          }

          Write-Host "[PASS] Candidate OOS evaluation executed."

      - name: Verify candidate OOS evaluation outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path $env:TEST_ROOT $env:OUTPUT_RELATIVE

          $required = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $outputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Output missing: $path"
            }

            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Empty output: $path"
            }

            Write-Host "[FOUND] $name"
          }

          $resultPath = Join-Path $outputDir "oos_evaluation_result.json"
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Evaluation result status is not PASS."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected live trading approval."
          }

          $manifestPath = Join-Path $outputDir "oos_evaluation_manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json

          $hashFiles = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json"
          )

          foreach ($name in $hashFiles) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Manifest SHA256 missing: $name"
            }

            $expected = [string]$property.Value
            $actual = (Get-FileHash -LiteralPath (Join-Path $outputDir $name) -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "Manifest SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] Evaluation output files verified."
          Write-Host "[PASS] Evaluation manifest SHA256 verified."

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INPUT_SNAPSHOT) {
            throw "Production input snapshot path missing."
          }

          if (-not (Test-Path -LiteralPath $env:INPUT_SNAPSHOT -PathType Leaf)) {
            throw "Production input snapshot missing."
          }

          $productionInput = Join-Path $env:PRODUCTION_ROOT $env:INPUT_RELATIVE

          # IMPORTANT:
          # ConvertFrom-Json returns one array object when
          # -NoEnumerate is used. Force actual array elements.
          # Do not use @(... | ConvertFrom-Json) here.

          $json = Get-Content -LiteralPath $env:INPUT_SNAPSHOT -Raw
          $parsed = ConvertFrom-Json -InputObject $json

          $snapshot = @()
          foreach ($entry in $parsed) {
            $snapshot += $entry
          }

          if ($snapshot.Count -ne 3) {
            throw "Unexpected snapshot count: $($snapshot.Count)"
          }

          $expectedNames = @(
            "candidate_oos_summary.csv",
            "candidate_oos_yearly.csv",
            "candidate_oos_result.json"
          )

          $seen = @{}

          foreach ($entry in $snapshot) {
            $name = [string]$entry.name
            $expectedHash = [string]$entry.sha256

            if ($expectedNames -cnotcontains $name) {
              throw "Unexpected input in snapshot: $name"
            }

            if ($seen.ContainsKey($name)) {
              throw "Duplicate input in snapshot: $name"
            }

            $seen[$name] = $true

            if ($expectedHash -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "Invalid SHA256 in snapshot: $name"
            }

            $path = Join-Path $productionInput $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne $expectedHash) {
              throw "Production input SHA256 changed: $name"
            }

            Write-Host "[UNCHANGED] $name"
          }

          foreach ($name in $expectedNames) {
            if (-not $seen.ContainsKey($name)) {
              throw "Expected input missing from snapshot: $name"
            }
          }

          Write-Host "[PASS] All required production inputs unchanged."

      - name: Upload candidate OOS evaluation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-oos-evaluation-test
          path: ${{ env.TEST_ROOT }}\data\reports\pattern_256_accumulation_candidate_oos_evaluation\
          if-no-files-found: warn
          retention-days: 14
