name: Full KRW Data History Gap Report Clean V002

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-krw-data-history-gap-report-clean-v002
  cancel-in-progress: false

jobs:
  full-history-gap-report:
    name: Full KRW Data History Gap Report Clean V002

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    steps:

      # ============================================================
      # 01. Repository synchronization
      # ============================================================

      - name: Synchronize local repository
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE LOCAL REPOSITORY"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          Write-Host ""
          Write-Host "[PASS] Repository synchronized with origin/main."


      # ============================================================
      # 02. Python verification
      # ============================================================

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY PYTHON"
          Write-Host "============================================================"

          py --version

          py -c "import pandas; print('pandas', pandas.__version__)"

          Write-Host ""
          Write-Host "[PASS] Python environment verified."


      # ============================================================
      # 03. Program verification
      # ============================================================

      - name: Verify gap report program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY GAP REPORT PROGRAM"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          if (-not (Test-Path "data_history_gap_report.py")) {
              throw "data_history_gap_report.py was not found."
          }

          Write-Host "[PASS] data_history_gap_report.py found."


      # ============================================================
      # 04. OHLCV directories
      # ============================================================

      - name: Verify full OHLCV dataset directories
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY FULL OHLCV DATASET DIRECTORIES"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          foreach ($directory in $directories) {

              if (-not (Test-Path $directory)) {
                  throw "Required directory not found: $directory"
              }

              $files = @(
                  Get-ChildItem `
                      -Path $directory `
                      -Filter "*.csv" `
                      -File
              )

              $count = $files.Count

              Write-Host "$directory : $count CSV files"

              if ($count -ne 290) {
                  throw "$directory must contain exactly 290 CSV files. Found: $count"
              }
          }

          Write-Host ""
          Write-Host "[PASS] 290 CSV files verified in h1 / h4 / d1."


      # ============================================================
      # 05. Market set verification
      # ============================================================

      - name: Verify identical market sets
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY IDENTICAL MARKET SETS"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $h1 = @(
              Get-ChildItem `
                  "data\ohlcv\h1" `
                  -Filter "*.csv" `
                  -File |
              ForEach-Object {
                  $_.BaseName
              } |
              Sort-Object
          )

          $h4 = @(
              Get-ChildItem `
                  "data\ohlcv\h4" `
                  -Filter "*.csv" `
                  -File |
              ForEach-Object {
                  $_.BaseName
              } |
              Sort-Object
          )

          $d1 = @(
              Get-ChildItem `
                  "data\ohlcv\d1" `
                  -Filter "*.csv" `
                  -File |
              ForEach-Object {
                  $_.BaseName
              } |
              Sort-Object
          )

          if ($h1.Count -ne 290) {
              throw "H1 market count must be 290. Found: $($h1.Count)"
          }

          if ($h4.Count -ne 290) {
              throw "H4 market count must be 290. Found: $($h4.Count)"
          }

          if ($d1.Count -ne 290) {
              throw "D1 market count must be 290. Found: $($d1.Count)"
          }

          $h1h4 = @(
              Compare-Object `
                  -ReferenceObject $h1 `
                  -DifferenceObject $h4
          )

          $h1d1 = @(
              Compare-Object `
                  -ReferenceObject $h1 `
                  -DifferenceObject $d1
          )

          if ($h1h4.Count -gt 0) {

              Write-Host ""
              Write-Host "H1/H4 mismatch:"

              $h1h4 |
                  Format-Table

              throw "H1/H4 market sets are different."
          }

          if ($h1d1.Count -gt 0) {

              Write-Host ""
              Write-Host "H1/D1 mismatch:"

              $h1d1 |
                  Format-Table

              throw "H1/D1 market sets are different."
          }

          Write-Host ""
          Write-Host "[PASS] Identical 290-market set verified."


      # ============================================================
      # 06. OHLCV SHA256 BEFORE
      # ============================================================

      - name: Record OHLCV SHA256 before gap report
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RECORD OHLCV SHA256 BEFORE GAP REPORT"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $hashDirectory = "data\validation"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $hashDirectory |
              Out-Null

          $beforeFile = Join-Path `
              $hashDirectory `
              "gap_report_ohlcv_before.sha256"

          $records = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $files = @(
                  Get-ChildItem `
                      -Path "data\ohlcv\$timeframe" `
                      -Filter "*.csv" `
                      -File |
                  Sort-Object Name
              )

              foreach ($file in $files) {

                  $hash = (
                      Get-FileHash `
                          -Path $file.FullName `
                          -Algorithm SHA256
                  ).Hash

                  $relative = (
                      "data/ohlcv/" +
                      $timeframe +
                      "/" +
                      $file.Name
                  )

                  $records += "$hash  $relative"
              }
          }

          $records |
              Set-Content `
                  -Path $beforeFile `
                  -Encoding UTF8

          $recordCount = @($records).Count

          Write-Host "Recorded hashes : $recordCount"

          if ($recordCount -ne 870) {
              throw "Expected 870 OHLCV hashes. Found: $recordCount"
          }

          Write-Host ""
          Write-Host "[PASS] 870 OHLCV SHA256 hashes recorded."


      # ============================================================
      # 07. Existing checkpoint inspection
      # ============================================================

      - name: Inspect persistent gap report checkpoint
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "INSPECT PERSISTENT GAP REPORT CHECKPOINT"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $checkpointFile = "data\validation\data_history_gap_report_checkpoint.json"

          if (Test-Path $checkpointFile) {

              Write-Host "Checkpoint : FOUND"

              try {

                  $checkpoint = Get-Content `
                      -Path $checkpointFile `
                      -Raw `
                      -Encoding UTF8 |
                      ConvertFrom-Json

                  if ($null -ne $checkpoint.completed) {

                      $completedCount = @(
                          $checkpoint.completed.PSObject.Properties
                      ).Count

                      Write-Host "Completed  : $completedCount"
                      Write-Host "Resume     : AVAILABLE"
                  }
                  else {

                      Write-Host "Completed  : UNKNOWN"
                      Write-Host "Resume     : CHECKPOINT FORMAT REQUIRES PROGRAM VALIDATION"
                  }
              }
              catch {

                  throw "Existing checkpoint could not be parsed: $($_.Exception.Message)"
              }
          }
          else {

              Write-Host "Checkpoint : NOT FOUND"
              Write-Host "Completed  : 0"
              Write-Host "Resume     : FIRST RUN"
          }

          Write-Host ""
          Write-Host "[PASS] Checkpoint inspection completed."


      # ============================================================
      # 08. Run gap report
      # ============================================================

      - name: Run Full KRW Data History Gap Report Clean V002
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "RUN FULL KRW DATA HISTORY GAP REPORT CLEAN V002"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"

          & py data_history_gap_report.py

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              throw "data_history_gap_report.py failed with exit code $exitCode."
          }

          Write-Host ""
          Write-Host "[PASS] Full gap report execution completed."


      # ============================================================
      # 09. Checkpoint verification
      # FIX:
      # PSObject.Properties must be wrapped with @(...)
      # before Count is evaluated.
      # ============================================================

      - name: Verify completed 870-job checkpoint
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY COMPLETED 870-JOB CHECKPOINT"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $checkpointFile = "data\validation\data_history_gap_report_checkpoint.json"

          if (-not (Test-Path $checkpointFile)) {
              throw "Gap report checkpoint was not created."
          }

          $checkpoint = Get-Content `
              -Path $checkpointFile `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $checkpoint.completed) {
              throw "Checkpoint completed section is missing."
          }

          $completedProperties = @(
              $checkpoint.completed.PSObject.Properties
          )

          $completedCount = $completedProperties.Count

          Write-Host "Completed jobs : $completedCount"

          if ($completedCount -ne 870) {
              throw "Expected 870 completed checkpoint jobs. Found: $completedCount"
          }

          Write-Host ""
          Write-Host "[PASS] 870 completed checkpoint jobs verified."


      # ============================================================
      # 10. Output verification
      # ============================================================

      - name: Verify detailed gap report outputs
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY GAP REPORT OUTPUTS"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $gapReport = "data\reports\history_gap\data_history_gap_report.csv"
          $summaryFile = "data\reports\history_gap\data_history_gap_summary.csv"

          if (-not (Test-Path $gapReport)) {
              throw "Detailed gap report CSV not found: $gapReport"
          }

          if (-not (Test-Path $summaryFile)) {
              throw "Gap summary CSV not found: $summaryFile"
          }

          $summaryRows = @(
              Import-Csv `
                  -Path $summaryFile
          )

          $gapRows = @(
              Import-Csv `
                  -Path $gapReport
          )

          $summaryCount = $summaryRows.Count
          $gapCount = $gapRows.Count

          Write-Host "Summary rows : $summaryCount"
          Write-Host "Gap events   : $gapCount"

          if ($summaryCount -ne 870) {
              throw "Expected 870 summary rows. Found: $summaryCount"
          }

          $filesWithGaps = @(
              $summaryRows |
              Where-Object {
                  [int64]$_.gap_events -gt 0
              }
          ).Count

          $missingEstimated = (
              $summaryRows |
              Measure-Object `
                  -Property estimated_missing_candles `
                  -Sum
          ).Sum

          if ($null -eq $missingEstimated) {
              $missingEstimated = 0
          }

          Write-Host "Files w/gaps : $filesWithGaps"
          Write-Host "Missing est. : $missingEstimated"

          Write-Host ""
          Write-Host "[PASS] Detailed gap report outputs verified."


      # ============================================================
      # 11. Resume verification
      # ============================================================

      - name: Verify Resume behavior
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY RESUME BEHAVIOR"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"

          $checkpointFile = "data\validation\data_history_gap_report_checkpoint.json"

          if (-not (Test-Path $checkpointFile)) {
              throw "Checkpoint file not found before Resume test."
          }

          $checkpointBefore = Get-Content `
              -Path $checkpointFile `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $checkpointBefore.completed) {
              throw "Checkpoint completed section missing before Resume test."
          }

          $completedBefore = @(
              $checkpointBefore.completed.PSObject.Properties
          ).Count

          Write-Host "Completed before Resume : $completedBefore"

          if ($completedBefore -ne 870) {
              throw "Resume test requires 870 completed jobs before execution. Found: $completedBefore"
          }

          Write-Host ""
          Write-Host "Running gap report again to verify Resume..."
          Write-Host ""

          $output = @(
              & py data_history_gap_report.py 2>&1
          )

          $exitCode = $LASTEXITCODE

          foreach ($line in $output) {
              Write-Host "$line"
          }

          if ($exitCode -ne 0) {
              throw "Resume execution failed with exit code $exitCode."
          }

          $checkpointAfter = Get-Content `
              -Path $checkpointFile `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $checkpointAfter.completed) {
              throw "Checkpoint completed section missing after Resume test."
          }

          $completedAfter = @(
              $checkpointAfter.completed.PSObject.Properties
          ).Count

          Write-Host ""
          Write-Host "Completed after Resume : $completedAfter"

          if ($completedAfter -ne 870) {
              throw "Resume checkpoint must contain 870 jobs. Found: $completedAfter"
          }

          $resumeLines = @(
              $output |
              Where-Object {
                  "$_" -match "^\[RESUME\]"
              }
          )

          $resumeCount = $resumeLines.Count

          Write-Host "Resume lines           : $resumeCount"

          if ($resumeCount -ne 870) {
              throw "Expected 870 Resume lines. Found: $resumeCount"
          }

          Write-Host ""
          Write-Host "[PASS] 870 / 870 jobs resumed."
          Write-Host "[PASS] Persistent Resume behavior verified."


      # ============================================================
      # 12. OHLCV SHA256 AFTER
      # ============================================================

      - name: Verify all OHLCV files remained unchanged
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY ALL OHLCV FILES REMAINED UNCHANGED"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $beforeFile = "data\validation\gap_report_ohlcv_before.sha256"
          $afterFile = "data\validation\gap_report_ohlcv_after.sha256"

          if (-not (Test-Path $beforeFile)) {
              throw "Before-hash file not found."
          }

          $records = @()

          foreach ($timeframe in @("h1", "h4", "d1")) {

              $files = @(
                  Get-ChildItem `
                      -Path "data\ohlcv\$timeframe" `
                      -Filter "*.csv" `
                      -File |
                  Sort-Object Name
              )

              foreach ($file in $files) {

                  $hash = (
                      Get-FileHash `
                          -Path $file.FullName `
                          -Algorithm SHA256
                  ).Hash

                  $relative = (
                      "data/ohlcv/" +
                      $timeframe +
                      "/" +
                      $file.Name
                  )

                  $records += "$hash  $relative"
              }
          }

          $records |
              Set-Content `
                  -Path $afterFile `
                  -Encoding UTF8

          $recordCount = @($records).Count

          if ($recordCount -ne 870) {
              throw "Expected 870 AFTER hashes. Found: $recordCount"
          }

          $before = @(
              Get-Content `
                  -Path $beforeFile `
                  -Encoding UTF8
          )

          $after = @(
              Get-Content `
                  -Path $afterFile `
                  -Encoding UTF8
          )

          if ($before.Count -ne 870) {
              throw "BEFORE hash file must contain 870 entries. Found: $($before.Count)"
          }

          if ($after.Count -ne 870) {
              throw "AFTER hash file must contain 870 entries. Found: $($after.Count)"
          }

          $difference = @(
              Compare-Object `
                  -ReferenceObject $before `
                  -DifferenceObject $after
          )

          if ($difference.Count -gt 0) {

              Write-Host ""
              Write-Host "OHLCV HASH DIFFERENCES:"

              $difference |
                  Format-Table

              throw "OHLCV source files changed during gap reporting."
          }

          Write-Host "Verified hashes : $recordCount"

          Write-Host ""
          Write-Host "[PASS] All 870 OHLCV source files remained unchanged."


      # ============================================================
      # 13. Runtime ignore verification
      # ============================================================

      - name: Verify generated gap data remains ignored
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "VERIFY GENERATED GAP DATA REMAINS IGNORED"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $requiredIgnoredPaths = @(
              "data/reports/history_gap/data_history_gap_report.csv",
              "data/reports/history_gap/data_history_gap_summary.csv",
              "data/validation/data_history_gap_report_checkpoint.json",
              "data/validation/gap_report_ohlcv_before.sha256",
              "data/validation/gap_report_ohlcv_after.sha256"
          )

          foreach ($path in $requiredIgnoredPaths) {

              & git check-ignore -q -- $path

              if ($LASTEXITCODE -ne 0) {
                  throw "Generated runtime file is NOT ignored by Git: $path"
              }

              Write-Host "[IGNORED] $path"
          }

          Write-Host ""
          Write-Host "[PASS] Gap report runtime files are ignored."


      # ============================================================
      # 14. Final Git safety
      # ============================================================

      - name: Verify final Git safety
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "FINAL GIT SAFETY CHECK"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $changes = @(
              git status `
                  --short `
                  --untracked-files=all
          )

          if ($changes.Count -eq 0) {

              Write-Host "Git-visible changes : 0"
              Write-Host ""
              Write-Host "[PASS] Working tree has no Git-visible runtime changes."

              exit 0
          }

          Write-Host "Git-visible changes detected:"
          Write-Host ""

          foreach ($line in $changes) {
              Write-Host "$line"
          }

          $unsafe = @()

          foreach ($line in $changes) {

              $text = "$line"

              if (
                  $text -match "data[/\\]reports[/\\]history_gap" -or
                  $text -match "data[/\\]validation[/\\]data_history_gap_report_checkpoint\.json" -or
                  $text -match "data[/\\]validation[/\\]gap_report_ohlcv_(before|after)\.sha256"
              ) {
                  continue
              }

              $unsafe += $text
          }

          $unsafeCount = @($unsafe).Count

          if ($unsafeCount -gt 0) {

              Write-Host ""
              Write-Host "Unexpected Git-visible changes:"
              Write-Host ""

              foreach ($line in $unsafe) {
                  Write-Host "$line"
              }

              throw "Gap report created unexpected Git-visible changes."
          }

          Write-Host ""
          Write-Host "[PASS] No unsafe Git-visible runtime changes detected."


      # ============================================================
      # 15. Final summary
      # ============================================================

      - name: Full Data History Gap Report test completed
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "FULL KRW DATA HISTORY GAP REPORT SUMMARY"
          Write-Host "============================================================"

          Set-Location "${{ github.workspace }}"

          $summaryFile = "data\reports\history_gap\data_history_gap_summary.csv"
          $gapFile = "data\reports\history_gap\data_history_gap_report.csv"
          $checkpointFile = "data\validation\data_history_gap_report_checkpoint.json"

          if (-not (Test-Path $summaryFile)) {
              throw "Summary file missing."
          }

          if (-not (Test-Path $gapFile)) {
              throw "Gap report file missing."
          }

          if (-not (Test-Path $checkpointFile)) {
              throw "Checkpoint file missing."
          }

          $summary = @(
              Import-Csv `
                  -Path $summaryFile
          )

          $gaps = @(
              Import-Csv `
                  -Path $gapFile
          )

          $checkpoint = Get-Content `
              -Path $checkpointFile `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json

          if ($null -eq $checkpoint.completed) {
              throw "Checkpoint completed section missing."
          }

          $completedCount = @(
              $checkpoint.completed.PSObject.Properties
          ).Count

          if ($completedCount -ne 870) {
              throw "Final checkpoint count must be 870. Found: $completedCount"
          }

          $summaryCount = $summary.Count
          $gapCount = $gaps.Count

          if ($summaryCount -ne 870) {
              throw "Final summary must contain 870 rows. Found: $summaryCount"
          }

          $filesWithGaps = @(
              $summary |
              Where-Object {
                  [int64]$_.gap_events -gt 0
              }
          ).Count

          $missingEstimated = (
              $summary |
              Measure-Object `
                  -Property estimated_missing_candles `
                  -Sum
          ).Sum

          if ($null -eq $missingEstimated) {
              $missingEstimated = 0
          }

          $largestGap = (
              $summary |
              Measure-Object `
                  -Property largest_gap_seconds `
                  -Maximum
          ).Maximum

          if ($null -eq $largestGap) {
              $largestGap = 0
          }

          Write-Host "Project          : Upbit Surge Monitor"
          Write-Host "Version          : Data History Gap Report Clean V002"
          Write-Host "Execution mode   : FULL KRW MARKET"
          Write-Host "Markets          : 290"
          Write-Host "Timeframes       : 3"
          Write-Host "Total jobs       : 870"

          Write-Host ""
          Write-Host "Resume:"
          Write-Host "  Checkpoint     : VERIFIED"
          Write-Host "  Completed jobs : $completedCount"
          Write-Host "  Resume test    : VERIFIED"

          Write-Host ""
          Write-Host "Gap findings:"
          Write-Host "  Summary rows   : $summaryCount"
          Write-Host "  Files w/gaps   : $filesWithGaps"
          Write-Host "  Gap events     : $gapCount"
          Write-Host "  Missing est.   : $missingEstimated"
          Write-Host "  Largest gap    : $largestGap seconds"

          Write-Host ""
          Write-Host "Integrity:"
          Write-Host "  OHLCV h1       : 290 VERIFIED"
          Write-Host "  OHLCV h4       : 290 VERIFIED"
          Write-Host "  OHLCV d1       : 290 VERIFIED"
          Write-Host "  OHLCV SHA256   : UNCHANGED"
          Write-Host "  Runtime ignore : VERIFIED"

          Write-Host ""
          Write-Host "Safety:"
          Write-Host "  OHLCV write    : DISABLED"
          Write-Host "  OHLCV delete   : DISABLED"
          Write-Host "  Gap repair     : DISABLED"
          Write-Host "  Feature build  : DISABLED"
          Write-Host "  256 Detector   : DISABLED"
          Write-Host "  Future labels  : DISABLED"
          Write-Host "  Prediction     : DISABLED"
          Write-Host "  Trading        : DISABLED"
          Write-Host "  Git reset      : DISABLED"
          Write-Host "  Git clean      : DISABLED"
          Write-Host "  Git commit     : DISABLED"
          Write-Host "  Git push       : DISABLED"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[RESULT] FULL KRW DATA HISTORY GAP REPORT PASSED"
          Write-Host "[PASS] 290 markets verified."
          Write-Host "[PASS] 870 / 870 jobs verified."
          Write-Host "[PASS] Persistent Resume verified."
          Write-Host "[PASS] All OHLCV source files remained unchanged."

          if ($gapCount -gt 0) {
              Write-Host "[INFO] Historical timestamp gaps were detected."
              Write-Host "[NEXT] Classify recoverable gaps before historical repair."
          }
          else {
              Write-Host "[PASS] No historical timestamp gaps detected."
              Write-Host "[NEXT] Historical recovery is not required."
          }

          Write-Host "============================================================"
