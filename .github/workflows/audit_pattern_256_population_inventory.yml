
name: audit_pattern_256_population_inventory.yml

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore verified checkpoints"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pattern256-population-inventory
  cancel-in-progress: false

jobs:
  population-inventory:
    name: population-inventory

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        id: environment
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_population_inventory.py"

          $source = Join-Path `
            $root `
            "data\reports\pattern_256_accumulation_30pct\checkpoints"

          $output = Join-Path `
            $root `
            "data\reports\pattern_256_population_inventory"

          $stageName = "population_inventory_" +
            $env:GITHUB_RUN_ID + "_" +
            $env:GITHUB_RUN_ATTEMPT

          $stage = Join-Path `
            $env:RUNNER_TEMP `
            $stageName

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python script missing: $script"
          }

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "Source directory missing: $source"
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $source `
              -Recurse `
              -File `
              -Filter "KRW-*.csv"
          )

          if ($files.Count -eq 0) {
            throw "No source checkpoint CSV files found"
          }

          & py -c "import ast,pathlib,sys;ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax check failed"
          }

          New-Item `
            -ItemType Directory `
            -Path $stage `
            -Force | Out-Null

          $startedUtc = [DateTime]::UtcNow.ToString("o")

          $variables = @{
            POP_ROOT = $root
            POP_SCRIPT = $script
            POP_SOURCE = $source
            POP_OUTPUT = $output
            POP_STAGE = $stage
            POP_STARTED_UTC = $startedUtc
          }

          foreach ($entry in $variables.GetEnumerator()) {
            $line = $entry.Key + "=" + $entry.Value

            Add-Content `
              -LiteralPath $env:GITHUB_ENV `
              -Value $line `
              -Encoding UTF8
          }

          Write-Host "[PASS] Environment verified"
          Write-Host "Source files: $($files.Count)"
          Write-Host "Source: $source"
          Write-Host "Output: $output"

      - name: Execute population inventory
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "-u"
            $env:POP_SCRIPT
            "--root"
            $env:POP_ROOT
            "--output"
            $env:POP_OUTPUT
          )

          if ("${{ inputs.force }}" -eq "true") {
            $arguments += "--force"
          }

          & py @arguments

          $exitCode = $LASTEXITCODE

          Write-Host "Python exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Population inventory returned exit code $exitCode"
          }

      - name: Verify reports and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:POP_OUTPUT) {
            throw "Output directory is unavailable"
          }

          $resultPath = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_result.json"

          $manifestPath = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Result JSON not found"
          }

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Manifest JSON not found"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.version -ne "Clean V002") {
            throw "Unexpected Python result version"
          }

          if ($result.audit -ne "pattern_256_population_inventory") {
            throw "Unexpected audit name"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Research decision must remain HOLD"
          }

          if ($manifest.execution -ne $result.execution) {
            throw "Manifest execution mismatch"
          }

          $started = [DateTime]::Parse(
            $env:POP_STARTED_UTC
          ).ToUniversalTime()

          $created = [DateTime]::Parse(
            [string]$result.created_utc
          ).ToUniversalTime()

          if ($created -lt $started) {
            throw "Stale result detected from a previous run"
          }

          $actualScriptHash = (
            Get-FileHash `
              -LiteralPath $env:POP_SCRIPT `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $expectedScriptHash = (
            [string]$manifest.script_sha256
          ).ToLowerInvariant()

          if ($actualScriptHash -ne $expectedScriptHash) {
            throw "Python script SHA256 mismatch"
          }

          $names = @(
            "population_inventory_detail.csv"
            "population_inventory_issues.csv"
            "population_inventory_result.json"
          )

          foreach ($name in $names) {
            $path = Join-Path $env:POP_OUTPUT $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }

            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Missing SHA256 entry: $name"
            }

            $expected = (
              [string]$property.Value
            ).ToLowerInvariant()

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] Report SHA256 verification"
          Write-Host "Audit classification: $($result.execution)"

      - name: Stage diagnostic reports
        id: stage
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:POP_STAGE) {
            throw "Diagnostic stage directory unavailable"
          }

          if (-not $env:POP_OUTPUT) {
            throw "Diagnostic output directory unavailable"
          }

          New-Item `
            -ItemType Directory `
            -Path $env:POP_STAGE `
            -Force | Out-Null

          $names = @(
            "population_inventory_detail.csv"
            "population_inventory_issues.csv"
            "population_inventory_result.json"
            "population_inventory_manifest.json"
          )

          $copied = 0

          foreach ($name in $names) {
            $source = Join-Path $env:POP_OUTPUT $name

            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item `
                -LiteralPath $source `
                -Destination (Join-Path $env:POP_STAGE $name) `
                -Force

              $copied++
            }
          }

          if ($copied -eq 0) {
            throw "No diagnostic files available"
          }

          Write-Host "[PASS] Staged $copied diagnostic files"

      - name: Publish summary
        id: summary
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $lines = New-Object System.Collections.Generic.List[string]

          $lines.Add("## Pattern 256 Population Inventory")
          $lines.Add("")
          $lines.Add("| Check | Result |")
          $lines.Add("|---|---|")
          $lines.Add("| Workflow version | Clean V003 |")
          $lines.Add("| Python version | Clean V002 |")
          $lines.Add("| Python execution | ${{ steps.audit.outcome }} |")
          $lines.Add("| SHA256 verification | ${{ steps.verify.outcome }} |")
          $lines.Add("| Diagnostic staging | ${{ steps.stage.outcome }} |")
          $lines.Add("| Research decision | HOLD |")
          $lines.Add("")

          $resultPath = $null

          if ($env:POP_OUTPUT) {
            $resultPath = Join-Path `
              $env:POP_OUTPUT `
              "population_inventory_result.json"
          }

          if (
            $resultPath -and
            (Test-Path -LiteralPath $resultPath -PathType Leaf)
          ) {
            try {
              $r = Get-Content `
                -LiteralPath $resultPath `
                -Raw | ConvertFrom-Json

              $lines.Add("### Inventory results")
              $lines.Add("")
              $lines.Add("| Metric | Value |")
              $lines.Add("|---|---:|")
              $lines.Add("| Classification | $($r.execution) |")
              $lines.Add("| Discovered files | $($r.files_discovered) |")
              $lines.Add("| Audited files | $($r.files_audited) |")
              $lines.Add("| Resumed files | $($r.files_resumed) |")
              $lines.Add("| Files needing review | $($r.files_requiring_review) |")
              $lines.Add("| File errors | $($r.file_errors) |")
              $lines.Add("| Total event rows | $($r.total.rows) |")
              $lines.Add("| Unique keys within files | $($r.total.unique_events) |")
              $lines.Add("| Duplicate keys | $($r.total.duplicate_events) |")
              $lines.Add("| Invalid keys | $($r.total.invalid_rows) |")
              $lines.Add("| Missing source hashes | $($r.total.missing_source_hash) |")
              $lines.Add("| HIT YES | $($r.total.hit_yes) |")
              $lines.Add("| HIT NO | $($r.total.hit_no) |")
              $lines.Add("| HIT UNKNOWN | $($r.total.hit_unknown) |")
              $lines.Add("| Total issues | $($r.issues_total) |")
              $lines.Add("")

              $lines.Add("### Status distribution")
              $lines.Add("")

              if ($null -ne $r.status_counts) {
                foreach ($item in $r.status_counts.PSObject.Properties) {
                  $lines.Add("- $($item.Name): $($item.Value)")
                }
              }

              $lines.Add("")

              if (
                $null -ne $r.errors -and
                @($r.errors).Count -gt 0
              ) {
                $lines.Add("### File errors")
                $lines.Add("")

                foreach ($item in @($r.errors | Select-Object -First 20)) {
                  $message = [string]$item.error
                  $message = $message.Replace("|", "/")
                  $lines.Add("- $($item.source_file): $message")
                }

                $lines.Add("")
              }

            } catch {
              $lines.Add("### Summary parsing error")
              $lines.Add("")
              $lines.Add($_.Exception.Message)
              $lines.Add("")
            }

          } else {
            $lines.Add("Result JSON is unavailable.")
            $lines.Add("")
          }

          $lines.Add("### Interpretation")
          $lines.Add("")
          $lines.Add("PASS: No recorded inventory issues.")
          $lines.Add("")
          $lines.Add("REVIEW: Audit completed with data findings.")
          $lines.Add("")
          $lines.Add("FAIL: Audit incomplete or source errors.")
          $lines.Add("")
          $lines.Add("No predictive accuracy or profitability is proven.")
          $lines.Add("")
          $lines.Add("Research decision: HOLD.")

          $lines | Out-File `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Encoding UTF8 `
            -Append

          Write-Host "[PASS] Summary published"

      - name: Upload diagnostic reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-population-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/population_inventory_${{ github.run_id }}_${{ github.run_attempt }}/*.csv
            ${{ runner.temp }}/population_inventory_${{ github.run_id }}_${{ github.run_attempt }}/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $environment = "${{ steps.environment.outcome }}"
          $audit = "${{ steps.audit.outcome }}"
          $verify = "${{ steps.verify.outcome }}"
          $stage = "${{ steps.stage.outcome }}"
          $summary = "${{ steps.summary.outcome }}"
          $upload = "${{ steps.upload.outcome }}"

          Write-Host "Environment: $environment"
          Write-Host "Python audit: $audit"
          Write-Host "SHA256: $verify"
          Write-Host "Staging: $stage"
          Write-Host "Summary: $summary"
          Write-Host "Upload: $upload"

          if ($environment -ne "success") {
            throw "Environment verification failed"
          }

          if ($audit -ne "success") {
            throw "Population inventory Python execution failed"
          }

          if ($verify -ne "success") {
            throw "Report or SHA256 verification failed"
          }

          if ($stage -ne "success") {
            throw "Diagnostic staging failed"
          }

          if ($summary -ne "success") {
            throw "GitHub summary publication failed"
          }

          if ($upload -ne "success") {
            throw "Diagnostic artifact upload failed"
          }

          $resultPath = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_result.json"

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          if ($r.execution -eq "FAIL") {
            throw "Inventory incomplete: inspect file errors"
          }

          if ($r.execution -eq "REVIEW") {
            Write-Host "[REVIEW] Inventory completed"
            Write-Host "Data quality findings require investigation"
            Write-Host "Research decision: HOLD"
            exit 0
          }

          if ($r.execution -ne "PASS") {
            throw "Unknown inventory classification"
          }

          Write-Host "[PASS] Population inventory completed"
          Write-Host "Research decision: HOLD"
