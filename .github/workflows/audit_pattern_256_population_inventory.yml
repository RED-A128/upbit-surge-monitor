
name: audit_pattern_256_population_inventory.yml

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore existing checkpoints"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pattern256-population-inventory
  cancel-in-progress: false

jobs:
  population-inventory:
    name: population-inventory

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        id: environment
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_population_inventory.py"

          $source = Join-Path `
            $root `
            "data\reports\pattern_256_accumulation_30pct\checkpoints"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Python audit script not found: $script"
          }

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Source checkpoint directory missing: $source"
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $source `
              -Filter "KRW-*.csv" `
              -File -Recurse
          )

          if ($files.Count -eq 0) {
            throw "No checkpoint CSV files discovered"
          }

          & py -c "import ast,pathlib,sys;ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed"
          }

          $output = Join-Path `
            $root `
            "data\reports\pattern_256_population_inventory"

          $stage = Join-Path `
            $env:RUNNER_TEMP `
            "population_inventory_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"

          "POP_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "POP_SCRIPT=$script" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "POP_OUTPUT=$output" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "POP_STAGE=$stage" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Environment"
          Write-Host "CSV files: $($files.Count)"

      - name: Execute population inventory
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "-u",
            $env:POP_SCRIPT,
            "--root",
            $env:POP_ROOT,
            "--output",
            $env:POP_OUTPUT
          )

          if ("${{ inputs.force }}" -eq "true") {
            $arguments += "--force"
          }

          & py @arguments

          $exitCode = $LASTEXITCODE

          Write-Host "Python exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Population inventory Python execution failed"
          }

      - name: Verify reports and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:POP_OUTPUT) {
            throw "Output directory was not configured"
          }

          $resultPath = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_result.json"

          $manifestPath = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw "Result JSON missing"
          }

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Manifest JSON missing"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.version -ne "Clean V002") {
            throw "Unexpected result version"
          }

          if ($result.audit -ne "pattern_256_population_inventory") {
            throw "Unexpected audit identifier"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Research decision must remain HOLD"
          }

          if ($manifest.execution -ne $result.execution) {
            throw "Manifest and result execution mismatch"
          }

          $scriptHash = (
            Get-FileHash `
              -LiteralPath $env:POP_SCRIPT `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if (
            $scriptHash -ne
            ([string]$manifest.script_sha256).ToLowerInvariant()
          ) {
            throw "Python script SHA256 mismatch"
          }

          $names = @(
            "population_inventory_detail.csv",
            "population_inventory_issues.csv",
            "population_inventory_result.json"
          )

          foreach ($name in $names) {
            $path = Join-Path $env:POP_OUTPUT $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing report: $name"
            }

            $expected = [string](
              $manifest.output_sha256.$name
            )

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if (
              -not $expected -or
              $actual -ne $expected.ToLowerInvariant()
            ) {
              throw "SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] Report integrity"
          Write-Host "Audit classification: $($result.execution)"

      - name: Stage diagnostic reports
        id: stage
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:POP_OUTPUT -or -not $env:POP_STAGE) {
            throw "Report paths are unavailable"
          }

          New-Item `
            -ItemType Directory `
            -Path $env:POP_STAGE `
            -Force | Out-Null

          $names = @(
            "population_inventory_detail.csv",
            "population_inventory_issues.csv",
            "population_inventory_result.json",
            "population_inventory_manifest.json"
          )

          $copied = 0

          foreach ($name in $names) {
            $source = Join-Path $env:POP_OUTPUT $name

            if (Test-Path -LiteralPath $source) {
              Copy-Item `
                -LiteralPath $source `
                -Destination (Join-Path $env:POP_STAGE $name) `
                -ErrorAction Stop

              $copied++
            }
          }

          if ($copied -eq 0) {
            throw "No diagnostic reports found"
          }

          Write-Host "Staged diagnostic files: $copied"

      - name: Publish summary
        if: always()
        run: |
          $auditOutcome = "${{ steps.audit.outcome }}"
          $verifyOutcome = "${{ steps.verify.outcome }}"
          $stageOutcome = "${{ steps.stage.outcome }}"

          @"
          ## Pattern 256 Population Inventory

          | Check | Result |
          |---|---|
          | Workflow version | Clean V002 |
          | Python execution | $auditOutcome |
          | SHA256 verification | $verifyOutcome |
          | Diagnostic staging | $stageOutcome |
          | Research decision | HOLD |

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          if (-not $env:POP_OUTPUT) {
            "Environment setup did not complete." |
              Out-File `
                $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
            exit 0
          }

          $path = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_result.json"

          if (-not (Test-Path -LiteralPath $path)) {
            "Result JSON unavailable. Inspect execution logs." |
              Out-File `
                $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
            exit 0
          }

          $r = Get-Content `
            -LiteralPath $path `
            -Raw | ConvertFrom-Json

          @"
          ### Audit results

          | Metric | Value |
          |---|---:|
          | Audit classification | $($r.execution) |
          | Discovered files | $($r.files_discovered) |
          | Audited files | $($r.files_audited) |
          | Files needing review | $($r.files_requiring_review) |
          | File read errors | $($r.file_errors) |
          | Total event rows | $($r.total.rows) |
          | Unique event keys within files | $($r.total.unique_events) |
          | Duplicate event keys | $($r.total.duplicate_events) |
          | Invalid event keys | $($r.total.invalid_rows) |
          | Missing source hashes | $($r.total.missing_source_hash) |
          | HIT YES | $($r.total.hit_yes) |
          | HIT NO | $($r.total.hit_no) |
          | HIT UNKNOWN | $($r.total.hit_unknown) |
          | Diagnostic issues | $($r.issues_total) |

          ### Status distribution

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          foreach ($item in $r.status_counts.PSObject.Properties) {
            "- $($item.Name): $($item.Value)" |
              Out-File `
                $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
          }

          if ($r.errors.Count -gt 0) {
            @"

            ### File errors

            "@ | Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append -Encoding utf8

            foreach ($item in @($r.errors | Select-Object -First 20)) {
              "- $($item.source_file): $($item.error)" |
                Out-File `
                  $env:GITHUB_STEP_SUMMARY `
                  -Append -Encoding utf8
            }
          }

          @"

          ### Interpretation

          PASS: inventory completed without recorded issues.

          REVIEW: inventory completed but data quality
          findings require investigation.

          FAIL: missing or unreadable inputs prevented
          complete auditing.

          This inventory does not prove an unbiased
          historical signal population or profitability.

          Research decision: HOLD.
          "@ | Out-File `
            $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

      - name: Upload diagnostic reports
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-population-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/population_inventory_${{ github.run_id }}_${{ github.run_attempt }}/*.csv
            ${{ runner.temp }}/population_inventory_${{ github.run_id }}_${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Python audit failed. Inspect diagnostic reports."
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "SHA256 or report verification failed."
          }

          if ("${{ steps.stage.outcome }}" -ne "success") {
            throw "Diagnostic report staging failed."
          }

          $resultPath = Join-Path `
            $env:POP_OUTPUT `
            "population_inventory_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -eq "FAIL") {
            throw "Inventory incomplete due to source errors."
          }

          if ($result.execution -eq "REVIEW") {
            Write-Host "[REVIEW] Audit completed with findings."
            Write-Host "Research decision: HOLD"
            exit 0
          }

          if ($result.execution -ne "PASS") {
            throw "Unknown audit classification."
          }

          Write-Host "[PASS] Population inventory completed."
          Write-Host "Research decision: HOLD"
