name: audit_pattern_256_prefix_replay_full_market.yml

on:
  workflow_dispatch:
    inputs:
      force_replay:
        description: "Ignore verified checkpoints and replay all markets"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pattern-256-prefix-replay-full-market
  cancel-in-progress: false

jobs:
  prefix-replay-full-market:
    name: prefix-replay-full-market

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          Write-Host "Repository: $env:GITHUB_WORKSPACE"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Python:"
          py --version

      - name: Verify audit script
        run: |
          $script = "audit_pattern_256_prefix_replay_full_market.py"

          if (-not (Test-Path $script)) {
            throw "Audit script missing: $script"
          }

          if (-not (Test-Path "build_features.py")) {
            throw "build_features.py missing"
          }

          if (-not (Test-Path "detect_256.py")) {
            throw "detect_256.py missing"
          }

          Write-Host "Required Python scripts found."

      - name: Verify local research data
        run: |
          $required = @(
            "data/ohlcv/h1",
            "data/ohlcv/h4",
            "data/ohlcv/d1",
            "data/features/h1",
            "data/features/h4",
            "data/features/d1",
            "data/signals/256/h1",
            "data/signals/256/h4",
            "data/signals/256/d1"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required directory missing: $path"
            }

            Write-Host "[OK] $path"
          }

      - name: Execute full-market prefix replay
        id: replay
        continue-on-error: true
        env:
          FORCE_REPLAY: ${{ inputs.force_replay }}
        run: |
          $arguments = @(
            "-u",
            "audit_pattern_256_prefix_replay_full_market.py",
            "--root",
            ".",
            "--cutoffs",
            "0.40,0.65,0.85"
          )

          if ($env:FORCE_REPLAY -eq "true") {
            $arguments += "--force"
          }

          & py @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Full-market prefix replay failed: $LASTEXITCODE"
          }

      - name: Verify result and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $report = "data/reports/pattern_256_prefix_replay_full_market"

          $resultPath = Join-Path $report "full_market_result.json"
          $manifestPath = Join-Path $report "full_market_manifest.json"

          if (-not (Test-Path $resultPath)) {
            throw "Result JSON missing"
          }

          if (-not (Test-Path $manifestPath)) {
            throw "Manifest JSON missing"
          }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

          if ($result.version -ne "Clean V001") {
            throw "Unexpected audit version"
          }

          if ($result.execution -ne "PASS") {
            throw "Audit execution is not PASS"
          }

          if ($result.expected_checks -ne $result.completed_checks) {
            throw "Incomplete replay checks"
          }

          if ($result.expected_checks -ne $result.passed_checks) {
            throw "Not all replay checks passed"
          }

          if ($result.failed_checks -ne 0) {
            throw "Failed checks detected"
          }

          if ($result.issue_count -ne 0) {
            throw "Audit issues detected"
          }

          if ($result.invalid_exclusion_count -ne 0) {
            throw "Unexpected coverage exclusions detected"
          }

          if ($result.full_eligible_market_prefix_replay_verified -ne $true) {
            throw "Full eligible-market replay is not verified"
          }

          if ($result.train_approved -ne $false) {
            throw "Unexpected TRAIN approval"
          }

          if ($result.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($manifest.execution -ne "PASS") {
            throw "Manifest execution is not PASS"
          }

          $hashes = $manifest.output_sha256

          foreach ($property in $hashes.PSObject.Properties) {
            $fileName = $property.Name
            $expectedHash = $property.Value

            $filePath = Join-Path $report $fileName

            if (-not (Test-Path $filePath)) {
              throw "Output missing: $fileName"
            }

            $actualHash = (
              Get-FileHash $filePath -Algorithm SHA256
            ).Hash.ToLower()

            if ($actualHash -ne $expectedHash.ToLower()) {
              throw "SHA256 mismatch: $fileName"
            }

            Write-Host "[SHA256 PASS] $fileName"
          }

          Write-Host "Full-market audit integrity PASS."

      - name: Publish job summary
        if: always()
        run: |
          $resultPath = "data/reports/pattern_256_prefix_replay_full_market/full_market_result.json"

          if (-not (Test-Path $resultPath)) {
            "## Pattern 256 Full-Market Prefix Replay" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

            "Result JSON was not generated." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

            exit 0
          }

          $r = Get-Content $resultPath -Raw | ConvertFrom-Json

          @"
          ## Pattern 256 Full-Market Prefix Replay

          | Check | Result |
          |---|---|
          | Version | $($r.version) |
          | Execution | $($r.execution) |
          | Eligible jobs | $($r.eligible_market_timeframe_jobs) |
          | Resumed jobs | $($r.resumed_jobs) |
          | Executed jobs | $($r.executed_jobs) |
          | Expected checks | $($r.expected_checks) |
          | Completed checks | $($r.completed_checks) |
          | Passed checks | $($r.passed_checks) |
          | Failed checks | $($r.failed_checks) |
          | Issues | $($r.issue_count) |
          | Excluded | $($r.excluded_market_timeframe_count) |
          | Coverage errors | $($r.invalid_exclusion_count) |
          | Full eligible-market replay verified | $($r.full_eligible_market_prefix_replay_verified) |
          | Full-market leakage-free proven | $($r.full_market_leakage_free_proven) |
          | Research decision | $($r.research_decision) |
          | TRAIN approved | $($r.train_approved) |
          | Live trading approved | $($r.live_trading_approved) |

          **Note:** Passing prefix replay does not independently prove
          historical point-in-time availability or eliminate every
          possible source of future-data leakage.
          "@ |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-prefix-replay-full-market
          path: |
            data/reports/pattern_256_prefix_replay_full_market/full_market_checks.csv
            data/reports/pattern_256_prefix_replay_full_market/full_market_issues.csv
            data/reports/pattern_256_prefix_replay_full_market/full_market_exclusions.csv
            data/reports/pattern_256_prefix_replay_full_market/full_market_result.json
            data/reports/pattern_256_prefix_replay_full_market/full_market_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $replay = "${{ steps.replay.outcome }}"
          $verify = "${{ steps.verify.outcome }}"

          Write-Host "Replay outcome: $replay"
          Write-Host "Verify outcome: $verify"

          if ($replay -ne "success") {
            throw "Replay execution failed"
          }

          if ($verify -ne "success") {
            throw "Result verification failed"
          }

          Write-Host "FULL-MARKET PREFIX REPLAY PASS"
