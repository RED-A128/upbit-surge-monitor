
name: validate_pattern_256_accumulation_candidate_independent.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-accumulation-candidate-independent-production
  cancel-in-progress: false

jobs:
  candidate-independent-production:
    name: Candidate Independent Validation Production
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      INPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_oos_evaluation
      OUTPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent
      PROGRAM_NAME: validate_pattern_256_accumulation_candidate_independent.py

    steps:

      # ============================================================
      # 01. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. Verify production environment
      # ============================================================

      - name: Verify production environment
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:PRODUCTION_ROOT -PathType Container)) {
            throw "Production root missing: $env:PRODUCTION_ROOT"
          }

          $reports = Join-Path $env:PRODUCTION_ROOT "data\reports"

          if (-not (Test-Path -LiteralPath $reports -PathType Container)) {
            throw "Production reports directory missing: $reports"
          }

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable."
          }

          & py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed."
          }

          Write-Host "[PASS] Production environment verified."
          Write-Host "[PASS] Python syntax verified."

      # ============================================================
      # 03. Verify required production inputs
      # ============================================================

      - name: Verify required production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $inputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $inputDir -PathType Container)) {
            throw "Production input directory missing: $inputDir"
          }

          $required = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $inputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required input missing: $path"
            }

            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required input is empty: $path"
            }

            Write-Host "[PASS] $name"
          }

          Write-Host "[PASS] All five production inputs available."

      # ============================================================
      # 04. Prevent accidental output overwrite
      # ============================================================

      - name: Verify production output safety
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:OUTPUT_RELATIVE

          if (Test-Path -LiteralPath $outputDir) {

            if (-not (Test-Path -LiteralPath $outputDir -PathType Container)) {
              throw "Output path exists but is not a directory."
            }

            $existing = @(
              Get-ChildItem `
                -LiteralPath $outputDir `
                -Force
            )

            if ($existing.Count -gt 0) {
              throw "Production output already exists. Refusing overwrite: $outputDir"
            }
          }

          Write-Host "[PASS] No existing production output will be overwritten."

      # ============================================================
      # 05. Capture production input SHA256
      # ============================================================

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $inputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          $snapshotPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_independent_production_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT.json"

          $required = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          $snapshot = @()

          foreach ($name in $required) {
            $path = Join-Path $inputDir $name

            $hash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            $snapshot += [PSCustomObject]@{
              name = $name
              sha256 = $hash
              length = (Get-Item -LiteralPath $path).Length
            }

            Write-Host "[SHA256 BEFORE] $name = $hash"
          }

          if ($snapshot.Count -ne 5) {
            throw "Unexpected production input count."
          }

          $json = ConvertTo-Json `
            -InputObject $snapshot `
            -Depth 5

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          "INPUT_SNAPSHOT=$snapshotPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[PASS] Production input SHA256 captured."

      # ============================================================
      # 06. Execute production validation
      # ============================================================

      - name: Execute independent validation production
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          Write-Host "============================================================"
          Write-Host "PATTERN 256 + ACCUMULATION CANDIDATE"
          Write-Host "INDEPENDENT VALIDATION - PRODUCTION"
          Write-Host "============================================================"

          Write-Host "Production root: $env:PRODUCTION_ROOT"
          Write-Host "Program: $program"

          & py $program --root $env:PRODUCTION_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Independent validation production execution failed."
          }

          Write-Host "[PASS] Production program executed."

      # ============================================================
      # 07. Verify production outputs
      # ============================================================

      - name: Verify production output files
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:OUTPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $outputDir -PathType Container)) {
            throw "Production output directory missing: $outputDir"
          }

          $required = @(
            "independent_validation_summary.csv",
            "independent_validation_checks.csv",
            "independent_validation_result.json",
            "independent_validation_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $outputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required production output missing: $path"
            }

            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Production output is empty: $path"
            }

            Write-Host "[PASS] $name"
          }

          $resultPath = Join-Path `
            $outputDir `
            "independent_validation_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($result.execution_status -ne "PASS") {
            throw "Production execution status is not PASS."
          }

          if ($result.independent_predictive_validation -ne "NOT_PERFORMED") {
            throw "Unexpected independent predictive validation status."
          }

          if ($result.candidate_approval -ne "NOT_DETERMINED") {
            throw "Unexpected candidate approval status."
          }

          if ([int]$result.records_inspected -lt 1) {
            throw "No OOS evaluation records inspected."
          }

          Write-Host "[PASS] Production result JSON verified."
          Write-Host "Records inspected: $($result.records_inspected)"
          Write-Host "Execution status: $($result.execution_status)"
          Write-Host "Independent predictive validation: $($result.independent_predictive_validation)"

      # ============================================================
      # 08. Verify output manifest
      # ============================================================

      - name: Verify production output SHA256 manifest
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:OUTPUT_RELATIVE

          $manifestPath = Join-Path `
            $outputDir `
            "independent_validation_manifest.json"

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($null -eq $manifest.output_sha256) {
            throw "Output manifest SHA256 section missing."
          }

          $expectedFiles = @(
            "independent_validation_summary.csv",
            "independent_validation_checks.csv",
            "independent_validation_result.json"
          )

          $properties = @(
            $manifest.output_sha256.PSObject.Properties
          )

          if ($properties.Count -ne $expectedFiles.Count) {
            throw "Unexpected output SHA256 manifest file count."
          }

          foreach ($name in $expectedFiles) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Missing output hash: $name"
            }

            $expectedHash = [string]$property.Value

            if ($expectedHash -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "Invalid output hash: $name"
            }

            $path = Join-Path $outputDir $name

            $actualHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Production output SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          Write-Host "[PASS] All production output hashes verified."

      # ============================================================
      # 09. Verify upstream production inputs unchanged
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INPUT_SNAPSHOT) {
            throw "Production input snapshot path missing."
          }

          if (-not (Test-Path -LiteralPath $env:INPUT_SNAPSHOT -PathType Leaf)) {
            throw "Production input snapshot missing."
          }

          $inputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          $json = Get-Content `
            -LiteralPath $env:INPUT_SNAPSHOT `
            -Raw

          $parsed = ConvertFrom-Json -InputObject $json

          $snapshot = @()

          foreach ($entry in $parsed) {
            $snapshot += $entry
          }

          if ($snapshot.Count -ne 5) {
            throw "Production input snapshot count changed."
          }

          $expectedNames = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          $seen = @{}

          foreach ($entry in $snapshot) {
            $name = [string]$entry.name
            $expectedHash = [string]$entry.sha256
            $expectedLength = [long]$entry.length

            if ($expectedNames -cnotcontains $name) {
              throw "Unexpected input snapshot entry: $name"
            }

            if ($seen.ContainsKey($name)) {
              throw "Duplicate input snapshot entry: $name"
            }

            $seen[$name] = $true

            if ($expectedHash -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "Invalid input SHA256: $name"
            }

            $path = Join-Path $inputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input missing after execution: $name"
            }

            $actualLength = (Get-Item -LiteralPath $path).Length

            if ($actualLength -ne $expectedLength) {
              throw "Production input length changed: $name"
            }

            $actualHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Production input SHA256 changed: $name"
            }

            Write-Host "[UNCHANGED] $name"
          }

          foreach ($name in $expectedNames) {
            if (-not $seen.ContainsKey($name)) {
              throw "Missing expected input snapshot entry: $name"
            }
          }

          Write-Host "[PASS] All five upstream production inputs unchanged."

      # ============================================================
      # 10. Final production safety report
      # ============================================================

      - name: Final production safety report
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CANDIDATE INDEPENDENT VALIDATION"
          Write-Host "PRODUCTION SAFETY REPORT"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[PASS] Python program executed."
          Write-Host "[PASS] Production OOS reports read."
          Write-Host "[PASS] Independent readiness checks completed."
          Write-Host "[PASS] Four production output files created."
          Write-Host "[PASS] Output manifest SHA256 verified."
          Write-Host "[PASS] Upstream production inputs unchanged."
          Write-Host "[PASS] No existing output overwritten."
          Write-Host ""
          Write-Host "[INFO] Independent predictive validation: NOT PERFORMED"
          Write-Host "[INFO] Live trading approval: NOT DETERMINED"
          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 11. Upload production artifact
      # ============================================================

      - name: Upload independent validation production reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-independent-production
          path: C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent\
          if-no-files-found: warn
          retention-days: 30
