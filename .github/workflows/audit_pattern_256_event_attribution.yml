
name: audit_pattern_256_event_attribution.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-event-attribution
  cancel-in-progress: false

jobs:
  event-attribution:
    name: event-attribution
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_attribution.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Audit script missing: $script"
          }

          $sources = @(
            "data\reports\pattern_256_event_gap_integrity\gap_integrity_events.csv",
            "data\reports\pattern_256_accumulation_independent\independent_detail.csv"
          )

          foreach ($relative in $sources) {
            $path = Join-Path $env:DATA_ROOT $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing source: $path"
            }

            $item = Get-Item -LiteralPath $path

            Write-Host "[OK] $relative"
            Write-Host "Bytes: $($item.Length)"
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

          & py -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed"
          }

          Write-Host "[PASS] Environment"

      - name: Prepare isolated output
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "pattern256_attribution_v002_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"

          $output = Join-Path $env:RUNNER_TEMP $folder

          if (Test-Path -LiteralPath $output) {
            throw "Output directory already exists"
          }

          New-Item -ItemType Directory -Path $output |
            Out-Null

          "ATTRIBUTION_OUTPUT=$output" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[OK] Isolated output prepared"

      - name: Execute horizon-aware attribution
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_attribution.py"

          & py -u $script `
            --root $env:DATA_ROOT `
            --output $env:ATTRIBUTION_OUTPUT `
            --max-issues 100

          if ($LASTEXITCODE -ne 0) {
            throw "Horizon-aware audit failed"
          }

      - name: Verify output and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Python execution did not succeed"
          }

          $out = $env:ATTRIBUTION_OUTPUT

          $resultPath = Join-Path $out `
            "attribution_v002_result.json"

          $manifestPath = Join-Path $out `
            "attribution_v002_manifest.json"

          $names = @(
            "attribution_v002_result.json",
            "attribution_v002_timeframes.csv",
            "attribution_v002_period_pairs.csv",
            "attribution_v002_issues.csv"
          )

          foreach ($name in ($names + @(
            "attribution_v002_manifest.json"
          ))) {
            $path = Join-Path $out $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing report: $name"
            }
          }

          $result = Get-Content -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS" -or
              $manifest.execution -ne "PASS") {
            throw "Execution status mismatch"
          }

          if ($result.version -ne "Clean V002" -or
              $manifest.version -ne "Clean V002") {
            throw "Version mismatch"
          }

          if ($result.research_decision -ne "HOLD" -or
              $manifest.research_decision -ne "HOLD" -or
              $result.event_level_attribution_proven -ne $false -or
              $result.independent_oos_proven -ne $false -or
              $result.train_approved -ne $false -or
              $result.live_trading_approved -ne $false) {
            throw "Research safety gate failed"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_event_attribution.py"

          $scriptHash = (
            Get-FileHash -LiteralPath $script -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($scriptHash -ne (
            [string]$manifest.script_sha256
          ).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          foreach ($name in $names) {
            $path = Join-Path $out $name

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$manifest.output_sha256.$name
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $name"
            }
          }

          foreach ($source in @(
            $result.sources.gap,
            $result.sources.independent
          )) {
            $relative = (
              [string]$source.path
            ).Replace("/", "\")

            $path = Join-Path $env:DATA_ROOT $relative

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$source.sha256
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "Source SHA256 mismatch: $relative"
            }
          }

          $tfPath = Join-Path $out `
            "attribution_v002_timeframes.csv"

          $rows = @(Import-Csv -LiteralPath $tfPath)

          if ($rows.Count -ne 3) {
            throw "Expected three timeframe rows"
          }

          $actualTF = @(
            $rows | ForEach-Object { $_.timeframe } |
              Sort-Object
          ) -join ","

          if ($actualTF -ne "d1,h1,h4") {
            throw "Unexpected timeframe values"
          }

          Write-Host "[PASS] SHA256 and report verification"

      - name: Publish summary
        if: always()
        run: |
          $audit = "${{ steps.audit.outcome }}"
          $verify = "${{ steps.verify.outcome }}"

          @"
          ## Pattern 256 Horizon-Aware Attribution

          | Check | Result |
          |---|---|
          | Version | Clean V002 |
          | Execution | $audit |
          | Verification | $verify |
          | Research decision | HOLD |

          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          if ($audit -ne "success" -or
              $verify -ne "success") {
            "Audit failed; inspect execution logs." |
              Out-File $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
            exit 0
          }

          $path = Join-Path $env:ATTRIBUTION_OUTPUT `
            "attribution_v002_result.json"

          $result = Get-Content -LiteralPath $path `
            -Raw | ConvertFrom-Json

          $t = $result.totals

          @"
          ### Horizon-aware matching

          | Check | Count |
          |---|---:|
          | Gap unique keys | $($t.gap_unique_keys) |
          | Independent unique keys | $($t.independent_unique_keys) |
          | Base identity overlap | $($t.base_identity_overlap) |
          | Exact horizon matches | $($t.exact_horizon_matches) |
          | Comparable matches | $($t.comparable_matches) |
          | Unmatched gap keys | $($t.unmatched_gap_keys) |
          | Unmatched independent keys | $($t.unmatched_independent_keys) |
          | Gap duplicate keys | $($t.gap_duplicate_keys) |
          | Independent duplicate keys | $($t.independent_duplicate_keys) |
          | Conflicting duplicate matches | $($t.conflicting_duplicate_matches) |
          | Different period labels | $($t.different_period_labels) |
          | Original status differences | $($t.original_status_differences) |
          | Corrected status differences | $($t.corrected_status_differences) |
          | Hit flag differences | $($t.hit_flag_differences) |

          ### Interpretation

          - Horizons are matched numerically without unit conversion.
          - Different period labels are reported separately.
          - Conflicting duplicate keys are not trusted.
          - PASS means the diagnostic audit completed.
          - Event-level attribution and independent OOS remain unproven.
          - Research decision: HOLD.

          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-attribution-v002-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pattern256_attribution_v002_${{ github.run_id }}_${{ github.run_attempt }}/attribution_v002_*.json
            ${{ runner.temp }}/pattern256_attribution_v002_${{ github.run_id }}_${{ github.run_attempt }}/attribution_v002_*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Attribution audit execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Attribution audit verification failed"
          }

          Write-Host "[PASS] Clean V002 completed"
          Write-Host "Research decision: HOLD"
