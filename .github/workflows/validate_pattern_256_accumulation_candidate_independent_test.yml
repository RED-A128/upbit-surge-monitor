
name: validate_pattern_256_accumulation_candidate_independent_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-accumulation-candidate-independent-test
  cancel-in-progress: false

jobs:
  candidate-independent-test:
    name: Candidate Independent Validation Test
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      INPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_oos_evaluation
      OUTPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent

    steps:

      # ============================================================
      # 01. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. Verify Python environment and source
      # ============================================================

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            "validate_pattern_256_accumulation_candidate_independent.py"

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program not found: $program"
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python execution unavailable."
          }

          & py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed."
          }

          Write-Host "[PASS] Python environment verified."
          Write-Host "[PASS] Python source syntax verified."

      # ============================================================
      # 03. Prepare isolated test workspace
      # ============================================================

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $productionInput = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $productionInput -PathType Container)) {
            throw "Production input directory missing: $productionInput"
          }

          $required = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          $testRoot = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_independent_test_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          $testInput = Join-Path `
            $testRoot `
            $env:INPUT_RELATIVE

          New-Item `
            -ItemType Directory `
            -Path $testInput `
            -Force | Out-Null

          foreach ($name in $required) {
            $source = Join-Path $productionInput $name
            $destination = Join-Path $testInput $name

            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required production input missing: $source"
            }

            if ((Get-Item -LiteralPath $source).Length -eq 0) {
              throw "Empty production input: $source"
            }

            $sourceHash = (
              Get-FileHash `
                -LiteralPath $source `
                -Algorithm SHA256
            ).Hash

            Copy-Item `
              -LiteralPath $source `
              -Destination $destination `
              -ErrorAction Stop

            $copyHash = (
              Get-FileHash `
                -LiteralPath $destination `
                -Algorithm SHA256
            ).Hash

            if ($sourceHash -ne $copyHash) {
              throw "Input copy SHA256 mismatch: $name"
            }

            Write-Host "[COPIED] $name"
            Write-Host "[SHA256 PASS] $name"
          }

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $testRoot "data\reports") `
            -Force | Out-Null

          "TEST_ROOT=$testRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[PASS] Isolated test workspace prepared."
          Write-Host "Test root: $testRoot"

      # ============================================================
      # 04. Capture production input SHA256
      # ============================================================

      - name: Capture production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $productionInput = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          $snapshotPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_independent_inputs_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT.json"

          $required = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          $snapshot = @()

          foreach ($name in $required) {
            $path = Join-Path $productionInput $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input missing: $path"
            }

            $hash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            $snapshot += [PSCustomObject]@{
              name = $name
              sha256 = $hash
            }

            Write-Host "[SHA256] $name = $hash"
          }

          if ($snapshot.Count -ne 5) {
            throw "Unexpected input snapshot count."
          }

          $json = ConvertTo-Json `
            -InputObject $snapshot `
            -Depth 5

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          "INPUT_SNAPSHOT=$snapshotPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[PASS] Production input SHA256 captured."

      # ============================================================
      # 05. Execute independent validation test
      # ============================================================

      - name: Execute candidate independent validation test
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TEST_ROOT) {
            throw "TEST_ROOT is missing."
          }

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            "validate_pattern_256_accumulation_candidate_independent.py"

          Write-Host "=================================================="
          Write-Host "Candidate Independent Validation Test"
          Write-Host "=================================================="

          & py $program --root $env:TEST_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate independent validation execution failed."
          }

          Write-Host "[PASS] Independent validation test executed."

      # ============================================================
      # 06. Verify output files and SHA256
      # ============================================================

      - name: Verify independent validation outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:TEST_ROOT `
            $env:OUTPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $outputDir -PathType Container)) {
            throw "Test output directory missing: $outputDir"
          }

          $required = @(
            "independent_validation_summary.csv",
            "independent_validation_checks.csv",
            "independent_validation_result.json",
            "independent_validation_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $outputDir $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required output missing: $path"
            }

            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Empty output: $path"
            }

            Write-Host "[FOUND] $name"
          }

          # --------------------------------------------------------
          # Verify result JSON
          # --------------------------------------------------------

          $resultPath = Join-Path `
            $outputDir `
            "independent_validation_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($result.execution_status -ne "PASS") {
            throw "Independent validation execution status is not PASS."
          }

          if ($result.independent_predictive_validation -ne "NOT_PERFORMED") {
            throw "Unexpected independent predictive validation status."
          }

          if ($result.candidate_approval -ne "NOT_DETERMINED") {
            throw "Unexpected candidate approval status."
          }

          if ([int]$result.records_inspected -lt 1) {
            throw "No evaluation records inspected."
          }

          Write-Host "[PASS] Independent validation result verified."

          # --------------------------------------------------------
          # Verify output manifest SHA256
          # --------------------------------------------------------

          $manifestPath = Join-Path `
            $outputDir `
            "independent_validation_manifest.json"

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($null -eq $manifest.output_sha256) {
            throw "Output SHA256 manifest missing."
          }

          $hashFiles = @(
            "independent_validation_summary.csv",
            "independent_validation_checks.csv",
            "independent_validation_result.json"
          )

          foreach ($name in $hashFiles) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Manifest SHA256 missing: $name"
            }

            $expected = [string]$property.Value

            if ($expected -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "Invalid manifest SHA256: $name"
            }

            $path = Join-Path $outputDir $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          Write-Host "[PASS] All independent validation outputs verified."

      # ============================================================
      # 07. Verify production inputs unchanged
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INPUT_SNAPSHOT) {
            throw "Production input snapshot path missing."
          }

          if (-not (Test-Path -LiteralPath $env:INPUT_SNAPSHOT -PathType Leaf)) {
            throw "Production input snapshot file missing."
          }

          $productionInput = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          $json = Get-Content `
            -LiteralPath $env:INPUT_SNAPSHOT `
            -Raw

          $parsed = ConvertFrom-Json -InputObject $json

          # Avoid PowerShell JSON array count issues.
          $snapshot = @()

          foreach ($entry in $parsed) {
            $snapshot += $entry
          }

          if ($snapshot.Count -ne 5) {
            throw "Unexpected snapshot count: $($snapshot.Count)"
          }

          $expectedNames = @(
            "oos_evaluation_summary.csv",
            "oos_evaluation_comparison.csv",
            "oos_evaluation_decision.csv",
            "oos_evaluation_result.json",
            "oos_evaluation_manifest.json"
          )

          $seen = @{}

          foreach ($entry in $snapshot) {
            $name = [string]$entry.name
            $expectedHash = [string]$entry.sha256

            if ($expectedNames -cnotcontains $name) {
              throw "Unexpected snapshot input: $name"
            }

            if ($seen.ContainsKey($name)) {
              throw "Duplicate snapshot input: $name"
            }

            $seen[$name] = $true

            if ($expectedHash -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "Invalid snapshot SHA256: $name"
            }

            $path = Join-Path $productionInput $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actual -ne $expectedHash) {
              throw "Production input SHA256 changed: $name"
            }

            Write-Host "[UNCHANGED] $name"
          }

          foreach ($name in $expectedNames) {
            if (-not $seen.ContainsKey($name)) {
              throw "Required snapshot input missing: $name"
            }
          }

          Write-Host "[PASS] All five production inputs unchanged."

      # ============================================================
      # 08. Upload test artifact
      # ============================================================

      - name: Upload independent validation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-independent-test
          path: ${{ env.TEST_ROOT }}\data\reports\pattern_256_accumulation_candidate_independent\
          if-no-files-found: warn
          retention-days: 14
