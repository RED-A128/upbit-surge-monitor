
name: backtest_pattern_256_accumulation_candidate_independent_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-test
  cancel-in-progress: false

jobs:
  independent-backtest-test:
    name: Candidate Independent Backtest Test
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHON_SCRIPT: backtest_pattern_256_accumulation_candidate_independent.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and program
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python program not found: $script"
          }

          & py -m py_compile $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }

          & py $script --help

          if ($LASTEXITCODE -ne 0) {
            throw "Python help command failed."
          }

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $required = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing production input: $path"
            }
          }

          $ohlcv = Join-Path $root "data\ohlcv"

          if (-not (Test-Path -LiteralPath $ohlcv -PathType Container)) {
            throw "Missing OHLCV directory: $ohlcv"
          }

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path `
            $env:RUNNER_TEMP `
            ("candidate_independent_v010_test_" +
              $env:GITHUB_RUN_ID + "_" +
              $env:GITHUB_RUN_ATTEMPT)

          New-Item -ItemType Directory -Path $testRoot -Force |
            Out-Null

          $output = Join-Path $testRoot "backtest_output"

          "TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
          "TEST_OUTPUT=$output" >> $env:GITHUB_ENV

          Write-Host "TEST ROOT: $testRoot"
          Write-Host "TEST OUTPUT: $output"

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $relativePaths = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          $snapshot = @()

          foreach ($relative in $relativePaths) {
            $file = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing production input: $file"
            }

            $snapshot += [PSCustomObject]@{
              relative_path = $relative
              sha256 = (Get-FileHash `
                -LiteralPath $file `
                -Algorithm SHA256).Hash
            }
          }

          $snapshotPath = Join-Path `
            $env:TEST_ROOT `
            "production_snapshot.json"

          # Explicitly serialize the collection as a JSON array.
          $json = ConvertTo-Json `
            -InputObject @($snapshot) `
            -Depth 5

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Production input snapshot created."

          foreach ($item in $snapshot) {
            Write-Host "$($item.relative_path): $($item.sha256)"
          }

      - name: Execute independent backtest smoke test
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PYTHON_SCRIPT

          Write-Host "========================================"
          Write-Host "CANDIDATE INDEPENDENT BACKTEST TEST"
          Write-Host "WORKFLOW CLEAN V010"
          Write-Host "========================================"

          & py $script `
            --root $env:PRODUCTION_ROOT `
            --output $env:TEST_OUTPUT `
            --smoke-test `
            --limit-events 100 `
            --limit-rows 500 `
            --checkpoint-interval 100

          if ($LASTEXITCODE -ne 0) {
            throw "Independent backtest smoke test failed."
          }

      - name: Verify backtest outputs
        run: |
          $ErrorActionPreference = "Stop"

          $output = $env:TEST_OUTPUT

          if (-not (Test-Path -LiteralPath $output -PathType Container)) {
            throw "Backtest output directory missing."
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $output `
              -File `
              -Recurse
          )

          if ($files.Count -eq 0) {
            throw "Backtest produced no output files."
          }

          foreach ($file in $files) {
            Write-Host $file.FullName

            if ($file.Extension -eq ".json") {
              try {
                $null = Get-Content `
                  -LiteralPath $file.FullName `
                  -Raw |
                  ConvertFrom-Json
              }
              catch {
                throw "Invalid JSON: $($file.FullName)"
              }
            }

            if ($file.Extension -eq ".csv") {
              $header = Get-Content `
                -LiteralPath $file.FullName `
                -TotalCount 1

              if ([string]::IsNullOrWhiteSpace($header)) {
                throw "Empty CSV header: $($file.FullName)"
              }
            }
          }

          Write-Host "Output verification PASS."

      - name: Verify checkpoint and resume
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PYTHON_SCRIPT

          $csvFiles = @(
            Get-ChildItem `
              -LiteralPath $env:TEST_OUTPUT `
              -Recurse `
              -File `
              -Filter "*.csv"
          )

          if ($csvFiles.Count -eq 0) {
            throw "No CSV output available for resume verification."
          }

          $beforeHashes = @{}

          foreach ($file in $csvFiles) {
            $beforeHashes[$file.FullName] = (
              Get-FileHash `
                -LiteralPath $file.FullName `
                -Algorithm SHA256
            ).Hash
          }

          & py $script `
            --root $env:PRODUCTION_ROOT `
            --output $env:TEST_OUTPUT `
            --smoke-test `
            --limit-events 100 `
            --limit-rows 500 `
            --checkpoint-interval 100

          if ($LASTEXITCODE -ne 0) {
            throw "Checkpoint resume execution failed."
          }

          foreach ($path in $beforeHashes.Keys) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "CSV disappeared after resume: $path"
            }

            $afterHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($afterHash -ne $beforeHashes[$path]) {
              throw "CSV changed after resume: $path"
            }
          }

          Write-Host "Checkpoint resume verification PASS."

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TEST_ROOT)) {
            throw "TEST_ROOT was not initialized."
          }

          $snapshotPath = Join-Path `
            $env:TEST_ROOT `
            "production_snapshot.json"

          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Production snapshot missing."
          }

          $raw = Get-Content `
            -LiteralPath $snapshotPath `
            -Raw

          # Prevent PowerShell from collapsing JSON arrays into a scalar.
          $parsed = ConvertFrom-Json -InputObject $raw
          $snapshot = @($parsed)

          # PowerShell 5.1 can preserve an entire JSON array as one
          # nested object. Normalize that case without dropping entries.
          if (
            $snapshot.Count -eq 1 -and
            $snapshot[0] -is [System.Array]
          ) {
            $snapshot = @($snapshot[0])
          }

          if ($snapshot.Count -ne 2) {
            throw "Unexpected production snapshot count: $($snapshot.Count)"
          }

          $expectedPaths = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          $verified = @{}

          foreach ($item in $snapshot) {
            $relative = [string]$item.relative_path
            $expectedHash = [string]$item.sha256

            if ($relative -notin $expectedPaths) {
              throw "Unexpected production snapshot path: $relative"
            }

            if ($verified.ContainsKey($relative)) {
              throw "Duplicate production snapshot path: $relative"
            }

            if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid snapshot SHA256: $relative"
            }

            $file = Join-Path `
              $env:PRODUCTION_ROOT `
              $relative

            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Production input disappeared: $relative"
            }

            $currentHash = (
              Get-FileHash `
                -LiteralPath $file `
                -Algorithm SHA256
            ).Hash

            if ($currentHash -ne $expectedHash) {
              throw "Production input changed: $relative"
            }

            $verified[$relative] = $true

            Write-Host "[PASS] $relative"
          }

          foreach ($relative in $expectedPaths) {
            if (-not $verified.ContainsKey($relative)) {
              throw "Production input was not verified: $relative"
            }
          }

          Write-Host "Production input SHA256 verification PASS."

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-independent-backtest-v010-test
          path: |
            ${{ env.TEST_OUTPUT }}
            ${{ env.TEST_ROOT }}/production_snapshot.json
          if-no-files-found: warn
          retention-days: 7
