
name: backtest_pattern_256_accumulation_candidate_independent_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-test
  cancel-in-progress: false

jobs:
  candidate-independent-backtest-test:
    name: Candidate Independent Backtest Test
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PYTHON_SCRIPT: backtest_pattern_256_accumulation_candidate_independent.py
      EXPECTED_VERSION: Clean V004
      MAX_EVENTS: "100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and program
        run: |
          $ErrorActionPreference = "Stop"

          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python program missing: $script"
          }

          Write-Host "Python program verified: $script"

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $required = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv",
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required input missing: $path"
            }

            Write-Host "Verified: $path"
          }

          $ohlcv = Join-Path $root "data\ohlcv"

          if (-not (Test-Path -LiteralPath $ohlcv -PathType Container)) {
            throw "OHLCV directory missing: $ohlcv"
          }

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path $env:RUNNER_TEMP (
            "candidate_independent_v004_test_" + $env:GITHUB_RUN_ID + "_" + $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test directory already exists: $testRoot"
          }

          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          $output = Join-Path $testRoot "backtest_output"
          $snapshot = Join-Path $testRoot "production_snapshot.json"

          "TEST_ROOT=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SNAPSHOT_FILE=$snapshot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Isolated test root: $testRoot"

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $paths = @(
            (Join-Path $root "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"),
            (Join-Path $root "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json")
          )

          $ohlcvRoot = Join-Path $root "data\ohlcv"

          $paths += @(
            Get-ChildItem -LiteralPath $ohlcvRoot -Recurse -File -Filter "*.csv" |
              Select-Object -ExpandProperty FullName
          )

          $paths = @(
            $paths | Sort-Object -Unique
          )

          if ($paths.Count -lt 3) {
            throw "Insufficient production inputs for snapshot."
          }

          $snapshot = @(
            foreach ($path in $paths) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Snapshot input missing: $path"
              }

              [PSCustomObject]@{
                path = [System.IO.Path]::GetFullPath($path)
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )

          $snapshot |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath $env:SNAPSHOT_FILE -Encoding UTF8

          Write-Host "Snapshot files: $($snapshot.Count)"

      - name: Execute independent backtest smoke test
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT

          Write-Host "============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST"
          Write-Host "TEST WORKFLOW CLEAN V006"
          Write-Host "PYTHON CLEAN V004"
          Write-Host "============================================="

          & py $script `
            --root $env:PRODUCTION_ROOT `
            --output-dir $env:TEST_OUTPUT `
            --max-events ([int]$env:MAX_EVENTS)

          $exitCode = $LASTEXITCODE

          Write-Host "[SMOKE TEST] Exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Independent backtest smoke test failed."
          }

      - name: Verify backtest outputs
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json",
            "independent_backtest_manifest.json",
            "checkpoint.sqlite3"
          )

          foreach ($name in $required) {
            $path = Join-Path $env:TEST_OUTPUT $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }
          }

          $resultPath = Join-Path $env:TEST_OUTPUT "independent_backtest_result.json"
          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Result version mismatch."
          }

          if ($result.execution_status -ne "SMOKE_TEST_PASS") {
            throw "Unexpected smoke test status: $($result.execution_status)"
          }

          if ($result.smoke_test -ne $true) {
            throw "Smoke test flag is not true."
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Independent OOS must not be claimed as proven."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading must not be approved."
          }

          if ($result.automatic_trading_enabled -ne $false) {
            throw "Automatic trading must remain disabled."
          }

          if ([int]$result.output_rows -le 0) {
            throw "No backtest output rows."
          }

          $trades = Join-Path $env:TEST_OUTPUT "independent_backtest_trades.csv"
          $header = Get-Content -LiteralPath $trades -TotalCount 1

          $requiredColumns = @(
            "rule_id",
            "timeframe",
            "market",
            "signal_timestamp",
            "entry_timestamp",
            "status",
            "entry_time_check",
            "entry_time_detail",
            "all_checks_match"
          )

          $columns = @($header -split ",")

          foreach ($column in $requiredColumns) {
            if ($columns -notcontains $column) {
              throw "Missing trade CSV column: $column"
            }
          }

          $manifestPath = Join-Path $env:TEST_OUTPUT "independent_backtest_manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Manifest version mismatch."
          }

          $hashFiles = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json"
          )

          foreach ($name in $hashFiles) {
            $path = Join-Path $env:TEST_OUTPUT $name

            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Manifest hash missing: $name"
            }

            $expected = [string]$property.Value
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $name"
            }
          }

          Write-Host "Backtest output verification PASS."

      - name: Verify checkpoint and resume
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_SCRIPT
          $tradePath = Join-Path $env:TEST_OUTPUT "independent_backtest_trades.csv"

          $before = (Get-FileHash -LiteralPath $tradePath -Algorithm SHA256).Hash

          & py $script `
            --root $env:PRODUCTION_ROOT `
            --output-dir $env:TEST_OUTPUT `
            --max-events ([int]$env:MAX_EVENTS) `
            --resume

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            throw "Checkpoint resume failed."
          }

          $after = (Get-FileHash -LiteralPath $tradePath -Algorithm SHA256).Hash

          if ($before -ne $after) {
            throw "Trade output changed after resume."
          }

          $resultPath = Join-Path $env:TEST_OUTPUT "independent_backtest_result.json"

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.execution_status -ne "SMOKE_TEST_PASS") {
            throw "Resume execution status mismatch."
          }

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Resume version mismatch."
          }

          Write-Host "Checkpoint and resume verification PASS."

      - name: Extract mismatch diagnostics
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path $env:TEST_OUTPUT "independent_backtest_result.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            Write-Host "No result JSON available."
            exit 0
          }

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          Write-Host "Execution status: $($result.execution_status)"
          Write-Host "Version: $($result.version)"
          Write-Host "Source rows: $($result.source_rows_read)"
          Write-Host "Matched rows: $($result.matched_source_rows)"
          Write-Host "Output rows: $($result.output_rows)"

          if ($null -ne $result.mismatch_counts) {
            foreach ($property in $result.mismatch_counts.PSObject.Properties) {
              Write-Host "$($property.Name): $($property.Value)"
            }
          }

          $tradePath = Join-Path $env:TEST_OUTPUT "independent_backtest_trades.csv"

          if (Test-Path -LiteralPath $tradePath -PathType Leaf) {
            $invalid = @(
              Import-Csv -LiteralPath $tradePath |
                Where-Object {
                  $_.entry_time_check -ne "PASS"
                } |
                Select-Object -First 20
            )

            foreach ($row in $invalid) {
              Write-Host (
                "[ENTRY MISMATCH] " +
                "$($row.timeframe)/$($row.market) " +
                "$($row.signal_timestamp) " +
                "$($row.entry_time_check) " +
                "$($row.entry_time_detail)"
              )
            }
          }

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:SNAPSHOT_FILE -PathType Leaf)) {
            throw "Production snapshot missing."
          }

          $before = @(
            Get-Content -LiteralPath $env:SNAPSHOT_FILE -Raw -Encoding UTF8 |
              ConvertFrom-Json
          )

          $root = $env:PRODUCTION_ROOT

          $paths = @(
            (Join-Path $root "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"),
            (Join-Path $root "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json")
          )

          $paths += @(
            Get-ChildItem -LiteralPath (Join-Path $root "data\ohlcv") -Recurse -File -Filter "*.csv" |
              Select-Object -ExpandProperty FullName
          )

          $paths = @(
            $paths | Sort-Object -Unique
          )

          if ($before.Count -ne $paths.Count) {
            throw "Production input file count changed."
          }

          $beforeMap = @{}

          foreach ($item in $before) {
            $beforeMap[[string]$item.path] = [string]$item.sha256
          }

          foreach ($path in $paths) {
            $full = [System.IO.Path]::GetFullPath($path)

            if (-not $beforeMap.ContainsKey($full)) {
              throw "Unexpected production input: $full"
            }

            $actual = (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash

            if ($actual -ne $beforeMap[$full]) {
              throw "Production input changed: $full"
            }
          }

          Write-Host "Production input SHA256 verification PASS."

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-independent-backtest-v004-test
          path: ${{ env.TEST_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7

      - name: Final test validation gate
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path $env:TEST_OUTPUT "independent_backtest_result.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Result JSON missing."
          }

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Result version mismatch."
          }

          if ($result.execution_status -ne "SMOKE_TEST_PASS") {
            throw "Final execution status mismatch."
          }

          if ($result.smoke_test -ne $true) {
            throw "Smoke test flag mismatch."
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Independent OOS claim is invalid."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading approval is invalid."
          }

          if ($result.automatic_trading_enabled -ne $false) {
            throw "Automatic trading flag is invalid."
          }

          if ($null -eq $result.mismatch_counts) {
            throw "Missing mismatch_counts object."
          }

          $fields = @(
            "status_mismatches",
            "entry_price_mismatches",
            "first_hit_mismatches",
            "observed_bars_mismatches",
            "max_return_mismatches",
            "max_drawdown_mismatches",
            "entry_time_mismatches"
          )

          $calculatedTotal = 0

          foreach ($field in $fields) {
            $property = $result.mismatch_counts.PSObject.Properties[$field]

            if ($null -eq $property) {
              throw "Missing mismatch count field: $field"
            }

            $value = [int64]$property.Value

            if ($value -lt 0) {
              throw "Negative mismatch count: $field"
            }

            $calculatedTotal += $value

            Write-Host "$field = $value"

            if ($value -ne 0) {
              throw "Backtest mismatch detected: $field = $value"
            }
          }

          if ($null -eq $result.total_field_mismatches) {
            throw "Missing total_field_mismatches."
          }

          $reportedTotal = [int64]$result.total_field_mismatches

          if ($calculatedTotal -ne $reportedTotal) {
            throw (
              "Mismatch total inconsistency. " +
              "Calculated=$calculatedTotal Reported=$reportedTotal"
            )
          }

          if ($reportedTotal -ne 0) {
            throw "Nonzero total field mismatches."
          }

          if ([int64]$result.output_rows -le 0) {
            throw "Empty backtest result."
          }

          Write-Host "============================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST TEST PASS"
          Write-Host "WORKFLOW CLEAN V006"
          Write-Host "PYTHON CLEAN V004"
          Write-Host "ALL MISMATCH COUNTS: 0"
          Write-Host "CHECKPOINT RESUME: PASS"
          Write-Host "PRODUCTION INPUT SHA256: PASS"
          Write-Host "LIVE TRADING APPROVED: FALSE"
          Write-Host "============================================="
