
name: backtest_pattern_256_accumulation_candidate_independent_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-pattern-256-accumulation-candidate-independent-test
  cancel-in-progress: false

jobs:
  independent-backtest-test:
    name: Candidate Independent Backtest Test
    runs-on: self-hosted
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PROGRAM_NAME: backtest_pattern_256_accumulation_candidate_independent.py

    steps:

      # ==========================================================
      # 01. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 02. Verify Python
      # ==========================================================

      - name: Verify Python and source
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable."
          }

          & py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed."
          }

          "PROGRAM_PATH=$program" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Python source verified."

      # ==========================================================
      # 03. Verify input files
      # ==========================================================

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = [System.IO.Path]::GetFullPath(
            $env:PRODUCTION_ROOT
          )

          $detail = Join-Path `
            $root `
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"

          $oos = Join-Path `
            $root `
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"

          $ohlcv = Join-Path `
            $root `
            "data\ohlcv"

          foreach ($file in @($detail, $oos)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required input missing: $file"
            }

            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "Required input empty: $file"
            }
          }

          if (-not (Test-Path -LiteralPath $ohlcv -PathType Container)) {
            throw "OHLCV root missing: $ohlcv"
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            $directory = Join-Path $ohlcv $tf

            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "OHLCV directory missing: $directory"
            }
          }

          $config = Get-Content `
            -LiteralPath $oos `
            -Raw |
            ConvertFrom-Json

          if ($config.status -ne "PASS") {
            throw "OOS configuration status is not PASS."
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            if (-not $config.splits.$tf.oos_boundary) {
              throw "OOS boundary missing: $tf"
            }

            Write-Host "[OOS] $tf = $($config.splits.$tf.oos_boundary)"
          }

          "DETAIL_PATH=$detail" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "OOS_PATH=$oos" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "OHLCV_ROOT=$ohlcv" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Input files verified."

      # ==========================================================
      # 04. Snapshot input hashes
      # ==========================================================

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_backtest_v004_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT.json"

          $entries = @()

          foreach ($file in @(
            $env:DETAIL_PATH,
            $env:OOS_PATH
          )) {
            $entries += [PSCustomObject]@{
              path = $file
              sha256 = (
                Get-FileHash `
                  -LiteralPath $file `
                  -Algorithm SHA256
              ).Hash
              length = (Get-Item -LiteralPath $file).Length
            }
          }

          $snapshot = @{
            version = "Clean V004"
            files = $entries
          }

          $json = ConvertTo-Json `
            -InputObject $snapshot `
            -Depth 10

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          "INPUT_SNAPSHOT=$snapshotPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Input snapshot created."

      # ==========================================================
      # 05. Prepare isolated workspace
      # ==========================================================

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_backtest_v004_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists."
          }

          New-Item `
            -ItemType Directory `
            -Path $testRoot | Out-Null

          $outputDir = Join-Path `
            $testRoot `
            "backtest_output"

          $diagnosticDir = Join-Path `
            $testRoot `
            "diagnostics"

          New-Item `
            -ItemType Directory `
            -Path $diagnosticDir | Out-Null

          "TEST_ROOT=$testRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TEST_OUTPUT=$outputDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "DIAGNOSTIC_DIR=$diagnosticDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Test workspace prepared."

      # ==========================================================
      # 06. Run backtest
      # Do not stop here on mismatch.
      # The diagnostic steps must still execute.
      # ==========================================================

      - name: Execute independent backtest smoke test
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================="
          Write-Host "CANDIDATE BACKTEST DIAGNOSTIC TEST"
          Write-Host "WORKFLOW CLEAN V004"
          Write-Host "PYTHON CLEAN V002"
          Write-Host "============================================="

          & py $env:PROGRAM_PATH `
            --root $env:PRODUCTION_ROOT `
            --detail $env:DETAIL_PATH `
            --oos-result $env:OOS_PATH `
            --ohlcv-root $env:OHLCV_ROOT `
            --output-dir $env:TEST_OUTPUT `
            --max-events 100

          $exitCode = $LASTEXITCODE

          "BACKTEST_EXIT_CODE=$exitCode" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if ($exitCode -ne 0) {
            Write-Host "[DIAGNOSTIC] Backtest returned exit code $exitCode"
            Write-Host "[DIAGNOSTIC] Continuing to collect mismatch evidence."
          }
          else {
            Write-Host "[PASS] Backtest returned exit code 0."
          }

      # ==========================================================
      # 07. Extract mismatch samples
      # ==========================================================

      - name: Extract mismatch diagnostics
        run: |
          $ErrorActionPreference = "Stop"

          $tradesPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_trades.csv"

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_result.json"

          $diagnosticCsv = Join-Path `
            $env:DIAGNOSTIC_DIR `
            "mismatch_samples.csv"

          $diagnosticJson = Join-Path `
            $env:DIAGNOSTIC_DIR `
            "diagnostic_summary.json"

          if (-not (Test-Path -LiteralPath $tradesPath -PathType Leaf)) {
            throw "Trade output missing; cannot diagnose."
          }

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Result JSON missing; cannot diagnose."
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $rows = @(
            Import-Csv -LiteralPath $tradesPath
          )

          if ($rows.Count -ne [int]$result.output_rows) {
            throw "Trade row count differs from result JSON."
          }

          $mismatches = @(
            $rows | Where-Object {
              $_.status_match -ne "True" -or
              $_.entry_price_match -ne "True"
            }
          )

          $statusMismatches = @(
            $rows | Where-Object {
              $_.status_match -ne "True"
            }
          )

          $entryMismatches = @(
            $rows | Where-Object {
              $_.entry_price_match -ne "True"
            }
          )

          $sample = @(
            $mismatches |
              Select-Object -First 100
          )

          if ($sample.Count -gt 0) {
            $sample |
              Export-Csv `
                -LiteralPath $diagnosticCsv `
                -NoTypeInformation `
                -Encoding UTF8
          }
          else {
            "No mismatch rows found." |
              Out-File `
                -LiteralPath (
                  Join-Path $env:DIAGNOSTIC_DIR "no_mismatches.txt"
                ) `
                -Encoding utf8
          }

          $byStatus = @(
            $rows |
              Group-Object `
                timeframe, horizon, source_status, status |
              ForEach-Object {
                [PSCustomObject]@{
                  group = $_.Name
                  count = $_.Count
                }
              }
          )

          $diagnostic = [ordered]@{
            workflow_version = "Clean V004"
            python_version = $result.version
            backtest_exit_code = $env:BACKTEST_EXIT_CODE
            execution_status = $result.execution_status
            source_rows = $result.source_rows_read
            oos_rows = $result.oos_rows_read
            matched_rows = $result.matched_source_rows
            output_rows = $result.output_rows
            mismatch_rows = $mismatches.Count
            status_mismatch_rows = $statusMismatches.Count
            entry_price_mismatch_rows = $entryMismatches.Count
            mismatch_sample_rows = $sample.Count
            status_combinations = $byStatus
            independent_oos_proven = $false
            approved_for_live_trading = $false
          }

          $json = ConvertTo-Json `
            -InputObject $diagnostic `
            -Depth 10

          [System.IO.File]::WriteAllText(
            $diagnosticJson,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "============================================="
          Write-Host "MISMATCH DIAGNOSTICS"
          Write-Host "============================================="
          Write-Host "Output rows: $($rows.Count)"
          Write-Host "Status mismatches: $($statusMismatches.Count)"
          Write-Host "Entry mismatches: $($entryMismatches.Count)"
          Write-Host "Sample rows: $($sample.Count)"

          foreach ($group in $byStatus) {
            Write-Host "[GROUP] $($group.group): $($group.count)"
          }

          Write-Host "============================================="

      # ==========================================================
      # 08. Verify result and output manifest
      # ==========================================================

      - name: Verify output integrity
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json",
            "independent_backtest_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $env:TEST_OUTPUT $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }

            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Empty output: $name"
            }
          }

          $manifestPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_manifest.json"

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          $hashNames = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json"
          )

          foreach ($name in $hashNames) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Manifest entry missing: $name"
            }

            $expectedHash = [string]$property.Value

            $actualHash = (
              Get-FileHash `
                -LiteralPath (Join-Path $env:TEST_OUTPUT $name) `
                -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Output SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] Output integrity verified."

      # ==========================================================
      # 09. Verify original inputs unchanged
      # ==========================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INPUT_SNAPSHOT) {
            throw "Input snapshot not available."
          }

          $snapshot = Get-Content `
            -LiteralPath $env:INPUT_SNAPSHOT `
            -Raw |
            ConvertFrom-Json

          if ($snapshot.version -ne "Clean V004") {
            throw "Snapshot version mismatch."
          }

          $entries = @(
            $snapshot.files
          )

          if ($entries.Count -ne 2) {
            throw "Unexpected input snapshot count."
          }

          $expectedPaths = @(
            $env:DETAIL_PATH,
            $env:OOS_PATH
          )

          $seen = @{}

          foreach ($entry in $entries) {
            $path = [string]$entry.path

            if ($expectedPaths -notcontains $path) {
              throw "Unexpected input path: $path"
            }

            if ($seen.ContainsKey($path)) {
              throw "Duplicate snapshot entry: $path"
            }

            $seen[$path] = $true

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $length = (
              Get-Item -LiteralPath $path
            ).Length

            if ($length -ne [long]$entry.length) {
              throw "Production input size changed: $path"
            }

            $hash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($hash -ne [string]$entry.sha256) {
              throw "Production input hash changed: $path"
            }

            Write-Host "[UNCHANGED] $path"
          }

          if ($seen.Count -ne 2) {
            throw "Not all expected input files verified."
          }

          Write-Host "[PASS] Production inputs unchanged."

      # ==========================================================
      # 10. Upload diagnostic artifacts
      # ==========================================================

      - name: Upload backtest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-independent-backtest-v004-diagnostics
          path: |
            ${{ env.TEST_OUTPUT }}/
            ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      # ==========================================================
      # 11. Final gate
      # ==========================================================

      - name: Final validation gate
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_result.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Backtest result missing."
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($env:BACKTEST_EXIT_CODE -ne "0") {
            throw "Backtest calculation failed. Review diagnostic artifact."
          }

          if ($result.execution_status -ne "SMOKE_TEST_PASS") {
            throw "Backtest result is not SMOKE_TEST_PASS."
          }

          if ([int]$result.status_mismatches -ne 0) {
            throw "Status reproduction mismatches remain."
          }

          if ([int]$result.entry_price_mismatches -ne 0) {
            throw "Entry price reproduction mismatches remain."
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Independent OOS must not be marked proven."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading must not be approved."
          }

          Write-Host "[PASS] Candidate backtest smoke test."
          Write-Host "[INFO] Existing OOS reproducibility only."
          Write-Host "[INFO] Live trading not approved."
