
name: backtest_pattern_256_accumulation_candidate_independent_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-pattern-256-accumulation-candidate-independent-test
  cancel-in-progress: false

jobs:
  independent-backtest-test:
    name: Candidate Independent Backtest Test
    runs-on: self-hosted
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PROGRAM_NAME: backtest_pattern_256_accumulation_candidate_independent.py

    steps:

      # ============================================================
      # 01. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. Verify Python
      # ============================================================

      - name: Verify Python and source
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          & py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable."
          }

          & py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax validation failed."
          }

          Write-Host "[PASS] Python source verified."

      # ============================================================
      # 03. Verify production inputs
      # ============================================================

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = [System.IO.Path]::GetFullPath(
            $env:PRODUCTION_ROOT
          )

          $detail = Join-Path `
            $root `
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"

          $oos = Join-Path `
            $root `
            "data\reports\pattern_256_accumulation_candidate_oos\candidate_oos_result.json"

          $ohlcv = Join-Path `
            $root `
            "data\ohlcv"

          foreach ($file in @($detail, $oos)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required input missing: $file"
            }

            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "Required input empty: $file"
            }
          }

          if (-not (Test-Path -LiteralPath $ohlcv -PathType Container)) {
            throw "OHLCV directory missing: $ohlcv"
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            $directory = Join-Path $ohlcv $tf

            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "OHLCV timeframe directory missing: $directory"
            }
          }

          "DETAIL_PATH=$detail" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "OOS_PATH=$oos" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "OHLCV_ROOT=$ohlcv" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Production inputs verified."

      # ============================================================
      # 04. Verify OOS configuration
      # ============================================================

      - name: Verify OOS configuration
        run: |
          $ErrorActionPreference = "Stop"

          $oos = Get-Content `
            -LiteralPath $env:OOS_PATH `
            -Raw |
            ConvertFrom-Json

          if ($oos.status -ne "PASS") {
            throw "OOS source status is not PASS."
          }

          $expectedRules = @(
            "S00_ALL_SIGNALS",
            "S01_PATTERN_60",
            "S02_PATTERN_70",
            "S03_BOTH_PATTERN_60",
            "S04_BOTH_STRICT"
          )

          $actualRules = @(
            $oos.signal_rules |
              ForEach-Object { $_.rule_id }
          )

          if ($actualRules.Count -ne $expectedRules.Count) {
            throw "Unexpected candidate rule count."
          }

          foreach ($rule in $expectedRules) {
            if ($actualRules -notcontains $rule) {
              throw "Candidate rule missing: $rule"
            }
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            $split = $oos.splits.$tf

            if ($null -eq $split) {
              throw "OOS split missing: $tf"
            }

            if (-not $split.oos_boundary) {
              throw "OOS boundary missing: $tf"
            }

            Write-Host "[OOS] $tf = $($split.oos_boundary)"
          }

          Write-Host "[PASS] Original OOS rules verified."

      # ============================================================
      # 05. Snapshot production input SHA256
      # ============================================================

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $snapshotPath = Join-Path `
            $env:RUNNER_TEMP `
            "independent_backtest_v003_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT.json"

          $files = @(
            $env:DETAIL_PATH,
            $env:OOS_PATH
          )

          $entries = @()

          foreach ($file in $files) {
            $entries += [PSCustomObject]@{
              path = $file
              sha256 = (
                Get-FileHash `
                  -LiteralPath $file `
                  -Algorithm SHA256
              ).Hash
              length = (Get-Item -LiteralPath $file).Length
            }
          }

          if ($entries.Count -ne 2) {
            throw "Snapshot creation count mismatch."
          }

          $snapshot = [PSCustomObject]@{
            version = "Clean V003"
            file_count = 2
            files = $entries
          }

          $json = ConvertTo-Json `
            -InputObject $snapshot `
            -Depth 10

          [System.IO.File]::WriteAllText(
            $snapshotPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          "INPUT_SNAPSHOT=$snapshotPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Production input SHA256 captured."
          Write-Host "Snapshot entries: $($entries.Count)"

      # ============================================================
      # 06. Prepare isolated test output
      # ============================================================

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path `
            $env:RUNNER_TEMP `
            "independent_backtest_v003_test_$env:GITHUB_RUN_ID`_$env:GITHUB_RUN_ATTEMPT"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          New-Item `
            -ItemType Directory `
            -Path $testRoot | Out-Null

          $outputDir = Join-Path `
            $testRoot `
            "pattern_256_accumulation_candidate_independent_backtest"

          "TEST_ROOT=$testRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TEST_OUTPUT=$outputDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Isolated output prepared."
          Write-Host "Output: $outputDir"

      # ============================================================
      # 07. Execute smoke test
      # ============================================================

      - name: Execute independent backtest smoke test
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          Write-Host "=================================================="
          Write-Host "CANDIDATE INDEPENDENT BACKTEST CLEAN V002"
          Write-Host "SMOKE TEST"
          Write-Host "=================================================="

          & py $program `
            --root $env:PRODUCTION_ROOT `
            --detail $env:DETAIL_PATH `
            --oos-result $env:OOS_PATH `
            --ohlcv-root $env:OHLCV_ROOT `
            --output-dir $env:TEST_OUTPUT `
            --max-events 100

          if ($LASTEXITCODE -ne 0) {
            throw "Independent backtest smoke test failed."
          }

          Write-Host "[PASS] Smoke test execution completed."

      # ============================================================
      # 08. Verify outputs
      # ============================================================

      - name: Verify smoke test outputs
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json",
            "independent_backtest_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $env:TEST_OUTPUT $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required output missing: $name"
            }

            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required output empty: $name"
            }

            Write-Host "[FOUND] $name"
          }

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($result.execution_status -ne "SMOKE_TEST_PASS") {
            throw "Unexpected execution status."
          }

          if ($result.version -ne "Clean V002") {
            throw "Unexpected program version."
          }

          if ($result.assessment -ne "EXISTING_OOS_REPRODUCIBILITY_ONLY") {
            throw "Unexpected assessment."
          }

          if ($result.smoke_test -ne $true) {
            throw "Smoke test flag must be true."
          }

          if ($result.independent_oos_proven -ne $false) {
            throw "Independent OOS must not be marked proven."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading must not be approved."
          }

          if ($result.automatic_trading_enabled -ne $false) {
            throw "Automatic trading must remain disabled."
          }

          if ([int]$result.output_rows -lt 1) {
            throw "No backtest output rows."
          }

          if ([int]$result.status_mismatches -ne 0) {
            throw "Source outcome mismatches detected."
          }

          if ([int]$result.entry_price_mismatches -ne 0) {
            throw "Entry price mismatches detected."
          }

          Write-Host "[PASS] Result JSON verified."
          Write-Host "Source rows: $($result.source_rows_read)"
          Write-Host "OOS rows: $($result.oos_rows_read)"
          Write-Host "Matched rows: $($result.matched_source_rows)"
          Write-Host "Output rows: $($result.output_rows)"

      # ============================================================
      # 09. Verify output CSV
      # ============================================================

      - name: Verify backtest CSV
        run: |
          $ErrorActionPreference = "Stop"

          $tradesPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_trades.csv"

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $rows = @(
            Import-Csv -LiteralPath $tradesPath
          )

          if ($rows.Count -ne [int]$result.output_rows) {
            throw "Trade CSV row count mismatch."
          }

          foreach ($row in $rows) {
            if ($row.timeframe -notin @("h1", "h4", "d1")) {
              throw "Unexpected timeframe."
            }

            if ([int]$row.horizon -notin @(24, 72, 168)) {
              throw "Unexpected horizon."
            }

            if ($row.status -notin @("HIT", "MISS", "INCOMPLETE")) {
              throw "Unexpected status."
            }

            if ($row.status_match -ne "True") {
              throw "Status reproduction mismatch."
            }

            if ($row.entry_price_match -ne "True") {
              throw "Entry price reproduction mismatch."
            }
          }

          Write-Host "[PASS] Backtest CSV verified."

      # ============================================================
      # 10. Verify output SHA256 manifest
      # ============================================================

      - name: Verify output SHA256 manifest
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_backtest_manifest.json"

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          $expected = @(
            "independent_backtest_trades.csv",
            "independent_backtest_summary.csv",
            "independent_backtest_checks.csv",
            "independent_backtest_result.json"
          )

          $properties = @(
            $manifest.output_sha256.PSObject.Properties
          )

          if ($properties.Count -ne $expected.Count) {
            throw "Unexpected output manifest count."
          }

          foreach ($name in $expected) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Missing output SHA256: $name"
            }

            $expectedHash = [string]$property.Value

            if ($expectedHash -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "Invalid SHA256 format: $name"
            }

            $actualHash = (
              Get-FileHash `
                -LiteralPath (Join-Path $env:TEST_OUTPUT $name) `
                -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Output SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          Write-Host "[PASS] Output manifest verified."

      # ============================================================
      # 11. Verify production inputs unchanged
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INPUT_SNAPSHOT) {
            throw "Input snapshot not available."
          }

          if (-not (Test-Path -LiteralPath $env:INPUT_SNAPSHOT -PathType Leaf)) {
            throw "Input snapshot file missing."
          }

          $snapshot = Get-Content `
            -LiteralPath $env:INPUT_SNAPSHOT `
            -Raw |
            ConvertFrom-Json

          if ($snapshot.version -ne "Clean V003") {
            throw "Unexpected snapshot version."
          }

          if ([int]$snapshot.file_count -ne 2) {
            throw "Unexpected declared snapshot count."
          }

          $entries = @(
            $snapshot.files
          )

          if ($entries.Count -ne 2) {
            throw "Unexpected actual snapshot count."
          }

          $expectedPaths = @(
            $env:DETAIL_PATH,
            $env:OOS_PATH
          )

          $seen = @{}

          foreach ($entry in $entries) {
            $path = [string]$entry.path

            if ($expectedPaths -notcontains $path) {
              throw "Unexpected input path in snapshot: $path"
            }

            if ($seen.ContainsKey($path)) {
              throw "Duplicate input snapshot: $path"
            }

            $seen[$path] = $true

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $actualLength = (
              Get-Item -LiteralPath $path
            ).Length

            if ($actualLength -ne [long]$entry.length) {
              throw "Production input length changed: $path"
            }

            $actualHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash

            if ($actualHash -ne [string]$entry.sha256) {
              throw "Production input SHA256 changed: $path"
            }

            Write-Host "[UNCHANGED] $path"
          }

          foreach ($path in $expectedPaths) {
            if (-not $seen.ContainsKey($path)) {
              throw "Expected production input missing."
            }
          }

          Write-Host "[PASS] Production inputs unchanged."

      # ============================================================
      # 12. Final report
      # ============================================================

      - name: Final test report
        run: |
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "INDEPENDENT CANDIDATE BACKTEST TEST"
          Write-Host "CLEAN V003 WORKFLOW"
          Write-Host "=================================================="
          Write-Host "[PASS] Python syntax"
          Write-Host "[PASS] Production input validation"
          Write-Host "[PASS] Original OOS configuration"
          Write-Host "[PASS] Smoke test execution"
          Write-Host "[PASS] Backtest output verification"
          Write-Host "[PASS] Output SHA256 manifest"
          Write-Host "[PASS] Production input integrity"
          Write-Host ""
          Write-Host "[INFO] Existing OOS reproducibility only"
          Write-Host "[INFO] Independent OOS proven: FALSE"
          Write-Host "[INFO] Live trading approved: FALSE"
          Write-Host "=================================================="

      # ============================================================
      # 13. Upload test reports
      # ============================================================

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-independent-backtest-v003-test
          path: ${{ env.TEST_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
