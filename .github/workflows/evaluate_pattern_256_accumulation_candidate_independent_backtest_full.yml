
name: evaluate_pattern_256_accumulation_candidate_independent_backtest_full.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-full-evaluation
  cancel-in-progress: false

jobs:
  independent-backtest-full-evaluation:
    name: Independent Backtest Full Evaluation

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PROGRAM_FILE: evaluate_pattern_256_accumulation_candidate_independent_backtest.py
      INPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent_backtest
      OUTPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent_backtest_evaluation
      EXPECTED_VERSION: Clean V006
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and program
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Evaluation program missing: $program"
          }

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher failed."
          }

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          $source = Get-Content -LiteralPath $program -Raw -Encoding UTF8

          if ($source -notmatch 'VERSION\s*=\s*["'']Clean V006["'']') {
            throw "Program is not Clean V006."
          }

          Write-Host "[PASS] Python and Clean V006 verified."

      - name: Prepare evaluation paths
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT
          $inputDir = Join-Path $root $env:INPUT_RELATIVE
          $outputDir = Join-Path $root $env:OUTPUT_RELATIVE
          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          if (-not (Test-Path -LiteralPath $inputDir -PathType Container)) {
            throw "Production input directory missing: $inputDir"
          }

          $trades = Join-Path $inputDir "backtest_trades.csv"

          if (-not (Test-Path -LiteralPath $trades -PathType Leaf)) {
            throw "Backtest trades CSV missing: $trades"
          }

          if ($inputDir -eq $outputDir) {
            throw "Input and output paths must differ."
          }

          "EVALUATION_ROOT=$root" >> $env:GITHUB_ENV
          "EVALUATION_INPUT=$inputDir" >> $env:GITHUB_ENV
          "EVALUATION_OUTPUT=$outputDir" >> $env:GITHUB_ENV
          "EVALUATION_PROGRAM=$program" >> $env:GITHUB_ENV

          Write-Host "[PASS] Evaluation paths prepared."

      - name: Snapshot production inputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $inputDir = $env:EVALUATION_INPUT
          $trades = Join-Path $inputDir "backtest_trades.csv"
          $result = Join-Path $inputDir "backtest_result.json"

          $snapshot = @{}

          $snapshot[$trades] = (
            Get-FileHash -LiteralPath $trades -Algorithm SHA256
          ).Hash

          if (Test-Path -LiteralPath $result -PathType Leaf) {
            $snapshot[$result] = (
              Get-FileHash -LiteralPath $result -Algorithm SHA256
            ).Hash
          }

          $snapshotPath = Join-Path $env:RUNNER_TEMP "evaluation_input_snapshot.json"

          $snapshot |
            ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath $snapshotPath -Encoding UTF8

          "INPUT_SNAPSHOT_PATH=$snapshotPath" >> $env:GITHUB_ENV

          Write-Host "[PASS] Input SHA256 snapshot created."

      - name: Execute full evaluation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          py $env:EVALUATION_PROGRAM `
            --root $env:EVALUATION_ROOT `
            --input $env:EVALUATION_INPUT `
            --output $env:EVALUATION_OUTPUT

          if ($LASTEXITCODE -ne 0) {
            throw "Full evaluation failed."
          }

          Write-Host "[PASS] Full evaluation completed."

      - name: Verify full evaluation result
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path $env:EVALUATION_OUTPUT "independent_evaluation_result.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Evaluation result JSON missing."
          }

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Evaluation version mismatch."
          }

          if ($result.execution_status -ne "PASS") {
            throw "Evaluation execution status is not PASS."
          }

          if ($result.evaluation_scope -ne "FULL_DATASET") {
            throw "Evaluation scope is not FULL_DATASET."
          }

          if ($result.diagnostics.smoke_test -ne $false) {
            throw "Smoke-test result cannot pass full evaluation."
          }

          if ($result.diagnostics.full_dataset_evaluated -ne $true) {
            throw "Full dataset evaluation not confirmed."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Invalid live trading approval flag."
          }

          if ($result.target_return_pct -ne 30) {
            throw "Unexpected target return."
          }

          if ($result.diagnostics.source_rows -le 0) {
            throw "No source rows evaluated."
          }

          Write-Host "[PASS] Clean V006 result verified."
          Write-Host "Source rows: $($result.diagnostics.source_rows)"
          Write-Host "Completed: $($result.diagnostics.completed_rows)"
          Write-Host "Incomplete: $($result.diagnostics.incomplete_rows)"

      - name: Verify output SHA256
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = $env:EVALUATION_OUTPUT
          $manifestPath = Join-Path $outputDir "independent_evaluation_manifest.json"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Evaluation manifest missing."
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Manifest version mismatch."
          }

          if ($manifest.execution_status -ne "PASS") {
            throw "Manifest execution status is not PASS."
          }

          if ($manifest.approved_for_live_trading -ne $false) {
            throw "Invalid manifest trading approval."
          }

          $requiredFiles = @(
            "independent_evaluation_summary.csv",
            "independent_evaluation_comparison.csv",
            "independent_evaluation_decision.csv",
            "independent_evaluation_result.json"
          )

          $hashProperties = @($manifest.output_sha256.PSObject.Properties)

          if ($hashProperties.Count -ne $requiredFiles.Count) {
            throw "Manifest output file count mismatch."
          }

          foreach ($file in $requiredFiles) {
            $path = Join-Path $outputDir $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Output file missing: $file"
            }

            $property = $manifest.output_sha256.PSObject.Properties[$file]

            if ($null -eq $property) {
              throw "Manifest hash missing: $file"
            }

            $expected = [string]$property.Value
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "Output SHA256 mismatch: $file"
            }

            Write-Host "[SHA256 PASS] $file"
          }

          Write-Host "[PASS] All output hashes verified."

      - name: Verify completed evaluation resume
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          py $env:EVALUATION_PROGRAM `
            --root $env:EVALUATION_ROOT `
            --input $env:EVALUATION_INPUT `
            --output $env:EVALUATION_OUTPUT

          if ($LASTEXITCODE -ne 0) {
            throw "Evaluation resume verification failed."
          }

          Write-Host "[PASS] Completed evaluation resume verified."

      - name: Verify production inputs unchanged
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INPUT_SNAPSHOT_PATH) {
            Write-Host "[SKIP] Input snapshot was not created."
            exit 0
          }

          if (-not (Test-Path -LiteralPath $env:INPUT_SNAPSHOT_PATH)) {
            throw "Input snapshot missing."
          }

          $snapshot = Get-Content -LiteralPath $env:INPUT_SNAPSHOT_PATH -Raw -Encoding UTF8 |
            ConvertFrom-Json

          foreach ($item in $snapshot.PSObject.Properties) {
            $path = $item.Name
            $expected = [string]$item.Value

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $path"
            }

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "Production input changed: $path"
            }

            Write-Host "[INPUT SHA256 PASS] $path"
          }

          Write-Host "[PASS] Production inputs unchanged."

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-backtest-full-evaluation
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent_backtest_evaluation\independent_evaluation_summary.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent_backtest_evaluation\independent_evaluation_comparison.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent_backtest_evaluation\independent_evaluation_decision.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent_backtest_evaluation\independent_evaluation_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_accumulation_candidate_independent_backtest_evaluation\independent_evaluation_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final validation gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path $env:EVALUATION_OUTPUT "independent_evaluation_result.json"
          $manifestPath = Join-Path $env:EVALUATION_OUTPUT "independent_evaluation_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Final result missing."
          }

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Final manifest missing."
          }

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Final result version mismatch."
          }

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Final manifest version mismatch."
          }

          if ($result.execution_status -ne "PASS") {
            throw "Final result is not PASS."
          }

          if ($manifest.execution_status -ne "PASS") {
            throw "Final manifest is not PASS."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading must remain disabled."
          }

          Write-Host "========================================"
          Write-Host "[PASS] Independent Backtest Full Evaluation"
          Write-Host "[VERSION] $env:EXPECTED_VERSION"
          Write-Host "[TARGET] +30%"
          Write-Host "[LIVE TRADING] DISABLED"
          Write-Host "========================================"
