
name: evaluate_pattern_256_accumulation_candidate_independent_backtest_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-evaluation-test
  cancel-in-progress: false

jobs:
  candidate-independent-backtest-evaluation-test:
    name: Candidate Independent Backtest Evaluation Test

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor

      PROGRAM_FILE: evaluate_pattern_256_accumulation_candidate_independent_backtest.py

      INPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent_backtest

      OUTPUT_NAME: candidate_independent_backtest_evaluation_test

      EXPECTED_VERSION: Clean V001

      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:

      # ============================================================
      # 01. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. VERIFY PYTHON AND PROGRAM
      # ============================================================

      - name: Verify Python and evaluation program
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "CANDIDATE INDEPENDENT BACKTEST EVALUATION"
          Write-Host "TEST WORKFLOW CLEAN V001"
          Write-Host "PYTHON CLEAN V001"
          Write-Host "============================================"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher is unavailable."
          }

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Evaluation program missing: $program"
          }

          Write-Host "[PASS] Program exists: $program"

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          Write-Host "[PASS] Python syntax"

      # ============================================================
      # 03. VERIFY PRODUCTION INPUT
      # ============================================================

      - name: Verify production backtest inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          $inputDir = Join-Path $root $env:INPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $inputDir -PathType Container)) {
            throw "Production backtest directory missing: $inputDir"
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $inputDir `
              -File `
              -Recurse
          )

          if ($files.Count -eq 0) {
            throw "Production backtest directory is empty."
          }

          Write-Host "[PASS] Production input directory"
          Write-Host "[INPUT] $inputDir"
          Write-Host "[FILES] $($files.Count)"

          foreach ($file in $files) {
            Write-Host "[FOUND] $($file.FullName)"
          }

      # ============================================================
      # 04. PREPARE ISOLATED TEST DIRECTORY
      # ============================================================

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path `
            $env:RUNNER_TEMP `
            "$($env:OUTPUT_NAME)_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          New-Item `
            -ItemType Directory `
            -Path $testRoot `
            -Force | Out-Null

          $outputDir = Join-Path $testRoot "evaluation_output"

          $snapshotFile = Join-Path $testRoot "production_input_snapshot.json"

          "TEST_ROOT=$testRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "TEST_OUTPUT=$outputDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SNAPSHOT_FILE=$snapshotFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[PASS] Isolated workspace prepared"
          Write-Host "[TEST ROOT] $testRoot"
          Write-Host "[TEST OUTPUT] $outputDir"

      # ============================================================
      # 05. SNAPSHOT PRODUCTION INPUT SHA256
      # ============================================================

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $inputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          $files = @(
            Get-ChildItem `
              -LiteralPath $inputDir `
              -File `
              -Recurse |
            Sort-Object FullName
          )

          if ($files.Count -eq 0) {
            throw "No production input files to snapshot."
          }

          $snapshot = @(
            foreach ($file in $files) {
              $hash = Get-FileHash `
                -LiteralPath $file.FullName `
                -Algorithm SHA256

              [PSCustomObject]@{
                path = $file.FullName
                sha256 = $hash.Hash.ToLowerInvariant()
              }
            }
          )

          $snapshot |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              -LiteralPath $env:SNAPSHOT_FILE `
              -Encoding UTF8

          Write-Host "[PASS] Production SHA256 snapshot"
          Write-Host "[COUNT] $($snapshot.Count)"
          Write-Host "[FILE] $env:SNAPSHOT_FILE"

      # ============================================================
      # 06. EXECUTE EVALUATION SMOKE TEST
      # ============================================================

      - name: Execute independent evaluation smoke test
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_FILE

          Write-Host "============================================"
          Write-Host "INDEPENDENT BACKTEST EVALUATION SMOKE TEST"
          Write-Host "============================================"

          py $program `
            --root $env:PRODUCTION_ROOT `
            --output $env:TEST_OUTPUT `
            --smoke-test `
            --limit-rows 1000

          $exitCode = $LASTEXITCODE

          Write-Host "[EVALUATION] Exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Independent evaluation smoke test failed."
          }

          Write-Host "[PASS] Smoke test execution"

      # ============================================================
      # 07. VERIFY OUTPUT FILES
      # ============================================================

      - name: Verify evaluation output files
        run: |
          $ErrorActionPreference = "Stop"

          $expectedFiles = @(
            "independent_evaluation_summary.csv"
            "independent_evaluation_comparison.csv"
            "independent_evaluation_decision.csv"
            "independent_evaluation_result.json"
            "independent_evaluation_manifest.json"
          )

          foreach ($filename in $expectedFiles) {
            $path = Join-Path $env:TEST_OUTPUT $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing evaluation output: $filename"
            }

            $file = Get-Item -LiteralPath $path

            if ($file.Length -eq 0) {
              throw "Empty evaluation output: $filename"
            }

            Write-Host "[PASS] $filename"
          }

          Write-Host "[PASS] All expected output files exist"

      # ============================================================
      # 08. VERIFY RESULT AND SAFETY FLAGS
      # ============================================================

      - name: Verify evaluation result
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_result.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Evaluation version mismatch."
          }

          if ($result.execution_status -ne "PASS") {
            throw "Evaluation execution status is not PASS."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected live trading approval."
          }

          if ($result.profitability_proven -ne $false) {
            throw "Unexpected profitability proof."
          }

          if ($result.statistical_independence_proven -ne $false) {
            throw "Unexpected statistical independence proof."
          }

          if ($result.diagnostics.smoke_test -ne $true) {
            throw "Smoke test flag is not TRUE."
          }

          if ($result.diagnostics.full_dataset_evaluated -ne $false) {
            throw "Smoke test incorrectly claims full dataset evaluation."
          }

          if ([int]$result.diagnostics.source_rows -le 0) {
            throw "Evaluation source row count is zero."
          }

          if ([int]$result.diagnostics.source_rows -gt 1000) {
            throw "Smoke test exceeded the requested row limit."
          }

          Write-Host "============================================"
          Write-Host "EVALUATION RESULT"
          Write-Host "============================================"

          Write-Host "VERSION: $($result.version)"
          Write-Host "STATUS: $($result.execution_status)"
          Write-Host "SOURCE ROWS: $($result.diagnostics.source_rows)"
          Write-Host "SUMMARY GROUPS: $($result.summary_groups)"
          Write-Host "COMPARISON GROUPS: $($result.comparison_groups)"
          Write-Host "DECISION GROUPS: $($result.decision_groups)"
          Write-Host "LIVE TRADING APPROVED: $($result.approved_for_live_trading)"

          Write-Host "[PASS] Result validation"

      # ============================================================
      # 09. VERIFY OUTPUT SHA256 MANIFEST
      # ============================================================

      - name: Verify evaluation output SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_manifest.json"

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Manifest version mismatch."
          }

          if ($manifest.approved_for_live_trading -ne $false) {
            throw "Manifest contains unexpected live trading approval."
          }

          $expectedFiles = @(
            "independent_evaluation_summary.csv"
            "independent_evaluation_comparison.csv"
            "independent_evaluation_decision.csv"
            "independent_evaluation_result.json"
          )

          $properties = @(
            $manifest.output_sha256.PSObject.Properties
          )

          if ($properties.Count -ne $expectedFiles.Count) {
            throw "Output manifest file count mismatch."
          }

          foreach ($filename in $expectedFiles) {
            $property = $manifest.output_sha256.PSObject.Properties[$filename]

            if ($null -eq $property) {
              throw "Missing output hash: $filename"
            }

            $expectedHash = [string]$property.Value

            $path = Join-Path $env:TEST_OUTPUT $filename

            $actualHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Output SHA256 mismatch: $filename"
            }

            Write-Host "[SHA256 PASS] $filename"
          }

          Write-Host "[PASS] Evaluation output integrity"

      # ============================================================
      # 10. VERIFY RESUME
      # ============================================================

      - name: Verify completed evaluation resume
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_FILE

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:TEST_OUTPUT `
              -File |
            Sort-Object Name
          )

          $before = @(
            foreach ($file in $files) {
              [PSCustomObject]@{
                name = $file.Name
                sha256 = (
                  Get-FileHash `
                    -LiteralPath $file.FullName `
                    -Algorithm SHA256
                ).Hash.ToLowerInvariant()
              }
            }
          )

          Write-Host "[RESUME] Re-running completed evaluation"

          py $program `
            --root $env:PRODUCTION_ROOT `
            --output $env:TEST_OUTPUT `
            --smoke-test `
            --limit-rows 1000

          if ($LASTEXITCODE -ne 0) {
            throw "Evaluation resume failed."
          }

          $afterFiles = @(
            Get-ChildItem `
              -LiteralPath $env:TEST_OUTPUT `
              -File |
            Sort-Object Name
          )

          $after = @(
            foreach ($file in $afterFiles) {
              [PSCustomObject]@{
                name = $file.Name
                sha256 = (
                  Get-FileHash `
                    -LiteralPath $file.FullName `
                    -Algorithm SHA256
                ).Hash.ToLowerInvariant()
              }
            }
          )

          if ($before.Count -ne $after.Count) {
            throw "Output file count changed after resume."
          }

          for ($i = 0; $i -lt $before.Count; $i++) {
            if ($before[$i].name -ne $after[$i].name) {
              throw "Output filename changed after resume."
            }

            if ($before[$i].sha256 -ne $after[$i].sha256) {
              throw "Output SHA256 changed after resume."
            }
          }

          Write-Host "[PASS] Resume completed without output changes"

      # ============================================================
      # 11. VERIFY PRODUCTION INPUTS UNCHANGED
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:SNAPSHOT_FILE -PathType Leaf)) {
            throw "Production input snapshot missing."
          }

          $snapshot = @(
            Get-Content `
              -LiteralPath $env:SNAPSHOT_FILE `
              -Raw |
            ConvertFrom-Json
          )

          if ($snapshot.Count -eq 0) {
            throw "Production input snapshot is empty."
          }

          $inputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:INPUT_RELATIVE

          $currentFiles = @(
            Get-ChildItem `
              -LiteralPath $inputDir `
              -File `
              -Recurse |
            Sort-Object FullName
          )

          if ($snapshot.Count -ne $currentFiles.Count) {
            throw "Production input file count changed."
          }

          $expected = @{}

          foreach ($item in $snapshot) {
            $expected[[string]$item.path] = (
              [string]$item.sha256
            ).ToLowerInvariant()
          }

          foreach ($file in $currentFiles) {
            $path = $file.FullName

            if (-not $expected.ContainsKey($path)) {
              throw "Unexpected production input: $path"
            }

            $actualHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actualHash -ne $expected[$path]) {
              throw "Production input changed: $path"
            }
          }

          Write-Host "============================================"
          Write-Host "PRODUCTION INPUT INTEGRITY"
          Write-Host "============================================"

          Write-Host "[PASS] Input file count unchanged"
          Write-Host "[PASS] Input paths unchanged"
          Write-Host "[PASS] Input SHA256 unchanged"
          Write-Host "[FILES] $($currentFiles.Count)"

      # ============================================================
      # 12. UPLOAD TEST ARTIFACTS
      # ============================================================

      - name: Upload evaluation test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-independent-backtest-evaluation-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_OUTPUT }}
            ${{ env.SNAPSHOT_FILE }}
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 13. FINAL VALIDATION GATE
      # ============================================================

      - name: Final evaluation test validation gate
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_result.json"

          $manifestPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Final result missing."
          }

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Final manifest missing."
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          if ($result.execution_status -ne "PASS") {
            throw "Final evaluation status is not PASS."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading safety gate failed."
          }

          if ($manifest.approved_for_live_trading -ne $false) {
            throw "Manifest safety gate failed."
          }

          Write-Host "============================================"
          Write-Host "CANDIDATE INDEPENDENT BACKTEST EVALUATION"
          Write-Host "TEST CLEAN V001"
          Write-Host "============================================"

          Write-Host "EXECUTION STATUS: PASS"
          Write-Host "SMOKE TEST: PASS"
          Write-Host "OUTPUT FILES: PASS"
          Write-Host "OUTPUT SHA256: PASS"
          Write-Host "RESUME: PASS"
          Write-Host "PRODUCTION INPUT SHA256: PASS"
          Write-Host "LIVE TRADING APPROVED: FALSE"

          Write-Host "============================================"
          Write-Host "FINAL TEST STATUS: PASS"
          Write-Host "============================================"
