name: evaluate_pattern_256_accumulation_candidate_independent_backtest_test.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-independent-backtest-evaluation-test
  cancel-in-progress: false

jobs:
  candidate-independent-backtest-evaluation-test:
    name: evaluate_pattern_256_accumulation_candidate_independent_backtest_test.yml

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: C:\Users\USER\Documents\upbit-surge-monitor
      PROGRAM_FILE: evaluate_pattern_256_accumulation_candidate_independent_backtest.py
      INPUT_RELATIVE: data\reports\pattern_256_accumulation_candidate_independent_backtest
      OUTPUT_NAME: candidate_independent_backtest_evaluation_test
      EXPECTED_VERSION: Clean V004
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and evaluation program
        run: |
          $ErrorActionPreference = "Stop"

          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Evaluation program missing: $program"
          }

          py -m py_compile $program
          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          Write-Host "[PASS] Python and evaluation program"

      - name: Verify production backtest inputs
        run: |
          $ErrorActionPreference = "Stop"

          $inputDir = Join-Path $env:PRODUCTION_ROOT $env:INPUT_RELATIVE

          if (-not (Test-Path -LiteralPath $inputDir -PathType Container)) {
            throw "Production input directory missing: $inputDir"
          }

          $files = @(Get-ChildItem -LiteralPath $inputDir -File -Recurse)

          if ($files.Count -eq 0) {
            throw "Production input directory is empty."
          }

          Write-Host "[PASS] Production input directory"
          Write-Host "[FILES] $($files.Count)"

      - name: Prepare isolated test workspace
        run: |
          $ErrorActionPreference = "Stop"

          $testRoot = Join-Path `
            $env:RUNNER_TEMP `
            "$($env:OUTPUT_NAME)_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"

          if (Test-Path -LiteralPath $testRoot) {
            throw "Test workspace already exists: $testRoot"
          }

          New-Item -ItemType Directory -Path $testRoot | Out-Null

          $outputDir = Join-Path $testRoot "evaluation_output"
          $snapshotFile = Join-Path $testRoot "production_input_snapshot.json"

          "TEST_ROOT=$testRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "TEST_OUTPUT=$outputDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "SNAPSHOT_FILE=$snapshotFile" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[PASS] Isolated test workspace"

      - name: Snapshot production input SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $inputDir = Join-Path $env:PRODUCTION_ROOT $env:INPUT_RELATIVE

          $files = @(Get-ChildItem -LiteralPath $inputDir -File -Recurse |
            Sort-Object FullName)

          if ($files.Count -eq 0) {
            throw "No production input files."
          }

          $snapshot = New-Object System.Collections.Generic.List[object]

          foreach ($file in $files) {
            $hash = (Get-FileHash `
              -LiteralPath $file.FullName `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            $snapshot.Add([PSCustomObject]@{
              path = $file.FullName
              sha256 = $hash
            })
          }

          # Explicit JSON array: avoids PowerShell scalar/array ambiguity.
          $json = ConvertTo-Json -InputObject @($snapshot.ToArray()) -Depth 10

          [System.IO.File]::WriteAllText(
            $env:SNAPSHOT_FILE,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "[PASS] Production SHA256 snapshot"
          Write-Host "[COUNT] $($snapshot.Count)"

      - name: Execute independent evaluation smoke test
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          py $program `
            --root $env:PRODUCTION_ROOT `
            --output $env:TEST_OUTPUT `
            --smoke-test `
            --limit-rows 1000

          if ($LASTEXITCODE -ne 0) {
            throw "Independent evaluation smoke test failed."
          }

          Write-Host "[PASS] Smoke test execution"

      - name: Verify evaluation output files
        run: |
          $ErrorActionPreference = "Stop"

          $expected = @(
            "independent_evaluation_summary.csv"
            "independent_evaluation_comparison.csv"
            "independent_evaluation_decision.csv"
            "independent_evaluation_result.json"
            "independent_evaluation_manifest.json"
          )

          foreach ($name in $expected) {
            $path = Join-Path $env:TEST_OUTPUT $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing output: $name"
            }

            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Empty output: $name"
            }

            Write-Host "[PASS] $name"
          }

      - name: Verify evaluation result
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_result.json"

          $result = Get-Content -LiteralPath $path -Raw |
            ConvertFrom-Json

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Evaluation version mismatch."
          }

          if ($result.execution_status -ne "PASS") {
            throw "Evaluation execution is not PASS."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Unexpected live trading approval."
          }

          if ($result.profitability_proven -ne $false) {
            throw "Unexpected profitability proof."
          }

          if ($result.statistical_independence_proven -ne $false) {
            throw "Unexpected independence proof."
          }

          if ($result.diagnostics.smoke_test -ne $true) {
            throw "Smoke test flag mismatch."
          }

          if ($result.diagnostics.full_dataset_evaluated -ne $false) {
            throw "Smoke test incorrectly claims full evaluation."
          }

          $rows = [int]$result.diagnostics.source_rows

          if ($rows -le 0 -or $rows -gt 1000) {
            throw "Invalid smoke test row count: $rows"
          }

          if ([double]$result.target_return_pct -ne 30) {
            throw "Target return is not 30 percent."
          }

          Write-Host "[PASS] Evaluation result"
          Write-Host "[ROWS] $rows"

      - name: Verify evaluation output SHA256
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_manifest.json"

          $manifest = Get-Content -LiteralPath $path -Raw |
            ConvertFrom-Json

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Manifest version mismatch."
          }

          if ($manifest.approved_for_live_trading -ne $false) {
            throw "Manifest safety flag mismatch."
          }

          $expected = @(
            "independent_evaluation_summary.csv"
            "independent_evaluation_comparison.csv"
            "independent_evaluation_decision.csv"
            "independent_evaluation_result.json"
          )

          $properties = @($manifest.output_sha256.PSObject.Properties)

          if ($properties.Count -ne $expected.Count) {
            throw "Output manifest file count mismatch."
          }

          foreach ($name in $expected) {
            $property = $manifest.output_sha256.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Missing output hash: $name"
            }

            $file = Join-Path $env:TEST_OUTPUT $name

            $actual = (Get-FileHash `
              -LiteralPath $file `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            $expectedHash = ([string]$property.Value).ToLowerInvariant()

            if ($actual -ne $expectedHash) {
              throw "Output SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

      - name: Verify completed evaluation resume
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAM_FILE

          $beforeFiles = @(Get-ChildItem `
            -LiteralPath $env:TEST_OUTPUT `
            -File | Sort-Object Name)

          $before = @{}

          foreach ($file in $beforeFiles) {
            $before[$file.Name] = (Get-FileHash `
              -LiteralPath $file.FullName `
              -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          py $program `
            --root $env:PRODUCTION_ROOT `
            --output $env:TEST_OUTPUT `
            --smoke-test `
            --limit-rows 1000

          if ($LASTEXITCODE -ne 0) {
            throw "Completed evaluation resume failed."
          }

          $afterFiles = @(Get-ChildItem `
            -LiteralPath $env:TEST_OUTPUT `
            -File | Sort-Object Name)

          if ($before.Count -ne $afterFiles.Count) {
            throw "Output count changed after resume."
          }

          foreach ($file in $afterFiles) {
            if (-not $before.ContainsKey($file.Name)) {
              throw "Unexpected output after resume."
            }

            $actual = (Get-FileHash `
              -LiteralPath $file.FullName `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $before[$file.Name]) {
              throw "Output changed after resume: $($file.Name)"
            }
          }

          Write-Host "[PASS] Resume without output changes"

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:SNAPSHOT_FILE) {
            throw "Snapshot path unavailable."
          }

          if (-not (Test-Path -LiteralPath $env:SNAPSHOT_FILE -PathType Leaf)) {
            throw "Production input snapshot missing."
          }

          $json = Get-Content -LiteralPath $env:SNAPSHOT_FILE -Raw
          $parsed = ConvertFrom-Json -InputObject $json

          # Preserve one-file and multiple-file snapshots identically.
          $snapshot = @($parsed)

          if ($snapshot.Count -eq 0) {
            throw "Empty production snapshot."
          }

          $inputDir = Join-Path $env:PRODUCTION_ROOT $env:INPUT_RELATIVE

          $currentFiles = @(Get-ChildItem `
            -LiteralPath $inputDir `
            -File -Recurse |
            Sort-Object FullName)

          $expected = @{}

          foreach ($item in $snapshot) {
            $path = [string]$item.path
            $hash = [string]$item.sha256

            if (-not $path -or -not $hash) {
              throw "Invalid snapshot entry."
            }

            if ($expected.ContainsKey($path)) {
              throw "Duplicate snapshot path: $path"
            }

            $expected[$path] = $hash.ToLowerInvariant()
          }

          if ($expected.Count -ne $currentFiles.Count) {
            throw "Production input file count changed."
          }

          foreach ($file in $currentFiles) {
            $path = $file.FullName

            if (-not $expected.ContainsKey($path)) {
              throw "Unexpected production input: $path"
            }

            $actual = (Get-FileHash `
              -LiteralPath $path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $expected[$path]) {
              throw "Production input SHA256 changed: $path"
            }

            Write-Host "[INPUT SHA256 PASS] $path"
          }

          Write-Host "[PASS] Production input count unchanged"
          Write-Host "[PASS] Production input paths unchanged"
          Write-Host "[PASS] Production input SHA256 unchanged"

      - name: Upload evaluation test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-independent-backtest-evaluation-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_OUTPUT }}
            ${{ env.SNAPSHOT_FILE }}
          if-no-files-found: warn
          retention-days: 7

      - name: Final evaluation test validation gate
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_result.json"

          $manifestPath = Join-Path `
            $env:TEST_OUTPUT `
            "independent_evaluation_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Final result missing."
          }

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Final manifest missing."
          }

          $result = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json

          if ($result.execution_status -ne "PASS") {
            throw "Final evaluation status is not PASS."
          }

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Final version mismatch."
          }

          if ($result.approved_for_live_trading -ne $false) {
            throw "Live trading safety gate failed."
          }

          if ($manifest.approved_for_live_trading -ne $false) {
            throw "Manifest safety gate failed."
          }

          Write-Host "============================================"
          Write-Host "CANDIDATE INDEPENDENT BACKTEST EVALUATION"
          Write-Host "TEST CLEAN V004"
          Write-Host "============================================"
          Write-Host "EXECUTION STATUS: PASS"
          Write-Host "SMOKE TEST: PASS"
          Write-Host "OUTPUT FILES: PASS"
          Write-Host "OUTPUT SHA256: PASS"
          Write-Host "RESUME: PASS"
          Write-Host "PRODUCTION INPUT SHA256: PASS"
          Write-Host "LIVE TRADING APPROVED: FALSE"
          Write-Host "============================================"
          Write-Host "FINAL TEST STATUS: PASS"
