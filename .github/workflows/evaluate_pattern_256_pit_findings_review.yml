
name: evaluate_pattern_256_pit_findings_review.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pattern-256-pit-findings-review
  cancel-in-progress: false

jobs:
  pit-findings-review:
    name: pit-findings-review
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    env:
      AUDIT_VERSION: Clean V003-24
      PROJECT_ROOT: C:\Users\USER\Documents\upbit-surge-monitor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"
          py --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python unavailable"
          }

      - name: Review point-in-time findings
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import ast
          import csv
          import hashlib
          import io
          import json
          import os
          import sys
          import tempfile

          from datetime import datetime, timezone
          from pathlib import Path


          VERSION = "Clean V003-24"

          ROOT = Path(
              os.environ["PROJECT_ROOT"]
          ).resolve()

          PREVIOUS = (
              ROOT / "data" / "reports"
              / "pattern_256_point_in_time_audit"
          )

          OUTPUT = (
              ROOT / "data" / "reports"
              / "pattern_256_pit_findings_review"
          )

          PREVIOUS_FILES = (
              "point_in_time_result.json",
              "point_in_time_findings.csv",
          )

          SOURCE_FILES = (
              "build_features.py",
              "detect_256.py",
              "validate_256.py",
          )

          OUTPUT_FILES = (
              "pit_findings_review.csv",
              "pit_findings_review_result.json",
          )


          def digest(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  for chunk in iter(
                      lambda: f.read(1024 * 1024),
                      b"",
                  ):
                      h.update(chunk)

              return h.hexdigest()


          def load_json(path):
              return json.loads(
                  path.read_text(
                      encoding="utf-8-sig"
                  )
              )


          def dump_json(value):
              return json.dumps(
                  value,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n"


          def write_atomic(path, text):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              fd, name = tempfile.mkstemp(
                  prefix=".pit_review_",
                  suffix=".tmp",
                  dir=str(path.parent),
              )

              temp = Path(name)

              try:
                  with os.fdopen(
                      fd,
                      "w",
                      encoding="utf-8",
                      newline="",
                  ) as f:
                      f.write(text)
                      f.flush()
                      os.fsync(f.fileno())

                  os.replace(temp, path)

              finally:
                  if temp.exists():
                      temp.unlink()


          def csv_output(header, rows):
              buffer = io.StringIO(
                  newline=""
              )

              writer = csv.writer(
                  buffer,
                  lineterminator="\n",
              )

              writer.writerow(header)
              writer.writerows(rows)

              return buffer.getvalue()


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def verify_previous():
              manifest_path = (
                  PREVIOUS
                  / "point_in_time_manifest.json"
              )

              manifest = load_json(
                  manifest_path
              )

              result = load_json(
                  PREVIOUS
                  / "point_in_time_result.json"
              )

              require(
                  manifest.get("version")
                  == "Clean V003-23",
                  "Previous manifest version mismatch",
              )

              require(
                  result.get("version")
                  == "Clean V003-23",
                  "Previous result version mismatch",
              )

              require(
                  result.get("execution_status")
                  == "PASS",
                  "Previous execution not PASS",
              )

              require(
                  result.get("overall_decision")
                  == "HOLD",
                  "Previous decision not HOLD",
              )

              require(
                  result.get(
                      "approved_for_live_trading"
                  ) is False,
                  "Unsafe previous approval",
              )

              expected_outputs = (
                  manifest.get(
                      "output_sha256", {}
                  )
              )

              require(
                  set(expected_outputs)
                  == set(PREVIOUS_FILES),
                  "Previous output list mismatch",
              )

              for name, expected in (
                  expected_outputs.items()
              ):
                  path = PREVIOUS / name

                  require(
                      path.is_file(),
                      "Missing previous file: "
                      + name,
                  )

                  require(
                      digest(path) == expected,
                      "Previous SHA256 mismatch: "
                      + name,
                  )

              expected_sources = (
                  manifest.get(
                      "input_sha256", {}
                  ).get(
                      "implementation_files", {}
                  )
              )

              require(
                  set(expected_sources)
                  == set(SOURCE_FILES),
                  "Source file list mismatch",
              )

              for name, expected in (
                  expected_sources.items()
              ):
                  path = ROOT / name

                  require(
                      path.is_file(),
                      "Missing source: " + name,
                  )

                  require(
                      digest(path) == expected,
                      "Source SHA256 mismatch: "
                      + name,
                  )

              findings_path = (
                  PREVIOUS
                  / "point_in_time_findings.csv"
              )

              with findings_path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  reader = csv.DictReader(f)

                  findings = list(reader)

              require(
                  len(findings)
                  == result.get("finding_count"),
                  "Finding count mismatch",
              )

              return findings, {
                  "previous_manifest":
                      digest(manifest_path),
                  "previous_outputs":
                      expected_outputs,
                  "implementation_files":
                      expected_sources,
              }


          def get_function(tree, name):
              matches = [
                  node
                  for node in ast.walk(tree)
                  if isinstance(
                      node,
                      (
                          ast.FunctionDef,
                          ast.AsyncFunctionDef,
                      ),
                  )
                  and node.name == name
              ]

              if len(matches) != 1:
                  return None

              return matches[0]


          def get_node(tree, line, kind):
              matches = [
                  node
                  for node in ast.walk(tree)
                  if isinstance(node, kind)
                  and node.lineno == line
              ]

              return matches


          def integer_value(node):
              if isinstance(
                  node,
                  ast.Constant,
              ):
                  if (
                      isinstance(node.value, int)
                      and not isinstance(
                          node.value, bool
                      )
                  ):
                      return node.value

              if isinstance(
                  node,
                  ast.UnaryOp,
              ):
                  number = integer_value(
                      node.operand
                  )

                  if number is None:
                      return None

                  if isinstance(
                      node.op,
                      ast.USub,
                  ):
                      return -number

                  if isinstance(
                      node.op,
                      ast.UAdd,
                  ):
                      return number

              return None


          def is_name(node, value):
              return (
                  isinstance(node, ast.Name)
                  and node.id == value
              )


          def classify_shift(tree, finding):
              function = get_function(
                  tree,
                  finding["function"],
              )

              if function is None:
                  return (
                      "REVIEW",
                      "Function not uniquely resolved",
                  )

              matches = [
                  node
                  for node in ast.walk(function)
                  if isinstance(node, ast.Call)
                  and node.lineno
                      == int(finding["line"])
                  and isinstance(
                      node.func,
                      ast.Attribute,
                  )
                  and node.func.attr == "shift"
              ]

              if len(matches) != 1:
                  return (
                      "REVIEW",
                      "Shift call not uniquely resolved",
                  )

              call = matches[0]

              if not call.args:
                  return (
                      "REVIEW",
                      "Shift argument not positional",
                  )

              argument = call.args[0]

              number = integer_value(argument)

              if number is not None:
                  if number < 0:
                      return (
                          "RISK",
                          "Negative shift confirmed",
                      )

                  return (
                      "STATIC_NONNEGATIVE",
                      "Literal nonnegative shift",
                  )

              if not isinstance(
                  argument,
                  ast.Name,
              ):
                  return (
                      "REVIEW",
                      "Shift argument is an expression",
                  )

              variable = argument.id

              assignments = []

              for node in ast.walk(function):
                  if isinstance(
                      node,
                      ast.Assign,
                  ):
                      if any(
                          is_name(target, variable)
                          for target in node.targets
                      ):
                          assignments.append(node)

                  elif isinstance(
                      node,
                      ast.AnnAssign,
                  ):
                      if is_name(
                          node.target,
                          variable,
                      ):
                          assignments.append(node)

                  elif isinstance(
                      node,
                      ast.AugAssign,
                  ):
                      if is_name(
                          node.target,
                          variable,
                      ):
                          assignments.append(node)

              earlier = [
                  node
                  for node in assignments
                  if node.lineno < call.lineno
              ]

              if not earlier:
                  return (
                      "REVIEW",
                      "No local assignment found; "
                      "inspect parameter and caller",
                  )

              latest = max(
                  earlier,
                  key=lambda node: node.lineno,
              )

              if isinstance(
                  latest,
                  ast.AugAssign,
              ):
                  return (
                      "REVIEW",
                      "Augmented assignment requires review",
                  )

              value = latest.value
              number = integer_value(value)

              if number is not None:
                  if number < 0:
                      return (
                          "RISK",
                          "Negative local assignment",
                      )

                  if len(earlier) == 1:
                      return (
                          "STATIC_NONNEGATIVE",
                          "Single nonnegative literal "
                          "assignment",
                      )

              return (
                  "REVIEW",
                  "Dynamic lookback assignment at line "
                  + str(latest.lineno),
              )


          def classify_iloc(tree, finding):
              function = get_function(
                  tree,
                  finding["function"],
              )

              if function is None:
                  return (
                      "REVIEW",
                      "Function not uniquely resolved",
                  )

              matches = [
                  node
                  for node in ast.walk(function)
                  if isinstance(
                      node,
                      ast.Subscript,
                  )
                  and node.lineno
                      == int(finding["line"])
                  and isinstance(
                      node.value,
                      ast.Attribute,
                  )
                  and node.value.attr == "iloc"
              ]

              if len(matches) != 1:
                  return (
                      "REVIEW",
                      "iloc access not uniquely resolved",
                  )

              target = matches[0]

              if integer_value(
                  target.slice
              ) != -1:
                  return (
                      "REVIEW",
                      "Unexpected iloc expression",
                  )

              parents = {}

              for node in ast.walk(function):
                  for child in ast.iter_child_nodes(
                      node
                  ):
                      parents[id(child)] = node

              current = target
              logging_context = False

              while id(current) in parents:
                  current = parents[id(current)]

                  if isinstance(
                      current,
                      ast.Call,
                  ):
                      if is_name(
                          current.func,
                          "print",
                      ):
                          logging_context = True
                          break

              if logging_context:
                  return (
                      "LOGGING_ONLY",
                      "iloc[-1] is used inside print; "
                      "this does not prove upstream "
                      "data was truncated correctly",
                  )

              return (
                  "REVIEW",
                  "Last-row access requires "
                  "data-cutoff verification",
              )


          def review(findings):
              parsed = {}

              for filename in SOURCE_FILES:
                  content = (
                      ROOT / filename
                  ).read_text(
                      encoding="utf-8-sig"
                  )

                  parsed[filename] = ast.parse(
                      content,
                      filename=filename,
                  )

              rows = []

              for finding in findings:
                  filename = finding[
                      "source_file"
                  ]

                  require(
                      filename in parsed,
                      "Unknown finding source",
                  )

                  tree = parsed[filename]

                  category = finding[
                      "category"
                  ]

                  if category == "DYNAMIC_SHIFT":
                      status, explanation = (
                          classify_shift(
                              tree,
                              finding,
                          )
                      )

                  elif category == "NEGATIVE_ILOC":
                      status, explanation = (
                          classify_iloc(
                              tree,
                              finding,
                          )
                      )

                  else:
                      status = "REVIEW"
                      explanation = (
                          "Category requires manual review"
                      )

                  rows.append([
                      filename,
                      finding["line"],
                      finding["function"],
                      category,
                      finding["severity"],
                      status,
                      explanation,
                      finding["expression"],
                  ])

              return rows


          def valid_existing(inputs):
              manifest_path = (
                  OUTPUT
                  / "pit_findings_review_manifest.json"
              )

              if not manifest_path.is_file():
                  return False

              try:
                  manifest = load_json(
                      manifest_path
                  )

                  result = load_json(
                      OUTPUT
                      / "pit_findings_review_result.json"
                  )

                  if (
                      manifest.get("version")
                      != VERSION
                  ):
                      return False

                  if (
                      manifest.get("input_sha256")
                      != inputs
                  ):
                      return False

                  hashes = manifest.get(
                      "output_sha256", {}
                  )

                  if set(hashes) != set(
                      OUTPUT_FILES
                  ):
                      return False

                  for name, expected in (
                      hashes.items()
                  ):
                      if digest(
                          OUTPUT / name
                      ) != expected:
                          return False

                  return (
                      result.get("version")
                      == VERSION
                      and result.get(
                          "execution_status"
                      ) == "PASS"
                      and result.get(
                          "overall_decision"
                      ) == "HOLD"
                      and result.get(
                          "approved_for_live_trading"
                      ) is False
                  )

              except (
                  OSError,
                  ValueError,
                  TypeError,
                  KeyError,
              ):
                  return False


          def main():
              findings, inputs = (
                  verify_previous()
              )

              if valid_existing(inputs):
                  print(
                      "[SKIP] Verified completed audit"
                  )
                  print("[DECISION] HOLD")
                  return 0

              if OUTPUT.exists():
                  if any(OUTPUT.iterdir()):
                      raise ValueError(
                          "Existing output is incomplete "
                          "or modified. Preserve it "
                          "for manual inspection."
                      )

              rows = review(findings)

              statuses = {}

              for row in rows:
                  status = row[5]

                  statuses[status] = (
                      statuses.get(
                          status, 0
                      ) + 1
                  )

              risk_count = statuses.get(
                  "RISK", 0
              )

              review_count = statuses.get(
                  "REVIEW", 0
              )

              result = {
                  "version": VERSION,
                  "execution_status": "PASS",
                  "checked_at_utc":
                      datetime.now(
                          timezone.utc
                      ).isoformat(
                          timespec="seconds"
                      ),
                  "finding_count": len(rows),
                  "classification_counts":
                      statuses,
                  "confirmed_risk_count":
                      risk_count,
                  "unresolved_review_count":
                      review_count,
                  "previous_audit_verified":
                      True,
                  "source_hashes_verified":
                      True,
                  "static_context_review_completed":
                      True,
                  "runtime_prefix_recomputation_completed":
                      False,
                  "lookahead_absence_proven":
                      False,
                  "closed_candle_semantics_proven":
                      False,
                  "ohlcv_continuity_verified":
                      False,
                  "signal_definition_mathematically_verified":
                      False,
                  "new_prospective_events_created":
                      0,
                  "independent_oos_proven":
                      False,
                  "profitability_proven":
                      False,
                  "approved_for_live_trading":
                      False,
                  "overall_decision": "HOLD",
                  "next_required_validation": (
                      "Inspect unresolved dynamic "
                      "lookback and execute historical "
                      "prefix-only signal recomputation "
                      "with closed candles."
                  ),
              }

              OUTPUT.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              write_atomic(
                  OUTPUT
                  / "pit_findings_review.csv",
                  csv_output(
                      (
                          "source_file",
                          "line",
                          "function",
                          "original_category",
                          "original_severity",
                          "review_status",
                          "review_explanation",
                          "expression",
                      ),
                      rows,
                  ),
              )

              write_atomic(
                  OUTPUT
                  / "pit_findings_review_result.json",
                  dump_json(result),
              )

              manifest = {
                  "version": VERSION,
                  "input_sha256": inputs,
                  "output_sha256": {
                      name: digest(
                          OUTPUT / name
                      )
                      for name in OUTPUT_FILES
                  },
              }

              write_atomic(
                  OUTPUT
                  / "pit_findings_review_manifest.json",
                  dump_json(manifest),
              )

              require(
                  valid_existing(inputs),
                  "Final output integrity failure",
              )

              print(
                  "[PASS]", VERSION
              )

              print(
                  "[FINDINGS]", len(rows)
              )

              print(
                  "[CLASSIFICATIONS]",
                  json.dumps(
                      statuses,
                      sort_keys=True,
                  )
              )

              print(
                  "[DECISION] HOLD"
              )

              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())

              except KeyboardInterrupt:
                  print(
                      "[INTERRUPTED]",
                      file=sys.stderr,
                  )
                  sys.exit(130)

              except Exception as exc:
                  print(
                      "[FAIL]", str(exc),
                      file=sys.stderr,
                  )
                  sys.exit(1)
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "PIT findings review failed"
          }

      - name: Verify result integrity
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import hashlib
          import json
          import os

          from pathlib import Path


          root = Path(
              os.environ["PROJECT_ROOT"]
          )

          folder = (
              root / "data" / "reports"
              / "pattern_256_pit_findings_review"
          )

          manifest = json.loads(
              (
                  folder
                  / "pit_findings_review_manifest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          result = json.loads(
              (
                  folder
                  / "pit_findings_review_result.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          def digest(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  for chunk in iter(
                      lambda: f.read(1024 * 1024),
                      b"",
                  ):
                      h.update(chunk)

              return h.hexdigest()


          version = "Clean V003-24"

          if manifest.get("version") != version:
              raise SystemExit(
                  "Manifest version mismatch"
              )

          if result.get("version") != version:
              raise SystemExit(
                  "Result version mismatch"
              )

          if result.get(
              "execution_status"
          ) != "PASS":
              raise SystemExit(
                  "Execution status mismatch"
              )

          if result.get(
              "overall_decision"
          ) != "HOLD":
              raise SystemExit(
                  "Decision mismatch"
              )

          if result.get(
              "approved_for_live_trading"
          ) is not False:
              raise SystemExit(
                  "Unsafe approval"
              )

          if result.get(
              "new_prospective_events_created"
          ) != 0:
              raise SystemExit(
                  "Unexpected signal generation"
              )

          expected_outputs = {
              "pit_findings_review.csv",
              "pit_findings_review_result.json",
          }

          hashes = manifest[
              "output_sha256"
          ]

          if set(hashes) != expected_outputs:
              raise SystemExit(
                  "Output file set mismatch"
              )

          for name, expected in hashes.items():
              if digest(
                  folder / name
              ) != expected:
                  raise SystemExit(
                      "Output SHA256 mismatch: " + name
                  )

          inputs = manifest[
              "input_sha256"
          ]

          previous = (
              root / "data" / "reports"
              / "pattern_256_point_in_time_audit"
          )

          previous_manifest = (
              previous
              / "point_in_time_manifest.json"
          )

          if digest(previous_manifest) != (
              inputs["previous_manifest"]
          ):
              raise SystemExit(
                  "Previous manifest changed"
              )

          for name, expected in inputs[
              "previous_outputs"
          ].items():
              if digest(
                  previous / name
              ) != expected:
                  raise SystemExit(
                      "Previous output changed: " + name
                  )

          for name, expected in inputs[
              "implementation_files"
          ].items():
              if digest(
                  root / name
              ) != expected:
                  raise SystemExit(
                      "Source changed: " + name
                  )

          print(
              "[PASS] Clean V003-24"
          )
          print(
              "[PASS] SHA256 integrity"
          )
          print(
              "[DECISION] HOLD"
          )
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Result verification failed"
          }

      - name: Upload review artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-pit-findings-review-v003-24
          path: |
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_pit_findings_review/pit_findings_review.csv
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_pit_findings_review/pit_findings_review_result.json
            ${{ env.PROJECT_ROOT }}/data/reports/pattern_256_pit_findings_review/pit_findings_review_manifest.json
          if-no-files-found: error
          retention-days: 90
