      # ======================================================

      - name: Verify no future result columns were created
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          forbidden_exact_columns = {
              "label",
              "target",
              "future_return",
              "future_max_return",
              "future_min_return",
              "future_high",
              "future_low",
              "future_close",
              "future_price",
              "hit_30",
              "hit_30pct",
              "surge_30",
              "surge_label",
              "prediction",
              "predicted_probability",
              "buy_signal",
              "sell_signal",
          }

          forbidden_prefixes = (
              "future_",
              "label_",
              "target_",
              "prediction_",
              "predicted_",
          )

          files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in files.items():

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
                  nrows=1,
              )

              columns = [
                  str(column).strip()
                  for column in df.columns
              ]

              suspicious = []

              for column in columns:

                  lowered = column.lower()

                  if lowered in forbidden_exact_columns:

                      suspicious.append(
                          column
                      )

                      continue

                  if lowered.startswith(
                      forbidden_prefixes
                  ):

                      suspicious.append(
                          column
                      )

              if suspicious:

                  print(
                      f"[FAIL] {timeframe} contains "
                      "future/label/prediction columns:"
                  )

                  for column in suspicious:
                      print(
                          f"  {column}"
                      )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} contains "
                      "no forbidden future/result "
                      "output columns."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] No future result, label, "
              "prediction, or trading columns created."
          )
          PY


