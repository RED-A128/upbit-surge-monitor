      # ======================================================

      - name: Verify detector status log
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          path = Path(
              "data/detect_256_status.csv"
          )

          if not path.exists():

              print(
                  "[FAIL] detect_256_status.csv "
                  "not found."
              )

              sys.exit(1)

          df = pd.read_csv(
              path,
              encoding="utf-8-sig",
          )

          required_columns = [
              "run_time_utc",
              "version",
              "market",
              "timeframe",
              "status",
              "feature_rows",
              "signal_rows",
              "feature_sha256_before",
              "feature_sha256_after",
              "message",
          ]

          missing = [
              column
              for column in required_columns
              if column not in df.columns
          ]

          if missing:

              print(
                  "[FAIL] Status log missing columns:"
              )

              for column in missing:
                  print(
                      f"  {column}"
                  )

              sys.exit(1)

          current = df[
              (
                  df["market"] == "KRW-BTC"
              )
              & (
                  df["timeframe"].isin(
                      [
                          "h1",
                          "h4",
                          "d1",
                      ]
                  )
              )
          ].tail(3)

          if len(current) != 3:

              print(
                  "[FAIL] Expected 3 current detector "
                  "status rows."
              )

              print(
                  current.to_string(
                      index=False
                  )
              )

              sys.exit(1)

          statuses = set(
              current[
                  "status"
              ]
              .astype(str)
              .tolist()
          )

          if statuses != {
              "PASSED"
          }:

              print(
                  "[FAIL] Detector status contains "
                  "non-PASSED result."
              )

              print(
                  current.to_string(
                      index=False
                  )
              )

              sys.exit(1)

          hash_mismatch = current[
              current[
                  "feature_sha256_before"
              ]
              != current[
                  "feature_sha256_after"
              ]
          ]

          if not hash_mismatch.empty:

              print(
                  "[FAIL] Status log reports "
                  "Feature SHA256 mismatch."
              )

              print(
                  hash_mismatch.to_string(
                      index=False
                  )
              )

              sys.exit(1)

          print(
              current[
                  [
                      "market",
                      "timeframe",
                      "status",
                      "feature_rows",
                      "signal_rows",
                  ]
              ].to_string(
                  index=False
              )
          )

          print(
              "[PASS] Detector status log verified."
          )
          PY


