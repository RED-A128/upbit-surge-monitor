# ============================================================
# Upbit Surge Monitor
# 256 Detector Full KRW Market Test - Clean V002
#
# File:
#   .github/workflows/detect_256_test.yml
#
# Purpose:
#   Run detect_256.py Clean V002 against the COMPLETE
#   KRW feature dataset already generated and validated.
#
# Current validated foundation:
#
#   KRW markets : 290
#   Timeframes  : h1 / h4 / d1
#   Feature jobs: 870
#
# IMPORTANT:
#
#   - Does NOT rebuild features.
#   - Does NOT modify OHLCV.
#   - Does NOT modify Feature CSV files.
#   - Does NOT create future-result labels.
#   - Does NOT perform prediction.
#   - Does NOT perform trading.
#   - Does NOT run git reset.
#   - Does NOT run git clean.
#   - Does NOT commit.
#   - Does NOT push.
#
# Expected detector output:
#
#   data/signals/256/h1/*.csv
#   data/signals/256/h4/*.csv
#   data/signals/256/d1/*.csv
#
#   data/detect_256_status.csv
#
# ============================================================

name: Full KRW 256 Detector Clean V002


# ============================================================
# 1. Manual execution only
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. Permissions
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. Prevent duplicate detector execution
# ============================================================

concurrency:
  group: full-krw-detect-256-v002
  cancel-in-progress: false


# ============================================================
# 4. Environment
# ============================================================

env:
  PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor
  EXPECTED_MARKETS: "290"
  EXPECTED_TIMEFRAMES: "3"
  EXPECTED_JOBS: "870"


# ============================================================
# 5. Job
# ============================================================

jobs:

  detect-256-full:

    name: Full KRW 256 Detector Clean V002

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120


    steps:


      # ======================================================
      # STEP 1
      # Show execution environment
      # ======================================================

      - name: Show detector environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR"
          Write-Host "FULL KRW 256 DETECTOR - CLEAN V002"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project directory : ${{ env.PROJECT_DIR }}"
          Write-Host "Expected markets  : ${{ env.EXPECTED_MARKETS }}"
          Write-Host "Timeframes        : h1 / h4 / d1"
          Write-Host "Expected jobs     : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          Write-Host "Runner            : $env:RUNNER_NAME"
          Write-Host "OS                : $env:RUNNER_OS"
          Write-Host ""

          Write-Host "Execution mode:"
          Write-Host "  Full KRW market detector"
          Write-Host "  Existing Feature CSV READ ONLY"
          Write-Host "  h1 / h4 / d1"
          Write-Host ""

          Write-Host "Safety:"
          Write-Host "  Feature regeneration : DISABLED"
          Write-Host "  OHLCV modification   : DISABLED"
          Write-Host "  Feature modification : DISABLED"
          Write-Host "  Future labels        : DISABLED"
          Write-Host "  Prediction           : DISABLED"
          Write-Host "  Trading              : DISABLED"
          Write-Host "  Git reset --hard     : DISABLED"
          Write-Host "  Git clean            : DISABLED"
          Write-Host "  Automatic commit     : DISABLED"
          Write-Host "  Automatic push       : DISABLED"
          Write-Host ""

          Write-Host "============================================================"


      # ======================================================
      # STEP 2
      # Verify project directory
      # ======================================================

      - name: Verify project directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"

          if (-not (Test-Path $project)) {

              Write-Host ""
              Write-Host "[FAIL] Project directory does not exist:"
              Write-Host "       $project"

              exit 1
          }

          Set-Location $project

          Write-Host ""
          Write-Host "[PASS] Project directory exists."
          Write-Host ""

          Get-Location


      # ======================================================
      # STEP 3
      # Synchronize repository
      #
      # Runtime data is ignored by Git.
      # No reset / clean is used.
      # ======================================================

      - name: Synchronize local repository
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SYNCHRONIZE LOCAL REPOSITORY"
          Write-Host "============================================================"
          Write-Host ""

          git pull --ff-only origin main

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] git pull failed."
              Write-Host "[STOP] Detector will not run."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Local repository synchronized."


      # ======================================================
      # STEP 4
      # Verify Python
      # ======================================================

      - name: Verify Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "Checking Python..."
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Python launcher 'py' is unavailable."

              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python is available."


      # ======================================================
      # STEP 5
      # Verify detector source
      # ======================================================

      - name: Verify detect_256.py
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          $detector = Join-Path $project "detect_256.py"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY DETECTOR SOURCE"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $detector)) {

              Write-Host "[FAIL] detect_256.py does not exist."
              exit 1
          }

          $info = Get-Item $detector

          if ($info.Length -le 0) {

              Write-Host "[FAIL] detect_256.py is empty."
              exit 1
          }

          Write-Host "[PASS] detect_256.py exists."
          Write-Host "       Size: $($info.Length) bytes"


      # ======================================================
      # STEP 6
      # Install / verify dependencies
      # ======================================================

      - name: Verify Python dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          if (-not (Test-Path "requirements.txt")) {

              Write-Host ""
              Write-Host "[FAIL] requirements.txt is missing."
              exit 1
          }

          Write-Host ""
          Write-Host "Installing/verifying dependencies..."
          Write-Host ""

          py -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] Dependency installation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies ready."


      # ======================================================
      # STEP 7
      # Verify complete Feature directory structure
      # ======================================================

      - name: Verify full feature directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FULL FEATURE DIRECTORY STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $timeframes = @(
              "h1",
              "h4",
              "d1"
          )

          $failed = $false

          foreach ($tf in $timeframes) {

              $path = Join-Path $project "data\features\$tf"

              if (-not (Test-Path $path)) {

                  Write-Host "[FAIL] Missing feature directory:"
                  Write-Host "       data\features\$tf"

                  $failed = $true
                  continue
              }

              Write-Host "[PASS] data\features\$tf"
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Feature directory verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Feature directory structure verified."


      # ======================================================
      # STEP 8
      # Verify full market file set
      #
      # Requirements:
      #
      #   h1 = 290
      #   h4 = 290
      #   d1 = 290
      #
      # Market names must match exactly across all TFs.
      # ======================================================

      - name: Verify full feature market set
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $expectedMarkets = [int]"${{ env.EXPECTED_MARKETS }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FULL FEATURE MARKET SET"
          Write-Host "============================================================"
          Write-Host ""

          $sets = @{}

          foreach ($tf in @("h1", "h4", "d1")) {

              $dir = Join-Path $project "data\features\$tf"

              $files = @(
                  Get-ChildItem `
                      -Path $dir `
                      -Filter "KRW-*.csv" `
                      -File `
                      -ErrorAction Stop
              )

              $markets = @(
                  $files |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              $sets[$tf] = $markets

              Write-Host "[$($tf.ToUpper())]"
              Write-Host "Files   : $($files.Count)"
              Write-Host "Markets : $($markets.Count)"
              Write-Host ""

              if ($files.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf file count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($files.Count)"
                  exit 1
              }

              if ($markets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] $tf unique market count mismatch."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($markets.Count)"
                  exit 1
              }
          }

          $h1 = @($sets["h1"])
          $h4 = @($sets["h4"])
          $d1 = @($sets["d1"])

          $h1VsH4 = @(
              Compare-Object $h1 $h4
          )

          $h1VsD1 = @(
              Compare-Object $h1 $d1
          )

          if ($h1VsH4.Count -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] H1/H4 market sets differ."

              $h1VsH4 | Format-Table -AutoSize

              exit 1
          }

          if ($h1VsD1.Count -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] H1/D1 market sets differ."

              $h1VsD1 | Format-Table -AutoSize

              exit 1
          }

          Write-Host "[PASS] H1/H4/D1 contain the same $expectedMarkets markets."
          Write-Host "[PASS] Expected detector jobs: $($expectedMarkets * 3)"


      # ======================================================
      # STEP 9
      # Save complete Feature SHA256 snapshot
      #
      # Detector must never modify Feature CSVs.
      # ======================================================

      - name: Record all feature hashes before detector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FEATURE SHA256 SNAPSHOT"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "detect_256_all_features_before.sha256"

          $lines = New-Object System.Collections.Generic.List[string]

          $count = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              $dir = Join-Path $project "data\features\$tf"

              $files = @(
                  Get-ChildItem `
                      -Path $dir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              foreach ($file in $files) {

                  $hash = (
                      Get-FileHash `
                          -Path $file.FullName `
                          -Algorithm SHA256
                  ).Hash

                  $relative = "data\features\$tf\$($file.Name)"

                  $lines.Add("$relative|$hash")

                  $count++
              }
          }

          $lines |
              Set-Content `
                  -Path $hashFile `
                  -Encoding UTF8

          Write-Host "Feature files hashed : $count"
          Write-Host "Expected             : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          if ($count -ne [int]"${{ env.EXPECTED_JOBS }}") {

              Write-Host "[FAIL] Feature hash count mismatch."
              exit 1
          }

          Write-Host "[PASS] Full Feature SHA256 snapshot saved."


      # ======================================================
      # STEP 10
      # Save complete OHLCV SHA256 snapshot
      #
      # Detector must never modify accumulated OHLCV.
      # ======================================================

      - name: Record all OHLCV hashes before detector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "OHLCV SHA256 SNAPSHOT"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "detect_256_all_ohlcv_before.sha256"

          $lines = New-Object System.Collections.Generic.List[string]

          $count = 0

          foreach ($tf in @("h1", "h4", "d1")) {

              $dir = Join-Path $project "data\ohlcv\$tf"

              if (-not (Test-Path $dir)) {

                  Write-Host "[FAIL] Missing OHLCV directory:"
                  Write-Host "       data\ohlcv\$tf"

                  exit 1
              }

              $files = @(
                  Get-ChildItem `
                      -Path $dir `
                      -Filter "KRW-*.csv" `
                      -File |
                  Sort-Object Name
              )

              foreach ($file in $files) {

                  $hash = (
                      Get-FileHash `
                          -Path $file.FullName `
                          -Algorithm SHA256
                  ).Hash

                  $relative = "data\ohlcv\$tf\$($file.Name)"

                  $lines.Add("$relative|$hash")

                  $count++
              }
          }

          $lines |
              Set-Content `
                  -Path $hashFile `
                  -Encoding UTF8

          Write-Host "OHLCV files hashed : $count"
          Write-Host "Expected           : ${{ env.EXPECTED_JOBS }}"
          Write-Host ""

          if ($count -ne [int]"${{ env.EXPECTED_JOBS }}") {

              Write-Host "[FAIL] OHLCV hash count mismatch."
              exit 1
          }

          Write-Host "[PASS] Full OHLCV SHA256 snapshot saved."


      # ======================================================
      # STEP 11
      # Run full KRW 256 Detector Clean V002
      #
      # IMPORTANT:
      #
      # No --market argument.
      #
      # Clean V002 detector discovers the complete common
      # KRW market set from:
      #
      #   data/features/h1
      #   data/features/h4
      #   data/features/d1
      #
      # ======================================================

      - name: Run full KRW 256 Detector Clean V002
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN FULL KRW 256 DETECTOR CLEAN V002"
          Write-Host "============================================================"
          Write-Host ""

          py detect_256.py

          $detectorExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Detector exit code: $detectorExitCode"
          Write-Host ""

          if ($detectorExitCode -ne 0) {

              Write-Host "[FAIL] detect_256.py returned a failure."
              Write-Host "[STOP] Do NOT proceed to 256 Validator."

              exit $detectorExitCode
          }

          Write-Host "[PASS] Full KRW detector execution completed."


      # ======================================================
      # STEP 12
      # Verify detector status file
      # ======================================================

      - name: Verify detector status file
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $statusFile = Join-Path $project "data\detect_256_status.csv"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY DETECTOR STATUS FILE"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $statusFile)) {

              Write-Host "[FAIL] Detector status file does not exist:"
              Write-Host "       data\detect_256_status.csv"

              exit 1
          }

          $info = Get-Item $statusFile

          if ($info.Length -le 0) {

              Write-Host "[FAIL] Detector status file is empty."
              exit 1
          }

          Write-Host "[PASS] Detector status file exists."
          Write-Host "       Size: $($info.Length) bytes"
          Write-Host ""

          Write-Host "Last status rows:"
          Write-Host ""

          Import-Csv $statusFile |
              Select-Object -Last 20 |
              Format-Table -AutoSize


      # ======================================================
      # STEP 13
      # Verify detector signal directory structure
      # ======================================================

      - name: Verify detector output directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY DETECTOR OUTPUT DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          $failed = $false

          foreach ($tf in @("h1", "h4", "d1")) {

              $dir = Join-Path $project "data\signals\256\$tf"

              if (-not (Test-Path $dir)) {

                  Write-Host "[FAIL] Missing detector output directory:"
                  Write-Host "       data\signals\256\$tf"

                  $failed = $true
                  continue
              }

              $files = @(
                  Get-ChildItem `
                      -Path $dir `
                      -Filter "KRW-*.csv" `
                      -File
              )

              Write-Host "[$($tf.ToUpper())]"
              Write-Host "Signal files : $($files.Count)"
              Write-Host ""
          }

          if ($failed) {

              Write-Host "[FAIL] Detector output directory verification failed."
              exit 1
          }

          Write-Host "[PASS] Detector output directories exist."


      # ======================================================
      # STEP 14
      # Verify complete detector output market set
      #
      # Expected:
      #
      #   h1 = 290
      #   h4 = 290
      #   d1 = 290
      #
      # ======================================================

      - name: Verify full detector output market set
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $expectedMarkets = [int]"${{ env.EXPECTED_MARKETS }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FULL DETECTOR OUTPUT MARKET SET"
          Write-Host "============================================================"
          Write-Host ""

          $sets = @{}

          foreach ($tf in @("h1", "h4", "d1")) {

              $dir = Join-Path $project "data\signals\256\$tf"

              $files = @(
                  Get-ChildItem `
                      -Path $dir `
                      -Filter "KRW-*.csv" `
                      -File `
                      -ErrorAction Stop
              )

              $markets = @(
                  $files |
                  ForEach-Object {
                      $_.BaseName
                  } |
                  Sort-Object -Unique
              )

              $sets[$tf] = $markets

              Write-Host "[$($tf.ToUpper())]"
              Write-Host "Files   : $($files.Count)"
              Write-Host "Markets : $($markets.Count)"
              Write-Host ""

              if ($files.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] Detector output count mismatch for $tf."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($files.Count)"

                  exit 1
              }

              if ($markets.Count -ne $expectedMarkets) {

                  Write-Host "[FAIL] Unique detector market count mismatch for $tf."
                  Write-Host "       Expected: $expectedMarkets"
                  Write-Host "       Actual  : $($markets.Count)"

                  exit 1
              }
          }

          $h1VsH4 = @(
              Compare-Object `
                  @($sets["h1"]) `
                  @($sets["h4"])
          )

          $h1VsD1 = @(
              Compare-Object `
                  @($sets["h1"]) `
                  @($sets["d1"])
          )

          if ($h1VsH4.Count -ne 0) {

              Write-Host "[FAIL] Detector H1/H4 market sets differ."
              $h1VsH4 | Format-Table -AutoSize

              exit 1
          }

          if ($h1VsD1.Count -ne 0) {

              Write-Host "[FAIL] Detector H1/D1 market sets differ."
              $h1VsD1 | Format-Table -AutoSize

              exit 1
          }

          Write-Host "[PASS] Detector produced all $expectedMarkets markets."
          Write-Host "[PASS] H1/H4/D1 detector market sets match."
          Write-Host "[PASS] Total detector jobs: $($expectedMarkets * 3)"


      # ======================================================
      # STEP 15
      # Verify Feature files remained unchanged
      # ======================================================

      - name: Verify all feature files remained unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "detect_256_all_features_before.sha256"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FEATURE FILE INTEGRITY"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Feature SHA256 snapshot is missing."
              exit 1
          }

          $failed = 0
          $passed = 0

          foreach ($line in Get-Content $hashFile) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $parts = $line -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid feature hash record:"
                  Write-Host "       $line"

                  $failed++
                  continue
              }

              $relative = $parts[0]
              $before = $parts[1]

              $fullPath = Join-Path $project $relative

              if (-not (Test-Path $fullPath)) {

                  Write-Host "[FAIL] Feature file disappeared:"
                  Write-Host "       $relative"

                  $failed++
                  continue
              }

              $after = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($before -ne $after) {

                  Write-Host "[FAIL] Feature file changed:"
                  Write-Host "       $relative"

                  $failed++
              }
              else {

                  $passed++
              }
          }

          Write-Host ""
          Write-Host "Feature integrity:"
          Write-Host "  Passed : $passed"
          Write-Host "  Failed : $failed"
          Write-Host ""

          if ($failed -ne 0) {

              Write-Host "[FAIL] Detector modified Feature data."
              exit 1
          }

          if ($passed -ne [int]"${{ env.EXPECTED_JOBS }}") {

              Write-Host "[FAIL] Feature integrity count mismatch."
              Write-Host "       Expected: ${{ env.EXPECTED_JOBS }}"
              Write-Host "       Actual  : $passed"

              exit 1
          }

          Write-Host "[PASS] All Feature CSV files remained unchanged."


      # ======================================================
      # STEP 16
      # Verify OHLCV files remained unchanged
      # ======================================================

      - name: Verify all OHLCV files remained unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"

          $hashFile = Join-Path `
              $env:RUNNER_TEMP `
              "detect_256_all_ohlcv_before.sha256"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY OHLCV FILE INTEGRITY"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] OHLCV SHA256 snapshot is missing."
              exit 1
          }

          $failed = 0
          $passed = 0

          foreach ($line in Get-Content $hashFile) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $parts = $line -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid OHLCV hash record:"
                  Write-Host "       $line"

                  $failed++
                  continue
              }

              $relative = $parts[0]
              $before = $parts[1]

              $fullPath = Join-Path $project $relative

              if (-not (Test-Path $fullPath)) {

                  Write-Host "[FAIL] OHLCV file disappeared:"
                  Write-Host "       $relative"

                  $failed++
                  continue
              }

              $after = (
                  Get-FileHash `
                      -Path $fullPath `
                      -Algorithm SHA256
              ).Hash

              if ($before -ne $after) {

                  Write-Host "[FAIL] OHLCV file changed:"
                  Write-Host "       $relative"

                  $failed++
              }
              else {

                  $passed++
              }
          }

          Write-Host ""
          Write-Host "OHLCV integrity:"
          Write-Host "  Passed : $passed"
          Write-Host "  Failed : $failed"
          Write-Host ""

          if ($failed -ne 0) {

              Write-Host "[FAIL] Detector modified OHLCV data."
              exit 1
          }

          if ($passed -ne [int]"${{ env.EXPECTED_JOBS }}") {

              Write-Host "[FAIL] OHLCV integrity count mismatch."
              Write-Host "       Expected: ${{ env.EXPECTED_JOBS }}"
              Write-Host "       Actual  : $passed"

              exit 1
          }

          Write-Host "[PASS] All accumulated OHLCV CSV files remained unchanged."


      # ======================================================
      # STEP 17
      # Verify generated runtime data is Git ignored
      # ======================================================

      - name: Verify generated detector data remains ignored
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY GENERATED DATA GIT SAFETY"
          Write-Host "============================================================"
          Write-Host ""

          $status = @(
              git status `
                  --short `
                  --untracked-files=all
          )

          $unexpected = @()

          foreach ($line in $status) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              Write-Host $line

              $path = ""

              if ($line.Length -gt 3) {
                  $path = $line.Substring(3).Trim()
              }

              $normalized = $path.Replace("\", "/")

              $allowed = (
                  $normalized -like "data/signals/*" -or
                  $normalized -eq "data/detect_256_status.csv"
              )

              if (-not $allowed) {

                  $unexpected += $line
              }
          }

          Write-Host ""

          if ($unexpected.Count -gt 0) {

              Write-Host "[FAIL] Unexpected Git-visible changes detected:"
              Write-Host ""

              foreach ($line in $unexpected) {
                  Write-Host $line
              }

              Write-Host ""
              Write-Host "[STOP] Review repository changes before continuing."

              exit 1
          }

          Write-Host "[PASS] No unexpected Git-visible changes detected."
          Write-Host "[PASS] Detector runtime data is safely ignored."


