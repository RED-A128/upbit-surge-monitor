# ============================================================
# Upbit Surge Monitor
# Clean V001
#
# detect_256_test.yml
#
# Purpose
# ------------------------------------------------------------
# Test detect_256.py safely against the existing local
# KRW-BTC OHLCV history stored on the self-hosted Windows PC.
#
# IMPORTANT
# ------------------------------------------------------------
# Actual local data structure:
#
#   data/
#     ohlcv/
#       h1/
#         KRW-BTC.csv
#       h4/
#         KRW-BTC.csv
#       d1/
#         KRW-BTC.csv
#
#     features/
#       h1/
#         KRW-BTC.csv
#       h4/
#         KRW-BTC.csv
#       d1/
#         KRW-BTC.csv
#
# This workflow:
#
#   1. Uses the existing local OHLCV data.
#   2. Does NOT delete existing OHLCV data.
#   3. Does NOT move existing OHLCV data.
#   4. Does NOT reset the Git repository.
#   5. Does NOT run git clean.
#   6. Does NOT automatically commit or push.
#   7. Verifies OHLCV SHA256 before/after the test.
#   8. Builds Clean V002 features.
#   9. Runs the Clean V001 256 detector.
#  10. Verifies detector outputs.
#
# Trading is NOT performed.
#
# ============================================================

name: 256 Detector Test


# ============================================================
# 1. Manual execution only
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 2. Permissions
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. Prevent duplicate test execution
# ============================================================

concurrency:
  group: detect-256-test
  cancel-in-progress: false


# ============================================================
# 4. Environment
# ============================================================

env:
  PROJECT_DIR: C:\Users\USER\Documents\upbit-surge-monitor
  TEST_MARKET: KRW-BTC


# ============================================================
# 5. Job
# ============================================================

jobs:

  detect-256-test:

    name: KRW-BTC 256 Detector Test

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 30


    # ========================================================
    # Steps
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # Show environment
      # ======================================================

      - name: Show test environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR - 256 DETECTOR TEST"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Project directory:"
          Write-Host "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "Test market:"
          Write-Host "${{ env.TEST_MARKET }}"

          Write-Host ""
          Write-Host "Runner:"
          Write-Host "$env:RUNNER_NAME"

          Write-Host ""
          Write-Host "OS:"
          Write-Host "$env:RUNNER_OS"

          Write-Host ""
          Write-Host "Safety:"
          Write-Host "Existing OHLCV deletion : DISABLED"
          Write-Host "Git reset --hard        : DISABLED"
          Write-Host "Git clean               : DISABLED"
          Write-Host "Automatic Git commit    : DISABLED"
          Write-Host "Automatic Git push      : DISABLED"
          Write-Host "Trading                 : DISABLED"

          Write-Host ""
          Write-Host "============================================================"


      # ======================================================
      # STEP 2
      # Verify project directory
      # ======================================================

      - name: Verify project directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "Checking project directory..."
          Write-Host $project
          Write-Host ""

          if (-not (Test-Path $project)) {
              Write-Host "[FAIL] Project directory does not exist:"
              Write-Host $project
              exit 1
          }

          Set-Location $project

          Write-Host "[PASS] Project directory exists."
          Write-Host ""

          Write-Host "Current directory:"
          Get-Location


      # ======================================================
      # STEP 3
      # Verify Python
      # ======================================================

      - name: Verify Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "Checking Python..."
          Write-Host ""

          py --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[FAIL] Python launcher 'py' is not available."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Python is available."


      # ======================================================
      # STEP 4
      # Verify required source files
      # ======================================================

      - name: Verify required project files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "Checking required project files..."
          Write-Host ""

          $requiredFiles = @(
              "build_features.py",
              "detect_256.py",
              "requirements.txt"
          )

          $failed = $false

          foreach ($file in $requiredFiles) {

              $path = Join-Path $project $file

              if (Test-Path $path) {

                  Write-Host "[PASS] $file"

              }
              else {

                  Write-Host "[FAIL] Missing required file:"
                  Write-Host "       $path"

                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Required project files verified."


      # ======================================================
      # STEP 5
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "${{ env.PROJECT_DIR }}"

          Write-Host ""
          Write-Host "Installing/verifying Python dependencies..."
          Write-Host ""

          py -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "[FAIL] Dependency installation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Dependencies ready."


      # ======================================================
      # STEP 6
      # Verify actual local OHLCV directories
      #
      # Actual local structure:
      #
      #   data/ohlcv/h1/
      #   data/ohlcv/h4/
      #   data/ohlcv/d1/
      #
      # ======================================================

      - name: Verify local OHLCV directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY ACTUAL LOCAL OHLCV DIRECTORY STRUCTURE"
          Write-Host "============================================================"
          Write-Host ""

          $directories = @(
              "data\ohlcv\h1",
              "data\ohlcv\h4",
              "data\ohlcv\d1"
          )

          $failed = $false

          foreach ($relativePath in $directories) {

              $fullPath = Join-Path $project $relativePath

              if (Test-Path $fullPath) {

                  Write-Host "[PASS] Directory exists:"
                  Write-Host "       $relativePath"

              }
              else {

                  Write-Host "[FAIL] Missing directory:"
                  Write-Host "       $relativePath"

                  $failed = $true
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Required OHLCV directory structure is incomplete."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Actual local OHLCV directory structure verified."


      # ======================================================
      # STEP 7
      # Verify KRW-BTC OHLCV input files
      # ======================================================

      - name: Verify KRW-BTC OHLCV input files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $market = "${{ env.TEST_MARKET }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY KRW-BTC OHLCV INPUT FILES"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\ohlcv\h1\$market.csv",
              "data\ohlcv\h4\$market.csv",
              "data\ohlcv\d1\$market.csv"
          )

          $failed = $false

          foreach ($relativePath in $files) {

              $fullPath = Join-Path $project $relativePath

              if (-not (Test-Path $fullPath)) {

                  Write-Host "[FAIL] Missing OHLCV file:"
                  Write-Host "       $relativePath"

                  $failed = $true
                  continue
              }

              $fileInfo = Get-Item $fullPath

              if ($fileInfo.Length -le 0) {

                  Write-Host "[FAIL] OHLCV file is empty:"
                  Write-Host "       $relativePath"

                  $failed = $true
                  continue
              }

              Write-Host "[PASS] $relativePath"
              Write-Host "       Size: $($fileInfo.Length) bytes"
              Write-Host "       LastWriteTime: $($fileInfo.LastWriteTime)"
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] KRW-BTC OHLCV verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] KRW-BTC OHLCV files verified."


      # ======================================================
      # STEP 8
      # Save OHLCV SHA256 before feature/detector test
      #
      # This protects the original accumulated OHLCV data.
      # ======================================================

      - name: Save OHLCV SHA256 before detector test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $market = "${{ env.TEST_MARKET }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SAVE ORIGINAL OHLCV SHA256"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\ohlcv\h1\$market.csv",
              "data\ohlcv\h4\$market.csv",
              "data\ohlcv\d1\$market.csv"
          )

          $hashLines = @()

          foreach ($relativePath in $files) {

              $fullPath = Join-Path $project $relativePath

              $hash = (Get-FileHash `
                  -Path $fullPath `
                  -Algorithm SHA256).Hash

              $hashLines += "$relativePath|$hash"

              Write-Host "$relativePath"
              Write-Host "SHA256: $hash"
              Write-Host ""
          }

          $hashFile = Join-Path $env:RUNNER_TEMP "detect_256_ohlcv_before.sha256"

          $hashLines | Set-Content `
              -Path $hashFile `
              -Encoding UTF8

          Write-Host "[PASS] Original OHLCV hashes saved."
          Write-Host "Temporary hash file:"
          Write-Host $hashFile


      # ======================================================
      # STEP 9
      # Build KRW-BTC Clean V002 features
      #
      # build_features.py reads:
      #
      #   data/ohlcv/h1
      #   data/ohlcv/h4
      #   data/ohlcv/d1
      #
      # and writes:
      #
      #   data/features/h1
      #   data/features/h4
      #   data/features/d1
      #
      # ======================================================

      - name: Build KRW-BTC Clean V002 features
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "BUILD CLEAN V002 FEATURES"
          Write-Host "============================================================"
          Write-Host ""

          py build_features.py --market "${{ env.TEST_MARKET }}"

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] build_features.py failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Clean V002 feature build completed."


      # ======================================================
      # STEP 10
      # Verify detector feature input files
      # ======================================================

      - name: Verify detector feature input files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $market = "${{ env.TEST_MARKET }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY DETECTOR FEATURE INPUT"
          Write-Host "============================================================"
          Write-Host ""

          $featureCandidates = @(
              "data\features\h1\$market.csv",
              "data\features\h4\$market.csv",
              "data\features\d1\$market.csv"
          )

          $failed = $false

          foreach ($relativePath in $featureCandidates) {

              $fullPath = Join-Path $project $relativePath

              if (-not (Test-Path $fullPath)) {

                  Write-Host "[FAIL] Missing feature file:"
                  Write-Host "       $relativePath"

                  $failed = $true
                  continue
              }

              $fileInfo = Get-Item $fullPath

              if ($fileInfo.Length -le 0) {

                  Write-Host "[FAIL] Feature file is empty:"
                  Write-Host "       $relativePath"

                  $failed = $true
                  continue
              }

              Write-Host "[PASS] $relativePath"
              Write-Host "       Size: $($fileInfo.Length) bytes"
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Detector feature input verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Detector feature input files verified."


      # ======================================================
      # STEP 11
      # Save feature SHA256 before detector
      #
      # Detector should READ features, not mutate them.
      # ======================================================

      - name: Save feature SHA256 before detector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          $market = "${{ env.TEST_MARKET }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SAVE FEATURE SHA256 BEFORE DETECTOR"
          Write-Host "============================================================"
          Write-Host ""

          $files = @(
              "data\features\h1\$market.csv",
              "data\features\h4\$market.csv",
              "data\features\d1\$market.csv"
          )

          $hashLines = @()

          foreach ($relativePath in $files) {

              $fullPath = Join-Path $project $relativePath

              $hash = (Get-FileHash `
                  -Path $fullPath `
                  -Algorithm SHA256).Hash

              $hashLines += "$relativePath|$hash"

              Write-Host "$relativePath"
              Write-Host "SHA256: $hash"
              Write-Host ""
          }

          $hashFile = Join-Path $env:RUNNER_TEMP "detect_256_features_before.sha256"

          $hashLines | Set-Content `
              -Path $hashFile `
              -Encoding UTF8

          Write-Host "[PASS] Feature hashes saved."


      # ======================================================
      # STEP 12
      # Run 256 Detector Clean V001
      # ======================================================

      - name: Run 256 Detector Clean V001
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RUN 256 DETECTOR CLEAN V001"
          Write-Host "============================================================"
          Write-Host ""

          py detect_256.py --market "${{ env.TEST_MARKET }}"

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "[FAIL] detect_256.py failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] 256 detector execution completed."


      # ======================================================
      # STEP 13
      # Verify feature files were NOT modified by detector
      # ======================================================

      - name: Verify detector did not modify feature files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY FEATURE FILE INTEGRITY"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path $env:RUNNER_TEMP "detect_256_features_before.sha256"

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Saved feature hash file is missing."
              exit 1
          }

          $savedLines = Get-Content $hashFile

          $failed = $false

          foreach ($line in $savedLines) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $parts = $line -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid saved hash line:"
                  Write-Host $line

                  $failed = $true
                  continue
              }

              $relativePath = $parts[0]
              $beforeHash = $parts[1]

              $fullPath = Join-Path $project $relativePath

              if (-not (Test-Path $fullPath)) {

                  Write-Host "[FAIL] Feature file disappeared:"
                  Write-Host "       $relativePath"

                  $failed = $true
                  continue
              }

              $afterHash = (Get-FileHash `
                  -Path $fullPath `
                  -Algorithm SHA256).Hash

              if ($beforeHash -ne $afterHash) {

                  Write-Host "[FAIL] Detector modified feature file:"
                  Write-Host "       $relativePath"
                  Write-Host "       Before: $beforeHash"
                  Write-Host "       After : $afterHash"

                  $failed = $true
              }
              else {

                  Write-Host "[PASS] Unchanged:"
                  Write-Host "       $relativePath"
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Feature integrity verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] Detector did not modify feature files."


      # ======================================================
      # STEP 14
      # Verify original OHLCV was NOT modified
      # ======================================================

      - name: Verify original OHLCV was preserved
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"

          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFY ORIGINAL OHLCV INTEGRITY"
          Write-Host "============================================================"
          Write-Host ""

          $hashFile = Join-Path $env:RUNNER_TEMP "detect_256_ohlcv_before.sha256"

          if (-not (Test-Path $hashFile)) {

              Write-Host "[FAIL] Saved OHLCV hash file is missing."
              exit 1
          }

          $savedLines = Get-Content $hashFile

          $failed = $false

          foreach ($line in $savedLines) {

              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              $parts = $line -split '\|', 2

              if ($parts.Count -ne 2) {

                  Write-Host "[FAIL] Invalid saved OHLCV hash line:"
                  Write-Host $line

                  $failed = $true
                  continue
              }

              $relativePath = $parts[0]
              $beforeHash = $parts[1]

              $fullPath = Join-Path $project $relativePath

              if (-not (Test-Path $fullPath)) {

                  Write-Host "[FAIL] Original OHLCV file disappeared:"
                  Write-Host "       $relativePath"

                  $failed = $true
                  continue
              }

              $afterHash = (Get-FileHash `
                  -Path $fullPath `
                  -Algorithm SHA256).Hash

              if ($beforeHash -ne $afterHash) {

                  Write-Host "[FAIL] Original OHLCV file was modified:"
                  Write-Host "       $relativePath"
                  Write-Host "       Before: $beforeHash"
                  Write-Host "       After : $afterHash"

                  $failed = $true
              }
              else {

                  Write-Host "[PASS] Original OHLCV preserved:"
                  Write-Host "       $relativePath"
              }
          }

          if ($failed) {

              Write-Host ""
              Write-Host "[FAIL] Original OHLCV integrity verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "[PASS] All original OHLCV files were preserved."


      # ======================================================
      # STEP 15
      # Show detector output candidates
      #
      # We do not assume one exact output filename here.
      # This step reports files generated under likely
      # detector/signal/result locations.
      # ======================================================

      - name: Show detector output files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "DETECTOR OUTPUT FILES"
          Write-Host "============================================================"
          Write-Host ""

          $candidateDirs = @(
              "data\signals",
              "data\results",
              "data\detect_256",
              "signals",
              "results"
          )

          $foundAny = $false

          foreach ($relativeDir in $candidateDirs) {

              $fullDir = Join-Path $project $relativeDir

              if (Test-Path $fullDir) {

                  Write-Host ""
                  Write-Host "Directory:"
                  Write-Host $relativeDir

                  $files = Get-ChildItem `
                      -Path $fullDir `
                      -File `
                      -Recurse `
                      -ErrorAction SilentlyContinue

                  if ($files) {

                      $foundAny = $true

                      foreach ($file in $files) {

                          Write-Host "  $($file.FullName)"
                          Write-Host "    Size: $($file.Length) bytes"
                          Write-Host "    Modified: $($file.LastWriteTime)"
                      }
                  }
                  else {

                      Write-Host "  No files."
                  }
              }
          }

          if (-not $foundAny) {

              Write-Host ""
              Write-Host "[INFO] No detector output file was found in the standard"
              Write-Host "       candidate directories."
              Write-Host ""
              Write-Host "       This is not automatically treated as failure."
              Write-Host "       detect_256.py may print results only, or may use"
              Write-Host "       a different output path."
          }


      # ======================================================
      # STEP 16
      # Git safety check
      #
      # Runtime/generated data may be untracked.
      # No commit/push is performed.
      # ======================================================

      - name: Show Git status safely
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ env.PROJECT_DIR }}"
          Set-Location $project

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "GIT STATUS"
          Write-Host "============================================================"
          Write-Host ""

          if (Test-Path ".git") {

              git status --short --untracked-files=all

              Write-Host ""
              Write-Host "[INFO] Git status displayed."
              Write-Host "[INFO] No git reset was executed."
              Write-Host "[INFO] No git clean was executed."
              Write-Host "[INFO] No automatic commit was executed."
              Write-Host "[INFO] No automatic push was executed."
          }
          else {

              Write-Host "[INFO] Local project directory is not a Git working tree."
              Write-Host "[INFO] Detector test itself can still be evaluated."
          }


      # ======================================================
      # STEP 17
      # Final result
      # ======================================================

      - name: Detector test completed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPBIT SURGE MONITOR - 256 DETECTOR TEST COMPLETED"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Market:"
          Write-Host "${{ env.TEST_MARKET }}"
          Write-Host ""

          Write-Host "[PASS] Local project directory verified."
          Write-Host "[PASS] Python verified."
          Write-Host "[PASS] Required project files verified."
          Write-Host "[PASS] Dependencies verified."
          Write-Host "[PASS] Actual local OHLCV directories verified."
          Write-Host "[PASS] KRW-BTC OHLCV files verified."
          Write-Host "[PASS] Clean V002 features built."
          Write-Host "[PASS] Detector feature inputs verified."
          Write-Host "[PASS] 256 detector executed."
          Write-Host "[PASS] Feature files preserved."
          Write-Host "[PASS] Original accumulated OHLCV preserved."

          Write-Host ""
          Write-Host "Data structure:"
          Write-Host "OHLCV    : data\ohlcv\h1 | h4 | d1"
          Write-Host "Features : data\features\h1 | h4 | d1"

          Write-Host ""
          Write-Host "Safety:"
          Write-Host "Existing OHLCV deletion : DISABLED"
          Write-Host "Git reset --hard        : DISABLED"
          Write-Host "Git clean               : DISABLED"
          Write-Host "Automatic Git commit    : DISABLED"
          Write-Host "Automatic Git push      : DISABLED"
          Write-Host "Trading                 : DISABLED"

          Write-Host ""
          Write-Host "============================================================"
