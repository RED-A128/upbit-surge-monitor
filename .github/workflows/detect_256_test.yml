name: 256 Detector Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-256-test:
    name: KRW-BTC 256 Detector Test
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python - <<'PY'
          import numpy
          import pandas

          print("numpy :", numpy.__version__)
          print("pandas:", pandas.__version__)
          PY


      # ======================================================
      # 4. VERIFY REQUIRED PROJECT FILES
      # ======================================================

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required project files..."

          test -f build_features.py || {
            echo "[FAIL] build_features.py not found."
            exit 1
          }

          test -f detect_256.py || {
            echo "[FAIL] detect_256.py not found."
            exit 1
          }

          echo "[PASS] build_features.py found."
          echo "[PASS] detect_256.py found."


      # ======================================================
      # 5. VERIFY KRW-BTC OHLCV INPUT FILES
      # ======================================================

      - name: Verify KRW-BTC OHLCV input files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import sys

          required_files = [
              Path("data/ohlcv/h1/KRW-BTC.csv"),
              Path("data/ohlcv/h4/KRW-BTC.csv"),
              Path("data/ohlcv/d1/KRW-BTC.csv"),
          ]

          failed = False

          for path in required_files:
              if not path.exists():
                  print(f"[FAIL] Missing OHLCV file: {path}")
                  failed = True
                  continue

              size = path.stat().st_size

              if size <= 0:
                  print(f"[FAIL] Empty OHLCV file: {path}")
                  failed = True
                  continue

              print(
                  f"[PASS] {path} "
                  f"size={size:,} bytes"
              )

          if failed:
              sys.exit(1)

          print(
              "[PASS] All required KRW-BTC "
              "OHLCV files are present."
          )
          PY


      # ======================================================
      # 6. BUILD KRW-BTC FEATURES
      # ======================================================

      - name: Build KRW-BTC Clean V002 features
        shell: bash
        run: |
          set -euo pipefail

          echo "Running build_features.py..."

          python build_features.py

          echo "[PASS] build_features.py completed."


      # ======================================================
      # 7. VERIFY FEATURE INPUT FILES
      # ======================================================

      - name: Verify detector feature input files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          feature_files = {
              "H1": Path("data/features/h1/KRW-BTC.csv"),
              "H4": Path("data/features/h4/KRW-BTC.csv"),
              "D1": Path("data/features/d1/KRW-BTC.csv"),
          }

          failed = False

          for timeframe, path in feature_files.items():

              if not path.exists():
                  print(
                      f"[FAIL] {timeframe} feature file "
                      f"not found: {path}"
                  )
                  failed = True
                  continue

              try:
                  df = pd.read_csv(
                      path,
                      encoding="utf-8-sig",
                  )

              except Exception as exc:
                  print(
                      f"[FAIL] {timeframe} cannot read "
                      f"feature CSV: {exc}"
                  )
                  failed = True
                  continue

              if df.empty:
                  print(
                      f"[FAIL] {timeframe} feature CSV "
                      "contains no rows."
                  )
                  failed = True
                  continue

              print(
                  f"[PASS] {timeframe}: "
                  f"{len(df):,} rows / "
                  f"{len(df.columns):,} columns"
              )

          if failed:
              sys.exit(1)

          print(
              "[PASS] All detector feature inputs "
              "are available."
          )
          PY


      # ======================================================
      # 8. SAVE FEATURE SHA256 BEFORE DETECTOR
      # ======================================================

      - name: Save feature SHA256 before detector
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          feature_files = {
              "h1": Path("data/features/h1/KRW-BTC.csv"),
              "h4": Path("data/features/h4/KRW-BTC.csv"),
              "d1": Path("data/features/d1/KRW-BTC.csv"),
          }

          hashes = {}

          for timeframe, path in feature_files.items():

              sha256 = hashlib.sha256()

              with path.open("rb") as file:
                  while True:
                      chunk = file.read(1024 * 1024)

                      if not chunk:
                          break

                      sha256.update(chunk)

              digest = sha256.hexdigest()

              hashes[timeframe] = digest

              print(
                  f"{timeframe.upper()} "
                  f"{digest}"
              )

          output = Path(
              "/tmp/detect_256_feature_hashes_before.json"
          )

          output.write_text(
              json.dumps(
                  hashes,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(
              "[PASS] Feature SHA256 baseline saved."
          )
          PY


      # ======================================================
      # 9. RUN 256 DETECTOR
      # ======================================================

      - name: Run 256 Detector Clean V001
        shell: bash
        run: |
          set -euo pipefail

          echo "Running detect_256.py..."

          python detect_256.py

          echo "[PASS] detect_256.py completed."


      # ======================================================
      # 10. VERIFY SIGNAL FILES EXIST
      # ======================================================

      - name: Verify 256 signal output files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import sys

          signal_files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in signal_files.items():

              if not path.exists():

                  print(
                      f"[FAIL] {timeframe} signal file "
                      f"not found: {path}"
                  )

                  failed = True

                  continue

              size = path.stat().st_size

              if size <= 0:

                  print(
                      f"[FAIL] {timeframe} signal file "
                      f"is empty: {path}"
                  )

                  failed = True

                  continue

              print(
                  f"[PASS] {timeframe}: "
                  f"{path} "
                  f"size={size:,} bytes"
              )

          if failed:
              sys.exit(1)

          print(
              "[PASS] All 256 signal files exist."
          )
          PY


      # ======================================================
      # 11. VERIFY FEATURE SHA256 UNCHANGED
      # ======================================================

      - name: Verify feature CSV files were not modified
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          baseline_file = Path(
              "/tmp/detect_256_feature_hashes_before.json"
          )

          if not baseline_file.exists():
              print(
                  "[FAIL] SHA256 baseline file missing."
              )
              sys.exit(1)

          before = json.loads(
              baseline_file.read_text(
                  encoding="utf-8"
              )
          )

          feature_files = {
              "h1": Path("data/features/h1/KRW-BTC.csv"),
              "h4": Path("data/features/h4/KRW-BTC.csv"),
              "d1": Path("data/features/d1/KRW-BTC.csv"),
          }

          failed = False

          for timeframe, path in feature_files.items():

              sha256 = hashlib.sha256()

              with path.open("rb") as file:

                  while True:

                      chunk = file.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      sha256.update(chunk)

              after = sha256.hexdigest()

              expected = before.get(
                  timeframe
              )

              print(
                  f"{timeframe.upper()} BEFORE: "
                  f"{expected}"
              )

              print(
                  f"{timeframe.upper()} AFTER : "
                  f"{after}"
              )

              if expected != after:

                  print(
                      f"[FAIL] {timeframe.upper()} "
                      "feature CSV was modified."
                  )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe.upper()} "
                      "feature SHA256 unchanged."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] Detector did not modify "
              "Feature CSV files."
          )
          PY


      # ======================================================
      # 12. VERIFY FEATURE / SIGNAL ROW COUNTS
      # ======================================================

      - name: Verify feature and signal row counts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          files = {
              "H1": (
                  Path("data/features/h1/KRW-BTC.csv"),
                  Path("data/signals/256/h1/KRW-BTC.csv"),
              ),
              "H4": (
                  Path("data/features/h4/KRW-BTC.csv"),
                  Path("data/signals/256/h4/KRW-BTC.csv"),
              ),
              "D1": (
                  Path("data/features/d1/KRW-BTC.csv"),
                  Path("data/signals/256/d1/KRW-BTC.csv"),
              ),
          }

          failed = False

          for timeframe, paths in files.items():

              feature_path, signal_path = paths

              feature_df = pd.read_csv(
                  feature_path,
                  encoding="utf-8-sig",
              )

              signal_df = pd.read_csv(
                  signal_path,
                  encoding="utf-8-sig",
              )

              feature_rows = len(
                  feature_df
              )

              signal_rows = len(
                  signal_df
              )

              print(
                  f"{timeframe}: "
                  f"feature={feature_rows:,}, "
                  f"signal={signal_rows:,}"
              )

              if feature_rows != signal_rows:

                  print(
                      f"[FAIL] {timeframe} row count "
                      "mismatch."
                  )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} row count "
                      "matches."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] All feature/signal row counts match."
          )
          PY


      # ======================================================
      # 13. VERIFY REQUIRED DETECTOR COLUMNS
      # ======================================================

      - name: Verify required 256 detector columns
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          required_columns = [

              "cond_ma_compression",
              "cond_long_ma_compression",

              "cond_short_ma_turn",
              "cond_mid_ma_turn",
              "cond_long_ma_stable",

              "cond_price_above_sma5",
              "cond_price_above_sma20",

              "cond_momentum_positive",
              "cond_macd_positive",

              "cond_volume_expansion",
              "cond_trade_value_expansion",

              "cond_candle_strength",

              "cond_not_overextended",

              "setup_score",
              "ready_score",
              "trigger_score",

              "signal_setup",
              "signal_ready",
              "signal_trigger",

              "signal_stage",
          ]

          files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in files.items():

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
                  nrows=5,
              )

              missing = [
                  column
                  for column in required_columns
                  if column not in df.columns
              ]

              print(
                  f"{timeframe}: "
                  f"{len(df.columns):,} columns"
              )

              if missing:

                  print(
                      f"[FAIL] {timeframe} missing "
                      "detector columns:"
                  )

                  for column in missing:
                      print(
                          f"  {column}"
                      )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} all "
                      f"{len(required_columns)} "
                      "detector columns present."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] Required 256 detector "
              "columns verified."
          )
          PY


      # ======================================================
      # 14. VERIFY FLAG VALUES
      # ======================================================

      - name: Verify detector flag values
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          flag_columns = [

              "cond_ma_compression",
              "cond_long_ma_compression",

              "cond_short_ma_turn",
              "cond_mid_ma_turn",
              "cond_long_ma_stable",

              "cond_price_above_sma5",
              "cond_price_above_sma20",

              "cond_momentum_positive",
              "cond_macd_positive",

              "cond_volume_expansion",
              "cond_trade_value_expansion",

              "cond_candle_strength",

              "cond_not_overextended",

              "signal_setup",
              "signal_ready",
              "signal_trigger",
          ]

          files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in files.items():

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
              )

              for column in flag_columns:

                  if column not in df.columns:

                      print(
                          f"[FAIL] {timeframe} missing "
                          f"flag column: {column}"
                      )

                      failed = True

                      continue

                  values = set(
                      pd.to_numeric(
                          df[column],
                          errors="coerce",
                      )
                      .dropna()
                      .unique()
                      .tolist()
                  )

                  invalid_values = (
                      values
                      - {
                          0,
                          1,
                      }
                  )

                  if invalid_values:

                      print(
                          f"[FAIL] {timeframe} "
                          f"{column} invalid values: "
                          f"{invalid_values}"
                      )

                      failed = True

              if not failed:

                  print(
                      f"[PASS] {timeframe} "
                      "flag values are 0/1."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] All detector flag values verified."
          )
          PY


      # ======================================================
      # 15. VERIFY SIGNAL STAGES
      # ======================================================

      - name: Verify detector signal stages
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          allowed_stages = {
              "NONE",
              "SETUP",
              "READY",
              "TRIGGER",
          }

          files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in files.items():

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
              )

              stages = set(
                  df[
                      "signal_stage"
                  ]
                  .dropna()
                  .astype(str)
                  .unique()
                  .tolist()
              )

              invalid = (
                  stages
                  - allowed_stages
              )

              print(
                  f"{timeframe} stages: "
                  f"{sorted(stages)}"
              )

              if invalid:

                  print(
                      f"[FAIL] {timeframe} invalid "
                      f"signal stages: {invalid}"
                  )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} "
                      "signal stages valid."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] All signal stages verified."
          )
          PY


      # ======================================================
      # 16. VERIFY SIGNAL LOGIC CONSISTENCY
      # ======================================================

      - name: Verify detector state consistency
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in files.items():

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
              )

              trigger_without_ready = df[
                  (
                      df["signal_trigger"] == 1
                  )
                  & (
                      df["signal_ready"] != 1
                  )
              ]

              wrong_trigger_stage = df[
                  (
                      df["signal_trigger"] == 1
                  )
                  & (
                      df["signal_stage"] != "TRIGGER"
                  )
              ]

              wrong_ready_stage = df[
                  (
                      df["signal_trigger"] != 1
                  )
                  & (
                      df["signal_ready"] == 1
                  )
                  & (
                      df["signal_stage"] != "READY"
                  )
              ]

              wrong_setup_stage = df[
                  (
                      df["signal_trigger"] != 1
                  )
                  & (
                      df["signal_ready"] != 1
                  )
                  & (
                      df["signal_setup"] == 1
                  )
                  & (
                      df["signal_stage"] != "SETUP"
                  )
              ]

              if not trigger_without_ready.empty:

                  print(
                      f"[FAIL] {timeframe}: "
                      f"{len(trigger_without_ready):,} "
                      "TRIGGER rows without READY."
                  )

                  failed = True

              if not wrong_trigger_stage.empty:

                  print(
                      f"[FAIL] {timeframe}: "
                      f"{len(wrong_trigger_stage):,} "
                      "TRIGGER flag/stage mismatches."
                  )

                  failed = True

              if not wrong_ready_stage.empty:

                  print(
                      f"[FAIL] {timeframe}: "
                      f"{len(wrong_ready_stage):,} "
                      "READY flag/stage mismatches."
                  )

                  failed = True

              if not wrong_setup_stage.empty:

                  print(
                      f"[FAIL] {timeframe}: "
                      f"{len(wrong_setup_stage):,} "
                      "SETUP flag/stage mismatches."
                  )

                  failed = True

              if (
                  trigger_without_ready.empty
                  and wrong_trigger_stage.empty
                  and wrong_ready_stage.empty
                  and wrong_setup_stage.empty
              ):

                  print(
                      f"[PASS] {timeframe} "
                      "state consistency verified."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] Detector state consistency verified."
          )
          PY


      # ======================================================
      # 17. VERIFY TIMESTAMP INTEGRITY
      # ======================================================

      - name: Verify detector timestamp integrity
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          files = {
              "H1": (
                  Path("data/features/h1/KRW-BTC.csv"),
                  Path("data/signals/256/h1/KRW-BTC.csv"),
              ),
              "H4": (
                  Path("data/features/h4/KRW-BTC.csv"),
                  Path("data/signals/256/h4/KRW-BTC.csv"),
              ),
              "D1": (
                  Path("data/features/d1/KRW-BTC.csv"),
                  Path("data/signals/256/d1/KRW-BTC.csv"),
              ),
          }

          failed = False

          for timeframe, paths in files.items():

              feature_path, signal_path = paths

              feature_df = pd.read_csv(
                  feature_path,
                  encoding="utf-8-sig",
              )

              signal_df = pd.read_csv(
                  signal_path,
                  encoding="utf-8-sig",
              )

              feature_time = pd.to_datetime(
                  feature_df[
                      "candle_date_time_utc"
                  ],
                  utc=True,
                  errors="coerce",
              )

              signal_time = pd.to_datetime(
                  signal_df[
                      "candle_date_time_utc"
                  ],
                  utc=True,
                  errors="coerce",
              )

              if feature_time.isna().any():

                  print(
                      f"[FAIL] {timeframe} feature "
                      "contains invalid timestamps."
                  )

                  failed = True

              if signal_time.isna().any():

                  print(
                      f"[FAIL] {timeframe} signal "
                      "contains invalid timestamps."
                  )

                  failed = True

              if signal_time.duplicated().any():

                  print(
                      f"[FAIL] {timeframe} signal "
                      "contains duplicate timestamps."
                  )

                  failed = True

              if not signal_time.is_monotonic_increasing:

                  print(
                      f"[FAIL] {timeframe} signal "
                      "timestamps are not sorted."
                  )

                  failed = True

              if not feature_time.reset_index(
                  drop=True
              ).equals(
                  signal_time.reset_index(
                      drop=True
                  )
              ):

                  print(
                      f"[FAIL] {timeframe} feature/signal "
                      "timestamps do not match."
                  )

                  failed = True

              else:

                  print(
                      f"[PASS] {timeframe} "
                      "timestamp integrity verified."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] Detector timestamps verified."
          )
          PY


      # ======================================================
      # 18. VERIFY SCORE VALUES
      # ======================================================

      - name: Verify detector score values
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import sys

          score_limits = {
              "setup_score": (
                  0,
                  5,
              ),
              "ready_score": (
                  0,
                  6,
              ),
              "trigger_score": (
                  0,
                  8,
              ),
          }

          files = {
              "H1": Path(
                  "data/signals/256/h1/KRW-BTC.csv"
              ),
              "H4": Path(
                  "data/signals/256/h4/KRW-BTC.csv"
              ),
              "D1": Path(
                  "data/signals/256/d1/KRW-BTC.csv"
              ),
          }

          failed = False

          for timeframe, path in files.items():

              df = pd.read_csv(
                  path,
                  encoding="utf-8-sig",
              )

              for column, limits in score_limits.items():

                  minimum, maximum = limits

                  values = pd.to_numeric(
                      df[column],
                      errors="coerce",
                  )

                  if values.isna().any():

                      print(
                          f"[FAIL] {timeframe} "
                          f"{column} contains NaN."
                      )

                      failed = True

                      continue

                  if np.isinf(
                      values.to_numpy(
                          dtype=float
                      )
                  ).any():

                      print(
                          f"[FAIL] {timeframe} "
                          f"{column} contains infinity."
                      )

                      failed = True

                  actual_min = int(
                      values.min()
                  )

                  actual_max = int(
                      values.max()
                  )

                  print(
                      f"{timeframe} {column}: "
                      f"min={actual_min}, "
                      f"max={actual_max}"
                  )

                  if (
                      actual_min < minimum
                      or actual_max > maximum
                  ):

                      print(
                          f"[FAIL] {timeframe} "
                          f"{column} outside expected "
                          f"range {minimum}~{maximum}."
                      )

                      failed = True

              if not failed:

                  print(
                      f"[PASS] {timeframe} "
                      "score ranges verified."
                  )

          if failed:
              sys.exit(1)

          print(
              "[PASS] Detector score values verified."
          )
          PY


      # ======================================================
      # 19. VERIFY NO INFINITE NUMERIC VALUES
      # ======================================================

      - name: Verify detector numeric integrity
        shell: bash
