
name: audit_pattern_256_replay_diagnostics.yml

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pattern256-replay-diagnostics
  cancel-in-progress: false

jobs:
  replay-diagnostics:
    name: replay-diagnostics

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_replay_diagnostics.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing diagnostics Python script"
          }

          & py -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed"
          }

          Write-Host "[PASS] Python script verified"

      - name: Download previous replay artifact
        id: download
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $api = "https://api.github.com/repos/$env:GH_REPOSITORY"

          $base = Join-Path $env:RUNNER_TEMP `
            "pattern256_diag_input_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"

          if (Test-Path -LiteralPath $base) {
            throw "Input directory already exists"
          }

          New-Item -ItemType Directory `
            -Path $base -Force | Out-Null

          $selected = $null
          $selectedArtifact = $null

          for ($page = 1; $page -le 5; $page++) {
            $url = "$api/actions/artifacts?per_page=100&page=$page"

            $response = Invoke-RestMethod `
              -Uri $url `
              -Headers $headers `
              -Method Get

            $artifacts = @($response.artifacts)

            $candidates = @(
              $artifacts |
                Where-Object {
                  -not $_.expired -and
                  $_.name -match "^pattern256-replay-"
                } |
                Sort-Object created_at -Descending
            )

            foreach ($artifact in $candidates) {
              $folder = Join-Path $base `
                "artifact_$($artifact.id)"

              New-Item -ItemType Directory `
                -Path $folder -Force | Out-Null

              $zip = Join-Path $folder "artifact.zip"
              $extract = Join-Path $folder "extracted"

              try {
                Invoke-WebRequest `
                  -Uri "$api/actions/artifacts/$($artifact.id)/zip" `
                  -Headers $headers `
                  -OutFile $zip `
                  -UseBasicParsing

                Expand-Archive `
                  -LiteralPath $zip `
                  -DestinationPath $extract `
                  -Force

                $files = @(
                  Get-ChildItem `
                    -LiteralPath $extract `
                    -Recurse `
                    -File `
                    -Filter "replay_manifest.json"
                )

                foreach ($file in $files) {
                  $dir = $file.DirectoryName

                  $resultPath = Join-Path $dir `
                    "replay_result.json"

                  $detailPath = Join-Path $dir `
                    "replay_details.csv"

                  if (-not (Test-Path $resultPath) -or
                      -not (Test-Path $detailPath)) {
                    continue
                  }

                  $manifest = Get-Content `
                    -LiteralPath $file.FullName `
                    -Raw | ConvertFrom-Json

                  $result = Get-Content `
                    -LiteralPath $resultPath `
                    -Raw | ConvertFrom-Json

                  if ($manifest.audit -ne "pattern_256_ohlcv_outcome_replay" -or
                      $manifest.execution -ne "PASS" -or
                      $result.execution -ne "PASS" -or
                      $result.sampled_events -ne 600 -or
                      $result.processed_events -ne 600 -or
                      $result.research_decision -ne "HOLD") {
                    continue
                  }

                  $valid = $true

                  foreach ($name in @(
                    "replay_result.json",
                    "replay_details.csv"
                  )) {
                    $path = Join-Path $dir $name

                    $actual = (
                      Get-FileHash `
                        -LiteralPath $path `
                        -Algorithm SHA256
                    ).Hash.ToLowerInvariant()

                    $expected = (
                      [string]$manifest.output_sha256.$name
                    ).ToLowerInvariant()

                    if ($actual -ne $expected) {
                      $valid = $false
                      break
                    }
                  }

                  if (-not $valid) {
                    continue
                  }

                  $selected = $dir
                  $selectedArtifact = $artifact.id
                  break
                }

                if ($selected) {
                  break
                }
              }
              catch {
                Write-Host "Candidate rejected: $($_.Exception.Message)"
              }
            }

            if ($selected) {
              break
            }

            if ($artifacts.Count -lt 100) {
              break
            }
          }

          if (-not $selected) {
            throw "No verified replay artifact found"
          }

          "DIAG_INPUT=$selected" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[PASS] Replay artifact verified"
          Write-Host "Artifact ID: $selectedArtifact"

      - name: Prepare output
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "pattern256_diag_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"

          $output = Join-Path $env:RUNNER_TEMP $folder

          if (Test-Path -LiteralPath $output) {
            throw "Output already exists"
          }

          "DIAG_OUTPUT=$output" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Execute diagnostics
        id: diagnostics
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_replay_diagnostics.py"

          & py -u $script `
            --input $env:DIAG_INPUT `
            --output $env:DIAG_OUTPUT

          if ($LASTEXITCODE -ne 0) {
            throw "Replay diagnostics returned nonzero exit code"
          }

      - name: Verify diagnostics SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.diagnostics.outcome }}" -ne "success") {
            throw "Diagnostics execution failed"
          }

          $manifestPath = Join-Path $env:DIAG_OUTPUT `
            "diagnostics_manifest.json"

          $resultPath = Join-Path $env:DIAG_OUTPUT `
            "diagnostics_result.json"

          if (-not (Test-Path $manifestPath) -or
              -not (Test-Path $resultPath)) {
            throw "Diagnostics output missing"
          }

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          if ($manifest.execution -ne "PASS" -or
              $result.execution -ne "PASS" -or
              $result.research_decision -ne "HOLD" -or
              $result.input_events -ne 600 -or
              $result.review_rows -ne 0) {
            throw "Diagnostics result verification failed"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_replay_diagnostics.py"

          $actualScript = (
            Get-FileHash `
              -LiteralPath $script `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actualScript -ne
              ([string]$manifest.script_sha256).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          foreach ($name in @(
            "diagnostics_result.json",
            "diagnostics_detail.csv"
          )) {
            $path = Join-Path $env:DIAG_OUTPUT $name

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$manifest.output_sha256.$name
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] Diagnostics SHA256 verified"

      - name: Publish summary
        if: always()
        run: |
          $execution = "${{ steps.diagnostics.outcome }}"
          $verification = "${{ steps.verify.outcome }}"

          @"
          ## Pattern 256 Replay Diagnostics

          | Check | Result |
          |---|---|
          | Version | Clean V001 |
          | Execution | $execution |
          | Verification | $verification |
          | Research decision | HOLD |

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

          $resultPath = Join-Path $env:DIAG_OUTPUT `
            "diagnostics_result.json"

          if (-not (Test-Path $resultPath)) {
            exit 0
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          @"
          ### Diagnostic counts

          | Check | Count |
          |---|---:|
          | Input events | $($result.input_events) |
          | Review rows | $($result.review_rows) |

          ### Status counts

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

          foreach ($property in $result.status_counts.PSObject.Properties) {
            "- $($property.Name): $($property.Value)" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8
          }

          @"

          ### Non-comparable reasons

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

          foreach ($property in $result.reason_counts.PSObject.Properties) {
            "- $($property.Name): $($property.Value)" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8
          }

          @"

          This audit checks replay report consistency.
          It does not independently replay OHLCV.
          Research decision: HOLD.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pattern256_diag_${{ github.run_id }}_${{ github.run_attempt }}/diagnostics_result.json
            ${{ runner.temp }}/pattern256_diag_${{ github.run_id }}_${{ github.run_attempt }}/diagnostics_detail.csv
            ${{ runner.temp }}/pattern256_diag_${{ github.run_id }}_${{ github.run_attempt }}/diagnostics_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.download.outcome }}" -ne "success") {
            throw "Replay artifact download failed"
          }

          if ("${{ steps.diagnostics.outcome }}" -ne "success") {
            throw "Replay diagnostics failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Replay diagnostics verification failed"
          }

          Write-Host "[PASS] Replay diagnostics"
          Write-Host "Research decision: HOLD"
