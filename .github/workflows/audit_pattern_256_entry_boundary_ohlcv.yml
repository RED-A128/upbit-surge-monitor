
name: audit_pattern_256_entry_boundary_ohlcv.yml

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pattern256-entry-boundary-ohlcv
  cancel-in-progress: false

jobs:
  boundary-ohlcv:
    name: boundary-ohlcv
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      RESEARCH_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_entry_boundary_ohlcv.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing audit Python script"
          }

          if (-not (Test-Path -LiteralPath $env:RESEARCH_ROOT)) {
            throw "Local research root not found"
          }

          $ohlcv = Join-Path $env:RESEARCH_ROOT "data\ohlcv"

          if (-not (Test-Path -LiteralPath $ohlcv)) {
            throw "Local OHLCV directory not found"
          }

          & py -c "import ast,pathlib,sys;ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed"
          }

          Write-Host "[PASS] Environment"

      - name: Download verified boundary artifact
        id: download
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $api = "https://api.github.com/repos/$env:GH_REPOSITORY"

          $base = Join-Path $env:RUNNER_TEMP `
            "boundary_ohlcv_input_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"

          New-Item -ItemType Directory `
            -Path $base -Force | Out-Null

          $selected = $null

          for ($page = 1; $page -le 5; $page++) {
            $response = Invoke-RestMethod `
              -Uri "$api/actions/artifacts?per_page=100&page=$page" `
              -Headers $headers

            $candidates = @(
              $response.artifacts |
                Where-Object {
                  -not $_.expired -and
                  $_.name -match "^pattern256-boundary-"
                } |
                Sort-Object created_at -Descending
            )

            foreach ($artifact in $candidates) {
              $folder = Join-Path $base `
                "artifact_$($artifact.id)"

              New-Item -ItemType Directory `
                -Path $folder -Force | Out-Null

              $zip = Join-Path $folder "artifact.zip"
              $extract = Join-Path $folder "extracted"

              try {
                Invoke-WebRequest `
                  -Uri "$api/actions/artifacts/$($artifact.id)/zip" `
                  -Headers $headers `
                  -OutFile $zip `
                  -UseBasicParsing

                Expand-Archive `
                  -LiteralPath $zip `
                  -DestinationPath $extract `
                  -Force

                $manifests = @(
                  Get-ChildItem `
                    -LiteralPath $extract `
                    -Filter "boundary_manifest.json" `
                    -Recurse -File
                )

                foreach ($file in $manifests) {
                  $dir = $file.DirectoryName

                  $resultPath = Join-Path $dir `
                    "boundary_result.json"

                  $detailPath = Join-Path $dir `
                    "boundary_review.csv"

                  if (-not (Test-Path $resultPath) -or
                      -not (Test-Path $detailPath)) {
                    continue
                  }

                  $manifest = Get-Content `
                    -LiteralPath $file.FullName `
                    -Raw | ConvertFrom-Json

                  $result = Get-Content `
                    -LiteralPath $resultPath `
                    -Raw | ConvertFrom-Json

                  if ($manifest.audit -ne "pattern_256_entry_boundary" -or
                      $manifest.execution -ne "PASS" -or
                      $result.execution -ne "PASS" -or
                      $result.input_events -ne 600 -or
                      $result.review_rows -ne 74) {
                    continue
                  }

                  $valid = $true

                  foreach ($name in @(
                    "boundary_review.csv",
                    "boundary_result.json"
                  )) {
                    $path = Join-Path $dir $name

                    $actual = (
                      Get-FileHash `
                        -LiteralPath $path `
                        -Algorithm SHA256
                    ).Hash.ToLowerInvariant()

                    $expected = (
                      [string]$manifest.output_sha256.$name
                    ).ToLowerInvariant()

                    if (-not $expected -or $actual -ne $expected) {
                      $valid = $false
                      break
                    }
                  }

                  if ($valid) {
                    $selected = $dir
                    Write-Host "[PASS] Artifact ID: $($artifact.id)"
                    break
                  }
                }

                if ($selected) {
                  break
                }
              }
              catch {
                Write-Host "[SKIP] $($_.Exception.Message)"
              }
            }

            if ($selected) {
              break
            }

            if (@($response.artifacts).Count -lt 100) {
              break
            }
          }

          if (-not $selected) {
            throw "Verified boundary artifact not found"
          }

          "BOUNDARY_INPUT=$selected" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append -Encoding utf8

      - name: Prepare isolated output
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "pattern256_boundary_ohlcv_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"
          $output = Join-Path $env:RUNNER_TEMP $folder

          if (Test-Path -LiteralPath $output) {
            throw "Output directory already exists"
          }

          "BOUNDARY_OUTPUT=$output" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append -Encoding utf8

      - name: Execute OHLCV coverage audit
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_entry_boundary_ohlcv.py"

          & py -u $script `
            --root $env:RESEARCH_ROOT `
            --input $env:BOUNDARY_INPUT `
            --output $env:BOUNDARY_OUTPUT

          if ($LASTEXITCODE -ne 0) {
            throw "OHLCV coverage audit failed"
          }

      - name: Verify output and SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Audit execution failed"
          }

          $resultPath = Join-Path $env:BOUNDARY_OUTPUT `
            "ohlcv_coverage_result.json"

          $manifestPath = Join-Path $env:BOUNDARY_OUTPUT `
            "ohlcv_coverage_manifest.json"

          if (-not (Test-Path $resultPath) -or
              -not (Test-Path $manifestPath)) {
            throw "Required output missing"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS" -or
              $manifest.execution -ne "PASS" -or
              $result.input_review_rows -ne 74 -or
              $result.processed_rows -ne 74 -or
              $result.research_decision -ne "HOLD") {
            throw "Result verification failed"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_entry_boundary_ohlcv.py"

          $actualScript = (
            Get-FileHash -LiteralPath $script -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actualScript -ne
              ([string]$manifest.script_sha256).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          foreach ($name in @(
            "ohlcv_coverage_detail.csv",
            "ohlcv_coverage_result.json"
          )) {
            $path = Join-Path $env:BOUNDARY_OUTPUT $name

            $actual = (
              Get-FileHash -LiteralPath $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$manifest.output_sha256.$name
            ).ToLowerInvariant()

            if (-not $expected -or $actual -ne $expected) {
              throw "SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] SHA256 verification"

      - name: Publish summary
        if: always()
        run: |
          $execution = "${{ steps.audit.outcome }}"
          $verification = "${{ steps.verify.outcome }}"

          @"
          ## Pattern 256 Entry Boundary OHLCV Coverage

          | Check | Result |
          |---|---|
          | Version | Clean V001 |
          | Execution | $execution |
          | Verification | $verification |
          | Research decision | HOLD |

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          $path = Join-Path $env:BOUNDARY_OUTPUT `
            "ohlcv_coverage_result.json"

          if (-not (Test-Path -LiteralPath $path)) {
            exit 0
          }

          $result = Get-Content `
            -LiteralPath $path `
            -Raw | ConvertFrom-Json

          @"
          ### Coverage diagnostics

          - Review rows: $($result.input_review_rows)
          - Processed rows: $($result.processed_rows)
          - OHLCV files loaded: $($result.market_timeframe_files_loaded)
          - All counts agree: $($result.all_counts_agree)

          ### Status counts

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          foreach (
            $item in $result.coverage_status_counts.PSObject.Properties
          ) {
            "- $($item.Name): $($item.Value)" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append -Encoding utf8
          }

          @"

          This audit checks OHLCV timestamp coverage only.
          It does not establish executable entry prices,
          +30% outcomes, or trading profitability.

          Research decision: HOLD.
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-boundary-ohlcv-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pattern256_boundary_ohlcv_${{ github.run_id }}_${{ github.run_attempt }}/ohlcv_coverage_detail.csv
            ${{ runner.temp }}/pattern256_boundary_ohlcv_${{ github.run_id }}_${{ github.run_attempt }}/ohlcv_coverage_result.json
            ${{ runner.temp }}/pattern256_boundary_ohlcv_${{ github.run_id }}_${{ github.run_attempt }}/ohlcv_coverage_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.download.outcome }}" -ne "success") {
            throw "Boundary artifact download failed"
          }

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "OHLCV coverage execution failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "OHLCV coverage SHA256 verification failed"
          }

          Write-Host "[PASS] Boundary OHLCV coverage audit"
          Write-Host "Research decision: HOLD"
