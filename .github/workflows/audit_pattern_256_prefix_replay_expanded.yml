name: audit_pattern_256_prefix_replay_expanded.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-pattern-256-prefix-replay-expanded
  cancel-in-progress: false

jobs:
  prefix-replay-expanded:
    name: prefix-replay-expanded

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      REPORT_DIR: 'C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_prefix_replay'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed"
          }

      - name: Verify required scripts
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            "build_features.py",
            "detect_256.py",
            "audit_pattern_256_prefix_replay.py"
          )

          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required script missing: $file"
            }

            Write-Host "[PASS] $file"
          }

      - name: Verify local project and market data
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:DATA_ROOT -PathType Container)) {
            throw "Local project directory missing: $env:DATA_ROOT"
          }

          foreach ($timeframe in @("h1", "h4", "d1")) {
            $directory = Join-Path $env:DATA_ROOT "data\ohlcv\$timeframe"

            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "OHLCV directory missing: $directory"
            }

            $count = @(
              Get-ChildItem `
                -LiteralPath $directory `
                -Filter "*.csv" `
                -File
            ).Count

            if ($count -lt 30) {
              throw "Insufficient OHLCV files for $timeframe : $count"
            }

            Write-Host "[PASS] $timeframe OHLCV files: $count"
          }

      - name: Run expanded prefix replay audit
        run: |
          $ErrorActionPreference = "Stop"

          py -u audit_pattern_256_prefix_replay.py `
            --root "$env:DATA_ROOT" `
            --markets-per-timeframe 30 `
            --cutoffs "0.40,0.65,0.85"

          if ($LASTEXITCODE -ne 0) {
            throw "Expanded prefix replay audit failed"
          }

      - name: Verify expanded audit result
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:REPORT_DIR `
            "prefix_replay_result.json"

          $manifestPath = Join-Path `
            $env:REPORT_DIR `
            "prefix_replay_manifest.json"

          $checksPath = Join-Path `
            $env:REPORT_DIR `
            "prefix_replay_checks.csv"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Audit result missing"
          }

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Audit manifest missing"
          }

          if (-not (Test-Path -LiteralPath $checksPath -PathType Leaf)) {
            throw "Audit checks CSV missing"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw |
            ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Audit execution is not PASS"
          }

          if ($result.feature_prefix_replay_verified -ne $true) {
            throw "Feature prefix replay failed"
          }

          if ($result.signal_prefix_replay_verified -ne $true) {
            throw "Signal prefix replay failed"
          }

          if ([int]$result.failed_checks -ne 0) {
            throw "Failed replay checks detected"
          }

          if ([int]$result.issue_count -ne 0) {
            throw "Replay issues detected"
          }

          if ([int]$result.completed_checks -ne [int]$result.expected_checks) {
            throw "Replay check count mismatch"
          }

          if ([int]$result.expected_checks -lt 27) {
            throw "Unexpectedly small replay scope"
          }

          $checks = @(Import-Csv -LiteralPath $checksPath)

          if ($checks.Count -ne [int]$result.completed_checks) {
            throw "CSV row count does not match completed checks"
          }

          $failedRows = @(
            $checks | Where-Object {
              $_.status -ne "PASS" -or
              [int]$_.feature_mismatches -ne 0 -or
              [int]$_.signal_mismatches -ne 0
            }
          )

          if ($failedRows.Count -gt 0) {
            throw "Replay check CSV contains failures"
          }

          Write-Host "========================================"
          Write-Host "EXPANDED PREFIX REPLAY AUDIT PASS"
          Write-Host "========================================"
          Write-Host "Expected: $($result.expected_checks)"
          Write-Host "Completed: $($result.completed_checks)"
          Write-Host "Passed: $($result.passed_checks)"
          Write-Host "Failed: $($result.failed_checks)"
          Write-Host "Issues: $($result.issue_count)"

      - name: Write job summary
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
            $env:REPORT_DIR `
            "prefix_replay_result.json"

          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $r = Get-Content -LiteralPath $path -Raw |
              ConvertFrom-Json

            $lines = @(
              "# Pattern 256 Expanded Prefix Replay Audit",
              "",
              "| Check | Result |",
              "|---|---|",
              "| Execution | $($r.execution) |",
              "| Version | $($r.version) |",
              "| Expected checks | $($r.expected_checks) |",
              "| Completed checks | $($r.completed_checks) |",
              "| Passed checks | $($r.passed_checks) |",
              "| Failed checks | $($r.failed_checks) |",
              "| Issues | $($r.issue_count) |",
              "| Feature replay verified | $($r.feature_prefix_replay_verified) |",
              "| Signal replay verified | $($r.signal_prefix_replay_verified) |",
              "| Full-market proof | $($r.full_market_leakage_free_proven) |",
              "| Research decision | $($r.research_decision) |",
              "| TRAIN approved | $($r.train_approved) |",
              "| Live trading approved | $($r.live_trading_approved) |",
              "",
              "Expanded sampling is not proof of full-market leakage freedom."
            )

            $lines | Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
          }
          else {
            "Expanded prefix replay result was not generated." |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Encoding utf8 `
                -Append
          }

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-prefix-replay-expanded
          path: C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_prefix_replay\
          if-no-files-found: warn
          retention-days: 14
