
name: research_pattern_256_accumulation_candidate_rules.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-accumulation-candidate-rules-production
  cancel-in-progress: false

jobs:
  candidate-rules-production:
    name: Candidate Rules Research Production

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: research_pattern_256_accumulation_candidate_rules.py
      EXPECTED_VERSION: Clean V001
      SOURCE_REPORT: data\reports\pattern_256_accumulation_risk_adjusted
      OUTPUT_REPORT: data\reports\pattern_256_accumulation_candidate_rules

    steps:

      # ============================================================
      # 01. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      # ============================================================
      # 02. Verify Python program
      # ============================================================

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Python program missing: $program"
          }

          $source = Get-Content `
            -LiteralPath $program `
            -Raw `
            -Encoding UTF8

          if ($source -notmatch 'VERSION\s*=\s*["'']Clean V001["'']') {
            throw "Unexpected Python program version."
          }

          if ($source -notmatch 'PROGRAM\s*=\s*["'']research_pattern_256_accumulation_candidate_rules\.py["'']') {
            throw "Unexpected Python program identity."
          }

          $pycache = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_rules_production_pycache_${{ github.run_id }}_${{ github.run_attempt }}"

          $env:PYTHONPYCACHEPREFIX = $pycache

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          Write-Host "Python program verification PASS"

      # ============================================================
      # 03. Capture production input SHA256
      # ============================================================

      - name: Capture production input SHA256
        id: production_hashes
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:SOURCE_REPORT

          if (-not (Test-Path -LiteralPath $sourceDir -PathType Container)) {
            throw "Production source directory missing: $sourceDir"
          }

          $files = @(
            "risk_adjusted_groups.csv"
            "risk_adjusted_comparison.csv"
            "risk_adjusted_result.json"
            "risk_adjusted_manifest.json"
          )

          $hashes = @{}

          foreach ($filename in $files) {
            $path = Join-Path $sourceDir $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input missing: $path"
            }

            $hashes[$filename] = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            Write-Host "INPUT SHA256: $filename = $($hashes[$filename])"
          }

          $resultPath = Join-Path `
            $sourceDir `
            "risk_adjusted_result.json"

          $manifestPath = Join-Path `
            $sourceDir `
            "risk_adjusted_manifest.json"

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Upstream result status is not PASS."
          }

          if ($manifest.status -ne "PASS") {
            throw "Upstream manifest status is not PASS."
          }

          $upstreamProgram = "validate_pattern_256_accumulation_risk_adjusted.py"

          if ($result.program -ne $upstreamProgram) {
            throw "Unexpected upstream result program."
          }

          if ($manifest.program -ne $upstreamProgram) {
            throw "Unexpected upstream manifest program."
          }

          if ($result.version -ne $manifest.version) {
            throw "Upstream version mismatch."
          }

          if ($result.assessment -ne "DESCRIPTIVE_RISK_COMPARISON_ONLY") {
            throw "Unexpected upstream assessment."
          }

          foreach ($filename in @(
            "risk_adjusted_groups.csv"
            "risk_adjusted_comparison.csv"
            "risk_adjusted_result.json"
          )) {
            $property = $manifest.outputs.PSObject.Properties[$filename]

            if ($null -eq $property) {
              throw "Missing upstream manifest hash: $filename"
            }

            $expected = [string]$property.Value

            if ($expected -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid upstream manifest SHA256: $filename"
            }

            if ($hashes[$filename] -ne $expected.ToLowerInvariant()) {
              throw "Upstream manifest SHA256 mismatch: $filename"
            }
          }

          $hashPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate_rules_production_hashes_${{ github.run_id }}_${{ github.run_attempt }}.json"

          if (Test-Path -LiteralPath $hashPath) {
            throw "Production input hash snapshot already exists."
          }

          $hashes |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath $hashPath `
              -Encoding UTF8

          "hash_path=$hashPath" >> $env:GITHUB_OUTPUT

          Write-Host "Production input SHA256 capture PASS"

      # ============================================================
      # 04. Verify output destination is new
      # ============================================================

      - name: Verify production output destination
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:OUTPUT_REPORT

          if (Test-Path -LiteralPath $outputDir) {
            throw "Output already exists. Refusing overwrite: $outputDir"
          }

          Write-Host "Production output destination available."
          Write-Host "No existing research outputs will be overwritten."

      # ============================================================
      # 05. Execute candidate rules research
      # ============================================================

      - name: Execute candidate rules research
        run: |
          $ErrorActionPreference = "Stop"

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          Write-Host "========================================"
          Write-Host "Candidate Rules Research Production"
          Write-Host "========================================"

          Write-Host "Program: $program"
          Write-Host "Root: $env:PRODUCTION_ROOT"

          py $program --root $env:PRODUCTION_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate rules research production execution failed."
          }

          Write-Host "Candidate rules research execution PASS"

      # ============================================================
      # 06. Verify production outputs
      # ============================================================

      - name: Verify candidate rules production outputs
        id: verify_outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:OUTPUT_REPORT

          if (-not (Test-Path -LiteralPath $outputDir -PathType Container)) {
            throw "Production output directory missing."
          }

          $researchPath = Join-Path `
            $outputDir `
            "candidate_rule_research.csv"

          $comparisonPath = Join-Path `
            $outputDir `
            "candidate_rule_comparison.csv"

          $resultPath = Join-Path `
            $outputDir `
            "candidate_rule_result.json"

          $manifestPath = Join-Path `
            $outputDir `
            "candidate_rule_manifest.json"

          foreach ($path in @(
            $researchPath
            $comparisonPath
            $resultPath
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required production output missing: $path"
            }

            Write-Host "FOUND: $path"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Candidate rules result status is not PASS."
          }

          if ($manifest.status -ne "PASS") {
            throw "Candidate rules manifest status is not PASS."
          }

          if ($result.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected result program."
          }

          if ($manifest.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected manifest program."
          }

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Unexpected result version."
          }

          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "Unexpected manifest version."
          }

          if ($result.source_program -ne "validate_pattern_256_accumulation_risk_adjusted.py") {
            throw "Unexpected upstream source program."
          }

          if ([int]$result.source_group_rows -ne 72) {
            throw "Unexpected source group row count."
          }

          if ([int]$result.source_comparison_rows -ne 36) {
            throw "Unexpected source comparison row count."
          }

          if ([int]$result.rule_count -ne 5) {
            throw "Expected 5 predefined rules."
          }

          if ([int]$result.research_rows -ne 360) {
            throw "Expected 360 research rows."
          }

          if ([int]$result.comparison_rows -ne 180) {
            throw "Expected 180 comparison rows."
          }

          if ($result.assessment -ne "DESCRIPTIVE_CANDIDATE_RULE_RESEARCH_ONLY") {
            throw "Unexpected research assessment."
          }

          # --------------------------------------------------------
          # Verify methodology restrictions
          # --------------------------------------------------------

          $methodology = $result.methodology

          if ($methodology.historical_outcomes_used_for_evaluation -ne $true) {
            throw "Historical outcome evaluation flag mismatch."
          }

          if ($methodology.historical_outcomes_allowed_as_live_features -ne $false) {
            throw "Future information leakage risk."
          }

          if ($methodology.rule_thresholds_predeclared -ne $true) {
            throw "Rule thresholds were not declared in advance."
          }

          if ($methodology.thresholds_optimized_on_current_data -ne $false) {
            throw "Unexpected optimization claim."
          }

          if ($methodology.statistical_significance_tested -ne $false) {
            throw "Unexpected significance claim."
          }

          if ($methodology.out_of_sample_verified -ne $false) {
            throw "Unexpected out-of-sample claim."
          }

          if ($methodology.intrabar_order_resolved -ne $false) {
            throw "Unexpected intrabar ordering claim."
          }

          if ($methodology.trading_return_estimated -ne $false) {
            throw "Unexpected trading return claim."
          }

          if ($methodology.live_scanner_ready -ne $false) {
            throw "Scanner readiness must remain false."
          }

          if ($methodology.automatic_trading_enabled -ne $false) {
            throw "Automatic trading must remain disabled."
          }

          # --------------------------------------------------------
          # Verify CSV row counts
          # --------------------------------------------------------

          $research = @(
            Import-Csv -LiteralPath $researchPath
          )

          $comparisons = @(
            Import-Csv -LiteralPath $comparisonPath
          )

          if ($research.Count -ne 360) {
            throw "Research CSV row count mismatch."
          }

          if ($comparisons.Count -ne 180) {
            throw "Comparison CSV row count mismatch."
          }

          # --------------------------------------------------------
          # Verify every expected research combination
          # --------------------------------------------------------

          $ruleIds = @(
            "R00_BASELINE"
            "R01_BALANCED"
            "R02_CONSERVATIVE"
            "R03_RISK_BALANCE"
            "R04_STRICT"
          )

          $timeframes = @("h1", "h4", "d1")
          $horizons = @(24, 72, 168)
          $stopLevels = @(5, 10, 15, 20)

          $classifications = @(
            "PATTERN_256_ONLY"
            "BOTH"
          )

          $researchKeys = @{}
          $comparisonKeys = @{}

          foreach ($row in $research) {
            $key = "{0}|{1}|{2}|{3}|{4}" -f `
              $row.rule_id, `
              $row.timeframe, `
              $row.horizon, `
              $row.stop_loss_pct, `
              $row.classification

            if ($researchKeys.ContainsKey($key)) {
              throw "Duplicate research combination: $key"
            }

            $researchKeys[$key] = $true

            if ($row.meets_historical_rule -notin @("0", "1")) {
              throw "Invalid historical rule result."
            }

            if ($row.research_status -ne "DESCRIPTIVE_ONLY") {
              throw "Unexpected research status."
            }

            $hit = [double]::Parse(
              $row.historical_hit_rate_pct,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $stop = [double]::Parse(
              $row.historical_stop_touched_pct,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $margin = [double]::Parse(
              $row.historical_hit_minus_stop_pp,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            if (-not (
              [double]::IsFinite($hit) -and
              [double]::IsFinite($stop) -and
              [double]::IsFinite($margin)
            )) {
              throw "Non-finite research metric."
            }

            if ($hit -lt 0 -or $hit -gt 100) {
              throw "Invalid historical HIT percentage."
            }

            if ($stop -lt 0 -or $stop -gt 100) {
              throw "Invalid historical stop percentage."
            }

            if ([math]::Abs(($hit - $stop) - $margin) -gt 0.00001) {
              throw "Historical margin mismatch."
            }
          }

          foreach ($row in $comparisons) {
            $key = "{0}|{1}|{2}|{3}" -f `
              $row.rule_id, `
              $row.timeframe, `
              $row.horizon, `
              $row.stop_loss_pct

            if ($comparisonKeys.ContainsKey($key)) {
              throw "Duplicate comparison combination: $key"
            }

            $comparisonKeys[$key] = $true

            if ($row.only_meets_rule -notin @("0", "1")) {
              throw "Invalid ONLY rule result."
            }

            if ($row.both_meets_rule -notin @("0", "1")) {
              throw "Invalid BOTH rule result."
            }

            if ($row.interpretation -ne "HISTORICAL_DESCRIPTIVE_ONLY") {
              throw "Unexpected comparison interpretation."
            }

            $onlyHit = [double]::Parse(
              $row.only_hit_rate_pct,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $bothHit = [double]::Parse(
              $row.both_hit_rate_pct,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $hitDiff = [double]::Parse(
              $row.hit_rate_difference_pp,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $onlyStop = [double]::Parse(
              $row.only_stop_touched_pct,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $bothStop = [double]::Parse(
              $row.both_stop_touched_pct,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $stopDiff = [double]::Parse(
              $row.stop_touch_difference_pp,
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            foreach ($value in @(
              $onlyHit, $bothHit, $hitDiff,
              $onlyStop, $bothStop, $stopDiff
            )) {
              if ([double]::IsNaN($value) -or [double]::IsInfinity($value)) {
                throw "Non-finite comparison metric."
              }
            }

            if ([math]::Abs(($bothHit - $onlyHit) - $hitDiff) -gt 0.00001) {
              throw "Comparison HIT difference mismatch."
            }

            if ([math]::Abs(($bothStop - $onlyStop) - $stopDiff) -gt 0.00001) {
              throw "Comparison stop difference mismatch."
            }

            if ($row.both_meets_rule -eq "1" -and $row.only_meets_rule -eq "0") {
              $expectedPreference = "BOTH_ONLY_PASSES"
            }
            elseif ($row.both_meets_rule -eq "0" -and $row.only_meets_rule -eq "1") {
              $expectedPreference = "PATTERN_256_ONLY_PASSES"
            }
            elseif ($row.both_meets_rule -eq "1" -and $row.only_meets_rule -eq "1") {
              $expectedPreference = "BOTH_GROUPS_PASS"
            }
            else {
              $expectedPreference = "NEITHER_GROUP_PASSES"
            }

            if ($row.historical_preference -ne $expectedPreference) {
              throw "Historical preference mismatch."
            }
          }

          foreach ($ruleId in $ruleIds) {
            foreach ($timeframe in $timeframes) {
              foreach ($horizon in $horizons) {
                foreach ($stop in $stopLevels) {
                  $comparisonKey = "{0}|{1}|{2}|{3}" -f `
                    $ruleId, $timeframe, $horizon, $stop

                  if (-not $comparisonKeys.ContainsKey($comparisonKey)) {
                    throw "Missing comparison combination: $comparisonKey"
                  }

                  foreach ($classification in $classifications) {
                    $researchKey = "{0}|{1}|{2}|{3}|{4}" -f `
                      $ruleId, `
                      $timeframe, `
                      $horizon, `
                      $stop, `
                      $classification

                    if (-not $researchKeys.ContainsKey($researchKey)) {
                      throw "Missing research combination: $researchKey"
                    }
                  }
                }
              }
            }
          }

          # --------------------------------------------------------
          # Verify output SHA256
          # --------------------------------------------------------

          $hashChecks = @(
            @{
              Path = $researchPath
              ResultHash = [string]$result.candidate_rule_research_sha256
              ManifestName = "candidate_rule_research.csv"
            }
            @{
              Path = $comparisonPath
              ResultHash = [string]$result.candidate_rule_comparison_sha256
              ManifestName = "candidate_rule_comparison.csv"
            }
            @{
              Path = $resultPath
              ResultHash = $null
              ManifestName = "candidate_rule_result.json"
            }
          )

          foreach ($check in $hashChecks) {
            $actual = (
              Get-FileHash `
                -LiteralPath $check.Path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $property = $manifest.outputs.PSObject.Properties[
              $check.ManifestName
            ]

            if ($null -eq $property) {
              throw "Missing output manifest SHA256: $($check.ManifestName)"
            }

            $manifestHash = [string]$property.Value

            if ($manifestHash -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid output manifest SHA256."
            }

            if ($actual -ne $manifestHash.ToLowerInvariant()) {
              throw "Output manifest SHA256 mismatch: $($check.ManifestName)"
            }

            if ($null -ne $check.ResultHash) {
              $resultHash = [string]$check.ResultHash

              if ($resultHash -notmatch '^[0-9a-fA-F]{64}$') {
                throw "Invalid result SHA256."
              }

              if ($actual -ne $resultHash.ToLowerInvariant()) {
                throw "Output result SHA256 mismatch: $($check.ManifestName)"
              }
            }

            Write-Host "OUTPUT SHA256 PASS: $($check.ManifestName)"
          }

          # --------------------------------------------------------
          # Verify exact upstream input hashes
          # --------------------------------------------------------

          $sourceDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:SOURCE_REPORT

          foreach ($filename in @(
            "risk_adjusted_groups.csv"
            "risk_adjusted_comparison.csv"
            "risk_adjusted_result.json"
            "risk_adjusted_manifest.json"
          )) {
            $path = Join-Path $sourceDir $filename

            $actual = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $resultProperty = $result.input_sha256.PSObject.Properties[
              $filename
            ]

            $manifestProperty = $manifest.inputs.PSObject.Properties[
              $filename
            ]

            if ($null -eq $resultProperty -or $null -eq $manifestProperty) {
              throw "Missing recorded input hash: $filename"
            }

            $resultHash = [string]$resultProperty.Value
            $manifestHash = [string]$manifestProperty.Value

            if ($actual -ne $resultHash.ToLowerInvariant()) {
              throw "Result input SHA256 mismatch: $filename"
            }

            if ($actual -ne $manifestHash.ToLowerInvariant()) {
              throw "Manifest input SHA256 mismatch: $filename"
            }

            Write-Host "INPUT SHA256 PASS: $filename"
          }

          "output_dir=$outputDir" >> $env:GITHUB_OUTPUT

          Write-Host "Candidate rules production output verification PASS"

      # ============================================================
      # 07. Verify production inputs unchanged
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $hashPath = "${{ steps.production_hashes.outputs.hash_path }}"

          if ([string]::IsNullOrWhiteSpace($hashPath)) {
            throw "Initial production input hash snapshot unavailable."
          }

          if (-not (Test-Path -LiteralPath $hashPath -PathType Leaf)) {
            throw "Initial production input hash file missing."
          }

          $expected = Get-Content `
            -LiteralPath $hashPath `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json

          $sourceDir = Join-Path `
            $env:PRODUCTION_ROOT `
            $env:SOURCE_REPORT

          foreach ($property in $expected.PSObject.Properties) {
            $filename = $property.Name
            $expectedHash = [string]$property.Value

            $path = Join-Path $sourceDir $filename

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $filename"
            }

            $actualHash = (
              Get-FileHash `
                -LiteralPath $path `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Production input changed: $filename"
            }

            Write-Host "UNCHANGED PASS: $filename"
          }

          Write-Host "All production inputs unchanged PASS"

      # ============================================================
      # 08. Upload production reports
      # ============================================================

      - name: Upload candidate rules production reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-candidate-rules-production
          path: |
            ${{ steps.verify_outputs.outputs.output_dir }}/candidate_rule_research.csv
            ${{ steps.verify_outputs.outputs.output_dir }}/candidate_rule_comparison.csv
            ${{ steps.verify_outputs.outputs.output_dir }}/candidate_rule_result.json
            ${{ steps.verify_outputs.outputs.output_dir }}/candidate_rule_manifest.json
          if-no-files-found: error
          retention-days: 30
