
name: analyze_pattern_256_accumulation_entry_risk.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-accumulation-entry-risk-production
  cancel-in-progress: false

jobs:
  entry-risk-production:
    name: Entry Risk Analysis Production

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      PRODUCTION_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      PROGRAM_NAME: analyze_pattern_256_accumulation_entry_risk.py
      EXPECTED_VERSION: Clean V002

    steps:

      # ============================================================
      # 01. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      # ============================================================
      # 02. Verify Python program
      # ============================================================

      - name: Verify Python program
        run: |
          $ErrorActionPreference = "Stop"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable."
          }

          $program = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Entry risk program missing: $program"
          }

          py -m py_compile $program

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed."
          }

          $source = Get-Content `
            -LiteralPath $program `
            -Raw -Encoding UTF8

          if ($source -notmatch 'VERSION\s*=\s*"Clean V002"') {
            throw "Expected Clean V002 Python source."
          }

          Write-Host "Python verification PASS"

      # ============================================================
      # 03. Verify production inputs
      # ============================================================

      - name: Verify production inputs
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Production root missing: $root"
          }

          $requiredFiles = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"
          )

          $optionalFiles = @(
            "data\reports\pattern_256_accumulation_fair\fair_comparison.csv"
            "data\reports\pattern_256_accumulation_fair\fair_result.json"
          )

          foreach ($relative in $requiredFiles) {
            $path = Join-Path $root $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required production input missing: $path"
            }

            Write-Host "FOUND: $relative"
          }

          $optionalCount = @(
            $optionalFiles | Where-Object {
              Test-Path `
                -LiteralPath (Join-Path $root $_) `
                -PathType Leaf
            }
          ).Count

          if ($optionalCount -eq 1) {
            throw "Optional fair comparison input set is incomplete."
          }

          $validationPath = Join-Path $root `
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"

          $validation = Get-Content `
            -LiteralPath $validationPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($validation.status -ne "PASS") {
            throw "Validation result status is not PASS."
          }

          if ($optionalCount -eq 2) {
            $fairPath = Join-Path $root `
              "data\reports\pattern_256_accumulation_fair\fair_result.json"

            $fair = Get-Content `
              -LiteralPath $fairPath `
              -Raw -Encoding UTF8 | ConvertFrom-Json

            if ($fair.status -ne "PASS") {
              throw "Fair comparison result status is not PASS."
            }
          }

          Write-Host "Production input verification PASS"

      # ============================================================
      # 04. Capture production input SHA256
      # ============================================================

      - name: Capture production input SHA256
        id: hashes
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:PRODUCTION_ROOT

          $files = @(
            "data\reports\pattern_256_accumulation_30pct\validation_detail.csv"
            "data\reports\pattern_256_accumulation_30pct\validation_result.json"
          )

          $optionalFiles = @(
            "data\reports\pattern_256_accumulation_fair\fair_comparison.csv"
            "data\reports\pattern_256_accumulation_fair\fair_result.json"
          )

          $optionalCount = @(
            $optionalFiles | Where-Object {
              Test-Path `
                -LiteralPath (Join-Path $root $_) `
                -PathType Leaf
            }
          ).Count

          if ($optionalCount -eq 1) {
            throw "Optional input set incomplete."
          }

          if ($optionalCount -eq 2) {
            $files += $optionalFiles
          }

          $hashes = @{}

          foreach ($relative in $files) {
            $path = Join-Path $root $relative

            $hash = (Get-FileHash `
              -LiteralPath $path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            $hashes[$relative] = $hash

            Write-Host "SHA256: $relative = $hash"
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP `
            "entry_risk_production_hashes_${{ github.run_id }}_${{ github.run_attempt }}.json"

          if (Test-Path -LiteralPath $manifestPath) {
            throw "Input hash manifest already exists. Refusing overwrite."
          }

          $hashes |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath $manifestPath `
              -Encoding UTF8

          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT

          Write-Host "Production input SHA256 capture PASS"

      # ============================================================
      # 05. Stage program in production root
      # ============================================================

      - name: Stage entry risk program
        id: stage
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROGRAM_NAME

          $stagedName = ".entry_risk_runner_${{ github.run_id }}_${{ github.run_attempt }}.py"

          $staged = Join-Path `
            $env:PRODUCTION_ROOT `
            $stagedName

          if (Test-Path -LiteralPath $staged) {
            throw "Staged program already exists. Refusing overwrite."
          }

          Copy-Item `
            -LiteralPath $source `
            -Destination $staged

          $sourceHash = (Get-FileHash `
            -LiteralPath $source `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          $stagedHash = (Get-FileHash `
            -LiteralPath $staged `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($sourceHash -ne $stagedHash) {
            throw "Staged program SHA256 mismatch."
          }

          "staged_program=$staged" >> $env:GITHUB_OUTPUT
          "program_sha256=$sourceHash" >> $env:GITHUB_OUTPUT

          Write-Host "Staged program verification PASS"

      # ============================================================
      # 06. Execute production analysis
      # ============================================================

      - name: Execute entry risk production
        run: |
          $ErrorActionPreference = "Stop"

          $program = "${{ steps.stage.outputs.staged_program }}"

          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
            throw "Staged program missing."
          }

          Set-Location $env:PRODUCTION_ROOT

          Write-Host "========================================"
          Write-Host "Entry Risk Analysis Production"
          Write-Host "========================================"

          py $program

          if ($LASTEXITCODE -ne 0) {
            throw "Entry risk production execution failed."
          }

          Write-Host "Entry risk production execution PASS"

      # ============================================================
      # 07. Verify production outputs
      # ============================================================

      - name: Verify entry risk production outputs
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path $env:PRODUCTION_ROOT `
            "data\reports\pattern_256_accumulation_entry_risk"

          $summary = Join-Path `
            $outputDir "entry_risk_summary.csv"

          $stops = Join-Path `
            $outputDir "entry_risk_stop_scenarios.csv"

          $resultPath = Join-Path `
            $outputDir "entry_risk_result.json"

          $manifestPath = Join-Path `
            $outputDir "entry_risk_manifest.json"

          foreach ($path in @(
            $summary,
            $stops,
            $resultPath,
            $manifestPath
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required output missing: $path"
            }

            Write-Host "FOUND: $path"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($result.status -ne "PASS") {
            throw "Entry risk result is not PASS."
          }

          if ($result.program -ne $env:PROGRAM_NAME) {
            throw "Unexpected entry risk program."
          }

          if ($result.version -ne $env:EXPECTED_VERSION) {
            throw "Unexpected entry risk version."
          }

          if ([int64]$result.source_rows -ne 7949826) {
            throw "Unexpected source row count."
          }

          if ([int64]$result.included_rows -ne 7949826) {
            throw "Unexpected included row count."
          }

          if ([int64]$result.complete_rows -ne 7932620) {
            throw "Unexpected complete row count."
          }

          if ([int64]$result.hit_rows -ne 313694) {
            throw "Unexpected HIT row count."
          }

          if ([int64]$result.early_hit_rows -ne 2779) {
            throw "Unexpected early HIT row count."
          }

          if ([int]$result.summary_rows -ne 18) {
            throw "Expected 18 summary rows."
          }

          if ([int]$result.stop_scenario_rows -ne 72) {
            throw "Expected 72 stop scenario rows."
          }

          if ($manifest.program -ne $result.program) {
            throw "Manifest program mismatch."
          }

          if ($manifest.version -ne $result.version) {
            throw "Manifest version mismatch."
          }

          $checks = @(
            @{
              Path = $summary
              ResultHash = [string]$result.entry_risk_summary_sha256
              ManifestHash = [string]$manifest.outputs.'entry_risk_summary.csv'
            },
            @{
              Path = $stops
              ResultHash = [string]$result.entry_risk_stop_scenarios_sha256
              ManifestHash = [string]$manifest.outputs.'entry_risk_stop_scenarios.csv'
            }
          )

          foreach ($check in $checks) {
            $actual = (Get-FileHash `
              -LiteralPath $check.Path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $check.ResultHash.ToLowerInvariant()) {
              throw "Result SHA256 mismatch: $($check.Path)"
            }

            if ($actual -ne $check.ManifestHash.ToLowerInvariant()) {
              throw "Manifest SHA256 mismatch: $($check.Path)"
            }

            Write-Host "SHA256 PASS: $($check.Path)"
          }

          $summaryRows = @(
            Import-Csv -LiteralPath $summary
          )

          $stopRows = @(
            Import-Csv -LiteralPath $stops
          )

          if ($summaryRows.Count -ne 18) {
            throw "Summary CSV row count mismatch."
          }

          if ($stopRows.Count -ne 72) {
            throw "Stop scenario CSV row count mismatch."
          }

          $included = [int64]0
          $complete = [int64]0
          $hits = [int64]0

          foreach ($row in $summaryRows) {
            $included += [int64]$row.total_rows
            $complete += [int64]$row.complete_rows
            $hits += [int64]$row.hit_count
          }

          if ($included -ne [int64]$result.included_rows) {
            throw "Included row count mismatch."
          }

          if ($complete -ne [int64]$result.complete_rows) {
            throw "Complete row count mismatch."
          }

          if ($hits -ne [int64]$result.hit_rows) {
            throw "HIT count mismatch."
          }

          Write-Host "========================================"
          Write-Host "Entry Risk Production Summary"
          Write-Host "========================================"

          Write-Host "Source rows: $($result.source_rows)"
          Write-Host "Included rows: $($result.included_rows)"
          Write-Host "Complete rows: $($result.complete_rows)"
          Write-Host "HIT rows: $($result.hit_rows)"
          Write-Host "Early HIT rows: $($result.early_hit_rows)"
          Write-Host "Summary rows: $($result.summary_rows)"
          Write-Host "Stop scenario rows: $($result.stop_scenario_rows)"
          Write-Host "Elapsed seconds: $($result.elapsed_seconds)"

          Write-Host "Entry risk production output verification PASS"

      # ============================================================
      # 08. Verify upstream files unchanged
      # ============================================================

      - name: Verify production inputs unchanged
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = "${{ steps.hashes.outputs.manifest_path }}"

          if (
            -not $manifestPath -or
            -not (Test-Path -LiteralPath $manifestPath -PathType Leaf)
          ) {
            Write-Host "Initial SHA256 manifest unavailable."
            exit 0
          }

          $expected = Get-Content `
            -LiteralPath $manifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($property in $expected.PSObject.Properties) {
            $relative = $property.Name
            $expectedHash = [string]$property.Value

            $path = Join-Path `
              $env:PRODUCTION_ROOT `
              $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Production input disappeared: $relative"
            }

            $actual = (Get-FileHash `
              -LiteralPath $path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $expectedHash.ToLowerInvariant()) {
              throw "Production input changed: $relative"
            }

            Write-Host "UNCHANGED PASS: $relative"
          }

          Write-Host "All production inputs unchanged PASS"

      # ============================================================
      # 09. Remove this run's staged program
      # ============================================================

      - name: Remove temporary staged program
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $program = "${{ steps.stage.outputs.staged_program }}"
          $expectedHash = "${{ steps.stage.outputs.program_sha256 }}"

          if (-not $program -or -not $expectedHash) {
            Write-Host "No verified staged program to remove."
            exit 0
          }

          $expectedName = ".entry_risk_runner_${{ github.run_id }}_${{ github.run_attempt }}.py"

          $expectedPath = Join-Path `
            $env:PRODUCTION_ROOT `
            $expectedName

          if ($program -ne $expectedPath) {
            throw "Unexpected staged program path. Refusing removal."
          }

          if (Test-Path -LiteralPath $program -PathType Leaf) {
            $actualHash = (Get-FileHash `
              -LiteralPath $program `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Staged program changed. Refusing removal."
            }

            Remove-Item -LiteralPath $program -Force

            Write-Host "Temporary staged program removed."
          }

      # ============================================================
      # 10. Upload production reports
      # ============================================================

      - name: Upload entry risk production reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-accumulation-entry-risk-production
          path: |
            C:/Users/USER/Documents/upbit-surge-monitor/data/reports/pattern_256_accumulation_entry_risk/entry_risk_summary.csv
            C:/Users/USER/Documents/upbit-surge-monitor/data/reports/pattern_256_accumulation_entry_risk/entry_risk_stop_scenarios.csv
            C:/Users/USER/Documents/upbit-surge-monitor/data/reports/pattern_256_accumulation_entry_risk/entry_risk_result.json
            C:/Users/USER/Documents/upbit-surge-monitor/data/reports/pattern_256_accumulation_entry_risk/entry_risk_manifest.json
          if-no-files-found: error
          retention-days: 14
