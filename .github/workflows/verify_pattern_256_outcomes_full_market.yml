
name: verify_pattern_256_outcomes_full_market.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-outcome-verification
  cancel-in-progress: false

jobs:
  verify-outcomes:
    name: verify-outcomes
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: powershell

    env:
      RESEARCH_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'
      REPORT_FOLDER: 'data\reports\pattern_256_outcomes_full_market'
      PYTHON_FILE: 'verify_pattern_256_outcomes_full_market.py'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        id: environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Environment ==="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Research root: $env:RESEARCH_ROOT"

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_FILE

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Python verification script missing: $script"
          }

          if (-not (Test-Path -LiteralPath $env:RESEARCH_ROOT -PathType Container)) {
            throw "Research root missing: $env:RESEARCH_ROOT"
          }

          foreach ($tf in @("h1", "h4", "d1")) {
            $ohlcv = Join-Path $env:RESEARCH_ROOT "data\ohlcv\$tf"
            $checkpoint = Join-Path $env:RESEARCH_ROOT "data\reports\pattern_256_accumulation_30pct\checkpoints\$tf"

            if (-not (Test-Path -LiteralPath $ohlcv -PathType Container)) {
              throw "OHLCV folder missing: $ohlcv"
            }

            if (-not (Test-Path -LiteralPath $checkpoint -PathType Container)) {
              throw "Checkpoint folder missing: $checkpoint"
            }

            $files = @(Get-ChildItem -LiteralPath $checkpoint -Filter "KRW-*.csv" -File)

            if ($files.Count -eq 0) {
              throw "No checkpoint CSV files: $checkpoint"
            }

            Write-Host "$tf checkpoint files: $($files.Count)"
          }

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python launcher unavailable"
          }

          Write-Host "Environment verification PASS"

      - name: Execute independent verification
        id: audit
        if: steps.environment.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE $env:PYTHON_FILE
          $report = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER

          New-Item -ItemType Directory -Force -Path $report | Out-Null

          Write-Host "=== Starting independent verification ==="
          Write-Host "Script: $script"
          Write-Host "Root: $env:RESEARCH_ROOT"

          & py -u $script --root $env:RESEARCH_ROOT

          $exitCode = $LASTEXITCODE

          Write-Host "Python exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Independent verification failed with exit code $exitCode"
          }

          Write-Host "Python execution PASS"

      - name: Verify reports and SHA256
        id: integrity
        if: steps.audit.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $report = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER

          $resultPath = Join-Path $report "outcome_verification_result.json"
          $detailPath = Join-Path $report "outcome_verification_detail.csv"
          $manifestPath = Join-Path $report "outcome_verification_manifest.json"

          foreach ($path in @($resultPath, $detailPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required report missing: $path"
            }
          }

          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 |
            ConvertFrom-Json

          Write-Host "=== Result metadata ==="
          Write-Host "Audit: $($result.audit)"
          Write-Host "Python version: $($result.version)"
          Write-Host "Execution: $($result.execution)"
          Write-Host "Classification: $($result.classification)"
          Write-Host "Research decision: $($result.research_decision)"

          $allowedVersions = @("Clean V002")

          if ($result.version -notin $allowedVersions) {
            throw "Unexpected Python audit version: $($result.version)"
          }

          if ($manifest.version -ne $result.version) {
            throw "Result and manifest version mismatch"
          }

          if ($result.audit -ne "pattern_256_outcomes_full_market") {
            throw "Unexpected audit identifier"
          }

          if ($manifest.audit -ne $result.audit) {
            throw "Manifest audit identifier mismatch"
          }

          if ($result.execution -ne "PASS") {
            throw "Python audit execution is not PASS"
          }

          if ($result.classification -notin @("PASS", "REVIEW")) {
            throw "Invalid audit classification"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.train_approved -ne $false) {
            throw "Unexpected training approval"
          }

          if ($result.live_trading_approved -ne $false) {
            throw "Unexpected live trading approval"
          }

          $filesDiscovered = [long]$result.files_discovered
          $filesProcessed = [long]$result.files_processed
          $rowsChecked = [long]$result.rows_checked

          if ($filesDiscovered -le 0) {
            throw "No source files discovered"
          }

          if ($filesProcessed -ne $filesDiscovered) {
            throw "File processing count mismatch"
          }

          if ($rowsChecked -le 0) {
            throw "No rows verified"
          }

          if (@($result.errors).Count -ne 0) {
            throw "Audit contains processing errors"
          }

          $classificationTotal = [long]0

          foreach ($property in $result.classification_counts.PSObject.Properties) {
            $classificationTotal += [long]$property.Value
          }

          if ($classificationTotal -ne $rowsChecked) {
            throw "Classification row count mismatch"
          }

          Write-Host "=== SHA256 verification ==="

          $requiredOutputs = @(
            "outcome_verification_result.json",
            "outcome_verification_detail.csv"
          )

          foreach ($name in $requiredOutputs) {
            $property = $manifest.outputs.PSObject.Properties[$name]

            if ($null -eq $property) {
              throw "Manifest output hash missing: $name"
            }

            $expected = [string]$property.Value
            $path = Join-Path $report $name

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          Write-Host "=== Detail CSV row verification ==="

          $detailRows = [long]0

          $reader = [System.IO.File]::OpenText($detailPath)

          try {
            $header = $reader.ReadLine()

            if ([string]::IsNullOrWhiteSpace($header)) {
              throw "Detail CSV header missing"
            }

            while ($null -ne $reader.ReadLine()) {
              $detailRows++
            }
          }
          finally {
            $reader.Dispose()
          }

          if ($detailRows -ne $rowsChecked) {
            throw "Detail CSV row count mismatch: expected $rowsChecked, actual $detailRows"
          }

          Write-Host "Files verified: $filesProcessed"
          Write-Host "Rows verified: $rowsChecked"
          Write-Host "Classification: $($result.classification)"
          Write-Host "SHA256 and report integrity PASS"

      - name: Publish summary
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $report = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER
          $resultPath = Join-Path $report "outcome_verification_result.json"

          $lines = @(
            "## Pattern 256 Full-Market Outcome Verification",
            "",
            "| Check | Result |",
            "|---|---|",
            "| Workflow | Clean V003 |",
            "| Environment | ${{ steps.environment.outcome }} |",
            "| Python execution | ${{ steps.audit.outcome }} |",
            "| Report integrity | ${{ steps.integrity.outcome }} |"
          )

          if (Test-Path -LiteralPath $resultPath -PathType Leaf) {
            try {
              $r = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 |
                ConvertFrom-Json

              $lines += "| Python version | $($r.version) |"
              $lines += "| Audit execution | $($r.execution) |"
              $lines += "| Classification | $($r.classification) |"
              $lines += "| Files processed | $($r.files_processed) |"
              $lines += "| Rows checked | $($r.rows_checked) |"
            }
            catch {
              $lines += "| Report reading | FAILED |"
            }
          }

          $lines += "| Research decision | HOLD |"
          $lines += ""
          $lines += "This audit does not prove independent OOS performance or profitability."
          $lines += ""
          $lines += "Training and live trading remain unapproved."

          $lines | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Stage reports
        id: staging
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $report = Join-Path $env:RESEARCH_ROOT $env:REPORT_FOLDER
          $stage = Join-Path $env:RUNNER_TEMP "pattern_256_outcomes_verified"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $names = @(
            "outcome_verification_result.json",
            "outcome_verification_detail.csv",
            "outcome_verification_manifest.json"
          )

          foreach ($name in $names) {
            $source = Join-Path $report $name
            $destination = Join-Path $stage $name

            Copy-Item `
              -LiteralPath $source `
              -Destination $destination `
              -Force `
              -ErrorAction Stop

            $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $destinationHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash

            if ($sourceHash -ne $destinationHash) {
              throw "Staging SHA256 mismatch: $name"
            }

            Write-Host "[STAGED] $name"
          }

          Write-Host "Diagnostic staging PASS"

      - name: Upload reports
        id: upload
        if: steps.staging.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-outcomes-full-market-${{ github.run_number }}
          path: ${{ runner.temp }}/pattern_256_outcomes_verified/
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Environment: ${{ steps.environment.outcome }}"
          Write-Host "Python audit: ${{ steps.audit.outcome }}"
          Write-Host "Integrity: ${{ steps.integrity.outcome }}"
          Write-Host "Staging: ${{ steps.staging.outcome }}"
          Write-Host "Upload: ${{ steps.upload.outcome }}"

          $results = @(
            "${{ steps.environment.outcome }}",
            "${{ steps.audit.outcome }}",
            "${{ steps.integrity.outcome }}",
            "${{ steps.staging.outcome }}",
            "${{ steps.upload.outcome }}"
          )

          if ($results -contains "failure") {
            throw "Full-market outcome verification workflow failed"
          }

          if ($results -contains "skipped") {
            throw "Required verification step was skipped"
          }

          if ($results -contains "cancelled") {
            throw "Verification step was cancelled"
          }

          Write-Host "WORKFLOW PASS"
          Write-Host "RESEARCH DECISION: HOLD"
