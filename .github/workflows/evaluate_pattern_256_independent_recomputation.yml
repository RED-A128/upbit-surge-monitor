
name: evaluate_pattern_256_independent_recomputation.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-independent-recomputation
  cancel-in-progress: false

jobs:
  independent-recomputation:
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python and dependencies
        run: |
          py --version
          py -c "import numpy, pandas; print('Dependencies OK')"

      - name: Check audit script
        run: |
          if (-not (Test-Path "audit_256_independent_recomputation.py")) {
            throw "Audit script missing"
          }
          py -m py_compile audit_256_independent_recomputation.py

      - name: Run independent recomputation audit
        run: |
          py audit_256_independent_recomputation.py --root .
          if ($LASTEXITCODE -ne 0) {
            throw "Independent recomputation audit failed"
          }

      - name: Validate audit result
        if: success()
        run: |
          @'
          import json
          from pathlib import Path

          path = Path(
              "data/reports/pattern_256_independent_recomputation/audit_result.json"
          )
          if not path.is_file():
              raise SystemExit("Missing audit_result.json")

          result = json.loads(path.read_text(encoding="utf-8"))

          if result.get("version") != "Clean V003-26":
              raise SystemExit("Unexpected audit version")

          if result.get("status") != "PASS":
              raise SystemExit("Audit status is not PASS")

          if result.get("failed_jobs") != 0:
              raise SystemExit("Failed audit jobs detected")

          if result.get("jobs", 0) <= 0:
              raise SystemExit("No audited jobs")

          if result.get("audited_rows", 0) <= 0:
              raise SystemExit("No audited rows")

          if result.get("approved_for_live_trading") is not False:
              raise SystemExit("Unexpected trading approval")

          print("AUDIT RESULT: PASS")
          print("Jobs:", result["jobs"])
          print("Rows:", result["audited_rows"])
          '@ | py -

          if ($LASTEXITCODE -ne 0) {
            throw "Audit result validation failed"
          }

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-independent-recomputation-v003-26
          path: |
            data/reports/pattern_256_independent_recomputation/audit_result.json
            data/reports/pattern_256_independent_recomputation/audit_summary.csv
          if-no-files-found: warn
          retention-days: 14
