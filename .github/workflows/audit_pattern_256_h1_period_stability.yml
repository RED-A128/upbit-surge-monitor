
name: audit_pattern_256_h1_period_stability.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-h1-period-stability
  cancel-in-progress: false

jobs:
  period-stability:
    name: period-stability
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h1_period_stability.py"

          $inputDir = Join-Path $root `
            "data\reports\pattern_256_h1_paired_robustness"

          if (-not (Test-Path -LiteralPath $root)) {
            throw "Project root missing: $root"
          }

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Audit script missing: $script"
          }

          $required = @(
            "paired_robustness_groups.csv",
            "paired_robustness_result.json",
            "paired_robustness_report.md",
            "paired_robustness_manifest.json"
          )

          foreach ($name in $required) {
            $path = Join-Path $inputDir $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing input: $path"
            }

            Write-Host "[OK] $path"
          }

          py --version

      - name: Execute period stability audit
        id: audit
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_h1_period_stability.py"

          & py -u $script --root $root

          if ($LASTEXITCODE -ne 0) {
            throw "Python audit failed"
          }

      - name: Verify output SHA256
        id: integrity
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $folder = Join-Path $root `
            "data\reports\pattern_256_h1_period_stability"

          $manifestPath = Join-Path $folder `
            "period_stability_manifest.json"

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Output manifest missing"
          }

          $manifest = Get-Content -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          $names = @(
            "period_stability_result.json",
            "period_stability_report.md"
          )

          foreach ($name in $names) {
            $path = Join-Path $folder $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Output missing: $name"
            }

            $expected = $manifest.output_sha256.$name
            $actual = (Get-FileHash -LiteralPath $path `
              -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $name"
            }

            Write-Host "[SHA256 PASS] $name"
          }

          $resultPath = Join-Path $folder `
            "period_stability_result.json"

          $result = Get-Content -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Audit execution is not PASS"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

      - name: Publish summary
        if: steps.integrity.outcome == 'success'
        run: |
          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $folder = Join-Path $root `
            "data\reports\pattern_256_h1_period_stability"

          $result = Get-Content -LiteralPath `
            (Join-Path $folder "period_stability_result.json") `
            -Raw | ConvertFrom-Json

          $lines = @(
            "# Pattern 256 H1 Period Stability Audit",
            "",
            "| Metric | Result |",
            "|---|---|",
            "| Execution | $($result.execution) |",
            "| Classification | $($result.classification) |",
            "| Positive years | $($result.positive_years) |",
            "| Negative years | $($result.negative_years) |",
            "| Latest difference pp | $($result.latest_period_difference_pp) |",
            "| Research decision | $($result.research_decision) |",
            "",
            "Independent OOS and profitability remain unproven."
          )

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 -Append

      - name: Stage verified reports
        if: steps.integrity.outcome == 'success'
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\Users\USER\Documents\upbit-surge-monitor"
          $source = Join-Path $root `
            "data\reports\pattern_256_h1_period_stability"

          $destination = Join-Path $env:GITHUB_WORKSPACE `
            "period_stability_artifact"

          New-Item -ItemType Directory `
            -Path $destination -Force | Out-Null

          $names = @(
            "period_stability_result.json",
            "period_stability_report.md",
            "period_stability_manifest.json"
          )

          foreach ($name in $names) {
            Copy-Item -LiteralPath (Join-Path $source $name) `
              -Destination (Join-Path $destination $name) `
              -ErrorAction Stop
          }

      - name: Upload reports
        if: steps.integrity.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-h1-period-stability
          path: period_stability_artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $audit = "${{ steps.audit.outcome }}"
          $integrity = "${{ steps.integrity.outcome }}"

          if ($audit -ne "success") {
            throw "Audit execution failed"
          }

          if ($integrity -ne "success") {
            throw "Integrity verification failed"
          }

          Write-Host "Period stability audit completed."
          Write-Host "Research decision remains HOLD."
