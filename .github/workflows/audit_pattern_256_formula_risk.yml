name: audit_pattern_256_formula_risk.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-256-formula-risk-audit
  cancel-in-progress: false

jobs:
  formula-risk-audit:
    name: formula-risk-audit

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Research root: $env:DATA_ROOT"
          Write-Host "Runner: $env:RUNNER_NAME"

          py --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python is unavailable"
          }

      - name: Verify audit script
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_formula_risk.py"

          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Audit script missing: $script"
          }

          py -c "import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax verification failed"
          }

          Write-Host "[PASS] Audit script verified"

      - name: Verify persistent research files
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "build_features.py",
            "detect_256.py",
            "data\reports\pattern_256_prefix_replay_full_market\full_market_checks.csv",
            "data\reports\pattern_256_prefix_replay_full_market\full_market_exclusions.csv",
            "data\reports\pattern_256_prefix_replay_full_market\full_market_issues.csv",
            "data\reports\pattern_256_prefix_replay_full_market\full_market_result.json",
            "data\reports\pattern_256_prefix_replay_full_market\full_market_manifest.json"
          )

          foreach ($relativePath in $required) {
            $path = Join-Path $env:DATA_ROOT $relativePath

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required file missing: $path"
            }

            Write-Host "[PASS] $relativePath"
          }

      - name: Execute formula-risk audit
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "audit_pattern_256_formula_risk.py"

          & py -u $script --root $env:DATA_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Formula-risk audit execution failed"
          }

      - name: Verify output integrity
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Audit execution did not succeed"
          }

          $report = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_formula_risk"

          $resultPath = Join-Path `
            $report `
            "formula_risk_result.json"

          $manifestPath = Join-Path `
            $report `
            "formula_risk_manifest.json"

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "Result JSON missing"
          }

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Manifest JSON missing"
          }

          $result = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Audit execution is not PASS"
          }

          if ($result.replay_evidence_verified -ne $true) {
            throw "Replay evidence not verified"
          }

          if ($result.source_sha256_verified -ne $true) {
            throw "Source SHA256 not verified"
          }

          if ($result.static_review_complete -ne $true) {
            throw "Static review incomplete"
          }

          if ($result.manual_review_required -ne $true) {
            throw "Manual review requirement missing"
          }

          if ($result.research_decision -ne "HOLD") {
            throw "Unexpected research decision"
          }

          if ($result.train_approved -ne $false) {
            throw "Unexpected TRAIN approval"
          }

          if ($result.live_trading_approved -ne $false) {
            throw "Unexpected trading approval"
          }

          if ($manifest.execution -ne "PASS") {
            throw "Manifest execution is not PASS"
          }

          $hashes = $manifest.output_sha256

          foreach ($property in $hashes.PSObject.Properties) {
            $fileName = $property.Name

            $expected = [string]$property.Value

            $filePath = Join-Path $report $fileName

            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "Missing output: $fileName"
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $filePath `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA256 mismatch: $fileName"
            }

            Write-Host "[SHA256 PASS] $fileName"
          }

          Write-Host "Formula-risk output integrity PASS"

      - name: Publish summary
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $resultPath = Join-Path `
            $env:DATA_ROOT `
            "data\reports\pattern_256_formula_risk\formula_risk_result.json"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            "## Formula Risk Audit - FAILED" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8

            exit 0
          }

          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            "## Formula Risk Audit - NO RESULT" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8

            exit 0
          }

          $r = Get-Content `
            -LiteralPath $resultPath `
            -Raw | ConvertFrom-Json

          @"
          ## Pattern 256 Formula Risk Audit

          | Check | Result |
          |---|---|
          | Version | $($r.version) |
          | Execution | $($r.execution) |
          | Previous replay verified | $($r.replay_evidence_verified) |
          | Source SHA256 verified | $($r.source_sha256_verified) |
          | High-risk patterns | $($r.high_risk_items) |
          | Review items | $($r.review_items) |
          | Total findings | $($r.total_risk_items) |
          | Manual review required | $($r.manual_review_required) |
          | Formula leakage-free proven | $($r.upstream_signal_formula_leakage_free_proven) |
          | Research decision | $($r.research_decision) |
          | TRAIN approved | $($r.train_approved) |
          | Live trading approved | $($r.live_trading_approved) |

          **Important:** PASS means the audit executed successfully.
          It does not mean the calculation formulas are leakage-free.
          Every finding requires contextual review.
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-256-formula-risk-audit
          path: |
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_formula_risk\formula_risks.csv
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_formula_risk\formula_risk_result.json
            C:\Users\USER\Documents\upbit-surge-monitor\data\reports\pattern_256_formula_risk\formula_risk_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          $ErrorActionPreference = "Stop"

          $audit = "${{ steps.audit.outcome }}"
          $verify = "${{ steps.verify.outcome }}"

          Write-Host "Audit outcome: $audit"
          Write-Host "Verification outcome: $verify"

          if ($audit -ne "success") {
            throw "Formula-risk audit failed"
          }

          if ($verify -ne "success") {
            throw "Formula-risk verification failed"
          }

          Write-Host "FORMULA RISK AUDIT EXECUTION PASS"
          Write-Host "RESEARCH DECISION: HOLD"
