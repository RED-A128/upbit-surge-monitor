
name: audit_pattern_256_horizon_semantics.yml

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern256-horizon-semantics
  cancel-in-progress: false

jobs:
  horizon-semantics:
    name: horizon-semantics

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      DATA_ROOT: 'C:\Users\USER\Documents\upbit-surge-monitor'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_horizon_semantics.py"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Audit script missing"
          }

          $inputs = @(
            "data\reports\pattern_256_event_gap_integrity\gap_integrity_events.csv",
            "data\reports\pattern_256_accumulation_independent\independent_detail.csv"
          )

          foreach ($relative in $inputs) {
            $path = Join-Path $env:DATA_ROOT $relative

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing input: $path"
            }
          }

          & py -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Python syntax check failed"
          }

      - name: Prepare isolated output
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "pattern256_horizon_${env:GITHUB_RUN_ID}_${env:GITHUB_RUN_ATTEMPT}"

          $output = Join-Path $env:RUNNER_TEMP $folder

          if (Test-Path -LiteralPath $output) {
            throw "Output already exists"
          }

          "HORIZON_OUTPUT=$output" |
            Out-File $env:GITHUB_ENV `
              -Append -Encoding utf8

      - name: Execute horizon audit
        id: audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_horizon_semantics.py"

          & py -u $script `
            --root $env:DATA_ROOT `
            --output $env:HORIZON_OUTPUT `
            --sample-per-group 100

          if ($LASTEXITCODE -ne 0) {
            throw "Horizon audit failed"
          }

      - name: Verify output SHA256
        id: verify
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Audit did not succeed"
          }

          $out = $env:HORIZON_OUTPUT

          $resultPath = Join-Path $out `
            "horizon_result.json"

          $manifestPath = Join-Path $out `
            "horizon_manifest.json"

          $result = Get-Content $resultPath `
            -Raw | ConvertFrom-Json

          $manifest = Get-Content $manifestPath `
            -Raw | ConvertFrom-Json

          if ($result.execution -ne "PASS") {
            throw "Result execution mismatch"
          }

          if ($manifest.execution -ne "PASS") {
            throw "Manifest execution mismatch"
          }

          if ($result.version -ne "Clean V001") {
            throw "Version mismatch"
          }

          if ($result.research_decision -ne "HOLD" -or
              $result.train_approved -ne $false -or
              $result.live_trading_approved -ne $false -or
              $result.outcome_replay_performed -ne $false) {
            throw "Research safety gate failed"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE `
            "audit_pattern_256_horizon_semantics.py"

          $actualScript = (
            Get-FileHash $script -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actualScript -ne (
            [string]$manifest.script_sha256
          ).ToLowerInvariant()) {
            throw "Script SHA256 mismatch"
          }

          $outputs = @(
            "horizon_result.json",
            "horizon_samples.csv"
          )

          foreach ($name in $outputs) {
            $path = Join-Path $out $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing output: $name"
            }

            $actual = (
              Get-FileHash $path -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $expected = (
              [string]$manifest.output_sha256.$name
            ).ToLowerInvariant()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $name"
            }
          }

          Write-Host "[PASS] SHA256 verification"

      - name: Publish summary
        if: always()
        run: |
          $execution = "${{ steps.audit.outcome }}"
          $verification = "${{ steps.verify.outcome }}"

          @"
          ## Pattern 256 Horizon Semantics

          | Check | Result |
          |---|---|
          | Version | Clean V001 |
          | Execution | $execution |
          | SHA256 verification | $verification |
          | Research decision | HOLD |

          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          if ($execution -ne "success" -or
              $verification -ne "success") {
            exit 0
          }

          $path = Join-Path $env:HORIZON_OUTPUT `
            "horizon_result.json"

          $result = Get-Content $path `
            -Raw | ConvertFrom-Json

          @"
          ### Event inspection

          | Check | Count |
          |---|---:|
          | Valid events | $($result.valid_events) |
          | Invalid events | $($result.invalid_events) |
          | Balanced sample rows | $($result.sampled_events) |

          ### Horizon diagnostics

          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          foreach ($row in $result.diagnostics) {
            $line = "- $($row.source) / $($row.timeframe) / $($row.diagnostic): $($row.count)"

            $line | Out-File $env:GITHUB_STEP_SUMMARY `
              -Append -Encoding utf8
          }

          @"

          Horizon units are not independently proven.
          No OHLCV price replay was performed.
          Research decision: HOLD.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern256-horizon-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pattern256_horizon_${{ github.run_id }}_${{ github.run_attempt }}/horizon_result.json
            ${{ runner.temp }}/pattern256_horizon_${{ github.run_id }}_${{ github.run_attempt }}/horizon_samples.csv
            ${{ runner.temp }}/pattern256_horizon_${{ github.run_id }}_${{ github.run_attempt }}/horizon_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Final status gate
        if: always()
        run: |
          if ("${{ steps.audit.outcome }}" -ne "success") {
            throw "Horizon audit failed"
          }

          if ("${{ steps.verify.outcome }}" -ne "success") {
            throw "Horizon verification failed"
          }

          Write-Host "[PASS] Horizon semantics audit"
          Write-Host "Research decision: HOLD"
